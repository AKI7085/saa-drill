I キーを含めるよう実装を変更する。","リージョン API を作成し、AWS WAF のウェブ ACL を関連付ける。VPC の NAT ゲートウェイの Elastic IP アドレスだけを許可する IP セットのルールを設定し、それ以外のリクエストはすべてブロックする。","プライベート API を作成し、API Gateway 用のインターフェイス型 VPC エンドポイントを作成する。リソースポリシーで aws:SourceVpce 条件を使い、そのエンドポイントからの呼び出しだけを許可する。","エッジ最適化 API を作成し、IAM 認証を有効にする。VPC 内の EC2 インスタンスのロールにだけ execute-api:Invoke を許可し、ほかのプリンシパルからの呼び出しは許可しないようにして運用する。"],"answer":[2],"why":["API キーはアクセスの識別と制限用で、認証の仕組みではない。リージョン API のエンドポイントはインターネットから到達できる状態のままで、要件を満たさない。","WAF で接続元を制限できても、エンドポイントはインターネットに公開されたままで、通信もインターネットを経由する。インターネットから到達できないという要件に反する。","プライベート API は、VPC エンドポイント経由でしか呼び出せず、インターネットからは到達できない。リソースポリシーで、許可する VPC エンドポイントを絞れる。","IAM 認証で呼び出せる主体は限定できるが、エンドポイントはインターネットから到達できる状態のままになる。エッジ最適化 API は CloudFront 経由で公開される。"],"explain":"「インターネットから到達できない」「特定の VPC からだけ」の 2 点から、API Gateway のプライベート API を選ぶ。プライベート API は、execute-api のインターフェイス型 VPC エンドポイント経由でのみ呼び出せる。リソースポリシーの aws:SourceVpce や aws:SourceVpc 条件で、許可する VPC やエンドポイントを制御できる。認証や IP 制限だけでは、エンドポイントを非公開にはできない。","point":"VPC 内からだけ呼べる API は、プライベート API ＋ execute-api のインターフェイス型エンドポイント＋リソースポリシー（aws:SourceVpce）。","diagram":{"caption":"正解の構成: VPC エンドポイント経由でプライベート API を呼び出す","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"アプリケーション","sub":"EC2","kind":"compute","c":0,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"execute-api","kind":"network","c":1,"r":0},{"id":"api","label":"プライベート API","sub":"リソースポリシー","kind":"network","c":2,"r":0},{"id":"fn","label":"Lambda","sub":"バックエンド","kind":"serverless","c":3,"r":0}],"edges":[{"from":"ec2","to":"vpce"},{"from":"vpce","to":"api","label":"SourceVpce"},{"from":"api","to":"fn"}]}},{"id":"d2-01","domain":2,"topic":"SQS・SNS","type":"multi","stem":"ある動画共有サービスは、アップロードされた動画のサムネイルを生成するために、Amazon SQS 標準キューと、Auto Scaling グループ内の Amazon EC2 インスタンスで実行されるワーカーを使用しています。1 件の処理には最大 4 分かかりますが、キューの可視性タイムアウトは既定値の 30 秒のままです。最近、同じ動画のサムネイルが複数のワーカーで重複して生成されています。また、破損した動画のメッセージが処理に失敗し続けてキューに残り、ワーカーの処理能力を浪費しています。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて両方の問題を解決する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["キューを FIFO キューとして作り直し、送信時のコンテンツベースの重複排除を有効にする。","キューの可視性タイムアウトを、1 件あたりの最大処理時間を上回る値に変更する。","キューのメッセージ受信待機時間を最大の 20 秒に設定し、ロングポーリングを有効にする。","デッドレターキューを作成し、リドライブポリシーで maxReceiveCount を 3 に設定する。","キューの配信遅延を 4 分に設定し、メッセージが受信可能になるまでの時間を延ばす。"],"answer":[1,3],"why":["FIFO キューの重複排除は、5 分間の重複排除間隔の中で同じメッセージが重複して送信されるのを防ぐ機能である。処理中に可視性タイムアウトが切れて再び受信される問題は解決せず、キューの作り直しやメッセージグループ ID の指定などアプリケーションの変更も必要になる。","受信されたメッセージは、可視性タイムアウトの間だけ他のワーカーから見えなくなる。処理時間より短いと処理の途中で別のワーカーが同じメッセージを受信してしまうため、最大処理時間より長くする。","ロングポーリングは空の応答を減らして無駄な API 呼び出しを抑える設定である。処理中のメッセージが再び見えるようになる問題や、失敗し続けるメッセージの問題は解決しない。","受信回数が maxReceiveCount を超えたメッセージはデッドレターキューに移されるため、処理できないメッセージがキューに残り続けることを防げる。移したメッセージは後から原因を調べられる。","配信遅延は、送信されたメッセージが最初に受信可能になるまでの時間を遅らせる設定である。受信後の処理中に再び見えるようになるまでの時間（可視性タイムアウト）は変わらない。"],"explain":"重複して処理される原因は、処理時間（最大 4 分）より可視性タイムアウト（30 秒）が短く、処理中のメッセージが再び見えるようになっていることにある。可視性タイムアウトを処理時間より長くすれば、処理中の再受信を防げる。失敗し続けるメッセージには、デッドレターキュー（DLQ）と maxReceiveCount を設定して一定回数で隔離する。どちらもキューの設定変更だけで済む。なお標準キューは「少なくとも 1 回」の配信のため、まれな重複に備えて処理を冪等にしておくとよい。","point":"可視性タイムアウトは処理時間より長くする。失敗し続けるメッセージは DLQ と maxReceiveCount で隔離する。","diagram":{"caption":"正解の構成: 可視性タイムアウトを延ばし、DLQ で失敗メッセージを隔離する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"up","label":"アップロード処理","sub":"メッセージ送信","kind":"compute","c":0,"r":0},{"id":"sqs","label":"SQS 標準キュー","sub":"可視性 5 分","kind":"integration","c":1,"r":0},{"id":"worker","label":"EC2 ワーカー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"s3","label":"Amazon S3","sub":"サムネイル保存","kind":"storage","c":3,"r":0},{"id":"dlq","label":"DLQ","sub":"maxReceiveCount=3","kind":"integration","c":1,"r":1}],"edges":[{"from":"up","to":"sqs"},{"from":"sqs","to":"worker","label":"受信・処理"},{"from":"worker","to":"s3"},{"from":"sqs","to":"dlq","label":"失敗の繰り返し","style":"dashed"}]}},{"id":"d2-02","domain":2,"topic":"SQS・SNS","type":"single","stem":"ある EC 事業者の受注システムは、注文が確定するたびに、在庫管理、配送手配、売上分析の 3 つのシステムの API を順番に呼び出して通知しています。いずれかのシステムが停止していると、注文の確定処理まで失敗します。この企業は、各システムが一時的に停止していても通知を失わず、復旧後に処理できるようにすることを求めています。また、配送手配システムには国内向けの注文だけを届け、今後通知先のシステムが増えても受注システムを変更せずに済むようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon SQS 標準キューを 1 つ作成し、受注システムからメッセージを送信する。3 つのシステムが同じキューをポーリングし、配送手配システムは国外向けの注文を読み飛ばす。","Amazon SNS トピックを作成し、3 つのシステムの HTTPS エンドポイントをサブスクライブする。配送手配システムのサブスクリプションにフィルターポリシーを設定する。","Amazon SNS トピックを作成し、システムごとの Amazon SQS キューをサブスクライブする。配送手配システム用のサブスクリプションにフィルターポリシーを設定する。","システムごとに Amazon SQS キューを作成し、受注システムから各キューにメッセージを送信する。国内向けの注文だけを配送手配システムのキューに送るよう受注システムで振り分ける。"],"answer":[2],"why":["1 つのキューのメッセージは、受信して削除したコンシューマーだけが処理する。3 つのシステムがそれぞれ全件を受け取ることはできない。","HTTPS エンドポイントへの配信は配信ポリシーの範囲でしか再試行されず、停止が長引くと通知が失われる。各システムが復旧後に自分のペースで取り出せるバッファがない。","SNS のファンアウトで各キューに同じ通知が届き、システムの停止中もキューがメッセージを保持する。フィルターポリシーで配送手配には国内向けだけを届けられ、通知先の追加はサブスクリプションを足すだけで済む。","停止中の通知はキューに残るが、宛先の振り分けを受注システムが持つため、通知先が増えるたびに受注システムの変更が必要になる。"],"explain":"「1 つのイベントを複数のシステムに届ける」「停止中も失わない」「送信側を変えずに通知先を増やす」がそろったら、SNS トピックから SQS キューへのファンアウトを選ぶ。SQS キューがシステムごとのバッファになり、各システムは復旧後にメッセージを取り出せる。宛先ごとの絞り込みは、サブスクリプションのフィルターポリシー（メッセージ属性またはメッセージ本文が対象）で行える。","point":"1 対多の通知は SNS → SQS のファンアウト。宛先ごとの絞り込みはサブスクリプションのフィルターポリシーで行う。","diagram":{"caption":"正解の構成: SNS から各システムの SQS キューへファンアウトする","cols":4,"rows":3,"groups":[],"nodes":[{"id":"order","label":"受注システム","sub":"通知を 1 回発行","kind":"compute","c":0,"r":1},{"id":"sns","label":"SNS トピック","sub":"ファンアウト","kind":"integration","c":1,"r":1},{"id":"q1","label":"在庫用キュー","sub":"Amazon SQS","kind":"integration","c":2,"r":0},{"id":"q2","label":"配送用キュー","sub":"フィルターで国内のみ","kind":"integration","c":2,"r":1},{"id":"q3","label":"分析用キュー","sub":"Amazon SQS","kind":"integration","c":2,"r":2},{"id":"s1","label":"在庫管理","kind":"compute","c":3,"r":0},{"id":"s2","label":"配送手配","kind":"compute","c":3,"r":1},{"id":"s3","label":"売上分析","kind":"compute","c":3,"r":2}],"edges":[{"from":"order","to":"sns"},{"from":"sns","to":"q1"},{"from":"sns","to":"q2"},{"from":"sns","to":"q3"},{"from":"q1","to":"s1"},{"from":"q2","to":"s2"},{"from":"q3","to":"s3"}]}},{"id":"d2-03","domain":2,"topic":"SQS・SNS","type":"single","stem":"あるポイントサービスの事業者は、会員ごとのポイント加算と減算のイベントを、Amazon SQS を経由して処理システムに渡しています。同じ会員のイベントは発生した順に処理しないと、残高の計算が誤ります。送信側のアプリケーションはネットワークエラーが発生すると同じイベントを再送することがあり、重複したイベントを処理してはなりません。会員数が多いため、異なる会員のイベントは並行して処理し、スループットを確保する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["SQS FIFO キューを作成する。メッセージグループ ID に会員 ID を、メッセージ重複排除 ID にイベント ID を設定してメッセージを送信する。","SQS FIFO キューを作成する。すべてのメッセージに同じメッセージグループ ID を設定し、キュー全体で送信された順序を保証する。","SQS 標準キューを作成する。メッセージ属性にイベントの発生時刻を設定し、受信側でメッセージを時刻順に並べ替えてから処理する。","SQS の代わりに Amazon Kinesis Data Streams を使用する。パーティションキーに会員 ID を設定し、シャード内の順序でイベントを処理する。"],"answer":[0],"why":["FIFO キューは同じメッセージグループ ID の中で順序を保ち、異なるグループは並行して処理できる。重複排除 ID が同じメッセージは重複排除間隔（5 分間）の中で 1 回しか受け付けられないため、再送による重複も防げる。","順序は保てるが、キュー全体が 1 つのグループになり、前のメッセージの処理が終わるまで次のメッセージを受信できない。異なる会員のイベントを並行して処理できず、スループットの要件を満たさない。","標準キューの順序はベストエフォートで、「少なくとも 1 回」の配信のため重複も起こりうる。どこまで待てば並べ替えられるかが決まらず、重複の検出も受信側で作り込む必要がある。","パーティションキーで会員ごとの順序は保てるが、送信側の再送で同じレコードが重複して書き込まれることがあり、それを排除する仕組みがない。重複したイベントを処理しない要件を満たさない。"],"explain":"「同じ会員の中では順序どおり」「異なる会員は並行」「重複を処理しない」がそろったら、FIFO キューのメッセージグループ ID と重複排除 ID を使う。順序を保つ単位（ここでは会員）をメッセージグループ ID にすると、グループ内の順序とグループ間の並列性を両立できる。重複排除 ID を送信側で固定の値（イベント ID）にしておけば、再送されたメッセージは重複排除間隔の中で破棄される。Kinesis Data Streams も順序は保てるが、重複の排除は受信側の仕事になる。","point":"FIFO キューはメッセージグループ ID が順序を保つ単位。グループを細かく分けるほど並列に処理でき、重複は重複排除 ID で防ぐ。","diagram":null},{"id":"d2-04","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、取引先から届く請求データを Amazon SQS キューに格納し、Auto Scaling グループ内の Amazon EC2 インスタンスで実行されるワーカーが 1 件ずつ処理しています。処理時間の大半は外部の与信 API の応答待ちで、CPU 使用率は負荷にかかわらず 20% 前後です。データの量は日によって大きく変動し、決まった周期はありません。ワーカー 1 台は 1 件を約 6 秒で処理でき、キューに入ったデータは 10 分以内に処理を完了する必要があります。ソリューションアーキテクトは、処理量に合わせてインスタンス数を自動的に調整する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの平均 CPU 使用率を指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 60% に設定する。","Auto Scaling グループに予測スケーリングポリシーを作成し、過去の負荷の傾向から予測した需要に合わせて事前にインスタンスを起動する。","キューの ApproximateNumberOfMessagesVisible メトリクスをそのまま指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 100 に設定する。","キューのメッセージ数をインスタンス数で割ったインスタンスあたりのバックログを指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 100 に設定する。"],"answer":[3],"why":["ワーカーは応答待ちが中心で CPU 使用率が負荷を反映しないため、キューにデータが溜まってもスケールアウトしない。","予測スケーリングは、日次や週次のように繰り返す負荷のパターンがある場合に向く。決まった周期がない負荷では予測が当たらない。","キューのメッセージ数はインスタンス数に比例して変化する指標ではないため、ターゲット追跡にそのまま使うと台数を適切に調整できない。AWS のドキュメントでも、台数で割ったバックログを使う方法が案内されている。","許容できるバックログ（10 分 ÷ 6 秒 = 1 台あたり 100 件）を目標値にすると、キューの溜まり具合に比例してインスタンス数が調整される。台数で割ることで、台数が増えたあとの過剰なスケールアウトも防げる。"],"explain":"SQS のワーカーを増減させる指標は、CPU ではなくキューの溜まり具合である。AWS が推奨するのは、キューのメッセージ数（ApproximateNumberOfMessagesVisible）を実行中のインスタンス数で割った「インスタンスあたりのバックログ」を指標にし、許容レイテンシー ÷ 1 件の処理時間で求めた値を目標にターゲット追跡する方法である。この指標はカスタムメトリクスとして発行するか、ターゲット追跡ポリシーのメトリクス計算で求める。メッセージ数をそのまま使う方法はひっかけになりやすいので注意する。","point":"SQS ワーカーのスケーリングは「メッセージ数 ÷ インスタンス数」でターゲット追跡する。目標値は許容レイテンシー ÷ 処理時間。","diagram":{"caption":"正解の構成: インスタンスあたりのバックログでワーカーを増減する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"partner","label":"取引先","sub":"請求データ","kind":"client","c":0,"r":0},{"id":"sqs","label":"SQS キュー","sub":"量は日ごとに変動","kind":"integration","c":1,"r":0},{"id":"worker","label":"EC2 ワーカー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"api","label":"与信 API","sub":"外部サービス","kind":"client","c":3,"r":0},{"id":"cw","label":"CloudWatch","sub":"バックログ/台","kind":"management","c":1,"r":1}],"edges":[{"from":"partner","to":"sqs"},{"from":"sqs","to":"worker","label":"受信"},{"from":"worker","to":"api","label":"応答待ち"},{"from":"sqs","to":"cw","label":"メッセージ数","style":"dashed"},{"from":"cw","to":"worker","label":"目標値 100"}]}},{"id":"d2-05","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある旅行予約サービスでは、1 件の予約ごとに「航空券の確保」「ホテルの確保」「決済」の 3 つの処理を順に実行します。各処理は AWS Lambda 関数として実装済みです。途中の処理が失敗した場合は、それまでに確保した航空券やホテルを取り消す必要があります。また、決済では外部の決済代行会社から確認の通知が届くまで、最大 24 時間待機することがあります。運用担当者は、各予約の処理状況を確認できる必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Step Functions の Express ワークフローを作成し、各関数を順に呼び出す。決済の確認はタスクトークンを使って待機し、失敗時は Catch で取り消し処理に進める。","AWS Step Functions の Standard ワークフローを作成し、各関数を順に呼び出す。決済の確認はタスクトークンを使って待機し、失敗時は Catch で取り消し処理に進める。","各 Lambda 関数の最後で次の関数を同期的に呼び出す。決済の確認は関数内でポーリングして待機し、失敗時は呼び出し元に例外を返して取り消し処理を実行する。","処理ごとに Amazon SQS キューを作成して Lambda 関数をつなぐ。予約ごとの状態を Amazon DynamoDB テーブルに記録し、失敗時は別の関数がテーブルを参照して取り消す。"],"answer":[1],"why":["Express ワークフローは 1 回の実行が最大 5 分までで、24 時間の待機はできない。タスクトークンによるコールバック（.waitForTaskToken）にも対応していない。","Standard ワークフローは最大 1 年まで実行でき、タスクトークンで外部からの通知を待てる。Catch で失敗時の取り消し処理に分岐でき、各実行の状態と履歴をコンソールで確認できる。","Lambda 関数の実行時間は最大 15 分のため、24 時間の待機はできない。失敗時の取り消しや処理状況の把握も独自に作り込む必要がある。","要件は満たせるが、予約ごとの状態管理、取り消しの制御、処理状況の確認の仕組みをすべて独自に作って運用することになり、運用効率が低い。"],"explain":"複数のステップの順序制御、失敗時の取り消し（補償処理）、外部からの通知待ち、実行状況の可視化をまとめて任せるなら AWS Step Functions を使う。「最大 24 時間待機」が決め手で、実行時間が最大 5 分の Express ワークフローではなく、最大 1 年まで実行できる Standard ワークフローを選ぶ。外部の処理の完了を待つにはタスクトークンを使うコールバックパターンを使い、通知を受けた側が SendTaskSuccess を呼んでワークフローを再開させる。","point":"長時間の実行や通知待ちは Standard、短時間で大量のイベント処理は Express。失敗時の取り消しは Catch で補償処理へ進める。","diagram":null},{"id":"d2-06","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある小売企業の受注サービスは、「注文作成」「注文キャンセル」などのイベントを発行しています。この企業は、イベントの内容に応じて複数の宛先に振り分けることを計画しています。一定額以上の注文は AWS Step Functions の審査ワークフローを開始し、キャンセルは AWS Lambda 関数で在庫を戻し、すべての注文イベントを物流会社の外部 HTTPS API にも送信します。物流会社の API には 1 秒あたりの呼び出し回数に上限があります。今後も宛先の追加が見込まれます。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EventBridge のカスタムイベントバスと、イベントパターンで振り分けるルールを作成する。ターゲットに Step Functions、Lambda 関数、呼び出しレートを設定した API 送信先を指定する。","Amazon SNS トピックと、メッセージ本文にフィルターポリシーを設定したサブスクリプションを作成する。サブスクライバーとして Step Functions、Lambda 関数、外部の HTTPS エンドポイントを指定する。","Amazon SQS キューと、キューをイベントソースとする Lambda 関数を作成する。関数内でイベントの種類と金額を判定し、審査のワークフロー、在庫の関数、外部の API をそれぞれ呼び出す。","Amazon Kinesis Data Streams のストリームと、宛先ごとのコンシューマーアプリケーションを作成する。各コンシューマーが必要なイベントだけを選び、それぞれの宛先に渡す。"],"answer":[0],"why":["イベントパターンで内容（イベントの種類や金額）に応じて振り分けられ、Step Functions と Lambda は直接ターゲットにできる。外部の HTTPS API は API 送信先として登録でき、1 秒あたりの呼び出しレートの上限も設定できる。","SNS のサブスクリプションのプロトコルに Step Functions は含まれず、ワークフローを開始するには Lambda 関数などの中継処理を独自に作る必要がある。","要件は満たせるが、振り分けのロジック、各宛先の呼び出し、外部 API への呼び出しレートの制御をすべて独自のコードで作って運用することになる。","各コンシューマーでイベントを選別して宛先を呼び出す処理を独自に作る必要があり、宛先が増えるたびにアプリケーションの開発と運用が増える。"],"explain":"「イベントの内容で複数の宛先に振り分ける」「宛先の追加が見込まれる」「運用効率」がそろったら Amazon EventBridge のルールを使う。イベントパターンではイベントの種類や数値の範囲を条件にでき、1 つのルールに複数のターゲットを設定できる。外部の HTTPS API は API 送信先（API destinations）として登録すれば、認証情報の付与や呼び出しレートの制限も EventBridge に任せられる。SNS もフィルターポリシーで振り分けられるが、Step Functions を直接サブスクライブできない点が決め手になる。","point":"イベントを内容で振り分けるなら EventBridge のルール。外部 API への送信は API 送信先を使い、呼び出しレートも制限できる。","diagram":null},{"id":"d2-07","domain":2,"topic":"ELB","type":"single","stem":"ある IoT 機器メーカーは、数十万台の機器から独自プロトコルの UDP パケットでテレメトリを受信するサーバー群を、Amazon EC2 で構築しています。受信サーバーは複数の AZ に分散し、Auto Scaling で台数を自動的に増減させます。顧客の工場のファイアウォールは通信先を IP アドレスで許可する方式のため、機器の接続先の IP アドレスは、サーバーの台数が変わっても変わらないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Application Load Balancer を作成し、UDP のリスナーを設定する。受信サーバーの Auto Scaling グループをターゲットグループに登録する。","Gateway Load Balancer を作成し、受信サーバーの Auto Scaling グループをターゲットグループに登録する。機器からのパケットを GENEVE で受け渡す。","Network Load Balancer を作成し、AZ ごとに Elastic IP アドレスを割り当てる。UDP のリスナーで受信サーバーのターゲットグループに転送する。","受信サーバーの起動時に Elastic IP アドレスを割り当てる。Amazon Route 53 の複数値回答ルーティングで、正常なサーバーの IP アドレスを返す。"],"answer":[2],"why":["ALB はレイヤー 7 で HTTP・HTTPS を扱うロードバランサーで、UDP のリスナーは作成できない。ALB の IP アドレスも固定されない。","GWLB はファイアウォールなどの仮想アプライアンスにトラフィックを透過的に通すためのもので、クライアントが直接接続するアプリケーションの入口には使わない。","NLB はレイヤー 4 で TCP・UDP を扱い、AZ ごとに Elastic IP アドレスを割り当てられる。背後のサーバーが増減しても、機器から見える IP アドレスは変わらない。","サーバーが増減するたびに返す IP アドレスの組み合わせが変わり、工場のファイアウォールの許可設定を更新し続ける必要がある。"],"explain":"「UDP」「固定の IP アドレス」が決め手で、NLB を選ぶ。NLB はレイヤー 4 のロードバランサーで TCP・UDP・TLS を扱え、各 AZ のサブネットに Elastic IP アドレスを割り当てられる。ALB は HTTP・HTTPS 用で IP アドレスが変わりうるため、IP アドレスで許可させる用途には向かない。GWLB はセキュリティアプライアンスを負荷分散するためのものである。","point":"UDP や固定 IP が要るなら NLB（AZ ごとに EIP）。HTTP の内容で振り分けるなら ALB、アプライアンスの負荷分散は GWLB。","diagram":{"caption":"正解の構成: NLB に AZ ごとの Elastic IP を割り当て、UDP で転送する","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":2,"h":2},{"label":"AZ a","kind":"az","c":1,"r":0,"w":2,"h":1},{"label":"AZ b","kind":"az","c":1,"r":1,"w":2,"h":1}],"nodes":[{"id":"dev","label":"IoT 機器","sub":"固定 IP を許可","kind":"client","c":0,"r":0},{"id":"nlba","label":"NLB","sub":"Elastic IP（AZ a）","kind":"network","c":1,"r":0},{"id":"nlbb","label":"NLB","sub":"Elastic IP（AZ b）","kind":"network","c":1,"r":1},{"id":"srva","label":"受信サーバー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"srvb","label":"受信サーバー","sub":"Auto Scaling","kind":"compute","c":2,"r":1}],"edges":[{"from":"dev","to":"nlba","label":"UDP"},{"from":"dev","to":"nlbb","label":"UDP"},{"from":"nlba","to":"srva"},{"from":"nlbb","to":"srvb"}]}},{"id":"d2-08","domain":2,"topic":"API Gateway","type":"single","stem":"ある自治体向けのアンケートサービスは、モバイルアプリから送信された回答を Amazon API Gateway と AWS Lambda で受け付け、Amazon RDS for MySQL に書き込んでいます。テレビ番組で紹介された直後など、送信が短時間に集中すると、データベースの接続数が上限に達して書き込みが失敗し、回答が失われています。回答はすぐにデータベースに反映されなくてもかまいませんが、1 件も失ってはなりません。また、アプリには送信直後に受付完了を返す必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["API Gateway の使用量プランでスロットリングの上限を設定する。上限を超えて拒否された送信は、アプリ側で時間をおいて再送させる。","Lambda 関数のプロビジョニングされた同時実行を増やす。送信が集中しても関数がすぐに起動し、データベースに書き込めるようにする。","RDS の DB インスタンスクラスを大きくし、max_connections の値を引き上げる。送信が集中しても、データベースの接続数が上限に達しないようにする。","API Gateway から Amazon SQS キューにメッセージを送信する統合を設定する。キューを読む Lambda 関数の同時実行数を制限して書き込む。"],"answer":[3],"why":["上限を超えた送信はエラー（429）で拒否され、再送はアプリ任せになる。再送の前にアプリが終了されると回答が失われ、1 件も失わない要件を満たせない。","同時に動く関数が増えるほどデータベースへの接続も増え、接続数が上限に達する問題がかえって悪化する。","接続数の上限は上がるが、集中の規模によっては再び上限に達して回答を失う可能性が残る。ピークに合わせた大きなインスタンスを常に動かすため、コストも高い。","SQS キューが集中した送信を受け止めるバッファになり、API Gateway はキューへの送信が成功した時点で応答を返せる。キューを読む Lambda 関数の同時実行数を絞れば、データベースの接続数を一定以下に保てる。"],"explain":"「書き込みが短時間に集中する」「すぐに反映されなくてよい」「1 件も失わない」がそろったら、間に SQS キューを挟んで負荷を平準化する。API Gateway は AWS のサービス統合で SQS に直接メッセージを送れるため、受付完了をすぐに返せる。後段の Lambda 関数は、SQS のイベントソースマッピングの最大同時実行数（または予約済み同時実行数）で並列度を抑え、データベースが処理できるペースで書き込む。データベースをピークに合わせて大きくする方法は、コストが高いうえに上限の問題も残る。","point":"急増する書き込みは SQS で受け止めて平準化する。後段の並列度を絞れば、DB の接続数を抑えられる。","diagram":{"caption":"正解の構成: SQS で送信の集中を受け止め、一定のペースで書き込む","cols":5,"rows":1,"groups":[],"nodes":[{"id":"app","label":"モバイルアプリ","sub":"回答を送信","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"SQS に直接統合","kind":"network","c":1,"r":0},{"id":"sqs","label":"SQS キュー","sub":"バッファ","kind":"integration","c":2,"r":0},{"id":"fn","label":"Lambda","sub":"同時実行数を制限","kind":"serverless","c":3,"r":0},{"id":"rds","label":"RDS for MySQL","sub":"接続数を抑える","kind":"database","c":4,"r":0}],"edges":[{"from":"app","to":"apigw","label":"すぐに受付完了"},{"from":"apigw","to":"sqs"},{"from":"sqs","to":"fn","label":"ポーリング"},{"from":"fn","to":"rds"}]}},{"id":"d2-09","domain":2,"topic":"コンテナ","type":"single","stem":"ある企業は、1 台の大きな Amazon EC2 インスタンスで実行しているモノリシックな Web アプリケーションを、「商品」「カート」「会員」の 3 つのマイクロサービスに分割し、それぞれをコンテナイメージにしました。サービスごとに負荷の高い時間帯が異なるため、独立してスケールさせる必要があります。また、サーバーやクラスターのノードへのパッチ適用などの管理は行いたくありません。クライアントは 1 つのドメイン名でアクセスし、URL のパスで各サービスに振り分けられます。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EKS クラスターを作成し、セルフマネージド型のノードグループに各サービスをデプロイする。Network Load Balancer で各サービスを公開する。","サービスごとに AWS Fargate で実行する Amazon ECS サービスを作成し、それぞれに Auto Scaling を設定する。Application Load Balancer のパスベースのルーティングで振り分ける。","3 つのコンテナを 1 つの Amazon ECS タスク定義にまとめ、AWS Fargate で実行する。Application Load Balancer のパスベースのルーティングで各コンテナに振り分ける。","EC2 起動タイプの Amazon ECS クラスターを作成し、サービスごとに ECS サービスと Auto Scaling を設定する。Application Load Balancer のパスベースのルーティングで各サービスに振り分ける。"],"answer":[1],"why":["セルフマネージド型のノードは、EC2 インスタンスの OS の更新などを利用者が管理する。NLB はレイヤー 4 のため、URL のパスで振り分けることもできない。","Fargate ならノードの管理が不要で、ECS サービスごとにタスク数を増減できる。ALB のリスナールールで、パスごとに別のターゲットグループ（ECS サービス）へ振り分けられる。","1 つのタスクにまとめると、3 つのコンテナは常に同じ数ずつ起動する。サービスごとに独立してスケールさせる要件を満たせない。","サービスごとのスケーリングとパスでの振り分けはできるが、コンテナインスタンス（EC2）の OS へのパッチ適用などを利用者が管理する必要があり、要件に合わない。"],"explain":"「サービスごとに独立してスケール」「ノードを管理しない」「パスで振り分け」が決め手になる。ECS のサービスをマイクロサービスごとに作れば、それぞれに Application Auto Scaling のポリシーを設定できる。Fargate で実行すれば、サーバーの OS の管理は不要になる。パスでの振り分けはレイヤー 7 の ALB のリスナールールで行い、転送先を各サービスのターゲットグループにする。EC2 起動タイプは機能面の要件は満たすが、ノード管理が残る点で外れる。","point":"サーバー管理なしでコンテナを動かすなら Fargate。独立してスケールさせる単位ごとに ECS サービスを分け、ALB のパスで振り分ける。","diagram":{"caption":"正解の構成: ALB のパスで振り分け、ECS サービスごとにスケールする","cols":3,"rows":3,"groups":[{"label":"ECS クラスター（Fargate）","kind":"generic","c":2,"r":0,"w":1,"h":3}],"nodes":[{"id":"client","label":"クライアント","sub":"1 つのドメイン名","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"パスベースの振り分け","kind":"network","c":1,"r":1},{"id":"svcp","label":"商品サービス","sub":"Auto Scaling","kind":"container","c":2,"r":0},{"id":"svcc","label":"カートサービス","sub":"Auto Scaling","kind":"container","c":2,"r":1},{"id":"svcm","label":"会員サービス","sub":"Auto Scaling","kind":"container","c":2,"r":2}],"edges":[{"from":"client","to":"alb"},{"from":"alb","to":"svcp","label":"/products"},{"from":"alb","to":"svcc","label":"/cart"},{"from":"alb","to":"svcm","label":"/members"}]}},{"id":"d2-10","domain":2,"topic":"ElastiCache","type":"multi","stem":"ある企業の Web アプリケーションは、Application Load Balancer の背後にある Auto Scaling グループの Amazon EC2 インスタンスで実行されています。ログイン中のユーザーのセッション情報は各インスタンスのメモリに保存され、ALB のスティッキーセッションが有効になっています。ユーザーがアップロードした画像は、リクエストを受け付けたインスタンスの EBS ボリュームに保存されています。スケールインや障害でインスタンスが終了するたびに、ユーザーがログアウトされたり、画像が表示されなくなったりします。ソリューションアーキテクトは、アプリケーションをステートレスにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["セッション情報を Amazon ElastiCache に保存するようにアプリケーションを変更し、すべてのインスタンスから参照する。","ALB のスティッキーセッションの Cookie の有効期間を延ばし、同じユーザーを同じインスタンスに送り続けるようにする。","Auto Scaling グループでスケールイン保護を有効にし、セッションを持つインスタンスがスケールインで終了しないようにする。","画像を保存した EBS ボリュームのスナップショットを 1 時間ごとに作成し、新しいインスタンスの起動時に復元する。","アップロードされた画像を Amazon S3 バケットに保存するようにアプリケーションを変更し、S3 から読み出す。"],"answer":[0,4],"why":["セッション情報をインスタンスの外のインメモリのデータストアに置くと、どのインスタンスがリクエストを受けても同じセッションを使える。インスタンスが終了してもセッションは失われない。","接続先が固定されるだけで、セッション情報は引き続きインスタンスのメモリにある。そのインスタンスが終了すればログアウトされる問題は残る。","スケールインで終了しなくなるだけで、障害によるインスタンスの終了は防げない。不要なインスタンスが残り続けてコストも増える。","スナップショットの作成後に保存された画像は失われ、ほかのインスタンスが受け付けた画像は見えないままである。","画像をインスタンスの外の S3 に置けば、どのインスタンスからも同じ画像を読み出せ、インスタンスが終了しても画像は残る。"],"explain":"ステートレスにするとは、インスタンスに状態（セッションやファイル）を持たせず、外部のサービスに置くことである。セッションのように頻繁に読み書きする小さなデータは ElastiCache（または DynamoDB）に、画像のようなファイルは S3 に置く。そうすればスティッキーセッションも不要になり、Auto Scaling が自由にインスタンスを追加・終了できる。スティッキーセッションやスケールイン保護は、状態がインスタンスに残ったままなので根本的な解決にならない。","point":"ステートレス化はセッションを ElastiCache・DynamoDB へ、ファイルを S3・EFS へ外部化する。スティッキーセッションは根本的な解決にならない。","diagram":null},{"id":"d2-11","domain":2,"topic":"RDS・Aurora","type":"multi","stem":"ある企業の業務システムは、シングル AZ の Amazon RDS for PostgreSQL DB インスタンスを使用しています。この企業は 2 つの課題を解決したいと考えています。1 つ目は、AZ の障害時にデータを失わずに自動でフェイルオーバーし、アプリケーションの接続先エンドポイントを変更せずに済むようにすることです。2 つ目は、営業時間中に実行される重い集計クエリがオンライン処理を遅くしているため、集計クエリの負荷をオンライン処理から切り離すことです。集計結果は数秒程度の遅延を許容します。これらの要件を満たす手順の組み合わせはどれですか。","choices":["DB インスタンスを Multi-AZ 配置に変更し、集計クエリの接続先をスタンバイインスタンスに変更する。","別のリージョンにクロスリージョンリードレプリカを作成し、AZ の障害時はレプリカを手動で昇格させる。","DB インスタンスを Multi-AZ 配置に変更し、別の AZ に同期レプリケーションされるスタンバイを作成する。","自動バックアップの保持期間を延ばし、AZ の障害時はポイントインタイムリカバリで別の AZ に復元する。","同じリージョンにリードレプリカを作成し、集計クエリの接続先をリードレプリカのエンドポイントに変更する。"],"answer":[2,4],"why":["Multi-AZ の DB インスタンス配置のスタンバイはフェイルオーバー専用で、読み取りには使えない。集計クエリを接続することはできない。","非同期レプリケーションのため直前のデータを失う可能性があり、昇格も接続先の切り替えも手動になる。","スタンバイに同期でレプリケーションされるためデータを失わず、障害時は自動でフェイルオーバーする。エンドポイントの DNS 名は変わらないため、アプリケーションの接続先を変える必要がない。","復元には時間がかかり、新しい DB インスタンスのエンドポイントに接続先を変える必要がある。最新の復元可能時刻より後のデータも失われる。","リードレプリカは非同期で複製されるが、数秒の遅延を許容できる集計クエリには十分である。読み取りの負荷をプライマリから切り離せる。"],"explain":"高可用性（自動フェイルオーバー・データ損失なし）は Multi-AZ 配置、読み取りの負荷分散はリードレプリカ、と役割を分けて考える。Multi-AZ の DB インスタンス配置ではスタンバイに同期レプリケーションされ、障害時はエンドポイントの DNS が新しいプライマリを指すため、アプリケーションの変更は要らない。ただしスタンバイは読み取りに使えないので、集計クエリの切り離しにはリードレプリカを別に作る。なお、読み取り可能なスタンバイを 2 つ持つ Multi-AZ DB クラスター配置を使う方法もある。","point":"Multi-AZ は可用性のため（DB インスタンス配置のスタンバイは読めない）、リードレプリカは読み取りの分散のため。目的で使い分ける。","diagram":{"caption":"正解の構成: Multi-AZ で自動フェイルオーバー、集計はリードレプリカへ","cols":3,"rows":2,"groups":[{"label":"AZ a","kind":"az","c":1,"r":0,"w":1,"h":2},{"label":"AZ b","kind":"az","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"online","label":"オンライン処理","sub":"接続先は不変","kind":"compute","c":0,"r":0},{"id":"report","label":"集計処理","sub":"数秒の遅延は許容","kind":"compute","c":0,"r":1},{"id":"primary","label":"プライマリ","sub":"RDS PostgreSQL","kind":"database","c":1,"r":0},{"id":"replica","label":"リードレプリカ","sub":"集計専用","kind":"database","c":1,"r":1},{"id":"standby","label":"スタンバイ","sub":"読み取り不可","kind":"database","c":2,"r":0}],"edges":[{"from":"online","to":"primary"},{"from":"report","to":"replica"},{"from":"primary","to":"standby","label":"同期で複製","style":"dashed"},{"from":"primary","to":"replica","label":"非同期で複製","style":"dashed"}]}},{"id":"d2-12","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon API Gateway と AWS Lambda で構成した API から、Amazon Aurora MySQL DB クラスターに接続しています。アクセスが急増すると Lambda 関数の同時実行数が増え、データベースへの接続が大量に開かれて、接続数の上限エラーが発生します。また、Aurora のフェイルオーバー時には、DNS レコードの切り替えを待つ間、アプリケーションのエラーが続きます。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて両方の問題を軽減する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon RDS Proxy を作成し、DB クラスターをターゲットとして登録する。Lambda 関数の接続先をプロキシのエンドポイントに変更する。","DB パラメータグループで max_connections の値を引き上げる。あわせて、ライターの DB インスタンスクラスを大きくして接続の増加に備える。","Aurora レプリカを追加する。Lambda 関数の接続先をクラスターのリーダーエンドポイントに変更し、接続を分散させる。","Lambda 関数の予約済み同時実行数を小さく設定する。データベースに同時に接続する関数の数を一定以下に抑える。"],"answer":[0],"why":["RDS Proxy は接続をプールし、多数の関数からの接続を少数のデータベース接続にまとめる。フェイルオーバー時もプロキシが新しいライターへの接続に切り替えるため、DNS の切り替えを待たずに済み、エラーの時間を短くできる。","接続数の上限は上がるが、同時実行数がさらに増えれば同じ問題が起きる。フェイルオーバー時の DNS の切り替え待ちも解決せず、コストも上がる。","リーダーエンドポイントは読み取り専用で、書き込みを含む API の処理には使えない。フェイルオーバー時の問題も解決しない。","同時実行数の上限を超えたリクエストはスロットリングされ、API のエラーが増える。フェイルオーバー時の問題も解決しない。"],"explain":"Lambda のように短時間に大量の接続を開くアプリケーションと RDS・Aurora の組み合わせでは、Amazon RDS Proxy で接続をプールするのが定石である。アプリケーションは接続先をプロキシのエンドポイントに変えるだけでよい。RDS Proxy はデータベースのフェイルオーバーを検知して新しいライターに接続し直すため、クライアントは DNS のキャッシュの更新を待たずに済み、フェイルオーバーの影響時間を短くできる。","point":"Lambda から RDS・Aurora への接続が多すぎるなら RDS Proxy。フェイルオーバーの影響時間の短縮にも効く。","diagram":{"caption":"正解の構成: RDS Proxy で接続をプールし、フェイルオーバーにも追従する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"apigw","label":"API Gateway","kind":"network","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"同時実行が急増","kind":"serverless","c":1,"r":0},{"id":"proxy","label":"RDS Proxy","sub":"接続プール","kind":"database","c":2,"r":0},{"id":"writer","label":"Aurora ライター","sub":"Aurora MySQL","kind":"database","c":3,"r":0},{"id":"replica","label":"Aurora レプリカ","sub":"フェイルオーバー先","kind":"database","c":3,"r":1}],"edges":[{"from":"apigw","to":"fn"},{"from":"fn","to":"proxy","label":"多数の接続"},{"from":"proxy","to":"writer","label":"少数の接続"},{"from":"proxy","to":"replica","label":"障害時に切替","style":"dashed"}]}},{"id":"d2-13","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある金融サービス企業は、1 つのリージョンで Amazon Aurora PostgreSQL DB クラスターを運用しています。事業継続計画の見直しにより、リージョン全体の障害に備えて、別のリージョンで業務を再開できるようにすることになりました。RPO は数秒、RTO は数分である必要があります。また、平常時は別のリージョンにある拠点から、参照系の処理を低レイテンシーで実行したいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Backup で DB クラスターのスナップショットを 1 時間ごとに作成し、別のリージョンにコピーする。障害時はコピーしたスナップショットから復元する。","同じリージョン内の別の AZ に Aurora レプリカを追加し、フェイルオーバーの優先順位を最も高く設定する。障害時はレプリカを自動的に昇格させる。","AWS Database Migration Service で、別のリージョンの Aurora DB クラスターへの継続的なレプリケーションを設定する。障害時は接続先を切り替える。","Aurora Global Database を構成し、別のリージョンにセカンダリ DB クラスターを作成する。障害時はセカンダリクラスターをプライマリに昇格させる。"],"answer":[3],"why":["最大で 1 時間分のデータを失い、スナップショットからの復元にも時間がかかる。RPO・RTO の要件を満たさず、平常時に別のリージョンで参照することもできない。","同じリージョンの中での冗長化であり、リージョン全体の障害には備えられない。","レプリケーションインスタンスとタスクを運用し続ける必要があり、Aurora の機能で済む方法に比べて運用効率が低い。","Global Database は Aurora のストレージ層で別のリージョンに複製し、遅延は通常 1 秒未満である。障害時はセカンダリを昇格させて分単位で書き込みを再開でき、平常時はセカンダリを参照系に使える。"],"explain":"「リージョン全体の障害」「RPO 数秒・RTO 数分」「別のリージョンで低レイテンシーの読み取り」がそろったら Aurora Global Database を選ぶ。プライマリのリージョンからセカンダリのリージョンへ、Aurora のストレージ層で非同期に複製するため、データベースの性能への影響が小さく、遅延も通常 1 秒未満である。セカンダリクラスターは平常時は読み取り専用で、そのリージョンの参照系の処理に使える。同じリージョン内の Aurora レプリカは AZ 障害への備えであり、リージョン障害には対応できない。","point":"Aurora のリージョン間 DR は Global Database（複製の遅延は通常 1 秒未満、RTO は分単位）。セカンダリは平常時に読み取りにも使える。","diagram":{"caption":"正解の構成: Aurora Global Database で別のリージョンへ複製する","cols":4,"rows":1,"groups":[{"label":"プライマリリージョン","kind":"region","c":0,"r":0,"w":2,"h":1},{"label":"セカンダリリージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"app1","label":"業務アプリ","sub":"読み書き","kind":"compute","c":0,"r":0},{"id":"pri","label":"プライマリ","sub":"Aurora DB クラスター","kind":"database","c":1,"r":0},{"id":"sec","label":"セカンダリ","sub":"読み取り専用","kind":"database","c":2,"r":0},{"id":"app2","label":"参照系の処理","sub":"拠点から利用","kind":"compute","c":3,"r":0}],"edges":[{"from":"app1","to":"pri"},{"from":"pri","to":"sec","label":"非同期で複製","style":"dashed"},{"from":"app2","to":"sec","label":"参照"}]}},{"id":"d2-14","domain":2,"topic":"DynamoDB","type":"single","stem":"あるモバイルゲーム企業は、北米と欧州のプレイヤー向けに、それぞれ近いリージョンでバックエンドを運用しています。プレイヤーのプロファイルは Amazon DynamoDB に保存されています。プレイヤーがどちらのリージョンに接続しても、自分のプロファイルを低レイテンシーで読み書きできる必要があります。また、どちらかのリージョンが停止しても、もう一方のリージョンで書き込みを含めて処理を継続する必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["北米のリージョンにテーブルを作成し、ポイントインタイムリカバリを有効にする。欧州のアプリケーションはリージョンをまたいでアクセスし、障害時は別のリージョンに復元する。","DynamoDB グローバルテーブルを作成し、両方のリージョンにレプリカを配置する。各リージョンのアプリケーションは、同じリージョンのレプリカを読み書きする。","各リージョンにテーブルを作成する。DynamoDB Streams をトリガーとする Lambda 関数で、変更をもう一方のリージョンのテーブルに書き込む。","各リージョンにテーブルを作成する。AWS Backup で 1 時間ごとにバックアップをもう一方のリージョンにコピーし、障害時はバックアップから復元する。"],"answer":[1],"why":["欧州のプレイヤーはリージョンをまたぐためレイテンシーが大きい。北米のリージョンが停止すると、復元が終わるまで両方のリージョンで処理が止まる。","グローバルテーブルはどのレプリカにも書き込めるマルチアクティブの構成で、変更は自動で他のリージョンに複製される。一方のリージョンが停止しても、もう一方で読み書きを続けられる。","同じことを自前で実現する構成で、再試行や書き込みの競合の扱いまで作り込んで運用する必要があり、運用効率が低い。","最大 1 時間分のデータを失い、復元にも時間がかかる。平常時に両方のリージョンで同じデータを読み書きすることもできない。"],"explain":"「複数のリージョンで読み書き」「リージョン障害時も書き込みを継続」「運用効率」がそろったら DynamoDB グローバルテーブルを選ぶ。各リージョンのレプリカに書き込んだ変更は、DynamoDB が自動で他のレプリカに複製する。同じ項目への同時の書き込みは、既定では最後に書き込んだものが優先されて解決される。Streams と Lambda で同じことを作る方法は動くが、運用負荷が大きい。","point":"DynamoDB のマルチリージョン・マルチアクティブはグローバルテーブル。各リージョンのレプリカに読み書きでき、複製は自動。","diagram":{"caption":"正解の構成: グローバルテーブルで両リージョンのレプリカを読み書きする","cols":6,"rows":1,"groups":[{"label":"北米のリージョン","kind":"region","c":1,"r":0,"w":2,"h":1},{"label":"欧州のリージョン","kind":"region","c":3,"r":0,"w":2,"h":1}],"nodes":[{"id":"na","label":"北米のプレイヤー","kind":"client","c":0,"r":0},{"id":"appa","label":"バックエンド","sub":"北米","kind":"compute","c":1,"r":0},{"id":"ta","label":"DynamoDB","sub":"レプリカ","kind":"database","c":2,"r":0},{"id":"tb","label":"DynamoDB","sub":"レプリカ","kind":"database","c":3,"r":0},{"id":"appb","label":"バックエンド","sub":"欧州","kind":"compute","c":4,"r":0},{"id":"eu","label":"欧州のプレイヤー","kind":"client","c":5,"r":0}],"edges":[{"from":"na","to":"appa"},{"from":"appa","to":"ta","label":"読み書き"},{"from":"ta","to":"tb","label":"自動で複製","style":"dashed","both":true},{"from":"appb","to":"tb","label":"読み書き"},{"from":"eu","to":"appb"}]}},{"id":"d2-15","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、主系のリージョンで Application Load Balancer と Auto Scaling グループで構成された Web アプリケーションを運用しています。別のリージョンには、同じ構成を最小限の台数で常時稼働させた待機系があります。主系のアプリケーションが応答しなくなったときは、ユーザーからのアクセスを自動的に待機系に切り替える必要があります。平常時は待機系にトラフィックを送りません。ソリューションアーキテクトは Amazon Route 53 をどのように設定すべきですか。","choices":["レイテンシーベースのルーティングで、両方のリージョンの ALB をエイリアスレコードとして登録する。各レコードでターゲットのヘルスを評価する。","フェイルオーバールーティングで、主系の ALB をプライマリ、待機系の ALB をセカンダリとして登録する。セカンダリのレコードにだけヘルスチェックを関連付ける。","フェイルオーバールーティングで、主系の ALB をプライマリ、待機系の ALB をセカンダリとして登録する。プライマリのレコードでターゲットのヘルスを評価する。","加重ルーティングで、両方のリージョンの ALB を 50 対 50 の重みで登録する。それぞれのレコードにヘルスチェックを関連付ける。"],"answer":[2],"why":["ユーザーごとにレイテンシーの小さいリージョンに振り分けるため、平常時も待機系にトラフィックが送られる。","ヘルスチェックのないレコードは常に正常とみなされる。プライマリのヘルスが評価されないため、主系が応答しなくなっても待機系に切り替わらない。","プライマリが異常と判定されたときだけ、セカンダリの待機系が返される。平常時は主系だけにトラフィックが送られる。","平常時から半分のトラフィックが待機系に送られる。待機系は最小限の台数のため、処理しきれないおそれもある。"],"explain":"「平常時は主系だけ」「主系の障害時に待機系へ自動で切り替え」というアクティブ/パッシブの構成には、フェイルオーバールーティングを使う。決め手はプライマリのヘルスを判定することで、ALB へのエイリアスレコードなら「ターゲットのヘルスを評価」を有効にするか、ヘルスチェックを関連付ける。ヘルスチェックのないレコードは常に正常とみなされるため、プライマリを判定しないと切り替わらない。レイテンシーベースや加重のルーティングは、複数のリージョンを同時に使うアクティブ/アクティブ向けである。","point":"アクティブ/パッシブはフェイルオーバールーティング。プライマリのヘルスを評価しないと、障害時に切り替わらない。","diagram":{"caption":"正解の構成: フェイルオーバールーティングで障害時に待機系へ切り替える","cols":4,"rows":2,"groups":[{"label":"主系のリージョン","kind":"region","c":2,"r":0,"w":2,"h":1},{"label":"待機系のリージョン","kind":"region","c":2,"r":1,"w":2,"h":1}],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"フェイルオーバー","kind":"network","c":1,"r":0},{"id":"alb1","label":"ALB（主系）","sub":"プライマリ","kind":"network","c":2,"r":0},{"id":"ec21","label":"EC2","sub":"Auto Scaling","kind":"compute","c":3,"r":0},{"id":"alb2","label":"ALB（待機系）","sub":"セカンダリ","kind":"network","c":2,"r":1},{"id":"ec22","label":"EC2","sub":"最小限の台数","kind":"compute","c":3,"r":1}],"edges":[{"from":"user","to":"r53","label":"名前解決"},{"from":"r53","to":"alb1","label":"平常時"},{"from":"r53","to":"alb2","label":"障害時のみ","style":"dashed"},{"from":"alb1","to":"ec21"},{"from":"alb2","to":"ec22"}]}},{"id":"d2-16","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、Amazon EC2 と Amazon RDS for MySQL で構成された受注システムの災害対策を、別のリージョンに構築することを計画しています。経営層は、RPO を数分以内、RTO を 1 時間以内にすることを求めています。コストを抑えるため、平常時は DR 用のリージョンでアプリケーションサーバーを稼働させず、データベースのデータだけを継続的に複製しておく方針です。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Backup で EC2 と RDS のバックアップを 1 日 1 回作成し、DR 用のリージョンにコピーする。障害時は AWS CloudFormation で環境を作成し、バックアップから復元する。","DR 用のリージョンに RDS のクロスリージョンリードレプリカを作成し、AMI と CloudFormation テンプレートを用意する。障害時はレプリカを昇格させ、サーバーを起動する。","DR 用のリージョンに RDS のクロスリージョンリードレプリカを作成し、最小台数のアプリケーションサーバーを常時稼働させる。障害時はレプリカを昇格させ、スケールアウトする。","両方のリージョンでアプリケーションサーバーとデータベースを本番と同じ規模で稼働させる。Amazon Route 53 の加重ルーティングで両方のリージョンにトラフィックを分散する。"],"answer":[1],"why":["バックアップと復元の戦略で最も安いが、1 日 1 回のバックアップでは最大 1 日分のデータを失い、RPO の数分以内を満たさない。環境の作成と復元にも時間がかかる。","パイロットライトの戦略である。データベースだけを常に複製し、アプリケーションサーバーは障害時に起動するため、平常時のコストを抑えながら RPO 数分・RTO 1 時間以内を満たせる。","ウォームスタンバイの戦略である。RPO・RTO は満たせるが、平常時もアプリケーションサーバーを稼働させるため方針に反し、コストも高くなる。","マルチサイト（アクティブ/アクティブ）の戦略である。RTO はほぼゼロにできるが、本番と同じ規模の環境を両方で動かすためコストが最も高い。"],"explain":"DR 戦略はコストの低い順に、バックアップと復元、パイロットライト、ウォームスタンバイ、マルチサイト（アクティブ/アクティブ）となり、この順に RPO・RTO を短くできる。「データは継続的に複製」「アプリケーションサーバーは平常時に動かさない」はパイロットライトの特徴そのもので、RPO は分単位、RTO は数十分程度が目安である。縮小した環境を常時動かすのがウォームスタンバイで、本問の方針に反する。","point":"パイロットライトはデータだけ常時複製してサーバーは止めておく。縮小した環境を常時稼働させるのがウォームスタンバイ。","diagram":null},{"id":"d2-17","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は AWS Organizations で約 30 のアカウントを管理しており、各アカウントで Amazon EC2、Amazon RDS、Amazon EFS、Amazon DynamoDB を使用しています。バックアップの設定はアカウントごとの担当者に任されており、監査で設定漏れが見つかりました。この企業は、全アカウントのバックアップを一元的に管理し、リージョン障害に備えて別のリージョンにもバックアップを保管することを求めています。さらに、ランサムウェア対策として、管理者権限を持つユーザーでも保持期間内のバックアップを削除できないようにする必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各アカウントで AWS Backup のバックアッププランを作成し、別のリージョンへのコピーを設定する。バックアップボールトのアクセスポリシーで、復旧ポイントの削除を拒否する。","AWS CloudFormation StackSets で、各サービスのネイティブのバックアップ設定と別のリージョンへのコピーを全アカウントに展開する。サービスコントロールポリシー（SCP）で、スナップショットとバックアップの削除を拒否する。","Organizations のバックアップポリシーで、AWS Backup のバックアッププランを全アカウントに適用する。別のリージョンへのコピーを設定し、ボールトに Vault Lock をガバナンスモードで設定する。","Organizations のバックアップポリシーで、AWS Backup のバックアッププランを全アカウントに適用する。別のリージョンへのコピーを設定し、ボールトに Vault Lock をコンプライアンスモードで設定する。"],"answer":[3],"why":["アカウントごとの設定のため一元管理にならず、設定漏れの問題が残る。ボールトのアクセスポリシーは権限を持つ管理者が変更・削除できるため、削除を確実には防げない。","サービスごとに異なるバックアップの仕組みを管理することになり運用負荷が高い。SCP は管理アカウントには適用されず、組織の管理者が変更することもできる。","一元管理と別のリージョンへの保管はできるが、ガバナンスモードのロックは十分な IAM 権限を持つユーザーが解除できるため、管理者でも削除できないという要件を満たさない。","バックアップポリシーで全アカウントのバックアップを一元的に設定でき、コピーのルールで別のリージョンにも保管できる。コンプライアンスモードの Vault Lock は、猶予期間が過ぎるとルートユーザーや AWS でも解除できず、保持期間内の削除を防げる。"],"explain":"複数アカウントのバックアップの一元管理は、AWS Backup と Organizations のバックアップポリシーの組み合わせで行う。バックアッププランのコピーのルールで、別のリージョン（必要なら別のアカウント）のボールトにも保管できる。「管理者権限を持つユーザーでも削除できない」が決め手で、AWS Backup Vault Lock をガバナンスモードではなくコンプライアンスモードで設定する。IAM・SCP・ボールトのアクセスポリシーは権限を持つ管理者が変更できるため、改ざんできない保護にはならない。","point":"複数アカウントのバックアップは AWS Backup ＋ バックアップポリシー。誰にも消せない保護は Vault Lock のコンプライアンスモード。","diagram":null},{"id":"d2-18","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある製造業の企業は、オンプレミスの VMware 環境で実行されている 20 台の業務サーバー（Windows Server と Linux、データベースサーバーを含む）の災害対策先として、AWS を使用することを計画しています。RPO は秒単位、RTO は数分から数十分である必要があります。平常時の AWS 側のコンピューティングコストは最小限に抑えたいと考えています。また、サーバーやアプリケーションごとに個別の複製の仕組みを作りたくありません。これらの要件を満たすソリューションはどれですか。","choices":["各サーバーに AWS Elastic Disaster Recovery のエージェントをインストールし、ブロックレベルで継続的に複製する。障害時に復旧用の EC2 インスタンスを起動する。","AWS Backup と Backup ゲートウェイを使用して、VMware の仮想マシンを 1 日 1 回バックアップする。障害時はバックアップから仮想マシンを復元する。","AWS Application Migration Service で各サーバーを AWS に継続的に複製し、テストの後にカットオーバーを実行する。移行が完了したらオンプレミスのサーバーを停止する。","各サーバーと同じ構成の EC2 インスタンスを AWS で常時稼働させる。アプリケーションごとにデータを同期するスクリプトを作成し、数分ごとに実行する。"],"answer":[0],"why":["エージェントがブロックレベルで継続的に複製するため RPO は秒単位になり、障害時は複製されたデータから分単位で EC2 インスタンスを起動できる。平常時は低コストのステージング領域だけが動く。","1 日 1 回のバックアップでは最大 1 日分のデータを失い、RPO の要件を満たさない。復元にも時間がかかる。","AWS への移行のためのサービスで、オンプレミスを主系のまま使い続ける災害対策には合わない。","平常時も全台を稼働させるためコンピューティングのコストが高く、アプリケーションごとに複製の仕組みを作ることにもなる。"],"explain":"オンプレミスや他のクラウドのサーバーを、OS やアプリケーションの種類によらず AWS に継続的に複製する DR には、AWS Elastic Disaster Recovery（AWS DRS）を使う。複製されたデータは低コストのステージング領域（小さなレプリケーションサーバーと EBS ボリューム）に保存され、障害時やドリル時にだけ復旧用のインスタンスを起動する。そのため「RPO 秒単位・RTO 分単位」と「平常時のコスト最小」を両立できる。Application Migration Service も同様の複製技術を使うが、目的は移行である。","point":"サーバーを丸ごと AWS に継続複製する DR は Elastic Disaster Recovery。平常時はステージング領域だけで低コスト。","diagram":{"caption":"正解の構成: Elastic Disaster Recovery で継続複製し、障害時に起動する","cols":3,"rows":2,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":1,"h":2},{"label":"DR 用のリージョン","kind":"region","c":1,"r":0,"w":2,"h":2},{"label":"ステージング領域","kind":"subnet-private","c":1,"r":0,"w":2,"h":1},{"label":"復旧用サブネット","kind":"subnet-private","c":1,"r":1,"w":2,"h":1}],"nodes":[{"id":"srv","label":"業務サーバー","sub":"エージェント導入","kind":"onprem","c":0,"r":0},{"id":"rep","label":"複製サーバー","sub":"小さな EC2","kind":"compute","c":1,"r":0},{"id":"ebs","label":"EBS","sub":"複製データ","kind":"storage","c":2,"r":0},{"id":"rec","label":"復旧用 EC2","sub":"障害時に起動","kind":"compute","c":2,"r":1}],"edges":[{"from":"srv","to":"rep","label":"継続的に複製"},{"from":"rep","to":"ebs"},{"from":"ebs","to":"rec","label":"障害時のみ","style":"dashed"}]}},{"id":"d2-19","domain":2,"topic":"S3","type":"multi","stem":"ある医療系サービス事業者は、診療画像を Amazon S3 バケットに保存しています。規制に対応するため、別のリージョンにもデータのコピーを保持することになりました。新しくアップロードされたオブジェクトは、15 分以内に別のリージョンに複製されることが SLA で裏付けられている必要があります。また、すでにバケットに保存されている数年分のオブジェクトも、複製先に含める必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["送信元と送信先のバケットでバージョニングを有効にする。S3 Replication Time Control（S3 RTC）を有効にしたクロスリージョンレプリケーションのルールを作成する。","送信元のバケットで S3 Transfer Acceleration を有効にする。アプリケーションを変更し、両方のリージョンのバケットにそれぞれアップロードする。","送信元のバケットで S3 同一リージョンレプリケーションのルールを作成し、既存のオブジェクトも含めて別のバケットに複製する。","S3 バッチレプリケーションのジョブを作成し、レプリケーションのルールを設定する前から存在するオブジェクトを送信先に複製する。","S3 マルチリージョンアクセスポイントを作成し、既存のオブジェクトを含めて各リージョンのバケットの内容を同期させる。"],"answer":[0,3],"why":["クロスリージョンレプリケーションにはバージョニングが必要である。S3 RTC を有効にすると、新しいオブジェクトの 99.99% を 15 分以内に複製することが SLA で裏付けられる。","Transfer Acceleration はクライアントからの転送を速くする機能で、複製の仕組みではない。両方に書き込む処理を自前で作ることになり、SLA の裏付けもない。","同一リージョンレプリケーションは同じリージョン内のバケットに複製する機能で、別のリージョンにコピーを保持する要件を満たさない。ルールを作成しても既存のオブジェクトは対象にならない。","レプリケーションのルールは、設定後に追加されたオブジェクトだけが対象になる。既存のオブジェクトは S3 バッチレプリケーションで複製する。","マルチリージョンアクセスポイントはリクエストを適切なバケットに振り分ける入口で、バケット間の複製はレプリケーションのルールで別に設定する。既存のオブジェクトを同期する機能はない。"],"explain":"要件を 2 つに分けて考える。「新しいオブジェクトを 15 分以内に複製、SLA で裏付け」は、クロスリージョンレプリケーション（CRR）で S3 RTC を有効にすることで満たせる。「既存のオブジェクトも複製」は、レプリケーションのルールが設定後の新しいオブジェクトだけを対象にするため、S3 バッチレプリケーションで別に複製する。CRR の前提として、送信元・送信先の両方でバージョニングを有効にしておく必要がある。","point":"S3 のレプリケーションは設定後の新規オブジェクトだけが対象。既存分はバッチレプリケーション、15 分の SLA は S3 RTC。","diagram":{"caption":"正解の構成: 新規は CRR と S3 RTC、既存分はバッチレプリケーションで複製","cols":3,"rows":2,"groups":[{"label":"送信元のリージョン","kind":"region","c":0,"r":0,"w":1,"h":2},{"label":"送信先のリージョン","kind":"region","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"src","label":"送信元バケット","sub":"バージョニング有効","kind":"storage","c":0,"r":0},{"id":"batch","label":"バッチ複製ジョブ","sub":"既存のオブジェクト","kind":"management","c":0,"r":1},{"id":"dst","label":"送信先バケット","sub":"バージョニング有効","kind":"storage","c":2,"r":0}],"edges":[{"from":"src","to":"dst","label":"RTC: 15 分以内","style":"dashed"},{"from":"src","to":"batch","label":"既存分"},{"from":"batch","to":"dst","label":"一括で複製","style":"dashed"}]}},{"id":"d2-20","domain":2,"topic":"EFS・FSx","type":"single","stem":"ある出版社の Web サイトは、Auto Scaling グループ内の Linux の Amazon EC2 インスタンスで実行されるコンテンツ管理システム（CMS）で運用されています。CMS は記事の画像やテンプレートを、POSIX 準拠の共有ディレクトリ上のファイルとして読み書きします。現在は 1 台の EC2 インスタンスで NFS サーバーを実行して共有しているため、単一障害点になっています。複数の AZ のすべてのインスタンスから同時にマウントでき、1 つの AZ が停止しても読み書きを継続できる必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Multi-Attach を有効にした Amazon EBS io2 ボリュームを作成する。すべての EC2 インスタンスにボリュームをアタッチして共有する。","Amazon EFS の 1 ゾーンファイルシステムを作成する。各 AZ のインスタンスから、同じマウントターゲットを使ってマウントする。","Amazon EFS のリージョンファイルシステムを作成し、各 AZ にマウントターゲットを作成する。インスタンスは同じ AZ のマウントターゲットからマウントする。","Amazon FSx for Windows File Server のマルチ AZ ファイルシステムを作成する。各インスタンスから SMB でファイル共有をマウントする。"],"answer":[2],"why":["EBS の Multi-Attach は同じ AZ のインスタンスに限られ、複数の AZ から共有できない。同時の書き込みにはクラスター対応のファイルシステムも必要になる。","データとマウントターゲットが 1 つの AZ にあるため、その AZ が停止するとファイルシステムを使えなくなる。","データは複数の AZ に冗長化して保存され、各 AZ のマウントターゲットからマウントできる。1 つの AZ が停止しても残りの AZ のインスタンスは読み書きを続けられ、サーバーの管理も不要である。","マルチ AZ で可用性は高いが、SMB のファイル共有で Windows 向けのサービスであり、Linux の CMS が前提とする POSIX 準拠の共有ファイルシステムには合わない。"],"explain":"「Linux」「POSIX 準拠」「複数の AZ から同時にマウント」「AZ の停止に耐える」「運用効率」がそろったら、Amazon EFS のリージョンファイルシステムを選ぶ。各 AZ にマウントターゲットを作り、インスタンスは同じ AZ のマウントターゲットからマウントするのが推奨である。1 ゾーンファイルシステムは低コストだが AZ の障害に耐えない。FSx for Windows File Server は Windows の SMB 共有向けであり、EBS は 1 つの AZ に閉じたブロックストレージである。","point":"複数 AZ の Linux インスタンスでファイルを共有するなら EFS（リージョン）。1 ゾーンは安いが AZ 障害に弱い。","diagram":{"caption":"正解の構成: 各 AZ のマウントターゲットから EFS を共有する","cols":3,"rows":2,"groups":[{"label":"AZ a","kind":"az","c":0,"r":0,"w":1,"h":2},{"label":"AZ b","kind":"az","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"ec2a","label":"CMS（EC2）","sub":"Auto Scaling","kind":"compute","c":0,"r":0},{"id":"mta","label":"EFS マウント","sub":"ターゲット（AZ a）","kind":"network","c":0,"r":1},{"id":"efs","label":"Amazon EFS","sub":"複数 AZ に冗長化","kind":"storage","c":1,"r":1},{"id":"ec2b","label":"CMS（EC2）","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"mtb","label":"EFS マウント","sub":"ターゲット（AZ b）","kind":"network","c":2,"r":1}],"edges":[{"from":"ec2a","to":"mta","label":"NFS"},{"from":"ec2b","to":"mtb","label":"NFS"},{"from":"mta","to":"efs"},{"from":"mtb","to":"efs"}]}},{"id":"d2-21","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、モノリシックな Web アプリケーションを、注文 API、在庫 API、管理画面の 3 つのマイクロサービスに分割しています。各サービスは別々の Auto Scaling グループの Amazon EC2 インスタンスで実行され、独立してスケールさせる必要があります。クライアントは単一のドメイン名 shop.example.com を使用し、サービスはパス（/orders/*、/inventory/*、/admin/*）で区別されます。ソリューションアーキテクトは、ドメイン名を変更せず、運用上のオーバーヘッドを最小限に抑えてリクエストを各サービスに振り分ける必要があります。これらの要件を満たすソリューションはどれですか。","choices":["サービスごとに Network Load Balancer を作成する。Amazon Route 53 のレコードでパスごとに異なる NLB へ振り分ける。","Application Load Balancer を 1 つ作成する。パスパターン条件のリスナールールでサービスごとのターゲットグループに転送し、各 Auto Scaling グループを対応するターゲットグループに関連付ける。","サービスごとに Application Load Balancer を作成する。Amazon CloudFront ディストリビューションに 3 つのオリジンを登録し、パスごとのキャッシュビヘイビアで振り分ける。","Network Load Balancer を 1 つ作成し、サービスごとに異なるリスナーポートを割り当てる。クライアントが接続先のポート番号を指定するようにする。"],"answer":[1],"why":["Route 53 の DNS 応答はドメイン名の解決までで、URL のパスを見て振り分けることはできない。NLB もレイヤー 4 で動作しパスを判別できない。","ALB はレイヤー 7 でパスやホスト名を見て、リスナールールによりターゲットグループを選べる。ターゲットグループを Auto Scaling グループに関連付ければ、サービスごとに独立してスケールできる。","パスで振り分けること自体は可能だが、ALB が 3 つと CloudFront が必要になり、構成も管理対象も増える。1 つの ALB で足りる要件に対して運用負荷が大きい。","NLB はパスを判別できず、ポートでの振り分けではクライアント側の変更が必要になる。パスで区別するという要件も満たさない。"],"explain":"「単一のドメイン名」「パスでサービスを区別」「運用上のオーバーヘッドを最小限」がそろったら、1 つの ALB のパスベースルーティングを選ぶ。ALB はリスナールールにパスパターン、ホストヘッダー、HTTP ヘッダーなどの条件を設定でき、条件ごとに別のターゲットグループへ転送できる。ターゲットグループは Auto Scaling グループと関連付けられるので、サービスごとに独立したスケーリングも実現できる。","point":"HTTP の内容（パス・ホスト名）で振り分けるのは ALB のリスナールール。1 つの ALB で複数のマイクロサービスを受けられる。","diagram":{"caption":"正解の構成: 1 つの ALB がパスでターゲットグループを振り分ける","cols":3,"rows":3,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"shop.example.com","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"パスベースルール","kind":"network","c":1,"r":1},{"id":"orders","label":"注文サービス","sub":"/orders/* の ASG","kind":"compute","c":2,"r":0},{"id":"inv","label":"在庫サービス","sub":"/inventory/* の ASG","kind":"compute","c":2,"r":1},{"id":"admin","label":"管理画面","sub":"/admin/* の ASG","kind":"compute","c":2,"r":2}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"orders"},{"from":"alb","to":"inv"},{"from":"alb","to":"admin"}]}},{"id":"d2-22","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、独自の TCP プロトコルを使うアプリケーションを、2 つの AZ に配置した Amazon EC2 インスタンスで実行しており、前段に Network Load Balancer（NLB）を使用しています。インスタンスは AZ-a に 2 台、AZ-b に 8 台あります。クライアントからの接続は各 AZ にほぼ均等に届いていますが、AZ-a のインスタンスだけ CPU 使用率が極端に高くなっています。ソリューションアーキテクトは、インスタンスの台数を変更せず、アプリケーションも変更せずに、すべてのインスタンスへ均等に負荷を分散させる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["NLB を Application Load Balancer に置き換える。ALB の既定のクロスゾーン負荷分散を利用する。","NLB の AZ ごとの DNS 名を使い、Route 53 の加重ルーティングで AZ-a に 2、AZ-b に 8 の重みを設定する。クライアントにはその DNS 名で接続させる。","ターゲットグループのスティッキーセッションを無効にし、接続のアイドルタイムアウトを短くする。","NLB でクロスゾーン負荷分散を有効にする。"],"answer":[3],"why":["独自の TCP プロトコルは ALB（HTTP/HTTPS 向け）では扱えない。ALB はクロスゾーンが既定で有効だが、プロトコルの要件を満たさない。","DNS で AZ 間の比率を調整できるが、AZ ごとの DNS 名の管理が必要になり、クライアント側の DNS キャッシュにも影響される。台数が変わるたびに重みの見直しも要り、運用負荷が大きい。","NLB は AZ ごとに受けた接続をその AZ のターゲットに分けるため、接続の持続時間を調整しても AZ 間の偏りは解消しない。","クロスゾーン負荷分散を有効にすると、各 NLB ノードがすべての AZ のターゲットへ均等に分散する。台数の偏りがあっても負荷は均等になる。AZ をまたぐデータ転送料金がかかる点には注意が必要。"],"explain":"NLB は既定でクロスゾーン負荷分散が無効で、各 AZ のノードは自分の AZ のターゲットにだけ転送する。そのため AZ 間でインスタンス数に差があると、台数の少ない AZ に負荷が集中する。TCP のまま「台数もアプリケーションも変えずに」均等化するには、NLB のクロスゾーン負荷分散を有効にする。ALB は既定で有効だが、TCP には使えない。","point":"NLB のクロスゾーン負荷分散は既定で無効（ALB は既定で有効）。有効にすると AZ 間のデータ転送料金がかかる。","diagram":{"caption":"正解の構成: NLB のクロスゾーンで全インスタンスに均等に分散","cols":3,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":2,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":2,"r":1,"w":1,"h":1}],"nodes":[{"id":"client","label":"クライアント","sub":"TCP 接続","kind":"client","c":0,"r":0},{"id":"nlb","label":"NLB","sub":"クロスゾーン有効","kind":"network","c":1,"r":0},{"id":"a","label":"EC2 2 台","sub":"AZ-a のターゲット","kind":"compute","c":2,"r":0},{"id":"b","label":"EC2 8 台","sub":"AZ-b のターゲット","kind":"compute","c":2,"r":1}],"edges":[{"from":"client","to":"nlb"},{"from":"nlb","to":"a","label":"全台に均等"},{"from":"nlb","to":"b","label":"全台に均等"}]}},{"id":"d2-23","domain":2,"topic":"Auto Scaling","type":"multi","stem":"ある企業は、Application Load Balancer の背後にある複数 AZ の Auto Scaling グループで Web アプリケーションを実行しています。先日、アプリケーションのプロセスがハングしましたが、EC2 インスタンス自体は実行中のままでした。ALB のヘルスチェックには失敗してトラフィックは止まったものの、Auto Scaling グループは障害のあるインスタンスを置き換えず、手動での対応が必要になりました。新しいインスタンスはアプリケーションの初期化が完了するまでに約 4 分かかります。ソリューションアーキテクトは、このような障害のインスタンスを自動的に置き換え、起動中のインスタンスが誤って終了されないようにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Auto Scaling グループのヘルスチェックタイプを ELB に変更する。","インスタンスステータスチェックの失敗を検知する Amazon CloudWatch アラームを作成し、失敗したインスタンスを再起動するアクションを設定する。","ALB のターゲットグループのヘルスチェック間隔を最小値に短縮する。","ヘルスチェックの猶予期間を、アプリケーションの初期化時間（約 4 分）より長く設定する。","Auto Scaling グループの最小インスタンス数を現在の 2 倍に引き上げる。"],"answer":[0,3],"why":["Auto Scaling グループは既定では EC2 のステータスチェックだけで判断する。ヘルスチェックタイプを ELB にすると、ロードバランサーが異常と判断したインスタンスも置き換え対象になる。","インスタンスステータスチェックはインスタンスの OS レベルの異常を見るもので、アプリケーションのハングは検知できない場合が多い。再起動で解決する保証もなく、ALB の判断とも連動しない。","ヘルスチェックの検出は早くなるが、Auto Scaling グループが ALB の結果を参照しない限り、インスタンスは置き換えられない。","猶予期間は、起動直後のインスタンスのヘルスチェック結果を無視する時間。初期化時間より長くしないと、ELB ヘルスチェックを有効にしたときに起動中のインスタンスが異常と判定され、置き換えが繰り返される。","台数を増やしても、異常なインスタンスは置き換えられずに残る。コストが増えるだけで、障害の自動復旧にはならない。"],"explain":"「ALB は異常と判断しているのに Auto Scaling が置き換えない」は、グループのヘルスチェックタイプが既定の EC2 のままである典型的な症状。タイプを ELB に変えれば解決するが、このとき初期化に時間がかかるアプリケーションでは猶予期間が短いと起動中に異常判定されて置き換えのループになる。そのため猶予期間を初期化時間より長く設定する。","point":"Auto Scaling のヘルスチェックは既定で EC2 のみ。ALB の判定で置き換えるにはタイプを ELB にし、猶予期間は初期化時間より長くする。","diagram":null},{"id":"d2-24","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、Auto Scaling グループの Amazon EC2 インスタンスで、キューから取得したジョブを処理するバッチアプリケーションを実行しています。スケールインでインスタンスが終了すると、処理中のジョブが失われ、ローカルディスクのログが Amazon S3 にアップロードされないまま消えてしまいます。ジョブの完了とログのアップロードには最大 10 分かかります。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑え、インスタンスが終了する前にこれらの処理を完了させる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループのスケールイン保護を、すべてのインスタンスに対して常時有効にする。","スケールインのクールダウン期間を 10 分に設定する。","Terminating のライフサイクルフックを追加する。Terminating:Wait の通知を Amazon EventBridge 経由で AWS Lambda に渡し、Lambda がジョブの完了とログのアップロードを実行する。完了後に complete-lifecycle-action API を呼び出す。","各インスタンスの終了保護を有効にし、ジョブが終わったインスタンスから運用担当者が手動で終了保護を解除する。"],"answer":[2],"why":["常時保護するとスケールインが一切行われなくなり、不要なインスタンスが残ってコストが増える。スケーリングの目的を損なう。","クールダウンはスケーリングアクティビティ間の待機時間で、終了対象に選ばれたインスタンスの終了を遅らせる機能ではない。処理中のジョブを守れない。","ライフサイクルフックはインスタンスを Terminating:Wait の状態で止めて、終了前に任意の処理を実行できる。処理が終わったら complete-lifecycle-action で終了を進める。ハートビートタイムアウトを処理時間より長くしておく。","終了保護は API による終了を防ぐ設定で、Auto Scaling のスケールインによる終了は止められない。手動対応にもなり、運用負荷が大きい。"],"explain":"「終了する前に処理を完了させる」は Auto Scaling のライフサイクルフックの典型的な用途。Terminating のフックを設定すると、インスタンスは Terminating:Wait で一時停止し、その間に EventBridge から Lambda や Systems Manager を起動して終了前の処理を実行できる。完了後に complete-lifecycle-action を呼ぶと終了が再開する。起動時の初期設定には Pending のフックを使う。","point":"スケールイン時の終了前処理や、起動時の初期設定はライフサイクルフック（Terminating:Wait / Pending:Wait）で行う。","diagram":{"caption":"正解の構成: Terminating のライフサイクルフックで終了前に処理","cols":3,"rows":2,"groups":[],"nodes":[{"id":"asg","label":"Auto Scaling","sub":"Terminating:Wait","kind":"compute","c":0,"r":0},{"id":"eb","label":"EventBridge","sub":"フックのイベント","kind":"integration","c":1,"r":0},{"id":"fn","label":"Lambda","sub":"ジョブ完了を確認","kind":"serverless","c":1,"r":1},{"id":"s3","label":"S3 バケット","sub":"ログを保存","kind":"storage","c":2,"r":1}],"edges":[{"from":"asg","to":"eb","label":"フック発行"},{"from":"eb","to":"fn"},{"from":"fn","to":"s3","label":"ログ保存"},{"from":"fn","to":"asg","label":"完了を通知","style":"dashed"}]}},{"id":"d2-25","domain":2,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、Amazon S3 バケットへの画像のアップロードをトリガーに AWS Lambda 関数を呼び出し、サムネイルを生成しています。ときどき一時的なエラーで関数が失敗し、Lambda による再試行も失敗すると、そのイベントが失われてしまいます。運用チームは、失敗したイベントを、失敗の原因を示すエラー情報と一緒に保持して、後から調査・再処理できるようにしたいと考えています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えてこの要件を満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["関数の非同期呼び出しの設定で、失敗時の送信先として Amazon SQS キューを指定する。","関数に予約済み同時実行数を設定して、スロットリングによる失敗が起きないようにする。","S3 イベント通知の送信先を Amazon SNS トピックに変更し、Lambda 関数をそのサブスクライバーにする。","関数のコードにすべての例外を捕捉する処理を追加し、失敗したイベントを Amazon CloudWatch Logs に出力する。"],"answer":[0],"why":["S3 からの呼び出しは非同期呼び出しで、Lambda が既定で 2 回再試行する。失敗時の送信先（Destinations）を設定すると、再試行後も失敗したイベントがエラー情報とともに SQS に送られる。コードの変更は不要。","予約済み同時実行数はスロットリングの緩和には役立つが、コードのエラーやタイムアウトによる失敗は防げず、失敗したイベントを保持する仕組みにもならない。","SNS を経由しても Lambda の呼び出しは非同期のままで、失敗時の送信先を設定しない限り、再試行後のイベントは失われる。構成が増えるだけである。","タイムアウトやメモリ不足など、関数がコードを実行できずに失敗するケースでは捕捉できない。ログから再処理するための追加の仕組みも必要になり、運用負荷が大きい。"],"explain":"S3、SNS、EventBridge などからの呼び出しは非同期呼び出しで、失敗すると Lambda が自動で再試行し、それでも失敗したイベントは破棄される。「失敗したイベントを保持」「エラー情報も一緒に」の要件には、非同期呼び出しの失敗時の送信先（SQS、SNS、Lambda、EventBridge）を設定する。デッドレターキューでも保持できるが、送信先の方が関数のエラー情報など実行の詳細を含められる。","point":"Lambda の非同期呼び出しの失敗は、送信先（Destinations）か DLQ で保持する。エラー情報も必要なら送信先を選ぶ。","diagram":{"caption":"正解の構成: 非同期呼び出しの失敗時の送信先に SQS を指定","cols":3,"rows":1,"groups":[],"nodes":[{"id":"s3","label":"S3 バケット","sub":"画像アップロード","kind":"storage","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"サムネイル生成","kind":"serverless","c":1,"r":0},{"id":"sqs","label":"SQS キュー","sub":"失敗イベントを保持","kind":"integration","c":2,"r":0}],"edges":[{"from":"s3","to":"fn","label":"非同期呼び出し"},{"from":"fn","to":"sqs","label":"再試行後も失敗","style":"dashed"}]}},{"id":"d2-26","domain":2,"topic":"Lambda・サーバーレス","type":"multi","stem":"ある企業は、Amazon SQS 標準キューをイベントソースとして AWS Lambda 関数でメッセージを処理しています。バッチサイズは 10 に設定されています。バッチ内の 1 つのメッセージの処理に失敗すると関数がエラーを返し、バッチ全体がキューに戻るため、成功済みのメッセージも重複して処理されてしまいます。また、繰り返し失敗するメッセージが、他のメッセージの処理を妨げています。ソリューションアーキテクトは、失敗したメッセージだけを再処理し、繰り返し失敗するメッセージを隔離する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["関数に予約済み同時実行数を設定し、並列に処理されるバッチの数を減らす。","イベントソースマッピングでバッチアイテムの失敗の報告を有効にする。関数は処理に失敗したメッセージの ID だけを batchItemFailures として返す。","キューの可視性タイムアウトを 0 秒にして、失敗したメッセージがすぐに再取得されるようにする。","標準キューを FIFO キューに置き換え、メッセージグループ ID を 1 つに統一する。","ソースキューにデッドレターキューを設定し、maxReceiveCount を指定して、繰り返し失敗したメッセージをデッドレターキューに移動する。"],"answer":[1,4],"why":["同時実行数を絞っても、バッチ内の 1 件の失敗でバッチ全体が戻る動作は変わらない。重複処理も、失敗メッセージの隔離も解決しない。","部分的なバッチ応答を使うと、Lambda は失敗したメッセージだけをキューに戻し、成功したメッセージは削除する。重複処理を避けられる。","可視性タイムアウトを 0 にすると、処理中のメッセージが別のコンシューマーにすぐ見えてしまい、重複処理が増える。失敗メッセージの隔離にもならない。","FIFO にしてグループ ID を 1 つにすると、1 件の失敗が後続のメッセージをすべて止めてしまう。隔離にならず、並列処理もできなくなる。","受信回数が maxReceiveCount を超えたメッセージを DLQ に移せば、繰り返し失敗するメッセージが他の処理を妨げなくなる。DLQ は後で調査・再処理できる。"],"explain":"SQS をイベントソースにする Lambda は、既定では関数がエラーを返すとバッチ全体を戻す。失敗したメッセージだけを戻すには、イベントソースマッピングの ReportBatchItemFailures を有効にして、失敗したメッセージの ID を返す。それでも失敗し続けるメッセージはソースキュー側の DLQ（redrive policy）に隔離する。DLQ は関数ではなくソースキューに設定する点に注意する。","point":"SQS と Lambda は、ReportBatchItemFailures で失敗分だけ再処理し、ソースキューの DLQ で繰り返し失敗するメッセージを隔離する。","diagram":null},{"id":"d2-27","domain":2,"topic":"VPC","type":"single","stem":"ある企業は、2 つの AZ にまたがる VPC を使用しています。各 AZ のプライベートサブネットにある Amazon EC2 インスタンスは、片方の AZ のパブリックサブネットにある 1 つの NAT ゲートウェイを経由して、インターネット上の外部 API にアクセスしています。先日、その NAT ゲートウェイがある AZ で障害が発生したところ、もう一方の AZ のインスタンスも外部 API にアクセスできなくなりました。ソリューションアーキテクトは、AZ の障害による影響をその AZ 内に閉じ込め、可用性を最大化する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["既存の NAT ゲートウェイに Elastic IP アドレスを追加で関連付け、帯域幅を増やす。","もう一方の AZ のプライベートサブネットのルートテーブルに、インターネットゲートウェイへのデフォルトルートを追加する。","障害時に NAT ゲートウェイの Elastic IP アドレスを、もう一方の AZ に作成した NAT インスタンスへ手動で付け替える手順書を整備する。","各 AZ のパブリックサブネットに NAT ゲートウェイを作成し、各 AZ のプライベートサブネットのルートテーブルを、同じ AZ の NAT ゲートウェイに向ける。"],"answer":[3],"why":["Elastic IP アドレスの追加は、同時接続の上限の緩和などに使うもので、AZ の障害に対しては何も変わらない。NAT ゲートウェイは依然として 1 つの AZ に依存する。","プライベートサブネットのインスタンスにパブリック IP アドレスがなければ、インターネットゲートウェイ経由では通信できない。仮にパブリック IP を付ければ、プライベートサブネットにする意味がなくなる。","手動の切り替えは、障害時の復旧に時間がかかり、手順の誤りも起こりうる。NAT インスタンスの管理と運用も必要になり、可用性を最大化できない。","NAT ゲートウェイは 1 つの AZ 内で冗長化される。AZ ごとに配置し、同じ AZ のルートを向ければ、障害の影響がその AZ に閉じ、AZ をまたぐデータ転送料金もかからない。"],"explain":"NAT ゲートウェイは AZ 単位のリソースで、1 つの AZ に置くとその AZ の障害で全 AZ の外向き通信が止まる。「AZ の障害の影響をその AZ 内に閉じ込める」には、AZ ごとに NAT ゲートウェイを作り、各 AZ のプライベートサブネットのルートテーブルを自分の AZ の NAT ゲートウェイに向ける。これで AZ 間のデータ転送料金も避けられる。","point":"NAT ゲートウェイは AZ ごとに作成し、各 AZ のプライベートサブネットは同じ AZ の NAT ゲートウェイを指す。","diagram":{"caption":"正解の構成: AZ ごとの NAT ゲートウェイで障害を AZ 内に閉じ込める","cols":4,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":2},{"label":"AZ-a","kind":"az","c":0,"r":0,"w":2,"h":1},{"label":"AZ-b","kind":"az","c":0,"r":1,"w":2,"h":1}],"nodes":[{"id":"eca","label":"EC2","sub":"プライベート (a)","kind":"compute","c":0,"r":0},{"id":"nata","label":"NAT ゲートウェイ","sub":"AZ-a に配置","kind":"network","c":1,"r":0},{"id":"ecb","label":"EC2","sub":"プライベート (b)","kind":"compute","c":0,"r":1},{"id":"natb","label":"NAT ゲートウェイ","sub":"AZ-b に配置","kind":"network","c":1,"r":1},{"id":"igw","label":"IGW","sub":"インターネット GW","kind":"network","c":2,"r":0},{"id":"api","label":"外部 API","kind":"client","c":3,"r":0}],"edges":[{"from":"eca","to":"nata"},{"from":"ecb","to":"natb"},{"from":"nata","to":"igw"},{"from":"natb","to":"igw"},{"from":"igw","to":"api"}]}},{"id":"d2-28","domain":2,"topic":"EC2","type":"single","stem":"ある企業は、オンプレミスから移行したレガシーアプリケーションを、単一の Amazon EC2 インスタンスで実行しています。このアプリケーションは複数インスタンスでの実行に対応しておらず、ライセンスがインスタンスのプライベート IP アドレスに紐づいています。インスタンスは Amazon EBS ボリュームだけを使用しています。ソリューションアーキテクトは、基盤ハードウェアの障害が発生したときに、インスタンス ID、プライベート IP アドレス、EBS 上のデータを維持したまま、自動的にインスタンスを復旧させる必要があります。運用上のオーバーヘッドは最小限にします。これらの要件を満たすソリューションはどれですか。","choices":["StatusCheckFailed_System メトリクスを監視する Amazon CloudWatch アラームを作成し、EC2 の復旧アクションを設定する。","インスタンスを最小・最大 1 台の Auto Scaling グループに入れ、障害時に新しいインスタンスを起動させる。","AMI を日次で作成する。障害時に Lambda 関数でその AMI から新しいインスタンスを起動する。","インスタンスを 2 台にして、Amazon Route 53 のフェイルオーバールーティングでヘルスチェックに失敗したら待機系に切り替える。"],"answer":[0],"why":["システムステータスチェックの失敗に対して復旧アクションを設定すると、同じインスタンス ID、プライベート IP アドレス、EBS ボリュームを保ったまま、正常なハードウェアへ移して再起動できる。","Auto Scaling グループは障害のあるインスタンスを置き換えるため、新しいインスタンス ID と別のプライベート IP アドレスになる。ライセンスが IP アドレスに紐づく要件を満たさない。","AMI から起動した新しいインスタンスは ID も IP アドレスも変わる。AMI 作成後に更新されたデータも失われる。Lambda の作り込みと保守も必要になる。","アプリケーションは複数インスタンスでの実行に対応しておらず、ライセンスも IP アドレスに紐づいている。待機系の追加はライセンス・データ同期の面でも要件に合わない。"],"explain":"「単一インスタンス」「インスタンス ID・プライベート IP・データを維持」「ハードウェア障害から自動復旧」は、EC2 の自動復旧の典型的な要件。CloudWatch アラームの復旧アクションは、インスタンスを同じ構成で別のハードウェアに移す。置き換えではなく復旧なので、ID や IP アドレスが変わらない。インスタンスストアボリュームだけを使う場合は復旧できない。なお、対応するインスタンスタイプでは簡易自動復旧が既定で有効になっているが、CloudWatch アラームの復旧アクションを設定すると、復旧の条件を明示でき、Amazon SNS での通知も組み合わせられる。","point":"同じインスタンス ID と IP を保って自動復旧するなら、StatusCheckFailed_System のアラーム＋復旧アクション。ASG は置き換えで ID と IP が変わる。","diagram":{"caption":"正解の構成: CloudWatch アラームの復旧アクションでインスタンスを復旧","cols":2,"rows":2,"groups":[],"nodes":[{"id":"ec2","label":"EC2","sub":"単一インスタンス","kind":"compute","c":0,"r":0},{"id":"cw","label":"CW アラーム","sub":"システム障害を検知","kind":"management","c":1,"r":0},{"id":"ebs","label":"EBS ボリューム","sub":"データを維持","kind":"storage","c":0,"r":1}],"edges":[{"from":"ec2","to":"cw","label":"復旧アクション","both":true},{"from":"ec2","to":"ebs"}]}},{"id":"d2-29","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、オンプレミスのデータセンターで稼働している Web アプリケーションを、AWS の Application Load Balancer の背後にある環境へ移行しています。DNS は Amazon Route 53 のパブリックホストゾーンで管理しており、www.example.com は現在、オンプレミスの IP アドレスを指す A レコードです。この企業は、まず全体の 5% のトラフィックだけを AWS に送り、問題がなければ割合を段階的に増やしたいと考えています。問題が見つかった場合は、すぐにすべてのトラフィックをオンプレミスに戻す必要があります。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて、この要件を満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["オンプレミスと ALB のレコードにレイテンシーベースルーティングを設定する。AWS 側のレイテンシーが低いクライアントが AWS に流れるようにする。","オンプレミスをプライマリ、ALB をセカンダリとするフェイルオーバールーティングを設定する。AWS に流したい割合に応じてヘルスチェックの結果を調整する。","同じ名前で加重ルーティングのレコードを 2 つ作成する。オンプレミスの重みを 95、ALB へのエイリアスレコードの重みを 5 にし、オンプレミス側の TTL を短くする。割合は段階的に重みを変更する。","オンプレミスと ALB のレコードに位置情報ルーティングを設定する。トラフィックの一部が届く地域を AWS 向けに指定する。"],"answer":[2],"why":["レイテンシーベースは、クライアントに近い（応答が速い）リージョンへ振り分ける方式で、割合を指定できない。オンプレミスはリージョンでもないため、5% という比率の制御ができない。","フェイルオーバーは、プライマリが異常なときだけセカンダリに切り替える方式で、平常時に一部だけを流すことはできない。割合を調整するためにヘルスチェックを意図的に操作するのは不適切。","加重ルーティングは、レコードごとの重みの比率でトラフィックを分けられる。重みを変えるだけで割合を段階的に増やせ、重みを 0 にすれば即座にオンプレミスだけに戻せる。TTL を短くしておくと切り替えが早く反映される。","位置情報ルーティングは、クライアントの場所で振り分ける方式で、割合を指定できない。特定地域のユーザーは全員が AWS に流れ、段階的な移行にならない。"],"explain":"「5% だけ送る」「段階的に増やす」「問題があれば即座に戻す」は、割合で振り分ける加重ルーティングの用途。重みはレコード間の相対比で、重みを 0 にするとそのレコードにはトラフィックが流れない。DNS キャッシュのため切り替えには TTL 分の遅れがあるので、移行前に TTL を短くしておく。フェイルオーバー、レイテンシー、位置情報は割合の制御には使えない。","point":"割合を指定してトラフィックを分けるのは加重ルーティング。段階的な移行やブルー/グリーンの切り替えに使う。重み 0 で即時に切り戻せる。","diagram":{"caption":"正解の構成: 加重ルーティングで 5% だけ AWS に流す","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"www.example.com","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"加重ルーティング","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"AWS の新環境","kind":"network","c":2,"r":0},{"id":"onprem","label":"オンプレミス","sub":"現行の環境","kind":"onprem","c":2,"r":1}],"edges":[{"from":"user","to":"r53"},{"from":"r53","to":"alb","label":"重み 5"},{"from":"r53","to":"onprem","label":"重み 95"}]}},{"id":"d2-30","domain":2,"topic":"DynamoDB","type":"single","stem":"ある企業は、注文データを Amazon DynamoDB テーブルに保存しています。先日、アプリケーションのバグにより、ある時間帯に多数の項目が誤って上書きおよび削除されました。この企業は、今後同様の問題が発生した場合に、バグが発生する直前の任意の時点の状態までデータを戻せるようにしたいと考えています。テーブルの読み書きのパフォーマンスに影響を与えず、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["別のリージョンにレプリカを持つグローバルテーブルを構成する。問題が発生したら、レプリカからデータを戻す。","ポイントインタイムリカバリ（PITR）を有効にする。問題が発生したら、直前の時点を指定して新しいテーブルに復元する。","1 時間ごとに AWS Lambda 関数でテーブルの全項目を Amazon S3 に書き出す。問題が発生したら、直近のファイルからデータを読み込み直す。","DynamoDB Streams を有効にし、変更内容を Amazon S3 に保存する。問題が発生したら、保存した変更を手動でさかのぼって適用する。"],"answer":[1],"why":["グローバルテーブルは、更新も削除もすべてのレプリカに複製される。誤った上書きや削除も他のリージョンに伝わり、データを戻す手段にならない。","PITR を有効にすると、過去 35 日以内の任意の時点（秒単位）に復元できる。バックアップはテーブルのパフォーマンスに影響せず、復元は新しいテーブルに対して行われる。","1 時間ごとの書き出しでは、復元できるのは書き出した時点だけで、任意の時点には戻せない。全項目のスキャンは読み取り容量を消費し、Lambda の作り込みと保守も必要になる。","変更履歴を保存しても、特定の時点の状態に戻すには、変更を順に適用し直す独自の仕組みが必要になる。運用負荷が大きく、確実性も低い。"],"explain":"「バグ発生直前の任意の時点に戻す」「パフォーマンスに影響なし」「運用上のオーバーヘッド最小」には、DynamoDB のポイントインタイムリカバリを選ぶ。有効にすると継続的にバックアップされ、過去 35 日以内の任意の時点を指定して新しいテーブルに復元できる。復元後は、アプリケーションの向き先を切り替えるか、必要な項目だけを元のテーブルに戻す。PITR はテーブルごとに明示的な有効化が必要。","point":"DynamoDB の誤操作への備えは PITR（35 日・秒単位）。複製（グローバルテーブル）は誤った更新や削除もコピーするため、バックアップの代わりにならない。","diagram":null},{"id":"d2-31","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon RDS for PostgreSQL のマルチ AZ DB インスタンスで業務アプリケーションのデータベースを運用しています。フェイルオーバーの完了までに 1〜2 分かかり、その間はアプリケーションが停止します。また、レポート用の参照クエリがプライマリ DB インスタンスの負荷を高めています。この企業は、引き続き RDS for PostgreSQL を使いながら、フェイルオーバー時間を短縮し、参照クエリを別の DB インスタンスで処理し、データを複数の AZ に同期的に複製することを求めています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["既存のマルチ AZ DB インスタンスにリードレプリカを 2 台追加し、レポート用クエリをリードレプリカに向ける。フェイルオーバー時は、リードレプリカを手動で昇格させる。","RDS Proxy を作成し、アプリケーションとレポート用クエリの接続先をプロキシに変更する。プロキシが接続をプールして、フェイルオーバー後の再接続を高速化する。","3 つの AZ に DB インスタンスを配置するマルチ AZ DB クラスターに移行する。レポート用クエリは、読み取り可能な 2 台のスタンバイを対象とするリーダーエンドポイントに向ける。","ストレージを Provisioned IOPS SSD に変更し、DB インスタンスクラスを 1 段階大きくする。レポート用クエリは、業務への影響を避けるため業務時間外に実行するようにスケジュールする。"],"answer":[2],"why":["リードレプリカは非同期レプリケーションで、昇格も手動になる。フェイルオーバー時間の短縮にならず、昇格後の接続先の切り替えなどの運用負荷も増える。","RDS Proxy は接続の再確立を速めるが、データベース自体のフェイルオーバー時間は変わらない。参照クエリを処理する別のインスタンスも用意されない。","マルチ AZ DB クラスターは、ライター 1 台と読み取り可能なスタンバイ 2 台を 3 つの AZ に配置し、同期的に複製する。フェイルオーバーは通常 35 秒程度未満で完了し、スタンバイは読み取りにも使える。","インスタンスを大きくしても AZ 障害時のフェイルオーバー時間は短くならず、参照クエリがプライマリに影響する問題も残る。クエリの実行時間も制限される。"],"explain":"「RDS for PostgreSQL のまま」「フェイルオーバー時間の短縮」「参照クエリの分離」「複数 AZ への同期複製」がそろったら、RDS のマルチ AZ DB クラスターを選ぶ。従来のマルチ AZ DB インスタンスのスタンバイは読み取りに使えず、フェイルオーバーも 1〜2 分程度かかる。マルチ AZ DB クラスターは読み取り可能なスタンバイが 2 台あり、リーダーエンドポイントで参照クエリを分散できる。","point":"マルチ AZ DB クラスターは読み取り可能なスタンバイ 2 台と高速フェイルオーバー。マルチ AZ DB インスタンスのスタンバイは読み取り不可。","diagram":{"caption":"正解の構成: 3 つの AZ に配置するマルチ AZ DB クラスター","cols":3,"rows":3,"groups":[{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":1,"r":2,"w":1,"h":1}],"nodes":[{"id":"app","label":"アプリケーション","sub":"書き込み・参照","kind":"compute","c":0,"r":1},{"id":"w","label":"ライター","sub":"書き込み","kind":"database","c":1,"r":0},{"id":"s1","label":"スタンバイ 1","sub":"読み取り可能","kind":"database","c":1,"r":1},{"id":"s2","label":"スタンバイ 2","sub":"読み取り可能","kind":"database","c":1,"r":2},{"id":"rep","label":"レポート","sub":"参照クエリ","kind":"analytics","c":2,"r":1}],"edges":[{"from":"app","to":"w","label":"書き込み"},{"from":"w","to":"s1","label":"同期複製"},{"from":"s1","to":"s2","label":"同期複製"},{"from":"rep","to":"s1","label":"参照"}]}},{"id":"d2-32","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon Aurora MySQL 互換の DB クラスターを 3 つの AZ にまたがって運用しています。ライターインスタンスは db.r6g.4xlarge です。AZ-b には同じ db.r6g.4xlarge の Aurora レプリカがあり、AZ-c には分析ツール用の db.r6g.large の Aurora レプリカがあります。ライターに障害が発生した場合は、アプリケーションの性能を維持するため、同じサイズの AZ-b のレプリカが新しいライターに昇格し、分析用のレプリカは昇格の対象として最後にすることを求めています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["AZ-b のレプリカのフェイルオーバー優先順位を 0 に、分析用のレプリカの優先順位を 15 に設定する。","AZ-b のレプリカだけを含むカスタムエンドポイントを作成し、フェイルオーバー先をこのカスタムエンドポイントのメンバーに限定する。","分析用のレプリカを db.r6g.4xlarge にスケールアップし、2 台のレプリカの優先順位は既定のままにしておく。","Amazon EventBridge ルールでライターの障害イベントを検知し、AWS Lambda 関数を使って AZ-b のレプリカを新しいライターに昇格させる。"],"answer":[0],"why":["Aurora は、フェイルオーバーの優先順位（ティア 0〜15）が小さいレプリカから順に新しいライターに昇格させる。AZ-b を 0、分析用を 15 にすれば、同じサイズのレプリカが優先され、分析用は最後になる。","カスタムエンドポイントは、接続先のインスタンスのグループを決める機能である。フェイルオーバー時に昇格させるレプリカの選択には影響しない。","2 台が同じ優先順位になり、どちらが昇格するかは決まらない。分析用のレプリカも昇格対象のままで、スケールアップによるコストも増える。","ライターの障害時は Aurora が自動でフェイルオーバーするため、独自の検知と昇格の仕組みは不要である。管理するコードが増え、運用負荷も高くなる。"],"explain":"Aurora のフェイルオーバーでは、優先順位（ティア 0〜15）の数値が小さいレプリカが優先して昇格する。同じ優先順位なら、インスタンスのサイズが大きいものが選ばれ、それも同じなら任意の 1 台になる。昇格させたいレプリカを 0、昇格させたくないレプリカを 15 にするのが、設定だけで済む最も運用負荷の低い方法である。","point":"Aurora のフェイルオーバー先はレプリカの優先順位（ティア 0〜15）で決まる。分析用は 15 にして昇格の最後にする。","diagram":{"caption":"正解の構成: 優先順位でフェイルオーバー先のレプリカを決める","cols":2,"rows":3,"groups":[{"label":"AZ-a","kind":"az","c":0,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":0,"r":1,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":0,"r":2,"w":1,"h":1}],"nodes":[{"id":"w","label":"ライター","sub":"4xlarge","kind":"database","c":0,"r":0},{"id":"r0","label":"Aurora レプリカ","sub":"4xlarge・優先順位 0","kind":"database","c":0,"r":1},{"id":"r15","label":"Aurora レプリカ","sub":"large・優先順位 15","kind":"database","c":0,"r":2},{"id":"st","label":"共有ストレージ","sub":"3 AZ に 6 コピー","kind":"storage","c":1,"r":1}],"edges":[{"from":"w","to":"r0","label":"障害時に昇格","style":"dashed"},{"from":"w","to":"st"},{"from":"r0","to":"st"},{"from":"r15","to":"st"}]}},{"id":"d2-33","domain":2,"topic":"RDS・Aurora","type":"multi","stem":"ある企業は、東京リージョンで暗号化された Amazon RDS for MySQL の DB インスタンスを運用しています。リージョン全体の障害に備えて、大阪リージョンで、障害発生の直前に近い任意の時点のデータベースを復元できるようにすることを求めています。復元までに数時間かかっても問題ありません。また、大阪リージョンに常時稼働の DB インスタンスは置かず、平常時のコストを最小限に抑える必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["大阪リージョンにクロスリージョンリードレプリカを作成する。障害時にリードレプリカを昇格させる。","AWS Backup の日次バックアップを取得し、大阪リージョンのボールトにコピーするルールを追加する。","DB インスタンスで、自動バックアップのクロスリージョンレプリケーションを有効にし、レプリケート先に大阪リージョンを指定する。","5 分ごとに AWS Lambda 関数で論理バックアップを取得し、大阪リージョンの Amazon S3 バケットにレプリケートする。","レプリケート先のリージョンで、バックアップの暗号化に使用する AWS KMS キーを指定する。"],"answer":[2,4],"why":["障害時には昇格できるが、大阪リージョンに DB インスタンスが常時稼働するため、平常時のコストがかかる。要件の「常時稼働の DB インスタンスは置かない」を満たさない。","復元ポイントが日次のため、障害の直前に近い任意の時点には復元できない。復旧時点の目標が最大で 1 日分ずれる。","自動バックアップとトランザクションログが別リージョンに複製され、複製先でポイントインタイムリカバリができる。DB インスタンスを常時稼働させる必要はなく、バックアップの保管料金だけで済む。","論理バックアップを 5 分ごとに取得する運用は、データ量が多いとバックアップ中の負荷が大きく、復元にも時間がかかる。コードの管理も必要で、運用負荷が高い。","暗号化された DB インスタンスのバックアップを別リージョンに複製するには、複製先のリージョンの KMS キーを指定する必要がある。キーはリージョンごとに別のリソースである。"],"explain":"「常時稼働の DB インスタンスは置かない」「直前に近い任意の時点」から、RDS の自動バックアップのクロスリージョンレプリケーションを選ぶ。スナップショットだけでなくトランザクションログも複製されるため、複製先のリージョンでポイントインタイムリカバリができる。暗号化された DB インスタンスでは、複製先のリージョンで使う KMS キーも指定する。","point":"自動バックアップのクロスリージョンレプリケーションなら、常時稼働の DB なしで別リージョンの PITR ができる。暗号化時は複製先の KMS キーが必要。","diagram":{"caption":"正解の構成: 自動バックアップを大阪へ複製し、障害時に PITR で復元","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":1,"h":1},{"label":"大阪リージョン","kind":"region","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"rds","label":"RDS for MySQL","sub":"自動バックアップ","kind":"database","c":0,"r":0},{"id":"bk","label":"バックアップ複製","sub":"ログも複製・暗号化","kind":"storage","c":1,"r":0},{"id":"new","label":"復元した DB","sub":"障害時に PITR で作成","kind":"database","c":2,"r":0}],"edges":[{"from":"rds","to":"bk","label":"非同期に複製","style":"dashed"},{"from":"bk","to":"new","label":"障害時に復元"}]}},{"id":"d2-34","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon Aurora MySQL 互換の新しい DB クラスターを設計しています。以前、運用担当者が誤った UPDATE 文を実行して多数の行が書き換わったとき、スナップショットから新しいクラスターを復元して接続先を切り替えたため、復旧に長い時間がかかりました。この企業は、同様の誤操作が起きた場合に、気づいてから数分以内に同じ DB クラスターを直前の状態に戻せるようにすることを求めています。巻き戻したい期間は最大 24 時間です。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["自動バックアップのポイントインタイムリカバリで誤操作の直前の時点を指定し、既存の DB クラスターを上書きして復元する。","5 分ごとに AWS Lambda 関数で手動スナップショットを作成する。誤操作時は、誤操作の直前に取得したスナップショットから新しい DB クラスターを復元する。","1 時間ごとに DB クラスターのクローンを作成する。誤操作時は、アプリケーションの接続先を最新のクローンに切り替える。","クラスターの作成時にバックトラックを有効にし、バックトラックウィンドウを 24 時間に設定する。誤操作時は、DB クラスターを直前の時点にバックトラックする。"],"answer":[3],"why":["ポイントインタイムリカバリは、既存のクラスターを上書きせず、常に新しい DB クラスターを作成する。接続先の切り替えが必要になり、数分では戻せない。","スナップショットの頻度を上げても、復元は新しいクラスターの作成になり、数分では完了しない。定期実行の仕組みや古いスナップショットの管理も必要になる。","クローンの作成を繰り返す方法は、接続先の切り替えが必要で、クローンの維持費用もかかる。最大 1 時間分のデータは失われたままになる。","Aurora MySQL のバックトラックは、バックアップから復元せずに、同じクラスターを指定した時点へ数分で巻き戻せる。バックトラックウィンドウで巻き戻せる期間を設定でき、クラスターの作成時に有効にしておく。"],"explain":"「同じ DB クラスター」「気づいてから数分以内」「誤操作の巻き戻し」が決め手で、Aurora MySQL のバックトラックを使う。バックトラックは、バックアップから新しいクラスターを作らずに、同じクラスターを過去の時点に戻す。Aurora MySQL 互換だけの機能で、クラスターの作成時（またはスナップショットからの復元時）に有効にし、巻き戻せる期間（バックトラックウィンドウ）を設定する。","point":"Aurora MySQL のバックトラックは、復元なしで同じクラスターを数分で巻き戻す。PITR は常に新しいクラスターを作る。","diagram":null},{"id":"d2-35","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、東京リージョンで Application Load Balancer（ALB）、Auto Scaling グループの Amazon EC2 インスタンス、Amazon Aurora MySQL 互換の DB クラスターを使って EC サイトを運用しています。リージョン障害に備えて、大阪リージョンに災害対策環境を構築します。目標復旧時間（RTO）は 15 分以内、目標復旧時点（RPO）は数秒以内です。検証の結果、アプリケーション層を AWS CloudFormation でゼロから作成すると 30 分以上かかることが分かっています。両リージョンで同時に処理する構成は不要で、平常時の災害対策のコストはできるだけ抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["大阪リージョンに、ALB と最小台数の EC2 インスタンスによる縮小した構成を常時稼働させ、Aurora グローバルデータベースのセカンダリクラスターを配置する。障害時はインスタンス数を増やし、セカンダリを昇格させて、DNS を切り替える。","大阪リージョンに、東京と同じ台数の構成を常時稼働させ、Amazon Route 53 の加重ルーティングで両リージョンにリクエストを分散する。書き込みは東京のプライマリクラスターに送る。","大阪リージョンに、Aurora グローバルデータベースのセカンダリクラスターと AMI、CloudFormation テンプレートだけを用意する。障害時にテンプレートで ALB と Auto Scaling グループを作成し、DNS を切り替える。","AWS Backup で毎日、EC2 インスタンスと Aurora クラスターのバックアップを大阪リージョンのボールトにコピーする。障害時にバックアップから環境を復元し、DNS を切り替える。"],"answer":[0],"why":["ウォームスタンバイの構成で、縮小した環境が常時稼働しているため、台数を増やすだけで短時間に本番の処理を引き受けられる。Aurora グローバルデータベースの複製遅延は通常 1 秒未満で、RPO 数秒を満たす。","マルチサイトの構成で RTO と RPO は満たせるが、本番と同じ規模の環境を常時稼働させるため、費用が最も高い。「コストを抑える」要件に合わない。","パイロットライトの構成である。データは複製されるが、アプリケーション層を作成するのに 30 分以上かかるため、RTO 15 分以内を満たせない。","バックアップと復元の構成で、復元に時間がかかり、RPO も最大 1 日になる。RTO 15 分以内と RPO 数秒以内のどちらも満たせない。"],"explain":"RTO・RPO とコストで DR 戦略を選ぶ問題である。コストが低い順に、バックアップと復元、パイロットライト、ウォームスタンバイ、マルチサイトとなり、復旧も同じ順に速くなる。RTO 15 分では、アプリケーション層をゼロから作るパイロットライトでは間に合わない。同時処理が不要でコストも抑えたいので、縮小した環境を常時稼働させるウォームスタンバイを選ぶ。","point":"DR 戦略はコストと復旧時間のトレードオフ。バックアップと復元 → パイロットライト → ウォームスタンバイ → マルチサイトの順に速く高価になる。","diagram":{"caption":"正解の構成: 縮小した大阪の環境を常時稼働させるウォームスタンバイ","cols":4,"rows":2,"groups":[{"label":"東京リージョン（本番）","kind":"region","c":1,"r":0,"w":3,"h":1},{"label":"大阪リージョン（縮小構成）","kind":"region","c":1,"r":1,"w":3,"h":1}],"nodes":[{"id":"r53","label":"Route 53","sub":"フェイルオーバー","kind":"network","c":0,"r":0},{"id":"alb1","label":"ALB","sub":"本番","kind":"network","c":1,"r":0},{"id":"ec1","label":"EC2 Auto Scaling","sub":"本番の台数","kind":"compute","c":2,"r":0},{"id":"db1","label":"Aurora 本番","sub":"書き込み","kind":"database","c":3,"r":0},{"id":"alb2","label":"ALB","sub":"待機","kind":"network","c":1,"r":1},{"id":"ec2","label":"EC2 Auto Scaling","sub":"最小台数","kind":"compute","c":2,"r":1},{"id":"db2","label":"Aurora 待機","sub":"読み取り専用","kind":"database","c":3,"r":1}],"edges":[{"from":"r53","to":"alb1"},{"from":"alb1","to":"ec1"},{"from":"ec1","to":"db1"},{"from":"r53","to":"alb2","label":"障害時に切替","style":"dashed"},{"from":"alb2","to":"ec2"},{"from":"ec2","to":"db2"},{"from":"db1","to":"db2","label":"非同期複製","style":"dashed"}]}},{"id":"d2-36","domain":2,"topic":"バックアップ・DR","type":"multi","stem":"ある企業は、本番アカウントの Amazon EC2 インスタンスと Amazon RDS の DB インスタンスを AWS Backup でバックアップしています。セキュリティチームは、ランサムウェアの被害に備えて、本番アカウントの管理者権限が侵害されて攻撃者がバックアップを削除しようとしても、保持期間中のバックアップが失われないようにしたいと考えています。さらに、本番アカウント自体が使えなくなった場合でも、別のアカウントに残ったバックアップから復旧できる必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["バックアップボールトのアクセスポリシーで、本番アカウントのすべての IAM プリンシパルに対して、復旧ポイントの削除を拒否する。","バックアッププランのコピールールで、AWS Organizations 内のバックアップ専用アカウントのボールトにもバックアップをコピーする。","バックアップの保持期間を無期限に設定し、バックアップの暗号化に使う AWS KMS キーの削除を禁止する。","バックアップボールトに AWS Backup Vault Lock をコンプライアンスモードで設定し、最小保持期間を指定する。","本番アカウントの IAM ポリシーで、バックアップの削除 API を実行できるのをセキュリティチームのロールだけに限定する。"],"answer":[1,3],"why":["アクセスポリシーは、管理者権限を持つ攻撃者がポリシー自体を変更・削除すると無効にされる。ボールトのロックと違い、変更を禁止する仕組みではない。","別アカウントのボールトへのコピーがあれば、本番アカウントが侵害されたり使えなくなったりしても、バックアップが残る。アカウントの境界でバックアップを隔離できる。","保持期間を無期限にしても、削除 API の実行は防げない。KMS キーも管理者権限で操作されるおそれがあり、バックアップの削除自体を禁止する仕組みではない。","コンプライアンスモードの Vault Lock は、猶予期間が過ぎるとロックを解除できなくなり、AWS アカウントのルートユーザーでも保持期間中の復旧ポイントを削除できない。","管理者権限が侵害された場合、攻撃者は IAM ポリシーを変更して制限を外せる。ロールを限定するだけでは、バックアップの削除を確実に防げない。"],"explain":"本番アカウントの管理者権限が侵害される前提では、そのアカウントの IAM ポリシーやアクセスポリシーによる制限は外される可能性がある。保持期間中の削除を確実に防ぐのは、Backup Vault Lock のコンプライアンスモードである。さらに、アカウント自体が使えなくなる場合に備えて、別アカウントのボールトにコピーしておく。この 2 つを組み合わせて、不変性とアカウントの分離を実現する。","point":"ランサムウェア対策は、Backup Vault Lock（コンプライアンスモード）で不変にし、別アカウントのボールトへコピーして隔離する。","diagram":{"caption":"正解の構成: Vault Lock で不変にし、別アカウントへコピーする","cols":4,"rows":1,"groups":[{"label":"本番アカウント","kind":"account","c":0,"r":0,"w":2,"h":1},{"label":"バックアップ専用アカウント","kind":"account","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"res","label":"EC2・RDS","sub":"バックアップ対象","kind":"compute","c":0,"r":0},{"id":"v1","label":"Backup ボールト","sub":"Vault Lock","kind":"management","c":1,"r":0},{"id":"v2","label":"Backup ボールト","sub":"Vault Lock","kind":"management","c":2,"r":0},{"id":"rs","label":"復旧用の環境","sub":"必要時に復元","kind":"compute","c":3,"r":0}],"edges":[{"from":"res","to":"v1","label":"バックアップ"},{"from":"v1","to":"v2","label":"コピー","style":"dashed"},{"from":"v2","to":"rs","label":"復元","style":"dashed"}]}},{"id":"d2-37","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、AWS Backup で Amazon EC2 インスタンスの Amazon EBS ボリューム、Amazon RDS の DB インスタンス、Amazon EFS のファイルシステムをバックアップしています。監査では、バックアップから実際に復元できることを四半期ごとに示すことが求められています。現在は担当者が手作業でバックアップを復元して確認しており、工数がかかっています。この企業は、手作業を最小限に抑え、復元できたことの記録も残したいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["Amazon EventBridge Scheduler で四半期ごとに AWS Lambda 関数を実行し、サービスごとの復元 API を呼び出す。復元したリソースは、スクリプトで削除する。","AWS Backup の復元テスト計画を作成し、対象のリソースと頻度を指定する。復元後の検証期間が過ぎたら、復元したリソースを自動で削除し、復元ジョブの結果を記録として使う。","AWS Backup Audit Manager のフレームワークで、バックアップの頻度と保持期間が要件を満たしているかを継続的に評価し、コンプライアンスレポートを作成する。","バックアップジョブの完了通知を Amazon SNS で受け取り、ジョブが成功したことを復元できることの証跡として記録する。復元は実際の障害時に行う。"],"answer":[1],"why":["復元は自動化できるが、サービスごとのコードの作成と保守が必要になる。復元用の設定や削除の処理も自前で管理することになり、運用負荷が高い。","復元テスト計画は、復旧ポイントを自動で復元して検証し、期間が過ぎたら復元したリソースを削除する。復元ジョブの結果が残るため、復元できることの証跡になる。","Audit Manager は、バックアップの設定や実行がポリシーに沿っているかを評価する。実際に復元できるかどうかは確認しない。","バックアップジョブの成功は、バックアップが取得できたことを示すだけで、復元できることの証明にはならない。要件の「復元できることの確認」を満たさない。"],"explain":"「バックアップから実際に復元できることを示す」「手作業を最小限に」から、AWS Backup の復元テストを選ぶ。復元テスト計画では、頻度と対象の復旧ポイントを指定すると、自動で復元して検証し、検証期間後に復元したリソースを削除する。バックアップジョブの成功や Audit Manager によるコンプライアンス評価では、復元できるかどうかまでは分からない。","point":"「バックアップが取れている」と「復元できる」は別。AWS Backup の復元テストで定期的に自動検証できる。","diagram":{"caption":"正解の構成: 復元テスト計画で定期的に自動で復元して検証する","cols":4,"rows":1,"groups":[],"nodes":[{"id":"v","label":"Backup ボールト","sub":"復旧ポイント","kind":"management","c":0,"r":0},{"id":"p","label":"復元テスト計画","sub":"四半期ごとに実行","kind":"management","c":1,"r":0},{"id":"t","label":"テスト用リソース","sub":"復元後に自動削除","kind":"compute","c":2,"r":0},{"id":"r","label":"復元ジョブの結果","sub":"監査の証跡","kind":"management","c":3,"r":0}],"edges":[{"from":"v","to":"p","label":"対象を選択"},{"from":"p","to":"t","label":"復元・検証"},{"from":"t","to":"r","label":"結果を記録"}]}},{"id":"d2-38","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、社内の経費精算システムを、Amazon EC2 インスタンス 1 台と Amazon RDS for MySQL の DB インスタンスで運用しています。リージョン障害に備えて、別のリージョンに災害対策を用意します。RTO は 24 時間、RPO は 24 時間で、災害対策のリージョンで常時稼働させるリソースは持たない方針です。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["災害対策のリージョンに、縮小した EC2 インスタンスと RDS のクロスリージョンリードレプリカを常時稼働させる。障害時にインスタンスを拡大し、リードレプリカを昇格させる。","EC2 インスタンスに AWS Elastic Disaster Recovery のエージェントをインストールし、別のリージョンへ継続的にレプリケートする。RDS はクロスリージョンリードレプリカで複製する。","AWS Backup のバックアッププランで日次バックアップを取得し、別のリージョンのボールトにコピーするルールを追加する。障害時は復旧ポイントから復元し、ネットワークなどは AWS CloudFormation で作成する。","災害対策のリージョンに本番と同じ構成を作成し、Amazon Route 53 の加重ルーティングで、平常時から両方のリージョンにリクエストを分散する。"],"answer":[2],"why":["ウォームスタンバイの構成である。縮小した環境とリードレプリカが常時稼働し、コストがかかる。RTO・RPO が 24 時間なら、ここまでの速さは不要である。","ブロックレベルで継続的にレプリケートでき、RPO は秒単位になるが、レプリケーション用のリソースが常時稼働する。要件に対して過剰で、コストも高い。","バックアップと復元の構成で、日次バックアップなら RPO 24 時間を満たし、復元の作業時間も RTO 24 時間に収まる。災害対策のリージョンにはバックアップの保管料金しかかからず、最も安価である。","マルチサイトの構成で、本番と同じ規模を常時稼働させるため、コストが最も高い。RTO・RPO が 24 時間の要件には過剰である。"],"explain":"RTO・RPO がともに 24 時間と緩く、「常時稼働のリソースを持たない」「最も費用対効果が高い」という条件なので、最も安価なバックアップと復元を選ぶ。AWS Backup でバックアップを別のリージョンにコピーし、障害時に復元して、周辺のリソースは CloudFormation で作成する。要件より速い復旧を実現する戦略は、コストが高くなるだけである。","point":"RTO・RPO が数時間〜1 日ならバックアップと復元が最安。速い戦略ほどコストが上がる。要件に見合う戦略を選ぶ。","diagram":null},{"id":"d2-39","domain":2,"topic":"DynamoDB","type":"single","stem":"ある企業は、注文データを Amazon DynamoDB テーブルに保存しています。法令により、毎月末時点のテーブルの状態を 7 年間保持する必要があります。バックアップの取得でテーブルの読み取りや書き込みの性能に影響が出ないようにし、運用上のオーバーヘッドも最小限に抑えることを求めています。これらの要件を満たすソリューションはどれですか。","choices":["DynamoDB のポイントインタイムリカバリを有効にし、復元できる期間を 7 年に設定する。","AWS Backup のバックアッププランで月次のバックアップルールを作成し、保持期間を 7 年に設定する。バックアップの対象に DynamoDB テーブルを割り当てる。","月末に AWS Lambda 関数でテーブル全体をスキャンし、結果を Amazon S3 バケットに保存する。S3 ライフサイクルルールで 7 年後に削除する。","DynamoDB Streams を有効にし、変更内容を Amazon Data Firehose 経由で S3 に 7 年間保存する。復元時は、保存した変更内容を新しいテーブルに順に書き込む。"],"answer":[1],"why":["ポイントインタイムリカバリの復元可能期間は、直近 35 日間までで、7 年には設定できない。長期保管にはバックアップを使う。","AWS Backup なら、スケジュールと保持期間を設定するだけで、DynamoDB のバックアップを自動で取得して 7 年間保管できる。バックアップはテーブルの性能に影響せず、取得や削除の管理も不要である。","テーブル全体のスキャンは読み取りキャパシティを大量に消費し、性能に影響する。スクリプトの管理も必要で、復元の手順も複雑になる。","変更内容を保存しても、月末時点のテーブルの状態をそのまま保管したことにならない。復元には変更の再生が必要で、時間と手間がかかる。"],"explain":"「月末時点のテーブルの状態」「7 年間」「性能に影響しない」「運用負荷が最小」から、AWS Backup のスケジュールと保持期間を使う。DynamoDB のバックアップは、テーブルの性能に影響せずに取得できる。ポイントインタイムリカバリは直近 35 日間の任意の時点に戻すための機能で、長期保管には向かない。","point":"DynamoDB の PITR は最大 35 日間。7 年などの長期保管は、AWS Backup やオンデマンドバックアップで行う。","diagram":null},{"id":"d2-40","domain":2,"topic":"DynamoDB","type":"single","stem":"ある企業は、本番の Amazon DynamoDB テーブルを運用しています。運用担当者が、コンソールや AWS CLI の操作を誤って本番のテーブルを削除しそうになるヒヤリハットがありました。この企業は、IAM ポリシーを変更せずに、テーブルの設定だけで、誤ったテーブルの削除をあらかじめ防ぐことを求めています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["テーブルの日次オンデマンドバックアップを取得する。誤ってテーブルが削除された場合は、バックアップから新しいテーブルに復元する。","Amazon EventBridge ルールで AWS CloudTrail の DeleteTable の記録を検知し、同じ名前のテーブルを AWS Lambda 関数で自動的に再作成する。","テーブルのグローバルテーブルのレプリカを別のリージョンに作成し、東京のテーブルが削除されても別のリージョンで運用を継続できるようにする。","テーブルの削除保護を有効にする。テーブルを削除する場合は、先に削除保護を無効にする操作が必要になる。"],"answer":[3],"why":["バックアップがあれば削除後に復元はできるが、削除そのものは防げない。復元の間は、テーブルが使えなくなる。","削除の検知と再作成は事後の対応で、削除そのものは防げない。再作成したテーブルにはデータがなく、データは復元されない。","別のリージョンにデータは残るが、削除そのものを防ぐわけではない。レプリカの追加で、コストと管理の負荷も増える。","削除保護を有効にすると、テーブルを削除する API の呼び出しは失敗する。IAM ポリシーを変更せずに、テーブルの設定だけで誤削除を事前に防止できる。"],"explain":"「削除をあらかじめ防ぐ」「テーブルの設定だけ」が決め手で、DynamoDB の削除保護を有効にする。バックアップやレプリカは削除後の復旧のための手段で、削除そのものを防ぐものではない。削除保護はテーブルの属性で、有効にしていると DeleteTable が拒否される。","point":"誤削除を事前に防ぐのは DynamoDB の削除保護。バックアップや PITR は削除後に復旧するための手段。","diagram":null},{"id":"d2-41","domain":2,"topic":"S3","type":"multi","stem":"ある企業は、利用者がアップロードしたドキュメントを Amazon S3 バケットに保存しています。利用者が誤ってファイルを削除したり上書きしたりすることがあり、そのたびに管理者が復元の依頼を受けています。この企業は、管理者が削除や上書き前の状態に戻せるようにしたいと考えています。ただし、古いデータが際限なく蓄積してコストが増え続けないようにし、アプリケーションの変更も不要にする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["バケットのバージョニングを有効にする。誤って削除されたオブジェクトは削除マーカーを削除して復元し、上書きされたオブジェクトは以前のバージョンを復元する。","バケットに S3 オブジェクトロックをガバナンスモードで設定し、すべてのオブジェクトの保持期間を 90 日にする。","ライフサイクルルールを作成し、非現行バージョンを 90 日後に完全に削除する。","ライフサイクルルールを作成し、現行バージョンを 1 日後に S3 Glacier Flexible Retrieval に移行する。","バケットで MFA Delete を有効にし、バージョンの完全な削除とバージョニングの状態の変更に、多要素認証を求める。"],"answer":[0,2],"why":["バージョニングを有効にすると、上書きでは新しいバージョンが作られ、削除では削除マーカーが付くだけで、以前のバージョンは残る。管理者は、以前のバージョンや削除マーカーの削除で復元できる。","オブジェクトロックは、保持期間中のオブジェクトの削除や上書きを防ぐ機能で、利用者の通常の操作もできなくなる。誤操作を復元する仕組みではなく、保持中のデータも増え続ける。","バージョニングを有効にすると、非現行バージョンが蓄積し続ける。ライフサイクルルールで一定期間後に非現行バージョンを完全に削除すれば、保管コストの増加を抑えられる。","現行バージョンを Glacier に移行すると、利用者が通常のアクセスで読み取れなくなる。誤操作の復元や、蓄積するデータの削減にもならない。","MFA Delete は、バージョンの完全な削除などに多要素認証を求める。通常の削除は削除マーカーが付くだけで、誤操作から復元する手段にも、古いバージョンを減らす手段にもならない。"],"explain":"誤操作からの復元にはバージョニングを有効にする。ただし、バージョニングだけでは古いバージョンが蓄積してコストが増えるため、ライフサイクルルールで非現行バージョンを一定期間後に削除する。どちらもバケットの設定だけで実現でき、アプリケーションの変更は不要である。","point":"誤削除・誤上書きの復元はバージョニング。非現行バージョンはライフサイクルルールで期限を決めて削除する。","diagram":null},{"id":"d2-42","domain":2,"topic":"S3","type":"single","stem":"ある企業は、請求書の PDF ファイルを東京リージョンの Amazon S3 バケットに保存しています。本番の AWS アカウントの認証情報が侵害され、攻撃者がバケットのオブジェクトを削除したり暗号化したりしても、影響を受けないコピーが残るようにすることを求めています。コピーは別のリージョンに、セキュリティチームが管理する別の AWS アカウントで保管する必要があります。新しくアップロードされるオブジェクトは自動でコピーされなければなりません。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["セキュリティチームのアカウントの大阪リージョンにバケットを作成し、両方のバケットでバージョニングを有効にする。送信元バケットにレプリケーションルールを作成し、レプリカの所有者を送信先のアカウントに変更する。","本番アカウントの大阪リージョンにバケットを作成し、両方のバケットでバージョニングを有効にする。送信元バケットにクロスリージョンレプリケーションのルールを作成し、すべてのオブジェクトを自動で複製する。送信先のバケットは本番アカウントの管理者が管理する。","送信元バケットで MFA Delete を有効にし、オブジェクトのバージョンの削除に多要素認証を求める。バケットのバージョニングを有効にして、上書きされた古いバージョンを保持する。","S3 バッチオペレーションのコピージョブを毎日実行し、セキュリティチームのアカウントのバケットにオブジェクトをコピーする。コピージョブは、本番アカウントの IAM ロールで実行する。"],"answer":[0],"why":["別アカウントのバケットへのレプリケーションで、本番アカウントの認証情報が侵害されても送信先のオブジェクトは操作できない。所有者を送信先のアカウントに変更すれば、セキュリティチームがコピーを管理できる。","同じアカウント内のコピーは、侵害された認証情報で送信先のバケットも削除できる可能性がある。別のアカウントで保管する要件を満たさない。","バージョニングで上書き前の状態は残るが、同じアカウントのバケットのため、侵害された認証情報で操作される。別のリージョン・別のアカウントのコピーという要件を満たさない。","日次の実行では、新しいオブジェクトが自動でコピーされるという要件を満たさない。ジョブの実行と管理にも手間がかかる。"],"explain":"「別のアカウント」「別のリージョン」「新規オブジェクトを自動で」から、クロスアカウントのクロスリージョンレプリケーションを選ぶ。レプリケーションにはバージョニングが必要で、アカウントをまたぐときは、レプリカの所有者を送信先のアカウントに変更する設定を使う。アカウントを分離することで、侵害の影響をコピーに及ばせない。","point":"侵害に備えるコピーは別アカウント・別リージョンに。S3 のレプリケーションで、レプリカの所有者を送信先のアカウントに変更できる。","diagram":{"caption":"正解の構成: 別アカウント・別リージョンのバケットへレプリケーション","cols":3,"rows":1,"groups":[{"label":"本番アカウント（東京）","kind":"account","c":0,"r":0,"w":2,"h":1},{"label":"セキュリティアカウント","kind":"account","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"app","label":"アプリケーション","sub":"PDF をアップロード","kind":"compute","c":0,"r":0},{"id":"s1","label":"S3 バケット","sub":"送信元","kind":"storage","c":1,"r":0},{"id":"s2","label":"S3 バケット","sub":"大阪・所有者を変更","kind":"storage","c":2,"r":0}],"edges":[{"from":"app","to":"s1"},{"from":"s1","to":"s2","label":"CRR で複製","style":"dashed"}]}},{"id":"d2-43","domain":2,"topic":"EFS・FSx","type":"single","stem":"ある企業は、Windows Server の Amazon EC2 インスタンスで動く業務アプリケーションから、Windows Server の EC2 インスタンス上のファイルサーバーの SMB 共有を利用しています。この企業は、ファイルサーバーのマネージドサービスへの移行を計画しています。Active Directory のユーザー認証と NTFS のアクセス許可を引き続き使い、AZ に障害が発生してもアクセスが自動的に別の AZ に切り替わる必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EFS のファイルシステムを作成し、各 AZ のマウントターゲットを経由して、Windows Server の EC2 インスタンスから NFS でマウントする。","Amazon FSx for Windows File Server をシングル AZ で作成して AWS Managed Microsoft AD に参加させ、毎日バックアップを取得する。障害時は別の AZ に復元する。","Amazon FSx for Windows File Server をマルチ AZ 配置で作成し、AWS Managed Microsoft AD に参加させる。","2 つの AZ に Windows Server の EC2 インスタンスを配置し、DFS レプリケーションで SMB 共有を同期する。データは EBS ボリュームに保存する。"],"answer":[2],"why":["EFS は Linux 向けの NFS ファイルシステムで、Windows Server 上のクライアントからは使えない。SMB の共有や NTFS のアクセス許可も提供されない。","復元の手間がかかり、障害時の切り替えは自動にならない。AZ 障害に対して自動でフェイルオーバーするという要件を満たさない。","マルチ AZ 配置では、異なる AZ にアクティブとスタンバイのファイルサーバーを作成し、データを同期的に複製する。AZ 障害時は自動でスタンバイに切り替わり、AD 統合と NTFS のアクセス許可も使える。","動作はするが、EC2 インスタンスの管理、パッチ適用、DFS レプリケーションの設定を自分で行う必要がある。マネージドサービスへの移行という目的に合わず、運用負荷が高い。"],"explain":"「Windows の SMB 共有」「Active Directory と NTFS」「AZ 障害時の自動切り替え」「マネージド」から、FSx for Windows File Server のマルチ AZ 配置を選ぶ。マルチ AZ では、別の AZ のスタンバイに同期的にデータが複製され、障害時は自動でフェイルオーバーする。シングル AZ は AZ 障害時に自動では切り替わらない。","point":"Windows の SMB と AD が必要なら FSx for Windows File Server。AZ 障害に備えるならマルチ AZ 配置にする。","diagram":{"caption":"正解の構成: マルチ AZ 配置の FSx for Windows File Server","cols":3,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":0,"r":0,"w":2,"h":1},{"label":"AZ-b","kind":"az","c":0,"r"
