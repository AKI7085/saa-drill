・定期的に同期するなら DataSync（オンプレミスにエージェントを置く）。","diagram":{"caption":"正解の構成: DataSync エージェント経由で NAS から EFS へ同期する","cols":4,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1},{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"nas","label":"NAS","sub":"NFS 共有","kind":"onprem","c":0,"r":0},{"id":"agent","label":"DataSync","sub":"エージェント（VM）","kind":"onprem","c":1,"r":0},{"id":"task","label":"DataSync タスク","sub":"毎晩スケジュール実行","kind":"integration","c":2,"r":0},{"id":"efs","label":"Amazon EFS","sub":"移行先","kind":"storage","c":3,"r":0}],"edges":[{"from":"nas","to":"agent","label":"NFS で読み取り"},{"from":"agent","to":"task","label":"Direct Connect"},{"from":"task","to":"efs","label":"変更分を転送"}]}},{"id":"d3-05","domain":3,"topic":"EC2","type":"multi","stem":"ある研究機関は、数値流体解析を MPI で並列実行する HPC アプリケーションを Amazon EC2 に移行する計画を立てています。このアプリケーションでは計算ノードどうしが頻繁にメッセージを交換するため、ノード間通信のレイテンシーが処理時間に直結します。この研究機関は、可用性よりもノード間通信の性能を優先し、ノード間のレイテンシーを最小限に抑えることを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["クラスタープレイスメントグループを作成し、計算ノードを 1 つのアベイラビリティーゾーン内で起動する。","パーティションプレイスメントグループを作成し、計算ノードを複数のパーティションに分けて起動する。","分散プレイスメントグループを作成し、計算ノードをそれぞれ別のハードウェアに配置して起動する。","複数のアベイラビリティーゾーンにまたがる Auto Scaling グループを作成し、計算ノードを均等に起動する。","EFA をサポートするインスタンスタイプを選択し、各計算ノードに Elastic Fabric Adapter をアタッチする。"],"answer":[0,4],"why":["クラスタープレイスメントグループは 1 つの AZ 内でインスタンスを物理的に近い位置に配置し、ノード間で低レイテンシー・高スループットの通信を実現する。密結合の HPC に適している。","パーティションプレイスメントグループは、パーティションごとにラックを分けてハードウェア障害の影響範囲を限定するもので、HDFS や Cassandra などの大規模分散システム向けである。レイテンシーの最小化が目的ではない。","分散プレイスメントグループは、少数の重要なインスタンスを別々のハードウェアに配置して同時障害を避けるためのもので、可用性のための配置である。ノード間の近さは保証されない。","AZ 間の通信は AZ 内の通信よりレイテンシーが大きい。可用性は上がるが、ノード間通信の性能を優先するという要件に反する。","EFA は OS をバイパスしてインスタンス間で通信できるネットワークインターフェイスで、MPI などの密結合アプリケーションのノード間通信を高速化する。"],"explain":"決め手は「MPI」「頻繁にメッセージを交換する（密結合）」「可用性よりノード間通信の性能を優先」である。配置ではクラスタープレイスメントグループでノードを 1 つの AZ 内の近い位置にまとめ、ネットワークでは EFA を使って OS をバイパスした低レイテンシーの通信を行う。パーティションと分散のプレイスメントグループは、どちらも障害の影響を抑えて可用性を高めるための配置である。","point":"密結合の HPC はクラスタープレイスメントグループ＋EFA。分散は少数の重要インスタンスの同時障害回避、パーティションは HDFS などの大規模分散向け。","diagram":null},{"id":"d3-06","domain":3,"topic":"Auto Scaling","type":"multi","stem":"ある企業の社内業務システムは、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで実行されており、CPU 使用率のターゲット追跡スケーリングポリシーを使用しています。数か月前から、毎営業日の始業時刻にアクセスが急増するパターンが続いています。インスタンスは起動後のアプリケーションのインストールと設定ファイルの取得に約 10 分かかるため、スケールアウトが間に合わず、始業直後の応答が遅くなっています。この企業は、インスタンスを常に最大数で実行することなく、始業直後の応答遅延を解消することを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["ターゲット追跡スケーリングポリシーをステップスケーリングポリシーに置き換える。CPU 使用率が高いときに追加するインスタンス数を大きくする。","Auto Scaling グループのデフォルトのクールダウン期間を短くする。スケールアウトのアクティビティを短い間隔で連続して実行できるようにする。","予測スケーリングポリシーを追加する。過去の負荷のパターンから需要を予測し、予測された急増の前にインスタンスを起動するように設定する。","Auto Scaling グループのヘルスチェックの猶予期間を長くする。初期化中のインスタンスが異常と判定されて置き換えられないようにする。","Auto Scaling グループにウォームプールを設定する。初期化を済ませたインスタンスを停止状態で待機させ、スケールアウト時に使用する。"],"answer":[2,4],"why":["ステップスケーリングもメトリクスが上がってから反応する方式であり、起動後の約 10 分の初期化時間は短くならない。急増に間に合わない点は変わらない。","クールダウンを短くしても、負荷が上がってから起動を始める点と、起動後の初期化に時間がかかる点は変わらない。","予測スケーリングは過去の CloudWatch メトリクスから日次・週次のパターンを学習して需要を予測し、予測した時刻より前にキャパシティを起動できる。毎日繰り返す急増に間に合わせられる。","猶予期間は初期化中のインスタンスが異常と判定されるのを防ぐ設定であり、起動を早めたり初期化の時間を短くしたりする効果はない。","ウォームプールに初期化済みのインスタンスを停止状態で置いておくと、スケールアウト時は起動するだけで済み、アプリケーションの準備にかかる時間を大幅に短縮できる。停止中はインスタンスの料金がかからない（EBS ボリュームの料金はかかる）。"],"explain":"決め手は「毎営業日の決まった時刻に急増」と「初期化に約 10 分かかる」である。負荷が上がってから反応するポリシー（ターゲット追跡・ステップ）では、起動と初期化の時間のぶん必ず遅れる。繰り返すパターンには予測スケーリングで事前に台数を増やし、初期化に時間がかかる問題にはウォームプールで初期化済みのインスタンスを待機させて対処する。予測スケーリングはターゲット追跡ポリシーと併用できる。","point":"周期的な急増は予測スケーリングで先回りする。起動・初期化が遅いならウォームプールで初期化済みのインスタンスを待機させる。","diagram":null},{"id":"d3-07","domain":3,"topic":"Lambda・サーバーレス","type":"single","stem":"ある決済サービス企業は、Amazon API Gateway と AWS Lambda で残高照会 API を提供しています。ほとんどのリクエストは数十ミリ秒で応答しますが、新しい実行環境が作成されるときの初期化処理（コールドスタート）により、一部のリクエストの応答に数秒かかり、レイテンシーの目標を満たせていません。レスポンスの内容は利用者ごとに異なります。トラフィックは日中ほぼ一定です。この企業は、関数のコードを変更せずに、レイテンシーのばらつきを抑えることを求めています。ソリューションアーキテクトはどうすべきですか。","choices":["関数のメモリ割り当てを増やし、関数に割り当てられる CPU を増やす。あわせて関数のタイムアウト値を長く設定する。","関数のバージョンを発行してエイリアスを作成する。エイリアスにプロビジョニングされた同時実行を設定し、API Gateway から呼び出す。","関数に予約された同時実行を設定する。ほかの関数に同時実行数を使われないように、必要な同時実行数を確保する。","API Gateway のステージでキャッシュを有効にする。キャッシュの TTL を設定し、同じリクエストへのレスポンスをキャッシュから返す。"],"answer":[1],"why":["メモリを増やすと CPU も比例して増えるため初期化が多少速くなることはあるが、コールドスタート自体は無くならない。タイムアウトの延長は応答時間の改善に関係しない。","プロビジョニングされた同時実行は、指定した数の実行環境をあらかじめ初期化して待機させておく。リクエストは初期化済みの環境で処理されるため、コールドスタートによる遅延を避けられる。","予約された同時実行は、関数が使える同時実行数を確保し上限を設定するもので、実行環境を事前に初期化するわけではない。コールドスタートは発生し続ける。","レスポンスが利用者ごとに異なるため、キャッシュしたレスポンスを返すことはできない。キャッシュではコールドスタートの問題も解決しない。"],"explain":"決め手は「コールドスタートによる遅延」「コードを変更せずに」である。プロビジョニングされた同時実行は、関数のバージョンまたはエイリアスに設定し、指定した数の実行環境を初期化済みの状態で維持する。トラフィックがほぼ一定であれば必要数を見積もりやすく、時間帯で変わる場合は Application Auto Scaling で設定値をスケジュールや使用率に合わせて変えられる。予約された同時実行は数の確保と上限の設定であり、初期化を省く効果はない。","point":"Lambda のコールドスタート対策はプロビジョニングされた同時実行（バージョン / エイリアスに設定）。予約された同時実行は数の確保と上限。","diagram":{"caption":"正解の構成: 初期化済みの実行環境でリクエストを処理する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"残高照会","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"REST API","kind":"network","c":1,"r":0},{"id":"lambda","label":"Lambda (prod)","sub":"初期化済み環境を待機","kind":"serverless","c":2,"r":0},{"id":"aas","label":"App Auto Scaling","sub":"同時実行数を調整","kind":"management","c":2,"r":1}],"edges":[{"from":"user","to":"apigw"},{"from":"apigw","to":"lambda","label":"エイリアス"},{"from":"aas","to":"lambda","label":"設定値を調整","style":"dashed"}]}},{"id":"d3-08","domain":3,"topic":"コンテナ","type":"single","stem":"ある自動車部品メーカーは、設計を検証するために、互いに独立した数千件のシミュレーションジョブを毎晩実行しています。各ジョブはコンテナイメージとしてパッケージ化されており、1 件の実行に 1〜3 時間かかり、必要な vCPU とメモリはジョブごとに異なります。この企業は、ジョブのキューイングと優先度の制御、ジョブ量に応じたコンピューティングリソースの自動的な増減を、独自のスケジューラーを構築せずに実現することを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各ジョブを AWS Lambda 関数として実装する。ジョブの情報を Amazon SQS キューに送信し、キューをイベントソースとして関数を起動する。","Amazon ECS クラスターに AWS Fargate のサービスを作成する。夜間は必要な数のタスクを常時実行させ、各タスクがジョブを順に処理する。","Amazon SQS キューと EC2 Auto Scaling グループを作成する。独自のワーカーでキューからジョブを取り出し、キューの長さに応じて台数を調整する。","AWS Batch でマネージド型のコンピューティング環境とジョブキューを作成する。ジョブ定義を登録し、各ジョブをジョブキューに送信する。"],"answer":[3],"why":["Lambda の 1 回の実行時間は最大 15 分であり、1〜3 時間かかるジョブは実行できない。","ECS のサービスは指定した数のタスクを常に維持する、長時間稼働のアプリケーション向けの仕組みである。ジョブのキューイングや優先度の制御は独自に作り込む必要がある。","動かすことはできるが、ジョブの割り当て、優先度、リトライ、台数の調整を独自に作り込んで運用する必要があり、「独自のスケジューラーを構築しない」という要件に反する。","AWS Batch はジョブキュー、優先度、リトライ、依存関係の管理と、必要な vCPU・メモリに合わせたコンピューティング環境の自動的な増減を提供する。コンテナ化されたバッチジョブを大量に実行する用途に向く。"],"explain":"決め手は「独立した大量のジョブ」「1 件 1〜3 時間」「キューイングと優先度」「独自のスケジューラーを構築しない」である。AWS Batch はジョブ定義（コンテナイメージと必要なリソース）とジョブキューを使い、キューに溜まったジョブの量に応じて EC2 や Fargate のコンピューティング環境を自動で増減する。Lambda には 15 分の実行時間の上限があり、長時間のジョブには使えない。","point":"大量のバッチジョブのキューイング・スケジューリング・リソース調整は AWS Batch。長時間のジョブは Lambda（最大 15 分）では動かせない。","diagram":null},{"id":"d3-09","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある EC 事業者は、Amazon Aurora MySQL 互換の DB クラスター（ライターインスタンス 1 台）を使用しています。日中に分析担当者がレポートツールから実行する重い SELECT クエリによってライターインスタンスの CPU 使用率が上昇し、注文処理の応答が遅くなっています。レポートは数秒程度古いデータでも問題ありません。この企業は、注文処理への影響をなくし、レポートの読み取り負荷を複数のインスタンスに分散することを求めています。アプリケーションの変更は接続先の変更だけに抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ライターインスタンスのインスタンスクラスを大きくする。レポートツールはクラスターエンドポイントに接続したままにする。","Amazon RDS Proxy を作成する。レポートツールの接続先を RDS Proxy のデフォルトの読み取り/書き込みエンドポイントに変更する。","Aurora レプリカを 2 台追加する。レポートツールの接続先を DB クラスターのリーダーエンドポイントに変更する。","Amazon ElastiCache クラスターを作成する。レポートのクエリ結果をキャッシュする処理をアプリケーションに追加する。"],"answer":[2],"why":["スケールアップで処理能力は上がるが、レポートと注文処理が同じインスタンスを使う点は変わらず、負荷の分離にも分散にもならない。","RDS Proxy は接続をプールして再利用する仕組みで、デフォルトのエンドポイントはライターインスタンスに接続する。読み取りの負荷はライターに残る。","Aurora レプリカはクラスターの共有ストレージを読み取るため、レプリカの遅延は通常短い。リーダーエンドポイントは接続を複数のレプリカに分散するため、接続先を変えるだけでレポートの負荷をライターから切り離せる。","アプリケーションにキャッシュの処理を追加する必要があり、「変更は接続先だけ」という要件に反する。分析のクエリは内容が毎回異なることが多く、キャッシュの効果も期待しにくい。"],"explain":"決め手は「読み取り負荷を複数のインスタンスに分散」「数秒古いデータで可」「変更は接続先だけ」である。Aurora レプリカを追加すると、リーダーエンドポイントが読み取り専用の接続を複数のレプリカに振り分ける。レポートツールの接続先をリーダーエンドポイントにするだけで、ライターインスタンスは注文処理に専念できる。読み取り負荷が変動する場合は、Aurora Auto Scaling でレプリカの台数を自動調整できる。","point":"Aurora の読み取り分散は Aurora レプリカ＋リーダーエンドポイント。書き込みはクラスターエンドポイント（ライター）に接続する。","diagram":{"caption":"正解の構成: レポートの読み取りをリーダーエンドポイントへ分ける","cols":3,"rows":3,"groups":[{"label":"Aurora DB クラスター","kind":"generic","c":1,"r":0,"w":2,"h":3}],"nodes":[{"id":"app","label":"注文処理アプリ","sub":"読み書き","kind":"compute","c":0,"r":0},{"id":"report","label":"レポートツール","sub":"重い SELECT","kind":"client","c":0,"r":1},{"id":"cep","label":"Cluster endpoint","sub":"書き込み用","kind":"network","c":1,"r":0},{"id":"rep","label":"Reader endpoint","sub":"接続をレプリカに分散","kind":"network","c":1,"r":1},{"id":"writer","label":"ライター","sub":"注文処理に専念","kind":"database","c":2,"r":0},{"id":"r1","label":"Aurora レプリカ","sub":"読み取り専用","kind":"database","c":2,"r":1},{"id":"r2","label":"Aurora レプリカ","sub":"読み取り専用","kind":"database","c":2,"r":2}],"edges":[{"from":"app","to":"cep"},{"from":"cep","to":"writer"},{"from":"report","to":"rep"},{"from":"rep","to":"r1"},{"from":"rep","to":"r2"}]}},{"id":"d3-10","domain":3,"topic":"RDS・Aurora","type":"single","stem":"あるチケット販売サイトは、Amazon API Gateway と AWS Lambda で構成された API から Amazon RDS for PostgreSQL に接続しています。販売開始の直後に Lambda 関数の同時実行数が急増すると、データベースの接続数が上限に達してエラーが発生し、接続の確立処理によってデータベースの CPU 使用率も急上昇します。この企業は、関数のコードの変更を最小限に抑えて、アクセスの急増時でも安定してデータベースに接続できるようにすることを求めています。ソリューションアーキテクトはどうすべきですか。","choices":["Amazon RDS Proxy を作成し、DB インスタンスを登録する。Lambda 関数の接続先を RDS Proxy のエンドポイントに変更する。","DB インスタンスのインスタンスクラスを大きくする。DB パラメータグループで max_connections パラメータの値を引き上げる。","RDS for PostgreSQL のリードレプリカを追加する。Lambda 関数の接続先を、処理の内容に応じてプライマリとリードレプリカに振り分けるように変更する。","Lambda 関数に予約された同時実行を設定する。関数の同時実行数を、データベースの接続数の上限より低い値に制限する。"],"answer":[0],"why":["RDS Proxy はデータベースへの接続をプールして多数の関数で共有するため、接続数の急増と接続確立の負荷を抑えられる。アプリケーション側は接続先を変えるだけでよい。","接続数の上限は上がるが、同時実行の急増に合わせて接続が増え続ける点と、接続を確立するたびに CPU を消費する点は変わらない。インスタンスクラスを上げるぶんコストも増える。","チケットの購入は書き込みを伴うため、プライマリへの接続は減らない。読み取りと書き込みで接続先を分けるにはコードの変更も必要になる。","接続数は抑えられるが、上限を超えたリクエストはスロットリングされるため、販売開始直後の利用者がエラーを受け取ることになる。"],"explain":"決め手は「Lambda の同時実行数の急増」「接続数の上限」「接続確立の負荷」「コードの変更を最小限」である。Lambda は実行環境ごとにデータベース接続を作るため、同時実行数が増えると接続数も増える。RDS Proxy は接続プールを持ち、少ない数のデータベース接続を多数のクライアントで再利用するため、急増時の接続エラーと CPU の負荷を抑えられる。フェイルオーバー時の切り替えが速くなる利点もある。","point":"Lambda から RDS への接続の急増には RDS Proxy（接続プール）。アプリは接続先を Proxy のエンドポイントに変えるだけ。","diagram":{"caption":"正解の構成: RDS Proxy で接続をプールして共有する","cols":5,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":3,"h":1}],"nodes":[{"id":"user","label":"購入者","sub":"販売開始に集中","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"購入 API","kind":"network","c":1,"r":0},{"id":"lambda","label":"Lambda","sub":"同時実行が急増","kind":"serverless","c":2,"r":0},{"id":"proxy","label":"RDS Proxy","sub":"接続プール","kind":"database","c":3,"r":0},{"id":"rds","label":"RDS","sub":"PostgreSQL","kind":"database","c":4,"r":0}],"edges":[{"from":"user","to":"apigw"},{"from":"apigw","to":"lambda"},{"from":"lambda","to":"proxy","label":"多数の接続"},{"from":"proxy","to":"rds","label":"接続を再利用"}]}},{"id":"d3-11","domain":3,"topic":"DynamoDB","type":"single","stem":"あるモバイルゲーム会社は、プレイヤーのプロフィールと所持アイテムの情報を Amazon DynamoDB テーブルに保存しています。同じ項目が短時間に何度も読み取られる読み取り中心のワークロードで、イベント期間中は読み取りがさらに増加します。この企業は、現在 1 桁ミリ秒の読み取りレイテンシーをマイクロ秒単位に短縮することを求めています。アプリケーションは DynamoDB の API を使用しており、コードの変更は最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["テーブルのキャパシティモードをオンデマンドに変更する。読み取りリクエストの急増に合わせてキャパシティが自動的に調整されるようにする。","DynamoDB Accelerator（DAX）クラスターを作成する。アプリケーションの DynamoDB クライアントを DAX クライアントに置き換える。","Amazon ElastiCache（Redis OSS）クラスターを作成する。アプリケーションに遅延読み込みのキャッシュ処理と無効化の処理を実装する。","DynamoDB グローバルテーブルを作成し、各リージョンにレプリカテーブルを配置する。プレイヤーに最も近いリージョンのレプリカから読み取るようにアプリケーションを変更する。"],"answer":[1],"why":["オンデマンドはトラフィックの増減に合わせてキャパシティが自動で調整される方式で、1 回の読み取りにかかるレイテンシーは短くならない。","DAX は DynamoDB 専用のインメモリキャッシュで、DynamoDB と互換性のある API を持つ。キャッシュにある項目はマイクロ秒単位で返され、アプリケーションは DAX クライアントに切り替えるだけでよい。","ElastiCache でも高速な応答は得られるが、キャッシュの読み書きや無効化の処理をアプリケーションに実装する必要があり、コードの変更が大きい。","グローバルテーブルは複数のリージョンにレプリカを置く機能で、ネットワークの距離は縮められても、テーブルからの読み取り自体は 1 桁ミリ秒のままである。"],"explain":"決め手は「読み取り中心」「マイクロ秒単位のレイテンシー」「DynamoDB の API」「コードの変更を最小限」である。DAX は DynamoDB の前に置くインメモリキャッシュで、DynamoDB と互換性のある API を提供するため、既存のコードの多くをそのまま使える。同じ項目を繰り返し読み取るワークロードで効果が大きい。なお、強い整合性の読み込みは DAX ではキャッシュされず、DynamoDB に転送される。","point":"DynamoDB の読み取りをマイクロ秒単位にするなら DAX（API 互換のインメモリキャッシュ）。ElastiCache はアプリ側でキャッシュ処理の実装が必要。","diagram":{"caption":"正解の構成: DAX を DynamoDB の前に置いて読み取りをキャッシュする","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"app","label":"ゲームサーバー","sub":"DAX クライアント","kind":"compute","c":0,"r":0},{"id":"dax","label":"DAX クラスター","sub":"インメモリキャッシュ","kind":"database","c":1,"r":0},{"id":"ddb","label":"DynamoDB","sub":"プレイヤー情報","kind":"database","c":2,"r":0}],"edges":[{"from":"app","to":"dax","label":"API 互換"},{"from":"dax","to":"ddb","label":"ミス時に取得"}]}},{"id":"d3-12","domain":3,"topic":"DynamoDB","type":"single","stem":"ある IoT 事業者は、数十万台のセンサーから常時送信される計測値を Amazon DynamoDB テーブルに書き込んでいます。テーブルのパーティションキーは計測日（例: 2026-11-09）、ソートキーは「センサー ID#計測時刻」です。テーブル全体のキャパシティには余裕があるにもかかわらず、書き込みが一部のパーティションに集中し、スロットリングが発生しています。主なアクセスパターンは、センサーごとに期間を指定して計測値を読み取ることです。この問題を根本的に解決するために、ソリューションアーキテクトはどうすべきですか。","choices":["テーブルのキャパシティモードをオンデマンドに変更する。書き込みリクエストの急増に合わせてキャパシティが自動的に調整されるようにする。","DynamoDB Accelerator（DAX）クラスターを作成する。アプリケーションからの書き込みを DAX クライアント経由で行うように変更する。","センサー ID をパーティションキー、計測時刻をソートキーとするグローバルセカンダリインデックスを既存のテーブルに追加する。","センサー ID をパーティションキー、計測時刻をソートキーとする新しいテーブルを作成する。既存のデータを移行し、書き込み先を切り替える。"],"answer":[3],"why":["オンデマンドでも、パーティションごとのスループットの上限は変わらない。同じ日付のキーに書き込みが集中する限り、ホットパーティションは解消しない。","DAX は読み取りを高速化するキャッシュで、書き込みはそのまま DynamoDB のテーブルに書き込まれる（ライトスルー）。書き込みの集中は解消しない。","GSI を追加すると読み取りのアクセスパターンには合うが、ベーステーブルへの書き込みは計測日のパーティションキーに集中したままである。","センサー ID は値の種類が多く、書き込みが多数のパーティションキーに分散する。センサーごとに期間を指定する読み取りも、パーティションキーの指定とソートキーの範囲条件によるクエリで効率よく実行できる。"],"explain":"決め手は「テーブル全体のキャパシティに余裕がある」のに「一部のパーティションに書き込みが集中」している点で、原因はパーティションキーの設計にある。計測日をパーティションキーにすると、その日のすべての書き込みが同じキーに集まる。値の種類が多く、アクセスが均等に散らばる属性（ここではセンサー ID）をパーティションキーにすれば、書き込みが分散し、主なアクセスパターンのクエリにも合う。","point":"ホットパーティションの根本対策は、値の種類が多くアクセスが均等な属性をパーティションキーにすること。日付だけのキーは集中しやすい。","diagram":null},{"id":"d3-13","domain":3,"topic":"ElastiCache","type":"single","stem":"ある EC 事業者は、商品情報を Amazon RDS for MySQL に保存し、その前段に Amazon ElastiCache（Redis OSS）を配置しています。現在のキャッシュ戦略は、キャッシュにデータがないときだけデータベースから読み込んでキャッシュに書き込む遅延読み込みで、TTL は 1 時間です。価格を変更しても、最大 1 時間古い価格が表示される問題が起きています。価格の更新は 1 日に数回程度で、読み取りが圧倒的に多いワークロードです。この企業は、価格の更新を直ちにキャッシュに反映し、かつキャッシュミスを増やさないことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["価格をデータベースに書き込む処理を変更し、同じ値をキャッシュにも書き込むようにする。ライトスルーのキャッシュ戦略を追加する。","キャッシュの TTL を 1 時間から 1 分に短縮する。古い価格がキャッシュに残る時間をできるだけ短くして、更新を早く反映する。","ElastiCache クラスターのシャード数を増やす。キャッシュの容量と処理能力を引き上げ、キャッシュのヒット率を高める。","RDS for MySQL のリードレプリカを追加する。キャッシュミスが発生したときの読み込み先をリードレプリカに変更する。"],"answer":[0],"why":["ライトスルーではデータベースの更新と同時にキャッシュも更新するため、キャッシュの値が古くならない。読み取りは引き続きキャッシュから返せるため、キャッシュミスも増えない。更新の頻度が低いため、書き込み時の追加の負荷も小さい。","古い価格が表示される時間は短くなるが、最大 1 分は古いままで「直ちに反映」を満たさない。TTL が短いぶんキャッシュミスが増え、データベースへの読み込みも増える。","容量と処理能力は上がるが、キャッシュの値がデータベースの更新に追従しないという問題は解決しない。","キャッシュミス時の読み込み先が変わるだけで、TTL が切れるまで古い価格がキャッシュに残る問題は変わらない。レプリカの遅延により、さらに古い値を読む可能性もある。"],"explain":"決め手は「更新を直ちにキャッシュに反映」「キャッシュミスを増やさない」「更新は少なく読み取りが多い」である。遅延読み込みはキャッシュミス時にだけデータを読み込むため、TTL が切れるまで古いデータが残る。ライトスルーはデータベースへの書き込みと同時にキャッシュを更新するため、常に最新の値をキャッシュから返せる。実際には、ライトスルーに TTL を組み合わせて、使われないデータがキャッシュに溜まり続けないようにすることが多い。","point":"遅延読み込みは必要なデータだけをキャッシュするが古くなりうる。常に最新にするならライトスルー（書き込み時にキャッシュも更新）。","diagram":null},{"id":"d3-14","domain":3,"topic":"CloudFront","type":"single","stem":"ある旅行予約サイトは、東京リージョンの Application Load Balancer（ALB）と Amazon EC2 インスタンスでサイト全体を配信しています。画像や CSS などの静的コンテンツは Amazon S3 に移行することが決まっています。検索結果などのページは利用者ごとに内容が異なる動的コンテンツです。海外の利用者から、ページの表示が遅いという苦情が増えています。この企業は、運用するリージョンを増やさずに、世界中の利用者に対する静的コンテンツと動的コンテンツの両方の応答を高速化し、オリジンの負荷も軽減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["AWS Global Accelerator のアクセラレーターを作成し、ALB をエンドポイントとして登録する。静的コンテンツも ALB 経由で配信する。","S3 バケットで S3 Transfer Acceleration を有効にする。静的コンテンツはアクセラレーションエンドポイントから、動的コンテンツは ALB から配信する。","Amazon CloudFront ディストリビューションで S3 と ALB をオリジンにする。静的コンテンツはキャッシュし、動的コンテンツはキャッシュせずに ALB に転送する。","別のリージョンにも ALB と EC2 インスタンスを構築する。Amazon Route 53 のレイテンシーベースルーティングで、利用者を最も近いリージョンに振り分ける。"],"answer":[2],"why":["Global Accelerator は AWS のネットワークを使って動的コンテンツの通信も速くできるが、コンテンツをキャッシュしない。静的コンテンツのリクエストもすべてオリジンに届くため、オリジンの負荷は減らない。","Transfer Acceleration は S3 との間の転送をエッジ経由で速くする機能で、コンテンツをキャッシュしない。ALB が返す動的コンテンツも速くならない。","静的コンテンツはエッジロケーションのキャッシュから返されるため速く、オリジンの負荷も減る。動的コンテンツもエッジで TLS を終端し、AWS のネットワークと持続的な接続を使ってオリジンへ転送されるため、インターネットを直接通るより応答が速くなる。","応答は速くなるが、運用するリージョンが増え、データの複製などの運用上のオーバーヘッドも大きくなる。「リージョンを増やさない」という要件に反する。"],"explain":"決め手は「静的・動的の両方を高速化」「オリジンの負荷を軽減」「リージョンを増やさない」である。CloudFront は 1 つのディストリビューションに複数のオリジンを設定でき、パスパターンごとのキャッシュ動作（ビヘイビア）でオリジンとキャッシュの方法を切り替えられる。静的コンテンツはキャッシュしてオリジンへのリクエストを減らし、動的コンテンツはキャッシュを無効にしても、エッジから AWS のネットワークを通る経路で高速化できる。","point":"静的はキャッシュ、動的はキャッシュせずに転送。CloudFront のキャッシュ動作でパスごとにオリジンを分けると、両方を速くできる。","diagram":{"caption":"正解の構成: パスごとに S3 と ALB をオリジンにして配信する","cols":4,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":2}],"nodes":[{"id":"user","label":"海外の利用者","sub":"ブラウザ","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"エッジでキャッシュ","kind":"network","c":1,"r":0},{"id":"s3","label":"S3","sub":"静的コンテンツ","kind":"storage","c":2,"r":0},{"id":"alb","label":"ALB","sub":"動的コンテンツ","kind":"network","c":2,"r":1},{"id":"ec2","label":"EC2","sub":"検索・予約処理","kind":"compute","c":3,"r":1}],"edges":[{"from":"user","to":"cf"},{"from":"cf","to":"s3","label":"キャッシュ"},{"from":"cf","to":"alb","label":"キャッシュなし"},{"from":"alb","to":"ec2"}]}},{"id":"d3-15","domain":3,"topic":"Global Accelerator","type":"single","stem":"あるオンラインゲーム会社は、UDP でリアルタイムに通信する対戦ゲームのサーバーを、東京、北米、欧州の 3 つのリージョンで Network Load Balancer（NLB）の背後に配置しています。この企業は、プレイヤーを最も近い正常なリージョンに接続し、インターネット上の経路によるレイテンシーとジッターのばらつきを減らすことを求めています。また、企業ネットワークのファイアウォールに登録できるように、全リージョン共通の固定 IP アドレスで通信を受け付ける必要があります。リージョンで障害が発生したときは、DNS のキャッシュに左右されずに別のリージョンへ切り替える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon Route 53 でレイテンシーベースルーティングのレコードを作成し、ヘルスチェックを関連付ける。各リージョンの NLB の DNS 名を値として登録する。","AWS Global Accelerator のアクセラレーターを作成する。リージョンごとのエンドポイントグループに、各リージョンの NLB を登録する。","Amazon CloudFront ディストリビューションを作成する。各リージョンの NLB をオリジンとして登録し、オリジングループでフェイルオーバーを構成する。","各リージョンの VPC を AWS Transit Gateway のピアリング接続でつなぐ。東京リージョンの NLB で全プレイヤーの通信を受け付け、各リージョンに転送する。"],"answer":[1],"why":["最寄りのリージョンには振り分けられるが、切り替えはクライアントや DNS リゾルバーのキャッシュに左右される。通信はインターネットを通り、IP アドレスもリージョンごとに異なる。","Global Accelerator は 2 つの固定のエニーキャスト IP アドレスを提供し、プレイヤーの通信を最寄りのエッジロケーションから AWS のネットワーク経由で最も近い正常なエンドポイントに届ける。UDP に対応し、ヘルスチェックによる切り替えも DNS に依存しない。","CloudFront は HTTP・HTTPS のコンテンツ配信のためのサービスであり、UDP によるゲームの通信には使えない。Global Accelerator との取り違えに注意する。","すべての通信が東京に集まるため、北米や欧州のプレイヤーのレイテンシーが大きくなる。東京リージョンの障害時に切り替えることもできない。"],"explain":"決め手は「UDP」「固定 IP アドレス」「AWS のネットワークで経路を安定させる」「DNS に左右されない切り替え」である。Global Accelerator はエニーキャストの静的 IP アドレスで通信を受け、最寄りのエッジロケーションから AWS のグローバルネットワークを通して、ヘルスチェックで正常と判断したエンドポイントへ転送する。TCP と UDP の両方に対応するため、ゲームや VoIP のような HTTP 以外の用途に向く。CloudFront は HTTP のコンテンツ配信とキャッシュに使う。","point":"UDP・固定 IP・DNS に依存しない速い切り替え・複数リージョンへの振り分けは Global Accelerator。HTTP のキャッシュ配信は CloudFront。","diagram":{"caption":"正解の構成: Global Accelerator で最も近い正常なリージョンへ届ける","cols":4,"rows":3,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":1},{"label":"北米のリージョン","kind":"region","c":2,"r":1,"w":2,"h":1},{"label":"欧州のリージョン","kind":"region","c":2,"r":2,"w":2,"h":1}],"nodes":[{"id":"player","label":"プレイヤー","sub":"UDP で接続","kind":"client","c":0,"r":1},{"id":"ga","label":"Accelerator","sub":"エニーキャスト IP","kind":"network","c":1,"r":1},{"id":"nlbjp","label":"NLB","sub":"東京","kind":"network","c":2,"r":0},{"id":"nlbus","label":"NLB","sub":"北米","kind":"network","c":2,"r":1},{"id":"nlbeu","label":"NLB","sub":"欧州","kind":"network","c":2,"r":2},{"id":"srvjp","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":0},{"id":"srvus","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":1},{"id":"srveu","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":2}],"edges":[{"from":"player","to":"ga","label":"最寄りのエッジ"},{"from":"ga","to":"nlbjp"},{"from":"ga","to":"nlbus"},{"from":"ga","to":"nlbeu"},{"from":"nlbjp","to":"srvjp"},{"from":"nlbus","to":"srvus"},{"from":"nlbeu","to":"srveu"}]}},{"id":"d3-16","domain":3,"topic":"ハイブリッド接続","type":"single","stem":"ある製造業の企業は、工場で生成される数 TB の設計データを、毎晩 AWS 上の 3 つの VPC にある処理システムに送信しています。現在はインターネット経由の AWS Site-to-Site VPN を使用していますが、時間帯によって転送速度とレイテンシーが大きく変動し、夜間の処理が時間内に終わらないことがあります。この企業は、インターネットの混雑の影響を受けない、一貫したネットワークパフォーマンスと安定した帯域を確保することを求めています。3 つの VPC はすでに AWS Transit Gateway にアタッチされています。これらの要件を満たすソリューションはどれですか。","choices":["AWS Direct Connect の専用接続を開設する。Direct Connect ゲートウェイを作成し、トランジット仮想インターフェイスを使って Transit Gateway に関連付ける。","Site-to-Site VPN 接続を複数追加して Transit Gateway にアタッチする。Transit Gateway で ECMP を有効にし、複数の VPN トンネルの帯域を束ねる。","アクセラレーションを有効にした Site-to-Site VPN 接続を Transit Gateway に作成する。工場から最寄りのエッジロケーションを経由して接続する。","工場に AWS DataSync エージェントをデプロイする。インターネット経由の並列転送で、各 VPC から利用できる Amazon EFS にデータを書き込む。"],"answer":[0],"why":["Direct Connect は AWS との専用の物理接続で、インターネットを経由しないため、一貫したネットワークパフォーマンスが得られる。トランジット仮想インターフェイスと Direct Connect ゲートウェイを使えば、Transit Gateway にアタッチされた複数の VPC にまとめて到達できる。","ECMP で束ねると合計の帯域は増えるが、通信はインターネットを通るため、混雑による速度やレイテンシーの変動は残る。","AWS のネットワークを通る区間が増えるため改善は見込めるが、工場から最寄りのエッジロケーションまではインターネットを通るため、一貫したパフォーマンスにはならない。","転送の効率は上がるが、経路はインターネットのままで混雑の影響を受ける。ネットワークの安定性という根本の問題は解決しない。"],"explain":"決め手は「インターネットの混雑の影響を受けない」「一貫したネットワークパフォーマンス」「安定した帯域」である。インターネットを経由する VPN は、アクセラレーションや ECMP で改善はできても変動をなくせない。Direct Connect の専用接続を使い、Direct Connect ゲートウェイとトランジット仮想インターフェイスで Transit Gateway に関連付けると、既存の複数の VPC に専用線でまとめて到達できる。暗号化が必要な場合は、Direct Connect の上で VPN を張る構成や MACsec も選べる。","point":"インターネットの変動を避けて一貫した性能・帯域が必要なら Direct Connect。複数の VPC へは DX ゲートウェイ＋トランジット VIF で Transit Gateway に接続する。","diagram":{"caption":"正解の構成: Direct Connect から Transit Gateway 経由で複数の VPC へ","cols":5,"rows":3,"groups":[{"label":"工場","kind":"onprem","c":0,"r":1,"w":1,"h":1},{"label":"AWS リージョン","kind":"region","c":3,"r":0,"w":2,"h":3}],"nodes":[{"id":"factory","label":"工場のサーバー","sub":"設計データ","kind":"onprem","c":0,"r":1},{"id":"dx","label":"Direct Connect","sub":"専用接続","kind":"network","c":1,"r":1},{"id":"dxgw","label":"DX ゲートウェイ","sub":"トランジット VIF","kind":"network","c":2,"r":1},{"id":"tgw","label":"Transit Gateway","sub":"VPC を集約","kind":"network","c":3,"r":1},{"id":"vpca","label":"VPC A","sub":"処理システム","kind":"compute","c":4,"r":0},{"id":"vpcb","label":"VPC B","sub":"処理システム","kind":"compute","c":4,"r":1},{"id":"vpcc","label":"VPC C","sub":"処理システム","kind":"compute","c":4,"r":2}],"edges":[{"from":"factory","to":"dx"},{"from":"dx","to":"dxgw"},{"from":"dxgw","to":"tgw"},{"from":"tgw","to":"vpca"},{"from":"tgw","to":"vpcb"},{"from":"tgw","to":"vpcc"}]}},{"id":"d3-17","domain":3,"topic":"Kinesis","type":"single","stem":"あるオンライン広告企業は、Web サイトのクリックストリームを毎秒数十万件のイベントとして収集しています。このデータは、不正クリックの検知、リアルタイムのダッシュボード、Amazon S3 への長期保存の 3 つのアプリケーションが、それぞれ独立して 1 秒未満の遅延で読み取る必要があります。また、アプリケーションに障害が発生したときは、過去 24 時間分のデータを読み直して再処理できる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon SQS の標準キューを作成し、イベントをキューに送信する。3 つのアプリケーションが同じキューをポーリングしてメッセージを受信する。","Amazon Data Firehose のストリームを作成し、イベントをストリームに送信する。3 つのアプリケーションをストリームの配信先として設定する。","Amazon Kinesis Data Streams のデータストリームにイベントを送信する。3 つのアプリケーションを拡張ファンアウトのコンシューマーとして登録する。","Amazon SNS の標準トピックを作成し、イベントを発行する。3 つのアプリケーションのエンドポイントを、それぞれ別のサブスクリプションとして登録する。"],"answer":[2],"why":["SQS のメッセージは 1 つのコンシューマーが処理して削除するもので、3 つのアプリケーションがそれぞれ全件を読むことはできない。削除したメッセージを読み直すこともできない。","Data Firehose は S3 などの配信先にデータをバッファリングして届けるサービスで、1 つのストリームの配信先は 1 つである。過去のデータを読み直す仕組みもない。","Kinesis Data Streams はデータを保持期間（既定で 24 時間）のあいだ保存し、複数のコンシューマーがそれぞれ独立して読み取れる。拡張ファンアウトを使うと、コンシューマーごとに専用のスループットで低レイテンシーにデータを受け取れる。","SNS は複数のサブスクライバーにプッシュで配信できるが、標準トピックはメッセージを保持しないため、障害時に過去 24 時間分を読み直すことができない。"],"explain":"決め手は「3 つのアプリケーションがそれぞれ独立して読み取る」「1 秒未満の遅延」「過去 24 時間分を読み直す」である。Kinesis Data Streams はシャードにデータを保持し、各コンシューマーが自分の読み取り位置から読めるため、再処理もできる。拡張ファンアウトではコンシューマーごとにシャードあたりの専用スループットが割り当てられ、データがプッシュされるため、コンシューマーを増やしても互いに影響しにくい。","point":"複数のアプリが同じストリームを独立・低遅延で読み、再処理もしたいなら Kinesis Data Streams（拡張ファンアウト）。","diagram":{"caption":"正解の構成: Kinesis Data Streams を 3 つのコンシューマーが独立して読む","cols":4,"rows":3,"groups":[],"nodes":[{"id":"web","label":"Web サイト","sub":"クリックストリーム","kind":"client","c":0,"r":1},{"id":"kds","label":"Data Streams","sub":"保持期間 24 時間","kind":"analytics","c":1,"r":1},{"id":"fraud","label":"Lambda","sub":"不正クリック検知","kind":"serverless","c":2,"r":0},{"id":"dash","label":"Managed Flink","sub":"ダッシュボード集計","kind":"analytics","c":2,"r":1},{"id":"arch","label":"Lambda","sub":"保存用の処理","kind":"serverless","c":2,"r":2},{"id":"s3","label":"S3","sub":"長期保存","kind":"storage","c":3,"r":2}],"edges":[{"from":"web","to":"kds"},{"from":"kds","to":"fraud","label":"専用で受信"},{"from":"kds","to":"dash","label":"専用で受信"},{"from":"kds","to":"arch","label":"専用で受信"},{"from":"arch","to":"s3"}]}},{"id":"d3-18","domain":3,"topic":"分析","type":"single","stem":"ある小売企業は、全店舗の POS データを日次の CSV ファイルとして Amazon S3 に蓄積しており、データ量は数年分で数十 TB になっています。分析担当者は Amazon Athena でこのデータを分析していますが、ほとんどのクエリは特定の期間を対象に、数十ある列のうち数列（店舗 ID、商品 ID、売上金額など）だけを集計します。クエリの実行に時間がかかり、スキャンされるデータ量も多くなっています。この企業は、クエリのパフォーマンスを向上させ、スキャンされるデータ量を削減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Athena のクエリ結果の再利用を有効にする。以前に実行したクエリと同じクエリについては、保存された結果を返すように設定する。","AWS Glue の ETL ジョブでデータを Apache Parquet 形式に変換する。日付でパーティション分割して S3 に保存する。","CSV ファイルを gzip 形式で圧縮して S3 に保存し直す。Athena のテーブル定義は変更せずに、S3 から読み込むデータ量を減らす。","CSV ファイルを店舗ごとの小さなファイルに分割して S3 に保存し直す。Athena がより多くのファイルを並列に読み込めるようにする。"],"answer":[1],"why":["クエリ結果の再利用は、同じクエリを再実行するときに前の結果を返す機能で、条件の異なる新しいクエリのパフォーマンスやスキャン量は改善しない。","Parquet は列指向の形式で、クエリに必要な列だけを読み込め、圧縮の効率も高い。日付でパーティション分割すると、期間の条件に合わないデータを読み飛ばせるため、スキャン量と実行時間を大きく減らせる。","圧縮で読み込むバイト数は減るが、行指向の CSV のままなので不要な列も読み込み、期間に関係なく全ファイルをスキャンする点は変わらない。","小さなファイルが大量にあると、ファイルを開く処理や一覧の取得が増えてかえって遅くなる。必要な列や期間だけを読む効果もない。"],"explain":"決め手は「特定の期間」「数十列のうち数列だけ」「スキャンされるデータ量を削減」である。Athena はスキャンしたデータ量に応じて課金され、読み込む量が減るほど速くなる。列指向形式（Parquet や ORC）で必要な列だけを読み、パーティション分割で必要な期間だけを読むのが基本の最適化である。変換は Glue の ETL ジョブで行い、AWS Glue Data Catalog のテーブル定義とパーティションも更新する。","point":"Athena の高速化とスキャン量の削減は、列指向形式（Parquet / ORC）＋圧縮＋パーティション分割。小さなファイルの大量化は避ける。","diagram":{"caption":"正解の構成: Glue で Parquet に変換し、日付でパーティション分割する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"raw","label":"S3（CSV）","sub":"日次の POS データ","kind":"storage","c":0,"r":0},{"id":"glue","label":"Glue ETL ジョブ","sub":"Parquet に変換","kind":"analytics","c":1,"r":0},{"id":"pq","label":"S3（Parquet）","sub":"dt=YYYY-MM-DD","kind":"storage","c":2,"r":0},{"id":"athena","label":"Athena","sub":"必要な列・期間だけ","kind":"analytics","c":3,"r":0},{"id":"catalog","label":"Data Catalog","sub":"テーブル定義","kind":"analytics","c":2,"r":1}],"edges":[{"from":"raw","to":"glue"},{"from":"glue","to":"pq","label":"変換して保存"},{"from":"pq","to":"athena","label":"パーティション"},{"from":"glue","to":"catalog","label":"定義を更新","style":"dashed"},{"from":"athena","to":"catalog","label":"メタデータ参照","style":"dashed"}]}},{"id":"d3-19","domain":3,"topic":"ELB","type":"single","stem":"ある企業は、独自の TCP ベースのプロトコルで通信する取引システムを Amazon EC2 インスタンス上で運用しています。取引時間帯の開始直後には接続数が突発的に数百万規模まで増加し、通信のレイテンシーは可能な限り小さくする必要があります。また、取引先は自社のファイアウォールで、この企業のシステムの固定 IP アドレスだけを許可しています。ソリューションアーキテクトは、これらの要件を満たすロードバランサーを設計する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Application Load Balancer を作成し、EC2 インスタンスをターゲットグループに登録する。取引先には ALB の DNS 名を通知し、その名前を許可してもらう。リスナーは HTTPS で作成する。","Gateway Load Balancer を作成し、EC2 インスタンスをターゲットとして登録する。取引先からの通信を GENEVE プロトコルでインスタンスに転送する。","Network Load Balancer を作成し、各 AZ のサブネットに Elastic IP アドレスを割り当てる。TCP リスナーを設定して EC2 インスタンスをターゲットに登録する。","Classic Load Balancer を作成し、TCP リスナーを設定する。接続の急増に備えて、AWS サポートにロードバランサーの事前ウォームアップを依頼する。"],"answer":[2],"why":["ALB は HTTP / HTTPS などのレイヤー 7 向けで、独自の TCP プロトコルは扱えない。IP アドレスも固定ではなく、DNS 名に対する許可も取引先のファイアウォールでは実現できない。","Gateway Load Balancer はファイアウォールなどの仮想アプライアンスを透過的に挟むためのもので、一般的なアプリケーションの負荷分散には使わない。固定 IP の要件も満たさない。","NLB はレイヤー 4 で動作し、急激な接続数の増加に対応でき、レイテンシーも小さい。AZ ごとに Elastic IP アドレスを割り当てられるため、取引先に固定 IP を示せる。","Classic Load Balancer は従来世代で、新規の設計には推奨されない。固定 IP を割り当てる機能もなく、事前ウォームアップの依頼で要件を満たす設計にはならない。"],"explain":"「独自の TCP プロトコル」「接続数の突発的な増加」「レイテンシーを最小に」「固定 IP アドレス」がそろったら NLB を選ぶ。ALB は HTTP 系のアプリケーション向けで、パスやヘッダーに基づくルーティングが必要なときに使う。NLB は AZ ごとに静的 IP（Elastic IP）を持てるので、IP アドレスの許可リストが必要な取引先との接続にも向く。","point":"TCP / UDP・超低レイテンシー・固定 IP・急激な増加は NLB。HTTP のパスベースルーティングは ALB、仮想アプライアンスの挿入は GWLB。","diagram":{"caption":"正解の構成: Elastic IP を持つ NLB で TCP 通信を分散する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"partner","label":"取引先","sub":"固定 IP を許可","kind":"client","c":0,"r":0},{"id":"nlb","label":"NLB","sub":"AZ ごとに EIP","kind":"network","c":1,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"取引システム","kind":"compute","c":2,"r":0}],"edges":[{"from":"partner","to":"nlb","label":"TCP"},{"from":"nlb","to":"ec2","label":"TCP"}]}},{"id":"d3-20","domain":3,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、アップロードされた画像をリサイズする AWS Lambda 関数を運用しています。関数のメモリ設定は 128 MB で、CloudWatch Logs を見ると実際のメモリ使用量は 100 MB 程度ですが、1 回の実行に 8 秒前後かかっており、処理時間の短縮が求められています。実行は常時行われているため、コールドスタートは問題になっていません。ソリューションアーキテクトは、コードを大きく変更せずに処理時間を短縮する必要があります。最も運用上のオーバーヘッドが少ない方法で、この要件を満たすソリューションはどれですか。","choices":["関数のメモリ設定を引き上げる。AWS Lambda Power Tuning などで、処理時間とコストのバランスが良い値を確認する。","関数のエイリアスにプロビジョニングされた同時実行を設定し、実行環境を事前に初期化した状態で待機させる。","関数の設定画面で vCPU 数を直接指定する。画像処理に十分な vCPU 数を設定して、処理を並列化し、処理時間を短縮する。","関数の予約された同時実行数を増やし、他の関数と競合せずに同時に実行できる関数の数の上限を引き上げて、処理を並列にさばく。"],"answer":[0],"why":["Lambda では、メモリ設定に比例して CPU 性能などのリソースが割り当てられる。CPU がボトルネックの処理は、メモリを増やすと処理時間が短縮され、課金される時間が短くなって費用が大きく変わらないこともある。","プロビジョニングされた同時実行はコールドスタートを避けるための機能で、1 回の処理時間そのものは短くならない。今回はコールドスタートが問題ではない。","Lambda の関数設定に vCPU 数を直接指定する項目はない。CPU 性能はメモリ設定を通じて変わる。","予約された同時実行は、同時実行数の確保と上限の設定に使う。1 回の実行にかかる時間は変わらない。"],"explain":"「メモリ使用量は少ないのに処理が遅い」「コードの変更なし」「運用上のオーバーヘッドが少ない」というのがヒント。Lambda は CPU を直接選べず、メモリ設定に応じて CPU が配分されるので、メモリを増やすのが最も簡単な対処になる。最適値は AWS Lambda Power Tuning や AWS Compute Optimizer の推奨で確認できる。","point":"Lambda の CPU はメモリ設定に比例する。処理が遅いが CPU 負荷が高いなら、使用量が少なくてもメモリ設定を増やす。","diagram":null},{"id":"d3-21","domain":3,"topic":"EC2","type":"single","stem":"ある企業は、Amazon EC2 インスタンス上で自己管理の NoSQL データベースを運用しています。このデータベースはランダムな読み書きを毎秒数十万回行い、ストレージにはミリ秒未満のレイテンシーが求められます。現在は汎用の m5 ファミリーのインスタンスと Amazon EBS の SSD ボリュームを使っていますが、ストレージの I/O 性能が不足しています。データは他のノードに複製されており、ノード単体のデータを失っても再構築できます。ソリューションアーキテクトは、ストレージ I/O 性能を最大にする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["コンピューティング最適化の c ファミリーのインスタンスに変更し、vCPU 数を増やす。EBS ボリュームは変更しない。","メモリ最適化の r ファミリーのインスタンスに変更し、データをすべてメモリ上に常駐させる。EBS ボリュームは作成時のバックアップ用にだけ使う。","汎用の m ファミリーのまま、プロビジョニング済み IOPS SSD の io2 ボリュームに変更する。EBS 最適化を有効にする。","ストレージ最適化の i ファミリーのインスタンスに変更し、ローカルの NVMe SSD インスタンスストアにデータを置く。"],"answer":[3],"why":["c ファミリーは CPU 負荷の高い処理に向く。ボトルネックはストレージ I/O で、vCPU を増やしても改善しない。","r ファミリーはメモリを多く使うワークロード向けだが、データが大きくなるとメモリに収まらない。ランダム I/O の性能問題を解決する選択として適切ではない。","io2 は高い IOPS を出せるが、ネットワーク経由の EBS はインスタンスストアよりレイテンシーが大きい。ミリ秒未満の最小レイテンシーと最大の I/O 性能という要件では劣る。","i ファミリーはローカルの NVMe SSD を持ち、ランダム I/O の IOPS とレイテンシーに優れる。データはレプリケーションで保護されているため、インスタンスストアの揮発性も許容できる。"],"explain":"「ランダム I/O が毎秒数十万回」「ミリ秒未満のレイテンシー」「データは他のノードに複製されている」がヒント。ストレージ I/O が最優先なら、ストレージ最適化インスタンス（i ファミリーなど）のインスタンスストアを使う。インスタンスストアは停止や障害でデータが失われるので、複製などで保護できる場合に限って使う。","point":"ストレージ I/O 最優先はストレージ最適化（i / d）のインスタンスストア。揮発性なので複製で保護できるデータに使う。","diagram":null},{"id":"d3-22","domain":3,"topic":"Auto Scaling","type":"multi","stem":"ある企業は、社内向けの Web ポータルを、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。毎営業日の 9:00 に社員が一斉にアクセスするため、その直後は応答が遅くなります。日中は、会議や社内イベントの影響でアクセス数が予測できない形で変動します。ソリューションアーキテクトは、アクセスの急増時にも日中の変動時にも、応答速度を維持できるようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["平日の 8:45 に最小容量を引き上げ、夜間に元へ戻すスケジュールされたスケーリングアクションを作成する。","CPU 使用率が 90% を超えたときに 1 台だけ追加するシンプルスケーリングポリシーを設定し、クールダウンを 600 秒にする。","Auto Scaling グループの最大容量を現在の 10 倍に引き上げ、ヘルスチェックの猶予期間を長くする。","ターゲットあたりのリクエスト数（ALBRequestCountPerTarget）をメトリクスとするターゲット追跡スケーリングポリシーを作成する。","CloudWatch アラームから Amazon SNS と AWS Lambda を呼び出し、負荷に応じて EC2 インスタンスを直接起動する。"],"answer":[0,3],"why":["時刻が分かっている急増には、スケジュールされたスケーリングで先に容量を確保できる。起動が間に合わずに応答が遅くなるのを防げる。","負荷が上がってから 1 台ずつ追加するため、急増に追いつかない。クールダウンも長く、変動に細かく対応できない。","最大容量を増やしても、スケールアウトを始めるきっかけや速さは変わらない。ヘルスチェックの猶予期間も応答速度とは関係がない。","リクエスト数のメトリクスを目標値に保つように、自動で台数を増減できる。予測できない変動にも、運用の手間なく追随できる。","独自の仕組みを作り込む必要があり、起動したインスタンスを Auto Scaling グループやロードバランサーに登録する処理も自前になる。運用上のオーバーヘッドが大きく、マネージドなポリシーで足りる。"],"explain":"要件は「決まった時刻の急増」と「予測できない変動」の 2 つ。前者には、事前に容量を引き上げるスケジュールされたスケーリング、後者には、メトリクスを目標値に保つターゲット追跡スケーリングを組み合わせる。ターゲット追跡は、ALB 配下ならリクエスト数が、CPU 負荷が中心なら平均 CPU 使用率が使いやすい。","point":"決まった時刻の急増はスケジュールされたスケーリング、予測できない変動はターゲット追跡。両方を併用できる。","diagram":{"caption":"正解の構成: スケジュールとターゲット追跡を併用する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"sched","label":"スケジュール","sub":"8:45 に最小容量UP","kind":"management","c":0,"r":0},{"id":"asg","label":"ASG","sub":"台数を増減","kind":"compute","c":1,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"Web ポータル","kind":"compute","c":2,"r":0},{"id":"tt","label":"ターゲット追跡","sub":"リクエスト数を維持","kind":"management","c":1,"r":1}],"edges":[{"from":"sched","to":"asg"},{"from":"asg","to":"ec2","label":"起動・終了"},{"from":"tt","to":"asg"}]}},{"id":"d3-23","domain":3,"topic":"S3","type":"multi","stem":"ある企業は、同じリージョンにある Amazon EC2 インスタンス群から、Amazon S3 バケットに保存された数 GB の大きなオブジェクトを繰り返し読み込んでいます。現在は 1 つのバケットのプレフィックス 1 つにすべてのオブジェクトを置き、各オブジェクトを 1 本のリクエストで順番に取得しています。読み込み全体に時間がかかっており、同時に大量の GET リクエストを送るとスロットリングも発生します。ソリューションアーキテクトは、読み取りのスループットを向上させる必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["S3 Transfer Acceleration をバケットで有効にし、EC2 インスタンスからは高速化エンドポイントを使って取得する。","Range ヘッダーでオブジェクトを複数のバイト範囲に分け、並列に取得して結合する。","オブジェクトを S3 Standard-IA ストレージクラスに移行して、取得時のスループットを上げる。","EC2 インスタンスのタイプをより大きなものに変更し、1 本のリクエストで順番にオブジェクトを取得する方式は変えない。","オブジェクトを複数のプレフィックスに分散して配置し、各プレフィックスに対するリクエストを並列に処理する。"],"answer":[1,4],"why":["Transfer Acceleration は、遠く離れたクライアントとのデータ転送を高速化する機能。同じリージョン内の EC2 からの読み取りには効果が薄い。","バイト範囲フェッチを使うと、1 つの大きなオブジェクトを並列に取得でき、スループットが上がる。失敗した範囲だけを再取得することもできる。","ストレージクラスの変更で GET のスループットは上がらない。Standard-IA は取得料金も加わり、頻繁に読むデータには向かない。","インスタンスを大きくしても、順番に 1 本ずつ取得する方式のままでは、並列化できずに S3 の性能を使い切れない。","S3 のリクエスト性能はプレフィックスごとに確保される。プレフィックスを分散して並列に読み込めば、全体の読み取りスループットが上がり、スロットリングも避けやすくなる。"],"explain":"「1 つのプレフィックスに集中している」「1 本のリクエストで順番に取得」という 2 つの原因それぞれに対策を打つ。S3 はプレフィックスごとにリクエスト性能が確保されるため、複数プレフィックスへの分散と並列化で全体の性能を伸ばせる。大きなオブジェクトにはバイト範囲フェッチで並列に取得する。","point":"S3 の読み取りを速くするには、プレフィックスを分散して並列化し、大きなオブジェクトはバイト範囲フェッチで並列取得する。","diagram":null},{"id":"d3-24","domain":3,"topic":"CloudFront","type":"single","stem":"ある EC 事業者は、Amazon CloudFront ディストリビューションを使って、Application Load Balancer の背後にある画像変換サービスから商品画像を配信しています。画像の URL には、変換用のパラメーター（width、format）のほか、広告の計測に使う utm_source や、ユーザーごとに変わる session_id などのクエリ文字列が付与されます。キャッシュヒット率が低く、オリジンの負荷が高くなっています。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えてキャッシュヒット率を高める必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ディストリビューションの最大 TTL を 1 年に延長し、エッジロケーションでキャッシュされたオブジェクトが保持される期間を長くする。","キャッシュポリシーで、width と format のクエリ文字列だけをキャッシュキーに含める。utm_source と session_id はキャッシュキーから除外する。","キャッシュポリシーで、すべてのクエリ文字列をキャッシュキーに含める。URL ごとに別々にキャッシュを保持して、確実に正しい画像を配信する。","CloudFront のオリジンシールドを有効にして、エッジロケーションからオリジンへのリクエストの前に、リージョン単位の追加のキャッシュ層を設けて、オリジンへの負荷を減らす。"],"answer":[1],"why":["TTL を延ばしても、キャッシュキーに session_id などが含まれている限り、リクエストごとに別のオブジェクトとして扱われ、ヒットしない。","キャッシュキーを、画像の内容を決める値だけに絞る。計測用やセッション用のパラメーターが違っても同じキャッシュを使えるため、ヒット率が上がる。","すべてのクエリ文字列をキーに含めると、ユーザーごとに値が変わる session_id によって、キャッシュがほとんど再利用されなくなる。","オリジンシールドはオリジンへのリクエスト数を減らせるが、エッジでのキャッシュキーが分かれる問題は解決しない。ヒット率が低い根本原因への対処にならない。"],"explain":"ヒット率が低い原因は、内容に影響しない値までキャッシュキーに含まれていること。CloudFront のキャッシュポリシーでは、キャッシュキーに含めるクエリ文字列・ヘッダー・Cookie を指定できる。必要な値だけを許可リストで指定し、それ以外は除外する。除外した値をオリジンに渡す必要がある場合は、オリジンリクエストポリシーで転送できる。","point":"キャッシュヒット率を上げるには、キャッシュキーを必要最小限にする。除外した値をオリジンに渡すにはオリジンリクエストポリシー。","diagram":{"caption":"正解の構成: キャッシュキーを必要な値だけに絞る","cols":3,"rows":1,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"?width=&utm_source=","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"キーは width, format","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"画像変換サービス","kind":"network","c":2,"r":0}],"edges":[{"from":"user","to":"cf"},{"from":"cf","to":"alb","label":"ミスのみ","style":"dashed"}]}},{"id":"d3-25","domain":3,"topic":"ElastiCache","type":"single","stem":"あるゲーム会社は、数百万人のプレイヤーが参加するオンラインゲームを運用しています。リアルタイムのランキング（リーダーボード）を表示するために、プレイヤーのスコアが更新されるたびに順位を再計算して、上位 100 人を数ミリ秒で返す必要があります。現在は Amazon RDS for MySQL に ORDER BY を使ったクエリを発行していますが、負荷が高く応答が遅くなっています。ソリューションアーキテクトは、これらの要件を最小限の遅延で満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon ElastiCache for Memcached のクラスターを作成し、スコアを文字列として保存する。ランキングはアプリケーションが取得してソートする。","Amazon DynamoDB のテーブルにスコアを保存し、スコアに対するグローバルセカンダリインデックスを作成して、Scan で上位 100 件を取得する。","Amazon ElastiCache（Valkey または Redis OSS）のソート済みセットにスコアを保存する。上位 100 人は順位範囲を指定して取得する。","RDS for MySQL にリードレプリカを追加し、ランキング用のクエリをすべてリードレプリカに向けてインデックスを作成する。"],"answer":[2],"why":["Memcached はキーと値の単純なキャッシュで、ソート済みセットのようなデータ構造を持たない。ソートをアプリケーション側で行うと、遅延と実装の負担が増える。","DynamoDB でスコア順の全体ランキングを Scan で取得すると、読み取りの負荷が大きくなる。ミリ秒単位の順位取得という要件にも合わない。","ソート済みセットは、スコアでの並べ替えを保ったままメンバーを管理できる。更新と順位の取得がメモリ上で高速に行えるため、リーダーボードに向く。","リードレプリカで読み取りは分散できるが、並べ替えのクエリそのものが重い。インメモリのデータストアのような低遅延は期待できない。"],"explain":"「リアルタイムのランキング」「更新のたびに順位を再計算」「数ミリ秒」がヒント。ElastiCache の Valkey / Redis OSS エンジンはソート済みセットをサポートしており、スコアの更新と順位範囲の取得が高速にできるため、リーダーボードの定番になっている。Memcached にはこのデータ構造がない。","point":"リーダーボードは ElastiCache（Valkey / Redis OSS）のソート済みセット。Memcached は単純なキャッシュ向けで対応しない。","diagram":{"caption":"正解の構成: ソート済みセットでリアルタイムにランキングを返す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"player","label":"プレイヤー","sub":"スコア送信・順位表示","kind":"client","c":0,"r":0},{"id":"app","label":"ゲーム API","sub":"ECS / EC2","kind":"compute","c":1,"r":0},{"id":"cache","label":"ElastiCache","sub":"ソート済みセット","kind":"database","c":2,"r":0}],"edges":[{"from":"player","to":"app"},{"from":"app","to":"cache","label":"更新・順位取得","both":true}]}},{"id":"d3-26","domain":3,"topic":"Kinesis","type":"single","stem":"ある企業は、Web サイトのクリックストリームを分析するために、数千台のサーバーから出力されるログを Amazon S3 のデータレイクに集めています。ログは数分以内に S3 に到着し、Amazon Athena で効率よくクエリできるよう Apache Parquet 形式に変換されている必要があります。ソリューションアーキテクトは、独自のコンシューマーアプリケーションの開発や、サーバーの管理を行わずに、これらの要件を満たす必要があります。最も運用上のオーバーヘッドが少ない方法で、これらの要件を満たすソリューションはどれですか。","choices":["Amazon Kinesis Data Streams にログを送信し、EC2 インスタンス上のコンシューマーアプリケーションで Parquet 形式に変換して S3 に書き込む。","Amazon MSK クラスターにログを送信し、EC2 インスタンス上で Kafka Connect を実行して、変換した Parquet 形式のファイルを S3 のバケットに書き込む。","ログを S3 に直接アップロードし、S3 イベント通知を使って AWS Lambda 関数を起動して、オブジェクトを 1 つずつ Parquet 形式に変換して別のバケットに保存する。","Amazon Data Firehose の配信ストリームにログを送信し、S3 を配信先に指定する。レコード形式の変換で Parquet を有効にし、バッファー設定で配信間隔を指定する。"],"answer":[3],"why":["Data Streams 自体は問題ないが、コンシューマーアプリケーションの開発と EC2 の管理が必要になる。運用上のオーバーヘッドが大きい。","MSK のクラスターと Kafka Connect の EC2 を運用する必要があり、サーバー管理を避ける要件に反する。","小さなファイルが大量に作られ、関数の同時実行やエラー処理の管理も必要になる。S3 に到着するまでのバッファリングや集約にも向かない。","Data Firehose はフルマネージドで、S3 などへの配信を行える。レコード形式の変換で Parquet に変換でき、バッファーの間隔やサイズで配信のタイミングも調整できる。"],"explain":"「独自のコンシューマーを開発しない」「サーバーを管理しない」「S3 に Parquet で配信」がそろったら Amazon Data Firehose を選ぶ。Firehose は、ストリーミングデータを S3、Amazon Redshift、Amazon OpenSearch Service などに自動で配信するマネージドサービスで、バッファリングと形式変換にも対応する。複数のコンシューマーが同じデータを読み、再処理する用途ではなく、データを配信する用途で選ぶ。","point":"ストリーミングデータを S3 などへ配信するだけなら Amazon Data Firehose。バッファリング、Parquet 変換、Lambda による変換に対応する。","diagram":{"caption":"正解の構成: Data Firehose で S3 に Parquet 形式で配信する","cols":4,"rows":1,"groups":[],"nodes":[{"id":"srv","label":"Web サーバー","sub":"クリックログ","kind":"compute","c":0,"r":0},{"id":"fh","label":"Data Firehose","sub":"Parquet に変換","kind":"analytics","c":1,"r":0},{"id":"s3","label":"S3 データレイク","sub":"バッファー後に配信","kind":"storage","c":2,"r":0},{"id":"ath","label":"Athena","sub":"SQL で分析","kind":"analytics","c":3,"r":0}],"edges":[{"from":"srv","to":"fh"},{"from":"fh","to":"s3"},{"from":"ath","to":"s3","label":"クエリ"}]}},{"id":"d3-27","domain":3,"topic":"API Gateway","type":"single","stem":"ある企業は、商品カタログを返す REST API を Amazon API Gateway と AWS Lambda、Amazon DynamoDB で構築しています。商品情報の更新は 1 時間に数回程度ですが、同じ商品ページに対する GET リクエストが大量に届いており、Lambda と DynamoDB への負荷が増えています。ソリューションアーキテクトは、アプリケーションコードを変更せずに、応答時間を短縮し、バックエンドへのリクエスト数を減らす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["API Gateway の REST API でステージのキャッシュを有効にし、適切な TTL を設定する。商品 ID を含むパスやパラメーターをキャッシュキーにする。","Lambda 関数のコードを変更し、グローバル変数に商品情報を保持して、同じ実行環境に届いたリクエストには DynamoDB を呼ばず保持した値を返す。","API Gateway の使用量プランでスロットリングの上限を引き下げ、バックエンドに届く 1 秒あたりのリクエスト数を一定の値に制限して、負荷を抑える。","DynamoDB テーブルのプロビジョニングされた読み取りキャパシティを大幅に増やし、Lambda 関数の予約された同時実行数も引き上げる。"],"answer":[0],"why":["ステージのキャッシュは、TTL の間、同じリクエストに API Gateway が直接応答する。Lambda と DynamoDB を呼び出す回数が減り、応答も速くなる。コードの変更は不要。","実行環境ごとにキャッシュが分かれ、コードの変更も必要になる。要件の「コードを変更しない」に反し、キャッシュの一貫性も管理しにくい。","スロットリングを強めても、リクエストが拒否されるだけで応答時間は短縮されない。利用者に 429 エラーが返る。","キャパシティを増やしても負荷に耐えられるだけで、バックエンドへのリクエスト数は減らない。応答時間の短縮にもならず、コストも増える。"],"explain":"「更新は頻繁ではない」「同じリクエストが大量」「コードの変更なし」「バックエンドのリクエスト数を減らす」が決め手。API Gateway（REST API）はステージ単位でキャッシュを有効にでき、TTL の間は同じレスポンスを返せる。キャッシュキーには、パスやクエリ文字列などを指定できる。スロットリングはバックエンドの保護や公平な利用のための機能で、速度の向上には使わない。","point":"同じ GET が多く更新が少ない API は、API Gateway（REST API）のステージキャッシュ。スロットリングは保護用で、高速化には使わない。","diagram":{"caption":"正解の構成: API Gateway のキャッシュで負荷を減らす","cols":4,"rows":1,"groups":[],"nodes":[{"id":"client","label":"クライアント","sub":"GET /products/{id}","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"ステージキャッシュ","kind":"network","c":1,"r":0},{"id":"fn","label":"Lambda","sub":"キャッシュミス時のみ","kind":"serverless","c":2,"r":0},{"id":"ddb","label":"DynamoDB","sub":"商品カタログ","kind":"database","c":3,"r":0}],"edges":[{"from":"client","to":"apigw"},{"from":"apigw","to":"fn","label":"ミスのみ","style":"dashed"},{"from":"fn","to":"ddb"}]}},{"id":"d3-28","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、東京リージョンで Amazon RDS for MySQL の DB インスタンスを Multi-AZ 構成で運用しています。ヨーロッパの拠点の社員が、このデータベースに対する参照中心のレポートを実行しており、リージョン間の距離が原因で応答が遅くなっています。書き込みは東京のアプリケーションだけが行います。ソリューションアーキテクトは、書き込みの処理は変更せずに、ヨーロッパからの読み取りのレイテンシーを短縮する必要があります。最も運用上のオーバーヘッドが少ない方法で、これらの要件を満たすソリューションはどれですか。","choices":["東京リージョンの DB インスタンスを、2 つの読み取り可能なスタンバイを持つ Multi-AZ DB クラスターに変更し、ヨーロッパからはリーダーエンドポイントに接続する。","ヨーロッパのリージョンにクロスリージョンリードレプリカを作成し、ヨーロッパの拠点のレポートをリードレプリカのエンドポイントに向ける。","東京リージョンで同じインスタンスクラスのリードレプリカを追加し、ヨーロッパからの接続を Amazon Route 53 のレイテンシールーティングで振り分ける。","ヨーロッパのリージョンに EC2 インスタンスを起動して MySQL を自己管理でインストールし、mysqldump による定期的なバックアップとリストアでデータを同期する。"],"answer":[1],"why":["Multi-AZ DB クラスターのリーダーは東京リージョン内にあり、読み取りの負荷は分散できても、リージョン間の距離によるレイテンシーは変わらない。","ヨーロッパに置いたリードレプリカは、東京のプライマリから非同期でレプリケーションされる。拠点の近くで読み取れるため、レイテンシーが短くなり、書き込みの処理も変更せずに済む。","東京のリードレプリカを増やしても、リージョン間の距離は変わらない。レイテンシールーティングは、東京リージョンのエンドポイントを返すだけになる。","自己管理のデータベースと同期の仕組みの構築が必要になり、運用上のオーバーヘッドが大きい。バックアップの間隔の分だけ、データも古くなる。"],"explain":"「遠隔地からの参照が遅い」「書き込みは東京だけ」がヒント。クロスリージョンリードレプリカを使えば、利用者に近いリージョンに読み取り専用のコピーを持たせられる。レプリケーションは非同期なので、わずかな遅れ（レプリカラグ）は許容する必要がある。Aurora なら、Aurora グローバルデータベースが同じ用途に使える。","point":"遠隔地の読み取りを速くするには、そのリージョンにクロスリージョンリードレプリカ（Aurora ならグローバルデータベース）を置く。","diagram":{"caption":"正解の構成: ヨーロッパのリードレプリカから読み取る","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":1,"h":1},{"label":"ヨーロッパのリージョン","kind":"region","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"primary","label":"RDS プライマリ","sub":"書き込みはここ","kind":"database","c":0,"r":0},{"id":"replica","label":"リードレプリカ","sub":"クロスリージョン","kind":"database","c":1,"r":0},{"id":"report","label":"レポート","sub":"ヨーロッパの拠点","kind":"client","c":2,"r":0}],"edges":[{"from":"primary","to":"replica","label":"非同期","style":"dashed"},{"from":"report","to":"replica","label":"読み取り"}]}},{"id":"d4-01","domain":4,"topic":"S3","type":"single","stem":"ある保険会社は、保険金請求の書類をスキャンした PDF ファイル（1 ファイルあたり数 MB）を Amazon S3 バケットに保存しています。書類は登録から 30 日間は審査のために頻繁に参照されますが、その後は顧客からの問い合わせ時に年に数回参照される程度です。問い合わせ対応では、書類をすぐに表示できる必要があります。登録から 1 年を経過した書類は監査のときにだけ参照され、取り出しには 48 時間まで待つことができます。書類は再作成できない原本であり、規制により 10 年間保管したあとに削除する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["S3 ライフサイクルルールを作成し、30 日後に S3 Standard-IA へ、365 日後に S3 Glacier Flexible Retrieval へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 One Zone-IA へ、365 日後に S3 Glacier Deep Archive へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 Glacier Instant Retrieval へ、365 日後に S3 Glacier Deep Archive へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 Glacier Flexible Retrieval へ、365 日後に S3 Glacier Deep Archive へ移行する。問い合わせ時は迅速取り出しで一時的に復元する。"],"answer":[2],"why":["要件は満たせるが、年に数回しか参照しないデータは Glacier Instant Retrieval の方が保管料金が安い。48 時間待てるデータも Glacier Flexible Retrieval より Deep Archive の方が安い。","One Zone-IA は単一の AZ にしかデータを保存しないため、AZ の障害や損壊でデータを失うおそれがある。再作成できない原本の保管には向かない。","年に数回の参照でもミリ秒で取り出せる Glacier Instant Retrieval と、保管料金が最も安く 48 時間以内の取り出しに対応する Deep Archive の組み合わせが最も安い。どちらも最低保存期間の条件を満たす。","Glacier Flexible Retrieval は迅速取り出しでも数分かかり、復元の操作も必要になる。問い合わせ時にすぐ表示するという要件を満たさない。"],"explain":"決め手は、期間ごとの参照頻度と取り出し時間の要件である。30 日以降は「年に数回」「すぐに表示」なので、ミリ秒で取り出せて保管料金が Standard-IA より安い Glacier Instant Retrieval が合う。1 年以降は「48 時間まで待てる」ので、保管料金が最も安い Deep Archive（標準取り出しは 12 時間以内、大容量取り出しは 48 時間以内）を選ぶ。再作成できない原本なので、単一 AZ の One Zone-IA は除外する。","point":"ミリ秒で取り出したいが四半期に 1 回程度の参照なら Glacier Instant Retrieval、12〜48 時間待てる長期保管なら Deep Archive。再作成できないデータに One Zone-IA は使わない。","diagram":{"caption":"正解の構成: 参照頻度に合わせてライフサイクルルールで移行する","cols":4,"rows":1,"groups":[{"label":"S3 ライフサイクルルール","kind":"generic","c":1,"r":0,"w":3,"h":1}],"nodes":[{"id":"app","label":"審査システム","sub":"PDF を登録","kind":"compute","c":0,"r":0},{"id":"std","label":"S3 Standard","sub":"0〜30 日","kind":"storage","c":1,"r":0},{"id":"gir","label":"Glacier IR","sub":"30 日〜1 年","kind":"storage","c":2,"r":0},{"id":"gda","label":"Deep Archive","sub":"1〜10 年 → 失効","kind":"storage","c":3,"r":0}],"edges":[{"from":"app","to":"std","label":"アップロード"},{"from":"std","to":"gir","label":"30 日後に移行"},{"from":"gir","to":"gda","label":"365 日後に移行"}]}},{"id":"d4-02","domain":4,"topic":"S3","type":"single","stem":"あるメディア分析企業は、Amazon S3 に数百 TB のデータセットを保存しています。各オブジェクトのサイズは数十 MB 以上です。データセットの多くは数か月間まったく参照されませんが、新しい分析案件が始まると古いデータセットが突然集中的に読み込まれることがあり、どのデータセットがいつ参照されるかを事前に予測することはできません。分析ジョブはデータをすぐに読み込める必要があります。この企業は、取り出し料金の発生を避けながらストレージコストを削減し、運用上のオーバーヘッドを最小限に抑えることを求めています。これらの要件を満たすソリューションはどれですか。","choices":["新規と既存のオブジェクトを S3 Intelligent-Tiering に移行する。アクセスのないオブジェクトは、低頻度アクセス層やアーカイブインスタントアクセス層へ自動的に移動させる。","S3 ライフサイクルルールを作成し、作成から 30 日後にすべてのオブジェクトを S3 Standard-IA に移行する。参照が増えたデータセットは手動で S3 Standard に戻す。","S3 ストレージクラス分析をプレフィックスごとに有効にする。分析結果を毎月確認し、アクセスの少ないプレフィックスに対するライフサイクルルールを追加する。","S3 ライフサイクルルールを作成し、作成から 90 日後に S3 Glacier Flexible Retrieval に移行する。分析ジョブの開始前に必要なオブジェクトを大容量取り出しで復元する。"],"answer":[0],"why":["Intelligent-Tiering はオブジェクトごとのアクセス状況を監視して層を自動で移し、アクセスされると高頻度アクセス層に戻す。取り出し料金はかからず、どの層でもミリ秒で読み込める。","Standard-IA は取り出し料金がかかるため、突然の集中的な読み込みでコストが増える。参照が増えたデータを手動で戻す作業も運用負荷になる。","適切なルールを作れる可能性はあるが、毎月の分析とルールの追加が必要で運用負荷が大きい。参照パターンが予測できないため、作ったルールもすぐに合わなくなる。","復元に数時間かかるため、すぐに読み込めるという要件を満たさない。取り出し料金もかかる。"],"explain":"決め手は「アクセスパターンを予測できない」「取り出し料金を避ける」「運用上のオーバーヘッドを最小限に」である。この 3 つがそろうと S3 Intelligent-Tiering が第一候補になる。30 日間アクセスがなければ低頻度アクセス層、90 日間なければアーカイブインスタントアクセス層へ自動で移り、いずれの層でもミリ秒で読み込める。オブジェクトごとに少額のモニタリング料金がかかるが、128 KB 未満のオブジェクトは自動階層化の対象外でモニタリング料金もかからない。","point":"アクセスパターンが不明・変化する大きなオブジェクトは S3 Intelligent-Tiering。取り出し料金がなく、層の移動も自動で行われる。","diagram":{"caption":"正解の構成: Intelligent-Tiering が層を自動で移す","cols":3,"rows":2,"groups":[{"label":"S3 Intelligent-Tiering","kind":"generic","c":0,"r":0,"w":3,"h":1}],"nodes":[{"id":"freq","label":"高頻度アクセス層","sub":"アクセスされると戻る","kind":"storage","c":0,"r":0},{"id":"ia","label":"低頻度アクセス層","sub":"30 日アクセスなし","kind":"storage","c":1,"r":0},{"id":"aia","label":"Archive Instant","sub":"90 日アクセスなし","kind":"storage","c":2,"r":0},{"id":"job","label":"分析ジョブ","sub":"参照時期は予測不可","kind":"analytics","c":1,"r":1}],"edges":[{"from":"freq","to":"ia","label":"自動で移動"},{"from":"ia","to":"aia","label":"自動で移動"},{"from":"job","to":"ia","label":"取り出し無料"}]}},{"id":"d4-03","domain":4,"topic":"EBS","type":"single","stem":"ある企業は、数百台の Amazon EC2 インスタンスで業務システムを運用しています。各インスタンスは、ルートボリュームとデータボリュームのどちらにも汎用 SSD（gp2）の Amazon EBS ボリュームを使用しています。コストを分析したところ、EBS ボリュームの料金が大きな割合を占めていることがわかりました。ソリューションアーキテクトは、各ボリュームの現在の IOPS とスループットを維持したまま、EBS のコストを削減する必要があります。作業のためにインスタンスを停止したり、ボリュームをデタッチしたりすることは許可されていません。これらの要件を満たすソリューションはどれですか。","choices":["Elastic Volumes を使用して、すべてのボリュームのタイプをプロビジョンド IOPS SSD（io2）に変更する。各ボリュームの IOPS を現在の値に合わせて設定する。","Elastic Volumes を使用して、すべてのボリュームのタイプをスループット最適化 HDD（st1）に変更する。ボリュームのサイズは現在のまま維持する。","Elastic Volumes を使用して、データボリュームのサイズを実際のデータ使用量に合わせて縮小する。ボリュームタイプは gp2 のまま維持する。","Elastic Volumes を使用して、すべてのボリュームのタイプを汎用 SSD（gp3）に変更する。必要なボリュームには現在と同等の IOPS とスループットを個別に設定する。"],"answer":[3],"why":["io2 は高い耐久性と IOPS が必要なワークロード向けで、容量の料金に加えてプロビジョンドした IOPS にも料金がかかる。コストはかえって上がる。","st1 はシーケンシャルな大量の読み書き向けの HDD で、ランダム I/O の性能が低い。ルートボリュームにも使用できない。","EBS ボリュームのサイズは拡張しかできず、縮小はできない。gp2 は IOPS がサイズに比例するため、仮に縮小できても性能が下がる。","gp3 は GiB あたりの料金が gp2 より安く、サイズに関係なくベースラインの IOPS とスループットが確保される。追加の IOPS とスループットも個別に設定でき、Elastic Volumes で稼働中のまま変更できる。"],"explain":"決め手は「現在の性能を維持」「停止・デタッチ不可」「コスト削減」である。gp2 は IOPS がボリュームサイズに比例するため、性能のために大きなボリュームを確保していることが多い。gp3 はサイズと切り離して IOPS とスループットを設定でき、GiB あたりの料金も安い。Elastic Volumes を使えば、アタッチしたまま稼働中にボリュームタイプを変更できる。","point":"gp2 から gp3 への変更は Elastic Volumes で無停止で行え、GiB 単価が下がる。EBS ボリュームのサイズは縮小できない。","diagram":null},{"id":"d4-04","domain":4,"topic":"EFS・FSx","type":"single","stem":"ある出版社は、複数のアベイラビリティーゾーン（AZ）に配置した Amazon EC2 インスタンスで編集システムを運用しており、原稿や画像を Amazon EFS（リージョナル）のファイルシステムに保存しています。ファイルは作成から数週間は頻繁に編集されますが、その後はほとんど参照されません。ただし、過去の記事を再編集するときに古いファイルが参照されることがあり、そのファイルは再び頻繁に使われます。この企業は、アプリケーションを変更せず、複数の AZ にわたる耐久性を維持したまま、ストレージコストを削減することを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS DataSync を使用して、新しい EFS One Zone のファイルシステムにデータを移行する。EC2 インスタンスのマウント先を新しいファイルシステムに切り替える。","EFS のライフサイクル管理を設定し、30 日間アクセスのないファイルを低頻度アクセス（IA）ストレージクラスへ移行する。初回アクセス時に標準ストレージクラスへ戻す設定にする。","30 日間更新のないファイルを Amazon S3 Glacier Instant Retrieval にコピーして EFS から削除するスクリプトを毎晩実行する。再編集時はファイルを EFS に戻す。","EFS のスループットモードを Elastic スループットに変更し、読み取りと書き込みの量に応じて料金を支払うようにする。ストレージクラスは標準のまま維持する。"],"answer":[1],"why":["One Zone は単一の AZ にデータを保存するため、複数の AZ にわたる耐久性を維持するという要件を満たさない。データの移行作業も必要になる。","ライフサイクル管理は、アクセスのないファイルを自動で IA に移し、アクセスされたファイルを標準に戻せる。ファイルシステムのパスは変わらないため、アプリケーションの変更も不要である。","保存場所が S3 に変わるため、アプリケーションからファイルパスで参照できなくなる。スクリプトの開発と運用の負荷も大きい。","スループットモードの変更はスループットにかかる料金に影響するだけで、保存しているデータのストレージ料金は下がらない。"],"explain":"決め手は「アプリケーションを変更しない」「複数 AZ の耐久性を維持」「ストレージコストを削減」である。EFS のライフサイクル管理を使うと、一定期間アクセスのないファイルを保管料金の安い IA ストレージクラスへ自動で移せる。IA のファイルは読み取りのたびにアクセス料金がかかるため、「初回アクセス時に標準へ戻す」設定を組み合わせて、再び頻繁に使われるファイルを標準に戻す。One Zone はコストが下がるが単一 AZ になるため要件を満たさない。","point":"EFS のコスト削減はライフサイクル管理で IA（さらに Archive）へ自動移行する。再利用されるファイルは「初回アクセス時に標準へ戻す」を設定する。","diagram":{"caption":"正解の構成: ライフサイクル管理でアクセスのないファイルを IA へ移す","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":1,"h":2},{"label":"AZ-a","kind":"az","c":0,"r":0,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":0,"r":1,"w":1,"h":1},{"label":"Amazon EFS（リージョナル）","kind":"generic","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2a","label":"EC2","sub":"編集システム","kind":"compute","c":0,"r":0},{"id":"ec2c","label":"EC2","sub":"編集システム","kind":"compute","c":0,"r":1},{"id":"std","label":"EFS 標準","sub":"編集中のファイル","kind":"storage","c":1,"r":0},{"id":"ia","label":"EFS IA","sub":"アクセスで標準へ戻る","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2a","to":"std","label":"NFS マウント"},{"from":"ec2c","to":"std","label":"NFS マウント"},{"from":"std","to":"ia","label":"30日未アクセス","style":"dashed"}]}},{"id":"d4-05","domain":4,"topic":"バックアップ・DR","type":"single","stem":"ある製造業の会社は、オンプレミスのサーバーを市販のバックアップソフトウェアで物理テープにバックアップし、テープを外部の保管業者に預けています。テープ媒体の購入費、輸送費、保管費が増え続けているため、バックアップの保存先を AWS に移すことを計画しています。バックアップは 10 年間保管する必要がありますが、古いバックアップから復元することはまれで、復元には 1 日程度待つことができます。この企業は、既存のバックアップソフトウェアとテープベースのバックアップジョブを変更せずに使い続けることを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Storage Gateway の S3 ファイルゲートウェイをデプロイし、バックアップの出力先をファイル共有に変更する。S3 ライフサイクルルールでオブジェクトを S3 Glacier Deep Archive に移行する。","AWS Storage Gateway のボリュームゲートウェイ（キャッシュ型）をデプロイし、バックアップをボリュームに書き込む。ボリュームの EBS スナップショットを定期的に作成して保管する。","AWS Storage Gateway のテープゲートウェイをデプロイし、バックアップソフトウェアから仮想テープライブラリとして接続する。取り出した仮想テープを S3 Glacier Deep Archive にアーカイブする。","オンプレミスに AWS DataSync エージェントをデプロイし、バックアップソフトウェアがディスクに出力したファイルを毎晩 S3 Glacier Deep Archive に直接転送する。"],"answer":[2],"why":["ストレージコストは下げられるが、バックアップの出力先をテープからファイル共有に変える必要があり、テープベースのジョブを変更しないという要件を満たさない。","テープベースのジョブはそのまま使えない。EBS スナップショットで長期保管すると、Glacier Deep Archive よりコストも高い。","テープゲートウェイは iSCSI の仮想テープライブラリ（VTL）としてバックアップソフトウェアから見えるため、既存のジョブをそのまま使える。取り出した仮想テープは保管料金が最も安い Deep Archive にアーカイブできる。","バックアップの出力先をディスクに変える必要があり、テープベースのジョブを変更しないという要件を満たさない。"],"explain":"決め手は「既存のバックアップソフトウェアとテープベースのジョブを変更しない」と「復元は 1 日程度待てる長期保管」である。テープゲートウェイは物理テープライブラリの代わりに仮想テープライブラリを提供し、仮想テープは Amazon S3 に保存される。バックアップソフトウェアで取り出した（イジェクトした）テープは S3 Glacier Flexible Retrieval または S3 Glacier Deep Archive にアーカイブでき、まれにしか復元しない長期保管なら Deep Archive が最も安い。","point":"物理テープを置き換えつつ既存のバックアップソフトウェアを変えたくないならテープゲートウェイ。長期保管のテープは Deep Archive にアーカイブする。","diagram":{"caption":"正解の構成: テープゲートウェイで仮想テープを Deep Archive に保管する","cols":4,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1},{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"bk","label":"バックアップ","sub":"既存ソフトウェア","kind":"onprem","c":0,"r":0},{"id":"tgw","label":"Tape Gateway","sub":"仮想テープライブラリ","kind":"storage","c":1,"r":0},{"id":"s3","label":"Amazon S3","sub":"仮想テープを保存","kind":"storage","c":2,"r":0},{"id":"gda","label":"Deep Archive","sub":"取り出したテープ","kind":"storage","c":3,"r":0}],"edges":[{"from":"bk","to":"tgw","label":"iSCSI (VTL)"},{"from":"tgw","to":"s3","label":"HTTPS で転送"},{"from":"s3","to":"gda","label":"イジェクト時","style":"dashed"}]}},{"id":"d4-06","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、2 つの AWS リージョンで Amazon EC2 インスタンスを使い、複数の業務アプリケーションを運用しています。全体のコンピューティング使用量は、今後 3 年間ほぼ一定と見込まれています。一方で、この期間中にインスタンスファミリーを AWS Graviton ベースのものに変更し、一部のアプリケーションを Amazon ECS on AWS Fargate と AWS Lambda に移行する計画があります。この企業は、構成を変更しても自動的に割引が適用され、購入後の管理作業が少ない方法でコンピューティングのコストを削減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["現在のインスタンスファミリーとリージョンを指定して、3 年間の EC2 Instance Savings Plans を購入する。インスタンスファミリーを変更するときに追加で購入する。","現在のインスタンスタイプに合わせて、3 年間のスタンダードリザーブドインスタンスを購入する。移行で不要になった分はリザーブドインスタンスマーケットプレイスで売却する。","3 年間のコンバーティブルリザーブドインスタンスを購入する。インスタンスファミリーを変更するときに、新しいインスタンスタイプのリザーブドインスタンスと交換する。","一定で見込める使用量に対して、3 年間の Compute Savings Plans を購入する。1 時間あたりの利用額をコミットし、対象の使用量に割引が自動的に適用されるようにする。"],"answer":[3],"why":["EC2 Instance Savings Plans はリージョンとインスタンスファミリーが固定される。Graviton への変更や Fargate・Lambda への移行には自動で適用されない。","スタンダード RI はインスタンスファミリーの変更や Fargate・Lambda には適用されない。売却の手続きも必要になり、管理作業が多い。","交換すればインスタンスファミリーは変えられるが、そのたびに交換作業が必要になる。Fargate と Lambda の使用量には適用されない。","Compute Savings Plans は、インスタンスファミリー、サイズ、リージョン、OS にかかわらず EC2 に適用され、Fargate と Lambda にも自動的に適用される。構成を変えても管理作業が増えない。"],"explain":"決め手は「インスタンスファミリーの変更」「Fargate と Lambda への移行」「自動的に割引が適用」である。Compute Savings Plans は 1 時間あたりの利用額をコミットする購入オプションで、EC2 のインスタンスファミリーやリージョンを問わず、Fargate と Lambda にも適用される。EC2 Instance Savings Plans とスタンダード RI は割引率が高い代わりに対象が固定され、コンバーティブル RI は交換できても対象が EC2 に限られる。","point":"インスタンスファミリー・リージョンの変更や Fargate・Lambda への移行を見込むなら Compute Savings Plans。構成を固定できるなら EC2 Instance Savings Plans の方が割引率は高い。","diagram":null},{"id":"d4-07","domain":4,"topic":"購入オプション","type":"multi","stem":"ある EC 事業者は、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで Web アプリケーションを運用しています。グループは年間を通して最低 6 台のインスタンスで稼働しており、1 日に数回、予測できないタイミングで数時間だけ台数が増えます。また、毎晩、商品画像を変換するバッチ処理を EC2 インスタンスで実行しています。バッチ処理はチェックポイントから再開でき、翌朝までに終われば開始時刻は問いません。現在はすべてオンデマンドインスタンスを使用しています。この企業は、Web アプリケーションの可用性を損なわずに、コンピューティングのコストを最も効果的に削減することを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Web アプリケーションの最低 6 台をスポットインスタンスで実行する。中断された場合は、Auto Scaling グループが自動的に別のインスタンスを起動する。","Web アプリケーションの最低 6 台分の使用量に対して、1 年または 3 年の Savings Plans を購入する。増加分はオンデマンドインスタンスのまま実行する。","Web アプリケーションのピーク時の最大台数に合わせてリザーブドインスタンスを購入し、増加分のインスタンスにも割引が適用されるようにする。","夜間バッチ用にオンデマンドキャパシティ予約を作成し、毎晩必要な台数のインスタンスを確実に起動できるようにしておく。","夜間バッチを、複数のインスタンスタイプを指定したスポットインスタンスで実行する。中断された場合はチェックポイントから処理を再開する。"],"answer":[1,4],"why":["常時必要な最低台数がまとめて中断されると、置き換えが間に合わずに可用性が下がる。常に必要な台数はスポットに向かない。","年間を通して必ず使う最低 6 台分は使用量が一定なので、Savings Plans のコミットで確実に割引を受けられる。予測できない増加分をオンデマンドにしておけば、使わないコミットも生じない。","増加分は 1 日に数時間しか動かないため、ピーク台数分の RI は大半の時間で使われず、かえってコストが増える。","キャパシティ予約は起動の確実性を高めるもので、予約自体に割引はない。使わない時間も料金がかかり、開始時刻を問わないバッチには不要である。","中断されても再開でき、開始時刻も問わない処理はスポットインスタンスに最適である。複数のインスタンスタイプを指定すると容量を確保しやすく、中断の影響も減らせる。"],"explain":"使用量の性質ごとに購入オプションを分けて考える。年間を通して一定の最低台数は Savings Plans（または RI）、予測できない短時間の増加分はオンデマンド、中断されても再開できる柔軟なバッチはスポットインスタンスが最も安い。「可用性を損なわずに」があるため、常時必要な Web の最低台数をスポットにする選択肢は除外する。","point":"一定の基礎負荷は Savings Plans・RI、予測できない短時間のピークはオンデマンド、中断に強いバッチはスポットインスタンス。","diagram":null},{"id":"d4-08","domain":4,"topic":"コンテナ","type":"single","stem":"ある動画配信企業は、アップロードされた動画からサムネイルとプレビューを生成する処理を、Amazon ECS on AWS Fargate のタスクで実行しています。タスクは Amazon SQS キューからジョブを受け取り、1 件の処理に 20〜40 分かかります。処理は冪等であり、途中で中断されても再実行すれば問題ありません。処理件数は月によって大きく変動します。この企業は、サーバーを管理することなく、また長期の利用をコミットすることなく、コンピューティングのコストを削減することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["ECS サービスのキャパシティープロバイダー戦略で FARGATE_SPOT を使用する。中断されたジョブは、SQS の可視性タイムアウト後に別のタスクで再処理されるようにする。","ECS クラスターに Amazon EC2 Auto Scaling グループのキャパシティープロバイダーを追加し、スポットインスタンスで構成した EC2 インスタンス上でタスクを実行する。","Fargate の使用量に対して 3 年間の Compute Savings Plans を購入する。タスクは引き続き FARGATE キャパシティープロバイダーで実行する。","処理を AWS Lambda 関数に移行し、SQS キューをイベントソースとして設定する。関数のメモリは処理時間が短くなるように大きめに割り当てる。"],"answer":[0],"why":["Fargate Spot は Fargate の予備の容量を割引価格で使う仕組みで、サーバー管理もコミットも不要である。中断の 2 分前に通知され、SQS からの再処理で中断に対応できる。","スポットインスタンスで安くはなるが、EC2 インスタンスの AMI の更新やスケーリングの管理が必要になり、サーバーを管理しないという要件を満たさない。","割引は受けられるが、3 年間の利用のコミットが必要になる。処理件数が大きく変動するため、コミットした額を使い切れないおそれもある。","Lambda 関数の最大実行時間は 15 分であり、20〜40 分かかる処理は完了できない。"],"explain":"決め手は「中断されても再実行できる」「サーバーを管理しない」「長期のコミットなし」である。中断に強い処理ならスポットの割引を使うのが最も安く、Fargate のまま使えるのが Fargate Spot である。キャパシティープロバイダー戦略で FARGATE_SPOT を指定するだけで、タスク定義やアプリケーションはそのまま使える。EC2 のスポットインスタンスはサーバーの管理が必要になり、Savings Plans はコミットが必要になる。","point":"中断に強い ECS タスクのコスト削減は Fargate Spot（キャパシティープロバイダー戦略）。サーバー管理なし・コミットなしで割引を受けられる。","diagram":{"caption":"正解の構成: FARGATE_SPOT で中断に強いジョブを安く処理する","cols":3,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":0,"r":0,"w":3,"h":1},{"label":"ECS クラスター","kind":"generic","c":1,"r":0,"w":1,"h":1}],"nodes":[{"id":"sqs","label":"SQS キュー","sub":"処理待ちのジョブ","kind":"integration","c":0,"r":0},{"id":"ecs","label":"ECS タスク","sub":"FARGATE_SPOT","kind":"container","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"サムネイルを保存","kind":"storage","c":2,"r":0}],"edges":[{"from":"sqs","to":"ecs","label":"ジョブを取得"},{"from":"ecs","to":"s3","label":"結果を保存"}]}},{"id":"d4-09","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、AWS Organizations で管理する 20 個の AWS アカウントで、数百台の Amazon EC2 インスタンス、Amazon EBS ボリューム、AWS Lambda 関数を運用しています。インスタンスタイプ、ボリュームのサイズ、関数のメモリは各チームが十分に見積もらずに決めており、多くのリソースが過剰にプロビジョニングされていると考えられています。ソリューションアーキテクトは、メモリ使用率を含む実際の使用状況にもとづき、AWS Graviton ベースのインスタンスタイプへの変更も含めた適正なサイズの推奨事項を得る必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["管理アカウントで AWS Cost Anomaly Detection を有効にし、アカウントごとにコストモニターを作成する。異常なコストの増加が検出されたリソースから順にサイズを見直す。","組織のすべてのアカウントで AWS Compute Optimizer をオプトインする。EC2 インスタンスに CloudWatch エージェントを導入し、メモリ使用率を収集する。","AWS Cost Explorer で Savings Plans の購入推奨事項を確認する。推奨されたコミット額をもとに、各アカウントのインスタンスタイプとボリュームを見直す。","各アカウントの Amazon CloudWatch メトリクスをクロスアカウントのダッシュボードに集約する。CPU とメモリの使用率をもとに、チームごとに適切なサイズを判断する。"],"answer":[1],"why":["Cost Anomaly Detection はコストの異常な増加を検出するサービスで、過剰なプロビジョニングが続いている状態や、リソースごとの推奨サイズは示さない。","Compute Optimizer は使用状況のメトリクスを機械学習で分析し、EC2、EBS、Lambda の推奨事項を組織全体で提示する。CloudWatch エージェントのメモリメトリクスも使え、Graviton を含めた推奨にも対応する。","Savings Plans の推奨事項は購入するコミット額の提案であり、リソースのサイズが適正かどうかは判断しない。","要件は満たせるが、数百のリソースを人が分析して判断する必要があり、運用負荷が大きい。"],"explain":"決め手は「実際の使用状況にもとづく推奨事項」「EC2・EBS・Lambda」「最も運用効率の高い方法」である。AWS Compute Optimizer は EC2 インスタンス、Auto Scaling グループ、EBS ボリューム、Lambda 関数などの適正なサイズを推奨し、Organizations の管理アカウントから組織全体をまとめて分析できる。EC2 のメモリ使用率は標準では取得されないため、CloudWatch エージェントで収集すると推奨の精度が上がる。","point":"EC2・EBS・Lambda などの適正サイズの推奨は AWS Compute Optimizer。メモリを考慮させるには CloudWatch エージェントでメトリクスを送る。","diagram":null},{"id":"d4-10","domain":4,"topic":"RDS・Aurora","type":"single","stem":"ある SaaS 企業は、Amazon Aurora MySQL 互換のプロビジョニングされたクラスターでアプリケーションのデータベースを運用しています。データベースの負荷は 1 日の大半は低いものの、顧客の一斉処理によって、1 日に数回、予測できないタイミングで書き込みと読み取りの負荷が急増します。現在はピーク時の負荷に合わせて大きな DB インスタンスクラスを選んでいるため、大半の時間はリソースが余っています。この企業は、アプリケーションを変更せずに、負荷に応じて数秒でキャパシティを調整し、実際に使用したキャパシティに応じた料金だけを支払うことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Aurora レプリカを追加し、Aurora Auto Scaling で CPU 使用率にもとづいてレプリカの数を増減させる。ライターインスタンスは現在のインスタンスクラスのまま運用する。","現在の DB インスタンスクラスに対して、3 年間のリザーブドインスタンスを購入する。ピーク時の負荷に備えて、インスタンスクラスは変更しない。","データを Amazon DynamoDB のオンデマンドキャパシティモードのテーブルに移行し、読み取りと書き込みのリクエスト数に応じた料金だけを支払うようにする。","クラスターの DB インスタンスを Aurora Serverless v2 に変更する。最小と最大の Aurora キャパシティユニット（ACU）を負荷の範囲に合わせて設定する。"],"answer":[3],"why":["レプリカの増減で読み取りは分散できるが、書き込みはライターだけが処理するため、ライターはピークに合わせたサイズのままになる。","時間あたりの料金は下がるが、ピークに合わせた大きなインスタンスの料金を常に支払い続けることになる。負荷に応じた調整もできない。","MySQL 互換のリレーショナルデータベースから DynamoDB への移行は、アプリケーションの大幅な変更が必要になる。","Aurora Serverless v2 は負荷に応じて ACU 単位で細かく、すばやく拡張・縮小し、書き込みを処理するライターにも使える。MySQL 互換のままなので、アプリケーションの変更も不要である。"],"explain":"決め手は「予測できない急増」「書き込みも急増」「数秒でキャパシティを調整」「アプリケーションを変更しない」である。Aurora Serverless v2 はライターとリーダーのどちらにも使え、負荷に合わせて ACU を細かく増減させるため、ピークに合わせたプロビジョニングによる無駄がなくなる。Aurora レプリカの Auto Scaling は読み取りしか分散できない点に注意する。","point":"負荷の変動が大きく予測できない Aurora は Serverless v2。ライターも含めて ACU 単位ですばやくスケールする。","diagram":null},{"id":"d4-11","domain":4,"topic":"DynamoDB","type":"single","stem":"あるオンラインゲーム企業は、プレイヤーのセッション記録を Amazon DynamoDB のテーブルに保存しており、テーブルはオンデマンドキャパシティモードで運用しています。数か月分のメトリクスを分析したところ、料金の大部分を書き込み要求が占めていました。トラフィックは時間帯に応じてなだらかに増減するだけで、急激なスパイクはありません。また、同じ記録が繰り返し読み取られることはほとんどありません。この企業は、性能を落とさずに DynamoDB のコストを削減することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["テーブルクラスを DynamoDB Standard-IA に変更して、テーブルのストレージ料金を下げる。キャパシティモードはオンデマンドのまま維持する。","DynamoDB Accelerator（DAX）クラスターをテーブルの前に作成する。アプリケーションからの読み取りと書き込みを、すべて DAX 経由で行うように変更する。","テーブルをプロビジョンドキャパシティモードに変更する。DynamoDB Auto Scaling でターゲット使用率を設定し、時間帯に合わせてキャパシティを増減させる。","テーブルをグローバルテーブルに変換し、別のリージョンのレプリカにも書き込みを分散させる。キャパシティモードはオンデマンドのまま維持する。"],"answer":[2],"why":["Standard-IA はストレージ料金が下がる代わりに、読み書きの料金が上がる。料金の大部分が書き込みであるため、かえってコストが増える。","DAX は読み取りをキャッシュするもので、書き込みはテーブルにそのまま書き込まれる。同じ記録の再読み取りも少ないため効果がなく、クラスターの料金が増える。","予測可能でなだらかなトラフィックは、プロビジョンドキャパシティと Auto Scaling で使用量に合わせた容量を用意する方がオンデマンドより安い。一定の基礎量にはリザーブドキャパシティも使える。","グローバルテーブルは複数リージョンでの可用性や低レイテンシーのための機能で、レプリカへの書き込みの料金が増える。コスト削減にはならない。"],"explain":"決め手は「トラフィックがなだらかで予測可能」「急激なスパイクはない」である。オンデマンドモードは予測できない負荷や新しいワークロードに向くが、予測可能な負荷ではプロビジョンドモードと Auto Scaling の方が費用対効果が高い。Standard-IA テーブルクラスは、保存データが多く読み書きが少ないテーブル向けである。DAX は読み取りが中心で、同じ項目が繰り返し読まれるワークロードで効果を発揮する。","point":"予測可能な負荷の DynamoDB はプロビジョンドモード＋Auto Scaling（基礎量はリザーブドキャパシティ）。予測できない負荷はオンデマンドモード。","diagram":null},{"id":"d4-12","domain":4,"topic":"ElastiCache","type":"single","stem":"ある EC 事業者は、Amazon EC2 上の Web アプリケーションと Amazon RDS for PostgreSQL のデータベースで商品カタログサイトを運用しています。アクセスの大半は、同じ商品詳細ページを表示するための同一のクエリです。商品情報の更新は 1 日に数回で、最大 5 分古い情報が表示されても問題ありません。DB インスタンスの CPU 使用率が高いため、より大きなインスタンスクラスへの変更が検討されています。この企業は、データベースの負荷を下げてより小さなインスタンスクラスを使えるようにし、読み取りのレイテンシーも改善することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon ElastiCache のキャッシュを作成する。アプリケーションに遅延読み込みを実装し、商品情報を 5 分の TTL でキャッシュする。","リードレプリカを 3 つ作成し、アプリケーションの読み取りクエリをレプリカに分散させる。プライマリインスタンスは現在のサイズのまま運用する。","DB インスタンスをマルチ AZ DB インスタンス配置に変更し、スタンバイインスタンスに読み取りクエリを振り分けてプライマリの負荷を下げる。","DB インスタンスをより大きなインスタンスクラスに変更し、3 年間のリザーブドインスタンスを購入して時間あたりの料金を下げる。"],"answer":[0],"why":["同じクエリの結果をキャッシュから返すことで DB への読み取りが大きく減り、インスタンスクラスを小さくできる。インメモリのキャッシュなので、読み取りのレイテンシーも下がる。","負荷は分散できるが、レプリカごとに DB インスタンスの料金がかかる。同じ結果を何度も DB で処理する無駄も残る。","マルチ AZ DB インスタンス配置のスタンバイは読み取りに使えない。可用性は上がるが、負荷は下がらない。","負荷には耐えられるが、より大きなインスタンスの料金を払い続けることになる。より小さなインスタンスクラスにするという要件とも逆である。"],"explain":"決め手は「同一のクエリが大半」「最大 5 分古くてもよい」「より小さなインスタンスクラスにしたい」である。繰り返し読まれるデータはキャッシュに向いており、TTL を許容できる鮮度に合わせれば整合性の要件も満たせる。リードレプリカでも負荷は分散できるが、レプリカごとに DB インスタンスの料金がかかり、キャッシュより費用対効果が低い。","point":"同じデータが繰り返し読まれ、多少古くてもよいなら ElastiCache でキャッシュして DB を小さくする。マルチ AZ DB インスタンス配置のスタンバイは読み取りに使えない。","diagram":{"caption":"正解の構成: ElastiCache で読み取りをキャッシュして DB の負荷を下げる","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":2,"h":2}],"nodes":[{"id":"users","label":"利用者","sub":"商品詳細を閲覧","kind":"client","c":0,"r":0},{"id":"app","label":"EC2","sub":"Web アプリケーション","kind":"compute","c":1,"r":0},{"id":"cache","label":"ElastiCache","sub":"TTL 5 分","kind":"database","c":2,"r":0},{"id":"rds","label":"RDS PostgreSQL","sub":"小さなクラスに変更","kind":"database","c":1,"r":1}],"edges":[{"from":"users","to":"app"},{"from":"app","to":"cache","label":"まず参照"},{"from":"app","to":"rds","label":"ミス時のみ","style":"dashed"}]}},{"id":"d4-13","domain":4,"topic":"VPC エンドポイント","type":"multi","stem":"ある企業は、2 つの AZ のプライベートサブネットで Amazon ECS on AWS Fargate のタスクを実行しています。コンテナイメージは Amazon ECR に保存されており、デプロイやスケールアウトのたびに大きなイメージがプルされます。プライベートサブネットからの通信は NAT ゲートウェイを経由しています。コストを分析したところ、NAT ゲートウェイのデータ処理料金が大きく、その大部分が ECR からのイメージのプルによるものでした。ソリューションアーキテクトは、イメージのプルがインターネットへの経路を通らないようにし、NAT ゲートウェイのデータ処理料金を削減する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["ECR 用のインターフェイス型 VPC エンドポイント（ecr.api と ecr.dkr）を各 AZ のプライベートサブネットに作成し、プライベート DNS を有効にする。","NAT ゲートウェイを、スポットインスタンスで起動した NAT インスタンスに置き換える。各 AZ のルートテーブルのデフォルトルートを NAT インスタンスに向ける。","ECR のプルスルーキャッシュルールを作成し、タスクがキャッシュからイメージを取得するようにタスク定義のイメージ URI を変更する。","Amazon S3 用のゲートウェイ型 VPC エンドポイントを作成し、各 AZ のプライベートサブネットのルートテーブルに関連付ける。","Egress-only インターネットゲートウェイを作成し、プライベートサブネットから ECR への通信をそのゲートウェイ経由に変更する。"],"answer":[0,3],"why":["ECR の API やイメージのマニフェストの取得は、インターフェイス型エンドポイント経由で VPC 内に閉じられる。エンドポイントのデータ処理の単価は NAT ゲートウェイより低い。","NAT ゲートウェイのデータ処理料金はなくなるが、通信はインターネットへの経路を通ったままである。スポットの中断で通信が止まるおそれがあり、NAT インスタンスの運用負荷も大きい。","プルスルーキャッシュは上流のレジストリのイメージをプライベートレジストリにキャッシュする機能で、VPC から ECR への通信経路は変わらない。","ECR のイメージレイヤーは Amazon S3 に保存されており、レイヤーのダウンロードは S3 への通信になる。S3 用のゲートウェイ型エンドポイントは追加料金なしで、この通信を NAT ゲートウェイから外せる。","Egress-only インターネットゲートウェイは IPv6 の送信専用の通信に使うもので、通信はインターネットへの経路を通る。"],"explain":"ECR からイメージをプルすると、ECR の API（ecr.api）とレジストリ（ecr.dkr）への通信に加えて、イメージレイヤーを取得する Amazon S3 への通信が発生する。そのため、ECR 用のインターフェイス型エンドポイントと S3 用のゲートウェイ型エンドポイントの両方が必要になる。どちらか一方だけでは、残りの通信が NAT ゲートウェイを経由し続ける。インターフェイス型エンドポイントには時間料金とデータ処理料金がかかるが、大量のプルがある環境では NAT ゲートウェイを経由するより安くなりやすい。","point":"プライベートサブネットからの ECR のプルは、ecr.api・ecr.dkr のインターフェイス型エンドポイントと、レイヤー取得用の S3 ゲートウェイ型エンドポイントをセットで作る。","diagram":{"caption":"正解の構成: ECR と S3 の両方のエンドポイントでプルする","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":2},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ecs","label":"ECS タスク","sub":"Fargate","kind":"container","c":0,"r":0},{"id":"ifep","label":"ECR 用 VPCE","sub":"インターフェイス型","kind":"network","c":1,"r":0},{"id":"ecr","label":"Amazon ECR","sub":"API・マニフェスト","kind":"container","c":2,"r":0},{"id":"gwep","label":"S3 用 VPCE","sub":"ゲートウェイ型","kind":"network","c":1,"r":1},{"id":"s3","label":"Amazon S3","sub":"イメージレイヤー","kind":"storage","c":2,"r":1}],"edges":[{"from":"ecs","to":"ifep"},{"from":"ifep","to":"ecr","label":"ecr.api / dkr"},{"from":"ecs","to":"gwep","label":"ルート経由"},{"from":"gwep","to":"s3","label":"レイヤー取得"}]}},{"id":"d4-14","domain":4,"topic":"データ転送料金","type":"single","stem":"ある企業は、3 つの AZ にまたがる VPC で Web アプリケーションを運用しています。プライベートサブネットの Amazon EC2 インスタンスは、外部の SaaS の API から大量のデータを定期的にダウンロードしています。インターネットへの通信には、AZ-a のパブリックサブネットに作成した 1 つの NAT ゲートウェイを使っており、すべてのプライベートサブネットのルートテーブルがこの NAT ゲートウェイを指しています。コストを分析したところ、NAT ゲートウェイの料金に加えて、AZ 間のデータ転送料金が大きいことがわかりました。ソリューションアーキテクトは、AZ 間のデータ転送料金を削減し、1 つの AZ の障害がほかの AZ の通信に影響しないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["AZ-a の NAT ゲートウェイを、より大きなインスタンスタイプの NAT インスタンスに置き換える。すべてのプライベートサブネットのルートテーブルを NAT インスタンスに向ける。","各 AZ のパブリックサブネットに NAT ゲートウェイを作成する。各 AZ のプライベートサブネットのルートテーブルを、同じ AZ の NAT ゲートウェイに向ける。","各 AZ のプライベートサブネットのルートテーブルで、デフォルトルートの宛先をインターネットゲートウェイに変更する。AZ-a の NAT ゲートウェイは削除する。","AZ-a のパブリックサブネットに 2 つ目の NAT ゲートウェイを作成する。プライベートサブネットのルートテーブルを 2 つの NAT ゲートウェイに分けて割り当てる。"],"answer":[1],"why":["AZ-b と AZ-c からの通信は AZ-a を経由したままなので、AZ 間のデータ転送料金は減らない。AZ-a の障害の影響も残り、NAT インスタンスの管理も必要になる。","各 AZ の通信が同じ AZ の NAT ゲートウェイを通るため、AZ 間のデータ転送が発生しない。1 つの AZ に障害が起きても、ほかの AZ の通信は影響を受けない。","パブリック IP アドレスを持たないインスタンスは、インターネットゲートウェイへのルートだけでは外部と通信できない。サブネットがパブリックになり、セキュリティ上も望ましくない。","NAT ゲートウェイがどちらも AZ-a にあるため、AZ 間のデータ転送料金は減らず、AZ-a の障害の影響も残る。"],"explain":"決め手は「AZ 間のデータ転送料金」と「1 つの AZ の障害がほかの AZ に影響しない」である。ゾーン単位の NAT ゲートウェイは作成した AZ の中で動作するため、別の AZ のインスタンスが使うと AZ 間のデータ転送料金がかかり、その AZ の障害の影響も受ける。AZ ごとに NAT ゲートウェイを置き、各 AZ のルートテーブルで同じ AZ の NAT ゲートウェイを指定するのが基本の構成である。なお、2025 年 11 月からは、1 つで複数の AZ に自動的に展開されるリージョナルモードの NAT ゲートウェイも選択できる。","point":"ゾーン単位の NAT ゲートウェイは AZ ごとに作り、各 AZ のルートテーブルは同じ AZ の NAT を指す。別の AZ の NAT を使うと AZ 間の転送料金がかかり、障害の影響も受ける。","diagram":{"caption":"正解の構成: AZ ごとに NAT ゲートウェイを置く","cols":3,"rows":3,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":3},{"label":"AZ-a","kind":"az","c":0,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":0,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":0,"r":2,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":1,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":1,"r":2,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":2,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":2,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":2,"r":2,"w":1,"h":1}],"nodes":[{"id":"igw","label":"Internet GW","sub":"SaaS の API へ","kind":"network","c":1,"r":0},{"id":"nata","label":"NAT GW","sub":"AZ-a 用","kind":"network","c":0,"r":1},{"id":"natb","label":"NAT GW","sub":"AZ-b 用","kind":"network","c":1,"r":1},{"id":"natc","label":"NAT GW","sub":"AZ-c 用","kind":"network","c":2,"r":1},{"id":"ec2a","label":"EC2","sub":"AZ-a","kind":"compute","c":0,"r":2},{"id":"ec2b","label":"EC2","sub":"AZ-b","kind":"compute","c":1,"r":2},{"id":"ec2c","label":"EC2","sub":"AZ-c","kind":"compute","c":2,"r":2}],"edges":[{"from":"ec2a","to":"nata","label":"同じ AZ"},{"from":"ec2b","to":"natb","label":"同じ AZ"},{"from":"ec2c","to":"natc","label":"同じ AZ"},{"from":"nata","to":"igw"},{"from":"natb","to":"igw"},{"from":"natc","to":"igw"}]}},{"id":"d4-15","domain":4,"topic":"CloudFront","type":"single","stem":"あるニュースサイトの運営企業は、記事に掲載する画像と動画を 1 つのリージョンの Amazon S3 バケットに保存し、パブリックな S3 の URL で世界中の読者に直接配信しています。同じファイルが短時間に多数の読者から繰り返しリクエストされるため、S3 からインターネットへのデータ転送料金とリクエスト料金が増え続けています。また、遠くの地域の読者からは表示が遅いという苦情が寄せられています。この企業は、配信コストを削減して表示を速くし、さらに S3 バケットへの直接のアクセスを禁止することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["バケットで S3 Transfer Acceleration を有効にし、記事内のファイルの URL を高速化エンドポイントに変更する。読者はエッジロケーションを経由してファイルを取得する。","S3 クロスリージョンレプリケーションで、別の 2 つのリージョンにバケットを複製する。読者の地域ごとに、記事内の URL を最も近いバケットに切り替える。","S3 バケットをオリジンとする Amazon CloudFront ディストリビューションを作成し、オリジンアクセスコントロール（OAC）を設定する。バケットのパブリックアクセスはブロックする。","S3 の静的ウェブサイトエンドポイントをカスタムオリジンとする Amazon CloudFront ディストリビューションを作成する。バケットのパブリックな読み取りアクセスは引き続き許可しておく。"],"answer":[2],"why":["Transfer Acceleration は長距離の転送を高速化する機能で、キャッシュはしない。通常のデータ転送料金に加えて高速化の料金がかかり、バケットへの直接アクセスも残る。","近いバケットから配信できるが、保存とレプリケーションのコストが増える。インターネットへのデータ転送料金とリクエスト料金も減らず、直接アクセスも残る。","CloudFront がエッジロケーションでキャッシュするため、S3 へのリクエストが減り、表示も速くなる。S3 から CloudFront へのデータ転送には料金がかからず、OAC で S3 への直接アクセスを禁止できる。","キャッシュの効果は得られるが、ウェブサイトエンドポイントには OAC を使えず、バケットをパブリックにしたままになる。S3 への直接アクセスを禁止するという要件を満たさない。"],"explain":"決め手は「同じファイルが繰り返しリクエストされる」「世界中の読者」「S3 への直接アクセスを禁止」である。CloudFront はエッジロケーションでコンテンツをキャッシュし、オリジンへのリクエストとデータ転送を減らす。AWS のオリジンから CloudFront へのデータ転送には料金がかからず、オリジンアクセスコントロール（OAC）を使えば S3 バケットを非公開にしたまま CloudFront 経由だけで配信できる。Transfer Acceleration や AWS Global Accelerator にはキャッシュの機能がない点で区別する。","point":"繰り返し読まれる静的コンテンツの配信コスト削減は CloudFront（S3 から CloudFront への転送は無料）。S3 を非公開にするなら REST エンドポイント＋OAC。","diagram":{"caption":"正解の構成: CloudFront でキャッシュし、OAC で S3 を非公開にする","cols":3,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"users","label":"世界中の読者","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"エッジでキャッシュ","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"非公開・OAC のみ許可","kind":"storage","c":2,"r":0}],"edges":[{"from":"users","to":"cf","label":"HTTPS"},{"from":"cf","to":"s3","label":"ミス時のみ取得"}]}},{"id":"d4-16","domain":4,"topic":"コスト管理","type":"multi","stem":"ある企業は、1 つの AWS アカウントを 3 つのプロジェクトチームで共有しています。各リソースには、プロジェクト名を値とする Project タグがすでに付けられています。財務部門は、プロジェクトごとの月間コストを AWS Cost Explorer で確認できるようにすることを求めています。また、その月のコストの予測額がプロジェクトごとに決めた予算を超えそうな場合に、各プロジェクトのリーダーへ E メールで通知することも求めています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たす必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Amazon CloudWatch の請求アラームを Project タグの値ごとに作成する。EstimatedCharges メトリクスがプロジェクトの予算を超えたら Amazon SNS で通知する。","AWS Trusted Advisor のコスト最適化チェックを有効にする。週次のレポートを各プロジェクトのリーダーに E メールで送信するように設定する。","AWS Billing and Cost Management コンソールで、Project タグをユーザー定義のコスト配分タグとして有効にする。","Cost and Usage Report を Amazon S3 に出力する。Amazon Athena でプロジェクトごとのコストを集計し、AWS Lambda 関数で予算の超過を判定して通知する。","AWS Budgets で、Project タグでフィルターしたコスト予算をプロジェクトごとに作成する。予測額のしきい値でアラートを設定し、各リーダーを通知先にする。"],"answer":[2,4],"why":["請求アラームの EstimatedCharges メトリクスはサービスやリンクアカウントの単位でしか分けられず、タグの値ごとのアラームは作成できない。予測額にもとづく通知もできない。","Trusted Advisor はコスト最適化の機会を示すが、プロジェクトごとの予算に対して予測額を監視し、通知する機能はない。","リソースに付けたタグは、コスト配分タグとして有効にすることで、Cost Explorer や AWS Budgets でのフィルターやグループ化に使えるようになる。","要件は満たせるが、集計のクエリと通知の仕組みを自分で作って運用する必要があり、運用上のオーバーヘッドが大きい。","AWS Budgets はタグでフィルターした予算を作成でき、実績額だけでなく予測額がしきい値を超えそうな時点で E メールや Amazon SNS で通知できる。"],"explain":"タグをコストの集計に使うには、まずコスト配分タグとして有効にする必要がある。有効にしたタグは Cost Explorer のグループ化やフィルターに使え、AWS Budgets でもタグごとの予算を作成できる。Budgets は予測額にもとづくアラートに対応しているため、予算を超えそうな時点で通知できる。CUR と Athena でも実現できるが、「運用上のオーバーヘッドを最小限に」に合わない。","point":"タグ別のコストの可視化はコスト配分タグの有効化が前提。予算に対する実績・予測の通知は AWS Budgets。","diagram":null},{"id":"d4-17","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、ステートレスな Web アプリケーションを Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。平常時は 4 台、繁忙期は最大 20 台で稼働します。一部のインスタンスが突然終了してもアプリケーションが動き続けることは問題ありませんが、サービスが停止することは避けなければなりません。ソリューションアーキテクトは、可用性を保ちながらコンピューティングコストを最小限に抑える必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの起動テンプレートでスポットインスタンスだけを使うように設定する。単一のインスタンスタイプを指定し、すべての台数をスポットで確保する。","混合インスタンスポリシーを使う Auto Scaling グループを作成する。オンデマンドの基準容量を平常時の台数に設定し、超過分をスポットインスタンスにする。複数のインスタンスタイプを指定する。","最大台数の 20 台分の EC2 Reserved Instances を 3 年契約で購入する。Auto Scaling グループは台数を固定して運用する。","Auto Scaling グループをオンデマンドインスタンスだけで構成する。ターゲット追跡スケーリングポリシーを設定し、負荷に応じて台数を調整する。"],"answer":[1],"why":["スポットだけで構成すると、スポット容量が不足したときや一斉に中断されたときに、最低限必要な台数を維持できずサービスが止まるおそれがある。単一のインスタンスタイプでは容量を確保しにくい。","平常時の台数をオンデマンド（Savings Plans などの割引を適用可能）で確保して可用性を守り、変動分を割引率の高いスポットにできる。複数のインスタンスタイプを指定すると、スポット容量を確保しやすくなる。","繁忙期にしか使わない台数まで長期契約すると、平常時に使わない分の料金も払い続けることになる。需要の変動に合わせてコストを下げられない。","可用性は保てるが、変動分にも割引のないオンデマンド料金がかかる。中断に耐えられる要件があるのに、その割引を活用できていない。"],"explain":"「平常時 4 台・繁忙期 20 台」「一部の終了は許容」「サービス停止は不可」「コスト最小」がそろったら、ベースライン分は安定した購入オプション、変動分はスポットという組み合わせを考える。Auto Scaling グループの混合インスタンスポリシーなら、オンデマンドの基準容量とスポットの割合を 1 つのグループで指定できる。スポットは複数のインスタンスタイプ・AZ に分散すると中断されにくくなる。","point":"混合インスタンスポリシーで、ベースラインはオンデマンド（Savings Plans）、変動分はスポットにする。スポットは複数のインスタンスタイプに分散する。","diagram":{"caption":"正解の構成: 基準容量はオンデマンド、超過分はスポットの混合 ASG","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"Web アクセス","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"負荷分散","kind":"network","c":1,"r":0},{"id":"od","label":"オンデマンド","sub":"基準容量 4 台","kind":"compute","c":2,"r":0},{"id":"spot","label":"スポット","sub":"超過分・複数タイプ","kind":"compute","c":2,"r":1}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"od"},{"from":"alb","to":"spot"}]}},{"id":"d4-18","domain":4,"topic":"購入オプション","type":"multi","stem":"ある企業は、Amazon SQS キューに登録された画像変換ジョブを、Amazon EC2 インスタンス上のワーカーで処理しています。ジョブは互いに独立しており、1 件あたり数分で完了します。同じジョブを再実行しても結果は変わりません。処理の完了期限には余裕があります。現在はオンデマンドインスタンスを使っており、ソリューションアーキテクトは、コストを大幅に削減することを求められています。最も費用対効果の高い方法でこれらの要件を満たす手順の組み合わせはどれですか。","choices":["ワーカーを Auto Scaling グループのスポットインスタンスで実行する。複数のインスタンスタイプと複数の AZ を指定し、スポット容量を確保しやすくする。","ワーカーを単一のインスタンスタイプ・単一の AZ のスポットインスタンスで実行する。容量が確保できなかった場合に備えて、台数を多めに設定する。","ワーカーをオンデマンドインスタンスのまま実行し、1 年契約の Compute Savings Plans を購入する。キューが空の時間帯も同じ契約量で利用する。","ワーカーでスポットインスタンスの中断通知を検知したら、新しいジョブの取得を止める。未完了のジョブは SQS の可視性タイムアウト後に別のワーカーが処理できるようにする。","ワーカーを Dedicated Hosts で実行し、他のお客様のワークロードによる中断が起きないようにする。"],"answer":[0,3],"why":["スポットは、複数のインスタンスタイプと AZ から確保できるようにすると、容量不足や中断の影響を受けにくくなる。中断に強いバッチ処理に向いている。","単一のタイプ・AZ に絞ると、そのスポットプールの容量不足や中断の影響を直接受ける。台数を増やしても確保できる保証にはならない。","割引は受けられるが、キューが空の時間帯や処理が少ない時間帯には使わない契約量が無駄になりやすい。中断に強い処理ならスポットの方が割引率は高い。","スポットインスタンスは終了の 2 分前に中断通知が出る。ジョブが SQS に残っていれば別のワーカーが再処理できるため、冪等なジョブなら中断の影響を吸収できる。","Dedicated Hosts は物理サーバーを専有する購入形態で、ライセンス要件などに使う。中断の回避が目的ではなく、費用も大きい。"],"explain":"「ジョブが独立・冪等」「数分で完了」「期限に余裕」「コスト大幅削減」は、スポットインスタンスを選ぶ条件そのもの。スポットは容量が必要になった AWS に回収されることがあるので、複数のインスタンスタイプ・AZ に分散して確保しやすくすることと、中断されても作業を失わない設計（キューに戻す、チェックポイントを残す）の 2 点を組み合わせる。","point":"中断に強いバッチは、スポットを複数タイプ・複数 AZ で使い、中断通知（2 分前）を受けて作業をキューに戻せるようにする。","diagram":null},{"id":"d4-19","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、開発チームが利用する検証用の Amazon EC2 インスタンスを 30 台、24 時間 365 日起動したままにしています。チームの作業時間は平日の 9 時から 19 時までで、夜間と週末にこれらのインスタンスが使われることはありません。インスタンスにはタグでチーム名が付けられています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えながら、コンピューティングコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["すべてのインスタンスをスポットインスタンスに置き換え、永続リクエストを設定する。中断されたインスタンスは自動的に再開されるようにする。","すべてのインスタンスについて、3 年契約・全前払いの EC2 Reserved Instances を購入する。常時起動のまま運用する。","Instance Scheduler on AWS をデプロイし、対象のインスタンスにスケジュールタグを付ける。平日の 9 時前に開始し、19 時以降と週末は停止する。","毎晩、管理者がインスタンスを終了する。翌朝、AMI から新しいインスタンスを手動で起動し、開発環境を再構築する。"],"answer":[2],"why":["スポットは割引になるが、使わない夜間や週末も起動し続けるため、使っていない時間の料金を減らせない。開発中に中断されると作業にも影響する。","長期契約で時間単価は下がるが、夜間と週末も含めて常に料金が発生する。使わない時間の料金そのものをなくすことはできない。","タグで対象を指定し、スケジュールに従って開始・停止を自動化できる。停止中はインスタンスのコンピューティング料金がかからず、運用の手間も小さい。","夜間の料金はなくなるが、毎日の手作業と環境の再構築が必要になり、運用上のオーバーヘッドが大きい。作業中のデータも失いやすい。"],"explain":"「使う時間帯が決まっている」「運用負荷を最小に」「コスト削減」がそろったら、使わない時間にインスタンスを止める。停止中のインスタンスは EC2 のコンピューティング料金がかからない（EBS ボリュームの料金は続く）。タグとスケジュールで開始・停止を自動化できる Instance Scheduler on AWS が適している。購入オプションは稼働時間が長いほど効果が大きいので、そもそも止められる環境では先に停止を考える。","point":"使う時間が決まっている開発・検証環境は、使わない時間に停止する。停止中は EC2 の料金がかからない（EBS は課金が続く）。","diagram":{"caption":"正解の構成: タグとスケジュールで EC2 を自動的に開始・停止","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sched","label":"スケジュール","sub":"平日 9 時〜19 時","kind":"integration","c":0,"r":0},{"id":"fn","label":"Instance Sched.","sub":"Lambda で実行","kind":"serverless","c":1,"r":0},{"id":"ec2","label":"開発用 EC2","sub":"タグで対象を指定","kind":"compute","c":2,"r":0}],"edges":[{"from":"sched","to":"fn"},{"from":"fn","to":"ec2","label":"開始・停止"}]}},{"id":"d4-20","domain":4,"topic":"Auto Scaling","type":"single","stem":"ある企業は、社内業務システムを Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。利用者は平日の 8 時から 20 時に集中し、その間の負荷はほぼ一定です。夜間と週末はほとんどアクセスがありません。このパターンは毎週ほとんど変わりません。現在は、日中のピークに合わせた台数に固定しており、夜間も同じ台数が稼働しています。ソリューションアーキテクトは、可用性を維持しながらコンピューティングコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの最小・最大・希望容量を、日中のピークに合わせた台数に固定したまま、より大きなインスタンスタイプに変更する。","スケジュールされたスケーリングを設定する。夜間と週末は最小容量を下げ、平日の始業前に最小容量を戻す。","ピーク時の台数分について、3 年契約・全前払いの EC2 Reserved Instances を購入する。夜間も同じ契約量を使い続ける。","CloudWatch のアラームを設定し、アラームの通知を受けた管理者が、手作業で Auto Scaling グループの台数を変更する。"],"answer":[1],"why":["インスタンスを大きくしても台数は固定のままで、夜間の余剰は減らない。むしろ 1 台あたりの料金が上がる。","利用パターンが予測できるので、時刻に合わせて最小容量を変えられる。夜間・週末の台数を減らし、始業前に戻しておけば、朝の立ち上がりにも間に合う。","ピーク台数分を長期契約すると、夜間や週末に使わない分の費用も払い続ける。台数を減らして使用量を下げる方がコストを抑えられる。","台数の調整は可能だが、アラームのたびに手作業が必要で運用上のオーバーヘッドが大きい。通知の見落としで可用性やコストに影響する。"],"explain":"「平日の日中に集中」「その間の負荷はほぼ一定」「夜間・週末はほとんど無負荷」「パターンは毎週同じ」から、固定台数をやめて時刻に合わせて台数を変える。増減の時間帯が予測できるので、スケジュールされたスケーリングで夜間・週末は最小容量を下げ、始業前に戻すのが最も簡単で確実。日中に予測できない増減もある場合は、ターゲット追跡スケーリングを組み合わせる。","point":"予測できる増減はスケジュールされたスケーリング、予測できない増減はターゲット追跡スケーリングで対応する。","diagram":null},{"id":"d4-21","domain":4,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、1 日に 1 回、深夜 2 時に実行される売上集計処理を、常時起動している Amazon EC2 インスタンス上の cron で動かしています。処理は Amazon S3 のファイルを読み込んで集計結果を S3 に書き出すもので、毎回約 5 分で完了します。残りの時間、インスタンスはほとんど何もしていません。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えながら、コストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["EC2 インスタンスを Compute Savings Plans の対象にする。1 年契約で購入し、既存の cron による実行を継続する。","処理をコンテナ化し、Amazon ECS の Fargate で常時 1 タスクを起動するサービスとして実行する。タスク内の cron で毎日実行する。","EC2 インスタンスをより小さなタイプに変更し、Auto Scaling グループの最小・最大・希望容量を 1 に設定する。","処理を AWS Lambda 関数に移行する。Amazon EventBridge Scheduler で毎日 2 時に関数を呼び出し、S3 へのアクセス権限は Lambda の実行ロールで付与する。"],"answer":[3],"why":["割引は受けられるが、
