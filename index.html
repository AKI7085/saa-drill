業はどれですか。","choices":["データベースに保存するデータの機密度を分類する。","データベースエンジンのセキュリティパッチを適用する。","データベースへ接続できるユーザーと権限を決める。","データベース接続時に TLS を使用するよう設定する。"],"answer":[1],"why":["データの分類はデータの内容を把握しているお客様の責任。","RDS はマネージドサービスで、DB エンジンと基盤 OS のパッチ適用は AWS が行う。","接続を許可するユーザーや権限の管理はお客様の責任。","通信の暗号化を使うかどうかの設定はお客様の責任。"],"explain":"RDS では OS と DB エンジンの管理が AWS に移るため、お客様の運用負担は EC2 上の自己管理より小さくなる。一方、データ、アクセス制御、暗号化の設定はお客様の責任として残る。","point":"RDS では DB エンジンと OS のパッチ適用は AWS。データとアクセス制御はお客様。","diagram":null},{"id":"clf-d2-03","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある開発チームは、AWS Lambda 関数でイベント処理を実装しています。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["関数を実行するサーバーの OS にパッチを適用する。","関数のランタイム実行環境の基盤を保守する。","関数を実行する物理ホストの容量を管理する。","関数コードと実行ロールの権限を適切に管理する。"],"answer":[3],"why":["Lambda では関数を実行する基盤の OS を AWS が管理する。","管理対象のランタイムとその基盤の保守は AWS が行う。","物理ホストとキャパシティの管理は AWS の責任。","自分で書いたコードの安全性と、実行ロールに与える権限（最小権限）はお客様が管理する。"],"explain":"Lambda のようなサーバーレスサービスでは、OS やランタイムを含む基盤の管理は AWS が担う。お客様は関数コード、IAM の権限設定、扱うデータに責任を持つ。","point":"Lambda のお客様の責任は関数コード、実行ロールの権限、データ。基盤は AWS。","diagram":null},{"id":"clf-d2-04","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、クラウドに保存したデータが、使用済みになったストレージデバイスから漏えいしないか懸念しています。責任共有モデルにおいて、この懸念に対応する責任を負うのは誰ですか。","choices":["AWS がストレージデバイスを安全に廃棄する。","お客様が AWS のデータセンターで物理的に破棄する。","AWS とお客様がデバイスごとに交互に廃棄する。","お客様が契約した第三者機関が廃棄する。"],"answer":[0],"why":["データセンター内のストレージデバイスの廃棄は、AWS の物理的なセキュリティの責任に含まれる。","お客様は AWS のデータセンターに立ち入って機器を扱うことはない。","廃棄の責任をデバイスごとに分担する仕組みはない。","AWS の設備の廃棄にお客様が第三者を手配する必要はない。"],"explain":"ストレージデバイスの廃棄はデータセンターの物理的なセキュリティの一部で、クラウド「の」セキュリティとして AWS が責任を持つ。お客様は、データの分類や暗号化といった自社のデータ保護を担う。","point":"物理的なセキュリティとストレージデバイスの廃棄は AWS の責任。","diagram":null},{"id":"clf-d2-05","domain":2,"topic":"責任共有モデル","type":"multi","stem":"ある企業は、Amazon S3 に顧客向けの文書を保存します。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["S3 を支える物理ストレージを保守する。","バケットポリシーでアクセスを制限する。","S3 のサービス基盤の可用性を確保する。","保存するデータの機密度を分類する。","S3 のサーバーの OS にパッチを適用する。"],"answer":[1,3],"why":["S3 を構成する物理ストレージは AWS が管理する。","バケットポリシーや IAM でアクセスを制御するのはお客様の責任。","S3 のサービス基盤の運用は AWS が担う。","どのデータがどの程度機密かを判断し、保護の方法を決めるのはお客様。","S3 の基盤となるサーバーの OS は AWS が管理しており、お客様は操作しない。"],"explain":"S3 はマネージドサービスで、基盤は AWS が運用する。お客様はデータの分類、アクセス制御、暗号化の設定など、データの扱いについて責任を持つ。","point":"S3 のデータ分類・アクセス制御・暗号化の設定はお客様の責任。基盤は AWS。","diagram":null},{"id":"clf-d2-06","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルでは、パッチ管理が「共有のコントロール」に分類されています。この分類に当てはまる説明はどれですか。","choices":["AWS がお客様のゲスト OS を含め、すべてにパッチを適用する。","お客様が AWS の物理インフラを含め、すべてにパッチを適用する。","AWS は基盤に、お客様はゲスト OS とアプリに適用する。","AWS とお客様のどちらも、パッチを適用する必要はない。"],"answer":[2],"why":["ゲスト OS のパッチ適用は、EC2 などではお客様の責任。","お客様は AWS の物理インフラやホストにパッチを適用できない。","共有のコントロールでは、それぞれが自分の管理範囲に対して同じ種類の作業を行う。","パッチ管理はどちらにも必要で、省略できるものではない。"],"explain":"共有のコントロールは、AWS とお客様の双方が責任を負うが、対象範囲が異なるものを指す。パッチ管理では、AWS が基盤を、お客様がゲスト OS とアプリケーションを担当する。","point":"パッチ管理は共有のコントロール。AWS は基盤、お客様はゲスト OS とアプリケーション。","diagram":null},{"id":"clf-d2-07","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルでは、お客様が AWS から「継承する」コントロールがあります。継承されるコントロールの例はどれですか。","choices":["IAM ユーザーの権限を管理するコントロール","データセンターの物理的および環境的なコントロール","ゲスト OS の構成を管理するコントロール","従業員にセキュリティ教育を行うコントロール"],"answer":[1],"why":["権限管理はお客様自身が設定するお客様固有のコントロール。","物理的・環境的なコントロールは AWS が全面的に管理し、お客様はそれを継承する。","ゲスト OS の構成管理はお客様が担う部分で、共有のコントロールに含まれる。","セキュリティトレーニングは、AWS が自社の従業員に、お客様が自社の従業員に行う共有のコントロール。"],"explain":"継承されるコントロールは、お客様が AWS から完全に引き継ぐもので、物理的および環境的なコントロールが代表例。共有のコントロールは双方が範囲を分担し、お客様固有のコントロールはお客様だけが責任を持つ。","point":"継承されるコントロールは物理的・環境的なもの。お客様は AWS の管理をそのまま引き継ぐ。","diagram":null},{"id":"clf-d2-08","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルにおける「クラウドのセキュリティ」について、正しい説明はどれですか。","choices":["お客様がアプリケーションのデータを暗号化する責任を指すもの。","お客様が IAM ユーザーに権限を設定して管理する責任を指すもの。","お客様がゲスト OS の脆弱性に対処して保護する責任を指すもの。","AWS がクラウドの稼働基盤を保護する責任を指すもの。"],"answer":[3],"why":["データの暗号化の選択はお客様の責任で、クラウド「における」セキュリティに含まれる。","IAM の権限設定はお客様の責任で、クラウド「における」セキュリティに含まれる。","ゲスト OS の脆弱性対応はお客様の責任で、クラウド「における」セキュリティに含まれる。","ハードウェア、ソフトウェア、ネットワーク、施設などの基盤を守るのは AWS で、これが「クラウドのセキュリティ」。"],"explain":"AWS は「クラウドのセキュリティ」として、AWS サービスを実行するインフラストラクチャを保護する。お客様は「クラウドにおけるセキュリティ」として、利用するサービスの設定、データ、アクセス管理を担う。","point":"「の」は AWS（インフラの保護）、「における」はお客様（データ・設定・アクセス）。","diagram":null},{"id":"clf-d2-09","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、規制対象の個人データを AWS 上で処理します。AWS が多くの第三者認証を取得している場合、コンプライアンスの責任はどのように分担されますか。","choices":["ワークロードを規制に適合させる責任はお客様にある。","ワークロードを規制に適合させる責任は AWS にある。","AWS の認証があれば、お客様は何も対応しなくてよい。","規制の適合はどちらの責任にもならない。"],"answer":[0],"why":["AWS は自社のインフラの認証を取得するが、その上で動くワークロードの適合性はお客様が確保する。","AWS はお客様のワークロードの設定や運用内容を管理しない。","インフラの認証は、お客様のワークロードを自動的に適合させるものではない。","適合はお客様と AWS が範囲を分けて担うもので、責任の所在がないわけではない。"],"explain":"AWS は基盤のコンプライアンスを維持して認証を取得するが、お客様はその上で動かすシステムやデータの扱いを規制に合わせて設計・運用する責任を負う。AWS の認証は、お客様の適合を支える材料になる。","point":"インフラの認証は AWS、ワークロードを規制に適合させる責任はお客様。","diagram":null},{"id":"clf-d2-10","domain":2,"topic":"責任共有モデル","type":"multi","stem":"ある企業は、Amazon RDS for MySQL のデータベースを運用しています。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["データベースサーバーの OS にパッチを適用する。","保存データの暗号化を有効にするかを決める。","データベースエンジンの修正プログラムを開発する。","メンテナンスウィンドウを実施する時間帯を選ぶ。","データベースを稼働させる物理ホストを保守する。"],"answer":[1,3],"why":["RDS では OS のパッチ適用は AWS が行う。","暗号化を有効にするかどうかの設定はお客様が決める。","エンジンの修正プログラムの提供や適用の仕組みは AWS が担う。","パッチが適用される時間帯の選択はお客様の側で行う。","物理ホストの保守は AWS の責任。"],"explain":"RDS では、OS と DB エンジンの運用は AWS が行うが、メンテナンスウィンドウの時間帯の選択、暗号化の設定、データ、アクセス制御はお客様の責任として残る。","point":"RDS のお客様の責任は、データ、アクセス制御、暗号化の設定、メンテナンスウィンドウの選択。","diagram":null},{"id":"clf-d2-11","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルでは、構成管理も「共有のコントロール」です。構成管理におけるお客様の責任はどれですか。","choices":["AWS のネットワーク機器の構成を確認し、保守する。","AWS のデータセンターのホストの構成を確認し、保守する。","ゲスト OS と DB、アプリの構成を保守する。","AWS のグローバルインフラの構成を確認し、保守する。"],"answer":[2],"why":["AWS のネットワーク機器の構成は AWS が管理する。","ホストの構成は AWS が管理する。お客様は操作できない。","お客様は自分が使うゲスト OS、データベース、アプリケーションの構成を管理する。","グローバルインフラの構成は AWS が管理する。"],"explain":"構成管理では、AWS が基盤となるインフラストラクチャのデバイスの構成を管理し、お客様は自分のゲスト OS、データベース、アプリケーションの構成を管理する。両者が同じ種類の作業を、それぞれの範囲で担当する。","point":"構成管理は共有のコントロール。AWS はインフラのデバイス、お客様はゲスト OS・DB・アプリ。","diagram":null},{"id":"clf-d2-12","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルでは、「意識向上とトレーニング」が共有のコントロールとされています。この説明として正しいものはどれですか。","choices":["AWS がお客様の従業員に対して、トレーニングを必ず実施する。","お客様が AWS の従業員に対して、トレーニングを必ず実施する。","AWS は自社の従業員を、お客様は自社の従業員をそれぞれ教育する。","AWS がお客様の従業員を含め、全員を教育する。"],"answer":[2],"why":["お客様の従業員の教育は、お客様自身の責任。","AWS の従業員の教育は、AWS が自社で行う。","それぞれが自社の従業員に対して意識向上とトレーニングを行うため、共有のコントロールになる。","お客様の従業員の教育を AWS が引き受けることはない。"],"explain":"意識向上とトレーニングは、AWS が自社の従業員向けに、お客様が自社の従業員向けに、それぞれ実施する。パッチ管理や構成管理と同様、双方が自分の範囲に責任を持つ共有のコントロールである。","point":"意識向上とトレーニングも共有のコントロール。各自が自社の従業員を教育する。","diagram":null},{"id":"clf-d2-13","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、Amazon DynamoDB のテーブルに顧客の注文情報を保存しています。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["IAM ポリシーでテーブルへのアクセス権限を制御する。","DynamoDB を構成するサーバーに修正を適用する。","データが保存される物理ディスクを管理する。","DynamoDB のサービス基盤を複数の AZ に配置する。"],"answer":[0],"why":["誰がどのテーブルにどの操作をできるかを IAM で設定するのはお客様の責任。","DynamoDB のサーバーはフルマネージドで、AWS が管理する。","物理ディスクを含むストレージの管理は AWS の責任。","サービス基盤の AZ への配置と可用性の確保は AWS が行う。"],"explain":"DynamoDB はフルマネージドなサービスで、サーバーやストレージの管理は AWS が担う。お客様は、テーブルに保存するデータの扱い、IAM によるアクセス制御、暗号化に関する設定に責任を持つ。","point":"DynamoDB でもデータの扱いとアクセス制御はお客様の責任。","diagram":null},{"id":"clf-d2-14","domain":2,"topic":"責任共有モデル","type":"multi","stem":"AWS 責任共有モデルにおいて、AWS の責任はどれですか。","choices":["EC2 インスタンスの OS を最新の状態に保つ。","リージョンとアベイラビリティーゾーンの運用を行う。","S3 バケットの公開設定を確認する。","EC2 を動かす仮想化レイヤーを保護する。","ユーザーのアクセスキーを定期的に更新する。"],"answer":[1,3],"why":["EC2 のゲスト OS はお客様が管理する。","リージョンや AZ を含むグローバルインフラストラクチャの運用は AWS の責任。","バケットの公開設定はお客様が決めて確認する。","ハイパーバイザーを含む仮想化レイヤーの保護は AWS の責任。","アクセスキーの管理と更新はお客様の責任。"],"explain":"AWS はクラウドのセキュリティとして、物理設備、ハードウェア、仮想化レイヤー、グローバルインフラストラクチャを担う。OS、バケット設定、アクセスキーなどはクラウドにおけるセキュリティとしてお客様が担う。","point":"仮想化レイヤーとグローバルインフラは AWS。OS・公開設定・アクセスキーはお客様。","diagram":null},{"id":"clf-d2-15","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、コンテナを Amazon ECS で実行します。EC2 起動タイプから AWS Fargate に切り替えた場合に、お客様が管理する必要がなくなる作業はどれですか。","choices":["コンテナイメージに含まれる脆弱性に対処して更新する。","タスクに付与する IAM ロールの権限を設計する。","コンテナを実行するホストの OS にパッチを適用する。","コンテナ内のアプリケーションコードを保護する。"],"answer":[2],"why":["自分で用意するコンテナイメージの内容はお客様の責任で、Fargate でも変わらない。","タスクに与える権限はお客様が決める。Fargate でも同じ。","Fargate ではホストとなるインフラストラクチャを AWS が管理するため、ホスト OS のパッチ適用は不要になる。","アプリケーションコードの保護はお客様の責任。"],"explain":"EC2 起動タイプでは、コンテナを動かす EC2 インスタンスの OS をお客様が管理する。Fargate ではホストの管理が AWS に移り、お客様はコンテナイメージ、アプリケーション、権限設定などに集中できる。","point":"Fargate ではホストの OS 管理が不要。イメージ・コード・権限はお客様。","diagram":null},{"id":"clf-d2-16","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、顧客データを AWS 上のアプリケーションとやり取りします。転送中のデータを保護する責任について、正しい説明はどれですか。","choices":["AWS がすべての通信を自動的に暗号化するため、設定は不要である。","AWS が通信経路の暗号化の使用を、お客様に代わって決定する。","お客様が TLS などの通信を暗号化する仕組みを選択して使用する。","通信を暗号化する責任は、どちらにも割り当てられていない。"],"answer":[2],"why":["一部のサービスは既定で暗号化するが、すべての通信が自動的に暗号化されるわけではない。","AWS はお客様のデータの扱い方を代わりに決めることはない。","通信の暗号化の方式を選び、アプリケーションで使うのはお客様の責任。","責任の所在は決まっており、通信の暗号化の選択はお客様にある。"],"explain":"転送中のデータの保護は、お客様が TLS などを使って行う。AWS はサービスのエンドポイントで暗号化通信に対応した機能を提供するが、どう使うかを決めるのはお客様である。","point":"通信の暗号化（TLS など）の選択と使用はお客様の責任。","diagram":null},{"id":"clf-d2-17","domain":2,"topic":"責任共有モデル","type":"single","stem":"AWS 責任共有モデルにおける「お客様固有のコントロール」に当てはまるものはどれですか。","choices":["自社の規制要件に合わせて、データを保管するリージョンを選択する。","AWS のデータセンターへの入退室を管理して記録する。","AWS のホストのハイパーバイザーにパッチを適用する。","AWS のストレージデバイスを安全に消去して廃棄する。"],"answer":[0],"why":["どのリージョンにデータを置くかは、お客様が自社の要件に基づいて判断するお客様固有のコントロール。","入退室の管理は AWS が行う物理的なセキュリティで、お客様は継承する。","ハイパーバイザーのパッチ適用は AWS の責任。","ストレージデバイスの廃棄は AWS の責任。"],"explain":"お客様固有のコントロールは、お客様のアプリケーションや要件によって決まり、お客様だけが責任を持つもの。データの所在地の判断はその一例で、AWS が代わりに決めることはない。","point":"リージョンの選択などお客様の要件で決まるものが、お客様固有のコントロール。","diagram":null},{"id":"clf-d2-18","domain":2,"topic":"責任共有モデル","type":"multi","stem":"ある企業は、AWS アカウントの IAM を運用しています。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["IAM ポリシーで必要最小限の権限を付与する。","IAM サービスを稼働させるサーバーを保守する。","IAM のサービス基盤のデータセンターを保護する。","ルートユーザーに MFA を設定して保護する。","IAM のサービスを複数のリージョンで運用する。"],"answer":[0,3],"why":["ユーザーやロールに与える権限を最小限にするのはお客様の責任。","IAM を動かすサーバーの保守は AWS が行う。","データセンターの保護は AWS の物理的なセキュリティの責任。","ルートユーザーの保護や MFA の有効化はお客様が行う。","IAM のサービス基盤の運用は AWS が担う。"],"explain":"IAM のサービス自体の運用は AWS が行うが、その使い方、つまり権限の設計、MFA の有効化、認証情報の管理はお客様の責任である。","point":"IAM の設定（権限・MFA・認証情報の管理）はお客様。サービス基盤は AWS。","diagram":null},{"id":"clf-d2-19","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、取引先から AWS のセキュリティ体制を証明するサードパーティの監査レポートの提出を求められました。このレポートをオンデマンドでダウンロードできる AWS のサービスはどれですか。","choices":["AWS Audit Manager","AWS Config","AWS Artifact","Amazon Inspector"],"answer":[2],"why":["お客様自身の監査に必要な証拠収集を自動化するサービス。AWS のレポートを配布するものではない。","リソースの設定を記録し、ルールへの準拠を評価するサービス。監査レポートの入手には使わない。","AWS のコンプライアンスレポートや認証の文書をダウンロードでき、契約の締結も行えるセルフサービスのポータル。","EC2 インスタンスやコンテナイメージなどの脆弱性をスキャンするサービス。レポートの配布とは無関係。"],"explain":"AWS Artifact は、AWS のサードパーティ監査レポート（SOC など）や認証の文書にオンデマンドでアクセスするためのポータルである。AWS Audit Manager は、お客様自身の監査対象の証拠を継続的に収集する別のサービスで、取り違えやすい。","point":"AWS のレポートを入手するのは Artifact、自社の監査の証拠を集めるのは Audit Manager。","diagram":null},{"id":"clf-d2-20","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、自社の AWS 利用状況が社内の統制や規制の要件に沿っていることを監査人に示すため、証拠の収集を自動化して運用上の手間を減らしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Audit Manager","AWS Artifact","AWS CloudTrail","AWS Trusted Advisor"],"answer":[0],"why":["監査の証拠収集を自動化し、フレームワークに基づいて監査の準備を継続的に行えるサービス。","AWS 側のコンプライアンスレポートを入手するポータル。お客様の環境の証拠を集めるものではない。","API 呼び出しの履歴を記録するサービス。証拠の 1 つにはなるが、監査の準備を管理するものではない。","コスト・セキュリティなどのベストプラクティスに沿った推奨事項を示すサービス。監査の証拠管理は行わない。"],"explain":"AWS Audit Manager は、お客様の AWS 利用状況を監査の要件に照らして継続的に評価し、証拠の収集を自動化する。AWS Artifact は AWS 自身の監査レポートを入手する場であり、対象が異なる。","point":"自社の監査の証拠収集を自動化するのは Audit Manager。AWS のレポート入手は Artifact。","diagram":null},{"id":"clf-d2-21","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"セキュリティ担当者は、ある Amazon S3 バケットが削除された際に、どの IAM ユーザーがいつ API を呼び出したのかを調査する必要があります。この調査に使用する AWS のサービスはどれですか。","choices":["Amazon CloudWatch","AWS CloudTrail","AWS Config","Amazon GuardDuty"],"answer":[1],"why":["メトリクスの収集とアラームの設定を行うサービス。API を呼び出した主体の記録は目的ではない。","アカウント内の API 呼び出しを、呼び出したユーザー・時刻・送信元などとともに記録するサービス。","リソースの設定とその変更履歴を記録するサービス。誰が操作したかを主目的にはしない。","ログを分析して脅威を検出するサービス。操作履歴を調査するための記録そのものではない。"],"explain":"「誰が・いつ・どの API を呼び出したか」を調べるのは AWS CloudTrail の役割である。AWS Config は「リソースの設定がどう変わったか」、CloudWatch は「メトリクスとアラーム」を扱う。","point":"誰がいつどの API を呼んだかは CloudTrail。設定の変更履歴は Config。","diagram":null},{"id":"clf-d2-22","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、セキュリティグループの設定が過去にどのように変更されてきたかを時系列で確認したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon CloudWatch","AWS CloudTrail","AWS Artifact","AWS Config"],"answer":[3],"why":["CPU 使用率などのメトリクスやログを監視するサービス。設定の履歴は保持しない。","API 呼び出しの記録が中心のサービス。リソースの設定の状態を時系列で追うものではない。","AWS のコンプライアンスレポートを入手するポータル。リソースの設定は記録しない。","リソースの設定を継続的に記録し、変更履歴を確認できるサービス。"],"explain":"AWS Config はリソースの設定を記録し、いつどのように変わったかを時系列で確認できる。誰が変更したかという操作の記録は CloudTrail が担うため、問いが「設定の状態」か「API 操作」かで見分ける。","point":"リソースの設定の履歴と状態は Config、API の操作記録は CloudTrail。","diagram":null},{"id":"clf-d2-23","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、AWS Organizations で 30 個の AWS アカウントを管理しています。監査チームは、すべてのアカウントで行われた API の操作の記録を、アカウントごとに個別の設定をすることなく 1 か所に集めて保管したいと考えています。この要件を満たす方法はどれですか。","choices":["各アカウントで Amazon Inspector を有効にし、API の呼び出しの記録を S3 に保存する。","各アカウントで Amazon CloudWatch のダッシュボードを作成し、API の操作を一覧で確認する。","管理アカウントで AWS CloudTrail の組織の証跡を作成し、ログを 1 つの S3 バケットに集める。","管理アカウントで AWS Artifact からレポートをダウンロードし、各アカウントの API の操作を確認する。"],"answer":[2],"why":["Amazon Inspector は、EC2・コンテナイメージ・Lambda の脆弱性を自動でスキャンするサービス。API の呼び出しは記録しない。","CloudWatch のダッシュボードはメトリクスの可視化に使う。API の操作の記録を集めるものではない。","組織の証跡は、管理アカウント（または委任管理者のアカウント）で作成すると組織内のすべてのアカウントに適用され、ログを 1 つの S3 バケットに集約できる。","AWS Artifact は、AWS のコンプライアンスレポートや契約を入手するサービス。自社のアカウントの API の操作は記録しない。"],"explain":"決め手は「すべてのアカウント」「API の操作の記録」「1 か所に集める」。API の操作を記録するのは AWS CloudTrail で、AWS Organizations と組み合わせた組織の証跡を使えば、メンバーアカウントごとに設定しなくても全アカウントの記録を一元的に保管できる。","point":"全アカウントの API の操作の記録を一元化するなら CloudTrail の組織の証跡。メトリクスの監視は CloudWatch、設定の記録は Config。","diagram":null},{"id":"clf-d2-24","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は AWS Organizations で多数のアカウントを管理しています。社内の方針として、すべてのメンバーアカウントで承認されていないリージョンの利用を禁止したいと考えています。最も適した方法はどれですか。","choices":["各アカウントのセキュリティグループを変更する。","サービスコントロールポリシー（SCP）を適用する。","各アカウントの IAM ユーザーを削除する。","AWS Artifact でリージョンの利用を制限する。"],"answer":[1],"why":["セキュリティグループはインスタンスへの通信を制御するもので、利用できるリージョンの制限には使えない。","組織内のアカウントで許可される操作の上限を一括で定められ、リージョンの制限もできる。","ユーザーを削除すると業務に必要な操作もできなくなる。リージョンだけを制限する方法ではない。","AWS Artifact はコンプライアンスレポートの入手や契約の確認を行うサービスで、利用の制限はできない。"],"explain":"SCP は、OU やアカウントに対して許可できる操作の上限を定める機能で、リージョンを限定する用途にも使える。アカウントごとに個別設定をする必要がなく、運用上のオーバーヘッドも小さい。","point":"複数アカウントの操作を一括で制限するなら Organizations の SCP。","diagram":null},{"id":"clf-d2-25","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、ベストプラクティスに沿ったガードレールを備えたマルチアカウントの AWS 環境を、少ない手間で構築して運用したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Audit Manager","AWS Trusted Advisor","AWS CloudFormation","AWS Control Tower"],"answer":[3],"why":["監査の証拠収集を自動化するサービス。マルチアカウント環境の構築は行わない。","ベストプラクティスに沿った推奨事項を示すサービス。環境の構築やガードレールの適用は行わない。","テンプレートでリソースを作成するサービス。ガードレール付きの環境を自動で整える仕組みは持たない。","ガードレールを備えたランディングゾーンを自動でセットアップし、複数アカウントの統制を支援するサービス。"],"explain":"AWS Control Tower は、ベストプラクティスに基づくマルチアカウント環境（ランディングゾーン）を構築し、ガードレールで統制する。CloudFormation は IaC の一般的な手段であり、統制の仕組みそのものを提供するわけではない。","point":"ガードレール付きのマルチアカウント環境の構築は Control Tower。","diagram":null},{"id":"clf-d2-26","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、AWS が特定のコンプライアンスプログラムの認証を取得していることを確認しました。この認証について正しい説明はどれですか。","choices":["お客様のワークロードも自動的にその基準に準拠する。","AWS のサービスはすべてその認証の対象範囲に含まれる。","認証の対象はクラウドの基盤であり、お客様はアプリケーションの準拠を別に確認する必要がある。","お客様は AWS 責任共有モデルの責任から免除される。"],"answer":[2],"why":["AWS の認証はクラウドの基盤に対するもの。お客様が構築するワークロードの準拠は自動では保証されない。","認証の対象となるサービスはプログラムごとに決まっている。すべてのサービスが対象とは限らない。","AWS の取得した認証は AWS が担う範囲に対するもの。お客様は自分の責任範囲で準拠を確認する必要がある。","責任共有モデルは認証を取得しても変わらない。お客様の責任は残る。"],"explain":"AWS が取得したコンプライアンス認証は、AWS が責任を持つクラウドの基盤が基準を満たすことを示す。その上で動かすお客様のワークロードやデータの扱いが基準に沿うかは、お客様が確認する必要がある。また、対象となるサービスはプログラムごとに異なる。","point":"AWS の認証はクラウドの基盤が対象。ワークロードの準拠はお客様が確認する。","diagram":null},{"id":"clf-d2-27","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、規制によりデータを特定の国内に保存する必要があります。AWS のデータの所在地について正しい説明はどれですか。","choices":["お客様の同意なく、保存したデータを別のリージョンへ移動することはない。","データは AWS が最適なリージョンへ自動的に複製する。","リージョンを選択しても、データは世界中のリージョンに保存される。","データの保存先リージョンは、AWS サポートが決定する。"],"answer":[0],"why":["お客様がリージョンを選んでデータの保存先を決め、AWS はお客様の同意なしにリージョン間でデータを移さない。","リージョン間の複製はお客様が設定した場合に行われる。AWS が勝手に複製するわけではない。","データは、お客様が選択したリージョンに保存される。全世界に自動で分散されることはない。","保存先はお客様が選ぶ。AWS サポートが決めるものではない。"],"explain":"AWS ではお客様がリージョンを選択してデータの所在地を管理する。AWS はお客様の同意なくデータを別のリージョンへ移さないため、データ主権や規制の要件に対応しやすい。","point":"データの保存先はお客様がリージョンで選ぶ。同意なく別リージョンへは移されない。","diagram":null},{"id":"clf-d2-28","domain":2,"topic":"ガバナンス・コンプライアンス","type":"multi","stem":"ある企業は、保存時の暗号化に関する社内の要件を満たす必要があります。保存時のデータの暗号化に該当する対策はどれですか。","choices":["Amazon S3 のオブジェクトをサーバー側の暗号化を有効にして保存する。","ALB のリスナーで HTTPS を使用してクライアントと通信する。","クライアントと EC2 インスタンスの間で TLS を使用する。","暗号化を有効にした Amazon EBS ボリュームにデータを保存する。","Site-to-Site VPN で拠点と VPC を接続する。"],"answer":[0,3],"why":["S3 のサーバー側の暗号化は、ストレージに書き込まれるオブジェクトを暗号化する保存時の暗号化。","HTTPS はクライアントとの通信経路の暗号化で、転送時の暗号化に当たる。","TLS は通信中のデータを保護する転送時の暗号化。保存されたデータの保護ではない。","EBS の暗号化は、ボリュームに保存されるデータを暗号化する保存時の暗号化。","VPN は拠点と VPC の間の通信を暗号化する転送時の暗号化の手段。"],"explain":"暗号化には、ストレージに置かれたデータを守る保存時の暗号化と、ネットワーク上を流れるデータを守る転送時の暗号化がある。S3 や EBS の暗号化は前者、HTTPS・TLS・VPN は後者に当たる。","point":"保存時は S3・EBS などの暗号化、転送時は HTTPS・TLS・VPN。","diagram":null},{"id":"clf-d2-29","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、Amazon S3 に保管した AWS CloudTrail のログファイルが、配信後に改ざん・削除されていないかを検証したいと考えています。この要件を満たす CloudTrail の機能はどれですか。","choices":["CloudTrail の Insights イベント","ログファイルの整合性の検証","Amazon CloudWatch のアラーム","AWS Config のルール"],"answer":[1],"why":["通常と異なる API の使われ方を検出する機能。ログファイルの改ざん検証ではない。","ログファイルのダイジェストを使って、配信後にログが変更・削除されていないかを検証できる機能。","メトリクスがしきい値を超えたときに通知するもので、ログファイルの改ざんは検証しない。","リソースの設定が定義に準拠しているかを評価するもの。ログファイルの検証は目的ではない。"],"explain":"CloudTrail のログファイルの整合性の検証を有効にすると、ログの配信後にファイルが変更・削除されたかを確認できる。監査で記録の信頼性を示す必要がある場合に使う。","point":"CloudTrail のログの改ざん検知はログファイルの整合性の検証。","diagram":null},{"id":"clf-d2-30","domain":2,"topic":"ガバナンス・コンプライアンス","type":"multi","stem":"ある企業は、AWS Config の利用を検討しています。AWS Config の機能として正しいものはどれですか。","choices":["ユーザーがいつどの API を呼び出したかを記録する。","リソースの設定変更の履歴を記録する。","CPU 使用率などのメトリクスにアラームを設定する。","VPC フローログなどを分析して不正な動作を検出する。","リソースの設定が定義したルールに準拠しているかを評価する。"],"answer":[1,4],"why":["API 呼び出しの記録は AWS CloudTrail の機能。","AWS Config はリソースの設定を継続的に記録し、変更の履歴を確認できる。","メトリクスとアラームは Amazon CloudWatch の機能。","ログを分析して脅威を検出するのは Amazon GuardDuty の役割。","Config ルールにより、設定が望ましい状態に準拠しているかを評価できる。"],"explain":"AWS Config は、リソースの設定の記録と、ルールに対する準拠の評価を行う。API の操作記録は CloudTrail、メトリクスの監視は CloudWatch、脅威の検出は GuardDuty と、役割を分けて覚える。","point":"Config は設定の履歴の記録と、ルールへの準拠の評価。","diagram":null},{"id":"clf-d2-31","domain":2,"topic":"ガバナンス・コンプライアンス","type":"multi","stem":"ある企業は、AWS Organizations でサービスコントロールポリシー（SCP）を使用しようとしています。SCP について正しい説明はどれですか。","choices":["メンバーアカウントのルートユーザーにも適用される。","管理アカウントのユーザーにも制限が適用される。","許可される操作の上限を定めるもので、権限そのものは付与しない。","SCP を適用すると、IAM ユーザーにすべての操作が許可される。","OU には適用できず、アカウント単位でのみ適用できる。"],"answer":[0,2],"why":["SCP はメンバーアカウントのルートユーザーを含め、IAM ユーザーやロールの操作を制限する。","SCP は管理アカウントには影響しない。メンバーアカウントが対象。","SCP は許可できる操作の上限（ガードレール）で、実際の許可は IAM ポリシーなどで別に付与する必要がある。","SCP 自体は権限を付与しない。許可には IAM ポリシーが必要。","SCP は組織のルート、OU、個別のアカウントのいずれにも適用できる。"],"explain":"SCP は、組織内のメンバーアカウントで許可される操作の上限を定める。権限を付与するものではなく、ルートユーザーも制限の対象になる一方、管理アカウントには適用されない。OU に適用すれば配下のアカウントにまとめて反映できる。","point":"SCP は権限の上限を定める。権限は付与せず、管理アカウントには適用されない。","diagram":null},{"id":"clf-d2-32","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、コンプライアンス上の理由から、AWS アカウントの管理イベントの記録を 90 日を超えて保管する必要があります。この要件を満たすために必要なことはどれですか。","choices":["CloudTrail のイベント履歴を延長設定する。","Amazon CloudWatch のメトリクスを保存する。","AWS Config のルールを追加する。","証跡を作成して Amazon S3 に配信する。"],"answer":[3],"why":["イベント履歴は過去 90 日分の管理イベントを確認する機能で、期間を延長する設定はない。","メトリクスの保存は API 操作の記録の保管にならない。","Config ルールは設定の準拠を評価するもので、操作記録の長期保管のためではない。","証跡を作成すると、イベントを S3 バケットに継続して配信でき、長期にわたり保管できる。"],"explain":"CloudTrail のイベント履歴では過去 90 日分の管理イベントを確認できる。それより長く保管したい場合は、証跡を作成して Amazon S3 などにログを配信する。","point":"90 日を超えて保管するには、CloudTrail の証跡を作成して S3 に配信する。","diagram":null},{"id":"clf-d2-33","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、データを国内にのみ保存するという要件を満たす必要があります。AWS でこの要件を満たすための最初の対応として適切なものはどれですか。","choices":["エッジロケーションにデータを保存する。","AWS Artifact で保存先を指定する。","国内のリージョンを選択してデータを保存する。","AWS サポートに保存先の変更を依頼する。"],"answer":[2],"why":["エッジロケーションはコンテンツ配信のためのもので、データの保存先を指定する手段ではない。","Artifact は監査レポートの入手や契約の確認を行う場で、データの保存先は指定できない。","お客様が国内のリージョンを選んでリソースを作成すれば、データはそのリージョンに保存される。","保存先はお客様がリージョンで選ぶもので、サポートに依頼して変更するものではない。"],"explain":"AWS ではデータの保存先をリージョンの選択で決める。国内に保存する必要がある場合は、国内のリージョンを選んでリソースを作成する。AWS はお客様の同意なくデータを別のリージョンに移さない。","point":"データの所在地の要件は、リージョンの選択で満たす。","diagram":null},{"id":"clf-d2-34","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、Amazon S3 バケットが公開設定になった場合に、組織のルールに違反しているリソースとして自動的に検出したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Config","AWS CloudTrail","Amazon CloudWatch","AWS Artifact"],"answer":[0],"why":["Config ルールでリソースの設定を評価し、ルールに違反するものを非準拠として検出できる。","API 呼び出しの履歴を記録するサービス。設定がルールに準拠しているかを評価するものではない。","メトリクスの監視とアラームを担うサービス。リソースの設定の準拠は評価しない。","AWS のコンプライアンスレポートを入手するサービス。お客様のリソースの評価は行わない。"],"explain":"AWS Config はルールを使って、リソースの設定が定義した状態に準拠しているかを継続的に評価する。違反したリソースは非準拠として報告される。CloudTrail は操作の記録であり、準拠の評価は行わない。","point":"設定のルール違反の検出は Config のルール。","diagram":null},{"id":"clf-d2-35","domain":2,"topic":"ガバナンス・コンプライアンス","type":"single","stem":"ある企業は、AWS Control Tower の発見的ガードレールを使って、リソースの設定が方針に違反していることを検出して報告したいと考えています。発見的ガードレールが違反の検出に利用する仕組みはどれですか。","choices":["サービスコントロールポリシー（SCP）","AWS Config のルール","AWS CloudTrail のイベント履歴","AWS Artifact のレポート"],"answer":[1],"why":["違反となる操作そのものを実行できないようにする予防的ガードレールの仕組み。検出して報告するものではない。","リソースの設定を評価して、違反したものを非準拠として検出・報告できる。発見的ガードレールはこの仕組みで実装される。","API 呼び出しの履歴を記録するもので、設定が方針に違反しているかの評価は行わない。","AWS のコンプライアンスレポートを入手するもので、お客様のリソースの設定は検出しない。"],"explain":"Control Tower のガードレールには、操作を防ぐ予防的ガードレールと、違反を検出して報告する発見的ガードレールがある。予防的は SCP、発見的は AWS Config のルールで実装される。検出するだけで操作は防がない点が違いである。","point":"予防的ガードレールは SCP で操作を防ぎ、発見的ガードレールは Config のルールで違反を検出する。","diagram":null},{"id":"clf-d2-36","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、Amazon EC2 上で動くアプリケーションから Amazon S3 のバケットを読み取る必要があります。長期的な認証情報をコードに持たせずに権限を渡す、最も安全な方法はどれですか。","choices":["IAM ユーザーのアクセスキーをアプリケーションのコードに埋め込む。","IAM ロールを作成して EC2 インスタンスにアタッチする。","ルートユーザーのアクセスキーをインスタンスに保存する。","IAM ユーザーのパスワードを設定ファイルに保存する。"],"answer":[1],"why":["アクセスキーをコードに埋め込むと、漏えいや誤公開のリスクが高く、ローテーションも難しい。","IAM ロールを使うと、インスタンス上のアプリケーションは自動で更新される一時的な認証情報を取得できる。","ルートユーザーのアクセスキーはアカウント全体に影響するため、作成も保存も避けるべきである。","パスワードは人がコンソールにサインインするためのもので、アプリケーションの認証に使うものではない。"],"explain":"EC2 上のアプリケーションに権限を渡すときは IAM ロールを使う。ロールは一時的な認証情報を自動で発行するため、長期的な認証情報を保管・管理する必要がない。","point":"EC2 上のアプリに権限を渡すときは IAM ロールで一時的な認証情報を使う。キーの埋め込みは避ける。","diagram":null},{"id":"clf-d2-37","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業では、同じ部署の 30 人が IAM ユーザーとして同じ権限を必要としています。異動のたびに権限を個別に付け替える手間を減らしたいと考えています。最も適切な IAM の機能はどれですか。","choices":["IAM ロール","IAM アクセスキー","IAM グループ","IAM パスワードポリシー"],"answer":[2],"why":["ロールは一時的に引き受けて使う ID で、部署の人員に恒常的に権限をまとめて付ける用途には向かない。","アクセスキーはプログラムからのアクセスに使う認証情報で、権限をまとめる機能ではない。","IAM グループにポリシーをアタッチし、ユーザーをグループに所属させると、権限をまとめて管理できる。異動時もグループの所属を変えるだけで済む。","パスワードポリシーはパスワードの強度や有効期限を決めるもので、権限の付与には関係しない。"],"explain":"複数の IAM ユーザーに同じ権限を与えるには、IAM グループにポリシーをアタッチする。ユーザーごとにポリシーを付けるより管理が簡単になる。","point":"同じ権限を持つ IAM ユーザーは IAM グループにまとめ、グループにポリシーをアタッチする。","diagram":null},{"id":"clf-d2-38","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業が、AWS アカウントのルートユーザーを保護する方法を検討しています。AWS のベストプラクティスに沿った対応はどれですか。","choices":["ルートユーザーのアクセスキーを作成してデプロイの自動化に使う。","ルートユーザーのパスワードを管理チームの全員で共有する。","ルートユーザーを使って日常の管理作業をまとめて行う。","ルートユーザーに MFA を設定し、通常は使用しない。"],"answer":[3],"why":["ルートユーザーのアクセスキーは権限が強すぎる。作成しないか、不要なら削除する。","パスワードの共有は誰が操作したかを追跡できなくなり、漏えいの危険も高まる。","日常作業には最小限の権限を付けた IAM ID や IAM Identity Center を使い、ルートユーザーは使わない。","MFA でサインインを保護し、ルートユーザーでしかできない作業のときだけ使う。"],"explain":"ルートユーザーはアカウント内のすべてのリソースに無制限にアクセスできる。MFA で保護したうえで、ルートユーザーでしかできない作業以外には使わない。","point":"ルートユーザーは MFA で保護し、日常作業に使わない。アクセスキーも作らない。","diagram":null},{"id":"clf-d2-39","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、単独の AWS アカウントを運用しています。ルートユーザーの認証情報が必要になる作業はどれですか。","choices":["唯一の IAM 管理者が失った管理者権限を復元する。","IAM ユーザーに管理者のポリシーをアタッチする。","Amazon S3 バケットを作成してデータを保存する。","IAM ロールを作成して Lambda 関数に割り当てる。"],"answer":[0],"why":["唯一の IAM 管理者が自分の権限を誤って取り消した場合は、ルートユーザーでサインインして権限を復元する。ルートユーザーでしかできない作業の 1 つである。","IAM の権限を持つ IAM ID であれば実行できる通常の管理作業である。","S3 バケットの作成は、権限のある IAM ID で実行できる。","IAM ロールの作成と割り当ては、権限のある IAM ID で実行できる。"],"explain":"ルートユーザーでしかできない作業には、IAM 管理者の権限の復元、単独アカウントの解約、アカウント設定の一部の変更などがある。通常のリソース操作や IAM の管理は IAM ID で行える。","point":"IAM 管理者の権限の復元や単独アカウントの解約は、ルートユーザーでしかできない作業。","diagram":null},{"id":"clf-d2-40","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、新しく入社した開発者に、特定の Amazon S3 バケットのオブジェクトを読み取る権限だけを付与したいと考えています。最小権限の原則に沿った対応はどれですか。","choices":["AdministratorAccess ポリシーを開発者に付与する。","AmazonS3FullAccess ポリシーを開発者に付与する。","そのバケットの読み取りだけを許可するポリシーを付与する。","PowerUserAccess ポリシーを開発者に付与する。"],"answer":[2],"why":["ほぼすべての操作を許可する管理者権限で、必要な範囲を大きく超える。","すべての S3 バケットに対する全操作を許可するため、必要以上に広い。","必要な操作（読み取り）と対象リソース（特定のバケット）だけを許可しており、最小権限の原則に沿う。","IAM 以外のほとんどのサービスを操作できる権限で、必要な範囲を大きく超える。"],"explain":"最小権限の原則は、業務に必要な操作と対象リソースだけを許可すること。まず狭い権限から始めて、必要に応じて追加する。","point":"最小権限とは、必要な操作・必要なリソースだけを許可すること。広い管理ポリシーは避ける。","diagram":null},{"id":"clf-d2-41","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、IAM ユーザーのパスワードが漏えいしても、第三者がサインインできないようにしたいと考えています。パスワードに加えて追加の認証要素を求める機能はどれですか。","choices":["AWS Config","多要素認証（MFA）","IAM ポリシーによる許可の設定","Amazon GuardDuty の脅威検出"],"answer":[1],"why":["AWS Config はリソースの構成変更を記録・評価するサービスで、サインイン時の認証には関与しない。","MFA は、パスワード（知識）に加えて MFA デバイスが生成するコードなど（所持）を求めるため、パスワードだけが漏れても不正サインインを防ぎやすい。","IAM ポリシーは許可する操作を定義するもので、サインイン時の追加認証は求めない。","GuardDuty は不審なアクティビティを検出する脅威検出サービスで、認証要素を追加する機能ではない。"],"explain":"MFA は、パスワードに加えて 2 つ目の認証要素を求めることでアカウントを保護する。ルートユーザーと IAM ユーザーの両方に設定できる。","point":"MFA はパスワードに加えて 2 つ目の認証要素を求める。ルートユーザーと IAM ユーザーに有効にする。","diagram":null},{"id":"clf-d2-42","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、IAM ユーザーのパスワードに最小文字数を設け、定期的に変更させたいと考えています。この要件を満たす設定はどれですか。","choices":["IAM のパスワードポリシー","Amazon S3 のバケットポリシー","IAM ロールの信頼ポリシー","VPC のセキュリティグループ"],"answer":[0],"why":["パスワードポリシーで、最小文字数、文字種の必須化、有効期限、再利用の禁止などを設定できる。","バケットポリシーは S3 バケットへのアクセスを制御するもので、パスワードの強度とは関係ない。","信頼ポリシーはロールを引き受けられる主体を定めるもので、パスワードの設定ではない。","セキュリティグループはインスタンスの通信を制御する仮想ファイアウォールである。"],"explain":"IAM のパスワードポリシーは、アカウント内の IAM ユーザーのパスワードの要件を定める。文字数や有効期限などを一括で強制できる。","point":"パスワードの強度や有効期限は IAM のパスワードポリシーで設定する。","diagram":null},{"id":"clf-d2-43","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、AWS Organizations で管理する複数の AWS アカウントに、従業員が 1 回のサインインでアクセスできるようにしたいと考えています。アカウントごとに IAM ユーザーを作りたくありません。運用上のオーバーヘッドが最小になる AWS のサービスはどれですか。","choices":["AWS Secrets Manager","AWS Certificate Manager","Amazon Cognito ユーザープール","AWS IAM Identity Center"],"answer":[3],"why":["Secrets Manager は認証情報などのシークレットを保管・ローテーションするサービスで、従業員のサインインには使わない。","Certificate Manager は TLS 証明書を管理するサービスで、サインインの仕組みではない。","Cognito ユーザープールは主にアプリケーションのエンドユーザー向けの認証に使い、社内の従業員に複数アカウントへのアクセスを割り当てる用途には向かない。","IAM Identity Center を使うと、複数のアカウントとアプリケーションへのシングルサインオンを一元管理でき、アカウントごとの IAM ユーザーも不要になる。"],"explain":"従業員が複数の AWS アカウントにシングルサインオンするには、IAM Identity Center を使う。アクセス権限をまとめて割り当てられるため、アカウントごとに IAM ユーザーを作る必要がない。","point":"複数アカウントへのシングルサインオンと権限の一元管理は IAM Identity Center。","diagram":null},{"id":"clf-d2-44","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、社内の ID プロバイダーで管理している従業員の認証情報を使って、AWS にサインインさせたいと考えています。従業員ごとに IAM ユーザーを作成することは避けたいです。どの方法が適切ですか。","choices":["従業員ごとにルートユーザーのパスワードを配布する。","外部の ID プロバイダーとのフェデレーションを設定する。","共有の IAM ユーザーを 1 つ作成して全員で使う。","従業員ごとにアクセスキーを発行して配布する。"],"answer":[1],"why":["ルートユーザーの認証情報を配布すると、アカウント全体の権限が渡ってしまう。","フェデレーションを設定すると、既存の ID プロバイダーで認証された従業員が一時的な認証情報で AWS にアクセスでき、IAM ユーザーを個別に作る必要がない。IAM Identity Center でも実現できる。","共有ユーザーでは操作者を特定できず、権限も分けられない。","アクセスキーは長期的な認証情報で、配布すると管理負担と漏えいのリスクが増える。"],"explain":"既存の ID プロバイダーの認証情報を使うには、フェデレーションを利用する。従業員は一時的な認証情報で AWS にアクセスでき、IAM ユーザーの管理が不要になる。","point":"既存の ID プロバイダーとのフェデレーションなら、IAM ユーザーを個別に作らずに済む。","diagram":null},{"id":"clf-d2-45","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、アプリケーションが使うデータベースのパスワードを安全に保管し、定期的に自動でローテーションしたいと考えています。運用上のオーバーヘッドを最小限にできる AWS のサービスはどれですか。","choices":["AWS Key Management Service（AWS KMS）","Amazon S3","AWS Secrets Manager","AWS CloudHSM"],"answer":[2],"why":["KMS は暗号化キーを作成・管理するサービスで、データベースのパスワードをシークレットとして保管してローテーションする機能ではない。","S3 はオブジェクトストレージで、シークレットの自動ローテーション機能はない。","Secrets Manager は、データベースの認証情報などを暗号化して保管し、自動ローテーションを設定できる。","CloudHSM は専用のハードウェアセキュリティモジュールを提供するサービスで、パスワードの保管とローテーションの用途ではない。"],"explain":"認証情報の自動ローテーションが必要なら AWS Secrets Manager を使う。アプリケーションは API でシークレットを取得するため、コードに認証情報を持たせずに済む。","point":"認証情報の保管と自動ローテーションは Secrets Manager。","diagram":null},{"id":"clf-d2-46","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、アプリケーションの設定値と暗号化した認証情報を階層的に一元管理したいと考えています。自動ローテーションは不要で、できるだけ費用を抑えたいです。適切な AWS のサービスまたは機能はどれですか。","choices":["AWS Systems Manager Parameter Store","AWS Secrets Manager の自動ローテーション","AWS Artifact","AWS IAM Identity Center"],"answer":[0],"why":["Parameter Store は設定値を階層的に保存でき、SecureString で暗号化した値も保管できる。標準パラメータは追加料金なしで使える。","Secrets Manager は自動ローテーションが強みだが、今回は不要で、費用を抑える要件にも合わない。","Artifact はコンプライアンスレポートを入手するサービスで、設定値の保管には使わない。","Identity Center はサインインとアクセス権限の管理サービスで、設定値の保管には使わない。"],"explain":"設定値と暗号化した認証情報をまとめて保管するなら Systems Manager Parameter Store の SecureString を使う。自動ローテーションが必要な場合は Secrets Manager を選ぶ。","point":"Parameter Store は設定値と SecureString の保管、Secrets Manager は自動ローテーションが強み。","diagram":null},{"id":"clf-d2-47","domain":2,"topic":"アクセス管理","type":"single","stem":"ある IAM ユーザーに、Amazon S3 のすべての操作を許可するポリシーと、特定のバケットの削除を明示的に拒否するポリシーの両方がアタッチされています。このユーザーがそのバケットを削除しようとした場合、どうなりますか。","choices":["許可するポリシーが優先され、削除できる。","ポリシーの作成日時が新しいほうが優先される。","削除できるかどうかはリージョンによって決まる。","明示的な拒否が優先され、削除できない。"],"answer":[3],"why":["許可と明示的な拒否が競合した場合、許可が優先されることはない。","ポリシーの作成日時は評価の優先順位に関係しない。","評価の結果はリージョンではなく、適用されるポリシーの内容で決まる。","IAM のポリシー評価では、明示的な拒否（Deny）がほかのすべての許可（Allow）より優先される。"],"explain":"IAM では、既定ではすべてのアクセスが暗黙的に拒否される。許可があればアクセスできるが、明示的な Deny が 1 つでもあれば許可より優先されて拒否される。","point":"IAM のポリシー評価では、明示的な Deny が常に Allow に優先する。","diagram":null},{"id":"clf-d2-48","domain":2,"topic":"アクセス管理","type":"single","stem":"ある企業は、自社のアカウント内の Amazon S3 バケットや IAM ロールなどのうち、外部のアカウントやインターネットに公開されているものを特定したいと考えています。どの AWS の機能を使いますか。","choices":["IAM 認証情報レポート","IAM Access Analyzer","IAM のパスワードポリシー","IAM の最終アクセス日時情報"],"answer":[1],"why":["認証情報レポートは、アカウント内の IAM ユーザーの認証情報の状態を一覧にしたもので、リソースの外部共有は分析しない。","Access Analyzer は、リソースベースのポリシーを分析し、外部のプリンシパルと共有されているリソースを検出して結果として報告する。","パスワードポリシーはパスワードの要件を設定する機能で、リソースの共有状況は分析しない。","最終アクセス日時の情報は、サービスや権限が最後に使われた時期を示すもので、外部共有の検出ではない。"],"explain":"IAM Access Analyzer は、S3 バケット、IAM ロール、KMS キーなどが外部のアカウントや公開に開かれていないかを分析し、検出結果を示す。","point":"外部と共有されているリソースの特定は IAM Access Analyzer。","diagram":null},{"id":"clf-d2-49","domain":2,"topic":"アクセス管理","type":"single","stem":"ある開発者は、ローカル PC の AWS CLI で IAM ユーザーのアクセスキーを使っています。アクセスキーの管理について、推奨される対応はどれですか。","choices":["定期的にローテーションし、使っていないキーは削除する。","キーを共有ドライブに保存してチーム全員で使う。","キーをアプリケーションのソースコードに記載する。","同じキーを何年も変更せず使い続ける。"],"answer":[0],"why":["アクセスキーは定期的に更新し、不要になったものは無効化・削除することで、漏えい時の影響を小さくできる。","共有すると操作者を特定できず、漏えいの危険も高まる。","ソースコードに記載すると、リポジトリへの公開などで漏えいしやすい。","長期間変更しないと、漏えいに気づかないまま悪用される期間が長くなる。"],"explain":"アクセスキーは長期的な認証情報なので、コードに埋め込まない、共有しない、定期的にローテーションする、不要なら削除する、が基本。可能なら一時的な認証情報を使う。","point":"アクセスキーは共有・埋め込みをせず、定期的にローテーションして不要なら削除する。","diagram":null},{"id":"clf-d2-50","domain":2,"topic":"アクセス管理","type":"multi","stem":"ある企業は、AWS アカウントの IAM に関するセキュリティを強化しようとしています。AWS が推奨するベストプラクティスはどれですか。","choices":["IAM ユーザーに MFA を有効にする。","全員に AdministratorAccess ポリシーを付与する。","IAM ユーザー間でパスワードを共有する。","業務に必要な権限だけを付与する。","日常作業のためにルートユーザーのアクセスキーを作成する。"],"answer":[0,3],"why":["MFA を有効にすると、パスワードが漏えいしても不正サインインを防ぎやすくなる。","全員に管理者権限を付与すると、最小権限の原則に反する。","パスワードを共有すると、操作者を特定できなくなる。","最小権限の原則に沿って、必要な権限だけを付与する。","ルートユーザーのアクセスキーは作成を避け、日常作業には使わない。"],"explain":"IAM のベストプラクティスには、MFA の有効化、最小権限の付与、ルートユーザーを使わないこと、認証情報を共有しないこと、一時的な認証情報の利用などがある。","point":"MFA の有効化と最小権限は IAM の基本。共有とルートユーザーの日常利用は避ける。","diagram":null},{"id":"clf-d2-51","domain":2,"topic":"アクセス管理","type":"multi","stem":"ある企業は、AWS のサービスやアプリケーションに権限を渡すために IAM ロールの利用を検討しています。IAM ロールについて正しい説明はどれですか。","choices":["特定の 1 人だけに固定で紐づき、ほかの人は使えない。","ロールを引き受けた主体に、一時的な認証情報が発行される。","AWS のサービスや別アカウントのユーザーが引き受けることができる。","ロールには固有のパスワードとアクセスキーが付く。","ロールを作成できるのはルートユーザーだけである。"],"answer":[1,2],"why":["ロールは特定の個人に紐づかず、許可された主体なら誰でも引き受けられる。","ロールを引き受けると、有効期限のある一時的な認証情報が発行される。","信頼ポリシーで許可した AWS のサービスや別アカウントのユーザーなどが、ロールを引き受けられる。","ロールには固有の長期的な認証情報はなく、引き受けたときに一時的な認証情報が発行される。","権限のある IAM ID であれば、ロールを作成できる。"],"explain":"IAM ロールは、信頼ポリシーで許可された主体が引き受けて使う ID で、一時的な認証情報を発行する。EC2 上のアプリや別アカウントからのアクセスに適している。","point":"IAM ロールは、引き受けた主体に一時的な認証情報を発行する。長期的な認証情報は持たない。","diagram":null},{"id":"clf-d2-52","domain":2,"topic":"アクセス管理","type":"multi","stem":"ある企業は、アプリケーションが使うデータベースの認証情報を、ソースコードに書かずに安全に保管したいと考えています。適切な保管先はどれですか。","choices":["AWS Secrets Manager","Amazon S3 バケットに平文のテキストファイルとして保存する","AWS Systems Manager Parameter Store の SecureString","AMI に認証情報のファイルを含めて配布する","アプリケーションのソースコードに定数として記載する"],"answer":[0,2],"why":["Secrets Manager は認証情報を暗号化して保管し、アプリケーションが API で取得できる。自動ローテーションにも対応する。","平文のファイルでは、バケットの設定ミスや権限の誤りで漏えいしやすい。","Parameter Store の SecureString を使うと、認証情報を暗号化して保管し、アプリケーションが実行時に取得できる。","AMI に含めると、イメージを共有・複製するたびに認証情報が広がり、変更も難しい。","ソースコードに記載すると、リポジトリを通じて漏えいしやすく、変更にも再デプロイが必要になる。"],"explain":"認証情報はコードに書かず、Secrets Manager か Parameter Store の SecureString に暗号化して保管し、実行時に取得する。自動ローテーションが必要なら Secrets Manager を選ぶ。","point":"認証情報は Secrets Manager か Parameter Store の SecureString に保管し、コードに書かない。","diagram":null},{"id":"clf-d2-53","domain":2,"topic":"アクセス管理","type":"multi","stem":"AWS の IAM ポリシーについて正しい説明はどれですか。","choices":["IAM ユーザー、グループ、ロールにアタッチするポリシーを、ID ベースのポリシーという。","IAM グループは、リソースベースのポリシーのプリンシパルとして指定できる。","ポリシーは JSON 形式のドキュメントとして記述する。","AWS 管理ポリシーは、お客様が内容を自由に編集できる。","S3 バケットにアタッチするバケットポリシーは、ID ベースのポリシーである。"],"answer":[0,2],"why":["ID ベースのポリシーは IAM のユーザー、グループ、ロールにアタッチして、その ID に許可する操作を定める。","IAM グループはプリンシパルとして指定できない。ユーザーやロールを指定する。","IAM ポリシーは、Effect、Action、Resource などを持つ JSON ドキュメントである。","AWS 管理ポリシーは AWS が作成・管理するもので、お客様は編集できない。必要なら独自のカスタム管理ポリシーを作る。","バケットポリシーはリソースにアタッチするリソースベースのポリシーである。"],"explain":"IAM ポリシーは JSON で書き、ID にアタッチする ID ベースのポリシーと、リソースにアタッチするリソースベースのポリシーがある。AWS 管理ポリシーは編集できない。","point":"ポリシーは JSON。ID に付けるのは ID ベース、S3 バケットなどに付けるのはリソースベース。","diagram":null},{"id":"clf-d2-54","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、公開しているウェブアプリケーションに対する SQL インジェクションやクロスサイトスクリプティングなどの攻撃を、HTTP リクエストの内容を検査して防ぎたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS WAF","AWS Shield Standard","Amazon GuardDuty","AWS Network Firewall"],"answer":[0],"why":["ウェブ ACL のルールで HTTP(S) リクエストの内容を検査し、SQL インジェクションや XSS などのアプリケーション層（レイヤー 7）の攻撃をブロックできる。","主にネットワーク層とトランスポート層の DDoS 攻撃から自動で保護するサービスで、リクエストの内容を検査するものではない。","ログを分析して脅威を検出するサービスで、攻撃をリアルタイムにブロックするものではない。","VPC のトラフィックを検査するネットワークファイアウォールで、ウェブアプリケーション向けのルールで HTTP リクエストを防ぐ用途とは異なる。"],"explain":"SQL インジェクションや XSS はレイヤー 7 の攻撃で、AWS WAF のルールで防ぐ。Application Load Balancer、Amazon CloudFront、Amazon API Gateway などに関連付けて使う。DDoS の自動保護は AWS Shield、脅威の検出は GuardDuty の役割で、ブロックを行うサービスとは区別する。","point":"SQL インジェクション・XSS などウェブの攻撃を防ぐのは AWS WAF。DDoS は AWS Shield。","diagram":null},{"id":"clf-d2-55","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、大規模な DDoS 攻撃に備えています。攻撃を受けたときに AWS の DDoS 対応チームの支援を受けられ、攻撃によるスケールアウトに伴う費用の急増からも保護される有償のサービスを探しています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Shield Standard","AWS Shield Advanced","AWS WAF","AWS Firewall Manager"],"answer":[1],"why":["すべてのお客様に追加料金なしで自動的に適用される基本の DDoS 保護で、DDoS 対応チームの支援やコスト保護は含まない。","有償の DDoS 保護サービスで、高度な検出と緩和に加え、DDoS 対応チームの支援や、攻撃に伴う費用の急増に対するコスト保護が受けられる。","ウェブの攻撃をルールで防ぐサービスで、DDoS 対応チームの支援を提供するものではない。","複数アカウントのセキュリティルールを一元管理するサービスで、DDoS 対応チームの支援は提供しない。"],"explain":"AWS Shield には Standard と Advanced がある。DDoS 対応チームの支援とコスト保護が決め手になる要件は有償の Advanced。Standard は追加料金なしで自動的に適用される。","point":"DDoS 対応チームの支援とコスト保護は有償の Shield Advanced。Standard は自動・追加料金なし。","diagram":null},{"id":"clf-d2-56","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、AWS Organizations で管理する多数のアカウントに、AWS WAF のルールを一貫して適用したいと考えています。ルールの適用と管理を一元的に行うことができる AWS のサービスはどれですか。","choices":["AWS WAF","AWS Security Hub","AWS Firewall Manager","AWS Shield Standard"],"answer":[2],"why":["ルールを定義して保護対象に適用するサービスで、組織内の複数アカウントへの適用を一元的に管理する機能が中心ではない。","セキュリティの検出結果を集約して可視化するサービスで、WAF ルールを各アカウントに適用して管理するものではない。","組織内の複数のアカウントやリソースに、WAF ルールなどのファイアウォールのポリシーを一元的に設定して適用状況を管理できる。","DDoS 保護を自動で提供する基本のサービスで、ルールの一元管理を行うものではない。"],"explain":"AWS Firewall Manager は、AWS WAF のルール、AWS Shield Advanced の保護、セキュリティグループ、AWS Network Firewall のポリシーなどを、組織全体で一元的に管理する。新しいアカウントやリソースにも自動で適用できる。","point":"複数アカウントのファイアウォールルールの一元管理は AWS Firewall Manager。","diagram":null},{"id":"clf-d2-57","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、VPC 内のワークロードを出入りする通信を検査し、不正な通信を IP アドレス、ポート、プロトコルのルールでフィルタリングしたいと考えています。ステートフルな検査にも対応するマネージドサービスはどれですか。","choices":["AWS WAF","AWS Shield Standard","Amazon Macie","AWS Network Firewall"],"answer":[3],"why":["ウェブアプリケーションの HTTP リクエストを検査するサービスで、VPC 全体の通信をネットワークレベルでフィルタリングするものではない。","DDoS 攻撃から自動で保護するサービスで、お客様がルールを書いて通信を検査するものではない。","S3 内の機密データを検出するサービスで、ネットワーク通信は扱わない。","VPC のネットワークトラフィックを、ステートフルな検査を含むルールで制御できるマネージドのネットワークファイアウォール。"],"explain":"AWS Network Firewall は VPC の境界でネットワークトラフィックを検査・フィルタリングする。HTTP リクエストの内容を見て防ぐのは AWS WAF、DDoS の自動保護は AWS Shield と使い分ける。","point":"VPC のネットワークトラフィックの検査とフィルタリングは AWS Network Firewall。","diagram":null},{"id":"clf-d2-58","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、AWS CloudTrail のイベント、VPC フローログ、DNS ログを継続的に分析し、不審な動作や侵害の可能性がある兆候を自動で検出したいと考えています。エージェントのインストールは避けたい要件です。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Inspector","Amazon GuardDuty","Amazon Macie","AWS Security Hub"],"answer":[1],"why":["EC2 インスタンスやコンテナイメージなどの脆弱性をスキャンするサービスで、ログを分析して脅威を検出するものではない。","CloudTrail、VPC フローログ、DNS ログなどを分析して脅威を検出する。エージェントなしで有効化でき、検出結果は重大度付きで確認できる。","S3 内の機密データを検出するサービスで、アカウントへの不審なアクセスを検出するものではない。","ほかのサービスの検出結果を集約して管理するサービスで、自らログを分析して脅威を検出するものではない。"],"explain":"Amazon GuardDuty はログとイベントを分析して脅威を検出する。有効化するだけで使え、既存のワークロードに手を加える必要がない。脆弱性は Inspector、機密データは Macie、集約は Security Hub と見分ける。","point":"ログ分析による脅威検出は Amazon GuardDuty。脆弱性は Inspector、機密データは Macie。","diagram":null},{"id":"clf-d2-59","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、Amazon EC2 インスタンス、コンテナイメージ、AWS Lambda 関数に含まれるソフトウェアの脆弱性を、自動的かつ継続的にスキャンしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon GuardDuty","Amazon Macie","Amazon Inspector","AWS Config"],"answer":[2],"why":["ログを分析して脅威を検出するサービスで、ソフトウェアの脆弱性をスキャンするものではない。","S3 内の機密データを検出するサービスで、ワークロードの脆弱性は対象としない。","EC2、Amazon ECR のコンテナイメージ、Lambda 関数を自動でスキャンし、ソフトウェアの脆弱性や意図しないネットワークの露出を検出する。","リソースの設定変更を記録して評価するサービスで、脆弱性のスキャンは行わない。"],"explain":"Amazon Inspector は、対象のワークロードを自動的に検出して継続的にスキャンし、脆弱性を重要度付きで報告する。脅威検出の GuardDuty や、設定の記録と評価を行う AWS Config とは目的が異なる。","point":"EC2・コンテナイメージ・Lambda の脆弱性の自動スキャンは Amazon Inspector。","diagram":null},{"id":"clf-d2-60","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、Amazon S3 に保存している大量のファイルに、氏名やクレジットカード番号などの個人情報が含まれていないかを自動で検出したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Macie","Amazon Inspector","Amazon GuardDuty","AWS KMS"],"answer":[0],"why":["機械学習とパターンマッチングを使って S3 内の機密データを検出し、検出結果を報告する。S3 バケットのセキュリティ状況も評価できる。","ワークロードのソフトウェアの脆弱性をスキャンするサービスで、データの内容を調べるものではない。","ログを分析して脅威を検出するサービスで、S3 内のデータの中身は調べない。","暗号化キーを管理するサービスで、データに個人情報が含まれるかを検出するものではない。"],"explain":"Amazon Macie は S3 内の機密データ（個人情報など）を検出する。データの中身を調べる点が決め手で、脅威検出の GuardDuty や脆弱性スキャンの Inspector とは対象が異なる。","point":"S3 内の機密データ（個人情報）の検出は Amazon Macie。","diagram":null},{"id":"clf-d2-61","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、複数のセキュリティサービスの検出結果を 1 か所に集約して確認し、さらにセキュリティのベストプラクティスの標準に照らして自動でチェックしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon GuardDuty","Amazon Detective","AWS Config","AWS Security Hub"],"answer":[3],"why":["脅威を検出するサービスで、ほかのサービスの検出結果を集約して管理する役割ではない。","検出された問題の根本原因を調査するためにデータを可視化するサービスで、検出結果の集約と標準のチェックが主目的ではない。","リソースの設定を記録して評価するサービスで、複数サービスの検出結果の集約を行うものではない。","GuardDuty、Inspector、Macie などの検出結果を集約し、ベストプラクティスの標準に対する自動チェックも行って、セキュリティ状況を一元的に把握できる。"],"explain":"AWS Security Hub は、複数のサービスやパートナー製品の検出結果を集約し、セキュリティ標準に対する自動チェックも行う。個々の脅威の検出は GuardDuty などが担い、Security Hub はその結果をまとめて見るための窓口になる。","point":"検出結果の集約とセキュリティ標準の自動チェックは AWS Security Hub。","diagram":null},{"id":"clf-d2-62","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業のセキュリティチームは、Amazon GuardDuty が検出した不審なアクティビティについて、関連するログを横断的に分析し、根本原因と影響範囲を調べたいと考えています。この調査に使用できる AWS のサービスはどれですか。","choices":["AWS Security Hub","Amazon Detective","Amazon Inspector","Amazon Macie"],"answer":[1],"why":["検出結果を集約するサービスで、関連ログを分析して根本原因を調べるものではない。","CloudTrail や VPC フローログなどのデータを自動で収集して関連付け、セキュリティの問題の根本原因や影響範囲の調査を支援する。","ワークロードの脆弱性をスキャンするサービスで、検出済みの事象の調査は行わない。","S3 内の機密データを検出するサービスで、不審なアクティビティの根本原因の調査には使わない。"],"explain":"Amazon Detective は、ログデータを関連付けたグラフで可視化し、検出された事象の調査を助ける。検出は GuardDuty、集約は Security Hub、調査と根本原因の分析は Detective という流れで覚える。","point":"検出後の調査と根本原因の分析は Amazon Detective。","diagram":null},{"id":"clf-d2-63","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、アプリケーションのデータを暗号化するためのキーを作成して管理したいと考えています。専用のハードウェアを自分で管理せず、多くの AWS サービスと統合して使えるマネージドサービスを求めています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS CloudHSM","AWS Certificate Manager","AWS KMS","AWS Secrets Manager"],"answer":[2],"why":["お客様専用のハードウェアセキュリティモジュールを利用するサービスで、HSM のユーザー管理などをお客様が担う。","SSL/TLS 証明書を発行・管理するサービスで、データの暗号化キーを管理するものではない。","暗号化キーを作成・管理するマネージドサービスで、多くの AWS サービスと統合され、キーの使用は AWS CloudTrail で記録される。","データベースの認証情報などのシークレットを保管するサービスで、データの暗号化キーを管理するものではない。"],"explain":"AWS KMS は暗号化キーの作成・管理を行うマネージドサービスで、Amazon S3、Amazon EBS、Amazon RDS などの暗号化と統合されている。専用ハードウェアをお客様が管理したい場合は AWS CloudHSM を選ぶ。","point":"暗号化キーの作成と管理（マネージド）は AWS KMS。専用 HSM が必要なときは CloudHSM。","diagram":null},{"id":"clf-d2-64","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、規制上の要件により、お客様専用（シングルテナント）のハードウェアセキュリティモジュール（HSM）で暗号化キーを生成し、キーの管理をお客様自身が排他的に制御する必要があります。この要件を満たす AWS のサービスはどれですか。","choices":["AWS CloudHSM","AWS KMS","AWS Certificate Manager","Amazon Macie"],"answer":[0],"why":["AWS クラウド内でお客様専用の HSM を利用でき、キーはお客様だけが管理できる。","AWS が管理するマネージドサービスで、複数のお客様が基盤を共有する。専用の HSM をお客様が排他的に制御する要件には当てはまらない。","SSL/TLS 証明書を発行・管理するサービスで、HSM は提供しない。","S3 内の機密データを検出するサービスで、暗号化キーの管理は行わない。"],"explain":"AWS CloudHSM は、お客様専用の HSM をクラウド内で利用するサービス。シングルテナントで、キーの管理をお客様が制御できる点が決め手になる。運用負荷を抑えたいときは AWS KMS。","point":"お客様専用（シングルテナント）の HSM で、キーを排他的に管理するなら AWS CloudHSM。","diagram":null},{"id":"clf-d2-65","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、ウェブサイトの HTTPS 通信に使う SSL/TLS 証明書を発行し、Application Load Balancer に関連付けたいと考えています。証明書の更新も自動化したい要件です。この要件を満たす AWS のサービスはどれですか。","choices":["AWS KMS","AWS Secrets Manager","AWS WAF","AWS Certificate Manager"],"answer":[3],"why":["暗号化キーを管理するサービスで、ウェブサイト用の SSL/TLS 証明書を発行するものではない。","認証情報などのシークレットを保管するサービスで、証明書の発行と更新を行うものではない。","ウェブの攻撃をルールで防ぐサービスで、証明書は扱わない。","SSL/TLS 証明書のプロビジョニング、管理、デプロイを行い、ACM が発行したパブリック証明書は自動で更新される。ALB や CloudFront と統合されている。"],"explain":"AWS Certificate Manager（ACM）は、SSL/TLS 証明書の発行と管理を簡素化し、ACM の証明書は更新も自動化できる。暗号化キーの管理は AWS KMS で、役割が異なる。","point":"SSL/TLS 証明書の発行と自動更新は AWS Certificate Manager。","diagram":null},{"id":"clf-d2-66","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、ルートユーザーの MFA が有効でないことや、S3 バケットがパブリックアクセスを許可していることなど、セキュリティ上の推奨事項を、アカウントのチェック結果として確認したいと考えています。この要件を満たす AWS のサービスまたは機能はどれですか。","choices":["AWS Artifact","AWS Trusted Advisor","AWS Health Dashboard","Amazon Inspector"],"answer":[1],"why":["AWS のコンプライアンスレポートや契約をダウンロードするサービスで、アカウントの設定をチェックするものではない。","アカウントの設定をベストプラクティスと照らしてチェックし、セキュリティを含む推奨事項を提示する。ルートユーザーの MFA や S3 の公開設定のチェックが含まれる。","AWS のサービスの状態や、アカウントに影響するイベントを通知するもので、セキュリティ設定のチェックは行わない。","EC2 などのソフトウェアの脆弱性をスキャンするサービスで、アカウントの設定のチェックは目的ではない。"],"explain":"AWS Trusted Advisor は、コスト最適化、パフォーマンス、セキュリティ、耐障害性、サービスクォータ、運用上の優秀性の観点でベストプラクティスのチェックを行う。セキュリティのチェックには、ルートユーザーの MFA や S3 バケットのアクセス許可などが含まれる。","point":"アカウントの設定のセキュリティチェックと推奨事項の確認は AWS Trusted Advisor。","diagram":null},{"id":"clf-d2-67","domain":2,"topic":"セキュリティサービス","type":"single","stem":"ある企業は、自社で使い慣れたサードパーティ製のファイアウォールやウイルス対策のソフトウェアを AWS 上で利用したいと考えています。これらの製品を探して購入し、AWS の請求にまとめることができるサービスはどれですか。","choices":["AWS Service Catalog","AWS Artifact","AWS Marketplace","AWS Professional Services"],"answer":[2],"why":["組織が承認した製品の構成をカタログとして管理して配布するサービスで、サードパーティ製品を購入するための場所ではない。","コンプライアンスレポートを入手するサービスで、ソフトウェアの購入はできない。","独立系ソフトウェアベンダーの製品を検索・購入・デプロイでき、料金は AWS の請求にまとめられる。セキュリティ製品も多数掲載されている。","AWS の専門家チームによる支援サービスで、ソフトウェアを購入する場所ではない。"],"explain":"AWS Marketplace は、サードパーティのソフトウェアやサービスを検索して購入できるデジタルカタログで、セキュリティ製品も含まれる。購入した製品の料金は AWS の請求にまとめられる。","point":"サードパーティのセキュリティ製品を購入して AWS 請求にまとめるなら AWS Marketplace。","diagram":null},{"id":"clf-d2-68","domain":2,"topic":"セキュリティサービス","type":"single","stem":"AWS を利用するすべてのお客様が、追加の契約や料金なしに、一般的なネットワーク層とトランスポート層の DDoS 攻撃から自動的に保護されます。この保護を提供する AWS のサービスはどれですか。","choices":["AWS Shield Standard","AWS WAF","AWS Network Firewall","Amazon Inspector"],"answer":[0],"why":["すべてのお客様に追加料金なしで自動的に適用され、SYN フラッドや UDP リフレクションなど一般的なレイヤー 3 と 4 の DDoS 攻撃から保護する。","ルールの作成が必要なサービスで、使用したルールやリクエストに応じて料金が発生する。自動で全お客様に適用されるものではない。","お客様が VPC に配置してルールを設定するサービスで、利用に料金がかかる。","ワークロードの脆弱性をスキャンするサービスで、DDoS 攻撃からの保護は行わない。"],"explain":"AWS Shield Standard は、すべてのお客様に追加料金なしで自動的に提供される。より高度な保護と対応チームの支援が必要な場合は有償の Shield Advanced を使う。","point":"全お客様に自動・追加料金なしの DDoS 保護は AWS Shield Standard。","diagram":null},{"id":"clf-d2-69","domain":2,"topic":"セキュリティサービス","type":"multi","stem":"ある企業は、データの暗号化に AWS KMS を使用することを検討しています。AWS KMS でできることはどれですか。","choices":["暗号化に使用するキーを作成して管理する。","ウェブサイト用の SSL/TLS 証明書を自動更新する。","キーの使用状況を AWS CloudTrail のログで確認する。","S3 内の個人情報を自動的に検出する。","EC2 インスタンスの脆弱性をスキャンする。"],"answer":[0,2],"why":["KMS の中心的な機能。暗号化キーの作成、管理、アクセス制御ができる。","SSL/TLS 証明書の発行と自動更新は AWS Certificate Manager の役割。","KMS はキーの使用を CloudTrail に記録するため、いつ誰がキーを使ったかを確認できる。","S3 内の個人情報の検出は Amazon Macie の役割。","脆弱性のスキャンは Amazon Inspector の役割。"],"explain":"AWS KMS は暗号化キーの作成と管理を行い、キーの使用は CloudTrail に記録される。証明書は ACM、機密データの検出は Macie、脆弱性のスキャンは Inspector と、サービスごとの役割を区別する。","point":"KMS は暗号化キーの作成・管理と、CloudTrail によるキー使用の記録。証明書は ACM。","diagram":null},{"id":"clf-d2-70","domain":2,"topic":"セキュリティサービス","type":"multi","stem":"ウェブアプリケーションを DDoS 攻撃から保護するために使用できる AWS のサービスはどれですか。","choices":["Amazon Macie","AWS Shield Advanced","AWS KMS","AWS WAF","Amazon Detective"],"answer":[1,3],"why":["S3 内の機密データを検出するサービスで、DDoS 攻撃への対策にはならない。","大規模な DDoS 攻撃に対する高度な検出と緩和を提供する有償のサービス。","暗号化キーを管理するサービスで、DDoS 攻撃への対策にはならない。","レート制限などのルールを設定して、アプリケーション層への大量のリクエストをブロックできる。","セキュリティ事象の調査を支援するサービスで、攻撃の緩和は行わない。"],"explain":"DDoS 対策には、ネットワーク層とトランスポート層を中心に保護する AWS Shield と、レート制限ルールなどでアプリケーション層の大量リクエストを防ぐ AWS WAF を組み合わせる。Macie、KMS、Detective は DDoS の緩和を行わない。","point":"DDoS 対策は AWS Shield（ネットワーク層）と AWS WAF のレート制限（アプリケーション層）の組み合わせ。","diagram":null},{"id":"clf-d2-71","domain":2,"topic":"セキュリティサービス","type":"multi","stem":"ある企業は、アカウントへの不審な動作などの脅威を検出するとともに、EC2 インスタンスなどのソフトウェアの脆弱性を自動でスキャンしたいと考えています。この両方の要件を満たすために組み合わせて使用できる AWS のサービスはどれですか。","choices":["Amazon GuardDuty","Amazon Macie","AWS Firewall Manager","Amazon Inspector","AWS Network Firewall"],"answer":[0,3],"why":["ログを分析して脅威や不審な動作を検出する。","S3 内の機密データを検出するサービスで、脅威の検出や脆弱性のスキャンは行わない。","ファイアウォールのルールを組織全体で管理するサービスで、検出やスキャンは行わない。","EC2、コンテナイメージ、Lambda 関数のソフトウェアの脆弱性を自動でスキャンする。","ネットワークトラフィックをフィルタリングするサービスで、脅威の検出や脆弱性のスキャンは目的ではない。"],"explain":"脅威の検出は Amazon GuardDuty、脆弱性の自動スキャンは Amazon Inspector が担う。2 つは目的が異なるため、両方の要件があるときは組み合わせて使う。","point":"脅威検出は GuardDuty、脆弱性スキャンは Inspector。目的が違うので併用できる。","diagram":null},{"id":"clf-d3-01","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある開発者は、ローカル PC に AWS CLI をインストールしたり認証情報を設定したりせずに、マネジメントコンソールにサインインしたブラウザ上で AWS CLI コマンドを実行したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS CloudFormation","AWS Systems Manager Session Manager","AWS CloudShell","AWS Cloud Development Kit (AWS CDK)"],"answer":[2],"why":["テンプレートに基づいてリソースをプロビジョニングする IaC のサービス。コマンドを対話的に実行するシェル環境ではない。","EC2 インスタンスなどのマネージドノードにシェルでアクセスするための機能。ブラウザから AWS CLI を使う環境を提供するものではない。","マネジメントコンソールからブラウザ上で起動できるシェル。コンソールにサインインしたユーザーの認証情報で AWS CLI が使え、事前にツールがインストールされている。","プログラミング言語でインフラを定義するためのフレームワーク。コマンドを実行するブラウザ上のシェルではない。"],"explain":"「ローカルにインストール不要」「ブラウザ上で」「コンソールの認証情報のまま」という言葉から AWS CloudShell を選ぶ。CloudShell はコンソールから起動でき、AWS CLI などのツールが利用可能な状態で提供される。CloudFormation や CDK はインフラを定義・作成するためのもので、シェル環境ではない。","point":"ブラウザからすぐ AWS CLI を使いたいなら AWS CloudShell。ローカル環境の構築は不要。","diagram":null},{"id":"clf-d3-02","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある企業は、開発・ステージング・本番の 3 つの環境に、同じ構成のインフラストラクチャを繰り返し作成したいと考えています。構成をテンプレートとしてコードで定義し、一貫した方法で作成できる AWS のサービスはどれですか。","choices":["AWS CloudFormation","AWS Config","AWS Trusted Advisor","AWS CloudShell"],"answer":[0],"why":["JSON または YAML のテンプレートでリソースを定義し、スタックとして作成・更新・削除できる IaC のサービス。同じテンプレートから同一の環境を繰り返し作れる。","リソースの構成変更を記録し、ルールに照らして評価するサービス。環境を作成する機能ではない。","コスト最適化・セキュリティなどの観点でベストプラクティスに沿った推奨事項を示すサービス。リソースの作成には使わない。","ブラウザ上で AWS CLI を使えるシェル環境。手作業でコマンドを実行する場になり、構成をテンプレートで管理する仕組みではない。"],"explain":"「同じ構成を繰り返し」「テンプレートでコード化」は IaC の典型で、AWS CloudFormation が該当する。手作業と違い、環境ごとの設定のずれや作り間違いを防げる。Config は構成の記録と評価、Trusted Advisor は推奨事項の提示で、環境の作成とは役割が異なる。","point":"同じ環境を繰り返し作るなら IaC。AWS ネイティブのテンプレートは CloudFormation。","diagram":null},{"id":"clf-d3-03","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある開発チームは Python に習熟しており、AWS のインフラストラクチャを、使い慣れたプログラミング言語で定義して CloudFormation 経由でプロビジョニングしたいと考えています。この要件を満たすものはどれですか。","choices":["AWS Command Line Interface (AWS CLI)","AWS マネジメントコンソール","AWS Systems Manager","AWS Cloud Development Kit (AWS CDK)"],"answer":[3],"why":["コマンドで AWS のサービスを操作するツール。インフラをプログラミング言語のコードとして定義し、スタックとして管理する仕組みではない。","ブラウザ上の GUI でリソースを操作する方法。手作業になり、コードによる繰り返しの再現には向かない。","マネージドノードの運用管理（パッチ適用やコマンド実行など）を行うサービス群。インフラを言語で定義する用途ではない。","Python、TypeScript、Java などのプログラミング言語でインフラを定義できるフレームワーク。定義は CloudFormation テンプレートに変換されてデプロイされる。"],"explain":"「使い慣れたプログラミング言語」「CloudFormation 経由」が決め手で、AWS CDK を選ぶ。CDK ではループや条件分岐など言語の機能を使ってインフラを記述でき、最終的に CloudFormation のスタックとして作られる。テンプレートを直接書く CloudFormation と、言語で書く CDK の違いを押さえる。","point":"IaC をプログラミング言語で書きたいなら AWS CDK。裏側では CloudFormation が動く。","diagram":null},{"id":"clf-d3-04","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある企業は、規制上の理由で一部のデータをオンプレミスに残しつつ、それ以外のワークロードを AWS で実行し、両者を接続して一体で運用したいと考えています。この構成に当てはまるデプロイモデルはどれですか。","choices":["クラウドベースのデプロイ","ハイブリッドデプロイ","オンプレミスのデプロイ","マルチクラウドのデプロイ"],"answer":[1],"why":["すべてのアプリケーションをクラウドで実行するモデル。オンプレミスにデータを残す構成は含まない。","クラウドとオンプレミスのリソースを接続して一体で運用するモデル。一部を社内に残したまま、段階的な移行や規制対応ができる。","すべてを自社施設で運用するモデル。AWS のクラウドを使っていない。","複数のクラウドプロバイダーを使い分けるモデル。問われているのはクラウドとオンプレミスの組み合わせ。"],"explain":"クラウドとオンプレミスを接続して使う形がハイブリッドデプロイ。規制やレイテンシーなどの理由で一部を社内に残す場合や、段階的に移行する場合に使われる。接続には Site-to-Site VPN や Direct Connect を利用できる。","point":"クラウドとオンプレミスの併用はハイブリッド。すべてクラウドならクラウドベース、すべて社内ならオンプレミス。","diagram":null},{"id":"clf-d3-05","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある企業は、オンプレミスのデータセンターと AWS 上の VPC を、すぐに利用開始できる、インターネット経由の暗号化された接続でつなぎたいと考えています。専用線の手配を待つ余裕はありません。この要件を満たすサービスはどれですか。","choices":["AWS Direct Connect","AWS Site-to-Site VPN","Amazon CloudFront","AWS Global Accelerator"],"answer":[1],"why":["お客様の拠点と AWS を専用線で接続するサービス。インターネットを経由せず安定するが、回線の手配に時間がかかる。","インターネット経由の IPsec で暗号化された接続を作るサービス。専用線の手配が不要で、短時間で利用を開始できる。","コンテンツを世界中のエッジロケーションから配信する CDN。拠点と VPC をつなぐサービスではない。","インターネット上のユーザーからアプリケーションまでの通信を AWS のグローバルネットワーク経由にするサービス。拠点間接続用ではない。"],"explain":"「すぐに」「インターネット経由」「暗号化」から Site-to-Site VPN を選ぶ。専用線の Direct Connect は帯域や品質が安定する反面、回線の準備に時間がかかる。接続方法は、すぐ使えて暗号化が必要なら VPN、安定した専用線が必要なら Direct Connect と選び分ける。","point":"すぐ使えるインターネット経由の暗号化接続は Site-to-Site VPN。専用線で安定させたいなら Direct Connect。","diagram":null},{"id":"clf-d3-06","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある企業は、オンプレミスと AWS の間で大量のデータを継続的にやり取りします。インターネット回線を経由せず、安定したネットワーク性能が得られる接続方法を選びたいと考えています。最も適切なものはどれですか。","choices":["AWS Site-to-Site VPN","AWS Client VPN","Amazon CloudFront","AWS Direct Connect"],"answer":[3],"why":["インターネット経由の暗号化接続を作るサービス。経路がインターネットのため、帯域や遅延が変動しうる。","個々のユーザーの端末から AWS やオンプレミスのリソースへ安全にアクセスするためのクライアント VPN。拠点間の大量転送向けではない。","コンテンツを配信する CDN。オンプレミスと AWS を接続するサービスではない。","お客様の拠点と AWS を専用のネットワーク接続でつなぐサービス。インターネットを経由せず、帯域と遅延が安定する。"],"explain":"「インターネットを経由しない」「安定したネットワーク性能」「大量のデータ」から Direct Connect を選ぶ。VPN はインターネット回線を使うので、品質が回線状況に左右される。接続方法の選び方は、暗号化してすぐ使いたいなら VPN、安定した専用線なら Direct Connect。","point":"インターネットを経由しない安定した専用接続は AWS Direct Connect。VPN はインターネット経由。","diagram":null},{"id":"clf-d3-07","domain":3,"topic":"デプロイと運用","type":"single","stem":"運用チームは、Amazon EC2 インスタンスへの SSH 用ポートを開放せず、踏み台サーバーも使わずに、ブラウザまたは AWS CLI からインスタンスのシェルにアクセスしたいと考えています。この要件を満たす機能はどれですか。","choices":["AWS Systems Manager Session Manager","AWS Systems Manager Run Command","AWS Systems Manager Patch Manager","AWS Systems Manager Parameter Store"],"answer":[0],"why":["マネージドノードにシェルで対話的にアクセスできる機能。受信ポートの開放や踏み台サーバーが不要で、セッションのログも残せる。","複数のインスタンスにコマンドをまとめて実行する機能。対話的なシェルのセッションを開く機能ではない。","OS やアプリケーションのパッチ適用を自動化する機能。シェルアクセスの手段ではない。","設定値や認証情報を階層的に保管する機能。インスタンスへ接続する機能ではない。"],"explain":"「SSH ポートを開放しない」「踏み台不要」「シェルにアクセス」は Session Manager の特徴。Systems Manager には用途の異なる機能があり、対話的なアクセスは Session Manager、一括でのコマンド実行は Run Command、パッチ適用は Patch Manager、設定値の保管は Parameter Store が担当する。","point":"SSH ポート不要でシェルに入るなら Session Manager。一括実行は Run Command、パッチは Patch Manager。","diagram":null},{"id":"clf-d3-08","domain":3,"topic":"デプロイと運用","type":"multi","stem":"運用チームは、多数の Amazon EC2 インスタンスについて、OS のパッチ適用の自動化と、同じコマンドの一括実行を、サーバーごとにログインせずに行いたいと考えています。この要件を満たす AWS Systems Manager の機能の組み合わせはどれですか。","choices":["AWS Systems Manager Session Manager","AWS Systems Manager Patch Manager","AWS Systems Manager Parameter Store","AWS Systems Manager Run Command","AWS Trusted Advisor"],"answer":[1,3],"why":["マネージドノードに対話的なシェルでアクセスする機能。1 台ずつ接続する使い方になり、一括での自動化には向かない。","パッチのベースラインに基づいて、マネージドノードへのパッチ適用を自動化する機能。メンテナンスウィンドウと組み合わせて計画的に実行できる。","設定値や認証情報を保管する機能。パッチ適用やコマンド実行は行わない。","指定した複数のマネージドノードに、ログインせずにコマンドやスクリプトをまとめて実行する機能。","ベストプラクティスに沿った推奨事項を示すサービス。インスタンスの運用作業を実行するものではない。"],"explain":"パッチ適用の自動化は Patch Manager、同じコマンドを複数台へ一括実行するのは Run Command が担当する。どちらも各サーバーにログインせずに実行できる。Session Manager は対話的なアクセス用、Parameter Store は設定値の保管用で、役割が異なる。","point":"パッチ適用は Patch Manager、一括実行は Run Command。いずれも Systems Manager の機能。","diagram":null},{"id":"clf-d3-09","domain":3,"topic":"デプロイと運用","type":"single","stem":"ある開発者は、自社で開発しているアプリケーションのプログラムの中から、Amazon S3 へのオブジェクトのアップロードなど AWS のサービスを呼び出したいと考えています。この目的で使用するものはどれですか。","choices":["AWS マネジメントコンソール","AWS CloudFormation","AWS SDK","AWS CloudShell"],"answer":[2],"why":["ブラウザ上の GUI で手動操作するための画面。アプリケーションのコードに組み込むことはできない。","テンプレートでインフラを作成するサービス。アプリケーションの実行中に S3 を操作する用途ではない。","各種プログラミング言語から AWS の API を呼び出すためのライブラリ。アプリケーションのコードに組み込んで AWS のサービスを利用できる。","ブラウザ上で AWS CLI を使えるシェル環境。手作業のコマンド実行用で、アプリケーションに組み込むものではない。"],"explain":"「アプリケーションのプログラムの中から」AWS を呼び出すには、AWS SDK を使う。SDK は Java、Python、JavaScript などの言語向けに提供されている。手動操作ならマネジメントコンソールや CLI、コードによる環境作成なら CloudFormation と、操作の主体と目的で使い分ける。","point":"アプリケーションのコードから AWS を呼ぶのは SDK。人が手で操作するならコンソールか CLI。","diagram":null},{"id":"clf-d3-10","domain":3,"topic":"デプロイと運用","type":"multi","stem":"ある企業は、手作業で行っていた環境構築を AWS CloudFormation によるコード化に切り替えようとしています。インフラストラクチャをコードで管理する利点はどれですか。","choices":["テンプレートで作成したリソースの利用料金が割引される。","テンプレートをバージョン管理し、変更履歴を追跡できる。","リージョン間のネットワーク遅延が小さくなる。","AWS がゲスト OS のパッチ適用を自動で行う。","同じ構成の環境を、繰り返し一貫して作成できる。"],"answer":[1,4],"why":["CloudFormation 自体は無料で、作成したリソースには通常の料金がかかる。テンプレート化による割引はない。","テンプレートはテキストファイルなので、Git などで管理して変更履歴を追跡し、レビューも行える。","ネットワーク遅延はリージョン間の物理的な距離などで決まり、IaC とは関係がない。","EC2 のゲスト OS のパッチ適用はお客様の責任。IaC を使っても AWS が代行することはない。","同じテンプレートから同一の環境を作れるため、手作業による設定ミスや環境ごとの差異を防げる。"],"explain":"IaC の利点は、再現性と変更管理にある。同じテンプレートで同じ環境を何度でも作れ、テンプレートをバージョン管理すれば変更の経緯も追える。料金の割引やネットワーク性能の向上、責任共有モデル上の責任範囲の変更は IaC の効果ではない。","point":"IaC の利点は、環境の再現性とテンプレートの変更履歴管理。料金や性能が変わるわけではない。","diagram":null},{"id":"clf-d3-11","domain":3,"topic":"グローバルインフラ","type":"single","stem":"AWS のグローバルインフラストラクチャに関する説明のうち、アベイラビリティーゾーン（AZ）について正しいものはどれですか。","choices":["コンテンツをキャッシュするために世界中に置かれた拠点である。","お客様の施設に設置される AWS のラック製品である。","複数のリージョンをまとめた論理的な単位である。","独立した電源とネットワークを備えた 1 つ以上のデータセンターである。"],"answer":[3],"why":["これはエッジロケーションの説明。CloudFront などがコンテンツのキャッシュに利用する。","これは AWS Outposts の説明。AZ は AWS が運用するリージョン内の施設。","AZ はリージョンの中にある。リージョンは複数の AZ で構成され、その逆ではない。","AZ は、リージョン内で他の AZ と物理的に離れた、独立した電源・冷却・ネットワークを備える 1 つ以上のデータセンターで構成される。"],"explain":"AWS のリージョンは複数の AZ で構成され、AZ は 1 つ以上のデータセンターからなる。AZ どうしは障害の影響が及ばないよう独立していて、低レイテンシーのネットワークで接続されている。エッジロケーションや Outposts と取り違えないようにする。","point":"AZ は独立した 1 つ以上のデータセンター。リージョンは複数の AZ で構成される。","diagram":null},{"id":"clf-d3-12","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある企業は、法令により顧客データを日本国内に保存する必要があります。この要件を満たすために、AWS のグローバルインフラストラクチャについて取るべき対応はどれですか。","choices":["データを保存するリージョンとして、東京リージョンを選択する。","データの保存先は AWS が最寄りのリージョンに自動で選ぶため、何もしない。","データをエッジロケーションに保存する。","データを複数の海外リージョンに複製して冗長化する。"],"answer":[0],"why":["データは、お客様が選択したリージョンに保存される。AWS はお客様の指示なしにデータをリージョン外へ移動しないため、国内のリージョンを選べばよい。","保存先のリージョンはお客様が選ぶ。AWS が自動で最寄りのリージョンを選ぶ仕組みはない。","エッジロケーションはコンテンツのキャッシュや DNS 応答のための拠点。データの保存先として選ぶものではなく、国内への保存の要件も満たせない。","海外のリージョンへ複製すると、データが国外に置かれ、要件に反する。"],"explain":"データ主権やコンプライアンスの要件は、リージョンの選択で満たす。リージョンは地理的に独立していて、お客様が他のリージョンへ複製や移動をしない限り、データはそのリージョンにとどまる。要件に合うリージョンを選び、不要なレプリケーションを設定しないことが重要。","point":"データの所在地の要件はリージョンの選択で満たす。データは選択したリージョンにとどまる。","diagram":null},{"id":"clf-d3-13","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある企業は、1 つの AZ だけで Amazon EC2 インスタンスを実行しているため、AZ 全体の障害でサービスが停止することを懸念しています。可用性を高めるために取るべき方法はどれですか。","choices":["同じ AZ 内でインスタンスの台数を増やす。","インスタンスをより大きなインスタンスタイプに変更する。","複数の AZ にインスタンスを分散して配置する。","インスタンスをエッジロケーションに移動する。"],"answer":[2],"why":["台数が増えても、同じ AZ にある限り AZ 全体の障害で同時に停止する。","性能は上がるが、AZ の障害には影響を受けたままで、可用性は高まらない。","AZ は互いに独立しているため、複数の AZ に分散すれば 1 つの AZ が停止しても、残りの AZ でサービスを継続できる。","エッジロケーションは EC2 インスタンスを実行する場所ではない。コンテンツのキャッシュなどに使われる。"],"explain":"AZ 障害への備えは、複数の AZ にリソースを分散する。Elastic Load Balancing で複数の AZ のインスタンスにトラフィックを振り分ければ、一方の AZ が停止してもサービスを継続できる。台数やインスタンスサイズを変えても、AZ 障害への耐性は変わらない。","point":"AZ 障害に備えるには複数 AZ に分散する。同じ AZ 内の増強では高可用性にならない。","diagram":{"caption":"正解の構成: 2 つの AZ にインスタンスを分散して配置する","cols":2,"rows":2,"groups":[{"label":"AWS リージョン","kind":"region","c":0,"r":0,"w":2,"h":2},{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":1}],"nodes":[{"id":"elb","label":"ロードバランサー","sub":"複数 AZ に振り分け","kind":"network","c":0,"r":0},{"id":"ec2a","label":"EC2","sub":"AZ-a のインスタンス","kind":"compute","c":1,"r":0},{"id":"ec2b","label":"EC2","sub":"AZ-b のインスタンス","kind":"compute","c":1,"r":1}],"edges":[{"from":"elb","to":"ec2a"},{"from":"elb","to":"ec2b"}]}},{"id":"clf-d3-14","domain":3,"topic":"グローバルインフラ","type":"single","stem":"Amazon CloudFront が、静的コンテンツをキャッシュして世界中のユーザーの近くから配信するために利用する、AWS のグローバルインフラストラクチャの要素はどれですか。","choices":["AWS Outposts","エッジロケーション","アベイラビリティーゾーン","AWS Local Zones"],"answer":[1],"why":["AWS のインフラとサービスをお客様のオンプレミスの施設で利用するためのサービス。コンテンツ配信用の拠点ではない。","世界中の都市に分散して配置された拠点。CloudFront がコンテンツをキャッシュしてユーザーの近くから配信し、Route 53 の DNS 応答にも使われる。","リージョン内の独立したデータセンター。キャッシュ配信のためにユーザーの近くへ分散された拠点ではない。","特定の大都市圏の近くで EC2 などの一部のサービスを実行するための拠点。コンテンツをキャッシュする仕組みではない。"],"explain":"CloudFront のコンテンツ配信や Route 53 の DNS 応答に使われる世界中の拠点がエッジロケーション。ユーザーに近い場所から応答することで、レイテンシーを小さくできる。リージョンや AZ は、アプリケーションやデータを実行・保管するための場所と区別する。","point":"CloudFront や Route 53 が使う、ユーザーに近い世界中の拠点がエッジロケーション。","diagram":null},{"id":"clf-d3-15","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある企業は、特定の大都市圏のエンドユーザーに対して、Amazon EC2 などのコンピューティングを数ミリ秒台のレイテンシーで提供したいと考えています。最寄りのリージョンは遠く、お客様の施設に機器を設置することは求めていません。この要件を満たすものはどれですか。","choices":["AWS Local Zones","AWS Outposts","Amazon CloudFront","AWS Direct Connect"],"answer":[0],"why":["大都市圏などユーザーの近くに、EC2 などの一部のサービスを AWS が運用する拠点として提供する。リージョンのサービスを延長して使え、お客様側の機器は不要。","AWS のインフラをお客様の施設に設置して使うサービス。機器の設置が前提になるため、要件に合わない。","コンテンツをキャッシュして配信する CDN。EC2 のコンピューティングをユーザーの近くで実行するものではない。","拠点と AWS を専用線でつなぐサービス。コンピューティングをユーザーの近くに置くものではない。"],"explain":"「特定の大都市圏」「ユーザーの近くでコンピューティング」「機器の設置は不要」から Local Zones を選ぶ。機器を自社施設に置く場合は Outposts、5G ネットワーク内に置く場合は Wavelength と見分ける。","point":"大都市圏のユーザーの近くで EC2 を動かすなら Local Zones。機器の設置は不要。","diagram":null},{"id":"clf-d3-16","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある企業は、5G 対応のモバイル端末向けアプリケーションを開発しています。端末から極めて低いレイテンシーで応答できるよう、通信事業者の 5G ネットワーク内で AWS のコンピューティングを実行したいと考えています。この要件を満たすものはどれですか。","choices":["AWS Outposts","AWS Local Zones","AWS Wavelength","Amazon CloudFront"],"answer":[2],"why":["AWS のインフラをお客様の施設に設置して使うサービス。通信事業者の 5G ネットワーク内で動かすものではない。","大都市圏の近くで一部の AWS サービスを実行する拠点。通信事業者のネットワーク内に組み込まれるものではない。","AWS のコンピューティングとストレージを通信事業者の 5G ネットワーク内に配置し、モバイル端末との通信を低レイテンシーにするサービス。","コンテンツをキャッシュして配信する CDN。アプリケーションのコンピューティング処理を 5G ネットワーク内で実行するものではない。"],"explain":"「5G」「通信事業者のネットワーク内」が決め手で、AWS Wavelength を選ぶ。トラフィックがインターネットを経由せずに済むため、モバイル端末向けのリアルタイム性が求められるアプリケーションに向く。大都市圏なら Local Zones、自社施設なら Outposts と区別する。","point":"5G ネットワーク内で低レイテンシーを実現するのは AWS Wavelength。","diagram":null},{"id":"clf-d3-17","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある製造企業は、工場内の設備と数ミリ秒で通信する必要があり、データも工場の外に出せません。AWS のインフラストラクチャとサービスを工場の敷地内で利用するには、どのサービスを使用できますか。","choices":["AWS Local Zones","AWS Wavelength","AWS Direct Connect","AWS Outposts"],"answer":[3],"why":["AWS が運用する大都市圏の拠点。お客様の施設の中に AWS のインフラを置くものではない。","通信事業者の 5G ネットワーク内で AWS のサービスを実行する仕組み。工場の敷地内には置かれない。","拠点と AWS を専用線でつなぐサービス。接続はできるが、AWS のインフラを敷地内で動かすものではない。","AWS のインフラ、サービス、API をお客様のオンプレミスの施設で利用できるサービス。低レイテンシーでの処理やデータの国内・敷地内保管が求められる場合に使う。"],"explain":"「工場の敷地内」「データを外に出せない」「設備と数ミリ秒で通信」から、オンプレミスで AWS のインフラを使える AWS Outposts を選ぶ。Outposts は AWS が提供・管理する機器を施設に設置し、リージョンと接続して運用する。","point":"自社の施設内で AWS のインフラとサービスを使うなら AWS Outposts。","diagram":{"caption":"正解の構成: 工場に AWS Outposts を設置してリージョンに接続する","cols":3,"rows":1,"groups":[{"label":"工場（オンプレミス）","kind":"onprem","c":0,"r":0,"w":2,"h":1},{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"machine","label":"工場の設備","sub":"数ミリ秒で通信","kind":"onprem","c":0,"r":0},{"id":"outposts","label":"AWS Outposts","sub":"EC2 などを実行","kind":"compute","c":1,"r":0},{"id":"region","label":"リージョンの管理","sub":"API・コントロール","kind":"management","c":2,"r":0}],"edges":[{"from":"machine","to":"outposts","both":true},{"from":"outposts","to":"region","label":"サービスリンク","both":true}]}},{"id":"clf-d3-18","domain":3,"topic":"グローバルインフラ","type":"multi","stem":"ある企業は、新しいワークロードを展開する AWS リージョンを選択しようとしています。リージョンを選ぶ際に考慮すべき要素はどれですか。","choices":["リージョンごとにサポートプランの契約が別に必要になる。","対象のユーザーに近く、レイテンシーを小さくできる。","リージョンの開設時期が古いほど SLA が高くなる。","データの所在地に関する法令やコンプライアンスの要件を満たせる。","どのリージョンでも料金が同じなので、考慮する必要はない。"],"answer":[1,3],"why":["サポートプランはアカウント単位で契約する。リージョンごとに別契約にはならない。","ユーザーやオンプレミスの拠点に近いリージョンを選ぶと、通信のレイテンシーを小さくできる。","SLA は開設時期ではなくサービスごとに定められる。古いリージョンほど高いという関係はない。","データは選択したリージョンにとどまるため、データ主権や規制の要件に合うリージョンを選ぶ必要がある。","同じサービスでもリージョンによって料金は異なる。料金もリージョンを選ぶ要素の 1 つ。"],"explain":"リージョン選択の主な要素は、データ所在地・コンプライアンス、ユーザーへの近さ（レイテンシー）、料金、利用したいサービスの提供状況の 4 つ。サポートプランや開設時期は選択の基準にならない。","point":"リージョンは、コンプライアンス・レイテンシー・料金・提供サービスで選ぶ。","diagram":null},{"id":"clf-d3-19","domain":3,"topic":"グローバルインフラ","type":"multi","stem":"ある企業は、リージョン全体が利用できなくなる大規模な障害に備えた災害対策を設計しています。この目的に沿った対策はどれですか。","choices":["同じリージョン内の複数の AZ にだけリソースを配置する。","別のリージョンにデータをレプリケーションしておく。","バックアップをエッジロケーションに保存する。","インスタンスをより大きなインスタンスタイプに変更する。","別のリージョンに、復旧用の環境を作成できるようにしておく。"],"answer":[1,4],"why":["複数の AZ は AZ 障害への備えになるが、リージョン全体の障害には耐えられない。","リージョンは互いに独立しているため、別のリージョンにデータを複製しておけば、元のリージョンが使えなくても復旧に使える。","エッジロケーションはコンテンツのキャッシュ用で、バックアップの保存先として使うものではない。","インスタンスサイズは性能の問題で、リージョン障害への備えにはならない。","別のリージョンに復旧用の環境を用意し、または CloudFormation などのテンプレートで再作成できるようにしておけば、リージョン障害時に復旧できる。"],"explain":"リージョン全体の障害に備えるには、複数のリージョンを使う。データを別のリージョンに複製し、復旧先の環境を用意するか、IaC のテンプレートですぐ再作成できるようにしておく。複数 AZ の構成は AZ 障害には有効だが、リージョン障害には効果がない。","point":"リージョン障害への備えは複数リージョン。複数 AZ は AZ 障害への備え。","diagram":null},{"id":"clf-d3-20","domain":3,"topic":"グローバルインフラ","type":"single","stem":"ある企業の担当者は、最近開設された AWS リージョンでリソースを作成しようとしましたが、そのリージョンを選択できませんでした。原因として最も可能性が高いものはどれですか。","choices":["リージョンの利用には別の AWS アカウントが必要である。","そのリージョンがアカウントで有効化（オプトイン）されていない。","リージョンの利用にはサポートプランの変更が必要である。","リージョンの利用にはエッジロケーションの追加が必要である。"],"answer":[1],"why":["リージョンごとにアカウントを分ける必要はない。同じアカウントで複数のリージョンを使える。","比較的新しいリージョンは、既定では無効になっている。アカウントで有効化（オプトイン）すると使えるようになる。","サポートプランはリージョンの利用可否と関係しない。","エッジロケーションはお客様が追加するものではなく、リージョンの利用可否とは関係がない。"],"explain":"一部のリージョンは既定で無効になっていて、利用するにはアカウントでリージョンを有効化（オプトイン）する必要がある。リージョンの選択は、データ所在地やレイテンシー、料金、提供サービスだけでなく、利用可能になっているかも確認する。","point":"新しいリージョンは既定で無効。使うにはアカウントでオプトインして有効化する。","diagram":null},{"id":"clf-d3-21","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、インメモリデータベースを Amazon EC2 上で実行します。大規模なデータセットをメモリ上に保持して高速に処理するため、メモリ容量を重視したインスタンスを選びたいと考えています。最も適したインスタンスファミリーはどれですか。","choices":["汎用インスタンス","コンピューティング最適化インスタンス","メモリ最適化インスタンス","ストレージ最適化インスタンス"],"answer":[2],"why":["CPU・メモリ・ネットワークをバランスよく備えたファミリー。特定のリソースに偏った要件ではなく、幅広い用途に使う。","高性能な CPU を必要とする処理（バッチ処理、メディアのエンコードなど）に向くファミリー。メモリ容量を重視する用途ではない。","大規模なデータセットをメモリ上で処理するワークロード向けのファミリー。インメモリデータベースやリアルタイムのビッグデータ処理に適している。","ローカルストレージへの高い読み書き性能を必要とするワークロード向けのファミリー。メモリ容量が主な要件の場合には選ばない。"],"explain":"「大規模なデータセットをメモリ上に保持」が決め手で、メモリ最適化インスタンスを選ぶ。インスタンスファミリーは、汎用・コンピューティング最適化・メモリ最適化・ストレージ最適化・高速コンピューティングのように、ワークロードで最も重要なリソースに合わせて選ぶ。","point":"メモリ重視ならメモリ最適化、CPU 重視ならコンピューティング最適化、ローカルディスクの I/O 重視ならストレージ最適化。","diagram":null},{"id":"clf-d3-22","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、動画のエンコードや科学技術計算のような、高性能なプロセッサを必要とする計算負荷の高い処理を Amazon EC2 で実行します。この用途に最適化された EC2 インスタンスファミリーはどれですか。","choices":["コンピューティング最適化インスタンス","メモリ最適化インスタンス","ストレージ最適化インスタンス","汎用インスタンス"],"answer":[0],"why":["高性能なプロセッサを備え、バッチ処理、メディアのエンコード、科学モデリングなど、計算負荷の高い処理に向くファミリー。","大規模なデータセットをメモリ上で処理する用途のファミリー。計算性能が主な要件の場合には最適ではない。","ローカルストレージへの順次読み書きやランダム I/O が多い用途のファミリー。計算処理が中心の用途には向かない。","CPU とメモリのバランスを取ったファミリー。特に計算性能を重視する用途では、専用のファミリーのほうが適している。"],"explain":"「高性能なプロセッサ」「計算負荷の高い処理」という言葉から、コンピューティング最適化インスタンスを選ぶ。汎用インスタンスでも動かせるが、問われているのは計算処理に最適化されたファミリーである。","point":"計算負荷の高いバッチ処理やエンコードは、コンピューティング最適化インスタンス。","diagram":null},{"id":"clf-d3-23","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、機械学習モデルのトレーニングを Amazon EC2 で実行します。GPU による並列処理で処理時間を短縮したいと考えています。この要件に適した EC2 インスタンスファミリーはどれですか。","choices":["メモリ最適化インスタンス","ストレージ最適化インスタンス","コンピューティング最適化インスタンス","高速コンピューティングインスタンス"],"answer":[3],"why":["メモリ容量が大きいファミリー。インメモリデータベースなどに向き、GPU による並列処理を目的としたものではない。","ローカルストレージの I/O 性能に特化したファミリー。GPU を搭載して学習処理を高速化する用途ではない。","高性能な CPU による計算処理向けのファミリー。GPU などのアクセラレーターを使う機械学習のトレーニングとは区別される。","GPU やその他のハードウェアアクセラレーターを使い、機械学習、グラフィックス処理、並列計算を高速化するファミリー。"],"explain":"「GPU」「機械学習のトレーニング」が決め手で、高速コンピューティングインスタンスを選ぶ。CPU の性能を重視するコンピューティング最適化とは、アクセラレーター（GPU など）を使うかどうかで見分ける。","point":"GPU や専用アクセラレーターを使う機械学習・グラフィックス処理は、高速コンピューティングインスタンス。","diagram":null},{"id":"clf-d3-24","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、NoSQL データベースやデータウェアハウスなど、ローカルストレージに対する大量の読み書きを高い I/O 性能で行うワークロードを Amazon EC2 で実行します。この用途に適したインスタンスファミリーはどれですか。","choices":["高速コンピューティングインスタンス","ストレージ最適化インスタンス","メモリ最適化インスタンス","コンピューティング最適化インスタンス"],"answer":[1],"why":["GPU などのアクセラレーターで並列処理を高速化するファミリー。ローカルストレージの I/O 性能に特化したものではない。","ローカルストレージに対する高い順次・ランダムの読み書き性能が必要なワークロード向けのファミリー。NoSQL データベースやデータウェアハウスに適している。","大規模なデータセットをメモリ上で処理する用途のファミリー。ディスク I/O の性能を重視する用途とは異なる。","高性能な CPU による計算処理向けのファミリー。ローカルストレージへの大量の読み書きが要件の場合には向かない。"],"explain":"「ローカルストレージへの大量の読み書き」「高い I/O 性能」が決め手で、ストレージ最適化インスタンスを選ぶ。メモリ最適化とは、重視するのがメモリ容量かディスク I/O かで見分ける。","point":"ローカルディスクの高い I/O 性能が必要なら、ストレージ最適化インスタンス。","diagram":null},{"id":"clf-d3-25","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、複数の AZ にまたがる複数の Amazon EC2 インスタンスで Web アプリケーションを実行します。ユーザーからのリクエストを、正常なインスタンスに自動的に振り分けたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Route 53","AWS Global Accelerator","Elastic Load Balancing","Amazon CloudFront"],"answer":[2],"why":["DNS サービス。名前解決の応答を制御できるが、インスタンスの状態を見て個々のリクエストを振り分けるロードバランサーではない。","AWS のグローバルネットワークを使い、世界中のユーザーからのトラフィックを最適なエンドポイントに導くサービス。同一リージョン内の複数インスタンスへの分散を担う中心的なサービスではない。","受信したトラフィックを複数の AZ にあるターゲット（EC2 インスタンスなど）に自動的に分散し、ヘルスチェックで正常なターゲットだけに転送するサービス。","コンテンツをエッジロケーションにキャッシュして配信するサービス。アプリケーションのリクエストを複数のインスタンスに分散するものではない。"],"explain":"「複数の EC2 インスタンスに自動で振り分け」「正常なインスタンスに」が決め手で、Elastic Load Balancing を選ぶ。ELB はヘルスチェックで異常なターゲットを外し、複数 AZ に分散することで可用性を高める。Auto Scaling と組み合わせると、台数が変わっても振り分け先が自動で更新される。","point":"複数のインスタンスへ負荷を分散し、異常なものを避けるのは Elastic Load Balancing。","diagram":{"cols":3,"rows":2,"nodes":[{"id":"user","label":"ユーザー","sub":"","kind":"client","c":0,"r":0},{"id":"elb","label":"ELB","sub":"リクエストを分散","kind":"network","c":1,"r":0},{"id":"ec2a","label":"EC2 インスタンス","sub":"AZ-a","kind":"compute","c":2,"r":0},{"id":"ec2b","label":"EC2 インスタンス","sub":"AZ-b","kind":"compute","c":2,"r":1}],"groups":[{"label":"リージョン","kind":"region","c":1,"r":0,"w":2,"h":2},{"label":"AZ-a","kind":"az","c":2,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":2,"r":1,"w":1,"h":1}],"edges":[{"from":"user","to":"elb","label":"リクエスト","style":"solid","both":false},{"from":"elb","to":"ec2a","label":"","style":"solid","both":false},{"from":"elb","to":"ec2b","label":"","style":"solid","both":false}],"caption":"正解の構成: ELB が複数 AZ のインスタンスにリクエストを分散する"}},{"id":"clf-d3-26","domain":3,"topic":"コンピューティング","type":"multi","stem":"ある企業は、アクセス数が時間帯によって大きく変動する Web アプリケーションを Amazon EC2 で運用しています。Amazon EC2 Auto Scaling を使うことで得られる効果はどれですか。","choices":["インスタンスの OS に自動でパッチを適用できる。","需要に応じて、実行するインスタンスの台数を自動で増減できる。","インスタンスのデータを別のリージョンに自動でコピーできる。","異常と判定されたインスタンスを、新しいインスタンスに自動で置き換えられる。","リクエストを複数のインスタンスに振り分けられる。"],"answer":[1,3],"why":["OS のパッチ適用は Auto Scaling の機能ではない。EC2 ではお客様の責任で、AWS Systems Manager などを使って行う。","スケーリングポリシーに基づいて、負荷の増加時にインスタンスを追加し、減少時に削除する。需要に合わせた容量を維持できる。","リージョン間のデータコピーは Auto Scaling の役割ではない。台数を調整するための機能である。","ヘルスチェックで異常と判定されたインスタンスを終了し、新しいインスタンスを起動して、指定した台数を維持できる。","リクエストの振り分けは Elastic Load Balancing の役割。Auto Scaling は台数を管理し、ELB と組み合わせて使う。"],"explain":"EC2 Auto Scaling は、需要に応じた台数の増減と、異常なインスタンスの置き換えによる台数の維持を行う。リクエストの分散は ELB の役割で、両者は組み合わせて使う。Auto Scaling により、ピーク時の性能確保と閑散時のコスト削減を両立できる。","point":"Auto Scaling は台数の増減と異常インスタンスの置き換え。リクエストの分散は ELB。","diagram":null},{"id":"clf-d3-27","domain":3,"topic":"コンピューティング","type":"single","stem":"ある開発者は、ファイルが Amazon S3 バケットにアップロードされたときだけ画像のサムネイルを生成するコードを実行したいと考えています。サーバーのプロビジョニングや管理は行わず、コードが実行された時間に対してのみ料金を支払う構成にしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Lambda","Amazon EC2","AWS Elastic Beanstalk","Amazon Lightsail"],"answer":[0],"why":["イベントに応じてコードを実行するサーバーレスのコンピューティングサービス。サーバーの管理が不要で、コードの実行時間に対して料金が発生する。","仮想サーバーを提供するサービス。OS やパッチの管理が必要で、イベントがなくても起動している間は料金が発生する。","アプリケーションのデプロイを簡素化するサービス。内部では EC2 などのリソースが動き続け、イベントのたびに実行する用途のサービスではない。","仮想プライベートサーバーを定額で提供するサービス。サーバーが常時稼働する前提で、イベント駆動で実行する用途ではない。"],"explain":"「アップロードされたときだけ実行」「サーバーの管理なし」「実行時間に対してのみ課金」は、イベント駆動のサーバーレスコンピューティングである AWS Lambda の特徴である。EC2 や Lightsail は常時稼働するサーバーが前提になる。","point":"イベントをきっかけにコードを実行し、サーバー管理が不要で実行時間に課金されるのは AWS Lambda。","diagram":null},{"id":"clf-d3-28","domain":3,"topic":"コンピューティング","type":"single","stem":"ある研究機関は、数時間かかるデータ処理ジョブを大量に実行します。ジョブのキューイングやスケジューリング、必要なコンピューティングリソースの起動を自動化し、運用上のオーバーヘッドを最小限に抑えたいと考えています。最も適した AWS のサービスはどれですか。","choices":["AWS Lambda","AWS Batch","Amazon Lightsail","AWS Elastic Beanstalk"],"answer":[1],"why":["短時間のイベント駆動の処理に向くサービス。1 回の実行時間に上限があるため、数時間かかるジョブには向かない。","バッチコンピューティングのジョブを大規模に実行するサービス。ジョブのキューイングとスケジューリングを行い、必要なリソースを自動で起動・管理する。","ウェブサイトや小規模なアプリケーション向けに、仮想プライベートサーバーを定額で提供するサービス。大量のバッチジョブの管理には向かない。","Web アプリケーションのデプロイと管理を簡素化するサービス。バッチジョブのキューやスケジュールを管理するものではない。"],"explain":"「大量のジョブのキューイングとスケジューリング」「数時間かかる」が決め手で、AWS Batch を選ぶ。Lambda は 1 回の実行時間に上限があるため、長時間の処理には向かない。Batch はジョブの量に応じて必要なコンピューティングリソースを自動的に起動する。","point":"大量のバッチジョブの実行を自動化するなら AWS Batch。長時間の処理は Lambda に向かない。","diagram":null},{"id":"clf-d3-29","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、Amazon ECS でコンテナ化したアプリケーションを実行します。コンテナを実行するための EC2 インスタンスのプロビジョニングやパッチ適用を行わずに運用したいと考えています。この要件を満たすものはどれですか。","choices":["Amazon ECR","Amazon EC2 の Dedicated Hosts","AWS Batch","AWS Fargate"],"answer":[3],"why":["コンテナイメージを保管・管理するレジストリ。コンテナを実行するコンピューティングを提供するものではない。","物理サーバーを専有して使うための購入オプション。サーバーの管理を減らすものではなく、むしろ管理の範囲が広い。","ジョブのキューイングとスケジューリングを行うサービス。コンテナの実行基盤をサーバー管理なしで提供することが主目的ではない。","ECS や EKS で使える、サーバーレスのコンテナ実行環境。サーバーやクラスターのインスタンスを管理せずにコンテナを実行できる。"],"explain":"「EC2 インスタンスのプロビジョニングやパッチ適用を行わない」が決め手で、AWS Fargate を選ぶ。ECS や EKS の起動タイプとして使え、コンテナに必要な CPU とメモリを指定するだけで実行できる。ECR はイメージの保管場所であり、実行基盤ではない。","point":"サーバー管理なしでコンテナを動かすなら AWS Fargate。イメージの保管は Amazon ECR。","diagram":null},{"id":"clf-d3-30","domain":3,"topic":"コンピューティング","type":"single","stem":"ある企業は、オンプレミスで Kubernetes を使ってコンテナを運用しています。Kubernetes の運用ノウハウとツールを活かしたまま、コントロールプレーンの管理を AWS に任せたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon EKS","Amazon ECS","AWS Lambda","AWS Elastic Beanstalk"],"answer":[0],"why":["Kubernetes を AWS 上で実行するためのマネージドサービス。コントロールプレーンの運用を AWS が担い、標準の Kubernetes ツールをそのまま使える。","AWS 独自のコンテナオーケストレーションサービス。Kubernetes ではないため、既存の Kubernetes の資産やツールをそのまま活かす用途には向かない。","コンテナオーケストレーションではなく、イベント駆動でコードを実行するサーバーレスのサービス。","コードをアップロードしてアプリケーションをデプロイするサービス。Kubernetes のクラスターを管理するものではない。"],"explain":"「Kubernetes」「コントロールプレーンの管理を AWS に任せる」が決め手で、Amazon EKS を選ぶ。コンテナのオーケストレーションでは、AWS 独自の仕組みを使う ECS と、オープンソースの Kubernetes を使う EKS を区別する。","point":"Kubernetes を使うなら Amazon EKS、AWS ネイティブのオーケストレーションなら Amazon ECS。","diagram":null},{"id":"clf-d3-31","domain":3,"topic":"コンピューティング","type":"single","stem":"ある開発者は、Web アプリケーションのコードをアップロードするだけで、容量のプロビジョニング、ロードバランシング、Auto Scaling が自動で構成されるようにしたいと考えています。インフラストラクチャの詳細に煩わされず、開発に集中できるサービスはどれですか。","choices":["AWS CloudFormation","AWS Lambda","AWS Elastic Beanstalk","Amazon EC2"],"answer":[2],"why":["テンプレートでインフラを定義する IaC のサービス。テンプレートを自分で書く必要があり、コードをアップロードするだけで環境が整うわけではない。","サーバーレスでイベントに応じてコードを実行するサービス。Web アプリケーション全体をデプロイして、ロードバランサーなどを構成する仕組みとは異なる。","アプリケーションのコードをアップロードすると、容量のプロビジョニング、ロードバランシング、Auto Scaling、ヘルスモニタリングまで自動で処理するサービス。","仮想サーバーを提供するサービス。ロードバランサーや Auto Scaling などを自分で構成して運用する必要がある。"],"explain":"「コードをアップロードするだけ」「ロードバランシングと Auto Scaling が自動」が決め手で、AWS Elastic Beanstalk を選ぶ。使用するリソースは引き続きお客様のアカウント内にあり、必要なら細かく制御もできる。CloudFormation は、お客様が構成をテンプレートで定義するためのサービスである。","point":"コードをアップロードするだけでデプロイ環境が整うのは AWS Elastic Beanstalk。","diagram":null},{"id":"clf-d3-32","domain":3,"topic":"コンピューティング","type":"single","stem":"ある小規模な企業は、ブログや小さな Web サイトを、仮想サーバー、ストレージ、静的 IP アドレスをまとめて提供する、シンプルで予測しやすい月額料金のサービスで公開したいと考えています。この要件に最も適した AWS のサービスはどれですか。","choices":["AWS Batch","Amazon Lightsail","AWS Fargate","Amazon EKS"],"answer":[1],"why":["大規模なバッチジョブを実行するサービス。小さな Web サイトを公開する用途には適さない。","仮想サーバー、ストレージ、静的 IP などをパッケージにして、予測しやすい低価格の月額料金で提供するサービス。小規模な Web サイトやブログ向け。","コンテナを実行するためのサーバーレスの実行環境。コンテナ化されたアプリを前提とし、パッケージ化された定額プランではない。","Kubernetes のマネージドサービス。小さな Web サイトには構成が大きく、定額のシンプルなプランでもない。"],"explain":"「シンプル」「予測しやすい月額料金」「小規模な Web サイトやブログ」が決め手で、Amazon Lightsail を選ぶ。Lightsail は VPS の機能をまとめて提供し、AWS の知識が浅くても使いやすい。","point":"小規模な Web サイトを定額のシンプルな VPS で動かすなら Amazon Lightsail。","diagram":null},{"id":"clf-d3-33","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、リレーショナルデータベースを運用しています。ハードウェアのプロビジョニング、データベースソフトウェアのパッチ適用、バックアップといった管理作業を AWS に任せたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon DynamoDB","Amazon ElastiCache","Amazon Neptune","Amazon RDS"],"answer":[3],"why":["キーバリューやドキュメント形式の NoSQL データベース。リレーショナルデータベースではない。","インメモリのキャッシュサービス。永続的なリレーショナルデータベースとして使うものではない。","グラフデータベースのサービス。リレーショナルデータベースの管理を任せる用途ではない。","マネージドなリレーショナルデータベースのサービス。ハードウェアのプロビジョニング、データベースのセットアップ、パッチ適用、バックアップなどを AWS が自動化する。"],"explain":"「リレーショナルデータベース」「パッチ適用やバックアップを AWS に任せる」が決め手で、Amazon RDS を選ぶ。RDS は MySQL、PostgreSQL、MariaDB、Oracle、SQL Server などのエンジンに対応し、運用上のオーバーヘッドを減らせる。","point":"リレーショナルデータベースの運用を AWS に任せるなら Amazon RDS。","diagram":null},{"id":"clf-d3-34","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、Amazon RDS のデータベースを、1 つの AZ で障害が発生しても自動でフェイルオーバーして稼働し続けるようにしたいと考えています。この要件を満たす RDS の機能はどれですか。","choices":["マルチ AZ 配置","自動バックアップ","リードレプリカの追加","データベースの暗号化"],"answer":[0],"why":["別の AZ にスタンバイを同期的に維持し、障害時に自動でフェイルオーバーする。可用性を高めるための機能。","データを特定の時点に復元できるようにする機能。障害時に自動でフェイルオーバーして稼働を続けるものではない。","読み取り負荷を分散してスケールするための機能。主な目的は読み取り性能の向上であり、自動フェイルオーバーを保証するものではない。","保存データを保護する機能。可用性を高めるものではない。"],"explain":"「1 つの AZ の障害でも自動でフェイルオーバー」が決め手で、マルチ AZ 配置を選ぶ。マルチ AZ ではプライマリとスタンバイが別の AZ に配置され、障害時にスタンバイへ切り替わる。バックアップは復元のため、リードレプリカは読み取り性能のためで、目的が異なる。","point":"RDS の高可用性はマルチ AZ 配置。バックアップは復元用、リードレプリカは読み取りの分散用。","diagram":{"cols":3,"rows":2,"nodes":[{"id":"app","label":"アプリケーション","sub":"","kind":"compute","c":0,"r":0},{"id":"primary","label":"RDS プライマリ","sub":"AZ-a","kind":"database","c":1,"r":0},{"id":"standby","label":"RDS スタンバイ","sub":"AZ-b","kind":"database","c":1,"r":1}],"groups":[{"label":"リージョン","kind":"region","c":0,"r":0,"w":2,"h":2},{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":1}],"edges":[{"from":"app","to":"primary","label":"読み書き","style":"solid","both":false},{"from":"primary","to":"standby","label":"同期複製","style":"dashed","both":false}],"caption":"正解の構成: RDS マルチ AZ 配置でスタンバイを別の AZ に置く"}},{"id":"clf-d3-35","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、既存の MySQL を使うアプリケーションを、アプリケーションのコードをほとんど変更せずに、クラウド向けに設計された高性能なマネージドデータベースへ移行したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon DynamoDB","Amazon Neptune","Amazon Aurora","Amazon DocumentDB"],"answer":[2],"why":["NoSQL のサービス。MySQL とは互換性がなく、アプリケーションの書き換えが必要になる。","グラフデータベースのサービス。MySQL を使うリレーショナルなアプリケーションの移行先ではない。","MySQL と PostgreSQL に互換性があり、クラウド向けに設計されたリレーショナルデータベース。既存の MySQL 用のコードやツールを変更を抑えて利用できる。","MongoDB と互換性のあるドキュメントデータベース。MySQL のアプリケーションとは互換性がない。"],"explain":"「MySQL を使うアプリケーション」「コードをほとんど変更せずに」「クラウド向けの高性能」が決め手で、Amazon Aurora を選ぶ。Aurora は MySQL と PostgreSQL に互換性のあるマネージドなリレーショナルデータベースで、複数の AZ にまたがる耐久性の高いストレージを備える。","point":"MySQL・PostgreSQL 互換で、クラウド向けに設計された高性能なマネージド DB は Amazon Aurora。","diagram":null},{"id":"clf-d3-36","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、サーバーの管理なしで、1 桁ミリ秒の応答時間を維持しながらトラフィックの増減に自動で対応できる NoSQL データベースを探しています。ショッピングカートの情報をキーバリュー形式で保存する用途です。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon RDS","Amazon DynamoDB","Amazon Aurora","Amazon Neptune"],"answer":[1],"why":["リレーショナルデータベースのマネージドサービス。キーバリュー形式の NoSQL ではなく、サーバーレスで自動的にスケールするものでもない。","サーバーレスのキーバリュー・ドキュメント形式の NoSQL データベース。あらゆる規模で 1 桁ミリ秒の応答時間を実現し、負荷に応じて自動でスケールできる。","リレーショナルデータベース。スキーマを定義するリレーショナルな用途向けで、問われている NoSQL のキーバリューストアではない。","グラフ構造のデータを扱うデータベース。キーバリュー形式のシンプルなアクセスには、用途が合わない。"],"explain":"「サーバーの管理なし」「1 桁ミリ秒」「NoSQL」「キーバリュー」が決め手で、Amazon DynamoDB を選ぶ。DynamoDB はサーバーレスで、容量を自動的に調整できる。ショッピングカートやセッション管理のような、単純なキーでの高速アクセスに向く。","point":"サーバーレスで高速な NoSQL のキーバリューストアは Amazon DynamoDB。","diagram":null},{"id":"clf-d3-37","domain":3,"topic":"データベース","type":"single","stem":"ある企業の Web アプリケーションは、同じデータベースのクエリを繰り返し実行しており、データベースの負荷が高くなっています。頻繁に参照されるデータをメモリ上に保持して応答を高速化し、データベースの負荷を減らしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Neptune","Amazon DocumentDB","Amazon S3","Amazon ElastiCache"],"answer":[3],"why":["グラフデータベースのサービス。データをキャッシュして繰り返しのクエリを高速化する用途ではない。","MongoDB と互換性のあるドキュメントデータベース。インメモリのキャッシュとして使うものではない。","オブジェクトストレージ。データベースの前段でミリ秒未満の応答を返すインメモリキャッシュの役割ではない。","Redis OSS や Memcached などと互換性のあるインメモリのキャッシュサービス。頻繁に参照されるデータをメモリ上に保持して、高速な応答とデータベースの負荷軽減を実現する。"],"explain":"「頻繁に参照されるデータをメモリ上に保持」「データベースの負荷を減らす」が決め手で、Amazon ElastiCache を選ぶ。ElastiCache はデータベースの前段に置くキャッシュとして使える。永続的なプライマリデータベースの役割は RDS や DynamoDB が担う。","point":"データベースの前段のインメモリキャッシュは Amazon ElastiCache。","diagram":null},{"id":"clf-d3-38","domain":3,"topic":"データベース","type":"single","stem":"あるソーシャルネットワーキングサービスの運営企業は、ユーザー間のつながりや投稿への反応といった、関係性の強いデータを複雑にたどるクエリを、低レイテンシーで実行したいと考えています。この用途に最も適した AWS のデータベースサービスはどれですか。","choices":["Amazon Neptune","Amazon RDS","Amazon ElastiCache","Amazon DynamoDB"],"answer":[0],"why":["グラフデータベースのサービス。ソーシャルネットワークのように、データ間の関係を多数たどるクエリを高速に実行できる。","リレーショナルデータベース。多数の結合が必要な関係性の問い合わせは、グラフ専用のデータベースほど効率的ではない。","インメモリのキャッシュサービス。データ間の関係を表現して検索するデータベースとして使うものではない。","キーバリュー・ドキュメント形式の NoSQL データベース。キーによる高速なアクセスに向き、関係性をたどる用途の専用サービスではない。"],"explain":"「ユーザー間のつながり」「関係性を複雑にたどる」が決め手で、グラフデータベースの Amazon Neptune を選ぶ。ソーシャルネットワーク、不正検出、レコメンデーションなど、関係性が中心のデータに向く。","point":"関係性の強いデータをたどるグラフデータベースは Amazon Neptune。","diagram":null},{"id":"clf-d3-39","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、オンプレミスで MongoDB を使うアプリケーションを運用しています。既存の MongoDB 用のコードやドライバ
