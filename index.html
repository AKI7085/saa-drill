"h":1},{"label":"ヨーロッパのリージョン","kind":"region","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"primary","label":"RDS プライマリ","sub":"書き込みはここ","kind":"database","c":0,"r":0},{"id":"replica","label":"リードレプリカ","sub":"クロスリージョン","kind":"database","c":1,"r":0},{"id":"report","label":"レポート","sub":"ヨーロッパの拠点","kind":"client","c":2,"r":0}],"edges":[{"from":"primary","to":"replica","label":"非同期","style":"dashed"},{"from":"report","to":"replica","label":"読み取り"}]}},{"id":"d3-29","domain":3,"topic":"分析","type":"single","stem":"ある企業は、Amazon Redshift クラスターにデータウェアハウスを構築し、直近 2 年分の売上データを格納しています。Amazon S3 には、過去 10 年分の履歴データが Parquet 形式で数百 TB 保存されています。アナリストは、Redshift 上の最新データと S3 の履歴データを 1 つの SQL クエリで結合して分析することを求めています。ただし、履歴データを Redshift にロードするとストレージ容量とコストが大きく増えるため、履歴データは S3 に置いたままにする必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon Athena で S3 の履歴データを集計し、結果を CSV ファイルとして S3 に出力する。Redshift の一時テーブルにロードして、最新データと結合する。","Redshift クラスターのノード数を増やす。COPY コマンドで S3 の履歴データをすべてクラスターにロードし、最新データと同じテーブルにまとめる。","履歴データを Amazon RDS for PostgreSQL にロードする。Redshift のフェデレーテッドクエリで RDS のテーブルを参照し、最新データと結合する。","Glue Data Catalog に履歴データのテーブルを定義し、Redshift に外部スキーマを作成する。Redshift Spectrum で S3 のデータを直接参照して結合する。"],"answer":[3],"why":["クエリのたびに集計結果の出力とロードを行う手順が必要になり、運用負荷が大きい。1 つの SQL クエリで結合する要件も満たせない。","履歴データを Redshift に取り込むことになり、ストレージ容量とコストが大きく増える。S3 に置いたままにする要件に反する。","数百 TB のデータを RDS にロードする必要があり、コストも運用負荷も大きい。履歴データを S3 に置いたままにする要件にも反する。","Redshift Spectrum は、S3 のデータをロードせずに Redshift のクエリから外部テーブルとして直接参照できる。クラスター内のテーブルと外部テーブルを 1 つの SQL で結合でき、履歴データは S3 に残せる。"],"explain":"「Redshift のデータと S3 のデータを 1 つのクエリで結合」「S3 に置いたまま」「運用効率」がそろったら、Redshift Spectrum を選ぶ。Spectrum は Redshift のクエリエンジンから S3 上のデータを外部テーブルとして直接クエリする機能で、テーブル定義は Glue Data Catalog などで管理する。Parquet のような列指向形式なら読み取るデータ量も減らせる。データをロードする案は、コストとロード作業の面で要件に合わない。","point":"Redshift から S3 のデータをロードせずにクエリするなら Redshift Spectrum。外部スキーマと Glue Data Catalog で定義する。","diagram":{"caption":"正解の構成: Redshift Spectrum で S3 の履歴データを直接参照する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"bi","label":"BI ツール","sub":"既存の接続先","kind":"client","c":0,"r":0},{"id":"rs","label":"Redshift","sub":"最新 2 年分","kind":"database","c":1,"r":0},{"id":"s3","label":"S3 履歴データ","sub":"Parquet・10 年分","kind":"storage","c":2,"r":0},{"id":"cat","label":"Glue カタログ","sub":"外部テーブル定義","kind":"analytics","c":1,"r":1}],"edges":[{"from":"bi","to":"rs","label":"1 つの SQL"},{"from":"rs","to":"s3","label":"Spectrum"},{"from":"rs","to":"cat","label":"メタデータ","style":"dashed"}]}},{"id":"d3-30","domain":3,"topic":"分析","type":"multi","stem":"ある企業は、複数のアプリケーションが出力する JSON 形式のログファイルを、日付ごとのプレフィックスで Amazon S3 に保存しています。アプリケーションの更新でフィールドが追加されることが多く、そのたびに分析チームが Amazon Athena と Amazon Redshift Spectrum のテーブル定義を手作業で更新しています。新しい日付のパーティションの登録も漏れがちです。この企業は、スキーマの変更と新しいパーティションを自動で検出し、2 つのクエリサービスで同じテーブル定義を共有することを求めています。また、クラスターの管理は避けたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Amazon EMR クラスターに Apache Hive メタストアを構築する。Athena と Redshift Spectrum の両方から、このメタストアを参照するように設定する。","AWS Glue のクローラーを作成し、S3 のログのプレフィックスを対象にしてスケジュール実行する。検出したスキーマとパーティションを AWS Glue Data Catalog に登録する。","Athena と Redshift Spectrum が、同じ AWS Glue Data Catalog のデータベースとテーブルを参照するように設定する。Redshift には Data Catalog を参照する外部スキーマを作成する。","サービスごとに CREATE TABLE 文を管理する。毎日 cron ジョブで ALTER TABLE ADD PARTITION を実行して、新しいパーティションを追加する。","ログを毎日 Amazon RDS のデータベースにロードする。RDS のスキーマを 2 つのクエリサービスから共通のテーブル定義として参照する。"],"answer":[1,2],"why":["メタストアを動かす EMR クラスターの管理が必要になる。クラスターの管理を避ける要件に反し、スキーマの検出も自動にならない。","Glue クローラーは S3 のデータを走査してスキーマとパーティションを検出し、Data Catalog のテーブルを作成・更新する。スケジュール実行にすれば、フィールドの追加や新しい日付のパーティションが自動で反映される。サーバーレスで、クラスターの管理も不要になる。","Data Catalog は Athena の既定のメタデータストアであり、Redshift Spectrum も外部スキーマで参照できる。同じテーブル定義を 2 つのサービスで共有できるため、定義の二重管理がなくなる。","テーブル定義が 2 か所に分かれたままで、スキーマの変更も手作業になる。パーティション追加の自動化にしかならず、要件を満たさない。","ログの形式を変えてロードする手順が増え、RDS の運用も必要になる。Athena と Redshift Spectrum は RDS のスキーマを S3 のテーブル定義として参照できない。"],"explain":"「スキーマと新しいパーティションの自動検出」にはクローラー、「2 つのサービスで同じ定義を共有」には Glue Data Catalog の共有利用が対応する。Data Catalog は Athena・Redshift Spectrum・Glue ETL・EMR から共通のメタデータストアとして使える。どちらもサーバーレスで、クラスターの管理は発生しない。自前のメタストアや手作業の定義管理は、運用負荷が大きい。","point":"S3 データのスキーマ検出とパーティション登録は Glue クローラー。テーブル定義は Glue Data Catalog で一元化し、Athena・Spectrum で共有する。","diagram":{"caption":"正解の構成: クローラーが Data Catalog を更新し、2 サービスが共有する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"s3","label":"S3 ログ","sub":"JSON・日付別","kind":"storage","c":0,"r":0},{"id":"crawler","label":"Glue クローラー","sub":"スケジュール実行","kind":"analytics","c":1,"r":0},{"id":"cat","label":"Data Catalog","sub":"共通のテーブル定義","kind":"analytics","c":2,"r":0},{"id":"athena","label":"Athena","sub":"SQL クエリ","kind":"analytics","c":3,"r":0},{"id":"spectrum","label":"Redshift","sub":"Spectrum","kind":"database","c":2,"r":1}],"edges":[{"from":"crawler","to":"s3","label":"スキーマ検出","style":"dashed"},{"from":"crawler","to":"cat","label":"登録・更新"},{"from":"cat","to":"athena","label":"参照"},{"from":"cat","to":"spectrum","label":"外部スキーマ"}]}},{"id":"d3-31","domain":3,"topic":"分析","type":"single","stem":"ある企業は、数百台の Amazon EC2 インスタンスで実行するウェブアプリケーションのログを、Amazon CloudWatch Logs に出力しています。ログは 1 日あたり数 TB に達し、障害の調査では任意のキーワードによる全文検索が必要です。現在使っている CloudWatch Logs Insights では、期間を広げると結果が返るまでに時間がかかります。運用チームは、ログが出力されてから数分以内に、数秒で全文検索の結果を得られること、エラー件数の推移をダッシュボードで可視化できることを求めています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["OpenSearch Service のドメインを作成する。CloudWatch Logs のサブスクリプションフィルターと Firehose でログを配信し、OpenSearch Dashboards で可視化する。","CloudWatch Logs のログを定期的に Amazon S3 にエクスポートする。Amazon Athena でログのテーブルを作成し、検索のたびにクエリを実行して結果を確認する。","EC2 インスタンスにセルフマネージドの Elasticsearch クラスターを構築する。ログをクラスターに送信し、Kibana でダッシュボードを作成して運用する。","ログを Amazon Redshift クラスターにロードする。LIKE 句による検索クエリを実行し、結果を BI ツールで可視化する。"],"answer":[0],"why":["OpenSearch Service は全文検索と集計に向いたマネージドサービスで、インデックス化されたログを数秒で検索できる。サブスクリプションフィルターと Firehose でほぼリアルタイムに配信でき、OpenSearch Dashboards で可視化まで完結する。","エクスポートには時間がかかり、数分以内に検索できる要件を満たせない。Athena は検索のたびに S3 のデータをスキャンするため、数秒の応答も期待できない。","動作はするが、クラスターの構築・パッチ適用・スケーリングを自分で運用する必要がある。運用上のオーバーヘッドを最小限にする要件に反する。","Redshift は分析用のデータウェアハウスで、LIKE 句による全文検索は大量のログに対して低速になる。ロードの仕組みも別途必要になる。"],"explain":"「任意のキーワードによる全文検索」「数秒の応答」「ダッシュボード」「運用オーバーヘッド最小」がそろったら、Amazon OpenSearch Service を選ぶ。ログをインデックス化して全文検索・集計ができ、OpenSearch Dashboards が付属する。CloudWatch Logs からはサブスクリプションフィルターで継続的に配信できる。Athena や Redshift は集計の分析向きで、低レイテンシーの全文検索には向かない。","point":"ログの全文検索とダッシュボードは Amazon OpenSearch Service。CloudWatch Logs からはサブスクリプションフィルターと Firehose で配信する。","diagram":null},{"id":"d3-32","domain":3,"topic":"Kinesis","type":"single","stem":"ある企業は、モバイルアプリが送信する利用イベントを、1 秒あたり数千件のペースで Amazon Redshift に取り込み、ダッシュボードに反映しています。現在は、Amazon EC2 上のバッチ処理が 1 時間ごとにイベントを Amazon S3 に集め、COPY コマンドで Redshift にロードしています。そのため、ダッシュボードへの反映が最大 1 時間遅れています。この企業は、数分以内に反映されるようにしたいと考えています。取り込み用のサーバーや COPY を実行するスクリプトの管理は避ける必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["イベントを受け取る AWS Lambda 関数を作成する。イベントごとに Redshift へ INSERT 文を実行して 1 件ずつ書き込む。","イベントを Data Firehose の配信ストリームに送信し、配信先に Redshift クラスターを指定する。Firehose が S3 を経由して COPY を実行する。","Amazon Kinesis Data Streams にイベントを送信する。EC2 インスタンス上のコンシューマーアプリケーションが、レコードを読み取って Redshift にバッチで書き込む。","Firehose でイベントを S3 に配信する。Amazon EventBridge のスケジュールで、5 分ごとに Lambda 関数から COPY コマンドを実行する。"],"answer":[1],"why":["Redshift は大量データの一括ロードに最適化されており、1 件ずつの INSERT は低速で効率が悪い。毎秒数千件では Lambda の実行数も多くなり、負荷が大きい。","Firehose は Redshift を配信先に指定でき、S3 への一時配信と COPY の実行をマネージドで行う。バッファーの時間やサイズを小さく設定すれば、数分以内の反映ができる。サーバーやスクリプトの管理は不要になる。","動作はするが、コンシューマーを実行する EC2 インスタンスの管理が必要になる。サーバーを管理しない要件に反する。","数分以内の反映は可能だが、COPY を実行するスクリプトと、そのスケジュール・エラー処理を自分で管理することになる。Firehose の配信先に Redshift を指定すれば不要になる。"],"explain":"「Redshift にほぼリアルタイムに取り込む」「サーバーやスクリプトの管理を避ける」がそろったら、Amazon Data Firehose の Redshift 配信を選ぶ。Firehose はイベントをバッファリングして S3 に書き出し、COPY で Redshift にロードするまでを自動で行う。Kinesis Data Streams と自前のコンシューマーの組み合わせは、サーバー管理が残る。","point":"ストリームデータを Redshift や S3 にほぼリアルタイムで届けるなら Data Firehose。コンシューマーの実装とサーバー管理が不要になる。","diagram":{"caption":"正解の構成: Firehose が S3 経由で Redshift にロードする","cols":4,"rows":1,"groups":[],"nodes":[{"id":"app","label":"モバイルアプリ","sub":"利用イベント","kind":"client","c":0,"r":0},{"id":"fh","label":"Data Firehose","sub":"バッファリング","kind":"analytics","c":1,"r":0},{"id":"s3","label":"S3","sub":"中間の配信先","kind":"storage","c":2,"r":0},{"id":"rs","label":"Redshift","sub":"ダッシュボード用","kind":"database","c":3,"r":0}],"edges":[{"from":"app","to":"fh","label":"数千件/秒"},{"from":"fh","to":"s3","label":"数分ごと"},{"from":"s3","to":"rs","label":"COPY"}]}},{"id":"d3-33","domain":3,"topic":"Kinesis","type":"multi","stem":"ある企業は、IoT デバイスのテレメトリを、プロビジョニング済みモード（4 シャード）の Amazon Kinesis Data Streams のデータストリームに送信しています。パーティションキーにはデバイスの種類を使っており、主要な 3 種類のデバイスが全体の約 9 割を占めています。日中のトラフィックが増えると、特定のシャードで ProvisionedThroughputExceededException が発生し、書き込みが失敗します。トラフィックの変動も大きく、シャード数を調整する作業を減らしたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["プロデューサーの再試行の回数を増やし、指数バックオフの待機時間を長くする。","パーティションキーを、デバイス ID のようにカーディナリティの高い値に変更する。","コンシューマーに拡張ファンアウトを有効にして、読み取りのスループットを増やす。","データストリームのデータ保持期間を 24 時間から 7 日に延長する。","データストリームの容量モードをオンデマンドに変更する。"],"answer":[1,4],"why":["再試行は一時的な超過の緩和にはなるが、特定のシャードへの偏りは解消されない。書き込みの失敗が減らない状態が続く。","キーの種類が少ないと、特定のシャードにレコードが集中する。デバイス ID のような値の種類が多いキーにすると、レコードが全シャードに均等に分散される。","拡張ファンアウトはコンシューマーの読み取りを専用のスループットで行うための機能で、書き込みの失敗には影響しない。","保持期間はレコードを保存しておく期間の設定で、書き込みのスループットには関係しない。","オンデマンドモードでは、書き込みの量に応じてストリームの容量が自動で調整される。シャード数の調整作業が不要になる。"],"explain":"失敗の原因は 2 つに分けて考える。「特定のシャードだけで発生」は書き込みの偏りなので、カーディナリティの高いパーティションキーで分散させる。「トラフィックの変動が大きく、シャード数の調整を減らしたい」は、オンデマンドモードの出番である。拡張ファンアウトや保持期間は読み取りと保存の設定で、書き込みの制限とは別の話になる。","point":"シャードへの書き込み超過は、カーディナリティの高いパーティションキーで分散する。変動が大きい負荷はオンデマンドモードで調整を任せる。","diagram":{"caption":"正解の構成: デバイス ID で均等に分散し、容量は自動で調整される","cols":3,"rows":1,"groups":[],"nodes":[{"id":"dev","label":"IoT デバイス","sub":"キーはデバイス ID","kind":"client","c":0,"r":0},{"id":"kds","label":"Data Streams","sub":"オンデマンドモード","kind":"analytics","c":1,"r":0},{"id":"app","label":"コンシューマー","sub":"読み取り処理","kind":"compute","c":2,"r":0}],"edges":[{"from":"dev","to":"kds","label":"均等に分散"},{"from":"kds","to":"app"}]}},{"id":"d3-34","domain":3,"topic":"DynamoDB","type":"single","stem":"ある企業は、キャンペーン用のアプリケーションの注文データを Amazon DynamoDB テーブルに保存しています。テーブルはプロビジョニング済みのキャパシティモードで、Application Auto Scaling を設定しています。キャンペーンの告知の直後は、書き込みが数分のうちに大きく増えます。Auto Scaling の反応が追いつかず、書き込みがスロットリングされて注文の受付に失敗しています。トラフィックの増え方を事前に予測することは困難です。この企業は、アプリケーションの変更とキャパシティの管理を最小限にして、スロットリングを減らすことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling の最大キャパシティを大幅に引き上げ、ターゲット使用率を下げる。","ピーク時の書き込みキャパシティユニットを見積もり、リザーブドキャパシティを購入する。","テーブルの前段に DynamoDB Accelerator（DAX）クラスターを配置し、書き込みを DAX 経由で行う。","テーブルのキャパシティモードをオンデマンドに変更する。"],"answer":[3],"why":["上限を引き上げても、Auto Scaling は使用率を監視して調整するため、急増への反応が遅いことは変わらない。ターゲット使用率を下げると、余裕を持たせた分のコストも増える。","リザーブドキャパシティは、プロビジョニング済みの容量を長期間コミットして割引を受ける仕組みである。急増への対応ではなく、予測を外すと無駄にもなる。","DAX は読み取りのキャッシュで、書き込みはそのまま DynamoDB に転送される。書き込みのスロットリングは解消されない。","オンデマンドモードでは、キャパシティの設定が不要で、リクエストの増加に応じて自動で対応する。予測しにくい急増にも向いており、管理の手間も増えない。"],"explain":"「トラフィックを予測できない」「急増」「キャパシティの管理を最小限に」がそろったら、オンデマンドキャパシティモードを選ぶ。リクエストの量に応じて自動でスケールし、読み取り・書き込みの量に応じた従量課金になる。プロビジョニング済みモードは、負荷が予測でき安定している場合にコストを抑えやすい。","point":"負荷の予測が難しいワークロードの DynamoDB は、オンデマンドモード。安定した負荷ならプロビジョニング済み＋Auto Scaling。","diagram":null},{"id":"d3-35","domain":3,"topic":"DynamoDB","type":"single","stem":"ある企業は、Amazon DynamoDB テーブルに注文データを保存しています。テーブルのパーティションキーは注文 ID です。新機能として、特定の顧客 ID の注文を、注文日時の新しい順に一覧表示する必要があります。現在は、テーブル全体に Scan を実行して顧客 ID でフィルターしていますが、データが増えるにつれて応答が遅くなり、読み取りコストも増えています。この企業は、既存のテーブルとデータを活かして、一覧表示を 1 桁ミリ秒で返せるようにしたいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Scan を複数のセグメントに分けて並列に実行し、顧客 ID でフィルターした結果を結合して、注文日時の順に並べ替える。","顧客 ID をパーティションキー、注文日時をソートキーとするローカルセカンダリインデックス（LSI）を、既存のテーブルに追加する。","顧客 ID をパーティションキー、注文日時をソートキーとする GSI を作成する。インデックスに Query を実行し、ScanIndexForward を false にする。","DynamoDB Accelerator（DAX）クラスターを作成し、Scan の結果をキャッシュする。キャッシュの有効期間を長く設定して、アプリケーションが DAX を参照するようにする。"],"answer":[2],"why":["並列 Scan は速くなるが、全データを読み取ることに変わりはない。読み取りコストが増え続け、1 桁ミリ秒の応答も得られない。","LSI はパーティションキーが元のテーブルと同じ必要があり、テーブルの作成時にしか追加できない。既存のテーブルに追加することはできず、顧客 ID をパーティションキーにもできない。","GSI は元のテーブルとは異なるキーでデータを検索するためのインデックスで、既存のテーブルにも後から追加できる。顧客 ID で Query でき、ソートキーで並び順も指定できるため、Scan が不要になる。","キャッシュの更新前は古い結果が返り、顧客ごとの新しい注文が反映されない。Scan 自体は全データを読むため、キャッシュが外れるたびに遅くなる。"],"explain":"「パーティションキー以外の属性で検索」「既存のテーブル」「Scan が遅い」がそろったら、GSI を作成して Query に置き換える。GSI は後から追加でき、独自のパーティションキーとソートキーを持つ。LSI は同じパーティションキーの別のソートキーを持つインデックスで、テーブル作成時にしか定義できない点が、ひっかけになりやすい。","point":"別の属性での検索は GSI を追加して Query にする。LSI はテーブル作成時のみ。Scan は全件読むので大きなテーブルには避ける。","diagram":null},{"id":"d3-36","domain":3,"topic":"ElastiCache","type":"single","stem":"ある企業は、オンラインゲームのリアルタイムのセッション状態を、Amazon ElastiCache（Valkey）のレプリケーショングループに保存しています。構成は、クラスターモード無効で、プライマリノード 1 台とレプリカ 2 台です。プレイヤー数の増加により、書き込みがプライマリノードの処理能力の上限に近づき、プライマリの CPU 使用率が高止まりしています。読み取りの負荷には余裕があります。この企業は、今後の書き込みの増加にも水平にスケールでき、レプリケーションと自動フェイルオーバーを維持することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["クラスターモードを有効にして、データを複数のシャードに分割する。シャードを追加して書き込みを分散する。","レプリカの台数を増やし、アプリケーションの読み取りをすべてレプリカに向けて、プライマリの負荷を下げる。","ElastiCache for Memcached のクラスターに移行する。ノードを追加して、キーをノード間に分散する。","プライマリノードのノードタイプを、より大きなインスタンスタイプに変更して、CPU とネットワークの上限を引き上げる。"],"answer":[0],"why":["クラスターモードを有効にすると、キー空間が複数のシャードに分割され、シャードごとにプライマリが書き込みを処理する。シャードを追加すれば書き込みも水平にスケールし、各シャードのレプリカで自動フェイルオーバーも維持できる。","レプリカは読み取りを分散する仕組みで、書き込みはすべてプライマリに集中する。読み取りに余裕がある今回の課題は解決しない。","Memcached はノード間でキーを分散できるが、レプリケーションと自動フェイルオーバーの機能がない。要件を満たさない。","スケールアップは一時的な対策にはなるが、1 台のプライマリの上限は残る。水平にスケールする要件を満たさない。"],"explain":"「書き込みの上限」「水平にスケール」「レプリケーションと自動フェイルオーバーを維持」がそろったら、クラスターモード有効のシャード構成を選ぶ。レプリカの追加は読み取りのスケールで、書き込みのスケールにはシャードの追加が必要になる。Memcached は水平分散ができる一方で、レプリケーションを持たない。","point":"ElastiCache の読み取りの拡張はレプリカ、書き込みの拡張はクラスターモードのシャード追加。","diagram":{"caption":"正解の構成: クラスターモードで書き込みをシャードに分散する","cols":3,"rows":2,"groups":[{"label":"クラスターモード有効","kind":"generic","c":1,"r":0,"w":2,"h":2}],"nodes":[{"id":"app","label":"ゲームサーバー","sub":"セッション書き込み","kind":"compute","c":0,"r":0},{"id":"s1","label":"シャード 1","sub":"プライマリ","kind":"database","c":1,"r":0},{"id":"s2","label":"シャード 2","sub":"プライマリ","kind":"database","c":1,"r":1},{"id":"r1","label":"レプリカ 1","sub":"フェイルオーバー先","kind":"database","c":2,"r":0},{"id":"r2","label":"レプリカ 2","sub":"フェイルオーバー先","kind":"database","c":2,"r":1}],"edges":[{"from":"app","to":"s1","label":"キーで分散"},{"from":"app","to":"s2"},{"from":"s1","to":"r1","style":"dashed"},{"from":"s2","to":"r2","style":"dashed"}]}},{"id":"d3-37","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon Aurora MySQL 互換の DB クラスターを運用しています。クラスターは、ライターインスタンス 1 台と、同じインスタンスクラスのリーダーインスタンス 4 台で構成されています。夜間の大規模な集計クエリがオンラインの参照クエリと同じリーダーエンドポイントに接続しているため、すべてのリーダーに負荷が分散し、オンライン参照のレイテンシーが悪化しています。この企業は、集計用に大きなインスタンスクラスのリーダー 2 台を追加し、集計クエリはその 2 台だけ、オンライン参照は既存の 4 台だけに接続させることを求めています。アプリケーションでインスタンスごとの接続先を管理することは避けたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["大きなインスタンスクラスのリーダーを 2 台追加し、すべてのクエリを同じリーダーエンドポイントに接続する。Aurora が負荷に応じて自動で振り分ける。","大きなリーダー 2 台を追加し、集計ツールの接続先を、そのうちの 1 台のインスタンスエンドポイントに設定して、負荷を専用に受け持たせる。","カスタムエンドポイントを 2 つ作成する。集計用に大きなリーダー 2 台、オンライン用に既存のリーダー 4 台を割り当て、各アプリケーションを接続する。","Aurora Auto Scaling でリーダーの台数を調整するポリシーを設定し、集計クエリを実行する夜間にリーダーを自動でスケールアウトさせる。"],"answer":[2],"why":["リーダーエンドポイントは、すべてのリーダーに接続を振り分ける。集計とオンライン参照のクエリが同じインスタンスに混在する状況は変わらない。","1 台のインスタンスエンドポイントへの接続では、その 1 台に集中し、障害時には接続先を手動で変える必要がある。インスタンスごとの接続先を管理することになる。","カスタムエンドポイントは、クラスター内の任意のインスタンスのグループにエンドポイントを割り当てる機能である。用途別にインスタンスを分けられ、負荷の分散もエンドポイントの背後で行われる。アプリケーションはエンドポイントだけを指定すればよい。","Auto Scaling はリーダーの台数を増減するが、どのクエリをどのインスタンスで処理するかは分けられない。集計クエリとオンライン参照の分離にはならない。"],"explain":"「用途ごとにリーダーを分ける」「アプリケーションでインスタンスごとの接続先を管理しない」がそろったら、Aurora のカスタムエンドポイントを選ぶ。インスタンスのグループごとにエンドポイントを作ると、アプリケーションはエンドポイントだけを意識すればよく、グループ内の負荷分散も自動で行われる。リーダーエンドポイントは全リーダーが対象になる。","point":"用途別にリーダーを分けて接続するなら、Aurora のカスタムエンドポイント。リーダーエンドポイントは全リーダーが対象。","diagram":{"caption":"正解の構成: カスタムエンドポイントで用途別にリーダーを分ける","cols":3,"rows":2,"groups":[{"label":"Aurora クラスター","kind":"generic","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"online","label":"オンライン参照","sub":"アプリケーション","kind":"compute","c":0,"r":0},{"id":"batch","label":"集計ツール","sub":"夜間の大規模クエリ","kind":"compute","c":0,"r":1},{"id":"ep1","label":"カスタム EP","sub":"オンライン用","kind":"network","c":1,"r":0},{"id":"ep2","label":"カスタム EP","sub":"集計用","kind":"network","c":1,"r":1},{"id":"rd1","label":"リーダー 4 台","sub":"既存のクラス","kind":"database","c":2,"r":0},{"id":"rd2","label":"大きなリーダー","sub":"2 台を追加","kind":"database","c":2,"r":1}],"edges":[{"from":"online","to":"ep1"},{"from":"batch","to":"ep2"},{"from":"ep1","to":"rd1"},{"from":"ep2","to":"rd2"}]}},{"id":"d3-38","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、注文処理のデータベースを、汎用 SSD ストレージを使った Amazon RDS for PostgreSQL の DB インスタンスで運用しています。ピーク時間帯に書き込みのリクエストが急増すると、ストレージのレイテンシーが悪化し、注文処理が遅くなります。Amazon CloudWatch のメトリクスでは、CPU 使用率とメモリには余裕があり、ストレージの I/O がボトルネックになっていることを示しています。この企業は、ピーク時間帯でも一貫して高い IOPS と低いレイテンシーを得られるようにしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["DB インスタンスを Multi-AZ 配置に変更し、スタンバイインスタンスを別の AZ に作成する。","ストレージタイプをプロビジョンド IOPS SSD に変更し、ピーク時に必要な IOPS を指定する。","DB インスタンスのインスタンスクラスを、より大きなメモリ最適化インスタンスに変更する。","リードレプリカを作成し、書き込みを含むすべてのクエリをレプリカに分散する。"],"answer":[1],"why":["Multi-AZ は可用性を高める機能で、書き込み性能は向上しない。同期レプリケーションにより、書き込みのレイテンシーがわずかに増えることもある。","プロビジョンド IOPS SSD は、指定した IOPS を安定して提供するストレージタイプで、I/O が集中する OLTP のワークロードに向いている。ピーク時の IOPS を明示的に確保でき、レイテンシーの変動も抑えられる。","CPU とメモリには余裕があるため、インスタンスクラスを大きくしても、ボトルネックであるストレージの I/O は改善しない。","リードレプリカは読み取りの負荷を分散する機能で、書き込みはプライマリに送られる。書き込みのレイテンシー悪化の解決にはならない。"],"explain":"手がかりは「CPU とメモリに余裕」「ストレージの I/O がボトルネック」「一貫して高い IOPS」である。ボトルネックの場所に合った対策を選び、ストレージをプロビジョンド IOPS SSD にして IOPS を確保する。Multi-AZ は可用性、リードレプリカは読み取りの分散、インスタンスクラスは CPU とメモリの対策であり、いずれも書き込み I/O の改善にはならない。","point":"RDS の I/O 性能の不足は、プロビジョンド IOPS SSD で IOPS を確保する。Multi-AZ は可用性、リードレプリカは読み取りの分散。","diagram":null},{"id":"d3-39","domain":3,"topic":"S3","type":"single","stem":"ある企業は、機械学習のトレーニングジョブを、1 つのアベイラビリティーゾーン（AZ）の Amazon EC2 インスタンス群で実行しています。トレーニングでは、Amazon S3 Standard のバケットに保存された数百万の小さなオブジェクトを、エポックごとに繰り返し読み込みます。1 回のリクエストごとのレイテンシーが処理時間の大半を占めており、GPU の待ち時間が増えています。トレーニングデータは S3 Standard の元データからいつでも再作成できます。この企業は、アプリケーションの S3 API の呼び出しを維持して、1 桁ミリ秒の一貫した低レイテンシーでデータを読み込むことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["バケットで S3 Transfer Acceleration を有効にし、EC2 インスタンスからのアクセスをアクセラレーションエンドポイントに変更する。","データを S3 Intelligent-Tiering のストレージクラスに変更し、頻繁にアクセスされる階層にオブジェクトを保持し続ける。","S3 バケットをオリジンとする Amazon CloudFront ディストリビューションを作成し、ジョブの読み込み先を CloudFront に変更する。","EC2 と同じ AZ に S3 Express One Zone のディレクトリバケットを作成する。データをコピーし、読み込み先をこのバケットに変更する。"],"answer":[3],"why":["Transfer Acceleration は遠隔地からのアップロードやダウンロードを速くする機能で、同じリージョンの EC2 からの読み込みのレイテンシーは改善しない。","ストレージクラスの変更は保存コストの最適化であり、リクエストのレイテンシーは変わらない。Standard と同じ性能のままである。","CloudFront は主にインターネット上の利用者へのコンテンツ配信のためのもので、同じリージョンの EC2 からの繰り返しの読み込みを低レイテンシーにする用途ではない。","S3 Express One Zone は、単一の AZ にデータを保存し、1 桁ミリ秒のレイテンシーを実現するストレージクラスである。同じ AZ のコンピューティングと組み合わせることで性能が最大になり、S3 API で利用できる。データは再作成できるため、単一 AZ の保存でも問題ない。"],"explain":"「1 桁ミリ秒の一貫した低レイテンシー」「S3 API を維持」「小さなオブジェクトの頻繁な読み込み」がそろったら、S3 Express One Zone のディレクトリバケットを選ぶ。コンピューティングと同じ AZ に置くのが基本で、データの再作成が可能な用途に向いている。AZ が 1 つに限られるため、可用性を重視するデータの原本には使わない。","point":"1 桁ミリ秒の S3 アクセスは S3 Express One Zone。同じ AZ のコンピューティングから使い、データは再作成できる前提で置く。","diagram":{"caption":"正解の構成: 同じ AZ のディレクトリバケットから低レイテンシーで読む","cols":3,"rows":1,"groups":[{"label":"同じ AZ","kind":"az","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"std","label":"S3 Standard","sub":"元データ","kind":"storage","c":0,"r":0},{"id":"exp","label":"S3 Express","sub":"ディレクトリバケット","kind":"storage","c":1,"r":0},{"id":"ec2","label":"EC2 (GPU)","sub":"トレーニング","kind":"compute","c":2,"r":0}],"edges":[{"from":"std","to":"exp","label":"コピー","style":"dashed"},{"from":"ec2","to":"exp","label":"1 桁 ms で読む"}]}},{"id":"d3-40","domain":3,"topic":"S3","type":"single","stem":"ある企業は、気象データを解析するツールを Amazon EC2 インスタンスで実行しています。このツールはローカルのファイルパスからデータを読み取る実装で、コードを変更できません。入力データは Amazon S3 バケットに保存された数 TB の大きなファイルで、解析は読み取りが中心です。解析のたびに複数のインスタンスが同じバケットから並列にファイルを読み込みます。この企業は、追加のストレージサービスの導入やデータのコピーを行わずに、S3 のデータをファイルパスとして高いスループットで読み取れるようにしたいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各インスタンスに Mountpoint for Amazon S3 をインストールする。バケットをファイルシステムのパスにマウントし、ツールの入力パスに指定する。","各インスタンスに Amazon EBS の汎用 SSD ボリュームをアタッチする。解析の前に aws s3 sync コマンドでデータをボリュームにコピーする。","Amazon EFS のファイルシステムを作成し、AWS DataSync で S3 のデータをコピーする。各インスタンスに EFS をマウントする。","EC2 インスタンスに AWS Storage Gateway のファイルゲートウェイをデプロイし、S3 バケットを NFS 共有としてインスタンスにマウントする。"],"answer":[0],"why":["Mountpoint for Amazon S3 は、S3 のバケットをローカルのファイルシステムのようにマウントして、読み取りを高いスループットで行える。大きなファイルの並列読み取りに向いており、追加のストレージやコピーも不要になる。","インスタンスごとに数 TB をコピーする時間とストレージの費用がかかり、データのコピーが発生する。","EFS を追加して、データをコピーする手順が必要になる。追加のストレージサービスとデータのコピーを避ける要件に反する。","ファイルゲートウェイはオンプレミスのアプリケーションが S3 を NFS・SMB で利用するための仕組みである。EC2 上に置いてもゲートウェイの管理が増え、スループットも専用のマウントツールに及ばない。"],"explain":"「コードを変更できないのでファイルパス」「S3 のデータを直接」「コピーや追加のストレージなし」「読み取り中心で高スループット」がそろったら、Mountpoint for Amazon S3 を選ぶ。S3 を POSIX ライクなファイルシステムとして扱えるが、読み取りと新規書き込みが中心で、ファイルの上書きや変更には向かない。","point":"S3 のデータをファイルパスで高スループットに読むなら Mountpoint for Amazon S3。読み取り中心の用途に向く。","diagram":null},{"id":"d3-41","domain":3,"topic":"ストレージ移行","type":"single","stem":"ある印刷会社は、オンプレミスのデザイン端末から NFS で共有フォルダにファイルを保存しています。ストレージの容量が不足しているため、ファイルの保存先を Amazon S3 に移したいと考えています。デザイナーは、最近作業したファイルを、これまでと同様の低レイテンシーで開く必要があります。端末のアプリケーションは NFS 以外のプロトコルに対応しておらず、変更できません。また、オンプレミスのストレージ機器は増設したくありません。これらの要件を満たすソリューションはどれですか。","choices":["オンプレミスに Storage Gateway のボリュームゲートウェイ（キャッシュ型）をデプロイする。iSCSI ボリュームを作成し、端末からマウントしてファイルを保存する。","ファイルゲートウェイをオンプレミスにデプロイし、ローカルのディスクをキャッシュに割り当てる。NFS ファイル共有を S3 バケットに関連付けて端末からマウントする。","オンプレミスに Storage Gateway のテープゲートウェイをデプロイする。仮想テープライブラリを作成し、端末からファイルを保存する。","AWS DataSync を使い、オンプレミスの NFS 共有から S3 に毎晩ファイルを転送する。端末は既存の NFS 共有を使い続ける。"],"answer":[1],"why":["ボリュームゲートウェイは iSCSI のブロックストレージを提供するため、NFS しか使えない端末のアプリケーションには対応できない。","ファイルゲートウェイは、NFS または SMB のファイル共有を S3 のバケットに関連付ける。最近アクセスしたデータはローカルのキャッシュから低レイテンシーで読める。データは S3 に保存されるため、機器の増設が不要になる。","テープゲートウェイはバックアップソフトウェア向けの仮想テープであり、日常的にファイルを開く用途には使えない。","データの転送はできるが、端末は既存の NFS 共有を使い続けるため、オンプレミスの容量不足が解消しない。ストレージ機器の増設を避ける要件に反する。"],"explain":"「NFS のまま」「最近のファイルは低レイテンシー」「オンプレミスのストレージを増設しない」がそろったら、S3 ファイルゲートウェイを選ぶ。ローカルのキャッシュに最近使ったデータを保持し、全体のデータは S3 に保存する。ゲートウェイの種類は、ファイルは NFS・SMB、ブロックは iSCSI、バックアップは仮想テープと、プロトコルで区別できる。","point":"オンプレミスの NFS・SMB から S3 を使うなら、ファイルゲートウェイ。キャッシュで最近のデータは低レイテンシー。","diagram":{"caption":"正解の構成: ファイルゲートウェイが NFS を S3 に橋渡しする","cols":3,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"pc","label":"デザイン端末","sub":"NFS でマウント","kind":"client","c":0,"r":0},{"id":"gw","label":"S3 File Gateway","sub":"ローカルキャッシュ","kind":"onprem","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"全データを保存","kind":"storage","c":2,"r":0}],"edges":[{"from":"pc","to":"gw","label":"NFS"},{"from":"gw","to":"s3","label":"HTTPS で保存"}]}},{"id":"d3-42","domain":3,"topic":"ストレージ移行","type":"multi","stem":"ある企業は、オンプレミスの Windows ファイルサーバー（SMB）に保存された約 30 TB のデータを、AWS Direct Connect 接続（1 Gbps）経由で Amazon S3 にコピーする計画です。コピーの後も、毎晩、変更されたファイルだけを S3 に同期します。同じ Direct Connect 接続は日中の業務システムも使用しており、データの転送が業務に影響を与えないよう、使用する帯域を制御する必要があります。この企業は、運用上のオーバーヘッドを最小限に抑えたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["オンプレミスに AWS DataSync エージェントをデプロイし、SMB の送信元と S3 の送信先でタスクを作成する。毎晩実行するスケジュールを設定し、変更分だけを転送する。","Windows のタスクスケジューラで robocopy と AWS CLI のスクリプトを実行し、毎晩 S3 にファイルをコピーする。","AWS Transfer Family の SFTP サーバーエンドポイントを作成し、ファイルサーバーのデータを SFTP クライアントで S3 にアップロードする。","DataSync のタスクで帯域幅の制限を設定し、転送が業務時間帯の帯域を使いすぎないようにする。","Direct Connect 接続を 10 Gbps の専用接続に増設し、日中の業務の帯域に影響が出ないようにする。"],"answer":[0,3],"why":["DataSync は、オンプレミスのファイルサーバーから S3 へのデータ転送を自動化するサービスである。スケジュール実行と、前回から変更のあったファイルだけの転送ができ、スクリプトを自作せずに運用できる。","動作はするが、スクリプトの作成、再試行、整合性の確認を自分で管理する必要がある。運用上のオーバーヘッドを最小限にする要件に反する。","SFTP クライアントの設定や、アップロードの仕組みを別途用意する必要がある。SMB の共有から差分だけを自動で同期する仕組みにはならない。","DataSync のタスクには、転送で使う帯域幅の上限を設定できる。業務時間帯の帯域を確保しながら、残りの帯域でデータを転送できる。","回線の増設はコストがかかり、帯域の使い方を制御する手段にはならない。1 Gbps のままでも、帯域幅の制限で要件を満たせる。"],"explain":"「SMB から S3 への定期的な差分転送」「運用オーバーヘッド最小」は DataSync のタスクとスケジュール、「業務の帯域に影響を与えない」は DataSync のタスクの帯域幅制限が対応する。DataSync は転送の整合性検証も自動で行う。スクリプトの自作や回線の増設は、要件に対して運用負荷やコストが過大になる。","point":"オンプレミスのファイルサーバーから S3 への定期的な転送は DataSync。スケジュールで差分を転送し、帯域幅の制限で業務への影響を抑える。","diagram":{"caption":"正解の構成: DataSync エージェントが帯域を制限して S3 に差分転送する","cols":3,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"fs","label":"SMB サーバー","sub":"約 30 TB","kind":"onprem","c":0,"r":0},{"id":"agent","label":"DataSync Agent","sub":"帯域幅を制限","kind":"onprem","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"転送先","kind":"storage","c":2,"r":0}],"edges":[{"from":"fs","to":"agent","label":"SMB"},{"from":"agent","to":"s3","label":"夜間に差分転送"}]}},{"id":"d3-43","domain":3,"topic":"SQS・SNS","type":"single","stem":"ある企業は、ウェブアプリケーションで、利用者が依頼したレポートを生成して返しています。アプリケーションは、Application Load Balancer（ALB）の背後にある Amazon EC2 インスタンスで実行されています。レポートの生成には数分かかりますが、依頼を受けた時点で同期的に処理しているため、月末に依頼が集中するとインスタンスの CPU が飽和し、画面がタイムアウトします。この企業は、依頼をすぐに受け付けて、処理の速度を一定に保ちたいと考えています。レポートの完了は、メールで利用者に通知できれば十分です。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["ALB のアイドルタイムアウトを数分に延長する。Auto Scaling グループの最大インスタンス数を大幅に増やして、ピーク時に対応する。","依頼を Amazon ElastiCache に保存する。ウェブ層のインスタンスが、CPU に余裕のあるときにキャッシュを確認して順に処理する。","依頼を SQS キューに送信して受付完了を返す。ワーカーが一定のペースで取り出して処理し、完了を SNS でメール通知する。","CloudFront を ALB の前段に配置する。依頼の応答をキャッシュして、インスタンスへのリクエストを減らし、負荷を下げる。"],"answer":[2],"why":["タイムアウトを延長しても、利用者は数分間待たされ、CPU の飽和も解消しない。インスタンスを増やす方法は、ピーク時の台数に合わせた高いコストが発生する。","キャッシュは一時的なデータの保存向けで、メッセージの管理や再処理の仕組みがない。取り出す順序や、処理の失敗時の扱いを自分で実装する必要がある。","SQS のキューが依頼の急増を吸収し、受付の応答はすぐに返せる。ワーカーが一定のペースで取り出すため、処理の速度はピーク時でも一定に保てる。完了は SNS のメール通知で伝えられる。","依頼ごとにレポートの内容が異なるため、応答をキャッシュしても効果が薄い。依頼の処理自体を非同期にする要件も満たせない。"],"explain":"「依頼をすぐに受け付ける」「急増しても処理の速度を一定に」「完了はメール通知で十分」がそろったら、SQS で処理を非同期に切り離す。キューがバッファーになり、ワーカーの台数や処理のペースを負荷の急増から切り離せる。結果の通知は SNS が担う。同期処理のまま性能を保とうとすると、タイムアウトの延長や台数の増加が必要になる。","point":"急増する依頼は SQS のキューで受け止め、ワーカーが一定のペースで処理する。完了通知は SNS。","diagram":{"caption":"正解の構成: キューで急増を吸収し、ワーカーが一定のペースで処理する","cols":5,"rows":1,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"レポートを依頼","kind":"client","c":0,"r":0},{"id":"web","label":"ウェブ層","sub":"受付のみ","kind":"compute","c":1,"r":0},{"id":"sqs","label":"SQS キュー","sub":"急増を吸収","kind":"integration","c":2,"r":0},{"id":"wk","label":"ワーカー","sub":"一定のペース","kind":"compute","c":3,"r":0},{"id":"sns","label":"SNS","sub":"メールで完了通知","kind":"integration","c":4,"r":0}],"edges":[{"from":"user","to":"web"},{"from":"web","to":"sqs","label":"依頼を送信"},{"from":"wk","to":"sqs","label":"取り出し"},{"from":"wk","to":"sns"}]}},{"id":"d3-44","domain":3,"topic":"EBS","type":"single","stem":"ある企業は、Amazon EC2 インスタンス上でミッションクリティカルなリレーショナルデータベースを自己管理で運用しています。ピーク時には 1 秒あたり 100,000 回を超えるランダムな I/O が発生し、1 ミリ秒未満の低いレイテンシーと高い耐久性が求められます。データ量は 4 TiB です。現在の汎用 SSD（gp3）ボリュームは IOPS の上限に達しており、処理が遅延しています。運用上のオーバーヘッドを最小限に抑えて、これらの要件を満たすソリューションはどれですか。","choices":["gp3 ボリュームを複数作成し、OS 上で RAID 0 のストライプボリュームとして構成する。各ボリュームの IOPS を上限までプロビジョニングする。","ボリュームタイプを Provisioned IOPS SSD（io2 Block Express）に変更し、必要な IOPS をプロビジョニングする。io2 Block Express に対応する Nitro ベースのインスタンスタイプを使用する。","インスタンスストアを搭載したインスタンスタイプに変更し、データベースのデータファイルをインスタンスストアのボリュームに配置する。","データファイルを Amazon EFS ファイルシステムに配置し、プロビジョニングされたスループットを設定してインスタンスからマウントする。"],"answer":[1],"why":["ストライプ構成にすれば IOPS は増やせるが、1 つでも欠けるとデータが失われ、耐久性が下がる。構成の管理や監視の手間も増えるため、運用上のオーバーヘッドを最小限にする要件に合わない。","io2 Block Express は最大 256,000 IOPS とサブミリ秒のレイテンシーを提供し、gp3 より高い耐久性をもつ。ボリュームタイプの変更は稼働中にもできる。","インスタンスストアは高速だが、インスタンスの停止や障害でデータが失われる。データベースの永続データに求められる高い耐久性を満たさない。","EFS はネットワーク経由のファイルシステムで、ブロックストレージほどの低レイテンシーは得られない。データベースのランダム I/O のワークロードにも向かない。"],"explain":"「10 万を超える IOPS」「サブミリ秒」「高い耐久性」「運用負荷を抑える」がそろったら、io2 Block Express を選ぶ。gp3 の IOPS は 1 ボリュームあたり最大 80,000（2025 年 9 月に 16,000 から引き上げ）で、レイテンシーは 1 桁ミリ秒程度。それを超える IOPS やサブミリ秒のレイテンシーが必要なら io2 Block Express になる。RAID 0 は性能を稼げても耐久性と運用性で劣り、インスタンスストアは永続データに使えない。","point":"gp3 の上限は 80,000 IOPS。それを超える I/O やサブミリ秒のレイテンシー、高い耐久性が必要なら io2 Block Express（最大 256,000 IOPS）。","diagram":{"caption":"正解の構成: io2 Block Express を Nitro インスタンスにアタッチ","cols":2,"rows":1,"groups":[],"nodes":[{"id":"ec2","label":"EC2 インスタンス","sub":"Nitro・DB を実行","kind":"compute","c":0,"r":0},{"id":"ebs","label":"io2 BlockExpress","sub":"最大 256,000 IOPS","kind":"storage","c":1,"r":0}],"edges":[{"from":"ec2","to":"ebs","label":"低遅延 I/O","both":true}]}},{"id":"d3-45","domain":3,"topic":"EBS","type":"single","stem":"ある企業は、Amazon EC2 の小さいサイズのインスタンスで OLTP データベースを運用しています。データボリュームは汎用 SSD（gp3）で、16,000 IOPS と 1,000 MiB/s をプロビジョニングしています。しかし、ボリュームのメトリクスを見ると、実際の IOPS とスループットはプロビジョニングした値の半分程度で頭打ちになっています。調査の結果、EBS 最適化はすでに有効で、インスタンスタイプが提供する Amazon EBS 向けの帯域幅と IOPS の上限に達していることが分かりました。最も簡単にこの問題を解決する方法はどれですか。","choices":["ボリュームタイプを Provisioned IOPS SSD（io2）に変更し、プロビジョニングする IOPS とスループットをさらに引き上げる。","データボリュームを追加でアタッチし、OS 上で 2 つのボリュームを RAID 0 のストライプとして構成して、I/O を複数のボリュームに分散させる。","EBS 向けの帯域幅と IOPS の上限が高いインスタンスタイプに変更する。ボリュームの設定はそのままにする。","インスタンスで EBS 最適化を有効にしてから再起動し、EBS 専用のネットワーク帯域を確保する。"],"answer":[2],"why":["ボトルネックはボリュームではなくインスタンス側の上限にある。ボリュームの IOPS を増やしても、インスタンスが処理できる上限は変わらない。","ボリュームを増やしても、すべてのボリュームの I/O は同じインスタンスの EBS 向けの帯域幅と IOPS の上限を共有する。上限を超えて性能は伸びない。","EBS への I/O の上限はインスタンスタイプごとに決まっており、サイズが大きいほど高くなる。上限の高いインスタンスタイプに変えれば、プロビジョニング済みの値まで性能を引き出せる。","問題文のとおり EBS 最適化はすでに有効である。有効にしても上限は変わらず、解決にならない。"],"explain":"ボリュームのプロビジョニング値が十分なのに性能が出ないときは、インスタンスの EBS 向けの上限を疑う。インスタンスタイプごとに EBS への最大帯域幅と最大 IOPS が決まっており、ボリュームをいくら強化しても、その上限は超えられない。ボトルネックがインスタンス側なら、より上限の高いインスタンスタイプに変更する。","point":"EBS の性能は「ボリュームの上限」と「インスタンスの EBS 帯域幅・IOPS の上限」の低い方で決まる。","diagram":null},{"id":"d3-46","domain":3,"topic":"EFS・FSx","type":"single","stem":"ある企業は、複数の AZ にまたがる 100 台の Amazon EC2 インスタンスから、約 200 GiB のデータを保存した Amazon EFS ファイルシステムを共有しています。ファイルシステムはバーストスループットモードで運用されています。夜間のバッチ処理では読み書きが急増しますが、日中はほとんど使われません。スループットの需要は日によって大きく変わり、予測が困難です。バーストクレジットが枯渇してバッチ処理が遅くなることがあります。運用上のオーバーヘッドを最小限に抑えて、この問題を解決するソリューションはどれですか。","choices":["スループットモードを Elastic に変更する。需要に応じてスループットが自動でスケールされる。","ファイルシステムのスループットモードをプロビジョニングに変更し、夜間のバッチ処理のピークに合わせたスループットの値を設定する。","ファイルシステムのパフォーマンスモードを汎用から最大 I/O に変更し、より多くの I/O 操作を並列に処理できるようにする。","ファイルシステムに不要なダミーのデータを追加して保存データ量を増やし、バーストスループットのベースラインを引き上げる。"],"answer":[0],"why":["Elastic スループットは、需要に応じてスループットを自動でスケールアップ・ダウンし、使った分だけ課金される。予測できないスパイクのあるワークロードに適しており、設定の見直しも不要である。","ピークに合わせた値を常時プロビジョニングすることになり、日中の未使用分にも料金がかかる。需要が予測できない場合は、値の見直しという運用作業も残る。","パフォーマンスモードは I/O の並列度とレイテンシーの特性を決める設定で、バーストクレジットの枯渇という問題は解決しない。","バーストスループットのベースラインは保存データ量に比例するが、不要なデータの保存にはコストがかかり、設計としても不適切である。需要の変動にも追従できない。"],"explain":"「スループットの需要が予測できない」「バーストクレジットが枯渇」「運用オーバーヘッド最小」から、Elastic スループットモードを選ぶ。バーストは保存データ量が小さいとクレジットが貯まりにくく、プロビジョニングは需要を予測して値を決める必要がある。Elastic なら、需要に合わせた自動スケールと従量課金が得られる。","point":"予測できないスパイクがある EFS は Elastic スループット。需要が一定で把握できているならプロビジョニングが選択肢になる。","diagram":{"caption":"正解の構成: Elastic スループットの EFS を複数 AZ の EC2 から共有","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":1}],"nodes":[{"id":"ec2a","label":"EC2 群（AZ-a）","sub":"夜間バッチ","kind":"compute","c":0,"r":0},{"id":"efs","label":"Amazon EFS","sub":"Elastic スループット","kind":"storage","c":1,"r":0},{"id":"ec2b","label":"EC2 群（AZ-b）","sub":"夜間バッチ","kind":"compute","c":2,"r":0}],"edges":[{"from":"ec2a","to":"efs","label":"NFS","both":true},{"from":"ec2b","to":"efs","label":"NFS","both":true}]}},{"id":"d3-47","domain":3,"topic":"EFS・FSx","type":"single","stem":"ある企業は、オンプレミスの NetApp ONTAP ストレージを、Linux サーバーからは NFS で、Windows サーバーからは SMB で共有して使用しています。この企業はこのファイル共有を AWS に移行する計画です。アプリケーションの変更は避け、NFS と SMB の両方を引き続き使用し、1 ミリ秒未満のレイテンシーを維持する必要があります。また、既存の ONTAP のレプリケーション機能を使って、データを段階的に移行したいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["Amazon EFS ファイルシステムを作成し、AWS DataSync でデータをコピーする。Linux と Windows のサーバーから EFS をマウントする。","Amazon FSx for Windows File Server のファイルシステムを作成し、Linux と Windows のサーバーから SMB でマウントする。","Amazon S3 ファイルゲートウェイをデプロイし、S3 バケットを NFS と SMB の共有として公開する。サーバーからゲートウェイの共有をマウントする。","Amazon FSx for NetApp ONTAP のファイルシステムを作成し、SnapMirror でオンプレミスの ONTAP からデータをレプリケーションする。サーバーから NFS と SMB でマウントする。"],"answer":[3],"why":["EFS は NFS のみに対応しており、Windows サーバーからの SMB アクセスはできない。ONTAP のレプリケーション機能も使えない。","SMB には対応しているが NFS には対応していない。Linux サーバーからは SMB でマウントし直す必要があり、アプリケーションの変更が避けられない。ONTAP のレプリケーションも使えない。","S3 をバックエンドにしたキャッシュ型の共有で、プライマリのファイルストレージとして 1 ミリ秒未満のレイテンシーを維持する用途には向かない。ONTAP のレプリケーションも使えない。","FSx for NetApp ONTAP は NFS と SMB を同時にサポートし、SSD ストレージでサブミリ秒のレイテンシーを提供する。ONTAP の機能である SnapMirror を使って、オンプレミスから段階的にレプリケーションできる。"],"explain":"「NFS と SMB の両方」「オンプレミスの NetApp ONTAP」「ONTAP のレプリケーションで段階的に移行」「サブミリ秒」がそろったら、FSx for NetApp ONTAP を選ぶ。EFS は NFS 専用、FSx for Windows File Server は SMB 専用で、どちらも ONTAP の SnapMirror が使えない。","point":"NFS と SMB の両方・NetApp ONTAP からの移行は FSx for NetApp ONTAP。EFS は NFS 専用、FSx for Windows は SMB 専用。","diagram":{"caption":"正解の構成: SnapMirror で FSx for ONTAP へ移行し NFS と SMB で使う","cols":3,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"onp","label":"オンプレ ONTAP","sub":"既存の NAS","kind":"onprem","c":0,"r":0},{"id":"fsx","label":"FSx for ONTAP","sub":"NFS と SMB","kind":"storage","c":1,"r":0},{"id":"ec2","label":"EC2","sub":"Linux と Windows","kind":"compute","c":2,"r":0}],"edges":[{"from":"onp","to":"fsx","label":"SnapMirror"},{"from":"ec2","to":"fsx","label":"NFS / SMB"}]}},{"id":"d3-48","domain":3,"topic":"EC2","type":"single","stem":"ある企業は、約 500 GiB のデータセットをメモリ上に保持して集計するバッチ分析を、Amazon EC2 の汎用インスタンスで実行しています。メモリが不足してスワップが頻繁に発生し、処理時間が長くなっています。CPU 使用率は 20% 程度にとどまっています。分析アプリケーションは単一のインスタンスで動作し、複数のインスタンスに分散させる設計にはなっていません。アプリケーションの変更を行わずに、最も費用対効果の高い方法で処理時間を短縮するソリューションはどれですか。","choices":["コンピューティング最適化（c ファミリー）のインスタンスに変更し、vCPU 数を増やして集計処理の並列度を高める。","メモリ最適化（r ファミリー）のインスタンスで、データセットがメモリに収まるサイズに変更する。","バースト可能パフォーマンスの t ファミリーのインスタンスに変更し、無制限モードを有効にして CPU の使用を許可する。","ストレージ最適化（i ファミリー）のインスタンスに変更し、インスタンスストアにスワップ領域を作成する。"],"answer":[1],"why":["c ファミリーは vCPU あたりのメモリが少ない。CPU 使用率は低く、メモリが不足しているため、課題が解決せずコストだけが増える。","r ファミリーは vCPU あたりのメモリが多く、大容量のデータをメモリ上で処理する用途に向いている。データセット全体がメモリに収まれば、スワップが発生しなくなる。","t ファミリーは CPU のバーストに関する仕組みであり、メモリ容量が増えるわけではない。大きなデータセットを保持するには、メモリの大きなサイズが必要になる。","スワップ領域の速度が上がってもメモリ不足そのものは解消せず、メモリ上で処理するより遅い。メモリが足りない根本の課題が残る。"],"explain":"「メモリが不足」「CPU 使用率が低い」「単一インスタンスで動作」から、メモリ最適化インスタンスを選ぶ。ワークロードの特性（CPU、メモリ、ストレージ I/O）に合ったインスタンスファミリーを選べば、無駄な vCPU に料金を払わずに済む。","point":"インスタンスファミリーはボトルネックで選ぶ。メモリ不足は r 系、CPU 不足は c 系、ローカルの高速 I/O は i 系。","diagram":null},{"id":"d3-49","domain":3,"topic":"EC2","type":"multi","stem":"ある企業は、Amazon EC2 の x86 ベースのインスタンス（c6i）で構成された Auto Scaling グループで、Java 21 のウェブ API を運用しています。OS は Amazon Linux 2023 です。この企業は、現在と同等以上の性能を保ちながら、価格性能比を改善することを求めています。アプリケーションは arm64 でも動作する依存ライブラリだけを使用しており、本番環境への影響は最小限に抑える必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["起動テンプレートの AMI は x86_64 版のままにして、インスタンスタイプだけを AWS Graviton プロセッサ搭載のものに変更する。","起動テンプレートで arm64 版の Amazon Linux 2023 AMI と AWS Graviton ベースのインスタンスタイプ（c7g など）を指定し、Auto Scaling グループのインスタンスを入れ替える。","AWS Inferentia を搭載した inf ファミリーのインスタンスタイプに変更し、API の処理をそのインスタンスで実行する。","ステージング環境の Graviton インスタンスで負荷テストを行い、性能を検証する。結果を確認してから、本番の Auto Scaling グループを段階的に切り替える。","インスタンスタイプを同じ c6i ファミリーの大きいサイズに変更し、台数を減らして管理を簡素化する。"],"answer":[1,3],"why":["x86_64 版の AMI は Graviton（arm64）のインスタンスでは起動できない。AMI のアーキテクチャとインスタンスタイプのアーキテクチャは一致させる必要がある。","Graviton ベースのインスタンスは arm64 で動作する。arm64 版の AMI と Graviton ベースのインスタンスタイプを起動テンプレートに指定すれば、同等の性能をより低い価格で得られる。","Inferentia は機械学習の推論に特化したアクセラレーターであり、一般的なウェブ API の実行には向かない。","移行前に負荷テストで性能を確認し、段階的に切り替えることで、本番環境への影響を抑えながら価格性能比の改善を確かめられる。","同じ x86 ファミリーのサイズ変更では価格性能比は大きく改善しない。大きなインスタンスは単価も上がる。"],"explain":"価格性能比の改善には Graviton プロセッサ搭載のインスタンスを使う。その際は AMI も arm64 版にする必要があり、本番への影響を抑えるには、事前に負荷テストで性能を検証して段階的に切り替える。x86 の AMI のまま Graviton を指定しても起動できない。","point":"Graviton（arm64）は価格性能比に優れる。AMI とアプリケーションを arm64 に対応させ、検証してから段階的に切り替える。","diagram":null},{"id":"d3-50","domain":3,"topic":"CloudFront","type":"single","stem":"ある企業は、Amazon S3 バケットをオリジンとする Amazon CloudFront ディストリビューションで、ウェブサイトを配信しています。すべてのビューワーリクエストに対して、URL の末尾が「/」のパスに「index.html」を付け加える書き換えを行う必要があります。ピーク時には 1 秒あたり数百万件のリクエストがあり、処理はキャッシュを確認する前に、エッジロケーションでサブミリ秒で完了しなければなりません。外部へのネットワーク呼び出しは不要です。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Lambda@Edge の関数をビューワーリクエストイベントに関連付け、リクエストのたびに関数で URL を書き換える。","Lambda@Edge の関数をオリジンリクエストイベントに関連付け、キャッシュミスのときだけ URL を書き換える。","CloudFront Functions の関数をビューワーリクエストイベントに関連付け、URL を書き換える。","オリジンのウェブサーバーに URL の書き換えルールを設定し、リクエストがオリジンに到達した時点で書き換える。"],"answer":[2],"why":["Lambda@Edge でもビューワーリクエストを処理できるが、リージョナルエッジキャッシュで実行され、CloudFront Functions よりも起動の遅延と料金が大きい。単純な書き換えにはオーバースペックである。","オリジンリクエストはキャッシュミスのときだけ実行されるため、すべてのビューワーリクエストを対象にする要件を満たさない。キャッシュキーにも書き換え前の URL が使われてしまう。","CloudFront Functions はエッジロケーションで実行される軽量な JavaScript の関数で、サブミリ秒で完了し、毎秒数百万リクエストにも対応できる。URL の書き換えのような単純な処理では、Lambda@Edge よりも低コストである。","書き換えがオリジンで行われるため、エッジで処理する要件を満たさない。キャッシュキーには書き換え前の URL が使われ、キャッシュ効率も下がる。"],"explain":"「すべてのビューワーリクエスト」「エッジでサブミリ秒」「毎秒数百万リクエスト」「外部呼び出し不要」「費用対効果」から CloudFront Functions を選ぶ。URL の書き換え、ヘッダーの操作、簡単な認可のように軽い処理は CloudFront Functions、ネットワーク呼び出しや長い処理が必要なら Lambda@Edge と使い分ける。","point":"軽量な処理（URL 書き換え・ヘッダー操作）は CloudFront Functions。外部呼び出しなどが必要なら Lambda@Edge。","diagram":{"caption":"正解の構成: ビューワーリクエストを CloudFront Functions で書き換える","cols":4,"rows":1,"groups":[],"nodes":[{"id":"user","label":"ビューワー","sub":"GET /docs/","kind":"client","c":0,"r":0},{"id":"fn","label":"CF Functions","sub":"index.html を付加","kind":"serverless","c":1,"r":0},{"id":"cf","label":"CloudFront","sub":"キャッシュを確認","kind":"network","c":2,"r":0},{"id":"s3","label":"S3 オリジン","sub":"/docs/index.html","kind":"storage","c":3,"r":0}],"edges":[{"from":"user","to":"fn"},{"from":"fn","to":"cf","label":"書き換え後"},{"from":"cf","to":"s3","label":"キャッシュミス"}]}},{"id":"d3-51","domain":3,"topic":"Global Accelerator","type":"single","stem":"ある SaaS 事業者は、東京とシンガポールの 2 つのリージョンで、Application Load Balancer（ALB）の背後に HTTPS の API を配置しています。大口の法人顧客は、ファイアウォールで接続先の IP アドレスを許可リストに登録しているため、IP アドレスを固定する必要があります。この事業者は、リージョンの障害時には DNS のキャッシュに依存せず 1 分以内に別のリージョンへ切り替えること、新機能のリリース時には新しいリージョンへ段階的にトラフィックを移すことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Global Accelerator のスタンダードアクセラレーターを作成し、各リージョンの ALB をエンドポイントグループに登録する。固定のエニーキャスト IP アドレスを顧客に通知し、トラフィックダイヤルで割合を調整する。","Amazon Route 53 の加重ルーティングで、各リージョンの ALB へのエイリアスレコードを作成してヘルスチェックを設定する。TTL を短くして、障害時の切り替えと段階的な移行の速度を高める。クライアントにはドメイン名を通知する。","各リージョンの ALB をオリジンとする Amazon CloudFront ディストリビューションを作成し、オリジングループでフェイルオーバーを設定する。キャッシュの動作でリージョンへの配分を調整する。","各リージョンの ALB の前段に Elastic IP アドレスを割り当てた NLB を配置し、Route 53 のフェイルオーバールーティングで 2 つのリージョンを切り替える。"],"answer":[0],"why":["Global Accelerator は固定された 2 つのエニーキャスト IP アドレスを提供し、IP アドレスの許可リストに対応できる。ヘルスチェックに基づく切り替えは DNS に依存せず、トラフィックダイヤルで割合も調整できる。","ALB の IP アドレスは固定されず、許可リストに登録できない。DNS のキャッシュ（TTL）に依存するため、クライアントによっては 1 分以内に切り替わらない。","CloudFront のエッジの IP アドレスは多数あり、変更もされるため、固定の IP アドレスとして顧客に通知できない。段階的なリージョン間のトラフィック移行にも向かない。","NLB の Elastic IP アドレスはリージョンごとに異なるため、2 つのリージョンで IP アドレスを統一できない。切り替えも DNS に依存する。"],"explain":"「IP アドレスの固定」「DNS のキャッシュに依存しない切り替え」「リージョン間の段階的な移行」がそろったら、Global Accelerator を選ぶ。エニーキャスト IP がリージョンに関わらず同じで、障害時はエンドポイントのヘルスチェックで自動的に切り替わる。エンドポイントグループのトラフィックダイヤルで、リージョンごとの割合を調整できる。","point":"固定 IP と DNS に依存しない高速フェイルオーバーは Global Accelerator。トラフィックダイヤルで段階的にトラフィックを移せる。","diagram":{"caption":"正解の構成: エニーキャスト IP で受けて、トラフィックダイヤルで配分する","cols":3,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":1,"h":1},{"label":"シンガポール","kind":"region","c":2,"r":1,"w":1,"h":1}],"nodes":[{"id":"cust","label":"法人顧客","sub":"固定 IP を許可","kind":"client","c":0,"r":0},{"id":"ga","label":"Global Accel.","sub":"エニーキャスト IP","kind":"network","c":1,"r":0},{"id":"alb1","label":"ALB（東京）","sub":"ダイヤル 90%","kind":"network","c":2,"r":0},{"id":"alb2","label":"ALB（SG）","sub":"ダイヤル 10%","kind":"network","c":2,"r":1}],"edges":[{"from":"cust","to":"ga"},{"from":"ga","to":"alb1","label":"AWS 内部"},{"from":"ga","to":"alb2","label":"AWS 内部"}]}},{"id":"d3-52","domain":3,"topic":"コンテナ","type":"multi","stem":"ある企業は、Amazon ECS の EC2 起動タイプのクラスターで、コンテナ化したアプリケーションを実行しています。ECS サービスの Auto Scaling でタスク数は自動的に増えますが、クラスターに空きキャパシティがないとタスクが配置されず、運用チームが Auto Scaling グループのインスタンス数を手動で増やしています。ホストのデーモンを使うため、EC2 起動タイプを継続する必要があります。この企業は、運用上のオーバーヘッドを最小限に抑えて、インスタンスを自動で増減し、スケールイン時に実行中のタスクを停止させないことを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Auto Scaling グループに、平均 CPU 使用率を 50% に維持するターゲット追跡スケーリングポリシーを設定する。","ECS のキャパシティープロバイダーを作成して Auto Scaling グループに関連付け、マネージドスケーリングを有効にして、ターゲットキャパシティを 100% に設定する。","ECS サービスのタスク数の変化をトリガーに Lambda 関数を起動し、Auto Scaling グループの希望容量を更新する仕組みを作る。","キャパシティープロバイダーでマネージド終了保護を有効にし、Auto Scaling グループでインスタンスのスケールイン保護を有効にする。","Auto Scaling グループにスケジュールされたアクションを設定し、日中にインスタンス数を増やして夜間に減らす。"],"answer":[1,3],"why":["CPU 使用率は、タスクが配置できるかどうかを表す指標ではない。メモリやポートの制約でタスクが配置されなくても CPU は低いままで、スケールアウトされない。スケールイン時にタスクの実行状況も考慮されない。","キャパシティープロバイダーのマネージドスケーリングは、タスクの配置に必要な容量を計算し、Auto Scaling グループのインスタンス数を自動で調整する。ターゲットキャパシティ 100% で空きを残さずに増減できる。","動作はするが、スケールアウトとスケールインの判定ロジックを自分で作り、保守する必要がある。運用上のオーバーヘッドを最小限にする要件に合わない。","マネージド終了保護を有効にすると、タスクが実行中のインスタンスはスケールインで終了されない。この機能には、Auto Scaling グループ側のスケールイン保護が必要である。","スケジュールでは、需要の変動に合わせた自動の増減にならない。時間帯以外にタスクが急増すると、再び配置できなくなる。"],"explain":"ECS サービスの Auto Scaling はタスク数を増減させるだけで、EC2 のインスタンス数は増減させない。EC2 起動タイプのクラスターでは、キャパシティープロバイダーのマネージドスケーリングでインスタンス数をタスクの需要に連動させ、マネージド終了保護でタスクが動いているインスタンスをスケールインから守る。","point":"ECS の EC2 起動タイプは、キャパシティープロバイダーのマネージドスケーリングでインスタンスを自動増減し、終了保護でタスクを守る。","diagram":{"caption":"正解の構成: キャパシティープロバイダーでインスタンス数を需要に連動","cols":4,"rows":1,"groups":[],"nodes":[{"id":"svc","label":"ECS サービス","sub":"タスク数を増減","kind":"container","c":0,"r":0},{"id":"cp","label":"CapacityProvider","sub":"マネージド終了保護","kind":"management","c":1,"r":0},{"id":"asg","label":"Auto Scaling","sub":"インスタンス数を調整","kind":"compute","c":2,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"タスクを実行","kind":"compute","c":3,"r":0}],"edges":[{"from":"svc","to":"cp","label":"必要な容量"},{"from":"cp","to":"asg","label":"スケール"},{"from":"asg","to":"ec2"}]}},{"id":"d3-53","domain":3,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、Amazon API Gateway の REST API の背後で、Java 21 と Spring Framework で実装した AWS Lambda 関数を運用しています。新しい実行環境が作られるときの初期化に約 6 秒かかり、一部の利用者が遅い応答を経験しています。トラフィックは日中は散発的で、夜間はほぼゼロです。突発的なアクセスの増加で、新しい実行環境が一度に多数作られることもあります。この企業は、常時課金されるオプションを避け、コードの変更を最小限にして、初期化にかかる時間を短縮することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["プロビジョニングされた同時実行を、ピーク時に必要な数で関数のエイリアスに設定する。","Amazon EventBridge のスケジュールで 1 分ごとに関数を呼び出し、実行環境をウォーム状態に保つ。","関数のメモリ設定を 10,240 MB に引き上げ、初期化の処理を高速化する。","Lambda SnapStart を有効にしてバージョンを発行し、API Gateway の統合先をそのバージョンのエイリアスに変更する。"],"answer":[3],"why":["コールドスタートは避けられるが、設定した数の同時実行に対して常時料金がかかる。夜間はほぼゼロのトラフィックでも課金され、常時課金を避ける要件に合わない。","ウォーム状態に保てるのは少数の実行環境だけで、アクセスの急増で新しく作られる多数の実行環境のコールドスタートは防げない。呼び出しの料金もかかる。","メモリを増やすと CPU も増えるため初期化が多少速くなるが、6 秒の初期化を大幅に短縮できる保証はない。コストも上がる。","SnapStart は、初期化済みの実行環境のスナップショットを保存し、新しい実行環境をそのスナップショットから復元することでコールドスタートを短縮する。発行したバージョンで有効になり、常時課金のオプションではない。コードの変更もほとんど不要である。"],"explain":"「Java の初期化が長い」「常時課金を避ける」「コード変更を最小限」「急増時の多数の実行環境」から SnapStart を選ぶ。プロビジョニングされた同時実行は効果が確実だが常時課金になる。SnapStart はバージョンを発行した関数で有効になるため、API Gateway の呼び出し先を $LATEST ではなくバージョンかエイリアスにする。","point":"Java などの初期化が重い関数のコールドスタートは SnapStart で短縮。常時課金は不要で、発行したバージョンで有効。","diagram":null},{"id":"d3-54","domain":3,"topic":"API Gateway","type":"single","stem":"ある企業は、Amazon API Gateway の REST API と AWS Lambda で、取引先 50 社向けに在庫照会 API を公開しています。ある取引先がバッチ処理で大量のリクエストを一度に送信すると、バックエンドの負荷が高まり、ほかの取引先のリクエストが失敗するようになりました。この企業は、取引先ごとに 1 秒あたりのリクエスト数とバーストの上限を設定し、上限を超えた取引先のリクエストだけを制限することを求めています。運用上のオーバーヘッドを最小限に抑えて、この要件を満たすソリューションはどれですか。","choices":["Lambda 関数に予約済みの同時実行を設定し、関数全体の同時実行数に上限を設けて、バックエンドが過負荷にならないようにする。","取引先ごとに API キーを発行して使用量プランに関連付け、プランでレートとバーストの上限を設定する。API キーを必須にする。","AWS WAF のウェブ ACL を API のステージに関連付け、送信元 IP アドレスごとのレートベースのルールを作成して、大量の送信を制限する。","API のステージで、すべてのメソッドのデフォルトのスロットリング上限を引き下げて、バックエンドへの負荷を抑える。"],"answer":[1],"why":["関数全体の同時実行数を制限するだけで、取引先ごとの制限にはならない。ある取引先が枠を使い切ると、ほかの取引先のリクエストも拒否される。","使用量プランでは、API キーごとにスロットリングの上限を設定できる。取引先ごとにキーとプランを割り当てれば、上限を超えた取引先だけが制限される。API Gateway の機能だけで実現でき、運用の手間も小さい。","レートベースのルールは IP アドレス単位の制限であり、取引先の識別はできない。複数の取引先が同じ IP アドレスを共有する場合や、取引先が複数の IP アドレスを使う場合に正しく制限できない。","上限はすべての利用者に共通で適用されるため、取引先ごとの制限にならない。通常の利用の取引先まで制限される。"],"explain":"「取引先ごとに」「リクエスト数とバーストの上限」から、API キーと使用量プランを使う。API Gateway のスロットリングは、アカウント、ステージ、メソッド、使用量プラン（API キー）の各レベルで設定できる。取引先ごとの制御は使用量プランで行い、バックエンドの保護はステージやメソッドのスロットリングで行う。","point":"取引先・顧客ごとのレート制限は API キー＋使用量プラン。ステージのスロットリングは全利用者に共通。","diagram":{"caption":"正解の構成: 使用量プランで取引先ごとにスロットリングする","cols":3,"rows":1,"groups":[],"nodes":[{"id":"partner","label":"取引先","sub":"API キーを付与","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"使用量プランで制限","kind":"network","c":1,"r":0},{"id":"fn","label":"Lambda","sub":"在庫照会","kind":"serverless","c":2,"r":0}],"edges":[{"from":"partner","to":"apigw","label":"x-api-key"},{"from":"apigw","to":"fn","label":"上限内のみ"}]}},{"id":"d3-55","domain":3,"topic":"ELB","type":"single","stem":"ある企業は、Application Load Balancer（ALB）の背後で、同じサイズの Amazon EC2 インスタンスの Auto Scaling グループを使って API を運用しています。処理時間は、数十ミリ秒で終わるリクエストと数十秒かかるリクエストが混在しています。ALB は既定のラウンドロビンでリクエストを振り分けており、処理の重いリクエストがたまたま集中したインスタンスだけ CPU 使用率が高くなり、レイテンシーが悪化します。ほかのインスタンスには余裕があります。スティッキーセッションは使用していません。アプリケーションの変更を行わずに、この問題を解決するソリューションはどれですか。","choices":["ターゲットグループのロードバランシングアルゴリズムを least outstanding requests に変更する。","ターゲットグループでスティッキーセッションを有効にし、クライアントを同じインスタンスに固定して、リクエストの分散を安定させる。","Auto Scaling グループのスケーリングポリシーの CPU 使用率の目標値を下げ、負荷が高くなる前に早めにインスタンスを追加する。","ALB を Network Load Balancer（NLB）に置き換え、HTTP ではなく TCP レベルで接続を分散する。"],"answer":[0],"why":["least outstanding requests は、処理中のリクエストが最も少ないターゲットに新しいリクエストを送る。処理が重くて滞留しているインスタンスを避けられるため、処理時間のばらつきが大きいワークロードに適している。","特定のインスタンスにリクエストが固定されるため、負荷の偏りはむしろ悪化する。","インスタンスは増えるが、偏りそのものは解消されず、コストも増える。重いリクエストが集中したインスタンスの遅延は残る。","NLB も接続の振り分けはフローハッシュ方式で、処理中のリクエスト数は考慮しない。偏りは解消されず、HTTP レベルの機能も失われる。"],"explain":"「処理時間のばらつきが大きい」「ラウンドロビンで偏る」「アプリケーション変更なし」から、ALB の least outstanding requests アルゴリズムを選ぶ。ターゲットグループの属性を変更するだけで有効にできる。ラウンドロビンはリクエストの重さを考慮せずに順番に振り分けるため、処理時間が混在すると偏りが生じる。","point":"リクエストの処理時間がばらつく ALB は least outstanding requests。ラウンドロビンは重さを考慮しない。","diagram":{"caption":"正解の構成: 未処理のリクエストが少ないターゲットへ振り分ける","cols":3,"rows":2,"groups":[],"nodes":[{"id":"client","label":"クライアント","sub":"混在するリクエスト","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"least outstanding","kind":"network","c":1,"r":0},{"id":"ec2a","label":"EC2（処理中 8）","sub":"重い処理が滞留","kind":"compute","c":2,"r":0},{"id":"ec2b","label":"EC2（処理中 1）","sub":"新規を受け付ける","kind":"compute","c":2,"r":1}],"edges":[{"from":"client","to":"alb"},{"from":"alb","to":"ec2b","label":"最少へ振り分け"},{"from":"alb","to":"ec2a","label":"避ける","style":"dashed"}]}},{"id":"d3-56","domain":3,"topic":"Auto Scaling","type":"multi","stem":"ある企業は、Amazon EC2 Auto Scaling グループで、CPU 使用率の目標を 50% とするターゲット追跡スケーリングポリシーを使ってウェブアプリケーションを運用しています。起動テンプレートでは基本モニタリング（5 分間隔）を使用しています。朝の急激な負荷の増加時に、最初のスケールアウトが始まるまで数分かかります。また、新しいインスタンスはアプリケーションの初期化に約 3 分かかるため、その間の CPU 使用率が高く見えて、必要以上のインスタンスが追加されます。これらの問題を解決する手順の組み合わせはどれですか。","choices":["起動テンプレートで詳細モニタリングを有効にし、1 分間隔のメトリクスでスケーリングを判断させる。","クールダウン期間を 1,800 秒に延長して、スケーリングの頻度を下げる。","Auto Scaling グループのデフォルトのインスタンスウォームアップを、アプリケーションの初期化にかかる時間（約 180 秒）に設定する。","ターゲット追跡スケーリングポリシーをやめて、CPU 使用率が 80% を超えたら 1 台追加する単純スケーリングポリシーに変更する。","ターゲット追跡スケーリングポリシーの CPU 使用率の目標値を 50% から 80% に引き上げる。"],"answer":[0,2],"why":["基本モニタリングでは EC2 のメトリクスが 5 分間隔のため、負荷の増加を検知するまでに時間がかかる。詳細モニタリングで 1 分間隔にすれば、スケールアウトの開始が早くなる。","ターゲット追跡スケーリングはクールダウン期間ではなくウォームアップで制御される。長いクールダウンはスケールアウトをさらに遅らせるだけである。","ウォームアップ中のインスタンスは、使用率の集計に含まれない。初期化中の高い CPU 使用率が集計されなくなり、必要以上のインスタンスの追加を防げる。","単純スケーリングは 1 回の判断で固定数を追加するだけで、急な負荷の変動への追従が遅くなる。検知の遅れも解消されない。","目標値を上げるとスケールアウトの開始がさらに遅くなり、負荷が高い状態が長く続く。検知の遅れとインスタンスの過剰な追加のどちらも解決しない。"],"explain":"「最初のスケールアウトが遅い」は、5 分間隔のメトリクスが原因なので、詳細モニタリングで 1 分間隔にする。「必要以上のインスタンスが追加される」は、初期化中のインスタンスの使用率が集計に含まれることが原因なので、インスタンスウォームアップを初期化時間に合わせる。","point":"スケールアウトの検知を速めるなら詳細モニタリング（1 分間隔）。初期化中のインスタンスの影響を除くにはウォームアップを設定する。","diagram":null},{"id":"d3-57","domain":3,"topic":"ハイブリッド接続","type":"single","stem":"ある企業は、オンプレミスのデータセンターと、AWS 上の複数の VPC を、AWS Site-to-Site VPN で接続しています。夜間のバックアップ転送で、標準の VPN トンネル 1 本あたりの帯域幅の上限（約 1.25 Gbps）に達し、転送が間に合っていません。必要な帯域幅は合計で約 15 Gbps です。AWS Direct Connect の接続は開通までに時間がかかるため、当面はインターネット経由の VPN で帯域幅を確保する必要があります。複数の VPC にもそれぞれ接続する必要があります。運用上のオーバーヘッドを最小限に抑えて、この要件を満たすソリューションはどれですか。","choices":["VPC ごとに仮想プライベートゲートウェイを作成し、各ゲートウェイに複数の VPN 接続を作成する。オンプレミスのルーターで、VPN 接続ごとのトンネルにトラフィックを分散させる。","既存の VPN 接続で Global Accelerator によるアクセラレーションを有効にして、AWS のネットワーク経由で転送しスループットを引き上げる。","Transit Gateway を作成して VPC をアタッチし、複数の VPN 接続をアタッチする。BGP を使用し、ECMP を有効にして複数のトンネルに分散させる。","Client VPN エンドポイントを作成し、オンプレミスのサーバーを複数のクライアントとして接続して、それぞれの帯域幅を合算する。"],"answer":[2],"why":["仮想プライベートゲートウェイは ECMP をサポートしないため、複数の接続に自動では分散されない。VPC ごとにゲートウェイと接続を管理する運用負荷も大きい。","アクセラレーションは AWS のネットワークを使って経路を最適化し、レイテンシーを改善する機能で、1 つのトンネルの帯域幅の上限（約 1.25 Gbps）を引き上げるものではない。","Transit Gateway は ECMP をサポートしており、複数の VPN 接続のトンネルにトラフィックを分散して、帯域幅を合算できる。複数の VPC への接続を 1 か所で管理できるため、運用負荷も小さい。","Client VPN は、個々の利用者が端末から接続するためのリモートアクセス向けの機能である。拠点間の大容量の転送には向かない。"],"explain":"「1 本のトンネルの上限を大きく超える帯域幅」「Direct Connect はまだ使えない」「複数の VPC」から、Transit Gateway と複数の VPN 接続、ECMP の組み合わせを選ぶ。ECMP が使えるのは Transit Gateway の VPN アタッチメントで、動的ルーティング（BGP）が前提になる。なお、2025 年 11 月から Transit Gateway の VPN 接続では 1 本あたり最大 5 Gbps の大容量（Large）トンネルも選べるが、約 15 Gbps には複数の接続を ECMP で束ねる必要がある。","point":"VPN の帯域を増やすなら、Transit Gateway に複数の VPN を接続して ECMP。標準のトンネルは約 1.25 Gbps（大容量トンネルは最大 5 Gbps）で、仮想プライベートゲートウェイは ECMP 非対応。","diagram":{"caption":"正解の構成: 複数の VPN 接続を Transit Gateway に集約して ECMP で分散","cols":4,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"onp","label":"データセンター","sub":"BGP ルーター","kind":"onprem","c":0,"r":0},{"id":"vpn","label":"VPN 接続 × 4","sub":"各 1.25 Gbps","kind":"network","c":1,"r":0},{"id":"tgw","label":"Transit Gateway","sub":"ECMP を有効化","kind":"network","c":2,"r":0},{"id":"vpc","label":"VPC 群","sub":"アタッチメント","kind":"compute","c":3,"r":0}],"edges":[{"from":"onp","to":"vpn","label":"合計 15 Gbps"},{"from":"vpn","to":"tgw"},{"from":"tgw","to":"vpc"}]}},{"id":"d4-01","domain":4,"topic":"S3","type":"single","stem":"ある保険会社は、保険金請求の書類をスキャンした PDF ファイル（1 ファイルあたり数 MB）を Amazon S3 バケットに保存しています。書類は登録から 30 日間は審査のために頻繁に参照されますが、その後は顧客からの問い合わせ時に年に数回参照される程度です。問い合わせ対応では、書類をすぐに表示できる必要があります。登録から 1 年を経過した書類は監査のときにだけ参照され、取り出しには 48 時間まで待つことができます。書類は再作成できない原本であり、規制により 10 年間保管したあとに削除する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["S3 ライフサイクルルールを作成し、30 日後に S3 Standard-IA へ、365 日後に S3 Glacier Flexible Retrieval へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 One Zone-IA へ、365 日後に S3 Glacier Deep Archive へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 Glacier Instant Retrieval へ、365 日後に S3 Glacier Deep Archive へ移行する。3,650 日後にオブジェクトを失効させる。","S3 ライフサイクルルールを作成し、30 日後に S3 Glacier Flexible Retrieval へ、365 日後に S3 Glacier Deep Archive へ移行する。問い合わせ時は迅速取り出しで一時的に復元する。"],"answer":[2],"why":["要件は満たせるが、年に数回しか参照しないデータは Glacier Instant Retrieval の方が保管料金が安い。48 時間待てるデータも Glacier Flexible Retrieval より Deep Archive の方が安い。","One Zone-IA は単一の AZ にしかデータを保存しないため、AZ の障害や損壊でデータを失うおそれがある。再作成できない原本の保管には向かない。","年に数回の参照でもミリ秒で取り出せる Glacier Instant Retrieval と、保管料金が最も安く 48 時間以内の取り出しに対応する Deep Archive の組み合わせが最も安い。どちらも最低保存期間の条件を満たす。","Glacier Flexible Retrieval は迅速取り出しでも数分かかり、復元の操作も必要になる。問い合わせ時にすぐ表示するという要件を満たさない。"],"explain":"決め手は、期間ごとの参照頻度と取り出し時間の要件である。30 日以降は「年に数回」「すぐに表示」なので、ミリ秒で取り出せて保管料金が Standard-IA より安い Glacier Instant Retrieval が合う。1 年以降は「48 時間まで待てる」ので、保管料金が最も安い Deep Archive（標準取り出しは 12 時間以内、大容量取り出しは 48 時間以内）を選ぶ。再作成できない原本なので、単一 AZ の One Zone-IA は除外する。","point":"ミリ秒で取り出したいが四半期に 1 回程度の参照なら Glacier Instant Retrieval、12〜48 時間待てる長期保管なら Deep Archive。再作成できないデータに One Zone-IA は使わない。","diagram":{"caption":"正解の構成: 参照頻度に合わせてライフサイクルルールで移行する","cols":4,"rows":1,"groups":[{"label":"S3 ライフサイクルルール","kind":"generic","c":1,"r":0,"w":3,"h":1}],"nodes":[{"id":"app","label":"審査システム","sub":"PDF を登録","kind":"compute","c":0,"r":0},{"id":"std","label":"S3 Standard","sub":"0〜30 日","kind":"storage","c":1,"r":0},{"id":"gir","label":"Glacier IR","sub":"30 日〜1 年","kind":"storage","c":2,"r":0},{"id":"gda","label":"Deep Archive","sub":"1〜10 年 → 失効","kind":"storage","c":3,"r":0}],"edges":[{"from":"app","to":"std","label":"アップロード"},{"from":"std","to":"gir","label":"30 日後に移行"},{"from":"gir","to":"gda","label":"365 日後に移行"}]}},{"id":"d4-02","domain":4,"topic":"S3","type":"single","stem":"あるメディア分析企業は、Amazon S3 に数百 TB のデータセットを保存しています。各オブジェクトのサイズは数十 MB 以上です。データセットの多くは数か月間まったく参照されませんが、新しい分析案件が始まると古いデータセットが突然集中的に読み込まれることがあり、どのデータセットがいつ参照されるかを事前に予測することはできません。分析ジョブはデータをすぐに読み込める必要があります。この企業は、取り出し料金の発生を避けながらストレージコストを削減し、運用上のオーバーヘッドを最小限に抑えることを求めています。これらの要件を満たすソリューションはどれですか。","choices":["新規と既存のオブジェクトを S3 Intelligent-Tiering に移行する。アクセスのないオブジェクトは、低頻度アクセス層やアーカイブインスタントアクセス層へ自動的に移動させる。","S3 ライフサイクルルールを作成し、作成から 30 日後にすべてのオブジェクトを S3 Standard-IA に移行する。参照が増えたデータセットは手動で S3 Standard に戻す。","S3 ストレージクラス分析をプレフィックスごとに有効にする。分析結果を毎月確認し、アクセスの少ないプレフィックスに対するライフサイクルルールを追加する。","S3 ライフサイクルルールを作成し、作成から 90 日後に S3 Glacier Flexible Retrieval に移行する。分析ジョブの開始前に必要なオブジェクトを大容量取り出しで復元する。"],"answer":[0],"why":["Intelligent-Tiering はオブジェクトごとのアクセス状況を監視して層を自動で移し、アクセスされると高頻度アクセス層に戻す。取り出し料金はかからず、どの層でもミリ秒で読み込める。","Standard-IA は取り出し料金がかかるため、突然の集中的な読み込みでコストが増える。参照が増えたデータを手動で戻す作業も運用負荷になる。","適切なルールを作れる可能性はあるが、毎月の分析とルールの追加が必要で運用負荷が大きい。参照パターンが予測できないため、作ったルールもすぐに合わなくなる。","復元に数時間かかるため、すぐに読み込めるという要件を満たさない。取り出し料金もかかる。"],"explain":"決め手は「アクセスパターンを予測できない」「取り出し料金を避ける」「運用上のオーバーヘッドを最小限に」である。この 3 つがそろうと S3 Intelligent-Tiering が第一候補になる。30 日間アクセスがなければ低頻度アクセス層、90 日間なければアーカイブインスタントアクセス層へ自動で移り、いずれの層でもミリ秒で読み込める。オブジェクトごとに少額のモニタリング料金がかかるが、128 KB 未満のオブジェクトは自動階層化の対象外でモニタリング料金もかからない。","point":"アクセスパターンが不明・変化する大きなオブジェクトは S3 Intelligent-Tiering。取り出し料金がなく、層の移動も自動で行われる。","diagram":{"caption":"正解の構成: Intelligent-Tiering が層を自動で移す","cols":3,"rows":2,"groups":[{"label":"S3 Intelligent-Tiering","kind":"generic","c":0,"r":0,"w":3,"h":1}],"nodes":[{"id":"freq","label":"高頻度アクセス層","sub":"アクセスされると戻る","kind":"storage","c":0,"r":0},{"id":"ia","label":"低頻度アクセス層","sub":"30 日アクセスなし","kind":"storage","c":1,"r":0},{"id":"aia","label":"Archive Instant","sub":"90 日アクセスなし","kind":"storage","c":2,"r":0},{"id":"job","label":"分析ジョブ","sub":"参照時期は予測不可","kind":"analytics","c":1,"r":1}],"edges":[{"from":"freq","to":"ia","label":"自動で移動"},{"from":"ia","to":"aia","label":"自動で移動"},{"from":"job","to":"ia","label":"取り出し無料"}]}},{"id":"d4-03","domain":4,"topic":"EBS","type":"single","stem":"ある企業は、数百台の Amazon EC2 インスタンスで業務システムを運用しています。各インスタンスは、ルートボリュームとデータボリュームのどちらにも汎用 SSD（gp2）の Amazon EBS ボリュームを使用しています。コストを分析したところ、EBS ボリュームの料金が大きな割合を占めていることがわかりました。ソリューションアーキテクトは、各ボリュームの現在の IOPS とスループットを維持したまま、EBS のコストを削減する必要があります。作業のためにインスタンスを停止したり、ボリュームをデタッチしたりすることは許可されていません。これらの要件を満たすソリューションはどれですか。","choices":["Elastic Volumes を使用して、すべてのボリュームのタイプをプロビジョンド IOPS SSD（io2）に変更する。各ボリュームの IOPS を現在の値に合わせて設定する。","Elastic Volumes を使用して、すべてのボリュームのタイプをスループット最適化 HDD（st1）に変更する。ボリュームのサイズは現在のまま維持する。","Elastic Volumes を使用して、データボリュームのサイズを実際のデータ使用量に合わせて縮小する。ボリュームタイプは gp2 のまま維持する。","Elastic Volumes を使用して、すべてのボリュームのタイプを汎用 SSD（gp3）に変更する。必要なボリュームには現在と同等の IOPS とスループットを個別に設定する。"],"answer":[3],"why":["io2 は高い耐久性と IOPS が必要なワークロード向けで、容量の料金に加えてプロビジョンドした IOPS にも料金がかかる。コストはかえって上がる。","st1 はシーケンシャルな大量の読み書き向けの HDD で、ランダム I/O の性能が低い。ルートボリュームにも使用できない。","EBS ボリュームのサイズは拡張しかできず、縮小はできない。gp2 は IOPS がサイズに比例するため、仮に縮小できても性能が下がる。","gp3 は GiB あたりの料金が gp2 より安く、サイズに関係なくベースラインの IOPS とスループットが確保される。追加の IOPS とスループットも個別に設定でき、Elastic Volumes で稼働中のまま変更できる。"],"explain":"決め手は「現在の性能を維持」「停止・デタッチ不可」「コスト削減」である。gp2 は IOPS がボリュームサイズに比例するため、性能のために大きなボリュームを確保していることが多い。gp3 はサイズと切り離して IOPS とスループットを設定でき、GiB あたりの料金も安い。Elastic Volumes を使えば、アタッチしたまま稼働中にボリュームタイプを変更できる。","point":"gp2 から gp3 への変更は Elastic Volumes で無停止で行え、GiB 単価が下がる。EBS ボリュームのサイズは縮小できない。","diagram":null},{"id":"d4-04","domain":4,"topic":"EFS・FSx","type":"single","stem":"ある出版社は、複数のアベイラビリティーゾーン（AZ）に配置した Amazon EC2 インスタンスで編集システムを運用しており、原稿や画像を Amazon EFS（リージョナル）のファイルシステムに保存しています。ファイルは作成から数週間は頻繁に編集されますが、その後はほとんど参照されません。ただし、過去の記事を再編集するときに古いファイルが参照されることがあり、そのファイルは再び頻繁に使われます。この企業は、アプリケーションを変更せず、複数の AZ にわたる耐久性を維持したまま、ストレージコストを削減することを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS DataSync を使用して、新しい EFS One Zone のファイルシステムにデータを移行する。EC2 インスタンスのマウント先を新しいファイルシステムに切り替える。","EFS のライフサイクル管理を設定し、30 日間アクセスのないファイルを低頻度アクセス（IA）ストレージクラスへ移行する。初回アクセス時に標準ストレージクラスへ戻す設定にする。","30 日間更新のないファイルを Amazon S3 Glacier Instant Retrieval にコピーして EFS から削除するスクリプトを毎晩実行する。再編集時はファイルを EFS に戻す。","EFS のスループットモードを Elastic スループットに変更し、読み取りと書き込みの量に応じて料金を支払うようにする。ストレージクラスは標準のまま維持する。"],"answer":[1],"why":["One Zone は単一の AZ にデータを保存するため、複数の AZ にわたる耐久性を維持するという要件を満たさない。データの移行作業も必要になる。","ライフサイクル管理は、アクセスのないファイルを自動で IA に移し、アクセスされたファイルを標準に戻せる。ファイルシステムのパスは変わらないため、アプリケーションの変更も不要である。","保存場所が S3 に変わるため、アプリケーションからファイルパスで参照できなくなる。スクリプトの開発と運用の負荷も大きい。","スループットモードの変更はスループットにかかる料金に影響するだけで、保存しているデータのストレージ料金は下がらない。"],"explain":"決め手は「アプリケーションを変更しない」「複数 AZ の耐久性を維持」「ストレージコストを削減」である。EFS のライフサイクル管理を使うと、一定期間アクセスのないファイルを保管料金の安い IA ストレージクラスへ自動で移せる。IA のファイルは読み取りのたびにアクセス料金がかかるため、「初回アクセス時に標準へ戻す」設定を組み合わせて、再び頻繁に使われるファイルを標準に戻す。One Zone はコストが下がるが単一 AZ になるため要件を満たさない。","point":"EFS のコスト削減はライフサイクル管理で IA（さらに Archive）へ自動移行する。再利用されるファイルは「初回アクセス時に標準へ戻す」を設定する。","diagram":{"caption":"正解の構成: ライフサイクル管理でアクセスのないファイルを IA へ移す","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":1,"h":2},{"label":"AZ-a","kind":"az","c":0,"r":0,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":0,"r":1,"w":1,"h":1},{"label":"Amazon EFS（リージョナル）","kind":"generic","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2a","label":"EC2","sub":"編集システム","kind":"compute","c":0,"r":0},{"id":"ec2c","label":"EC2","sub":"編集システム","kind":"compute","c":0,"r":1},{"id":"std","label":"EFS 標準","sub":"編集中のファイル","kind":"storage","c":1,"r":0},{"id":"ia","label":"EFS IA","sub":"アクセスで標準へ戻る","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2a","to":"std","label":"NFS マウント"},{"from":"ec2c","to":"std","label":"NFS マウント"},{"from":"std","to":"ia","label":"30日未アクセス","style":"dashed"}]}},{"id":"d4-05","domain":4,"topic":"バックアップ・DR","type":"single","stem":"ある製造業の会社は、オンプレミスのサーバーを市販のバックアップソフトウェアで物理テープにバックアップし、テープを外部の保管業者に預けています。テープ媒体の購入費、輸送費、保管費が増え続けているため、バックアップの保存先を AWS に移すことを計画しています。バックアップは 10 年間保管する必要がありますが、古いバックアップから復元することはまれで、復元には 1 日程度待つことができます。この企業は、既存のバックアップソフトウェアとテープベースのバックアップジョブを変更せずに使い続けることを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Storage Gateway の S3 ファイルゲートウェイをデプロイし、バックアップの出力先をファイル共有に変更する。S3 ライフサイクルルールでオブジェクトを S3 Glacier Deep Archive に移行する。","AWS Storage Gateway のボリュームゲートウェイ（キャッシュ型）をデプロイし、バックアップをボリュームに書き込む。ボリュームの EBS スナップショットを定期的に作成して保管する。","AWS Storage Gateway のテープゲートウェイをデプロイし、バックアップソフトウェアから仮想テープライブラリとして接続する。取り出した仮想テープを S3 Glacier Deep Archive にアーカイブする。","オンプレミスに AWS DataSync エージェントをデプロイし、バックアップソフトウェアがディスクに出力したファイルを毎晩 S3 Glacier Deep Archive に直接転送する。"],"answer":[2],"why":["ストレージコストは下げられるが、バックアップの出力先をテープからファイル共有に変える必要があり、テープベースのジョブを変更しないという要件を満たさない。","テープベースのジョブはそのまま使えない。EBS スナップショットで長期保管すると、Glacier Deep Archive よりコストも高い。","テープゲートウェイは iSCSI の仮想テープライブラリ（VTL）としてバックアップソフトウェアから見えるため、既存のジョブをそのまま使える。取り出した仮想テープは保管料金が最も安い Deep Archive にアーカイブできる。","バックアップの出力先をディスクに変える必要があり、テープベースのジョブを変更しないという要件を満たさない。"],"explain":"決め手は「既存のバックアップソフトウェアとテープベースのジョブを変更しない」と「復元は 1 日程度待てる長期保管」である。テープゲートウェイは物理テープライブラリの代わりに仮想テープライブラリを提供し、仮想テープは Amazon S3 に保存される。バックアップソフトウェアで取り出した（イジェクトした）テープは S3 Glacier Flexible Retrieval または S3 Glacier Deep Archive にアーカイブでき、まれにしか復元しない長期保管なら Deep Archive が最も安い。","point":"物理テープを置き換えつつ既存のバックアップソフトウェアを変えたくないならテープゲートウェイ。長期保管のテープは Deep Archive にアーカイブする。","diagram":{"caption":"正解の構成: テープゲートウェイで仮想テープを Deep Archive に保管する","cols":4,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1},{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"bk","label":"バックアップ","sub":"既存ソフトウェア","kind":"onprem","c":0,"r":0},{"id":"tgw","label":"Tape Gateway","sub":"仮想テープライブラリ","kind":"storage","c":1,"r":0},{"id":"s3","label":"Amazon S3","sub":"仮想テープを保存","kind":"storage","c":2,"r":0},{"id":"gda","label":"Deep Archive","sub":"取り出したテープ","kind":"storage","c":3,"r":0}],"edges":[{"from":"bk","to":"tgw","label":"iSCSI (VTL)"},{"from":"tgw","to":"s3","label":"HTTPS で転送"},{"from":"s3","to":"gda","label":"イジェクト時","style":"dashed"}]}},{"id":"d4-06","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、2 つの AWS リージョンで Amazon EC2 インスタンスを使い、複数の業務アプリケーションを運用しています。全体のコンピューティング使用量は、今後 3 年間ほぼ一定と見込まれています。一方で、この期間中にインスタンスファミリーを AWS Graviton ベースのものに変更し、一部のアプリケーションを Amazon ECS on AWS Fargate と AWS Lambda に移行する計画があります。この企業は、構成を変更しても自動的に割引が適用され、購入後の管理作業が少ない方法でコンピューティングのコストを削減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["現在のインスタンスファミリーとリージョンを指定して、3 年間の EC2 Instance Savings Plans を購入する。インスタンスファミリーを変更するときに追加で購入する。","現在のインスタンスタイプに合わせて、3 年間のスタンダードリザーブドインスタンスを購入する。移行で不要になった分はリザーブドインスタンスマーケットプレイスで売却する。","3 年間のコンバーティブルリザーブドインスタンスを購入する。インスタンスファミリーを変更するときに、新しいインスタンスタイプのリザーブドインスタンスと交換する。","一定で見込める使用量に対して、3 年間の Compute Savings Plans を購入する。1 時間あたりの利用額をコミットし、対象の使用量に割引が自動的に適用されるようにする。"],"answer":[3],"why":["EC2 Instance Savings Plans はリージョンとインスタンスファミリーが固定される。Graviton への変更や Fargate・Lambda への移行には自動で適用されない。","スタンダード RI はインスタンスファミリーの変更や Fargate・Lambda には適用されない。売却の手続きも必要になり、管理作業が多い。","交換すればインスタンスファミリーは変えられるが、そのたびに交換作業が必要になる。Fargate と Lambda の使用量には適用されない。","Compute Savings Plans は、インスタンスファミリー、サイズ、リージョン、OS にかかわらず EC2 に適用され、Fargate と Lambda にも自動的に適用される。構成を変えても管理作業が増えない。"],"explain":"決め手は「インスタンスファミリーの変更」「Fargate と Lambda への移行」「自動的に割引が適用」である。Compute Savings Plans は 1 時間あたりの利用額をコミットする購入オプションで、EC2 のインスタンスファミリーやリージョンを問わず、Fargate と Lambda にも適用される。EC2 Instance Savings Plans とスタンダード RI は割引率が高い代わりに対象が固定され、コンバーティブル RI は交換できても対象が EC2 に限られる。","point":"インスタンスファミリー・リージョンの変更や Fargate・Lambda への移行を見込むなら Compute Savings Plans。構成を固定できるなら EC2 Instance Savings Plans の方が割引率は高い。","diagram":null},{"id":"d4-07","domain":4,"topic":"購入オプション","type":"multi","stem":"ある EC 事業者は、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで Web アプリケーションを運用しています。グループは年間を通して最低 6 台のインスタンスで稼働しており、1 日に数回、予測できないタイミングで数時間だけ台数が増えます。また、毎晩、商品画像を変換するバッチ処理を EC2 インスタンスで実行しています。バッチ処理はチェックポイントから再開でき、翌朝までに終われば開始時刻は問いません。現在はすべてオンデマンドインスタンスを使用しています。この企業は、Web アプリケーションの可用性を損なわずに、コンピューティングのコストを最も効果的に削減することを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Web アプリケーションの最低 6 台をスポットインスタンスで実行する。中断された場合は、Auto Scaling グループが自動的に別のインスタンスを起動する。","Web アプリケーションの最低 6 台分の使用量に対して、1 年または 3 年の Savings Plans を購入する。増加分はオンデマンドインスタンスのまま実行する。","Web アプリケーションのピーク時の最大台数に合わせてリザーブドインスタンスを購入し、増加分のインスタンスにも割引が適用されるようにする。","夜間バッチ用にオンデマンドキャパシティ予約を作成し、毎晩必要な台数のインスタンスを確実に起動できるようにしておく。","夜間バッチを、複数のインスタンスタイプを指定したスポットインスタンスで実行する。中断された場合はチェックポイントから処理を再開する。"],"answer":[1,4],"why":["常時必要な最低台数がまとめて中断されると、置き換えが間に合わずに可用性が下がる。常に必要な台数はスポットに向かない。","年間を通して必ず使う最低 6 台分は使用量が一定なので、Savings Plans のコミットで確実に割引を受けられる。予測できない増加分をオンデマンドにしておけば、使わないコミットも生じない。","増加分は 1 日に数時間しか動かないため、ピーク台数分の RI は大半の時間で使われず、かえってコストが増える。","キャパシティ予約は起動の確実性を高めるもので、予約自体に割引はない。使わない時間も料金がかかり、開始時刻を問わないバッチには不要である。","中断されても再開でき、開始時刻も問わない処理はスポットインスタンスに最適である。複数のインスタンスタイプを指定すると容量を確保しやすく、中断の影響も減らせる。"],"explain":"使用量の性質ごとに購入オプションを分けて考える。年間を通して一定の最低台数は Savings Plans（または RI）、予測できない短時間の増加分はオンデマンド、中断されても再開できる柔軟なバッチはスポットインスタンスが最も安い。「可用性を損なわずに」があるため、常時必要な Web の最低台数をスポットにする選択肢は除外する。","point":"一定の基礎負荷は Savings Plans・RI、予測できない短時間のピークはオンデマンド、中断に強いバッチはスポットインスタンス。","diagram":null},{"id":"d4-08","domain":4,"topic":"コンテナ","type":"single","stem":"ある動画配信企業は、アップロードされた動画からサムネイルとプレビューを生成する処理を、Amazon ECS on AWS Fargate のタスクで実行しています。タスクは Amazon SQS キューからジョブを受け取り、1 件の処理に 20〜40 分かかります。処理は冪等であり、途中で中断されても再実行すれば問題ありません。処理件数は月によって大きく変動します。この企業は、サーバーを管理することなく、また長期の利用をコミットすることなく、コンピューティングのコストを削減することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["ECS サービスのキャパシティープロバイダー戦略で FARGATE_SPOT を使用する。中断されたジョブは、SQS の可視性タイムアウト後に別のタスクで再処理されるようにする。","ECS クラスターに Amazon EC2 Auto Scaling グループのキャパシティープロバイダーを追加し、スポットインスタンスで構成した EC2 インスタンス上でタスクを実行する。","Fargate の使用量に対して 3 年間の Compute Savings Plans を購入する。タスクは引き続き FARGATE キャパシティープロバイダーで実行する。","処理を AWS Lambda 関数に移行し、SQS キューをイベントソースとして設定する。関数のメモリは処理時間が短くなるように大きめに割り当てる。"],"answer":[0],"why":["Fargate Spot は Fargate の予備の容量を割引価格で使う仕組みで、サーバー管理もコミットも不要である。中断の 2 分前に通知され、SQS からの再処理で中断に対応できる。","スポットインスタンスで安くはなるが、EC2 インスタンスの AMI の更新やスケーリングの管理が必要になり、サーバーを管理しないという要件を満たさない。","割引は受けられるが、3 年間の利用のコミットが必要になる。処理件数が大きく変動するため、コミットした額を使い切れないおそれもある。","Lambda 関数の最大実行時間は 15 分であり、20〜40 分かかる処理は完了できない。"],"explain":"決め手は「中断されても再実行できる」「サーバーを管理しない」「長期のコミットなし」である。中断に強い処理ならスポットの割引を使うのが最も安く、Fargate のまま使えるのが Fargate Spot である。キャパシティープロバイダー戦略で FARGATE_SPOT を指定するだけで、タスク定義やアプリケーションはそのまま使える。EC2 のスポットインスタンスはサーバーの管理が必要になり、Savings Plans はコミットが必要になる。","point":"中断に強い ECS タスクのコスト削減は Fargate Spot（キャパシティープロバイダー戦略）。サーバー管理なし・コミットなしで割引を受けられる。","diagram":{"caption":"正解の構成: FARGATE_SPOT で中断に強いジョブを安く処理する","cols":3,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":0,"r":0,"w":3,"h":1},{"label":"ECS クラスター","kind":"generic","c":1,"r":0,"w":1,"h":1}],"nodes":[{"id":"sqs","label":"SQS キュー","sub":"処理待ちのジョブ","kind":"integration","c":0,"r":0},{"id":"ecs","label":"ECS タスク","sub":"FARGATE_SPOT","kind":"container","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"サムネイルを保存","kind":"storage","c":2,"r":0}],"edges":[{"from":"sqs","to":"ecs","label":"ジョブを取得"},{"from":"ecs","to":"s3","label":"結果を保存"}]}},{"id":"d4-09","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、AWS Organizations で管理する 20 個の AWS アカウントで、数百台の Amazon EC2 インスタンス、Amazon EBS ボリューム、AWS Lambda 関数を運用しています。インスタンスタイプ、ボリュームのサイズ、関数のメモリは各チームが十分に見積もらずに決めており、多くのリソースが過剰にプロビジョニングされていると考えられています。ソリューションアーキテクトは、メモリ使用率を含む実際の使用状況にもとづき、AWS Graviton ベースのインスタンスタイプへの変更も含めた適正なサイズの推奨事項を得る必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["管理アカウントで AWS Cost Anomaly Detection を有効にし、アカウントごとにコストモニターを作成する。異常なコストの増加が検出されたリソースから順にサイズを見直す。","組織のすべてのアカウントで AWS Compute Optimizer をオプトインする。EC2 インスタンスに CloudWatch エージェントを導入し、メモリ使用率を収集する。","AWS Cost Explorer で Savings Plans の購入推奨事項を確認する。推奨されたコミット額をもとに、各アカウントのインスタンスタイプとボリュームを見直す。","各アカウントの Amazon CloudWatch メトリクスをクロスアカウントのダッシュボードに集約する。CPU とメモリの使用率をもとに、チームごとに適切なサイズを判断する。"],"answer":[1],"why":["Cost Anomaly Detection はコストの異常な増加を検出するサービスで、過剰なプロビジョニングが続いている状態や、リソースごとの推奨サイズは示さない。","Compute Optimizer は使用状況のメトリクスを機械学習で分析し、EC2、EBS、Lambda の推奨事項を組織全体で提示する。CloudWatch エージェントのメモリメトリクスも使え、Graviton を含めた推奨にも対応する。","Savings Plans の推奨事項は購入するコミット額の提案であり、リソースのサイズが適正かどうかは判断しない。","要件は満たせるが、数百のリソースを人が分析して判断する必要があり、運用負荷が大きい。"],"explain":"決め手は「実際の使用状況にもとづく推奨事項」「EC2・EBS・Lambda」「最も運用効率の高い方法」である。AWS Compute Optimizer は EC2 インスタンス、Auto Scaling グループ、EBS ボリューム、Lambda 関数などの適正なサイズを推奨し、Organizations の管理アカウントから組織全体をまとめて分析できる。EC2 のメモリ使用率は標準では取得されないため、CloudWatch エージェントで収集すると推奨の精度が上がる。","point":"EC2・EBS・Lambda などの適正サイズの推奨は AWS Compute Optimizer。メモリを考慮させるには CloudWatch エージェントでメトリクスを送る。","diagram":null},{"id":"d4-10","domain":4,"topic":"RDS・Aurora","type":"single","stem":"ある SaaS 企業は、Amazon Aurora MySQL 互換のプロビジョニングされたクラスターでアプリケーションのデータベースを運用しています。データベースの負荷は 1 日の大半は低いものの、顧客の一斉処理によって、1 日に数回、予測できないタイミングで書き込みと読み取りの負荷が急増します。現在はピーク時の負荷に合わせて大きな DB インスタンスクラスを選んでいるため、大半の時間はリソースが余っています。この企業は、アプリケーションを変更せずに、負荷に応じて数秒でキャパシティを調整し、実際に使用したキャパシティに応じた料金だけを支払うことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Aurora レプリカを追加し、Aurora Auto Scaling で CPU 使用率にもとづいてレプリカの数を増減させる。ライターインスタンスは現在のインスタンスクラスのまま運用する。","現在の DB インスタンスクラスに対して、3 年間のリザーブドインスタンスを購入する。ピーク時の負荷に備えて、インスタンスクラスは変更しない。","データを Amazon DynamoDB のオンデマンドキャパシティモードのテーブルに移行し、読み取りと書き込みのリクエスト数に応じた料金だけを支払うようにする。","クラスターの DB インスタンスを Aurora Serverless v2 に変更する。最小と最大の Aurora キャパシティユニット（ACU）を負荷の範囲に合わせて設定する。"],"answer":[3],"why":["レプリカの増減で読み取りは分散できるが、書き込みはライターだけが処理するため、ライターはピークに合わせたサイズのままになる。","時間あたりの料金は下がるが、ピークに合わせた大きなインスタンスの料金を常に支払い続けることになる。負荷に応じた調整もできない。","MySQL 互換のリレーショナルデータベースから DynamoDB への移行は、アプリケーションの大幅な変更が必要になる。","Aurora Serverless v2 は負荷に応じて ACU 単位で細かく、すばやく拡張・縮小し、書き込みを処理するライターにも使える。MySQL 互換のままなので、アプリケーションの変更も不要である。"],"explain":"決め手は「予測できない急増」「書き込みも急増」「数秒でキャパシティを調整」「アプリケーションを変更しない」である。Aurora Serverless v2 はライターとリーダーのどちらにも使え、負荷に合わせて ACU を細かく増減させるため、ピークに合わせたプロビジョニングによる無駄がなくなる。Aurora レプリカの Auto Scaling は読み取りしか分散できない点に注意する。","point":"負荷の変動が大きく予測できない Aurora は Serverless v2。ライターも含めて ACU 単位ですばやくスケールする。","diagram":null},{"id":"d4-11","domain":4,"topic":"DynamoDB","type":"single","stem":"あるオンラインゲーム企業は、プレイヤーのセッション記録を Amazon DynamoDB のテーブルに保存しており、テーブルはオンデマンドキャパシティモードで運用しています。数か月分のメトリクスを分析したところ、料金の大部分を書き込み要求が占めていました。トラフィックは時間帯に応じてなだらかに増減するだけで、急激なスパイクはありません。また、同じ記録が繰り返し読み取られることはほとんどありません。この企業は、性能を落とさずに DynamoDB のコストを削減することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["テーブルクラスを DynamoDB Standard-IA に変更して、テーブルのストレージ料金を下げる。キャパシティモードはオンデマンドのまま維持する。","DynamoDB Accelerator（DAX）クラスターをテーブルの前に作成する。アプリケーションからの読み取りと書き込みを、すべて DAX 経由で行うように変更する。","テーブルをプロビジョンドキャパシティモードに変更する。DynamoDB Auto Scaling でターゲット使用率を設定し、時間帯に合わせてキャパシティを増減させる。","テーブルをグローバルテーブルに変換し、別のリージョンのレプリカにも書き込みを分散させる。キャパシティモードはオンデマンドのまま維持する。"],"answer":[2],"why":["Standard-IA はストレージ料金が下がる代わりに、読み書きの料金が上がる。料金の大部分が書き込みであるため、かえってコストが増える。","DAX は読み取りをキャッシュするもので、書き込みはテーブルにそのまま書き込まれる。同じ記録の再読み取りも少ないため効果がなく、クラスターの料金が増える。","予測可能でなだらかなトラフィックは、プロビジョンドキャパシティと Auto Scaling で使用量に合わせた容量を用意する方がオンデマンドより安い。一定の基礎量にはリザーブドキャパシティも使える。","グローバルテーブルは複数リージョンでの可用性や低レイテンシーのための機能で、レプリカへの書き込みの料金が増える。コスト削減にはならない。"],"explain":"決め手は「トラフィックがなだらかで予測可能」「急激なスパイクはない」である。オンデマンドモードは予測できない負荷や新しいワークロードに向くが、予測可能な負荷ではプロビジョンドモードと Auto Scaling の方が費用対効果が高い。Standard-IA テーブルクラスは、保存データが多く読み書きが少ないテーブル向けである。DAX は読み取りが中心で、同じ項目が繰り返し読まれるワークロードで効果を発揮する。","point":"予測可能な負荷の DynamoDB はプロビジョンドモード＋Auto Scaling（基礎量はリザーブドキャパシティ）。予測できない負荷はオンデマンドモード。","diagram":null},{"id":"d4-12","domain":4,"topic":"ElastiCache","type":"single","stem":"ある EC 事業者は、Amazon EC2 上の Web アプリケーションと Amazon RDS for PostgreSQL のデータベースで商品カタログサイトを運用しています。アクセスの大半は、同じ商品詳細ページを表示するための同一のクエリです。商品情報の更新は 1 日に数回で、最大 5 分古い情報が表示されても問題ありません。DB インスタンスの CPU 使用率が高いため、より大きなインスタンスクラスへの変更が検討されています。この企業は、データベースの負荷を下げてより小さなインスタンスクラスを使えるようにし、読み取りのレイテンシーも改善することを求めています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon ElastiCache のキャッシュを作成する。アプリケーションに遅延読み込みを実装し、商品情報を 5 分の TTL でキャッシュする。","リードレプリカを 3 つ作成し、アプリケーションの読み取りクエリをレプリカに分散させる。プライマリインスタンスは現在のサイズのまま運用する。","DB インスタンスをマルチ AZ DB インスタンス配置に変更し、スタンバイインスタンスに読み取りクエリを振り分けてプライマリの負荷を下げる。","DB インスタンスをより大きなインスタンスクラスに変更し、3 年間のリザーブドインスタンスを購入して時間あたりの料金を下げる。"],"answer":[0],"why":["同じクエリの結果をキャッシュから返すことで DB への読み取りが大きく減り、インスタンスクラスを小さくできる。インメモリのキャッシュなので、読み取りのレイテンシーも下がる。","負荷は分散できるが、レプリカごとに DB インスタンスの料金がかかる。同じ結果を何度も DB で処理する無駄も残る。","マルチ AZ DB インスタンス配置のスタンバイは読み取りに使えない。可用性は上がるが、負荷は下がらない。","負荷には耐えられるが、より大きなインスタンスの料金を払い続けることになる。より小さなインスタンスクラスにするという要件とも逆である。"],"explain":"決め手は「同一のクエリが大半」「最大 5 分古くてもよい」「より小さなインスタンスクラスにしたい」である。繰り返し読まれるデータはキャッシュに向いており、TTL を許容できる鮮度に合わせれば整合性の要件も満たせる。リードレプリカでも負荷は分散できるが、レプリカごとに DB インスタンスの料金がかかり、キャッシュより費用対効果が低い。","point":"同じデータが繰り返し読まれ、多少古くてもよいなら ElastiCache でキャッシュして DB を小さくする。マルチ AZ DB インスタンス配置のスタンバイは読み取りに使えない。","diagram":{"caption":"正解の構成: ElastiCache で読み取りをキャッシュして DB の負荷を下げる","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":2,"h":2}],"nodes":[{"id":"users","label":"利用者","sub":"商品詳細を閲覧","kind":"client","c":0,"r":0},{"id":"app","label":"EC2","sub":"Web アプリケーション","kind":"compute","c":1,"r":0},{"id":"cache","label":"ElastiCache","sub":"TTL 5 分","kind":"database","c":2,"r":0},{"id":"rds","label":"RDS PostgreSQL","sub":"小さなクラスに変更","kind":"database","c":1,"r":1}],"edges":[{"from":"users","to":"app"},{"from":"app","to":"cache","label":"まず参照"},{"from":"app","to":"rds","label":"ミス時のみ","style":"dashed"}]}},{"id":"d4-13","domain":4,"topic":"VPC エンドポイント","type":"multi","stem":"ある企業は、2 つの AZ のプライベートサブネットで Amazon ECS on AWS Fargate のタスクを実行しています。コンテナイメージは Amazon ECR に保存されており、デプロイやスケールアウトのたびに大きなイメージがプルされます。プライベートサブネットからの通信は NAT ゲートウェイを経由しています。コストを分析したところ、NAT ゲートウェイのデータ処理料金が大きく、その大部分が ECR からのイメージのプルによるものでした。ソリューションアーキテクトは、イメージのプルがインターネットへの経路を通らないようにし、NAT ゲートウェイのデータ処理料金を削減する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["ECR 用のインターフェイス型 VPC エンドポイント（ecr.api と ecr.dkr）を各 AZ のプライベートサブネットに作成し、プライベート DNS を有効にする。","NAT ゲートウェイを、スポットインスタンスで起動した NAT インスタンスに置き換える。各 AZ のルートテーブルのデフォルトルートを NAT インスタンスに向ける。","ECR のプルスルーキャッシュルールを作成し、タスクがキャッシュからイメージを取得するようにタスク定義のイメージ URI を変更する。","Amazon S3 用のゲートウェイ型 VPC エンドポイントを作成し、各 AZ のプライベートサブネットのルートテーブルに関連付ける。","Egress-only インターネットゲートウェイを作成し、プライベートサブネットから ECR への通信をそのゲートウェイ経由に変更する。"],"answer":[0,3],"why":["ECR の API やイメージのマニフェストの取得は、インターフェイス型エンドポイント経由で VPC 内に閉じられる。エンドポイントのデータ処理の単価は NAT ゲートウェイより低い。","NAT ゲートウェイのデータ処理料金はなくなるが、通信はインターネットへの経路を通ったままである。スポットの中断で通信が止まるおそれがあり、NAT インスタンスの運用負荷も大きい。","プルスルーキャッシュは上流のレジストリのイメージをプライベートレジストリにキャッシュする機能で、VPC から ECR への通信経路は変わらない。","ECR のイメージレイヤーは Amazon S3 に保存されており、レイヤーのダウンロードは S3 への通信になる。S3 用のゲートウェイ型エンドポイントは追加料金なしで、この通信を NAT ゲートウェイから外せる。","Egress-only インターネットゲートウェイは IPv6 の送信専用の通信に使うもので、通信はインターネットへの経路を通る。"],"explain":"ECR からイメージをプルすると、ECR の API（ecr.api）とレジストリ（ecr.dkr）への通信に加えて、イメージレイヤーを取得する Amazon S3 への通信が発生する。そのため、ECR 用のインターフェイス型エンドポイントと S3 用のゲートウェイ型エンドポイントの両方が必要になる。どちらか一方だけでは、残りの通信が NAT ゲートウェイを経由し続ける。インターフェイス型エンドポイントには時間料金とデータ処理料金がかかるが、大量のプルがある環境では NAT ゲートウェイを経由するより安くなりやすい。","point":"プライベートサブネットからの ECR のプルは、ecr.api・ecr.dkr のインターフェイス型エンドポイントと、レイヤー取得用の S3 ゲートウェイ型エンドポイントをセットで作る。","diagram":{"caption":"正解の構成: ECR と S3 の両方のエンドポイントでプルする","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":2},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ecs","label":"ECS タスク","sub":"Fargate","kind":"container","c":0,"r":0},{"id":"ifep","label":"ECR 用 VPCE","sub":"インターフェイス型","kind":"network","c":1,"r":0},{"id":"ecr","label":"Amazon ECR","sub":"API・マニフェスト","kind":"container","c":2,"r":0},{"id":"gwep","label":"S3 用 VPCE","sub":"ゲートウェイ型","kind":"network","c":1,"r":1},{"id":"s3","label":"Amazon S3","sub":"イメージレイヤー","kind":"storage","c":2,"r":1}],"edges":[{"from":"ecs","to":"ifep"},{"from":"ifep","to":"ecr","label":"ecr.api / dkr"},{"from":"ecs","to":"gwep","label":"ルート経由"},{"from":"gwep","to":"s3","label":"レイヤー取得"}]}},{"id":"d4-14","domain":4,"topic":"データ転送料金","type":"single","stem":"ある企業は、3 つの AZ にまたがる VPC で Web アプリケーションを運用しています。プライベートサブネットの Amazon EC2 インスタンスは、外部の SaaS の API から大量のデータを定期的にダウンロードしています。インターネットへの通信には、AZ-a のパブリックサブネットに作成した 1 つの NAT ゲートウェイを使っており、すべてのプライベートサブネットのルートテーブルがこの NAT ゲートウェイを指しています。コストを分析したところ、NAT ゲートウェイの料金に加えて、AZ 間のデータ転送料金が大きいことがわかりました。ソリューションアーキテクトは、AZ 間のデータ転送料金を削減し、1 つの AZ の障害がほかの AZ の通信に影響しないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["AZ-a の NAT ゲートウェイを、より大きなインスタンスタイプの NAT インスタンスに置き換える。すべてのプライベートサブネットのルートテーブルを NAT インスタンスに向ける。","各 AZ のパブリックサブネットに NAT ゲートウェイを作成する。各 AZ のプライベートサブネットのルートテーブルを、同じ AZ の NAT ゲートウェイに向ける。","各 AZ のプライベートサブネットのルートテーブルで、デフォルトルートの宛先をインターネットゲートウェイに変更する。AZ-a の NAT ゲートウェイは削除する。","AZ-a のパブリックサブネットに 2 つ目の NAT ゲートウェイを作成する。プライベートサブネットのルートテーブルを 2 つの NAT ゲートウェイに分けて割り当てる。"],"answer":[1],"why":["AZ-b と AZ-c からの通信は AZ-a を経由したままなので、AZ 間のデータ転送料金は減らない。AZ-a の障害の影響も残り、NAT インスタンスの管理も必要になる。","各 AZ の通信が同じ AZ の NAT ゲートウェイを通るため、AZ 間のデータ転送が発生しない。1 つの AZ に障害が起きても、ほかの AZ の通信は影響を受けない。","パブリック IP アドレスを持たないインスタンスは、インターネットゲートウェイへのルートだけでは外部と通信できない。サブネットがパブリックになり、セキュリティ上も望ましくない。","NAT ゲートウェイがどちらも AZ-a にあるため、AZ 間のデータ転送料金は減らず、AZ-a の障害の影響も残る。"],"explain":"決め手は「AZ 間のデータ転送料金」と「1 つの AZ の障害がほかの AZ に影響しない」である。ゾーン単位の NAT ゲートウェイは作成した AZ の中で動作するため、別の AZ のインスタンスが使うと AZ 間のデータ転送料金がかかり、その AZ の障害の影響も受ける。AZ ごとに NAT ゲートウェイを置き、各 AZ のルートテーブルで同じ AZ の NAT ゲートウェイを指定するのが基本の構成である。なお、2025 年 11 月からは、1 つで複数の AZ に自動的に展開されるリージョナルモードの NAT ゲートウェイも選択できる。","point":"ゾーン単位の NAT ゲートウェイは AZ ごとに作り、各 AZ のルートテーブルは同じ AZ の NAT を指す。別の AZ の NAT を使うと AZ 間の転送料金がかかり、障害の影響も受ける。","diagram":{"caption":"正解の構成: AZ ごとに NAT ゲートウェイを置く","cols":3,"rows":3,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":3},{"label":"AZ-a","kind":"az","c":0,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":0,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":0,"r":2,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":1,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":1,"r":2,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":2,"r":1,"w":1,"h":2},{"label":"パブリック","kind":"subnet-public","c":2,"r":1,"w":1,"h":1},{"label":"プライベート","kind":"subnet-private","c":2,"r":2,"w":1,"h":1}],"nodes":[{"id":"igw","label":"Internet GW","sub":"SaaS の API へ","kind":"network","c":1,"r":0},{"id":"nata","label":"NAT GW","sub":"AZ-a 用","kind":"network","c":0,"r":1},{"id":"natb","label":"NAT GW","sub":"AZ-b 用","kind":"network","c":1,"r":1},{"id":"natc","label":"NAT GW","sub":"AZ-c 用","kind":"network","c":2,"r":1},{"id":"ec2a","label":"EC2","sub":"AZ-a","kind":"compute","c":0,"r":2},{"id":"ec2b","label":"EC2","sub":"AZ-b","kind":"compute","c":1,"r":2},{"id":"ec2c","label":"EC2","sub":"AZ-c","kind":"compute","c":2,"r":2}],"edges":[{"from":"ec2a","to":"nata","label":"同じ AZ"},{"from":"ec2b","to":"natb","label":"同じ AZ"},{"from":"ec2c","to":"natc","label":"同じ AZ"},{"from":"nata","to":"igw"},{"from":"natb","to":"igw"},{"from":"natc","to":"igw"}]}},{"id":"d4-15","domain":4,"topic":"CloudFront","type":"single","stem":"あるニュースサイトの運営企業は、記事に掲載する画像と動画を 1 つのリージョンの Amazon S3 バケットに保存し、パブリックな S3 の URL で世界中の読者に直接配信しています。同じファイルが短時間に多数の読者から繰り返しリクエストされるため、S3 からインターネットへのデータ転送料金とリクエスト料金が増え続けています。また、遠くの地域の読者からは表示が遅いという苦情が寄せられています。この企業は、配信コストを削減して表示を速くし、さらに S3 バケットへの直接のアクセスを禁止することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["バケットで S3 Transfer Acceleration を有効にし、記事内のファイルの URL を高速化エンドポイントに変更する。読者はエッジロケーションを経由してファイルを取得する。","S3 クロスリージョンレプリケーションで、別の 2 つのリージョンにバケットを複製する。読者の地域ごとに、記事内の URL を最も近いバケットに切り替える。","S3 バケットをオリジンとする Amazon CloudFront ディストリビューションを作成し、オリジンアクセスコントロール（OAC）を設定する。バケットのパブリックアクセスはブロックする。","S3 の静的ウェブサイトエンドポイントをカスタムオリジンとする Amazon CloudFront ディストリビューションを作成する。バケットのパブリックな読み取りアクセスは引き続き許可しておく。"],"answer":[2],"why":["Transfer Acceleration は長距離の転送を高速化する機能で、キャッシュはしない。通常のデータ転送料金に加えて高速化の料金がかかり、バケットへの直接アクセスも残る。","近いバケットから配信できるが、保存とレプリケーションのコストが増える。インターネットへのデータ転送料金とリクエスト料金も減らず、直接アクセスも残る。","CloudFront がエッジロケーションでキャッシュするため、S3 へのリクエストが減り、表示も速くなる。S3 から CloudFront へのデータ転送には料金がかからず、OAC で S3 への直接アクセスを禁止できる。","キャッシュの効果は得られるが、ウェブサイトエンドポイントには OAC を使えず、バケットをパブリックにしたままになる。S3 への直接アクセスを禁止するという要件を満たさない。"],"explain":"決め手は「同じファイルが繰り返しリクエストされる」「世界中の読者」「S3 への直接アクセスを禁止」である。CloudFront はエッジロケーションでコンテンツをキャッシュし、オリジンへのリクエストとデータ転送を減らす。AWS のオリジンから CloudFront へのデータ転送には料金がかからず、オリジンアクセスコントロール（OAC）を使えば S3 バケットを非公開にしたまま CloudFront 経由だけで配信できる。Transfer Acceleration や AWS Global Accelerator にはキャッシュの機能がない点で区別する。","point":"繰り返し読まれる静的コンテンツの配信コスト削減は CloudFront（S3 から CloudFront への転送は無料）。S3 を非公開にするなら REST エンドポイント＋OAC。","diagram":{"caption":"正解の構成: CloudFront でキャッシュし、OAC で S3 を非公開にする","cols":3,"rows":1,"groups":[{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"users","label":"世界中の読者","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"エッジでキャッシュ","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"非公開・OAC のみ許可","kind":"storage","c":2,"r":0}],"edges":[{"from":"users","to":"cf","label":"HTTPS"},{"from":"cf","to":"s3","label":"ミス時のみ取得"}]}},{"id":"d4-16","domain":4,"topic":"コスト管理","type":"multi","stem":"ある企業は、1 つの AWS アカウントを 3 つのプロジェクトチームで共有しています。各リソースには、プロジェクト名を値とする Project タグがすでに付けられています。財務部門は、プロジェクトごとの月間コストを AWS Cost Explorer で確認できるようにすることを求めています。また、その月のコストの予測額がプロジェクトごとに決めた予算を超えそうな場合に、各プロジェクトのリーダーへ E メールで通知することも求めています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たす必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Amazon CloudWatch の請求アラームを Project タグの値ごとに作成する。EstimatedCharges メトリクスがプロジェクトの予算を超えたら Amazon SNS で通知する。","AWS Trusted Advisor のコスト最適化チェックを有効にする。週次のレポートを各プロジェクトのリーダーに E メールで送信するように設定する。","AWS Billing and Cost Management コンソールで、Project タグをユーザー定義のコスト配分タグとして有効にする。","Cost and Usage Report を Amazon S3 に出力する。Amazon Athena でプロジェクトごとのコストを集計し、AWS Lambda 関数で予算の超過を判定して通知する。","AWS Budgets で、Project タグでフィルターしたコスト予算をプロジェクトごとに作成する。予測額のしきい値でアラートを設定し、各リーダーを通知先にする。"],"answer":[2,4],"why":["請求アラームの EstimatedCharges メトリクスはサービスやリンクアカウントの単位でしか分けられず、タグの値ごとのアラームは作成できない。予測額にもとづく通知もできない。","Trusted Advisor はコスト最適化の機会を示すが、プロジェクトごとの予算に対して予測額を監視し、通知する機能はない。","リソースに付けたタグは、コスト配分タグとして有効にすることで、Cost Explorer や AWS Budgets でのフィルターやグループ化に使えるようになる。","要件は満たせるが、集計のクエリと通知の仕組みを自分で作って運用する必要があり、運用上のオーバーヘッドが大きい。","AWS Budgets はタグでフィルターした予算を作成でき、実績額だけでなく予測額がしきい値を超えそうな時点で E メールや Amazon SNS で通知できる。"],"explain":"タグをコストの集計に使うには、まずコスト配分タグとして有効にする必要がある。有効にしたタグは Cost Explorer のグループ化やフィルターに使え、AWS Budgets でもタグごとの予算を作成できる。Budgets は予測額にもとづくアラートに対応しているため、予算を超えそうな時点で通知できる。CUR と Athena でも実現できるが、「運用上のオーバーヘッドを最小限に」に合わない。","point":"タグ別のコストの可視化はコスト配分タグの有効化が前提。予算に対する実績・予測の通知は AWS Budgets。","diagram":null},{"id":"d4-17","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、ステートレスな Web アプリケーションを Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。平常時は 4 台、繁忙期は最大 20 台で稼働します。一部のインスタンスが突然終了してもアプリケーションが動き続けることは問題ありませんが、サービスが停止することは避けなければなりません。ソリューションアーキテクトは、可用性を保ちながらコンピューティングコストを最小限に抑える必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの起動テンプレートでスポットインスタンスだけを使うように設定する。単一のインスタンスタイプを指定し、すべての台数をスポットで確保する。","混合インスタンスポリシーを使う Auto Scaling グループを作成する。オンデマンドの基準容量を平常時の台数に設定し、
