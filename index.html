ー、ツールを使い続けながら、フルマネージドなデータベースサービスへ移行したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Aurora","Amazon Neptune","Amazon DocumentDB","Amazon RDS for MySQL"],"answer":[2],"why":["MySQL と PostgreSQL に互換性があるリレーショナルデータベース。MongoDB 用のコードやドライバーはそのまま使えない。","グラフデータベースのサービス。ドキュメント形式の JSON データを MongoDB のように扱う用途ではない。","MongoDB と互換性のある、フルマネージドなドキュメントデータベース。既存の MongoDB のコード、ドライバー、ツールを使い続けられる。","MySQL をマネージドで提供するサービス。リレーショナルデータベースであり、MongoDB のアプリケーションはそのままでは動かない。"],"explain":"「MongoDB」「既存のコードやドライバーを使い続ける」が決め手で、Amazon DocumentDB を選ぶ。JSON のようなドキュメントを柔軟なスキーマで保存する用途に向く。DynamoDB もドキュメントを扱えるが、MongoDB との互換性がある点が DocumentDB の特徴である。","point":"MongoDB 互換のドキュメントデータベースは Amazon DocumentDB。","diagram":null},{"id":"clf-d3-40","domain":3,"topic":"データベース","type":"multi","stem":"ある企業は、データベースを Amazon RDS ではなく、Amazon EC2 インスタンスにお客様がインストールして管理する方式で運用することを検討しています。この方式を選ぶ理由として適切なものはどれですか。","choices":["データベースサーバーの OS に管理者としてアクセスし、設定を細かく変更する必要がある。","データベースソフトウェアのパッチ適用を、AWS にすべて任せたい。","RDS が対応していないデータベースソフトウェアやバージョンを使う必要がある。","バックアップの取得と復元の運用を、AWS に自動化してほしい。","運用上のオーバーヘッドを最小限に抑えたい。"],"answer":[0,2],"why":["RDS では OS へのアクセスが制限される。OS や DB エンジンに完全な制御が必要なら、EC2 上で自己管理する選択肢になる。","パッチ適用の自動化は RDS の利点。EC2 上の自己管理では、お客様がパッチ適用を行う。","RDS が対応しないエンジンやバージョン、特殊な構成が必要な場合は、EC2 に自分でインストールして運用する。","バックアップの自動化は RDS の利点。EC2 上の自己管理では、お客様が仕組みを用意して運用する。","マネージドサービスである RDS を選ぶ理由。EC2 上の自己管理は運用の負担が大きくなる。"],"explain":"RDS は運用作業を AWS に任せられる代わりに、OS やデータベースエンジンへのアクセスが制限される。OS への管理者アクセスや、RDS が提供しない構成が必要な場合は、EC2 上の自己管理が選択肢になる。それ以外の、パッチ適用・バックアップ・運用負担の軽減が目的なら RDS が適する。","point":"OS・エンジンへの完全な制御が必要なら EC2 上の自己管理。運用負担を減らしたいなら RDS。","diagram":null},{"id":"clf-d3-41","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、オンプレミスのデータベースを AWS に移行します。移行中も業務アプリケーションがソースデータベースを使い続けられるよう、ダウンタイムを最小限にしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["AWS Snowball Edge","AWS DMS","AWS DataSync","AWS Storage Gateway"],"answer":[1],"why":["物理デバイスでデータを持ち込む移行サービス。データベースを稼働させたまま継続的に変更を反映する用途のサービスではない。","データベースを AWS へ移行するサービス。ソースデータベースを稼働させたまま移行でき、ダウンタイムを最小限に抑えられる。","ファイルやオブジェクトのデータを転送するサービス。データベースの移行と変更の継続的な反映を目的としたものではない。","オンプレミスから AWS のストレージを利用するためのハイブリッドストレージサービス。データベースの移行ツールではない。"],"explain":"「データベースを移行」「ソースデータベースを稼働させたまま」「ダウンタイムを最小限」が決め手で、AWS DMS を選ぶ。DMS は同じエンジン間の移行だけでなく、異なるエンジン間の移行（例: Oracle から Aurora）にも使える。","point":"稼働中のデータベースをダウンタイム最小で移行するなら AWS DMS。","diagram":null},{"id":"clf-d3-42","domain":3,"topic":"データベース","type":"single","stem":"ある企業は、世界中のプレイヤーが利用するモバイルゲームを運営しています。ゲームのデータを複数のリージョンに置き、各リージョンのプレイヤーが低レイテンシーで読み書きできるようにしたいと考えています。フルマネージドな NoSQL データベースを使う場合、この要件を満たす機能はどれですか。","choices":["Amazon RDS のマルチ AZ 配置","Amazon DynamoDB グローバルテーブル","Amazon ElastiCache のクラスター","Amazon Redshift のスナップショットのリージョン間コピー"],"answer":[1],"why":["マルチ AZ 配置は、同じリージョン内の別の AZ にスタンバイを置いて可用性を高める機能。複数のリージョンで読み書きする用途には使わない。","DynamoDB グローバルテーブルは、選んだ複数のリージョンにテーブルを自動でレプリケートし、各リージョンで読み書きできるようにする。","ElastiCache はインメモリキャッシュ。データベースの読み取りを高速化するが、複数のリージョンで読み書きする NoSQL データベースの機能ではない。","Amazon Redshift は分析用のデータウェアハウス。アプリケーションのデータを各リージョンで読み書きする用途には使わない。"],"explain":"決め手は「複数のリージョン」「低レイテンシーで読み書き」「フルマネージドな NoSQL」。DynamoDB グローバルテーブルは複数リージョンのテーブルを自動で同期し、ユーザーに近いリージョンで読み書きできるようにする。マルチ AZ は 1 つのリージョンの中で可用性を高める機能で、目的が違う。","point":"複数のリージョンで読み書きできる NoSQL は DynamoDB グローバルテーブル。1 つのリージョン内の可用性はマルチ AZ。","diagram":null},{"id":"clf-d3-43","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、同じリージョンにある 2 つの VPC 上のアプリケーション同士を、インターネットを経由せずにプライベート IP アドレスで通信させたいと考えています。この要件を満たす機能はどれですか。","choices":["インターネットゲートウェイ","VPC ピアリング接続","NAT ゲートウェイ","AWS Direct Connect"],"answer":[1],"why":["VPC とインターネットの間の通信を可能にするコンポーネント。VPC 同士をプライベートに接続するものではない。","2 つの VPC の間にネットワーク接続を作り、プライベート IP アドレスで通信できるようにする機能。AWS のネットワーク内で完結し、インターネットを経由しない。","プライベートサブネットのリソースがインターネットへ送信する通信を中継するコンポーネント。VPC 同士の接続には使わない。","オンプレミスと AWS を専用線で結ぶサービス。同じリージョン内の VPC 同士をつなぐ目的のものではない。"],"explain":"「2 つの VPC」「インターネットを経由せず」「プライベート IP アドレス」から VPC ピアリングを選ぶ。ピアリングは 1 対 1 の接続で、接続する VPC が増えると接続数も増える。数多くの VPC をまとめて接続する場合は AWS Transit Gateway が向く。","point":"VPC 同士を 1 対 1 でプライベートに接続するのが VPC ピアリング。多数の VPC のハブは Transit Gateway。","diagram":null},{"id":"clf-d3-44","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、VPC のパブリックサブネットに Web サーバーを配置しました。インターネット上のユーザーがこの Web サーバーにアクセスできるようにするために、VPC にアタッチするコンポーネントはどれですか。","choices":["インターネットゲートウェイ","NAT ゲートウェイ","仮想プライベートゲートウェイ","VPC ピアリング接続"],"answer":[0],"why":["VPC とインターネットの間で双方向の通信を可能にするコンポーネント。サブネットのルートテーブルにこれへの経路があるサブネットがパブリックサブネットになる。","プライベートサブネットのインスタンスが外部へ送信する通信を中継するもの。インターネット側からの接続を受け付ける用途ではない。","VPN 接続を終端するための VPC 側のゲートウェイ。インターネット上のユーザーからのアクセスには使わない。","別の VPC とプライベートに接続する機能。インターネットのユーザーとの通信には関係しない。"],"explain":"インターネットとの双方向の通信を担うのはインターネットゲートウェイで、VPC にアタッチし、サブネットのルートテーブルに経路を追加することで、そのサブネットがパブリックサブネットになる。Web サーバー自身にもパブリック IP アドレスなどが必要になる。NAT ゲートウェイは送信専用の中継で、役割が異なる。","point":"パブリックサブネットとインターネットの双方向通信にはインターネットゲートウェイ。ルートテーブルへの経路も必要。","diagram":{"caption":"正解の構成: インターネットゲートウェイ経由でパブリックサブネットへ","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":3,"h":1},{"label":"パブリックサブネット","kind":"subnet-public","c":3,"r":0,"w":1,"h":1}],"nodes":[{"id":"user","label":"ユーザー","sub":"インターネット","kind":"client","c":0,"r":0},{"id":"igw","label":"インターネットGW","sub":"VPC にアタッチ","kind":"network","c":1,"r":0},{"id":"rt","label":"ルートテーブル","sub":"0.0.0.0/0 を IGW へ","kind":"network","c":2,"r":0},{"id":"web","label":"Web サーバー","sub":"EC2","kind":"compute","c":3,"r":0}],"edges":[{"from":"user","to":"igw","label":"HTTP/HTTPS","both":true},{"from":"igw","to":"rt","both":true},{"from":"rt","to":"web","both":true}]}},{"id":"clf-d3-45","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、VPC のプライベートサブネットにあるアプリケーションサーバーが、インターネット上のサイトから OS のパッチをダウンロードできるようにしたいと考えています。ただし、インターネット側からサーバーへ接続を開始されることは避けたいと考えています。この要件を満たすものはどれですか。","choices":["パブリックサブネットのインターネットゲートウェイ","VPC ピアリング接続","パブリックサブネットの NAT ゲートウェイ","プライベートサブネットのネットワーク ACL"],"answer":[2],"why":["インターネットとの双方向の通信を可能にする。サーバーを直接公開する構成になり、インターネット側から接続を開始される余地が生じる。","別の VPC とプライベートに接続する機能で、インターネット上のサイトへの通信は中継できない。","プライベートサブネットのリソースからインターネットへの送信を中継し、インターネット側からの接続開始は受け付けない。パブリックサブネットに配置して使う。","サブネット単位で通信を許可・拒否するファイアウォール機能。インターネットへの経路を作るものではない。"],"explain":"「プライベートサブネットから外へ」「外から接続されない」が決め手で、NAT ゲートウェイを選ぶ。NAT ゲートウェイはパブリックサブネットに置き、プライベートサブネットのルートテーブルの送信先に指定する。通信は内側から始めた分だけが通り、外から始まる接続は届かない。","point":"プライベートサブネットからの送信専用のインターネットアクセスは NAT ゲートウェイ。パブリックサブネットに置く。","diagram":{"caption":"正解の構成: NAT ゲートウェイ経由でプライベートサブネットから外部へ送信","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":1},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":1,"h":1},{"label":"パブリックサブネット","kind":"subnet-public","c":1,"r":0,"w":1,"h":1}],"nodes":[{"id":"app","label":"アプリ EC2","sub":"パッチを取得","kind":"compute","c":0,"r":0},{"id":"nat","label":"NAT ゲートウェイ","sub":"送信を中継","kind":"network","c":1,"r":0},{"id":"igw","label":"インターネットGW","kind":"network","c":2,"r":0},{"id":"net","label":"インターネット","sub":"パッチ配布サイト","kind":"client","c":3,"r":0}],"edges":[{"from":"app","to":"nat","label":"送信"},{"from":"nat","to":"igw"},{"from":"igw","to":"net"}]}},{"id":"clf-d3-46","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、Amazon EC2 インスタンスごとに、許可する受信ポートと送信元 IP アドレスを設定したいと考えています。許可した受信通信への戻りの通信は、個別のルールを書かずに自動的に許可されるようにします。この要件を満たす機能はどれですか。","choices":["ネットワーク ACL","ルートテーブル","AWS Network Firewall","セキュリティグループ"],"answer":[3],"why":["サブネット単位で動作するステートレスなファイアウォール機能。戻りの通信にも別途ルールが必要で、インスタンスごとの設定にはならない。","サブネットからの通信の経路（ネクストホップ）を決めるもの。通信を許可・拒否する機能ではない。","VPC 全体のトラフィックを検査・フィルタリングするマネージドなファイアウォールサービス。インスタンス単位の許可ルールを設定する基本機能とは異なる。","インスタンス（ネットワークインターフェイス）単位で動作する仮想ファイアウォール。許可ルールだけを設定し、ステートフルなので許可した通信の戻りは自動的に許可される。"],"explain":"「インスタンスごと」「戻りの通信は自動で許可」は、インスタンス単位で動作するステートフルなセキュリティグループの特徴。セキュリティグループは許可ルールのみ設定でき、ネットワーク ACL はサブネット単位でステートレスのため、戻りの通信にも明示的なルールが必要になる。","point":"セキュリティグループはインスタンス単位・ステートフル・許可のみ。ネットワーク ACL はサブネット単位・ステートレス。","diagram":null},{"id":"clf-d3-47","domain":3,"topic":"ネットワーク","type":"multi","stem":"VPC のネットワーク ACL について、正しい説明はどれですか。","choices":["サブネット単位で適用される。","許可ルールのみを設定できる。","インスタンスにアタッチして適用する。","許可ルールと拒否ルールの両方を設定できる。","許可した通信の戻りを自動的に許可する。"],"answer":[0,3],"why":["ネットワーク ACL はサブネットに関連付けて、そのサブネットに出入りする通信を制御する。","許可ルールのみなのはセキュリティグループの特徴。ネットワーク ACL では拒否ルールも設定できる。","インスタンスにアタッチして使うのはセキュリティグループ。ネットワーク ACL はサブネットに関連付ける。","ルール番号の順に評価され、許可と拒否のどちらも書ける。特定の IP アドレスからの通信だけを拒否することもできる。","戻りの通信を自動で許可するのはステートフルなセキュリティグループ。ネットワーク ACL はステートレスで、戻りの通信にもルールが必要。"],"explain":"ネットワーク ACL は、サブネットの境界で通信を制御するステートレスなファイアウォール機能で、許可と拒否の両方のルールを設定できる。インスタンス単位で許可のみ・ステートフルなセキュリティグループと対にして覚える。両者は組み合わせて多層防御に使える。","point":"ネットワーク ACL はサブネット単位・ステートレス・拒否ルールも可。セキュリティグループはインスタンス単位・ステートフル。","diagram":null},{"id":"clf-d3-48","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、新しい Web サイト用のドメイン名を取得し、そのドメイン名をアプリケーションの IP アドレスに解決する DNS の設定も、同じ AWS のサービスで行いたいと考えています。この要件を満たすサービスはどれですか。","choices":["Amazon CloudFront","Amazon Route 53","AWS Global Accelerator","AWS Direct Connect"],"answer":[1],"why":["エッジロケーションのキャッシュでコンテンツを配信する CDN サービス。ドメインの登録や DNS の管理が主な役割ではない。","ドメイン名の登録と、DNS によるドメイン名の名前解決、ヘルスチェックなどを提供するサービス。ドメイン取得と DNS 設定を 1 つのサービスで行える。","固定の IP アドレスを使って AWS のグローバルネットワーク経由でトラフィックを誘導するサービス。ドメインの登録は行わない。","オンプレミスと AWS を専用線で接続するサービス。DNS とは関係がない。"],"explain":"「ドメイン名の取得」と「DNS の設定」をまとめて行えるのは Amazon Route 53。Route 53 は可用性の高いマネージドな DNS サービスで、ドメイン登録、ホストゾーンでのレコード管理、ヘルスチェックを提供する。","point":"ドメイン登録と DNS の名前解決は Amazon Route 53。ヘルスチェックやルーティングポリシーも備える。","diagram":null},{"id":"clf-d3-49","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、東京とバージニア北部の両方のリージョンでアプリケーションを稼働しています。ユーザーからの DNS クエリに対して、ネットワークのレイテンシーが最も低いリージョンのエンドポイントを返したいと考えています。Amazon Route 53 のどのルーティングポリシーを使用しますか。","choices":["加重ルーティングポリシー","フェイルオーバールーティングポリシー","レイテンシールーティングポリシー","位置情報ルーティングポリシー"],"answer":[2],"why":["指定した比率で複数のリソースにクエリを振り分けるポリシー。レイテンシーの低さでは選ばない。新バージョンへの段階的な切り替えなどに使う。","プライマリが異常なときにセカンダリへ切り替えるポリシー。レイテンシーの低いリージョンを選ぶものではない。","ユーザーに対してレイテンシーが最も低いリージョンのリソースへ応答するポリシー。複数リージョンで稼働するアプリケーションの応答性能の向上に使う。","ユーザーの所在地に基づいて応答するポリシー。所在地が条件であり、レイテンシーの低さを基準にするものではない。"],"explain":"「レイテンシーが最も低いリージョン」が決め手で、レイテンシールーティングを選ぶ。位置情報ルーティングはユーザーの国や地域に基づいて応答を決めるため、コンテンツの地域制限などに向く。基準が地理か性能かで見分ける。","point":"性能で選ぶならレイテンシー、所在地で選ぶなら位置情報、障害時の切り替えならフェイルオーバー、比率なら加重。","diagram":null},{"id":"clf-d3-50","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、Amazon S3 バケットに保存している画像や動画などの静的コンテンツを、世界中のユーザーに低いレイテンシーで配信したいと考えています。コンテンツをユーザーに近い場所にキャッシュして配信できるサービスはどれですか。","choices":["Amazon CloudFront","AWS Global Accelerator","AWS Transit Gateway","Amazon Route 53"],"answer":[0],"why":["コンテンツをユーザーに近いエッジロケーションにキャッシュして配信する CDN サービス。S3 バケットをオリジンにでき、静的コンテンツの低レイテンシー配信に適する。","固定のエニーキャスト IP アドレスで AWS のグローバルネットワークへ誘導するサービス。コンテンツをキャッシュする機能はない。","多数の VPC とオンプレミスのネットワークを接続するハブ。コンテンツ配信のサービスではない。","DNS によるドメイン名の名前解決を行うサービス。コンテンツそのものをキャッシュして配信することはない。"],"explain":"「静的コンテンツ」「世界中のユーザー」「ユーザーに近い場所にキャッシュ」から Amazon CloudFront を選ぶ。キャッシュにより、オリジンへのアクセスが減り、応答時間の短縮とオリジンの負荷軽減につながる。Global Accelerator はキャッシュを持たない点が違い。","point":"コンテンツをキャッシュして配信する CDN は Amazon CloudFront。キャッシュを持たない Global Accelerator と区別する。","diagram":null},{"id":"clf-d3-51","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、世界中のユーザーが利用する TCP ベースのゲームサーバーを複数リージョンで運用しています。キャッシュできないトラフィックを、固定のエニーキャスト IP アドレスで受け付け、AWS のグローバルネットワーク経由で最適なリージョンへ誘導したいと考えています。この要件を満たすサービスはどれですか。","choices":["Amazon CloudFront","Amazon Route 53","AWS Direct Connect","AWS Global Accelerator"],"answer":[3],"why":["主にキャッシュ可能なコンテンツの配信に向く CDN サービス。固定のエニーキャスト IP アドレスで TCP や UDP のトラフィックを受け付ける用途の中心ではない。","DNS で名前解決を行うサービス。IP アドレスが固定されるわけではなく、トラフィックが AWS のグローバルネットワークを通るわけでもない。","オンプレミスと AWS を専用線で結ぶサービス。世界中のインターネットユーザーを誘導する用途ではない。","2 つの固定のエニーキャスト IP アドレスを提供し、最寄りのエッジロケーションから AWS のグローバルネットワーク経由で、正常なエンドポイントへ誘導する。TCP や UDP のトラフィックに使える。"],"explain":"「固定のエニーキャスト IP アドレス」「キャッシュできない TCP トラフィック」「グローバルネットワーク経由」から AWS Global Accelerator を選ぶ。キャッシュで配信を速める CloudFront と違い、経路の最適化と正常なエンドポイントへのフェイルオーバーで可用性と性能を高める。","point":"キャッシュ不要で固定 IP と経路の最適化が欲しいなら Global Accelerator。キャッシュ配信は CloudFront。","diagram":null},{"id":"clf-d3-52","domain":3,"topic":"ネットワーク","type":"single","stem":"ある企業は、数十の VPC とオンプレミスのネットワークを、中央のハブを介して相互に接続したいと考えています。VPC ごとにピアリング接続を個別に作成する運用上のオーバーヘッドを避けたいと考えています。この要件を満たすサービスはどれですか。","choices":["VPC ピアリング接続","AWS Transit Gateway","インターネットゲートウェイ","NAT ゲートウェイ"],"answer":[1],"why":["VPC 同士を 1 対 1 で接続する機能。数十の VPC を相互に接続するとピアリング接続の数が増え、管理が煩雑になる。","多数の VPC とオンプレミスのネットワークを 1 つのハブに接続し、ハブを介して相互に通信させられる。接続の管理を集約できる。","VPC とインターネットの間の通信を可能にするコンポーネント。VPC 同士やオンプレミスの接続のハブにはならない。","プライベートサブネットからインターネットへの送信を中継するコンポーネント。ネットワークの相互接続とは関係がない。"],"explain":"「数十の VPC とオンプレミス」「中央のハブ」「ピアリングを個別に作成しない」から AWS Transit Gateway を選ぶ。Transit Gateway はクラウドルーターとして働き、VPC や VPN、Direct Connect を 1 か所に集約して接続を簡素化する。","point":"多数の VPC とオンプレミスをつなぐハブは AWS Transit Gateway。1 対 1 の接続は VPC ピアリング。","diagram":null},{"id":"clf-d3-53","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、Amazon EC2 インスタンス上で稼働するリレーショナルデータベースのデータファイルを、低レイテンシーで読み書きできるブロックストレージに保存したいと考えています。インスタンスを停止してもデータは保持されている必要があります。この要件を満たすストレージはどれですか。","choices":["Amazon S3","EC2 インスタンスストア","Amazon S3 Glacier Flexible Retrieval","Amazon EBS"],"answer":[3],"why":["オブジェクトストレージ。ブロックデバイスとしてマウントし、データベースのデータファイルを置く用途には向かない。","ブロックストレージだが、インスタンスを停止または終了するとデータが失われる一時的なストレージ。データを保持する要件を満たさない。","長期アーカイブ向けのストレージクラス。取り出しに時間がかかり、データベースの読み書きには使えない。","EC2 にアタッチして使うブロックストレージ。低レイテンシーで読み書きでき、インスタンスを停止してもボリュームのデータは保持される。"],"explain":"「ブロックストレージ」「データベースのデータファイル」「停止してもデータを保持」から Amazon EBS を選ぶ。インスタンスストアも低レイテンシーのブロックストレージだが、停止や終了でデータが消えるため、永続化が必要なデータには向かない。","point":"EC2 の永続的なブロックストレージは EBS。インスタンスストアは停止・終了でデータが消える一時用。","diagram":null},{"id":"clf-d3-54","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、オンプレミスのアプリケーションが使うファイル共有はそのまま維持しつつ、バックアップなどのデータを AWS クラウドのストレージに保存したいと考えています。オンプレミスから既存の NFS や SMB のプロトコルで利用できるサービスはどれですか。","choices":["AWS Storage Gateway","Amazon EBS","Amazon EFS","AWS Backup"],"answer":[0],"why":["オンプレミスのアプリケーションから、NFS や SMB などの標準プロトコルで AWS のストレージを利用できるハイブリッドクラウドストレージのサービス。","EC2 にアタッチして使うブロックストレージ。オンプレミスのアプリケーションが NFS や SMB で直接利用するものではない。","Linux 向けのマネージドなファイルシステム。オンプレミスのファイル共有の入口としてキャッシュや変換を行うものではない。","AWS サービスのバックアップを一元管理するサービス。オンプレミスのファイル共有のプロトコルを提供するものではない。"],"explain":"「オンプレミスから」「NFS や SMB」「AWS のストレージに保存」が決め手で、AWS Storage Gateway を選ぶ。オンプレミスに仮想アプライアンスなどを置き、頻繁に使うデータはローカルにキャッシュしながら、実体を Amazon S3 などに保存できる。","point":"オンプレミスからクラウドのストレージを標準プロトコルで使うハイブリッド構成は AWS Storage Gateway。","diagram":null},{"id":"clf-d3-55","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、Amazon S3 にデータを保存しています。データへのアクセスパターンは予測できず、頻繁に使われる時期と全く使われない時期があります。取り出し時のレイテンシーを保ちつつ、アクセス頻度に応じてストレージコストを自動的に最適化したいと考えています。最も適切なストレージクラスはどれですか。","choices":["S3 Standard-IA","S3 One Zone-IA","S3 Intelligent-Tiering","S3 Glacier Deep Archive"],"answer":[2],"why":["アクセス頻度が低いデータ向けのクラス。アクセス頻度に応じて自動で階層を移動することはなく、頻繁にアクセスすると取り出し料金がかかる。","単一の AZ にだけ保存する低頻度アクセス向けのクラス。アクセスパターンに応じた自動的な最適化は行わず、AZ 障害にも弱い。","アクセスパターンの変化に応じて、データを頻繁アクセス階層や低頻度アクセス階層などへ自動的に移動し、コストを最適化する。パターンが予測できないデータ向け。","長期アーカイブ向けで最も低コストのクラス。取り出しに時間がかかり、頻繁に使われる時期がある用途には合わない。"],"explain":"「アクセスパターンが予測できない」「自動的に最適化」が決め手で、S3 Intelligent-Tiering を選ぶ。オブジェクトのアクセス状況を監視して階層を移動するので、運用の手間をかけずにコストを下げられる。アクセスが少ないと分かっているデータなら Standard-IA などが候補になる。","point":"アクセス頻度が不明・変動するデータは S3 Intelligent-Tiering。自動でコストを最適化する。","diagram":null},{"id":"clf-d3-56","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、法令で保管が義務付けられた記録を 7 年間保存しなければならず、アクセスはほとんど発生しません。取り出しに 12 時間程度かかっても問題ないため、最も低コストで保存したいと考えています。最も費用対効果の高い Amazon S3 のストレージクラスはどれですか。","choices":["S3 Standard","S3 Glacier Deep Archive","S3 Intelligent-Tiering","S3 Glacier Instant Retrieval"],"answer":[1],"why":["頻繁にアクセスするデータ向けのクラス。ほとんどアクセスしない長期保存には、ストレージ料金が割高になる。","S3 のストレージクラスの中で最も低コストの長期アーカイブ向けクラス。取り出しに数時間から十数時間かかることを許容できる、ほとんどアクセスしないデータに適する。","アクセスパターンが不明なデータ向けのクラス。アクセスがほぼ発生しないと分かっている長期保存では、より低コストのクラスがある。","ミリ秒単位で取り出せるアーカイブ向けクラス。すぐに取り出す必要がない場合は、Deep Archive のほうが低コスト。"],"explain":"「7 年間」「ほとんどアクセスしない」「取り出しに 12 時間かかってもよい」「最も低コスト」から S3 Glacier Deep Archive を選ぶ。即時の取り出しが必要なアーカイブなら Glacier Instant Retrieval、数分から数時間なら Glacier Flexible Retrieval が候補になる。","point":"取り出しに時間がかかってよい長期保管で最安は S3 Glacier Deep Archive。即時取得が要るなら Instant Retrieval。","diagram":null},{"id":"clf-d3-57","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、別の場所のデータから再作成できる派生データを Amazon S3 に保存しています。アクセス頻度は低く、データが複数の AZ に保存される冗長性は必要ありません。ミリ秒単位で取り出せる、費用対効果の高いストレージクラスはどれですか。","choices":["S3 One Zone-IA","S3 Standard-IA","S3 Standard","S3 Intelligent-Tiering"],"answer":[0],"why":["単一の AZ にデータを保存する低頻度アクセス向けのクラス。複数 AZ に保存する Standard-IA より低コストで、ミリ秒単位で取り出せる。再作成できるデータに向く。","低頻度アクセス向けだが 3 つ以上の AZ にデータを保存するため、冗長性が不要な要件では One Zone-IA のほうが低コスト。","頻繁にアクセスするデータ向けのクラス。アクセス頻度が低いデータには割高になる。","アクセスの変化に応じて自動で階層を移動するクラス。アクセス頻度が低いと分かっていて冗長性も不要なら、One Zone-IA のほうが適する。"],"explain":"「再作成できる」「アクセス頻度は低い」「複数 AZ の冗長性は不要」「ミリ秒で取り出し」から S3 One Zone-IA を選ぶ。1 つの AZ にしか保存しないため、AZ が失われるとデータも失われる。そのため、再作成できるデータや二次的なコピーに使う。","point":"再作成できる低頻度アクセスのデータは S3 One Zone-IA。単一 AZ なので AZ 障害でデータを失う可能性がある。","diagram":null},{"id":"clf-d3-58","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、Amazon S3 に保存したログについて、作成から 30 日後に低頻度アクセス向けのクラスへ、180 日後にアーカイブ向けのクラスへ自動的に移し、2 年後に削除したいと考えています。手動の作業を発生させずに実現できる機能はどれですか。","choices":["S3 バージョニング","S3 レプリケーション","S3 Object Lock","S3 ライフサイクル設定"],"answer":[3],"why":["オブジェクトの複数のバージョンを保持する機能。ストレージクラスを時間経過で移行したり、期限で削除したりするものではない。","オブジェクトを別のバケットやリージョンへコピーする機能。ストレージクラスの移行や削除の自動化とは目的が異なる。","オブジェクトを一定期間、削除や上書きできないようにする機能。ストレージクラスの移行はできない。","経過日数などの条件に応じて、オブジェクトを別のストレージクラスへ移行したり、期限切れとして削除したりするルールを設定できる。"],"explain":"「経過日数でクラスを移す」「期限で自動的に削除」はライフサイクル設定の役割。バケットにルールを設定するだけで、アクセスが減っていくデータを段階的に低コストなクラスへ移し、不要になったデータを削除できる。","point":"時間の経過でストレージクラスの移行や削除を自動化するのは S3 ライフサイクル設定。","diagram":null},{"id":"clf-d3-59","domain":3,"topic":"ストレージ","type":"multi","stem":"Amazon EC2 のインスタンスストアについて、正しい説明はどれですか。","choices":["ホストコンピュータに物理的に接続されたストレージである。","インスタンスを停止してもデータは保持される。","別のインスタンスに付け替えて使うことができる。","インスタンスを終了するとデータは失われる。","ボリュームのスナップショットを取得できる。"],"answer":[0,3],"why":["インスタンスストアは、インスタンスが動作するホストに物理的に接続されたディスクで、低レイテンシーで使える。","インスタンスを停止するとデータは失われる。停止後も保持されるのは EBS ボリュームの特徴。","インスタンスに紐づくストレージで、別のインスタンスにアタッチし直すことはできない。付け替えられるのは EBS ボリューム。","インスタンスの終了、停止、基盤となるハードウェアの障害でデータは失われるため、一時的なデータの保存に向く。","スナップショットの取得は EBS ボリュームの機能で、インスタンスストアにはない。"],"explain":"インスタンスストアは、ホストに直結した一時的なブロックストレージで、キャッシュやバッファ、一時ファイルなど失われても問題ないデータに向く。永続化が必要なデータは、停止後もデータが残り、スナップショットも取れる EBS に保存する。","point":"インスタンスストアはホスト直結の一時的なストレージ。停止・終了でデータが消えるので、永続データは EBS に置く。","diagram":null},{"id":"clf-d3-60","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、複数の Amazon EC2 の Linux インスタンスから同時にマウントして共有できるファイルストレージを必要としています。保存するデータ量に応じて容量が自動的に拡張・縮小され、容量を事前にプロビジョニングしないサービスを使いたいと考えています。この要件を満たすサービスはどれですか。","choices":["Amazon EBS","Amazon FSx for Windows File Server","Amazon EFS","EC2 インスタンスストア"],"answer":[2],"why":["1 つのインスタンスにアタッチして使うブロックストレージ。容量はボリュームのサイズで指定し、複数のインスタンスで共有するファイルシステムではない。","Windows のアプリケーション向けの SMB ベースのファイル共有。Linux インスタンスで NFS として共有する要件には合わない。","NFS で複数の Linux インスタンスから同時にアクセスできるマネージドなファイルシステム。データの増減に応じて容量が自動で拡張・縮小する。","ホストに直結した一時的なストレージ。インスタンス間で共有できず、データも永続化されない。"],"explain":"「複数の Linux インスタンスで共有」「容量が自動で拡張・縮小」から Amazon EFS を選ぶ。EFS は NFS のファイルシステムで、複数の AZ にまたがってアクセスできる。Windows のファイル共有が必要なら FSx for Windows File Server を選ぶ。","point":"複数の Linux インスタンスで共有するファイルストレージは Amazon EFS。容量は自動で伸縮する。","diagram":null},{"id":"clf-d3-61","domain":3,"topic":"ストレージ","type":"single","stem":"ある企業は、Windows ベースのアプリケーションで使っているファイルサーバーを AWS に移行したいと考えています。SMB プロトコルと Microsoft Active Directory との統合をサポートする、フルマネージドなファイルストレージはどれですか。","choices":["Amazon EFS","Amazon FSx for Windows File Server","Amazon S3","Amazon FSx for Lustre"],"answer":[1],"why":["NFS を使う Linux 向けのファイルシステム。SMB で利用する Windows のファイルサーバーの要件には合わない。","Windows Server 上に構築されたフルマネージドなファイル共有で、SMB プロトコルと Active Directory との統合をサポートする。Windows のファイルサーバーの移行先に向く。","オブジェクトストレージ。SMB のファイル共有として Windows アプリケーションから直接使う用途のものではない。","機械学習や HPC のような高速処理向けのファイルシステム。Windows のファイルサーバーの代わりに使うものではない。"],"explain":"「Windows」「SMB」「Active Directory」「フルマネージド」から Amazon FSx for Windows File Server を選ぶ。FSx にはほかに、高速な処理が必要な HPC や機械学習のワークロード向けの FSx for Lustre などがある。用途で使い分ける。","point":"Windows のファイル共有（SMB・Active Directory）は FSx for Windows File Server。高速処理向けは FSx for Lustre。","diagram":null},{"id":"clf-d3-62","domain":3,"topic":"ストレージ","type":"multi","stem":"ある企業は、Amazon EC2、Amazon EBS、Amazon RDS、Amazon EFS などの複数の AWS サービスのバックアップを、サービスごとに個別に管理する運用負荷に悩んでいます。AWS Backup について、この課題の解決に当てはまる説明はどれですか。","choices":["EC2 のバックアップだけを対象とする。","複数の AWS サービスのバックアップを一元的に管理できる。","バックアップを取得するために Lambda 関数の作成が必要になる。","バックアップを別のリージョンにコピーする設定はできない。","スケジュールと保持期間をバックアッププランで定義できる。"],"answer":[1,4],"why":["EC2 だけが対象ではない。EBS、RDS、EFS、DynamoDB など、多くの AWS サービスをサポートする。","サポートする複数の AWS サービスのバックアップを、1 か所の画面と設定で一元的に管理・自動化できる。","Lambda 関数の作成は不要。バックアッププランを設定するだけで、バックアップを自動化できる。","バックアップを別のリージョンや別のアカウントへコピーする設定もできる。災害対策としても使える。","バックアッププランで、バックアップの頻度（スケジュール）と保持期間のポリシーを定義し、リソースに適用できる。"],"explain":"AWS Backup は、複数の AWS サービスのバックアップをポリシー（バックアッププラン）で一元的に管理・自動化するフルマネージドなサービス。サービスごとに個別のスクリプトやスケジュールを作る必要がなくなり、リージョンやアカウントをまたいだコピーにも対応する。","point":"複数サービスのバックアップを一元管理・自動化するのは AWS Backup。バックアッププランで頻度と保持期間を定める。","diagram":null},{"id":"clf-d3-63","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、アップロードされた写真から物体や人物の顔を自動的に検出し、不適切なコンテンツを判定する機能を、機械学習の専門知識なしに実装したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon Comprehend","Amazon Textract","Amazon Rekognition","Amazon Polly"],"answer":[2],"why":["テキストから感情や重要語句、エンティティを抽出する自然言語処理のサービス。画像の分析は対象外。","スキャンした文書から文字・表・フォームを抽出するサービス。物体や顔の検出が目的ではない。","画像や動画から物体、顔、テキスト、不適切なコンテンツを検出する事前トレーニング済みの画像・動画分析サービス。API で呼び出すだけで使える。","テキストを自然な音声に変換するサービス。画像を分析する機能はない。"],"explain":"「写真から物体や顔を検出」「機械学習の専門知識なし」が決め手で、Amazon Rekognition を選ぶ。入力データの種類（画像・動画、テキスト、文書、音声）でサービスを見分ける。","point":"画像・動画の分析は Rekognition。テキストは Comprehend、文書は Textract、音声は Transcribe と Polly。","diagram":null},{"id":"clf-d3-64","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、顧客から寄せられた大量のレビューやアンケートの文章から、肯定的か否定的かといった感情や、頻出するキーフレーズを自動で抽出したいと考えています。この用途に使用できる AWS のサービスはどれですか。","choices":["Amazon Comprehend","Amazon Rekognition","Amazon Lex","Amazon Personalize"],"answer":[0],"why":["テキストを分析し、感情、キーフレーズ、エンティティ、言語などを抽出する自然言語処理（NLP）のサービス。","画像や動画を分析するサービス。文章の感情分析には使わない。","音声やテキストで対話するチャットボットを構築するサービス。既存の文章を分析するものではない。","ユーザーの行動に基づいてレコメンドを生成するサービス。文章の感情は抽出しない。"],"explain":"「文章から感情やキーフレーズを抽出」が決め手で、自然言語処理の Amazon Comprehend を選ぶ。Lex は対話の構築、Personalize は推薦と、目的が異なる。","point":"テキストの感情・キーフレーズ・エンティティの抽出は Comprehend。","diagram":null},{"id":"clf-d3-65","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、紙で保管していた請求書や申込書をスキャンした画像から、文字だけでなく表やフォームの項目と値も自動で抽出し、業務システムに取り込みたいと考えています。最も適した AWS のサービスはどれですか。","choices":["Amazon Rekognition","Amazon Kendra","Amazon Transcribe","Amazon Textract"],"answer":[3],"why":["画像内の物体や顔の検出が中心のサービス。表やフォームの構造を読み取ってデータ化する用途ではない。","社内の文書を自然言語で検索できるようにする企業向け検索サービス。文書からデータを抽出して取り込むものではない。","音声をテキストに変換するサービス。スキャンした文書は対象外。","スキャンした文書や画像から、印刷文字・手書き文字に加えて、表やフォームのデータを抽出するサービス。"],"explain":"「スキャンした文書」「表やフォームの項目と値」が決め手で、Amazon Textract を選ぶ。単純な OCR を超え、文書の構造を理解して抽出できる点が特徴である。","point":"スキャン文書から文字・表・フォームを抽出するのは Textract。","diagram":null},{"id":"clf-d3-66","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、文章の要約や文章生成を行う生成 AI アプリケーションを構築します。複数のプロバイダーの基盤モデルから選択し、インフラストラクチャを管理せずに API で利用したいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon SageMaker AI","Amazon Bedrock","Amazon Comprehend","Amazon Lex"],"answer":[1],"why":["独自の機械学習モデルを構築、トレーニング、デプロイするためのサービス。基盤モデルを API だけで手軽に使うことが主目的ではない。","複数のプロバイダーの基盤モデルを単一の API で利用できるフルマネージドのサービス。インフラストラクチャを管理せずに生成 AI アプリケーションを構築できる。","テキストから感情やキーフレーズを抽出する NLP サービス。文章生成のための基盤モデルを提供するものではない。","対話型のチャットボットを構築するサービス。基盤モデルの選択・利用が目的のサービスではない。"],"explain":"「複数のプロバイダーの基盤モデル」「API で利用」「インフラストラクチャを管理しない」が決め手で、Amazon Bedrock を選ぶ。自前のモデルを学習させる場合は SageMaker AI を使う。","point":"基盤モデルを API で使う生成 AI アプリは Bedrock。自前モデルの構築・学習は SageMaker AI。","diagram":null},{"id":"clf-d3-67","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業のデータサイエンティストは、自社の独自データを使って機械学習モデルを構築、トレーニングし、本番環境にデプロイするまでを 1 つのマネージド環境で行いたいと考えています。最も適した AWS のサービスはどれですか。","choices":["Amazon Rekognition","Amazon Personalize","Amazon SageMaker AI","Amazon Polly"],"answer":[2],"why":["事前トレーニング済みの画像・動画分析サービス。独自のモデルを一から構築するための環境ではない。","レコメンドの生成に特化したサービス。汎用的なモデルの構築・デプロイ環境ではない。","機械学習モデルの構築、トレーニング、デプロイまでをフルマネージドで支援するサービス。独自のデータとアルゴリズムでモデルを作る場合に使う。","テキストを音声に変換するサービス。モデルの構築・トレーニングを行うものではない。"],"explain":"「独自データでモデルを構築、トレーニング、デプロイ」が決め手で、Amazon SageMaker AI を選ぶ。Rekognition や Polly のような AI サービスは事前トレーニング済みで、モデルの作成が不要な代わりに用途が決まっている。","point":"自前の ML モデルの構築・学習・デプロイは SageMaker AI。用途が決まっているなら AI サービスを使う。","diagram":null},{"id":"clf-d3-68","domain":3,"topic":"AI/ML・分析","type":"multi","stem":"ある企業は、英語で行われたオンライン会議の音声を文字に起こし、その文字を日本語に翻訳して参加者に表示するアプリケーションを作ります。この要件を満たすために組み合わせて使用する AWS のサービスはどれですか。","choices":["Amazon Polly","Amazon Transcribe","Amazon Comprehend","Amazon Translate","Amazon Rekognition"],"answer":[1,3],"why":["テキストを音声に変換するサービス。音声の文字起こしとは逆の方向の処理になる。","音声をテキストに変換する自動音声認識（ASR）のサービス。会議の音声を文字に起こす工程で使う。","テキストの感情やキーフレーズを抽出するサービス。言語の翻訳は行わない。","テキストをある言語から別の言語へ翻訳するニューラル機械翻訳のサービス。文字起こしした英語を日本語にする工程で使う。","画像や動画を分析するサービス。音声の文字起こしや翻訳には使わない。"],"explain":"処理の流れは「音声から文字」「文字を別の言語へ」の 2 段階で、前者が Amazon Transcribe、後者が Amazon Translate である。Polly は逆にテキストから音声を作る。","point":"音声からテキストは Transcribe、テキストから音声は Polly、言語の翻訳は Translate。","diagram":null},{"id":"clf-d3-69","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、Amazon S3 に保存した CSV ファイルのログデータに対して、データを移動せず標準 SQL でアドホックにクエリを実行したいと考えています。サーバーを管理せず、実行したクエリ分だけ支払う方法を希望しています。最も適したサービスはどれですか。","choices":["Amazon Athena","Amazon Redshift","Amazon EMR","AWS Glue"],"answer":[0],"why":["S3 上のデータに対して標準 SQL でクエリを実行できるサーバーレスの対話型クエリサービス。スキャンしたデータ量に応じて課金される。","大規模なデータを分析するためのデータウェアハウス。クラスターやデータのロードを前提とし、アドホックなクエリだけの用途にはやや大がかりになる。","Hadoop や Spark などでビッグデータを処理するクラスター型のサービス。標準 SQL で手軽にクエリするだけの用途には向かない。","データの ETL とデータカタログを提供するサービス。クエリを実行して結果を得ることが主目的ではない。"],"explain":"「S3 のデータをそのまま」「標準 SQL」「サーバーを管理しない」「クエリ分だけ支払う」が決め手で、Amazon Athena を選ぶ。Redshift はデータウェアハウスで、継続的で大規模な分析に向く。","point":"S3 のデータにサーバーレスで SQL クエリするなら Athena。","diagram":null},{"id":"clf-d3-70","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、数千台のデバイスや Web サイトのクリックストリームから発生するデータを、リアルタイムに収集して処理するパイプラインを構築します。ストリーミングデータの収集に使用できる AWS のサービスはどれですか。","choices":["Amazon Athena","AWS Glue","Amazon QuickSight","Amazon Kinesis Data Streams"],"answer":[3],"why":["S3 上のデータに SQL でクエリするサービス。ストリーミングデータの収集を担うものではない。","ETL ジョブの実行とデータカタログを提供するサービス。リアルタイムにデータを受け取るための入口ではない。","データを可視化してダッシュボードを作る BI のサービス。データの収集は行わない。","大量のストリーミングデータをリアルタイムに収集し、複数のアプリケーションで処理できるサービス。"],"explain":"「リアルタイムに収集」「ストリーミングデータ」が決め手で、Amazon Kinesis Data Streams を選ぶ。Athena はクエリ、Glue は ETL、可視化は BI サービスと、役割が分かれている。","point":"ストリーミングデータのリアルタイム収集は Kinesis Data Streams。","diagram":null},{"id":"clf-d3-71","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、複数のデータソースからデータを抽出して形式を変換し、分析用に読み込むための ETL ジョブを、サーバーレスで実行したいと考えています。あわせて、データのメタデータを管理するデータカタログも必要です。最も適したサービスはどれですか。","choices":["Amazon Kinesis Data Streams","AWS Glue","Amazon OpenSearch Service","Amazon Athena"],"answer":[1],"why":["ストリーミングデータを収集するサービス。ETL ジョブの実行やデータカタログの管理は主目的ではない。","サーバーレスのデータ統合サービスで、ETL ジョブの実行と、メタデータを管理する Glue データカタログを提供する。","ログの検索や分析に使う検索・分析エンジンのサービス。ETL とデータカタログのためのサービスではない。","S3 のデータに SQL でクエリするサービス。データの変換ジョブを実行する役割ではない。"],"explain":"「ETL ジョブ」「サーバーレス」「データカタログ」が決め手で、AWS Glue を選ぶ。Glue のデータカタログは Athena などのほかの分析サービスからも参照できる。","point":"ETL とデータカタログは AWS Glue。","diagram":null},{"id":"clf-d3-72","domain":3,"topic":"AI/ML・分析","type":"single","stem":"ある企業は、複数の業務システムのデータを集約し、ペタバイト規模のデータに対して複雑な分析クエリを高速に実行する、列指向のデータウェアハウスを使いたいと考えています。この要件に適した AWS のサービスはどれですか。","choices":["Amazon RDS","Amazon DynamoDB","Amazon ElastiCache","Amazon Redshift"],"answer":[3],"why":["リレーショナルデータベースのマネージドサービス。主にトランザクション処理向けで、ペタバイト規模の分析用途のデータウェアハウスではない。","キー・バリュー型の NoSQL データベース。複雑な分析クエリを実行するためのデータウェアハウスではない。","インメモリのキャッシュサービス。データウェアハウスとしての分析には使わない。","ペタバイト規模のデータに対して複雑な分析クエリを高速に実行できる、列指向のマネージド型データウェアハウス。"],"explain":"「ペタバイト規模」「複雑な分析クエリ」「列指向のデータウェアハウス」が決め手で、Amazon Redshift を選ぶ。トランザクション処理向けの RDS とは、分析向けかどうかで見分ける。","point":"大規模データの分析用データウェアハウスは Redshift。トランザクション処理は RDS や Aurora。","diagram":null},{"id":"clf-d3-73","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業の注文受付アプリケーションは、受け付けた注文を処理するバックエンドと連携しています。バックエンドが一時的に停止しても注文が失われないよう、両者を疎結合にしたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon SNS","Amazon SQS","Amazon CloudWatch","AWS Step Functions"],"answer":[1],"why":["メッセージを複数の受信者へプッシュ配信する通知サービス。メッセージを溜めて受信側が取り出す用途のキューではない。","メッセージをキューに保存し、受信側が処理できるタイミングで取り出せるフルマネージドのメッセージキューサービス。受信側が停止してもメッセージは保持される。","メトリクスやログを収集して監視するサービス。アプリケーション間のメッセージの受け渡しには使わない。","複数のサービスを組み合わせたワークフローを定義して実行するサービス。メッセージを溜めるキューではない。"],"explain":"「バックエンドが停止しても注文が失われない」「疎結合」が決め手で、メッセージをキューに保持する Amazon SQS を選ぶ。SNS はプッシュ型の配信で、メッセージを溜める役割ではない。","point":"疎結合でメッセージを溜めるのは SQS。複数宛先へ配信するのは SNS。","diagram":null},{"id":"clf-d3-74","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業は、1 つのイベントが発生したときに、メール、SMS、複数のアプリケーションへ同時に通知を送りたいと考えています。パブリッシュ/サブスクライブ型で、複数の宛先へ一括配信できるサービスはどれですか。","choices":["Amazon SQS","AWS Step Functions","Amazon SNS","Amazon Connect"],"answer":[2],"why":["メッセージをキューに溜める疎結合のサービス。1 つのメッセージを複数の宛先へ同時に配信する用途の中心ではない。","処理の順序や分岐を定義するワークフローのサービス。通知の一括配信を行うものではない。","トピックにメッセージを発行すると、メール、SMS、HTTP エンドポイント、SQS キューなど複数のサブスクライバーへ配信するパブリッシュ/サブスクライブ型の通知サービス。","クラウド型のコンタクトセンターサービス。システムからの通知の配信基盤ではない。"],"explain":"「複数の宛先へ同時に通知」「パブリッシュ/サブスクライブ」が決め手で、Amazon SNS を選ぶ。SQS と組み合わせて、1 つの通知を複数のキューに振り分ける構成もよく使われる。","point":"複数宛先への一括通知は SNS、メッセージを溜めるのは SQS。","diagram":null},{"id":"clf-d3-75","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業は、AWS のサービスで発生したイベントや、自社の SaaS アプリケーションからのイベントを受け取り、ルールに一致したものを AWS Lambda 関数などの宛先へ振り分けるイベント駆動型のアプリケーションを構築します。最も適したサービスはどれですか。","choices":["Amazon EventBridge","Amazon SQS","AWS X-Ray","AWS CodePipeline"],"answer":[0],"why":["イベントバスでイベントを受け取り、ルールに基づいて Lambda などのターゲットへルーティングするサーバーレスのイベントサービス。AWS のサービスや SaaS のイベントを扱える。","メッセージを溜めて受信側が取り出すキューサービス。ルールに基づいたイベントのルーティングは行わない。","アプリケーションのリクエストを追跡する分散トレーシングのサービス。イベントの振り分けとは無関係。","ソースから本番環境までのリリース工程を自動化する CI/CD のサービス。イベントのルーティング基盤ではない。"],"explain":"「イベントを受け取りルールに一致したものを宛先へ振り分ける」が決め手で、Amazon EventBridge を選ぶ。スケジュール実行のトリガーとしても使われる。","point":"イベントのルールベースのルーティングは EventBridge。","diagram":null},{"id":"clf-d3-76","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業は、注文の受付、在庫の確認、決済、発送の依頼という複数の処理を、順序、分岐、エラー時の再試行を含めてコードをほとんど書かずに視覚的に定義し、順番に実行したいと考えています。最も適した AWS のサービスはどれですか。","choices":["Amazon SNS","Amazon SQS","Amazon EventBridge","AWS Step Functions"],"answer":[3],"why":["メッセージを複数の宛先へ配信する通知サービス。処理の順序や分岐を管理するものではない。","メッセージを溜めて処理を非同期にするキューサービス。処理全体の流れや再試行を定義する機能は持たない。","イベントをルールに基づいて宛先へ振り分けるサービス。複数の処理をつなぐワークフローの定義とは役割が異なる。","複数の AWS サービスを組み合わせたワークフローを、ビジュアルエディタで定義して実行するサービス。順序、分岐、並列処理、再試行を扱える。"],"explain":"「順序、分岐、再試行」「視覚的に定義」が決め手で、AWS Step Functions を選ぶ。EventBridge はイベントの振り分け、Step Functions は一連の処理の流れの制御と覚える。","point":"複数の処理をつなぐワークフローの制御は Step Functions。","diagram":null},{"id":"clf-d3-77","domain":3,"topic":"その他のサービス","type":"multi","stem":"ある企業は、Amazon EC2 インスタンスの CPU 使用率が一定のしきい値を超えたときに、運用担当者へメールで自動通知したいと考えています。この要件を満たすために使用する AWS のサービスはどれですか。","choices":["Amazon CloudWatch","AWS CloudTrail","Amazon SNS","AWS Config","Amazon Inspector"],"answer":[0,2],"why":["メトリクスを収集して監視し、しきい値を超えたときにアラームを発報できるサービス。CPU 使用率の監視とアラームに使う。","AWS アカウント内の API 呼び出しを記録するサービス。リソースの使用率の監視には使わない。","メールや SMS などへ通知を配信するサービス。CloudWatch アラームのアクションとして、運用担当者へのメール通知に使う。","リソースの構成変更を記録し、ルールへの準拠を評価するサービス。CPU 使用率の監視ではない。","ワークロードの脆弱性を検出するサービス。パフォーマンスの監視は対象外。"],"explain":"「CPU 使用率」の監視としきい値超過のアラームは Amazon CloudWatch、「メールで通知」は Amazon SNS が担う。CloudWatch アラームのアクションに SNS トピックを指定して組み合わせる。","point":"メトリクスの監視とアラームは CloudWatch。通知の配信は SNS と組み合わせる。","diagram":null},{"id":"clf-d3-78","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業は、物理的なコールセンター設備を持たずに、数日でクラウド上にコンタクトセンターを立ち上げ、電話やチャットでの顧客対応を行いたいと考えています。この要件を満たす AWS のサービスはどれですか。","choices":["Amazon SES","Amazon Connect","Amazon WorkSpaces","AWS Amplify"],"answer":[1],"why":["メールの送受信を行うサービス。電話やチャットでの顧客対応の窓口にはならない。","クラウド型のオムニチャネルのコンタクトセンターサービス。物理設備なしで、電話やチャットでの顧客対応を短期間で開始できる。","従業員向けの仮想デスクトップのサービス。コンタクトセンターの機能そのものを提供するものではない。","Web アプリケーションやモバイルアプリケーションの開発とホスティングを支援するサービス。コンタクトセンター用ではない。"],"explain":"「コンタクトセンター」「電話やチャットでの顧客対応」が決め手で、Amazon Connect を選ぶ。メール配信の SES、仮想デスクトップの WorkSpaces とは用途が異なる。","point":"クラウドのコンタクトセンターは Amazon Connect。","diagram":null},{"id":"clf-d3-79","domain":3,"topic":"その他のサービス","type":"single","stem":"ある企業は、マイクロサービスで構成されたアプリケーションで、リクエストが複数のサービスをまたいで処理される際の遅延やエラーの原因箇所を特定したいと考えています。リクエストを追跡して分析できる AWS のサービスはどれですか。","choices":["AWS X-Ray","AWS CloudTrail","AWS Config","Amazon EventBridge"],"answer":[0],"why":["アプリケーションのリクエストを追跡する分散トレーシングのサービス。サービス間の呼び出し経路や遅延、エラーの箇所を可視化できる。","AWS アカウントの API 呼び出しを記録するサービス。アプリケーション内のリクエストの遅延分析には使わない。","リソースの構成変更を記録・評価するサービス。リクエストの追跡には使わない。","イベントをルールに基づいて振り分けるサービス。リクエストの遅延やエラーの分析はできない。"],"explain":"「複数のサービスをまたぐリクエスト」「遅延やエラーの原因箇所」が決め手で、分散トレーシングの AWS X-Ray を選ぶ。CloudTrail は API の操作履歴、Config は構成の変更履歴を扱う。","point":"マイクロサービスのリクエストの追跡と原因分析は X-Ray。","diagram":null},{"id":"clf-d3-80","domain":3,"topic":"その他のサービス","type":"multi","stem":"ある企業は、AWS CodePipeline を使って、ソースコードの変更をきっかけに、アプリケーションのビルドとテスト、そして本番環境へのデプロイを自動化します。ビルドの工程とデプロイの工程で、それぞれ使用できる AWS のサービスはどれですか。","choices":["AWS X-Ray","AWS CodeBuild","Amazon CloudWatch","AWS CodeDeploy","AWS Config"],"answer":[1,3],"why":["アプリケーションのリクエストを追跡する分散トレーシングのサービス。ビルドやデプロイを実行するものではない。","ソースコードのコンパイル、テストの実行、デプロイ可能な成果物の作成を行うフルマネージドのビルドサービス。ビルドの工程で使う。","メトリクスやログの監視サービス。CI/CD の工程を実行するものではない。","EC2、オンプレミスのサーバー、Lambda などへアプリケーションのデプロイを自動化するサービス。デプロイの工程で使う。","リソースの構成変更を記録・評価するサービス。ビルドやデプロイには使わない。"],"explain":"CodePipeline はリリースの流れを調整し、ビルドは AWS CodeBuild、デプロイは AWS CodeDeploy が実行する。工程ごとの役割を分けて覚える。","point":"ビルドは CodeBuild、デプロイは CodeDeploy、全体の流れの自動化は CodePipeline。","diagram":null},{"id":"clf-d4-01","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、数週間だけ実施するキャンペーン用のアプリケーションを Amazon EC2 で動かします。負荷は予測できず、長期の利用コミットメントはしたくありません。最も適した購入オプションはどれですか。","choices":["Compute Savings Plans","スタンダードリザーブドインスタンス","オンデマンドインスタンス","Amazon EC2 Dedicated Hosts"],"answer":[2],"why":["1 年または 3 年の使用量コミットメントが前提。短期の利用では割引を使い切れない可能性がある。","1 年または 3 年の期間契約。数週間の利用には期間が長すぎる。","使った分だけ秒単位または時間単位で支払う。前払いや長期の契約が不要で、短期・予測できない負荷に向く。","物理サーバーを専有する。ライセンスや規制の要件向けで、短期・予測不能な負荷向けではない。"],"explain":"決め手は「短期」「予測できない」「長期コミットしない」。この条件ではコミットメントが不要なオンデマンドを選ぶ。RI や Savings Plans は継続利用が見込める場合に割引を得る仕組み。","point":"短期・予測できない負荷はオンデマンド。1 年以上の継続利用なら RI か Savings Plans。","diagram":null},{"id":"clf-d4-02","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、今後 3 年間、Amazon EC2 に加えて AWS Fargate と AWS Lambda も継続して使う予定です。インスタンスファミリーやリージョンを将来変更する可能性もあります。最も柔軟に割引を受けられるオプションはどれですか。","choices":["Compute Savings Plans","EC2 Instance Savings Plans","スタンダードリザーブドインスタンス","スポットインスタンス"],"answer":[0],"why":["インスタンスファミリー・サイズ・リージョン・OS をまたいで EC2 に適用でき、Fargate と Lambda の使用量にも適用される。","インスタンスファミリーとリージョンを固定する。Fargate や Lambda には適用されない。","特定のインスタンス構成に紐づく。Fargate や Lambda には適用されない。","空き容量を使う仕組みで、中断される可能性がある。継続利用の割引契約ではない。"],"explain":"決め手は「Fargate と Lambda も使う」「ファミリーやリージョンを変えるかもしれない」。Compute Savings Plans が最も適用範囲が広い。EC2 Instance Savings Plans は割引率が高い代わりにファミリーとリージョンが固定される。","point":"Compute Savings Plans は EC2・Fargate・Lambda にまたがり、ファミリーやリージョンも自由。","diagram":null},{"id":"clf-d4-03","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、Amazon EC2 のリザーブドインスタンスを 3 年契約で購入しますが、将来インスタンスファミリーやオペレーティングシステムを変更する可能性があります。変更に対応できる RI の種類はどれですか。","choices":["スタンダード RI","コンバーティブル RI","オンデマンドキャパシティ予約","Dedicated Instances"],"answer":[1],"why":["割引率は高いが、ファミリーなどの属性を自由に変更することはできない。","別のインスタンスファミリー・OS・テナンシーなどの構成に交換できる。交換後の価値が同等以上であることが条件。","キャパシティを確保する仕組みで、料金の割引契約ではない。","単一のお客様専用ハードウェアで実行するテナンシーの種類。購入オプションの変更とは関係がない。"],"explain":"RI にはスタンダードとコンバーティブルがある。スタンダードの方が割引率は高いが柔軟性は低く、コンバーティブルは構成の交換ができる。","point":"構成を変えたいならコンバーティブル RI。割引率重視で構成固定ならスタンダード RI。","diagram":null},{"id":"clf-d4-04","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、中断されても問題のない画像変換のバッチ処理を、最も低コストで実行したいと考えています。処理はいつ開始・再開しても構いません。最も費用対効果の高い購入オプションはどれですか。","choices":["オンデマンドインスタンス","EC2 Instance Savings Plans","Amazon EC2 Dedicated Hosts","スポットインスタンス"],"answer":[3],"why":["中断されないが、スポットより割高。中断を許容できる処理には費用対効果が劣る。","継続的な使用量のコミットメントが必要。断続的なバッチ向けの最安手段ではない。","物理サーバーを専有するため、むしろ割高になる。","AWS の空き容量をオンデマンドより大幅に安く使える。需要によって中断される可能性があるため、中断に耐える処理に向く。"],"explain":"決め手は「中断されても問題ない」「最も低コスト」。スポットインスタンスは大幅な割引が得られる一方、中断のリスクがある。データベースなど中断できない処理には向かない。","point":"中断に耐える・柔軟な処理はスポット。大幅に安いが、中断されうる。","diagram":null},{"id":"clf-d4-05","domain":4,"topic":"料金モデル","type":"multi","stem":"AWS のデータ転送料金について、追加料金が発生しないものはどれですか。","choices":["インターネットから Amazon EC2 インスタンスへの受信データ転送","Amazon EC2 からインターネットへの送信データ転送","あるリージョンから別のリージョンへのデータ転送","同じアベイラビリティーゾーン内の EC2 インスタンス間でのプライベート IP アドレスによる通信","NAT ゲートウェイを経由するデータ処理"],"answer":[0,3],"why":["インターネットから AWS への受信は、基本的に無料。","インターネットへの送信は課金対象（無料枠の範囲を除く）。","リージョン間の転送は課金される。","同一 AZ 内でプライベート IP を使う通信は無料。","NAT ゲートウェイは、処理したデータ量に対して課金される。"],"explain":"データ転送は「AWS に入る」方向は基本無料、「AWS から出る」方向は課金される。同じ AZ 内のプライベート通信は無料だが、AZ やリージョンをまたぐと課金される。","point":"受信は基本無料。インターネットへの送信とリージョン間転送は課金される。","diagram":null},{"id":"clf-d4-06","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、ソケット単位で割り当てるソフトウェアライセンスを持ち込み、AWS 上の物理サーバーを専有して使用したいと考えています。この要件を満たす EC2 のオプションはどれですか。","choices":["Amazon EC2 スポットインスタンス","Dedicated Hosts","Amazon EC2 オンデマンドキャパシティ予約","コンバーティブル RI"],"answer":[1],"why":["空き容量を使う仕組み。物理サーバーを専有するものではない。","物理サーバー全体を専有でき、ソケットやコアの情報が見える。既存のサーバー単位ライセンスの持ち込みに使える。","特定の AZ でキャパシティを確保する仕組み。物理サーバーの専有やソケット情報の可視化はできない。","料金割引の購入オプション。物理サーバーの専有や可視化はできない。"],"explain":"決め手は「ソケット単位のライセンス」と「物理サーバーの専有」。Dedicated Hosts はソケット・コア数が可視化され、ライセンス要件や規制要件に使える。Dedicated Instances は専用ハードウェアだが、ホストの可視性やコントロールは限られる。","point":"サーバー単位ライセンス・規制要件は Dedicated Hosts。","diagram":null},{"id":"clf-d4-07","domain":4,"topic":"料金モデル","type":"multi","stem":"ある企業は、Amazon S3 にデータを保存して利用しています。S3 の料金に影響する要素はどれですか。","choices":["作成したバケットの数","保存しているデータの量","S3 にアクセスする IAM ユーザーの数","バケットポリシーの数","PUT や GET などのリクエストの数"],"answer":[1,4],"why":["バケットの作成自体は課金対象ではない。","ストレージクラスごとの GB あたりの月額料金で課金される。","IAM は無料。ユーザー数は S3 の料金に影響しない。","ポリシーの数は料金の要素ではない。","リクエストの種類と数に応じて課金される。"],"explain":"S3 の主な料金要素は、保存量、リクエスト数、データ転送（インターネットへの送信など）。ストレージクラスによって単価が変わる。","point":"S3 は保存量・リクエスト・データ転送で課金される。","diagram":null},{"id":"clf-d4-08","domain":4,"topic":"料金モデル","type":"single","stem":"AWS Lambda の料金は、主に何に基づいて決まりますか。","choices":["関数を配置した VPC のサブネットの数","関数のコードを保存しているストレージの容量と期間","リクエスト数と、関数の実行時間（割り当てたメモリ量に応じる）","関数を実行するために起動したサーバーの時間"],"answer":[2],"why":["サブネット数は料金の要素ではない。","コードの保存期間では課金されない。呼び出しと実行の量で決まる。","リクエスト数と実行時間（ミリ秒単位）で課金され、実行時間は割り当てメモリに応じて GB 秒で計算される。","サーバーを管理しない仕組み。サーバー稼働時間では課金されない。"],"explain":"Lambda はサーバーレスで、実行されたときだけ課金される。呼び出しがなければ基本的に料金は発生しない。","point":"Lambda はリクエスト数と実行時間（メモリに応じる）で課金。","diagram":null},{"id":"clf-d4-09","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、1 時間あたりの使用量（USD）を 1 年間コミットすることで、EC2 の利用料金を割り引きたいと考えています。特定のインスタンス構成の予約はしたくありません。この要件を満たす料金モデルはどれですか。","choices":["Savings Plans","スタンダードリザーブドインスタンス","スポットインスタンス","Amazon EC2 Dedicated Hosts"],"answer":[0],"why":["1 時間あたりの金額（USD）をコミットする形で割引を受ける。特定のインスタンス構成を予約する必要はない。","インスタンスタイプなどの特定構成を予約する。金額でのコミットメントではない。","コミットメントではなく、空き容量の利用。中断される可能性がある。","物理サーバーを専有するオプション。使用量コミットメントによる割引モデルではない。"],"explain":"決め手は「1 時間あたりの USD をコミット」。Savings Plans は金額ベース、RI は構成ベースのコミットメント。","point":"Savings Plans は金額（USD/時間）のコミット、RI は構成のコミット。","diagram":null},{"id":"clf-d4-10","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、Amazon EBS ボリュームを作成しましたが、インスタンスに接続せず未使用のままにしています。このボリュームの料金について正しい説明はどれですか。","choices":["インスタンスに接続するまで、課金されない。","プロビジョニングした容量に対して、未使用でも課金される。","実際に書き込んだデータ量だけ課金される。","リージョンをまたがない限り、常に無料になる。"],"answer":[1],"why":["接続の有無にかかわらず、作成した時点から課金される。","EBS はプロビジョニングした容量（GB 単位）に対して課金される。使っていなくてもボリュームが存在する限り課金される。","書き込み量ではなく、プロビジョニングした容量が課金の基準。","リージョン内でも課金される。無料になる条件ではない。"],"explain":"使っていない EBS ボリュームやスナップショットは見落としやすいコストの原因。不要なものは削除するのがコスト最適化の基本。","point":"EBS はプロビジョニングした容量で課金。未使用のボリュームは削除する。","diagram":null},{"id":"clf-d4-11","domain":4,"topic":"料金モデル","type":"single","stem":"ある企業は、EC2 のワークロードが 24 時間 365 日の安定したベースラインと、月に数回の予測できないピークを持っています。最も費用対効果の高い購入オプションの組み合わせはどれですか。","choices":["ベースラインにオンデマンド、ピークに Savings Plans","すべてをスポットインスタンスで実行して最安にする","すべてを Dedicated Hosts で専有して運用する","ベースラインに Savings Plans、ピークにオンデマンドインスタンス"],"answer":[3],"why":["予測できないピークにコミットすると、使われない分も支払うことになる。","常時稼働のベースラインが中断される可能性があり、安定性を保てない。","物理サーバーの専有は割高で、この要件では不要。","常時稼働の部分はコミットメントで割引を受け、予測できないピークは使った分だけ支払う。"],"explain":"安定した使用量はコミットメント型で割引、変動する部分は従量課金で柔軟に、という組み合わせが基本。","point":"ベースラインはコミット、ピークはオンデマンド。","diagram":null},{"id":"clf-d4-12","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、月額の AWS 利用料金が予算の 80% に達したときに、メールで通知を受け取りたいと考えています。この要件を満たすサービスはどれですか。","choices":["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Compute Optimizer"],"answer":[2],"why":["過去のコストの可視化と将来の予測を行う。しきい値での通知は Budgets の役割。","構築前に料金を見積もるツール。実際の利用料金の通知はできない。","予算額を設定し、実績や予測がしきい値を超えたときに通知やアクションを実行できる。","リソースのサイズの最適化を推奨する。予算の通知は行わない。"],"explain":"決め手は「しきい値に達したら通知」。Budgets は予算の監視と通知、Cost Explorer は分析と予測という違いで見分ける。","point":"しきい値で通知するのは Budgets、分析するのは Cost Explorer。","diagram":null},{"id":"clf-d4-13","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、過去 12 か月のサービス別のコストを可視化し、今後数か月の利用料金の予測も確認したいと考えています。最も適したサービスはどれですか。","choices":["AWS Cost Explorer","AWS Budgets","AWS Cost Anomaly Detection","AWS Trusted Advisor"],"answer":[0],"why":["コストと使用状況をグラフで可視化・フィルタリングでき、将来のコストを予測する機能もある。","予算を設定して超過を通知する。過去の傾向の詳細な分析が主目的ではない。","想定外のコスト急増を検出する。通常の傾向分析や予測を行うものではない。","ベストプラクティスのチェックと推奨事項を示す。コストの推移の可視化ではない。"],"explain":"決め手は「過去の可視化」と「予測」。Cost Explorer は分析ツールで、Budgets は予算管理のツールである。","point":"過去の分析と予測は Cost Explorer。","diagram":null},{"id":"clf-d4-14","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、リソース単位まで含む、最も詳細なコストと使用状況のデータを Amazon S3 に出力し、Amazon Athena で分析したいと考えています。最も適した機能はどれですか。","choices":["AWS Cost Explorer のグラフ","AWS Budgets のレポート","AWS Pricing Calculator","AWS Data Exports"],"answer":[3],"why":["画面上で可視化するもので、最も詳細なデータを S3 に出力する機能ではない。","予算の状況を通知するもので、明細レベルのデータ提供ではない。","構築前の見積もりツール。実際の利用データは扱わない。","リソース単位・時間単位まで含む最も詳細なコストと使用状況のデータを S3 に出力できる。Athena などで分析できる。"],"explain":"決め手は「最も詳細」「S3 に出力」「Athena で分析」。コストと使用状況のレポート（CUR）は現在 AWS Data Exports から作成する。","point":"最も詳細なコストデータの出力は Data Exports（CUR）。","diagram":null},{"id":"clf-d4-15","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、まだ構築していないシステムを AWS に作る前に、構成から月額料金を見積もりたいと考えています。使用できるサービスはどれですか。","choices":["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Cost Anomaly Detection"],"answer":[1],"why":["すでに発生したコストの分析と予測をする。まだ存在しない構成の見積もりには使えない。","予定するサービスと使用量を入力して、構築前に料金を見積もれる。","予算を設定して超過を通知する。見積もりのツールではない。","実際の利用で発生した異常を検出する。見積もりは行わない。"],"explain":"決め手は「構築前」「見積もり」。実績ベースの Cost Explorer や Budgets と、事前見積もりの Pricing Calculator を区別する。","point":"構築前の見積もりは Pricing Calculator。","diagram":null},{"id":"clf-d4-16","domain":4,"topic":"請求・コスト管理","type":"multi","stem":"AWS Organizations の一括請求（Consolidated Billing）の利点はどれですか。","choices":["メンバーアカウントごとに無料利用枠が増える","複数のアカウントの支払いを 1 つの請求にまとめられる","リージョン間のデータ転送が無料になる","メンバーアカウントの IAM ユーザーを一元管理できる","全アカウントの使用量が合算され、ボリューム割引を受けられる"],"answer":[1,4],"why":["無料利用枠は、組織全体で共有される。","管理アカウントが、メンバーアカウントの料金をまとめて支払う。","一括請求にデータ転送料金の免除はない。","それは IAM Identity Center などの役割。一括請求の機能ではない。","使用量が合算されるため、段階的な料金のボリューム割引に達しやすくなる。"],"explain":"一括請求の主な利点は、支払いの一本化と、使用量の合算によるボリューム割引。追加料金なしで使える。","point":"一括請求は支払いの一本化とボリューム割引の合算。","diagram":null},{"id":"clf-d4-17","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、部門ごとに AWS のコストを集計するため、リソースにタグを付けて請求データに反映させたいと考えています。使用する機能はどれですか。","choices":["AWS Budgets の予算アクション","IAM のアクセス許可境界","コスト配分タグ","AWS CloudTrail"],"answer":[2],"why":["予算超過時に自動対応する機能。コストをタグで分類する機能ではない。","IAM ロールの権限の上限を設定する機能。コストの集計とは関係がない。","リソースのタグを有効化すると、Cost Explorer や請求レポートでタグ単位にコストを集計できる。","API 呼び出しのログを記録する。コストの配分には使わない。"],"explain":"決め手は「部門ごと」「タグ」。コスト配分タグは、使用前に Billing コンソールで有効化する必要がある。","point":"タグ別のコスト集計はコスト配分タグ（有効化が必要）。","diagram":null},{"id":"clf-d4-18","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、顧客ごとに独自の料金ルールを適用した請求データを作成し、再販事業で利用したいと考えています。最も適したサービスはどれですか。","choices":["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Billing Conductor"],"answer":[3],"why":["実際のコストを分析するツール。独自の料金ルールを適用する機能はない。","見積もりツール。顧客ごとの請求データは作れない。","予算の通知を行う。請求データの作成はしない。","請求グループごとに独自の料金ルールを設定した、請求データ（pro forma）を作成できる。再販や社内チャージバックに使える。"],"explain":"決め手は「顧客ごとの独自の料金ルール」。実際の請求額は変えず、AWS の請求データ上で別の料金ビューを作る。","point":"独自の料金ルールで請求データを作るのは Billing Conductor。","diagram":null},{"id":"clf-d4-19","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、機械学習を使って、通常と異なるコストの急増を自動的に検出し、通知を受けたいと考えています。最も適したサービスはどれですか。","choices":["AWS Budgets","AWS Cost Anomaly Detection","AWS Pricing Calculator","Amazon GuardDuty"],"answer":[1],"why":["設定した固定のしきい値で通知する。パターンの学習による異常検出ではない。","機械学習で通常の利用パターンを学習し、想定外のコストの急増を検出して通知する。","構築前の見積もりツール。異常の検出はしない。","脅威を検出するセキュリティサービス。コストの異常は対象外。"],"explain":"決め手は「通常と異なる」「自動的に検出」。固定値で見る Budgets と、パターンから異常を見つける Cost Anomaly Detection の違いに注意。","point":"想定外のコスト急増の自動検出は Cost Anomaly Detection。","diagram":null},{"id":"clf-d4-20","domain":4,"topic":"請求・コスト管理","type":"single","stem":"ある企業は、過剰にプロビジョニングされている EC2 インスタンスを特定し、適切なインスタンスタイプの推奨を受けたいと考えています。使用できるサービスはどれですか。","choices":["AWS Compute Optimizer","AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator"],"answer":[0],"why":["過去の使用状況を分析し、EC2 などのリソースに最適なサイズを推奨する。","コストの可視化と予測を行う。リソースのサイズの推奨は主な機能ではない。","予算の通知を行う。リソースのサイズ最適化は行わない。","構築前の見積もりツール。稼働中のリソースの分析はしない。"],"explain":"決め手は「過剰なプロビジョニング」「適切なサイズの推奨」。Compute Optimizer は機械学習で使用状況を分析する。","point":"リソースの適正サイズの推奨は Compute Optimizer。","diagram":null},{"id":"clf-d4-21","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"追加料金なしで、すべての AWS のお客様が利用できるものはどれですか。","choices":["専任の Technical Account Manager（TAM）","AWS Health Dashboard","Trusted Advisor のすべてのチェック","技術サポート担当者への 24 時間の電話相談"],"answer":[1],"why":["TAM は上位の有償サポートプランに含まれる。Basic Support にはない。","AWS Health Dashboard は、アカウントのリソースに影響するイベントを確認できる。すべてのお客様が利用できる。","全チェックは有償プランで利用できる。Basic ではコアのチェックに限られる。","技術サポートの電話相談は有償プランの機能。Basic にはない。"],"explain":"Basic Support はすべてのお客様に無料。請求やアカウントのサポート、Health Dashboard、ドキュメントなどが使える。技術サポートや TAM は有償プランが必要。","point":"Basic はドキュメントと Health Dashboard など。TAM や技術サポートは有償プラン。","diagram":null},{"id":"clf-d4-22","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある企業は、AWS Trusted Advisor のすべてのチェックを利用したいと考えています。必要な条件はどれですか。","choices":["AWS Organizations を有効にする。","Amazon GuardDuty を有効にする。","有償の AWS サポートプランに加入する。","AWS Cost Explorer を有効にする。"],"answer":[2],"why":["Organizations の有効化は条件ではない。","GuardDuty はセキュリティの脅威検出サービス。Trusted Advisor の利用条件ではない。","Trusted Advisor の全チェックは、有償のサポートプラン（Business Support+ 以上）で利用できる。","Cost Explorer は無関係。Trusted Advisor の利用条件ではない。"],"explain":"Trusted Advisor は、Basic Support ではコアのチェックだけが使える。サポートプランに加入すると、全チェックが使える。","point":"Trusted Advisor の全チェックは有償サポートプランで利用できる。","diagram":null},{"id":"clf-d4-23","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある企業は、使用している AWS サービスに影響する障害や、予定されたメンテナンスの情報を、自社のアカウント単位で確認したいと考えています。最も適したサービスはどれですか。","choices":["AWS Trusted Advisor","AWS CloudTrail","AWS Config","AWS Health Dashboard"],"answer":[3],"why":["ベストプラクティスに沿った推奨事項を示す。サービスの障害を通知するものではない。","API 呼び出しの記録を残す。障害情報の通知は行わない。","リソースの構成変更を記録・評価する。障害情報の通知は行わない。","お客様のアカウントとリソースに影響するイベントや、予定された変更の情報を個別に確認できる。"],"explain":"決め手は「自分のアカウントに影響する」イベント。Health Dashboard は、AWS のサービス全体の状況と、アカウント固有のイベントを確認できる。","point":"自分のアカウントに影響するイベントは Health Dashboard。","diagram":null},{"id":"clf-d4-24","domain":4,"topic":"サポート・技術リソース","type":"multi","stem":"AWS Trusted Advisor が推奨事項を提供するカテゴリはどれですか。","choices":["コスト最適化","ソフトウェアライセンスの管理","セキュリティ","開発者の生産性","データ主権の評価"],"answer":[0,2],"why":["使われていないリソースなど、コストを削減できる推奨事項を示す。","ライセンス管理は Trusted Advisor のカテゴリではない。","公開されているポートや、MFA の未設定などの推奨事項を示す。","生産性の評価は Trusted Advisor のカテゴリではない。","データの所在地の評価は Trusted Advisor のカテゴリではない。"],"explain":"Trusted Advisor は、コスト最適化、セキュリティ、耐障害性、パフォーマンス、サービスの制限などのカテゴリでチェックして推奨事項を示す。","point":"Trusted Advisor はコスト・セキュリティ・耐障害性などをチェックする。","diagram":null},{"id":"clf-d4-25","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある開発者は、過去に AWS サポートへ寄せられた頻出の質問と回答の記事を探したいと考えています。最も適した情報源はどれですか。","choices":["AWS Knowledge Center","AWS Marketplace","AWS Partner Network","AWS Pricing Calculator"],"answer":[0],"why":["サポートに寄せられた頻出の質問と、その解決手順をまとめた記事を探せる。","サードパーティのソフトウェアを購入するための場。技術的な質問と回答の記事ではない。","AWS のパートナー企業のプログラム。質問と回答の記事集ではない。","料金を見積もるツール。技術的な質問と回答の記事は扱わない。"],"explain":"Knowledge Center は、サポートの頻出質問への回答集。コミュニティで質問したいなら AWS re:Post を使う。","point":"頻出質問の回答集は Knowledge Center、コミュニティ Q&A は re:Post。","diagram":null},{"id":"clf-d4-26","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある開発者は、技術的な質問を投稿し、AWS の専門家やほかの利用者からの回答を得たいと考えています。使用できるのはどれですか。","choices":["AWS Knowledge Center","AWS re:Post","AWS Prescriptive Guidance","AWS Marketplace"],"answer":[1],"why":["すでに作成された頻出質問の回答集。新しい質問を投稿する場ではない。","AWS のコミュニティ向けの Q&A サービス。質問を投稿し、ほかの利用者や AWS の専門家から回答を得られる。","実証済みのガイドや戦略を提供する。質問を投稿する場ではない。","ソフトウェアを購入する場。質問の投稿はできない。"],"explain":"re:Post は質問と回答のコミュニティ。Knowledge Center の回答集と使い分ける。","point":"質問を投稿するなら re:Post。","diagram":null},{"id":"clf-d4-27","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある企業は、AWS への移行を進めるにあたり、AWS の認定を持つ外部のコンサルティング企業に支援を依頼したいと考えています。このような企業を探すために利用できるものはどれですか。","choices":["AWS Prescriptive Guidance","AWS Knowledge Center","AWS Health Dashboard","AWS Partner Network（APN）"],"answer":[3],"why":["AWS Prescriptive Guidance は、移行や最新化のための実証済みの戦略・ガイド・パターンを提供する情報源。支援してくれる企業を探すものではない。","AWS Knowledge Center は、サポートに寄せられた頻出の質問と回答の記事集。外部の企業を探すものではない。","AWS Health Dashboard は、アカウントに影響する AWS のイベントを確認するもの。パートナー企業は探せない。","AWS Partner Network は、AWS を使ったソリューションや導入支援を提供するパートナー企業のプログラム。認定や専門分野を条件にコンサルティングパートナーを探せる。"],"explain":"決め手は「外部のコンサルティング企業」。AWS のパートナー企業は AWS Partner Network（APN）に参加しており、専門分野や認定を条件に探せる。AWS 自身の専門家チームに依頼するなら AWS Professional Services、ソフトウェアを購入するなら AWS Marketplace を使う。","point":"外部のパートナー企業に支援を頼むなら AWS Partner Network。AWS の専門家チームは Professional Services、ソフトウェアの購入は Marketplace。","diagram":null},{"id":"clf-d4-28","domain":4,"topic":"サポート・技術リソース","type":"single","stem":"ある企業は、クラウド導入の目標達成に向けて、AWS の専門家チームに、アーキテクチャの設計や導入を支援してもらいたいと考えています。使用できるのはどれですか。","choices":["AWS Knowledge Center","AWS Professional Services","AWS re:Post","AWS Cost Explorer"],"answer":[1],"why":["頻出の質問への回答集。専門家チームによる支援ではない。","AWS の専門家チームが、お客様と協力して、クラウド導入の成果の達成を支援する。","コミュニティの Q&A。専任の専門家チームによる支援ではない。","コストの分析ツール。導入の支援は行わない。"],"explain":"決め手は「AWS の専門家チームによる支援」。パートナー企業の支援を探すなら AWS Partner Network を使う。","point":"専門家チームによる導入支援は Professional Services。","diagram":null}]};

/* ---------- 学習記録 ---------- */
const emptyProgress = () => ({ v: 1, stats: {}, exams: [], resetAt: 0, updatedAt: 0 });
function normalize(p) {
  p = p && typeof p === 'object' ? p : {};
  return {
    v: 1,
    stats: p.stats && typeof p.stats === 'object' ? p.stats : {},
    exams: Array.isArray(p.exams) ? p.exams : [],
    resetAt: +p.resetAt || 0,
    updatedAt: +p.updatedAt || 0,
  };
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const resetAt = Math.max(a.resetAt, b.resetAt);
  const stats = {};
  for (const src of [a.stats, b.stats]) {
    for (const [id, s] of Object.entries(src)) {
      if (!s || (s.t || 0) <= resetAt) continue;
      if (!stats[id] || (s.t || 0) > (stats[id].t || 0)) stats[id] = s;
    }
  }
  const ex = new Map();
  for (const e of [...a.exams, ...b.exams]) if (e && e.id && (e.at || 0) > resetAt) ex.set(e.id, e);
  return { v: 1, stats, exams: [...ex.values()].sort((x, y) => x.at - y.at).slice(-30), resetAt, updatedAt: Math.max(a.updatedAt, b.updatedAt) };
}
function hasNewer(local, remote) {
  local = normalize(local); remote = normalize(remote);
  if (local.resetAt > remote.resetAt) return true;
  for (const [id, s] of Object.entries(local.stats)) if (!remote.stats[id] || (s.t || 0) > (remote.stats[id].t || 0)) return true;
  const ids = new Set(remote.exams.map((e) => e.id));
  return local.exams.some((e) => !ids.has(e.id));
}
const differs = (a, b) => hasNewer(a, b) || hasNewer(b, a);
const hasData = (p) => Object.keys(p.stats).length > 0 || p.exams.length > 0 || p.resetAt > 0;

const loadProgress = () => normalize(lsGet(LS.progress) || emptyProgress());
let progress = loadProgress();
const saveLocal = () => lsSet(LS.progress, progress);
function save() { progress.updatedAt = Date.now(); saveLocal(); Sync.flush(); }

const st = (id) => progress.stats[id];
const isWeak = (id) => { const s = st(id); return !!s && s.a > s.c && s.s < 2; };
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
const isCorrect = (q, picks) => sameSet(q.answer, picks || []);
function record(id, ok) {
  const s = Object.assign({ a: 0, c: 0, s: 0, l: 0, t: 0 }, progress.stats[id]);
  s.a++;
  if (ok) { s.c++; s.s++; } else { s.s = 0; }
  s.l = ok ? 1 : 0;
  s.t = Date.now();
  progress.stats[id] = s;
}
// 習熟度から見た「解く価値」。未回答 1、苦手・直近で誤答 1.3、1 回正解 0.45、2 回続けて正解は日数とともに少しずつ戻る。
function needOf(id) {
  const s = st(id);
  if (!s) return 1;
  if (isWeak(id) || !s.l) return 1.3;
  if (s.s < 2) return 0.45;
  return Math.min(0.4, 0.1 + ((Date.now() - s.t) / 864e5) * 0.02);
}
const priority = (q) => (domainOf(q.domain).w / 25) * topicWeight(q.topic) * needOf(q.id);
const MIN_FOR_ESTIMATE = 3;
// 配点で重み付けした予想得点率と、分野ごとの伸びしろ（全体の得点率で何ポイント上がり得るか）
function estimate() {
  let wsum = 0, acc = 0, ready = true;
  const per = DOMAINS.map((d) => {
    const s = summarize(QUESTIONS.filter((q) => q.domain === d.n));
    const measured = s.answered >= MIN_FOR_ESTIMATE;
    if (measured) { wsum += d.w; acc += d.w * s.rate; } else ready = false;
    const gain = d.w * (1 - (measured ? s.rate : 0.5));
    return { d, s, measured, gain };

  return { ready, value: ready && wsum ? acc / wsum : null, per };
}
function focusTopics(limit) {
  const topics = [...new Set(QUESTIONS.map((q) => q.topic))].map((t) => {
    const qs = QUESTIONS.filter((q) => q.topic === t);
    const s = summarize(qs);
    const w = qs.reduce((a, q) => a + domainOf(q.domain).w, 0) / qs.length / 25;
    const score = topicWeight(t) * w * (s.answered ? 1 - s.rate + s.weak / qs.length : 0.8);
    return { t, s, score, freq: HIGH_FREQ.has(t) };

}
function summarize(qs) {
  let answered = 0, okLatest = 0, weak = 0;
  for (const q of qs) {
    const s = st(q.id);
    if (!s) continue;
    answered++;
    if (s.l) okLatest++;
    if (isWeak(q.id)) weak++;
  }
  return { total: qs.length, answered, okLatest, weak, rate: answered ? okLatest / answered : null };
}

/* ---------- アカウントへの保存（db） ---------- */
const SYNC_TEXT = {
  local: ['この端末に保存', '学習記録はこの端末のブラウザにだけ保存しています。ほかの端末とは同期しません。'],
  syncing: ['同期中…', 'アカウントの学習記録を読み込んでいます。'],
  saving: ['保存中…', 'アカウントに保存しています。'],
  cloud: ['保存済み', 'アカウントに保存しています。ほかの端末で開いても続きから使えます。'],
  waiting: ['同期待ち', '保存先に接続できていません。この端末には保存しているので、つながりしだい同期します。'],
  error: ['保存エラー', 'アカウントへの保存に失敗しました。この端末には保存しています。'],
};
const Sync = {
  state: 'local', db: null, uid: null, ref: null, unsub: null, writing: false, dirty: false,
  set(state, code) {
    this.state = state;
    const el = document.getElementById('sync');
    if (!el) return;
    const [label, title] = SYNC_TEXT[state] || SYNC_TEXT.local;
    el.dataset.state = state;
    el.title = title + (code ? `（${code}）` : '');
    el.lastElementChild.textContent = label;
  },
  async init() {
    for (let i = 0; i < 5 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise((r) => setTimeout(r, 300));
    if (!window.claude || typeof window.claude.use !== 'function') { this.set('local'); return; }
    this.set('syncing');
    const timer = setTimeout(() => { if (this.state === 'syncing') this.set('waiting'); }, 10000);
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      clearTimeout(timer);
      if (!db || !uid) { this.set('local'); return; }
      this.db = db; this.uid = uid;
      await this.attach();
    } catch (e) {
      clearTimeout(timer);
      this.set('error', e && e.code);
    }
  },
  // 選択中の試験の記録（試験ごとに別のドキュメント）につなぐ。試験を切り替えたときも呼ぶ。
  async attach() {
    if (this.unsub) { try { this.unsub(); } catch (e) { /* 解除済み */ } this.unsub = null; }
    this.ref = null;
    if (!this.db || !this.uid) return;
    const key = X.key;
    const ref = this.db.collection('data/users/' + this.uid).doc(X.doc);
    this.set('syncing');
    const timer = setTimeout(() => { if (this.state === 'syncing' && X.key === key) this.set('waiting'); }, 10000);
    try {
      const snap = await ref.get();
      clearTimeout(timer);
      if (X.key !== key) return; // 読み込み中に別の試験へ切り替えた
      this.ref = ref;
      const remote = snap.exists ? snap.data() : null;
      if (remote) {
        const m = merge(remote, progress);
        const changed = differs(m, progress);
        progress = m;
        saveLocal();
        if (changed) refreshPassive();
      }
      if (remote ? hasNewer(progress, remote) : hasData(progress)) await this.flush();
      else this.set('cloud');
      const unsub = ref.onSnapshot((s) => {
        if (X.key !== key || !s.exists || s.metadata.hasPendingWrites) return;
        const m = merge(progress, s.data());
        if (differs(m, progress)) { progress = m; saveLocal(); refreshPassive(); }
      }, () => { if (!this.writing && X.key === key) this.set('waiting'); });
      if (X.key === key) this.unsub = typeof unsub === 'function' ? unsub : null;
      else if (typeof unsub === 'function') unsub();
    } catch (e) {
      clearTimeout(timer);
      if (X.key === key) this.set('error', e && e.code);
    }
  },
  async flush() {
    if (!this.ref) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    this.set('saving');
    try {
      do {
        this.dirty = false;
        // 書き込み先と中身は同じ時点のものを使う（途中で試験を切り替えても混ざらない）
        const ref = this.ref;
        if (!ref) break;
        const body = JSON.parse(JSON.stringify(progress));
        try {
          await ref.set(body);
        } catch (e) {
          if (!e || e.code !== 'unavailable') throw e;
          await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
          await ref.set(body);
        }
      } while (this.dirty);
      this.set('cloud');
    } catch (e) {
      this.set('error', e && e.code);
    } finally {
      this.writing = false;
    }
  },
};

/* ---------- 出題の組み立て ---------- */
function practicePool(p) {
  return QUESTIONS.filter((q) => p.domains.includes(q.domain) && (!p.topic || q.topic === p.topic) && (p.order !== 'weak' || isWeak(q.id)));
}
function pickPractice(p) {
  const pool = practicePool(p);
  const n = p.count === 'all' ? pool.length : Math.min(pool.length, +p.count || 10);
  let ordered;
  if (p.order === 'smart') {
    // 合格に効く順: 配点 × 頻出度 × 習熟度。少しだけ揺らして毎回同じ並びにならないようにする。
    ordered = pool.map((q) => [q, priority(q) * (0.85 + Math.random() * 0.3)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
  } else {
    ordered = shuffle(pool);
  }
  return shuffle(ordered.slice(0, n)).map((q) => q.id);
}
// 重み付きの無作為抽出（重いものほど前に来やすい）
const weightedShuffle = (items, w) => items.map((x) => [x, Math.pow(Math.random(), 1 / w(x))]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
function examCounts(total) {
  const raw = DOMAINS.map((d) => ({ n: d.n, x: (total * d.w) / 100 }));
  const out = Object.fromEntries(raw.map((r) => [r.n, Math.floor(r.x)]));
  let left = total - Object.values(out).reduce((a, b) => a + b, 0);
  for (const r of raw.slice().sort((a, b) => (b.x % 1) - (a.x % 1))) { if (left <= 0) break; out[r.n]++; left--; }
  return out;
}
function pickExam() {
  const total = Math.min(EXAM.n, QUESTIONS.length);
  const want = examCounts(total);
  const chosen = [];
  const spare = [];
  for (const d of DOMAINS) {
    const pool = weightedShuffle(QUESTIONS.filter((q) => q.domain === d.n), (q) => topicWeight(q.topic));
    chosen.push(...pool.slice(0, want[d.n]));
    spare.push(...pool.slice(want[d.n]));
  }
  if (chosen.length < total) chosen.push(...shuffle(spare).slice(0, total - chosen.length));
  return shuffle(chosen).map((q) => q.id);
}

/* ---------- 構成図 ---------- */
let dgSeq = 0;
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes)) return '';
  const { CW, CH, NW, NH, PAD } = GEO;
  const W = d.cols * CW + PAD * 2, H = d.rows * CH + PAD * 2;
  const mid = 'ah' + (++dgSeq);
  const groups = Array.isArray(d.groups) ? d.groups : [];
  const inside = (a, b) => a.c <= b.c && a.r <= b.r && a.c + a.w >= b.c + b.w && a.r + a.h >= b.r + b.h;
  let gs = '';
  groups.forEach((g, i) => {
    let depth = 0;
    for (let j = 0; j < i; j++) if (inside(groups[j], g)) depth++;
    const inset = 4 + depth * 12;
    const x = PAD + g.c * CW + inset, y = PAD + g.r * CH + inset, w = g.w * CW - inset * 2, h = g.h * CH - inset * 2;
    gs += `<g class="g g-${esc(g.kind)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="g-label" x="${x + 10}" y="${y}" dominant-baseline="central">${esc(g.label)}</text></g>`;
  });
  const C = (n) => ({ x: PAD + n.c * CW + CW / 2, y: PAD + n.r * CH + CH / 2 });
  const byId = Object.fromEntries(d.nodes.map((n) => [n.id, n]));
  let es = '', ls = '';
  for (const e of d.edges || []) {
    const A = byId[e.from], B = byId[e.to];
    if (!A || !B) continue;
    const a = C(A), b = C(B), dx = b.x - a.x, dy = b.y - a.y;
    const hw = NW / 2 + 4, hh = NH / 2 + 4;
    const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    const x1 = a.x + dx * t, y1 = a.y + dy * t, x2 = b.x - dx * t, y2 = b.y - dy * t;
    es += `<line class="e-line${e.style === 'dashed' ? ' dashed' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" marker-end="url(#${mid})"${e.both ? ` marker-start="url(#${mid})"` : ''}/>`;
    if (e.label) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      if (Math.abs(dy) < 1) ls += `<text class="e-label" x="${mx}" y="${my - 8}" text-anchor="middle">${esc(e.label)}</text>`;
      else if (Math.abs(dx) < 1) ls += `<text class="e-label" x="${mx + 7}" y="${my}" dominant-baseline="central">${esc(e.label)}</text>`;
      else ls += `<text class="e-label" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central">${esc(e.label)}</text>`;
    }
  }
  let ns = '';
  for (const n of d.nodes) {
    const c = C(n);
    const tight = dispWidth(n.label) > 14 ? ' tight' : '';
    ns += `<g style="--k:var(--k-${esc(n.kind)})"><rect class="n-box" x="${c.x - NW / 2}" y="${c.y - NH / 2}" width="${NW}" height="${NH}" rx="7"/><rect class="n-kind" x="${c.x - NW / 2 + 8}" y="${c.y - NH / 2 - 2.5}" width="18" height="5" rx="2.5"/>`;
    if (n.sub) ns += `<text class="n-label${tight}" x="${c.x}" y="${c.y - 7}" text-anchor="middle" dominant-baseline="central">${esc(n.label)}</text><text class="n-sub" x="${c.x}" y="${c.y + 11}" text-anchor="middle" dominant-baseline="central">${esc(n.sub)}</text>`;
    else ns += `<text class="n-label${tight}" x="${c.x}" y="${c.y}" text-anchor="middle" dominant-baseline="central">${esc(n.label)}</text>`;
    ns += '</g>';
  }
  const svg = `<svg class="dg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:${Math.round(W * 0.72)}px" role="img" aria-label="${esc(d.caption)}">
<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="e-head" d="M0,0L10,5L0,10z"/></marker></defs>
${gs}${es}${ns}${ls}</svg>`;
  return `<figure class="figure"><figcaption>${esc(d.caption)}</figcaption><div class="dg-wrap">${svg}</div></figure>`;
}

/* ---------- 問題カードと解説 ---------- */
function qcard(q, perm, picks, mode) {
  const multi = q.type === 'multi';
  const need = q.answer.length;
  const dom = domainOf(q.domain);
  const choices = perm.map((orig, k) => {
    const sel = picks.includes(orig);
    const corr = q.answer.includes(orig);
    let cls = 'choice', mark = '';
    if (mode === 'reveal') {
      if (corr) { cls += ' is-correct'; mark = ICON.ok + (sel ? 'あなたの回答' : '正解'); }
      else if (sel) { cls += ' is-wrong'; mark = ICON.ng + 'あなたの回答'; }
    }
    return `<button type="button" class="${cls}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel}" data-act="pick" data-i="${orig}" data-key="c${k}"${mode === 'reveal' ? ' aria-disabled="true"' : ''}><span class="letter">${LETTERS[k]}</span><span class="ctext">${esc(q.choices[orig])}</span><span class="mark">${mark}</span></button>`;
  }).join('');
  return `<article class="qcard">
  <div class="qmeta"><span class="chip">第 ${q.domain} 分野 ${esc(dom ? dom.short : '')}</span><span class="chip">${esc(q.topic)}</span>${multi ? `<span class="chip">${need} つ選択</span>` : ''}<span class="qid">${esc(q.id)}</span></div>
  <p class="stem">${esc(q.stem)}${multi ? `<span class="need">（${need} つ選択してください。）</span>` : ''}</p>
  <div class="choices" role="${multi ? 'group' : 'radiogroup'}" aria-label="選択肢">${choices}</div>
</article>`;
}
function feedback(q, perm, picks) {
  const ok = isCorrect(q, picks);
  const answered = picks.length > 0;
  const corr = perm.map((o, k) => (q.answer.includes(o) ? LETTERS[k] : null)).filter(Boolean).join('・');
  const whys = perm.map((o, k) => {
    const c = q.answer.includes(o);
    return `<li class="${c ? 'w-ok' : 'w-ng'}"><span class="wl">${LETTERS[k]}</span><div><span class="wtag">${c ? '正しい' : '誤り'}${picks.includes(o) ? ' · あなたの回答' : ''}</span><p>${esc(q.why[o])}</p></div></li>`;
  }).join('');
  const verdict = !answered
    ? `<div class="verdict ng">${ICON.dash}<strong>未回答</strong><span class="ans">正解は ${corr}</span></div>`
    : `<div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? ICON.ok : ICON.ng}<strong>${ok ? '正解' : '不正解'}</strong><span class="hud-label">${ok ? 'HIT' : 'MISS'}</span><span class="ans">正解は ${corr}</span></div>`;
  return `<section class="fb" id="fb" aria-live="polite">
  ${verdict}
  <div class="fb-block"><h3>解説</h3><p>${esc(q.explain)}</p></div>
  ${renderDiagram(q.diagram)}
  <div class="fb-block"><h3>選択肢ごとの理由</h3><ul class="whys">${whys}</ul></div>
  <div class="point"><h3>覚えるポイント</h3><p>${esc(q.point)}</p></div>
</section>`;
}
const confirmBox = (msg, yesAct, yesLabel, noAct, noLabel, tone) => `<div class="confirm${tone === 'neutral' ? ' neutral' : ''}" role="alertdialog" aria-label="${esc(msg)}"><p>${esc(msg)}</p><div class="btn-row"><button type="button" class="btn ${tone === 'neutral' ? 'primary' : 'danger'}" data-act="${yesAct}" data-key="confirm-yes">${yesLabel}</button><button type="button" class="btn" data-act="${noAct}">${noLabel}</button></div></div>`;

// 予想得点率のゲージ。分野ごとの回答が足りないうちは回答率を表示する。
function heroPanel(all, est, weakN) {

  const p = pct(v);
  const R = 52, C = 2 * Math.PI * R;
  const a = ((EXAM.pass / 100) * 360 - 90) * (Math.PI / 180);
  const tick = (r) => `${(60 + Math.cos(a) * r).toFixed(1)} ${(60 + Math.sin(a) * r).toFixed(1)}`;
  let status, cls, head, sub;
  if (!ready) { status = 'データ収集中'; cls = 'scan'; head = 'ミッション開始'; sub = `各分野 ${MIN_FOR_ESTIMATE} 問以上解くと、配点で重み付けした予想得点率を算出します。`; }
  else if (p >= EXAM.pass) { status = '合格圏'; cls = 'go'; head = `合格ライン +${p - EXAM.pass} pt`; sub = '合格圏に入っています。模擬試験で時間配分を仕上げましょう。'; }
  else { status = p >= 55 ? '接近中' : '訓練中'; cls = p >= 55 ? 'near' : 'low'; head = `合格ラインまで あと ${EXAM.pass - p} pt`; sub = '伸びしろの大きい分野から攻略すると近道です。'; }
  const best = progress.exams.length ? Math.max(...progress.exams.map((e) => (e.n ? pct(e.c / e.n) : 0))) + '<small>%</small>' : '—';
  return `<section class="hero" aria-label="学習の状況">
    <div class="hero-top"><span class="hud-label">MISSION // ${X.code}</span><span class="status ${cls}"><i></i>${status}</span></div>
    <div class="hero-main">
      <div class="gauge" role="img" aria-label="${ready ? '予想得点率' : '回答率'} ${p}%">
        <div class="g-sweep" aria-hidden="true"></div>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="g-ticks" cx="60" cy="60" r="59"/>
          <circle class="g-track" cx="60" cy="60" r="${R}"/>
          ${v > 0 ? `<circle class="g-val" cx="60" cy="60" r="${R}" stroke-dasharray="${(C * v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>` : ''}
          ${ready ? `<path class="g-pass" d="M${tick(R - 9)} L${tick(R + 9)}"/>` : ''}
        </svg>
        <div class="g-read"><span class="g-num">${p}<small>%</small></span><span class="g-cap">${ready ? '予想得点率' : '回答率'}</span></div>
      </div>
      <div class="hero-side">
        <h1>${head}</h1>
        <p class="lead">${sub}</p>
        <dl class="readouts">
          <div><dt>回答済み</dt><dd>${all.answered}<small>/${all.total}</small></dd></div>
          <div><dt>苦手</dt><dd>${weakN}</dd></div>
          <div><dt>模試ベスト</dt><dd>${best}</dd></div>
        </dl>
      </div>
    </div>
  </section>`;
}

function viewRunner(s) {

    : `<div class="q-actions"><button type="button" class="btn primary" data-act="submit" data-key="submit"${picks.length === need ? '' : ' disabled'}>回答する</button><span class="hint">${need > 1 ? `${need} つ選んでから回答します。` : ''}<span class="kbd-hint"> <span class="kbd">1</span>〜<span class="kbd">${q.choices.length}</span> で選択、<span class="kbd">Enter</span> で回答</span></span></div>`;

function viewExamRun(s) {
  const id = s.ids[s.i], q = QMAP[id];
  const picks = s.picks[id] || [];
  const answered = s.ids.filter((x) => (s.picks[x] || []).length).length;
  const flagged = s.ids.filter((x) => s.flags[x]).length;
  let confirm = '';
  if (ui.confirm === 'finish') {
    const un = s.ids.length - answered;
    const msg = `採点しますか。${un ? `未回答が ${un} 問あります。誤答による減点はないので、未回答はなくしておくのが得です。` : ''}${flagged ? `見直しの印が ${flagged} 問に付いています。` : ''}採点すると回答は変更できません。`;

function examStats(rec) {

}

function finishExam(auto) {
  const s = sessions.exam;
  if (!s || s.finished) return;
  const items = s.ids.map((id) => [id, s.picks[id] || []]);
  let c = 0;
  for (const [id, p] of items) {
    const q = QMAP[id];
    const ok = p.length > 0 && isCorrect(q, p);
    if (ok) c++;
    if (p.length) record(id, ok);
  }
  const rec = {
    id: 'e' + s.startedAt.toString(36), at: Date.now(), n: items.length, c,
    sec: Math.min(Math.round((Date.now() - s.startedAt) / 1000), EXAM.min * 60), auto: !!auto, items,
  };
  progress.exams = progress.exams.filter((e) => e.id !== rec.id).concat(rec).slice(-30);
  save();
  s.finished = true;
  s.resultId = rec.id;
  saveSessions();

let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function ensureTimer() {
  const s = sessions.exam;

}
function tick() {

  const el = document.getElementById('timer');
  if (el) { el.textContent = fmtDur(left / 1000); el.classList.toggle('low', left < 10 * 60 * 1000); }
}

/* ---------- 成績 ---------- */

  topics.sort((a, b) => (a.rate == null) - (b.rate == null) || (a.rate ?? 0) - (b.rate ?? 0) || b.weak - a.weak || a.t.localeCompare(b.t, 'ja'));

  <section class="section"><h2 data-hud="SIMULATION LOG">模擬試験の記録</h2>${exams.length ? historyChart(progress.exams) + `<div class="rows">${exams.map(examRow).join('')}</div>` : '<div class="empty"><p>まだ記録はありません。模擬試験を受けると、ここに得点の推移が出ます。</p><a class="btn sm" href="#exam">模試へ</a></div>'}</section>
  <section class="section"><h2 data-hud="SYSTEM">記録の管理</h2><p class="small muted">${SYNC_TEXT[Sync.state] ? esc(SYNC_TEXT[Sync.state][1]) : ''}</p>${confirm}<div><button type="button" class="btn sm" data-act="reset-ask"${hasData(progress) && (Object.keys(progress.stats).length || progress.exams.length) ? '' : ' disabled'}>${esc(X.short)} の学習記録をリセット</button></div>${other ? `<p class="small muted">学習記録は試験ごとに分けて保存しています。リセットしても ${esc(other)} の記録は消えません。</p>` : ''}</section>

function historyChart(exams) {
  const W = 640, H = 210, m = { l: 40, r: 14, t: 14, b: 28 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const n = exams.length, slot = pw / n, bw = Math.min(28, slot * 0.6);
  const y = (v) => m.t + ph * (1 - v / 100);
  let s = '';
  for (const v of [0, 25, 50, 75, 100]) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v)}" text-anchor="end" dominant-baseline="central">${v}%</text>`;
  exams.forEach((e, i) => {
    const v = e.n ? (e.c / e.n) * 100 : 0;
    const x = m.l + slot * i + (slot - bw) / 2, top = y(v), base = y(0), h = base - top, r = Math.min(4, h / 2, bw / 2);
    const d = h > 0 ? `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z` : '';
    const tip = `${fmtDate(e.at)} · ${Math.round(v)}%（${e.c}/${e.n}）`;
    s += `<g data-tip="${esc(tip)}"><rect class="hit" x="${m.l + slot * i}" y="${m.t}" width="${slot}" height="${ph}"/>${d ? `<path class="bar" d="${d}"/>` : ''}</g>`;
    if (n <= 12 || i % Math.ceil(n / 12) === 0 || i === n - 1) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
  });
  s += `<line class="pass" x1="${m.l}" x2="${W - m.r}" y1="${y(EXAM.pass)}" y2="${y(EXAM.pass)}"/><text class="pass-label" x="${W - m.r}" y="${y(EXAM.pass) - 7}" text-anchor="end">合格の目安 ${EXAM.pass}%</text>`;
  return `<div class="chart" data-chart><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="模擬試験の正答率の推移（${n} 回）">${s}</svg><div class="tip" hidden></div></div>`;
}

/* ---------- 画面の切り替え ---------- */
const VIEWS = { home: viewHome, practice: viewPractice, exam: viewExam, stats: viewStats };
function route() { const h = (location.hash || '').slice(1); return VIEWS[h] ? h : 'home'; }

const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 試験の切り替え ---------- */
function renderSwitch() {
  const el = document.getElementById('xsw');
  if (!el) return;
  el.innerHTML = EXAM_KEYS.length < 2 ? '' : EXAM_KEYS.map((k) => `<button type="button" data-act="exam-switch" data-x="${k}" aria-pressed="${k === X.key}" title="${esc(EXAMS[k].code + ' ' + EXAMS[k].title)}" aria-label="${esc(EXAMS[k].code + ' ' + EXAMS[k].title)}">${esc(EXAMS[k].short)}</button>`).join('');
}
// 試験を選ぶ画面。選んでいない試験の進み具合は、この端末に保存した記録から出す。
function examSnapshot(k) {
  const x = EXAMS[k];
  const qs = BANK[k] || [];
  const keys = lsKeys(x);
  const p = k === X.key ? progress : normalize(lsGet(keys.progress));
  const s = (k === X.key ? sessions : lsGet(keys.sessions)) || {};
  const ids = new Set(qs.map((q) => q.id));
  let answered = 0, ok = 0;
  for (const [id, v] of Object.entries(p.stats)) { if (!v || !ids.has(id)) continue; answered++; if (v.l) ok++; }
  const best = p.exams.length ? Math.max(...p.exams.map((e) => (e.n ? pct(e.c / e.n) : 0))) : null;
  const examOn = !!(s.exam && !s.exam.finished && Array.isArray(s.exam.ids));
  return { x, total: qs.length, answered, rate: answered ? ok / answered : null, best, examOn };
}
function viewSelect() {

// 試験ごとに記録・解答中の状態・演習の設定を読み直す。模擬試験の途中でも、残り時間はそのまま進む。

function startPractice(ids, kind) {
  if (!ids.length) return;
  sessions.practice = newSession(kind || 'practice', ids);
  saveSessions();
  go('practice');
}
function startReview() {
