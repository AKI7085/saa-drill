:1,"w":2,"h":1}],"nodes":[{"id":"ea","label":"EC2 アプリ","sub":"Windows Server","kind":"compute","c":0,"r":0},{"id":"fa","label":"FSx アクティブ","sub":"SMB 共有","kind":"storage","c":1,"r":0},{"id":"eb","label":"EC2 アプリ","sub":"Windows Server","kind":"compute","c":0,"r":1},{"id":"fb","label":"FSx スタンバイ","sub":"障害時に自動切替","kind":"storage","c":1,"r":1},{"id":"ad","label":"Managed AD","sub":"認証","kind":"security","c":2,"r":0}],"edges":[{"from":"ea","to":"fa","label":"SMB"},{"from":"eb","to":"fa","label":"SMB"},{"from":"fa","to":"fb","label":"同期複製","style":"dashed"},{"from":"fa","to":"ad","label":"AD に参加"}]}},{"id":"d2-44","domain":2,"topic":"EFS・FSx","type":"single","stem":"ある企業は、オンプレミスの NetApp ストレージで、Linux アプリケーションには NFS、Windows クライアントには SMB で同じデータを提供しています。この企業は、データを AWS に移行します。移行中は、既存の NetApp の SnapMirror を使ってオンプレミスから AWS に差分を継続的にレプリケートし、AWS 側のファイルシステムは AZ 障害に耐える必要があります。Linux アプリケーションは NFS のままで、アプリケーションの変更を最小限に抑えなければなりません。これらの要件を満たすソリューションはどれですか。","choices":["Amazon FSx for Windows File Server のマルチ AZ ファイルシステムを作成し、Linux アプリケーションからは SMB でマウントする。AWS DataSync でデータを移行し、マルチ AZ 構成で可用性を確保する。","Amazon FSx for NetApp ONTAP のマルチ AZ ファイルシステムを作成し、NFS と SMB の両方で共有を提供する。SnapMirror でオンプレミスの NetApp からデータをレプリケートする。","Amazon EFS のリージョナルファイルシステムを作成し、Linux から NFS でマウントする。Windows クライアントには、EC2 上の Samba サーバーを経由して SMB で公開する。","オンプレミスに AWS Storage Gateway のファイルゲートウェイをデプロイし、NFS と SMB の共有を提供する。データは Amazon S3 に保存する。"],"answer":[1],"why":["FSx for Windows File Server は SMB 専用で、Linux アプリケーションを NFS のまま使えない。SnapMirror によるレプリケーションにも対応しない。","FSx for NetApp ONTAP は、NFS と SMB の両方に対応し、マルチ AZ 配置で AZ 障害に耐える。ONTAP の機能である SnapMirror で、オンプレミスの NetApp から差分を継続的に複製できる。","EFS は SMB に対応せず、Samba サーバーの構築と運用が必要になる。SnapMirror も使えず、移行元の NetApp との継続的なレプリケーションもできない。","ファイルゲートウェイはオンプレミスのキャッシュ用で、AWS 上のファイルシステムとして AZ 障害に耐える構成にはならない。SnapMirror にも対応しない。"],"explain":"「NFS と SMB の両方」「SnapMirror」「マルチ AZ」がそろったら、FSx for NetApp ONTAP を選ぶ。ONTAP のファイルシステムは、マルチプロトコルに対応し、オンプレミスの NetApp との SnapMirror や既存の運用ツールをそのまま使える。FSx for Windows File Server は SMB 専用、EFS は NFS 専用である。","point":"NFS と SMB の両方、または NetApp の SnapMirror が必要なら FSx for NetApp ONTAP。マルチ AZ 配置で AZ 障害にも耐える。","diagram":{"caption":"正解の構成: SnapMirror で移行する FSx for NetApp ONTAP（マルチ AZ）","cols":3,"rows":2,"groups":[],"nodes":[{"id":"on","label":"オンプレ NetApp","sub":"移行元","kind":"onprem","c":0,"r":0},{"id":"fsx","label":"FSx for ONTAP","sub":"マルチ AZ","kind":"storage","c":1,"r":0},{"id":"lx","label":"Linux EC2","sub":"アプリケーション","kind":"compute","c":2,"r":0},{"id":"wn","label":"Windows EC2","sub":"クライアント","kind":"compute","c":2,"r":1}],"edges":[{"from":"on","to":"fsx","label":"SnapMirror"},{"from":"fsx","to":"lx","label":"NFS"},{"from":"fsx","to":"wn","label":"SMB"}]}},{"id":"d2-45","domain":2,"topic":"ElastiCache","type":"single","stem":"ある企業は、Auto Scaling グループの Amazon EC2 インスタンスで動くウェブアプリケーションのセッション情報を、単一ノードの Amazon ElastiCache for Redis OSS に保存しています。ノードに障害が発生すると、セッション情報が失われ、すべての利用者がログアウトされます。この企業は、ノード障害時にセッション情報を保持したまま自動で復旧し、AZ 障害にも耐えることを求めています。アプリケーションの接続先の変更は最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ElastiCache for Memcached クラスターを 3 ノードで作成し、ノードを複数の AZ に分散する。アプリケーションは、クライアント側でキーを分散して保存する。","単一ノードの ElastiCache for Redis OSS で、毎日スナップショットを取得する。障害時は、最新のスナップショットから新しいクラスターを復元する。","ElastiCache for Redis OSS のレプリケーショングループを作成し、プライマリと同じ AZ にリードレプリカを 2 台配置して、自動フェイルオーバーを有効にする。","Redis OSS のレプリケーショングループを作成し、別の AZ にレプリカを置く。マルチ AZ と自動フェイルオーバーを有効にし、プライマリエンドポイントに接続する。"],"answer":[3],"why":["Memcached にはレプリケーションがなく、ノードに障害が起きるとそのノードのデータが失われる。セッション情報を保持するという要件を満たさない。","毎日のスナップショットでは、障害の直前までのセッション情報を保持できない。復元は手動で時間がかかり、接続先のエンドポイントも変わる。","ノード障害には耐えられるが、すべてのノードが同じ AZ にあるため、AZ 障害に耐えられない。","リードレプリカを別の AZ に置き、マルチ AZ と自動フェイルオーバーを有効にすると、プライマリの障害時にレプリカが自動で昇格する。プライマリエンドポイントが昇格後のノードを指すため、アプリケーションの変更も最小限で済む。"],"explain":"「セッションを保持」「自動で復旧」「AZ 障害にも耐える」から、Redis OSS のレプリケーショングループで、別の AZ にレプリカを置き、マルチ AZ と自動フェイルオーバーを有効にする。Memcached にはレプリケーションと自動フェイルオーバーがない。レプリカがプライマリと同じ AZ にあるだけでは、AZ 障害に耐えられない。","point":"ElastiCache のマルチ AZ は、別の AZ のレプリカと自動フェイルオーバーで実現する。Memcached にはレプリケーションがない。","diagram":{"caption":"正解の構成: 別の AZ にレプリカを置く Redis のマルチ AZ 構成","cols":2,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":1}],"nodes":[{"id":"app","label":"EC2 アプリ","sub":"セッションを保存","kind":"compute","c":0,"r":0},{"id":"pri","label":"プライマリ","sub":"Redis OSS","kind":"database","c":1,"r":0},{"id":"rep","label":"レプリカ","sub":"障害時に昇格","kind":"database","c":1,"r":1}],"edges":[{"from":"app","to":"pri","label":"プライマリ EP"},{"from":"pri","to":"rep","label":"非同期複製","style":"dashed"}]}},{"id":"d2-46","domain":2,"topic":"VPC","type":"single","stem":"ある企業は、VPC（CIDR ブロックは 10.0.0.0/16）の 2 つの AZ にあるプライベートサブネット（各 /24）で、Auto Scaling グループの Amazon EC2 インスタンスを運用しています。VPC の CIDR ブロックの範囲はほとんど既存のサブネットなどに割り当て済みです。事業の成長でサブネットの IP アドレスが不足し、スケールアウトのときにインスタンスの起動に失敗するようになりました。この企業は、既存のインスタンスを停止せずに、今後も安定してスケールアウトできるようにすることを求めています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["既存の各プライベートサブネットの CIDR ブロックを /22 に拡張する。Auto Scaling グループの設定は変更しない。","新しい VPC を作成して環境を再構築し、VPC ピアリングで既存の VPC と接続する。Auto Scaling グループのインスタンスを新しい VPC に移す。","VPC にセカンダリ IPv4 CIDR ブロックを関連付け、各 AZ に新しいプライベートサブネットを作成する。Auto Scaling グループに新しいサブネットを追加する。","インスタンスタイプを大きくして、必要なインスタンスの台数を減らす。サブネットで使用する IP アドレスの数を減らして、起動の失敗を避ける。"],"answer":[2],"why":["サブネットの CIDR ブロックは、作成後に変更できない。拡張するには、サブネットの作り直しが必要になる。","動作はするが、環境の再構築、ピアリングの設定、インスタンスの移行が必要で、運用負荷が非常に高い。IP アドレスの不足は VPC の CIDR の追加で解決できる。","VPC には作成後にセカンダリ CIDR ブロックを追加できる。新しい範囲に各 AZ のサブネットを作成して Auto Scaling グループに加えれば、既存のインスタンスに影響せず、起動できる IP アドレスを増やせる。","インスタンスを大きくしても、将来の負荷に対応するスケールアウトの余地は広がらない。負荷が増えれば、また IP アドレスが不足する。"],"explain":"「サブネットの IP アドレスが不足」「VPC の CIDR はほぼ使用済み」「既存のインスタンスは停止しない」から、VPC のセカンダリ CIDR ブロックを追加する。サブネットの CIDR ブロックは作成後に変更できないが、VPC には CIDR ブロックを追加できる。追加した範囲に新しいサブネットを作り、Auto Scaling グループのサブネットに加える。","point":"サブネットの CIDR は変更できないが、VPC にはセカンダリ CIDR を追加できる。IP 枯渇は新しいサブネットを増やして対応する。","diagram":{"caption":"正解の構成: セカンダリ CIDR のサブネットを各 AZ に追加する","cols":2,"rows":2,"groups":[{"label":"VPC（CIDR を追加）","kind":"vpc","c":0,"r":0,"w":2,"h":2},{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":1,"r":1,"w":1,"h":1}],"nodes":[{"id":"asg","label":"Auto Scaling","sub":"サブネットを追加","kind":"compute","c":0,"r":0},{"id":"na","label":"新サブネット","sub":"セカンダリ CIDR","kind":"network","c":1,"r":0},{"id":"nb","label":"新サブネット","sub":"セカンダリ CIDR","kind":"network","c":1,"r":1}],"edges":[{"from":"asg","to":"na","label":"スケールアウト"},{"from":"asg","to":"nb","label":"スケールアウト"}]}},{"id":"d2-47","domain":2,"topic":"SQS・SNS","type":"single","stem":"ある EC 事業者の注文サービスは、注文イベントを Amazon SNS トピックに発行し、配送システム用、返品システム用、ギフト包装システム用の 3 つの Amazon SQS キューをサブスクライブしています。現在はどのシステムもすべてのイベントを受信し、自分に関係のないイベントを破棄しているため、不要な処理と費用が発生しています。イベントには、orderType（standard、return、gift）がメッセージ属性として付いています。ソリューションアーキテクトは、パブリッシャーのコードの変更を最小限に抑えて、各システムが関係するイベントだけを受信するようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["orderType ごとに SNS トピックを 3 つ作成する。パブリッシャーが orderType を判定して対応するトピックに発行するように変更し、各キューを対応するトピックにサブスクライブする。","各 SQS キューの前に AWS Lambda 関数を配置する。関数内で orderType を判定し、関係のないイベントを破棄する。","各キューのサブスクリプションにフィルターポリシーを設定し、orderType 属性の値が一致するメッセージだけを配信する。","各 SQS キューのメッセージ保持期間を短く設定し、関係のないイベントが処理される前に自動的に削除されるようにする。"],"answer":[2],"why":["要件は満たせるが、パブリッシャーのコードを変更する必要があり、トピックも増える。コードの変更を最小限にするという要件に合わない。","不要なイベントの破棄はできるが、Lambda 関数の実装・運用が必要になる。配信後の破棄なので、SQS への配信と関数の呼び出しの費用もかかる。","SNS のサブスクリプションフィルターポリシーは、メッセージ属性の値に基づいて、一致するメッセージだけをサブスクライバーに配信する。パブリッシャーを変更せずに済み、不要な配信そのものがなくなる。","保持期間を短くすると、関係のあるイベントも処理前に削除されるおそれがある。関係のないイベントが配信されること自体は止められない。"],"explain":"「パブリッシャーの変更を最小限に」「関係するイベントだけを受信」という言葉から、SNS のメッセージフィルタリングを選ぶ。サブスクリプションごとにフィルターポリシーを設定すると、メッセージ属性（既定）または本文の内容に一致したメッセージだけがそのキューに配信される。1 つのトピックのまま、受信側の設定だけで振り分けられる。","point":"SNS のサブスクリプションフィルターポリシーで、サブスクライバーごとに受け取るメッセージを絞れる。","diagram":{"caption":"正解の構成: サブスクリプションのフィルターポリシーで振り分ける","cols":3,"rows":3,"groups":[],"nodes":[{"id":"pub","label":"注文サービス","sub":"orderType 属性付き","kind":"compute","c":0,"r":1},{"id":"sns","label":"SNS トピック","sub":"1 つのトピック","kind":"integration","c":1,"r":1},{"id":"q1","label":"SQS 配送用","sub":"orderType=standard","kind":"integration","c":2,"r":0},{"id":"q2","label":"SQS 返品用","sub":"orderType=return","kind":"integration","c":2,"r":1},{"id":"q3","label":"SQS ギフト用","sub":"orderType=gift","kind":"integration","c":2,"r":2}],"edges":[{"from":"pub","to":"sns"},{"from":"sns","to":"q1","label":"フィルター"},{"from":"sns","to":"q2","label":"フィルター"},{"from":"sns","to":"q3","label":"フィルター"}]}},{"id":"d2-48","domain":2,"topic":"SQS・SNS","type":"single","stem":"ある企業は、Amazon SQS 標準キューのメッセージを処理するアプリケーションを運用しています。処理に失敗したメッセージは、リドライブポリシーによってデッドレターキュー（DLQ）に移されます。先日、連携先の外部 API の障害により、数千件のメッセージが DLQ に移されました。障害は解消し、アプリケーションも修正済みです。この企業は、DLQ に残っているメッセージを失うことなく、元のキューで再処理したいと考えています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えてこれを実現する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["SQS の DLQ リドライブ機能を使って、DLQ のメッセージを元のソースキューに移動する。","DLQ からメッセージを受信して元のキューに送信し、送信後に DLQ から削除するスクリプトを Amazon EC2 インスタンスで実行する。","DLQ の可視性タイムアウトを 0 秒に変更し、メッセージが元のキューに自動的に戻るのを待つ。","元のキューの maxReceiveCount を大きな値に変更し、DLQ のメッセージが元のキューに自動的に戻るようにする。"],"answer":[0],"why":["DLQ リドライブは、DLQ に溜まったメッセージを、ソースキューまたは指定したキューにまとめて移動できる SQS の機能である。コンソールや API から実行でき、スクリプトの実装は不要である。","移動はできるが、スクリプトの作成・実行環境の運用が必要になる。送信と削除の間で障害が起きると、重複や取りこぼしの対処も必要になる。","可視性タイムアウトはメッセージの受信後に見えなくなる時間であり、キュー間のメッセージの移動には関係しない。DLQ のメッセージは元のキューに戻らない。","maxReceiveCount は、メッセージを DLQ に移すまでの受信回数のしきい値である。変更しても、すでに DLQ にあるメッセージは元のキューに戻らない。"],"explain":"「DLQ のメッセージを元のキューで再処理」「運用上のオーバーヘッドを最小限」から、SQS の DLQ リドライブ機能を選ぶ。原因を取り除いた後に、DLQ のメッセージをソースキューへ戻して再処理できる。移動の速度も指定できる。","point":"DLQ に隔離したメッセージは、原因を解消した後に DLQ リドライブで元のキューに戻して再処理できる。","diagram":null},{"id":"d2-49","domain":2,"topic":"SQS・SNS","type":"multi","stem":"ある証券会社は、約定イベントを発行するサービスを運用しています。約定イベントは、同じ銘柄ごとに発生した順序のまま、注文管理システムとリスク計算システムの両方で 1 回ずつ処理される必要があります。現在は標準の Amazon SNS トピックと標準の Amazon SQS キューを使っていますが、メッセージの順序が入れ替わったり、重複したりすることがあります。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えて、これらの要件を満たす必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["SNS FIFO トピックを作成する。発行時にメッセージグループ ID として銘柄コードを、重複排除 ID として約定 ID を指定する。","標準の SNS トピックを維持し、各システムで受信後にタイムスタンプで並べ替えてから処理するロジックをアプリケーションに追加する。","標準の SNS トピックに、システムごとの SQS FIFO キューをサブスクライブする。","システムごとに SQS FIFO キューを作成し、SNS FIFO トピックにサブスクライブする。各システムは自分のキューからメッセージを受信する。","各システムの標準キューに配信遅延を 15 分設定し、イベントが順序どおりに到着するまでの時間を確保する。"],"answer":[0,3],"why":["SNS FIFO トピックは、メッセージグループ ID ごとの順序と、重複排除 ID による重複排除を提供する。銘柄ごとの順序をグループ ID で保証できる。","並べ替えはアプリケーション側で実装することになり、運用上のオーバーヘッドが大きい。いつまで待てば並べ替えが完了するかも判断できず、重複の排除もできない。","標準の SNS トピックには、SQS FIFO キューをサブスクライブできない。FIFO キューをサブスクライブするには、FIFO トピックが必要である。","SNS FIFO トピックと SQS FIFO キューの組み合わせで、順序と重複排除を保ったまま、複数のシステムに同じイベントを配信できる。システムごとにキューを分けるので、互いの処理速度に影響されない。","配信遅延は、メッセージが最初に受信可能になるまでの時間を遅らせるだけである。到着順序や重複は保証されない。"],"explain":"「同じ銘柄ごとに順序どおり」「複数のシステムで 1 回ずつ」から、SNS FIFO トピックと SQS FIFO キューのファンアウトを選ぶ。FIFO トピックにはメッセージグループ ID と重複排除 ID を指定して発行し、サブスクライバーは SQS FIFO キューにする。標準トピックでは順序と重複の保証がなく、FIFO キューをサブスクライブすることもできない。","point":"順序と重複排除を保ったファンアウトは、SNS FIFO トピック＋ SQS FIFO キュー。順序の単位はメッセージグループ ID。","diagram":null},{"id":"d2-50","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、www.example.com のコーポレートサイトを、Application Load Balancer（ALB）の背後の Amazon EC2 インスタンスで公開しています。ALB のターゲットがすべて正常でなくなった場合は、メンテナンス中であることを伝える静的ページを表示したいと考えています。静的ページは Amazon S3 に置く予定です。ソリューションアーキテクトは、運用上のオーバーヘッドと費用を最小限に抑えて、障害時に自動で静的ページに切り替わるようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ALB へのエイリアスレコードと S3 ウェブサイトエンドポイントへのエイリアスレコードを、同じ重みの加重ルーティングで作成する。S3 側のレコードにヘルスチェックを設定する。","フェイルオーバールーティングを使う。ALB へのエイリアスレコードをプライマリにしてターゲットの正常性の評価を有効にし、S3 ウェブサイトエンドポイントへのエイリアスレコードをセカンダリにする。バケットは www.example.com の名前で作成し、静的ウェブサイトホスティングを有効にする。","ALB のリスナールールに、ターゲットグループが正常でないときに S3 の静的ページへリダイレクトするアクションを設定する。","ALB の UnHealthyHostCount を監視する CloudWatch アラームから AWS Lambda 関数を呼び出す。関数が Route 53 のレコードを S3 のエンドポイントに書き換え、復旧後に元に戻す。"],"answer":[1],"why":["加重ルーティングでは、ALB が正常でも半分のリクエストが静的ページに向かってしまう。障害時だけの切り替えにはならない。","フェイルオーバールーティングは、プライマリが異常なときだけセカンダリに DNS 応答を切り替える。ALB のエイリアスレコードはターゲットの正常性の評価で判定でき、S3 のウェブサイトエンドポイントへのエイリアスは、バケット名をレコード名に一致させて使う。追加のコンポーネントは不要である。","ALB のリスナールールには、ターゲットグループの正常性に応じて別の宛先に切り替える条件がない。すべてのターゲットが異常なときは、ALB が 503 を返す。","動作はするが、アラームと Lambda 関数の実装・運用が必要になる。DNS の変更を自前で行うことになり、運用上のオーバーヘッドが大きい。"],"explain":"「障害時に自動で静的ページへ」「運用上のオーバーヘッドと費用を最小限」から、Route 53 のフェイルオーバールーティングを選ぶ。プライマリの ALB へのエイリアスレコードでターゲットの正常性の評価を有効にし、セカンダリを S3 の静的ウェブサイトにする。エイリアスレコードのクエリには料金がかからない。","point":"障害時だけ別の宛先に切り替えるなら、フェイルオーバールーティング。S3 の静的サイトをセカンダリにする構成も定番。","diagram":{"caption":"正解の構成: ALB が異常になると S3 の静的ページへ切り替える","cols":4,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"www.example.com","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"フェイルオーバー","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"プライマリ","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"Web アプリ","kind":"compute","c":3,"r":0},{"id":"s3","label":"S3 静的サイト","sub":"セカンダリ","kind":"storage","c":1,"r":1}],"edges":[{"from":"user","to":"r53"},{"from":"r53","to":"alb","label":"正常時"},{"from":"alb","to":"ec2"},{"from":"r53","to":"s3","label":"異常時","style":"dashed"}]}},{"id":"d2-51","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、東京リージョンと米国東部（バージニア北部）リージョンの両方に、Application Load Balancer（ALB）と Web アプリケーションをデプロイしています。アプリケーションは app.example.com で、世界中の利用者に公開されています。この企業は、利用者を最もネットワークレイテンシーの低いリージョンに誘導し、一方のリージョンの ALB が正常でなくなった場合は、自動的にもう一方のリージョンに誘導することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["位置情報ルーティングを使い、アジアの国を東京、それ以外の国をバージニア北部に割り当てる。","加重ルーティングを使い、2 つのリージョンの ALB に同じ重みを設定する。","フェイルオーバールーティングを使い、東京をプライマリ、バージニア北部をセカンダリにする。","レイテンシールーティングで、2 つの ALB へのエイリアスレコードを作成し、それぞれターゲットの正常性の評価を有効にする。"],"answer":[3],"why":["利用者の所在地で割り当てるだけで、レイテンシーが最も低いリージョンは選ばれない。割り当てから漏れた場所への対処も必要になる。","利用者の場所にかかわらず、リクエストが半分ずつ分かれる。遠いリージョンに誘導される利用者が出て、レイテンシーが最小にならない。","常に東京が優先されるため、バージニア北部に近い利用者のレイテンシーが最小にならない。バージニア北部は障害時の待機にしかならない。","レイテンシールーティングは、利用者から最もレイテンシーの低いリージョンのレコードを返す。ターゲットの正常性の評価を有効にすれば、異常なリージョンのレコードは除外され、残りのリージョンが返される。"],"explain":"「最もレイテンシーの低いリージョン」にはレイテンシールーティングを使う。「異常なら自動で別リージョン」は、各レコードにヘルスチェック（エイリアスレコードならターゲットの正常性の評価）を組み合わせて実現する。位置情報や加重、フェイルオーバーは、要件のどちらか一方しか満たさない。","point":"最短レイテンシーはレイテンシールーティング。ヘルスチェックを組み合わせると異常なリージョンを自動で外せる。","diagram":{"caption":"正解の構成: レイテンシールーティングで最寄りの正常なリージョンへ","cols":4,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":1},{"label":"バージニア北部リージョン","kind":"region","c":2,"r":1,"w":2,"h":1}],"nodes":[{"id":"user","label":"世界中の利用者","sub":"","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"レイテンシー","kind":"network","c":1,"r":0},{"id":"alb1","label":"ALB","sub":"東京","kind":"network","c":2,"r":0},{"id":"app1","label":"EC2 インスタンス","sub":"Web アプリ","kind":"compute","c":3,"r":0},{"id":"alb2","label":"ALB","sub":"バージニア北部","kind":"network","c":2,"r":1},{"id":"app2","label":"EC2 インスタンス","sub":"Web アプリ","kind":"compute","c":3,"r":1}],"edges":[{"from":"user","to":"r53"},{"from":"r53","to":"alb1","label":"低レイテンシー"},{"from":"r53","to":"alb2","label":"低レイテンシー"},{"from":"alb1","to":"app1"},{"from":"alb2","to":"app2"}]}},{"id":"d2-52","domain":2,"topic":"Route 53","type":"multi","stem":"ある企業は、データ保護の規制により、欧州の利用者のリクエストを必ずフランクフルトリージョンの Application Load Balancer（ALB）で処理する必要があります。それ以外の地域の利用者は、東京リージョンの ALB で処理します。アプリケーションは shop.example.com で公開され、Amazon Route 53 で DNS を管理しています。ソリューションアーキテクトは、利用者の所在地が特定できなかった場合にも、DNS 応答が返るようにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["レイテンシールーティングのレコードを 2 つ作成し、それぞれのリージョンの ALB に向ける。","位置情報ルーティングのレコードを作成し、場所に欧州を指定して、フランクフルトの ALB へのエイリアスにする。","加重ルーティングのレコードを 2 つ作成し、フランクフルトの重みを高くする。","地理的近接性ルーティングで、フランクフルトに最大のバイアスを設定する。","場所をデフォルトに指定した位置情報ルーティングのレコードを作成し、東京の ALB へのエイリアスにする。"],"answer":[1,4],"why":["最もレイテンシーの低いリージョンに誘導するため、欧州の利用者がフランクフルトに誘導される保証がない。規制の要件を満たせない。","位置情報ルーティングは、DNS クエリの発信元の場所に基づいてレコードを返す。欧州の場所に一致するクエリを、必ずフランクフルトの ALB に誘導できる。","確率的に分散するだけで、場所による振り分けはできない。欧州の利用者が東京に誘導されることもある。","地理的近接性ルーティングは距離とバイアスで誘導先を決める。バイアスを大きくしても、欧州の利用者を必ずフランクフルトに限定する保証にはならない。","どの位置情報レコードにも一致しないクエリには、デフォルトのレコードが使われる。デフォルトがないと、一致しない場所からのクエリには応答が返らない。"],"explain":"「欧州の利用者を必ずフランクフルトで」は位置情報ルーティングの役割である。欧州のレコードと、それ以外や場所が特定できないクエリのためのデフォルトのレコードをセットで作る。位置情報ルーティングはデフォルトのレコードがないと、一致しない場所のクエリに応答しない点に注意する。","point":"利用者の所在地で厳密に振り分けるなら位置情報ルーティング。デフォルトのレコードも忘れずに作る。","diagram":{"caption":"正解の構成: 位置情報ルーティングと、デフォルトのレコード","cols":4,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"shop.example.com","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"位置情報","kind":"network","c":1,"r":0},{"id":"eu","label":"ALB","sub":"フランクフルト","kind":"network","c":2,"r":0},{"id":"jp","label":"ALB","sub":"東京","kind":"network","c":2,"r":1}],"edges":[{"from":"user","to":"r53"},{"from":"r53","to":"eu","label":"場所: 欧州"},{"from":"r53","to":"jp","label":"デフォルト"}]}},{"id":"d2-53","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、Application Load Balancer の背後にある Auto Scaling グループで、12 台の Amazon EC2 インスタンスの Web アプリケーションを運用しています。OS のパッチを適用した新しい AMI を月に 1 回作成しており、現在は運用担当者が古いインスタンスを 1 台ずつ手作業で終了して置き換えています。この企業は、サービスの処理能力をほとんど落とさずに、インスタンスを新しい AMI のものに自動で置き換えたいと考えています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["新しい AMI を指定した起動テンプレートのバージョンを作成する。最小正常率を 90% に設定して、Auto Scaling グループのインスタンスの更新を開始する。","新しい AMI を指定した別の Auto Scaling グループを作成し、同じターゲットグループに登録する。確認後に、古い Auto Scaling グループを削除する。","起動テンプレートの新しいバージョンをグループの既定に設定する。既存のインスタンスは、以降のスケールインで自然に置き換わるのを待つ。","AWS Lambda 関数で、すべてのインスタンスに SetInstanceHealth API で異常を設定し、Auto Scaling グループにインスタンスを置き換えさせる。"],"answer":[0],"why":["インスタンスの更新（instance refresh）は、起動テンプレートの変更に合わせて、インスタンスを段階的に置き換える機能である。最小正常率を指定すると、その割合以上の容量を維持しながら置き換えられる。","動作はするが、グループの作成、登録、削除という手順が毎月必要になる。台数や設定の二重管理も発生し、運用上のオーバーヘッドが大きい。","既定のバージョンを変えても、実行中のインスタンスは置き換わらない。スケールインのタイミングは負荷次第で、古い AMI のインスタンスがいつまでも残る。","すべてを一斉に異常にすると、処理能力が一時的に大きく落ちる。置き換えの進め方を制御できず、関数の実装・運用も必要になる。"],"explain":"「新しい AMI に自動で置き換え」「処理能力をほとんど落とさない」から、Auto Scaling のインスタンスの更新を選ぶ。最小正常率（minimum healthy percentage）と、新しいインスタンスのウォームアップ時間を設定すると、段階的に入れ替えられる。起動テンプレートの新バージョンを作ってから実行するだけでよい。","point":"AMI や起動テンプレートの変更の反映は、インスタンスの更新で。最小正常率で、置き換え中の容量を保てる。","diagram":{"caption":"正解の構成: インスタンスの更新で新しい AMI へ段階的に置き換える","cols":4,"rows":2,"groups":[],"nodes":[{"id":"lt","label":"起動テンプレート","sub":"新しい AMI","kind":"management","c":0,"r":0},{"id":"asg","label":"Auto Scaling","sub":"インスタンスの更新","kind":"compute","c":1,"r":0},{"id":"new","label":"新しい EC2","sub":"新 AMI","kind":"compute","c":2,"r":0},{"id":"alb","label":"ALB","sub":"ターゲット登録","kind":"network","c":3,"r":0},{"id":"old","label":"古い EC2","sub":"旧 AMI","kind":"compute","c":2,"r":1}],"edges":[{"from":"lt","to":"asg"},{"from":"asg","to":"new","label":"最小正常率 90%"},{"from":"new","to":"alb"},{"from":"asg","to":"old","label":"順次終了","style":"dashed"}]}},{"id":"d2-54","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、ステートレスな Web アプリケーションを、Application Load Balancer の背後にある Auto Scaling グループのスポットインスタンスで運用しています。スポットインスタンスが中断されると、2 分前の通知から終了までの間に処理能力が不足し、一時的にエラーが増えます。この企業は、中断のリスクが高まったインスタンスを、中断される前に新しいインスタンスで置き換え、処理能力の低下を抑えたいと考えています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループのスポット割り当て戦略を lowest-price に変更し、最も安い 1 つのプールからインスタンスを起動する。","スポットインスタンスの中断通知を Amazon EventBridge で受け取り、AWS Lambda 関数で代わりのインスタンスを起動する。","Auto Scaling グループでキャパシティーの再調整を有効にする。","ターゲット追跡スケーリングの目標値を引き下げ、平常時の台数を増やしておく。"],"answer":[2],"why":["単一のプールに集中すると、そのプールの容量が逼迫したときに、複数のインスタンスが同時に中断されやすくなる。事前の置き換えにもならない。","通知は中断の 2 分前であり、起動と初期化に時間がかかると間に合わない。関数の実装と運用も必要になる。","キャパシティーの再調整（Capacity Rebalancing）を有効にすると、スポットインスタンスの再調整の推奨を受けた時点で、代わりのインスタンスを起動し、起動後に古いインスタンスを終了する。中断の 2 分前の通知より早く動ける場合がある。","平常時の台数が増えて費用が高くなる。中断されるインスタンスの置き換えを事前に行う機能ではない。"],"explain":"「中断される前に置き換える」「運用上のオーバーヘッド最小」から、Auto Scaling のキャパシティーの再調整を選ぶ。EC2 が出すリバランスの推奨を受けて、Auto Scaling が代わりのインスタンスを先に起動し、正常になってから古いインスタンスを終了する。複数のインスタンスタイプと AZ を使う割り当て戦略と組み合わせると、さらに効果が高い。","point":"スポットの中断に備えて先に置き換えるなら、Auto Scaling のキャパシティーの再調整（Capacity Rebalancing）。","diagram":null},{"id":"d2-55","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、大きな設計データのファイルを Application Load Balancer（ALB）経由でダウンロードさせるアプリケーションを運用しています。ダウンロードには最長で 15 分ほどかかります。このアプリケーションは Auto Scaling グループの Amazon EC2 インスタンスで実行されており、スケールインやデプロイでインスタンスが ALB から登録解除されるたびに、ダウンロード中の利用者の接続が切断されています。ソリューションアーキテクトは、アプリケーションのコードを変更せず、運用上のオーバーヘッドを最小限に抑えて、進行中のダウンロードが完了するまで接続を維持する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ALB のアイドルタイムアウトを 4,000 秒に変更する。","Auto Scaling グループのヘルスチェックの猶予期間を 900 秒に設定する。","ターゲットグループのヘルスチェックの間隔を長くし、異常と判定されるまでの時間を延ばす。","ターゲットグループの登録解除の遅延を 900 秒に設定する。"],"answer":[3],"why":["アイドルタイムアウトは、接続上でデータの送受信がない時間の上限である。登録解除中のインスタンスとの接続を維持する設定ではない。","猶予期間は、新しく起動したインスタンスのヘルスチェックを始めるまでの待ち時間である。終了時の接続の扱いには関係しない。","ヘルスチェックの間隔は、異常を検知するまでの時間に関わる設定である。登録解除されたターゲットへの接続の扱いは変わらない。","登録解除の遅延は、登録解除中のターゲットに対して、進行中のリクエストの完了を待つ時間である。この間、ALB は新しいリクエストを送らず、既存の接続だけを維持する。最長のダウンロード時間より長く設定すればよい。"],"explain":"「登録解除のたびに接続が切れる」「進行中のダウンロードが完了するまで」から、ターゲットグループの登録解除の遅延（コネクションドレイニング）を選ぶ。既定は 300 秒で、最大 3,600 秒まで設定できる。Auto Scaling のスケールインでも、ターゲットグループの設定に従って待機する。","point":"登録解除の遅延（コネクションドレイニング）で、進行中のリクエストを完了させてから ELB から外せる。","diagram":{"caption":"正解の構成: 登録解除の遅延で進行中の接続を維持する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"ダウンロード中","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"遅延 900 秒","kind":"network","c":1,"r":0},{"id":"old","label":"EC2 インスタンス","sub":"登録解除中","kind":"compute","c":2,"r":0},{"id":"new","label":"EC2 インスタンス","sub":"新規リクエスト","kind":"compute","c":2,"r":1}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"old","label":"既存の接続のみ"},{"from":"alb","to":"new","label":"新規接続"}]}},{"id":"d2-56","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、Application Load Balancer（ALB）の背後の Auto Scaling グループで、Java ベースの Web アプリケーションを運用しています。ALB のルーティングアルゴリズムはラウンドロビンです。負荷が高まって新しいインスタンスが起動すると、起動直後のインスタンスに既存のインスタンスと同じ量のリクエストが一度に送られ、アプリケーションの初期化が完了する前にタイムアウトのエラーが増えます。ソリューションアーキテクトは、新しいインスタンスへのリクエストを徐々に増やす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループのヘルスチェックの猶予期間を長くする。","ターゲットグループでスロースタートモードを有効にし、期間を 300 秒に設定する。","ALB を Network Load Balancer に置き換え、新しいインスタンスのターゲットを遅れて登録する。","ALB のクロスゾーン負荷分散を無効にする。"],"answer":[1],"why":["猶予期間は、Auto Scaling が起動直後のインスタンスのヘルスチェック結果を無視する時間である。ALB がリクエストを送る量は変わらない。","スロースタートモードでは、ターゲットが正常になってから設定した期間をかけて、そのターゲットへのリクエスト数を徐々に増やす。初期化が必要なアプリケーションを、新しいインスタンスの過負荷から守れる。","NLB には、新しいターゲットへのトラフィックを徐々に増やす同等の機能はない。ターゲットの登録を遅らせる処理も別途必要になり、運用負荷が増える。","クロスゾーン負荷分散の設定は、AZ 間でのリクエストの分散に関わる。新しいインスタンスへの送信量を段階的に増やす効果はない。"],"explain":"「起動直後のインスタンスに一度にリクエストが集中」「徐々に増やす」から、ターゲットグループのスロースタートモードを選ぶ。有効にする期間は 30〜900 秒で設定でき、期間が終わると通常の割合で受け取る。ヘルスチェックの猶予期間は Auto Scaling 側の設定で、ALB の振り分けには効かない。","point":"新しいターゲットへのリクエストを段階的に増やすのは、ALB のスロースタートモード。","diagram":{"caption":"正解の構成: スロースタートで新しいインスタンスへの送信量を徐々に増やす","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"スロースタート","kind":"network","c":1,"r":0},{"id":"new","label":"新しい EC2","sub":"徐々に増加","kind":"compute","c":2,"r":0},{"id":"old","label":"既存の EC2","sub":"通常の割合","kind":"compute","c":2,"r":1}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"new","label":"少しずつ増加"},{"from":"alb","to":"old","label":"通常"}]}},{"id":"d2-57","domain":2,"topic":"コンテナ","type":"single","stem":"ある企業は、Amazon ECS の AWS Fargate で実行するサービスを、ローリング更新でデプロイしています。先日、誤った設定の新しいイメージをデプロイしたところ、新しいタスクが起動に失敗し続け、デプロイが完了しないまま、担当者が気づくまで長時間再試行が繰り返されました。この企業は、起動に失敗し続けるデプロイを自動的に検知し、直前の正常なバージョンに戻す仕組みを求めています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["タスクの停止を検知する Amazon CloudWatch アラームを作成し、AWS Lambda 関数でサービスを前のタスク定義のリビジョンに更新する。","サービスの minimumHealthyPercent を 0 に設定し、新しいタスクがすぐに古いタスクを置き換えるようにする。","サービスのデプロイサーキットブレーカーを有効にし、ロールバックも有効にする。","リビジョンごとに別のサービスを残しておき、問題があれば Amazon Route 53 の加重を元のサービスに戻す。"],"answer":[2],"why":["実現はできるが、アラームと関数の実装・運用が必要になる。検知の条件やロールバック先の管理も自前で行うことになる。","古いタスクがすぐに停止するため、新しいタスクが失敗するとサービスが停止する。失敗を検知して戻す仕組みにはならない。","デプロイサーキットブレーカーは、新しいタスクが継続して起動に失敗するときにデプロイを失敗とみなす機能である。ロールバックを有効にすると、直前に正常だったデプロイに自動で戻る。","サービスが 2 つになり、費用も管理の手間も増える。切り戻しは人が判断して行うことになり、自動のロールバックにならない。"],"explain":"「起動に失敗し続けるデプロイを自動で検知」「直前の正常なバージョンに自動で戻す」から、ECS のデプロイサーキットブレーカーとロールバックを選ぶ。ローリング更新のサービスに設定するだけで、追加のリソースや実装は不要である。","point":"ECS のローリング更新の失敗は、デプロイサーキットブレーカー（ロールバック有効）で自動検知して戻せる。","diagram":{"caption":"正解の構成: サーキットブレーカーが失敗を検知して前のバージョンに戻す","cols":4,"rows":2,"groups":[],"nodes":[{"id":"svc","label":"ECS サービス","sub":"ローリング更新","kind":"container","c":0,"r":0},{"id":"new","label":"新しいタスク","sub":"起動に失敗","kind":"container","c":1,"r":0},{"id":"cb","label":"ブレーカー","sub":"失敗を検知","kind":"management","c":2,"r":0},{"id":"old","label":"前のリビジョン","sub":"正常なタスク","kind":"container","c":2,"r":1}],"edges":[{"from":"svc","to":"new","label":"デプロイ"},{"from":"new","to":"cb","label":"連続して失敗"},{"from":"cb","to":"old","label":"ロールバック"}]}},{"id":"d2-58","domain":2,"topic":"コンテナ","type":"multi","stem":"ある企業は、Kubernetes で動くコンテナ化された API を Amazon EKS で運用する計画を立てています。API は Pod のレプリカ 6 つで構成され、各ノードではログ収集のエージェントを DaemonSet として実行する必要があります。この企業は、1 つの AZ が停止してもサービスを継続し、ノードの OS の更新にかかる運用上のオーバーヘッドを最小限にしたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["1 つの AZ に自己管理の EC2 ノードを起動し、AMI を更新するときは、管理者がスクリプトでノードを順番に置き換える。","すべての Pod を AWS Fargate プロファイルで実行し、ノードの管理をなくす。","3 つの AZ のプライベートサブネットを指定してマネージドノードグループを作成する。AMI の更新は、マネージドノードグループの更新機能で行う。","Deployment にトポロジー分散制約を設定し、Pod のレプリカが AZ をまたいで均等に配置されるようにする。","Pod のレプリカを 1 つに減らし、ノードの障害時に Kubernetes が別のノードで再起動するのを待つ。"],"answer":[2,3],"why":["単一 AZ では AZ の停止に耐えられない。ノードの置き換えのスクリプトも自前で運用することになる。","Fargate では DaemonSet を実行できない。ノード単位でエージェントを実行する要件を満たさない。","マネージドノードグループは、ノードのプロビジョニングとライフサイクルを EKS が管理する。複数の AZ のサブネットを指定でき、更新時にはノードを順に排出して置き換えるため、運用の負荷が小さい。","Pod が 1 つの AZ に偏ると、その AZ の停止でサービスが止まる。トポロジー分散制約で AZ ごとに均等に配置すれば、1 つの AZ が停止しても残りの Pod が処理を続けられる。","レプリカが 1 つでは、再起動が完了するまでサービスが停止する。可用性の要件を満たさない。"],"explain":"可用性は、ノードを複数の AZ に配置することと、Pod を AZ をまたいで分散することの両方で確保する。運用上のオーバーヘッドの削減には、マネージドノードグループを使う。Fargate は DaemonSet を実行できないため、この要件では使えない。","point":"EKS で AZ の障害に備えるには、複数 AZ のマネージドノードグループと、Pod のトポロジー分散制約を組み合わせる。","diagram":null},{"id":"d2-59","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある企業は、AWS Step Functions の Standard ワークフローで、受注処理を実行しています。1 つのステップでは、外部の決済 API を呼び出す AWS Lambda 関数を実行します。この API は、ときどき一時的なタイムアウトやスロットリングのエラーを返し、そのたびにワークフロー全体が失敗します。ソリューションアーキテクトは、関数のコードを変更せずに、再試行の間隔を延ばしながら最大 4 回再試行し、それでも失敗した場合は運用チームに Amazon SNS で通知するようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Task ステートに、MaxAttempts を 4、BackoffRate を 2.0 とする Retry を設定する。再試行が尽きた場合の Catch で、SNS にメッセージを発行する Task ステートに遷移させる。","Lambda 関数のコードに、try/catch と待機時間を延ばしながらの再試行ロジックを実装し、最後の失敗時に SNS へ通知する処理を追加する。","Amazon EventBridge ルールでワークフローの失敗を検知し、StartExecution API でワークフローを最初から再実行させる。再実行は 4 回までとする。","Parallel ステートで同じ Lambda 関数を 4 つ同時に呼び出し、最初に成功した結果を使う。すべて失敗した場合に SNS へ通知する。"],"answer":[0],"why":["Step Functions では、Task ステートの Retry で再試行の間隔、倍率、回数を設定できる。Catch でエラーを捕捉して別のステートに遷移でき、通知処理も Step Functions の中で完結する。コードの変更は不要である。","動作はするが、関数のコードを変更する必要があり、要件に反する。再試行の制御は、ワークフローのエラー処理機能を使う方が運用しやすい。","ワークフロー全体が最初から再実行されるため、決済より前の処理が重複して実行される。決済が成功済みの場合は、二重処理のおそれもある。","同じ決済を同時に 4 回呼び出すため、複数の決済が成功して二重請求になるおそれがある。間隔を延ばした再試行にもならない。"],"explain":"「一時的なエラーを再試行」「間隔を延ばして最大 4 回」「失敗したら通知」は、Step Functions の Retry（IntervalSeconds、BackoffRate、MaxAttempts）と Catch の組み合わせで宣言的に書ける。失敗したステップだけを再試行でき、コードの変更も不要である。","point":"Step Functions のエラー処理は、Retry（再試行・バックオフ）と Catch（別ステートへ遷移）で、コードを変えずに実装できる。","diagram":{"caption":"正解の構成: Retry でバックオフ付きの再試行、失敗時は Catch で通知","cols":3,"rows":2,"groups":[],"nodes":[{"id":"sfn","label":"Step Functions","sub":"Task ステート","kind":"serverless","c":0,"r":0},{"id":"fn","label":"Lambda 関数","sub":"決済 API を呼ぶ","kind":"serverless","c":1,"r":0},{"id":"api","label":"外部決済 API","sub":"一時的なエラー","kind":"client","c":2,"r":0},{"id":"sns","label":"SNS 通知","sub":"運用チーム宛て","kind":"integration","c":0,"r":1}],"edges":[{"from":"sfn","to":"fn","label":"Retry+再試行"},{"from":"fn","to":"api"},{"from":"sfn","to":"sns","label":"Catch","style":"dashed"}]}},{"id":"d2-60","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある企業は、Amazon EventBridge のカスタムイベントバスで受信した注文イベントを、ルールを通じて AWS Lambda 関数で処理しています。このイベントバスには、すべてのイベントを保持するアーカイブがすでに設定されています。先日、Lambda 関数のバグにより、過去 3 日間のイベントが誤って処理されていたことが判明しました。バグは修正済みです。ソリューションアーキテクトは、パブリッシャーに再送を依頼せずに、その期間のイベントを同じ内容で再処理する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["各パブリッシャーに、過去 3 日分のイベントを再生成して、PutEvents API で再送するよう依頼する。","アーカイブのイベントを、過去 3 日の期間を指定してリプレイする。リプレイの宛先は、対象のルールに限定する。","AWS CloudTrail に記録された過去 3 日分のログからイベントを抽出し、PutEvents API でイベントバスに送信する。","ルールのターゲットにデッドレターキューを設定し、過去 3 日分のイベントが自動的に再配信されるようにする。"],"answer":[1],"why":["パブリッシャーの協力が必要で、要件の「再送を依頼せずに」に反する。再生成したイベントが、元のイベントと完全に同じ内容になる保証もない。","EventBridge のアーカイブに保存されたイベントは、期間を指定してイベントバスにリプレイできる。リプレイ先のルールを指定できるため、ほかのターゲットに影響を与えずに再処理できる。","CloudTrail に記録されるのは AWS の API 呼び出しの履歴であり、イベントバスに送られたカスタムイベントの内容は含まれない。","デッドレターキューは、ターゲットへの配信が失敗したイベントの保管先である。処理が成功してから見つかったバグによる誤処理は、再配信の対象にならない。"],"explain":"「過去のイベントを同じ内容で再処理」「パブリッシャーに依頼しない」から、EventBridge のアーカイブとリプレイを選ぶ。リプレイでは、元のイベントの内容のまま、指定した期間とルールで再配信される。アーカイブはイベントが届く前に設定しておく必要がある。","point":"EventBridge のアーカイブに保存したイベントは、期間とルールを指定してリプレイでき、パブリッシャーの再送は不要。","diagram":{"caption":"正解の構成: アーカイブのイベントを対象のルールにリプレイする","cols":3,"rows":2,"groups":[],"nodes":[{"id":"pub","label":"パブリッシャー","sub":"注文イベント","kind":"compute","c":0,"r":0},{"id":"bus","label":"イベントバス","sub":"カスタムバス","kind":"integration","c":1,"r":0},{"id":"fn","label":"Lambda 関数","sub":"修正済み","kind":"serverless","c":2,"r":0},{"id":"arc","label":"アーカイブ","sub":"全イベントを保持","kind":"management","c":1,"r":1}],"edges":[{"from":"pub","to":"bus"},{"from":"bus","to":"fn","label":"ルール"},{"from":"bus","to":"arc","label":"保存","style":"dashed"},{"from":"arc","to":"fn","label":"リプレイ"}]}},{"id":"d2-61","domain":2,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、同じ AWS アカウントの同じリージョンで、注文を受け付ける API 用の AWS Lambda 関数と、売上データを集計するバッチ用の Lambda 関数を実行しています。バッチ用の関数は、Amazon S3 のイベントによって非同期に呼び出され、急に大量に起動されます。このとき、アカウント全体の同時実行数を使い切り、API 用の関数がスロットリングされる問題が発生しました。また、バッチ用の関数が接続するデータベースの負荷も高まっています。ソリューションアーキテクトは、バッチ用の関数の同時実行数を最大 50 に制限する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["バッチ用の関数に、プロビジョニングされた同時実行を 50 設定する。","バッチ用の関数のタイムアウトを短くして、実行環境が早く解放されるようにする。","API 用の関数には何も設定せず、アカウントの同時実行数の引き上げを申請する。","バッチ用の関数に、予約された同時実行数を 50 設定する。"],"answer":[3],"why":["プロビジョニングされた同時実行は、実行環境を事前に初期化しておく機能である。同時実行数の上限にはならず、50 を超えても実行環境は起動される。","タイムアウトを短くすると処理が途中で失敗するおそれがある。急な起動が重なれば、同時実行数は上限を使い切る。","上限を引き上げても、バッチ用の関数がそれを使い切る可能性は残る。データベースの負荷を抑える効果もない。","予約された同時実行数は、その関数が使える同時実行数の上限であり、同時に、ほかの関数がその分を使えないよう確保する。バッチ用の関数を 50 に制限すれば、残りの容量が API 用の関数に使われ、データベースへの接続数も抑えられる。"],"explain":"「関数の同時実行数を最大 50 に制限」「ほかの関数に影響を与えない」から、予約された同時実行数を選ぶ。予約すると、上限の役割と、その分をアカウントの同時実行数から確保する役割の両方を果たす。非同期呼び出しの場合、上限を超えた呼び出しは再試行されるため、失われにくい。","point":"関数の同時実行数の上限と、ほかの関数への影響の防止は、予約された同時実行数。プロビジョニングは別物（コールドスタート対策）。","diagram":null},{"id":"d3-01","domain":3,"topic":"S3","type":"multi","stem":"ある映像制作会社は、世界各地の撮影拠点から、1 ファイルあたり数 GB〜数十 GB の動画素材を東京リージョンの Amazon S3 バケットにアップロードしています。東京から遠い拠点ではアップロードに長い時間がかかり、途中で通信が切断されると最初から送り直しになるため、編集作業が遅れています。この企業は、アップロード先のバケットを変更せずに、遠隔拠点からのアップロード時間を短縮し、通信が切断されたときの再送量を減らすことを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["東京リージョンのバケットから、各拠点に近いリージョンのバケットへの S3 クロスリージョンレプリケーションを設定する。","バケットで S3 Transfer Acceleration を有効にする。各拠点のアップロード先をバケットのアクセラレーションエンドポイントに変更する。","バケットをオリジンとする Amazon CloudFront ディストリビューションを作成する。キャッシュポリシーで TTL を長く設定する。","マルチパートアップロードを使用し、ファイルを複数のパートに分割して並列にアップロードする。失敗したパートだけを再送する。","アップロード先を S3 Express One Zone のディレクトリバケットに変更する。低レイテンシーのストレージクラスで書き込み時間を短縮する。"],"answer":[1,3],"why":["レプリケーションは、オブジェクトが東京のバケットに書き込まれた後に別のバケットへコピーする仕組みであり、拠点から東京へのアップロード自体は速くならない。","Transfer Acceleration は最寄りのエッジロケーションでデータを受け取り、AWS のバックボーンネットワークを通してバケットまで転送する。遠距離のインターネット区間が短くなるため、アップロードが速くなる。","CloudFront のキャッシュはダウンロードを速くするための仕組みで、アップロードされるデータはキャッシュの対象にならない。TTL を長くしてもアップロード時間は変わらない。","マルチパートアップロードではパートを並列に送れるためスループットが上がる。通信が切断されても失敗したパートだけを再送すればよく、ファイル全体を送り直す必要がない。","S3 Express One Zone は同じ AZ 内のコンピューティングから低レイテンシーでアクセスするためのもので、遠隔地からの転送を速くする仕組みではない。アップロード先のバケットも変わってしまう。"],"explain":"「遠隔拠点からのアップロード時間を短縮」には Transfer Acceleration、「通信が切断されたときの再送量を減らす」にはマルチパートアップロードが対応する。Transfer Acceleration はエッジロケーションから AWS のネットワークを使って転送し、マルチパートアップロードはパートを並列に送って失敗したパートだけを再送できる。2 つは併用でき、大きなファイルを遠距離から送る場合の定番の組み合わせである。CloudFront のキャッシュやレプリケーションは、アップロードの速さには効かない。","point":"遠くから S3 へ速く送るなら Transfer Acceleration。大きなファイルは並列に送れて失敗時は部分だけ再送できるマルチパートアップロード。","diagram":{"caption":"正解の構成: エッジ経由で転送し、パートを並列にアップロードする","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"site","label":"撮影拠点","sub":"数十 GB の動画","kind":"client","c":0,"r":0},{"id":"edge","label":"エッジ","sub":"エッジロケーション","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"パートを結合","kind":"storage","c":2,"r":0}],"edges":[{"from":"site","to":"edge","label":"パートを並列に"},{"from":"edge","to":"s3","label":"AWS 内部を転送"}]}},{"id":"d3-02","domain":3,"topic":"EBS","type":"single","stem":"ある企業は、Amazon EC2 インスタンスでログ集計基盤を運用しており、データ用のストレージを選定しています。データ量は数十 TiB で、処理は大きなブロック単位のシーケンシャルな読み書きがほとんどを占め、ランダムアクセスはほとんどありません。データは毎日読み書きされ、インスタンスを停止して再起動した後も保持される必要があります。このストレージはブートボリュームとしては使用しません。最も費用対効果の高い方法で高いスループットを得られるソリューションはどれですか。","choices":["汎用 SSD（gp3）ボリュームを作成してインスタンスにアタッチする。スループットを必要な値まで追加でプロビジョニングする。","Cold HDD（sc1）ボリュームを作成してインスタンスにアタッチする。大きなブロックサイズでシーケンシャルに読み書きする。","スループット最適化 HDD（st1）ボリュームを作成してインスタンスにアタッチする。大きなブロックサイズでシーケンシャルに読み書きする。","HDD のインスタンスストアを備えたインスタンスタイプに変更する。複数のインスタンスストアボリュームを RAID 0 で束ねて使用する。"],"answer":[2],"why":["gp3 でもスループットを追加でプロビジョニングできるが、SSD のため容量あたりの料金が HDD より高い。数十 TiB をシーケンシャルに処理する用途では st1 の方が費用対効果が高い。","sc1 は容量あたりの料金が最も安いが、アクセス頻度の低いデータ向けで、容量あたりのスループットも st1 より低い。毎日大量に読み書きする処理には向かない。","st1 は大きなシーケンシャル I/O で高いスループットを出すよう設計された低コストの HDD ボリュームで、ログ処理やビッグデータ、データウェアハウスに向く。ブートボリュームに使えない点も要件と矛盾しない。","インスタンスストアはインスタンスを停止・終了するとデータが消える一時ストレージであり、停止後もデータを保持するという要件を満たさない。"],"explain":"決め手は「大きなブロックのシーケンシャルな読み書き」「数十 TiB」「毎日読み書き」「最も費用対効果の高い」である。スループット重視で容量の大きいワークロードには HDD 系のボリュームが安く、そのうち頻繁にアクセスするものは st1、アクセス頻度の低いものは sc1 を選ぶ。SSD 系の gp3 や io2 は、小さなランダム I/O や低レイテンシーが必要な場合に向く。データを保持する必要があるため、インスタンスストアは候補から外れる。","point":"シーケンシャル・大容量・頻繁なアクセスは st1、めったに読まないなら sc1。ランダム I/O やブートボリュームは SSD（gp3 / io2）。","diagram":null},{"id":"d3-03","domain":3,"topic":"EFS・FSx","type":"single","stem":"ある研究機関は、数百 TB のゲノム解析用データセットを Amazon S3 に保存しています。解析は Linux の Amazon EC2 インスタンス数百台で並列に実行され、各インスタンスは同じデータセットを POSIX 互換のファイルシステムとして、サブミリ秒のレイテンシーと高いスループットで読み込む必要があります。解析結果は最終的に S3 に保存する必要があります。ソリューションアーキテクトは、S3 との間でデータをコピーしたり書き戻したりする仕組みを独自に構築せずに、これらの要件を満たす必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon FSx for Lustre ファイルシステムを作成し、S3 バケットとのデータリポジトリの関連付けを設定する。各インスタンスからファイルシステムをマウントする。","Amazon EFS ファイルシステムを作成し、AWS DataSync で S3 からデータをコピーする。解析結果は別の DataSync タスクで S3 に転送する。","Amazon FSx for Windows File Server ファイルシステムを作成し、S3 のデータをコピーする。各インスタンスから SMB でファイル共有に接続する。","各インスタンスに io2 Block Express ボリュームをアタッチする。起動時に S3 からデータをコピーし、解析結果は終了前に S3 にアップロードする。"],"answer":[0],"why":["FSx for Lustre は HPC や機械学習向けの並列ファイルシステムで、サブミリ秒のレイテンシーと高いスループットを出せる。データリポジトリの関連付けにより、S3 のオブジェクトをファイルとして読み込み、変更を S3 に書き戻せる。","EFS でも複数のインスタンスからファイルを共有できるが、S3 からのコピーと結果の書き戻しを DataSync のタスクで別に構築・運用する必要があり、運用効率で劣る。","FSx for Windows File Server は SMB で Windows のワークロードに共有ストレージを提供するもので、Linux の HPC クラスター向けではない。S3 とのコピーも別に作り込む必要がある。","EBS ボリュームはインスタンスごとにアタッチするため、同じデータセットを数百台で共有できない。台数分のコピーと書き戻しの仕組みが必要になり、起動にも時間がかかる。"],"explain":"決め手は「数百台で並列」「サブミリ秒・高スループット」「S3 のデータセット」「コピーや書き戻しの仕組みを独自に構築しない」である。FSx for Lustre は HPC 向けの並列ファイルシステムで、S3 バケットとのデータリポジトリの関連付けを設定すると、S3 のオブジェクトを初回アクセス時に読み込み、ファイルの変更を S3 にエクスポートできる。EFS は汎用の共有ファイルシステム、FSx for Windows File Server は Windows 向け（SMB）であり、HPC の性能と S3 との連携を少ない運用で両立できるのは FSx for Lustre である。","point":"HPC・機械学習で S3 のデータを高速なファイルシステムとして使うなら FSx for Lustre（S3 とデータリポジトリの関連付け）。","diagram":{"caption":"正解の構成: FSx for Lustre を S3 と関連付けて並列に読み込む","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"EC2 × 数百台","sub":"並列で解析","kind":"compute","c":0,"r":0},{"id":"fsx","label":"FSx for Lustre","sub":"並列ファイルシステム","kind":"storage","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"データセット・結果","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2","to":"fsx","label":"マウント"},{"from":"fsx","to":"s3","label":"読み込み・出力","both":true}]}},{"id":"d3-04","domain":3,"topic":"ストレージ移行","type":"single","stem":"ある設計事務所は、オンプレミスの NAS（NFS）に保存している約 50 TB の CAD ファイルを Amazon EFS に移行する計画を立てています。移行期間中もオンプレミスでファイルの更新が続くため、初回の全量転送の後は、毎晩変更分だけを EFS に同期する必要があります。オンプレミスと AWS の間には AWS Direct Connect 接続がすでにあります。この企業は、転送をできるだけ高速にし、データの整合性検証やスケジュール実行の仕組みを独自に構築しないことを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["EFS をマウントした Amazon EC2 インスタンスを起動する。オンプレミスのサーバーから EC2 インスタンスに対して rsync を毎晩 cron で実行する。","オンプレミスに AWS Storage Gateway の S3 ファイルゲートウェイをデプロイする。NAS のファイルを毎晩ゲートウェイのファイル共有にコピーする。","AWS Transfer Family で EFS をストレージとする SFTP サーバーを作成する。変更されたファイルをスクリプトで検出し、毎晩 SFTP でアップロードする。","オンプレミスに AWS DataSync エージェントをデプロイする。NFS から EFS へ転送するタスクを作成し、毎晩実行するようにスケジュールを設定する。"],"answer":[3],"why":["rsync でも差分転送はできるが、並列化、整合性検証、失敗時の再実行、監視を独自に作り込む必要がある。単一のプロセスでは回線の帯域も使い切りにくい。","S3 ファイルゲートウェイはファイルを S3 のオブジェクトとして保存するもので、移行先の EFS にはデータが入らない。","Transfer Family は EFS をストレージにできるが、SFTP でファイルを受け渡す仕組みであり、差分の検出や整合性検証、スケジュール実行はスクリプト側で作り込む必要がある。","DataSync はエージェントがオンプレミスの NFS を読み取り、並列化した転送で EFS へ書き込む。変更分だけの転送、転送後の整合性検証、スケジュール実行が組み込まれており、Direct Connect 経由でも使える。"],"explain":"決め手は「NFS から EFS へ」「毎晩変更分だけ同期」「転送を高速に」「整合性検証やスケジュールを独自に構築しない」である。DataSync はオンプレミスのファイルストレージと AWS のストレージサービス（S3・EFS・FSx）の間でデータを転送するマネージドサービスで、オンプレミス側にはエージェントを置く。転送の並列化、差分転送、整合性検証、スケジュール実行を備えるため、初回の移行と移行期間中の同期の両方に向く。","point":"オンプレミスのファイルを S3・EFS・FSx へ速く移す・定期的に同期するなら DataSync（オンプレミスにエージェントを置く）。","diagram":{"caption":"正解の構成: DataSync エージェント経由で NAS から EFS へ同期する","cols":4,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":2,"h":1},{"label":"AWS リージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"nas","label":"NAS","sub":"NFS 共有","kind":"onprem","c":0,"r":0},{"id":"agent","label":"DataSync","sub":"エージェント（VM）","kind":"onprem","c":1,"r":0},{"id":"task","label":"DataSync タスク","sub":"毎晩スケジュール実行","kind":"integration","c":2,"r":0},{"id":"efs","label":"Amazon EFS","sub":"移行先","kind":"storage","c":3,"r":0}],"edges":[{"from":"nas","to":"agent","label":"NFS で読み取り"},{"from":"agent","to":"task","label":"Direct Connect"},{"from":"task","to":"efs","label":"変更分を転送"}]}},{"id":"d3-05","domain":3,"topic":"EC2","type":"multi","stem":"ある研究機関は、数値流体解析を MPI で並列実行する HPC アプリケーションを Amazon EC2 に移行する計画を立てています。このアプリケーションでは計算ノードどうしが頻繁にメッセージを交換するため、ノード間通信のレイテンシーが処理時間に直結します。この研究機関は、可用性よりもノード間通信の性能を優先し、ノード間のレイテンシーを最小限に抑えることを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["クラスタープレイスメントグループを作成し、計算ノードを 1 つのアベイラビリティーゾーン内で起動する。","パーティションプレイスメントグループを作成し、計算ノードを複数のパーティションに分けて起動する。","分散プレイスメントグループを作成し、計算ノードをそれぞれ別のハードウェアに配置して起動する。","複数のアベイラビリティーゾーンにまたがる Auto Scaling グループを作成し、計算ノードを均等に起動する。","EFA をサポートするインスタンスタイプを選択し、各計算ノードに Elastic Fabric Adapter をアタッチする。"],"answer":[0,4],"why":["クラスタープレイスメントグループは 1 つの AZ 内でインスタンスを物理的に近い位置に配置し、ノード間で低レイテンシー・高スループットの通信を実現する。密結合の HPC に適している。","パーティションプレイスメントグループは、パーティションごとにラックを分けてハードウェア障害の影響範囲を限定するもので、HDFS や Cassandra などの大規模分散システム向けである。レイテンシーの最小化が目的ではない。","分散プレイスメントグループは、少数の重要なインスタンスを別々のハードウェアに配置して同時障害を避けるためのもので、可用性のための配置である。ノード間の近さは保証されない。","AZ 間の通信は AZ 内の通信よりレイテンシーが大きい。可用性は上がるが、ノード間通信の性能を優先するという要件に反する。","EFA は OS をバイパスしてインスタンス間で通信できるネットワークインターフェイスで、MPI などの密結合アプリケーションのノード間通信を高速化する。"],"explain":"決め手は「MPI」「頻繁にメッセージを交換する（密結合）」「可用性よりノード間通信の性能を優先」である。配置ではクラスタープレイスメントグループでノードを 1 つの AZ 内の近い位置にまとめ、ネットワークでは EFA を使って OS をバイパスした低レイテンシーの通信を行う。パーティションと分散のプレイスメントグループは、どちらも障害の影響を抑えて可用性を高めるための配置である。","point":"密結合の HPC はクラスタープレイスメントグループ＋EFA。分散は少数の重要インスタンスの同時障害回避、パーティションは HDFS などの大規模分散向け。","diagram":null},{"id":"d3-06","domain":3,"topic":"Auto Scaling","type":"multi","stem":"ある企業の社内業務システムは、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで実行されており、CPU 使用率のターゲット追跡スケーリングポリシーを使用しています。数か月前から、毎営業日の始業時刻にアクセスが急増するパターンが続いています。インスタンスは起動後のアプリケーションのインストールと設定ファイルの取得に約 10 分かかるため、スケールアウトが間に合わず、始業直後の応答が遅くなっています。この企業は、インスタンスを常に最大数で実行することなく、始業直後の応答遅延を解消することを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["ターゲット追跡スケーリングポリシーをステップスケーリングポリシーに置き換える。CPU 使用率が高いときに追加するインスタンス数を大きくする。","Auto Scaling グループのデフォルトのクールダウン期間を短くする。スケールアウトのアクティビティを短い間隔で連続して実行できるようにする。","予測スケーリングポリシーを追加する。過去の負荷のパターンから需要を予測し、予測された急増の前にインスタンスを起動するように設定する。","Auto Scaling グループのヘルスチェックの猶予期間を長くする。初期化中のインスタンスが異常と判定されて置き換えられないようにする。","Auto Scaling グループにウォームプールを設定する。初期化を済ませたインスタンスを停止状態で待機させ、スケールアウト時に使用する。"],"answer":[2,4],"why":["ステップスケーリングもメトリクスが上がってから反応する方式であり、起動後の約 10 分の初期化時間は短くならない。急増に間に合わない点は変わらない。","クールダウンを短くしても、負荷が上がってから起動を始める点と、起動後の初期化に時間がかかる点は変わらない。","予測スケーリングは過去の CloudWatch メトリクスから日次・週次のパターンを学習して需要を予測し、予測した時刻より前にキャパシティを起動できる。毎日繰り返す急増に間に合わせられる。","猶予期間は初期化中のインスタンスが異常と判定されるのを防ぐ設定であり、起動を早めたり初期化の時間を短くしたりする効果はない。","ウォームプールに初期化済みのインスタンスを停止状態で置いておくと、スケールアウト時は起動するだけで済み、アプリケーションの準備にかかる時間を大幅に短縮できる。停止中はインスタンスの料金がかからない（EBS ボリュームの料金はかかる）。"],"explain":"決め手は「毎営業日の決まった時刻に急増」と「初期化に約 10 分かかる」である。負荷が上がってから反応するポリシー（ターゲット追跡・ステップ）では、起動と初期化の時間のぶん必ず遅れる。繰り返すパターンには予測スケーリングで事前に台数を増やし、初期化に時間がかかる問題にはウォームプールで初期化済みのインスタンスを待機させて対処する。予測スケーリングはターゲット追跡ポリシーと併用できる。","point":"周期的な急増は予測スケーリングで先回りする。起動・初期化が遅いならウォームプールで初期化済みのインスタンスを待機させる。","diagram":null},{"id":"d3-07","domain":3,"topic":"Lambda・サーバーレス","type":"single","stem":"ある決済サービス企業は、Amazon API Gateway と AWS Lambda で残高照会 API を提供しています。ほとんどのリクエストは数十ミリ秒で応答しますが、新しい実行環境が作成されるときの初期化処理（コールドスタート）により、一部のリクエストの応答に数秒かかり、レイテンシーの目標を満たせていません。レスポンスの内容は利用者ごとに異なります。トラフィックは日中ほぼ一定です。この企業は、関数のコードを変更せずに、レイテンシーのばらつきを抑えることを求めています。ソリューションアーキテクトはどうすべきですか。","choices":["関数のメモリ割り当てを増やし、関数に割り当てられる CPU を増やす。あわせて関数のタイムアウト値を長く設定する。","関数のバージョンを発行してエイリアスを作成する。エイリアスにプロビジョニングされた同時実行を設定し、API Gateway から呼び出す。","関数に予約された同時実行を設定する。ほかの関数に同時実行数を使われないように、必要な同時実行数を確保する。","API Gateway のステージでキャッシュを有効にする。キャッシュの TTL を設定し、同じリクエストへのレスポンスをキャッシュから返す。"],"answer":[1],"why":["メモリを増やすと CPU も比例して増えるため初期化が多少速くなることはあるが、コールドスタート自体は無くならない。タイムアウトの延長は応答時間の改善に関係しない。","プロビジョニングされた同時実行は、指定した数の実行環境をあらかじめ初期化して待機させておく。リクエストは初期化済みの環境で処理されるため、コールドスタートによる遅延を避けられる。","予約された同時実行は、関数が使える同時実行数を確保し上限を設定するもので、実行環境を事前に初期化するわけではない。コールドスタートは発生し続ける。","レスポンスが利用者ごとに異なるため、キャッシュしたレスポンスを返すことはできない。キャッシュではコールドスタートの問題も解決しない。"],"explain":"決め手は「コールドスタートによる遅延」「コードを変更せずに」である。プロビジョニングされた同時実行は、関数のバージョンまたはエイリアスに設定し、指定した数の実行環境を初期化済みの状態で維持する。トラフィックがほぼ一定であれば必要数を見積もりやすく、時間帯で変わる場合は Application Auto Scaling で設定値をスケジュールや使用率に合わせて変えられる。予約された同時実行は数の確保と上限の設定であり、初期化を省く効果はない。","point":"Lambda のコールドスタート対策はプロビジョニングされた同時実行（バージョン / エイリアスに設定）。予約された同時実行は数の確保と上限。","diagram":{"caption":"正解の構成: 初期化済みの実行環境でリクエストを処理する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","sub":"残高照会","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"REST API","kind":"network","c":1,"r":0},{"id":"lambda","label":"Lambda (prod)","sub":"初期化済み環境を待機","kind":"serverless","c":2,"r":0},{"id":"aas","label":"App Auto Scaling","sub":"同時実行数を調整","kind":"management","c":2,"r":1}],"edges":[{"from":"user","to":"apigw"},{"from":"apigw","to":"lambda","label":"エイリアス"},{"from":"aas","to":"lambda","label":"設定値を調整","style":"dashed"}]}},{"id":"d3-08","domain":3,"topic":"コンテナ","type":"single","stem":"ある自動車部品メーカーは、設計を検証するために、互いに独立した数千件のシミュレーションジョブを毎晩実行しています。各ジョブはコンテナイメージとしてパッケージ化されており、1 件の実行に 1〜3 時間かかり、必要な vCPU とメモリはジョブごとに異なります。この企業は、ジョブのキューイングと優先度の制御、ジョブ量に応じたコンピューティングリソースの自動的な増減を、独自のスケジューラーを構築せずに実現することを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各ジョブを AWS Lambda 関数として実装する。ジョブの情報を Amazon SQS キューに送信し、キューをイベントソースとして関数を起動する。","Amazon ECS クラスターに AWS Fargate のサービスを作成する。夜間は必要な数のタスクを常時実行させ、各タスクがジョブを順に処理する。","Amazon SQS キューと EC2 Auto Scaling グループを作成する。独自のワーカーでキューからジョブを取り出し、キューの長さに応じて台数を調整する。","AWS Batch でマネージド型のコンピューティング環境とジョブキューを作成する。ジョブ定義を登録し、各ジョブをジョブキューに送信する。"],"answer":[3],"why":["Lambda の 1 回の実行時間は最大 15 分であり、1〜3 時間かかるジョブは実行できない。","ECS のサービスは指定した数のタスクを常に維持する、長時間稼働のアプリケーション向けの仕組みである。ジョブのキューイングや優先度の制御は独自に作り込む必要がある。","動かすことはできるが、ジョブの割り当て、優先度、リトライ、台数の調整を独自に作り込んで運用する必要があり、「独自のスケジューラーを構築しない」という要件に反する。","AWS Batch はジョブキュー、優先度、リトライ、依存関係の管理と、必要な vCPU・メモリに合わせたコンピューティング環境の自動的な増減を提供する。コンテナ化されたバッチジョブを大量に実行する用途に向く。"],"explain":"決め手は「独立した大量のジョブ」「1 件 1〜3 時間」「キューイングと優先度」「独自のスケジューラーを構築しない」である。AWS Batch はジョブ定義（コンテナイメージと必要なリソース）とジョブキューを使い、キューに溜まったジョブの量に応じて EC2 や Fargate のコンピューティング環境を自動で増減する。Lambda には 15 分の実行時間の上限があり、長時間のジョブには使えない。","point":"大量のバッチジョブのキューイング・スケジューリング・リソース調整は AWS Batch。長時間のジョブは Lambda（最大 15 分）では動かせない。","diagram":null},{"id":"d3-09","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある EC 事業者は、Amazon Aurora MySQL 互換の DB クラスター（ライターインスタンス 1 台）を使用しています。日中に分析担当者がレポートツールから実行する重い SELECT クエリによってライターインスタンスの CPU 使用率が上昇し、注文処理の応答が遅くなっています。レポートは数秒程度古いデータでも問題ありません。この企業は、注文処理への影響をなくし、レポートの読み取り負荷を複数のインスタンスに分散することを求めています。アプリケーションの変更は接続先の変更だけに抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ライターインスタンスのインスタンスクラスを大きくする。レポートツールはクラスターエンドポイントに接続したままにする。","Amazon RDS Proxy を作成する。レポートツールの接続先を RDS Proxy のデフォルトの読み取り/書き込みエンドポイントに変更する。","Aurora レプリカを 2 台追加する。レポートツールの接続先を DB クラスターのリーダーエンドポイントに変更する。","Amazon ElastiCache クラスターを作成する。レポートのクエリ結果をキャッシュする処理をアプリケーションに追加する。"],"answer":[2],"why":["スケールアップで処理能力は上がるが、レポートと注文処理が同じインスタンスを使う点は変わらず、負荷の分離にも分散にもならない。","RDS Proxy は接続をプールして再利用する仕組みで、デフォルトのエンドポイントはライターインスタンスに接続する。読み取りの負荷はライターに残る。","Aurora レプリカはクラスターの共有ストレージを読み取るため、レプリカの遅延は通常短い。リーダーエンドポイントは接続を複数のレプリカに分散するため、接続先を変えるだけでレポートの負荷をライターから切り離せる。","アプリケーションにキャッシュの処理を追加する必要があり、「変更は接続先だけ」という要件に反する。分析のクエリは内容が毎回異なることが多く、キャッシュの効果も期待しにくい。"],"explain":"決め手は「読み取り負荷を複数のインスタンスに分散」「数秒古いデータで可」「変更は接続先だけ」である。Aurora レプリカを追加すると、リーダーエンドポイントが読み取り専用の接続を複数のレプリカに振り分ける。レポートツールの接続先をリーダーエンドポイントにするだけで、ライターインスタンスは注文処理に専念できる。読み取り負荷が変動する場合は、Aurora Auto Scaling でレプリカの台数を自動調整できる。","point":"Aurora の読み取り分散は Aurora レプリカ＋リーダーエンドポイント。書き込みはクラスターエンドポイント（ライター）に接続する。","diagram":{"caption":"正解の構成: レポートの読み取りをリーダーエンドポイントへ分ける","cols":3,"rows":3,"groups":[{"label":"Aurora DB クラスター","kind":"generic","c":1,"r":0,"w":2,"h":3}],"nodes":[{"id":"app","label":"注文処理アプリ","sub":"読み書き","kind":"compute","c":0,"r":0},{"id":"report","label":"レポートツール","sub":"重い SELECT","kind":"client","c":0,"r":1},{"id":"cep","label":"Cluster endpoint","sub":"書き込み用","kind":"network","c":1,"r":0},{"id":"rep","label":"Reader endpoint","sub":"接続をレプリカに分散","kind":"network","c":1,"r":1},{"id":"writer","label":"ライター","sub":"注文処理に専念","kind":"database","c":2,"r":0},{"id":"r1","label":"Aurora レプリカ","sub":"読み取り専用","kind":"database","c":2,"r":1},{"id":"r2","label":"Aurora レプリカ","sub":"読み取り専用","kind":"database","c":2,"r":2}],"edges":[{"from":"app","to":"cep"},{"from":"cep","to":"writer"},{"from":"report","to":"rep"},{"from":"rep","to":"r1"},{"from":"rep","to":"r2"}]}},{"id":"d3-10","domain":3,"topic":"RDS・Aurora","type":"single","stem":"あるチケット販売サイトは、Amazon API Gateway と AWS Lambda で構成された API から Amazon RDS for PostgreSQL に接続しています。販売開始の直後に Lambda 関数の同時実行数が急増すると、データベースの接続数が上限に達してエラーが発生し、接続の確立処理によってデータベースの CPU 使用率も急上昇します。この企業は、関数のコードの変更を最小限に抑えて、アクセスの急増時でも安定してデータベースに接続できるようにすることを求めています。ソリューションアーキテクトはどうすべきですか。","choices":["Amazon RDS Proxy を作成し、DB インスタンスを登録する。Lambda 関数の接続先を RDS Proxy のエンドポイントに変更する。","DB インスタンスのインスタンスクラスを大きくする。DB パラメータグループで max_connections パラメータの値を引き上げる。","RDS for PostgreSQL のリードレプリカを追加する。Lambda 関数の接続先を、処理の内容に応じてプライマリとリードレプリカに振り分けるように変更する。","Lambda 関数に予約された同時実行を設定する。関数の同時実行数を、データベースの接続数の上限より低い値に制限する。"],"answer":[0],"why":["RDS Proxy はデータベースへの接続をプールして多数の関数で共有するため、接続数の急増と接続確立の負荷を抑えられる。アプリケーション側は接続先を変えるだけでよい。","接続数の上限は上がるが、同時実行の急増に合わせて接続が増え続ける点と、接続を確立するたびに CPU を消費する点は変わらない。インスタンスクラスを上げるぶんコストも増える。","チケットの購入は書き込みを伴うため、プライマリへの接続は減らない。読み取りと書き込みで接続先を分けるにはコードの変更も必要になる。","接続数は抑えられるが、上限を超えたリクエストはスロットリングされるため、販売開始直後の利用者がエラーを受け取ることになる。"],"explain":"決め手は「Lambda の同時実行数の急増」「接続数の上限」「接続確立の負荷」「コードの変更を最小限」である。Lambda は実行環境ごとにデータベース接続を作るため、同時実行数が増えると接続数も増える。RDS Proxy は接続プールを持ち、少ない数のデータベース接続を多数のクライアントで再利用するため、急増時の接続エラーと CPU の負荷を抑えられる。フェイルオーバー時の切り替えが速くなる利点もある。","point":"Lambda から RDS への接続の急増には RDS Proxy（接続プール）。アプリは接続先を Proxy のエンドポイントに変えるだけ。","diagram":{"caption":"正解の構成: RDS Proxy で接続をプールして共有する","cols":5,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":3,"h":1}],"nodes":[{"id":"user","label":"購入者","sub":"販売開始に集中","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"購入 API","kind":"network","c":1,"r":0},{"id":"lambda","label":"Lambda","sub":"同時実行が急増","kind":"serverless","c":2,"r":0},{"id":"proxy","label":"RDS Proxy","sub":"接続プール","kind":"database","c":3,"r":0},{"id":"rds","label":"RDS","sub":"PostgreSQL","kind":"database","c":4,"r":0}],"edges":[{"from":"user","to":"apigw"},{"from":"apigw","to":"lambda"},{"from":"lambda","to":"proxy","label":"多数の接続"},{"from":"proxy","to":"rds","label":"接続を再利用"}]}},{"id":"d3-11","domain":3,"topic":"DynamoDB","type":"single","stem":"あるモバイルゲーム会社は、プレイヤーのプロフィールと所持アイテムの情報を Amazon DynamoDB テーブルに保存しています。同じ項目が短時間に何度も読み取られる読み取り中心のワークロードで、イベント期間中は読み取りがさらに増加します。この企業は、現在 1 桁ミリ秒の読み取りレイテンシーをマイクロ秒単位に短縮することを求めています。アプリケーションは DynamoDB の API を使用しており、コードの変更は最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["テーブルのキャパシティモードをオンデマンドに変更する。読み取りリクエストの急増に合わせてキャパシティが自動的に調整されるようにする。","DynamoDB Accelerator（DAX）クラスターを作成する。アプリケーションの DynamoDB クライアントを DAX クライアントに置き換える。","Amazon ElastiCache（Redis OSS）クラスターを作成する。アプリケーションに遅延読み込みのキャッシュ処理と無効化の処理を実装する。","DynamoDB グローバルテーブルを作成し、各リージョンにレプリカテーブルを配置する。プレイヤーに最も近いリージョンのレプリカから読み取るようにアプリケーションを変更する。"],"answer":[1],"why":["オンデマンドはトラフィックの増減に合わせてキャパシティが自動で調整される方式で、1 回の読み取りにかかるレイテンシーは短くならない。","DAX は DynamoDB 専用のインメモリキャッシュで、DynamoDB と互換性のある API を持つ。キャッシュにある項目はマイクロ秒単位で返され、アプリケーションは DAX クライアントに切り替えるだけでよい。","ElastiCache でも高速な応答は得られるが、キャッシュの読み書きや無効化の処理をアプリケーションに実装する必要があり、コードの変更が大きい。","グローバルテーブルは複数のリージョンにレプリカを置く機能で、ネットワークの距離は縮められても、テーブルからの読み取り自体は 1 桁ミリ秒のままである。"],"explain":"決め手は「読み取り中心」「マイクロ秒単位のレイテンシー」「DynamoDB の API」「コードの変更を最小限」である。DAX は DynamoDB の前に置くインメモリキャッシュで、DynamoDB と互換性のある API を提供するため、既存のコードの多くをそのまま使える。同じ項目を繰り返し読み取るワークロードで効果が大きい。なお、強い整合性の読み込みは DAX ではキャッシュされず、DynamoDB に転送される。","point":"DynamoDB の読み取りをマイクロ秒単位にするなら DAX（API 互換のインメモリキャッシュ）。ElastiCache はアプリ側でキャッシュ処理の実装が必要。","diagram":{"caption":"正解の構成: DAX を DynamoDB の前に置いて読み取りをキャッシュする","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"app","label":"ゲームサーバー","sub":"DAX クライアント","kind":"compute","c":0,"r":0},{"id":"dax","label":"DAX クラスター","sub":"インメモリキャッシュ","kind":"database","c":1,"r":0},{"id":"ddb","label":"DynamoDB","sub":"プレイヤー情報","kind":"database","c":2,"r":0}],"edges":[{"from":"app","to":"dax","label":"API 互換"},{"from":"dax","to":"ddb","label":"ミス時に取得"}]}},{"id":"d3-12","domain":3,"topic":"DynamoDB","type":"single","stem":"ある IoT 事業者は、数十万台のセンサーから常時送信される計測値を Amazon DynamoDB テーブルに書き込んでいます。テーブルのパーティションキーは計測日（例: 2026-11-09）、ソートキーは「センサー ID#計測時刻」です。テーブル全体のキャパシティには余裕があるにもかかわらず、書き込みが一部のパーティションに集中し、スロットリングが発生しています。主なアクセスパターンは、センサーごとに期間を指定して計測値を読み取ることです。この問題を根本的に解決するために、ソリューションアーキテクトはどうすべきですか。","choices":["テーブルのキャパシティモードをオンデマンドに変更する。書き込みリクエストの急増に合わせてキャパシティが自動的に調整されるようにする。","DynamoDB Accelerator（DAX）クラスターを作成する。アプリケーションからの書き込みを DAX クライアント経由で行うように変更する。","センサー ID をパーティションキー、計測時刻をソートキーとするグローバルセカンダリインデックスを既存のテーブルに追加する。","センサー ID をパーティションキー、計測時刻をソートキーとする新しいテーブルを作成する。既存のデータを移行し、書き込み先を切り替える。"],"answer":[3],"why":["オンデマンドでも、パーティションごとのスループットの上限は変わらない。同じ日付のキーに書き込みが集中する限り、ホットパーティションは解消しない。","DAX は読み取りを高速化するキャッシュで、書き込みはそのまま DynamoDB のテーブルに書き込まれる（ライトスルー）。書き込みの集中は解消しない。","GSI を追加すると読み取りのアクセスパターンには合うが、ベーステーブルへの書き込みは計測日のパーティションキーに集中したままである。","センサー ID は値の種類が多く、書き込みが多数のパーティションキーに分散する。センサーごとに期間を指定する読み取りも、パーティションキーの指定とソートキーの範囲条件によるクエリで効率よく実行できる。"],"explain":"決め手は「テーブル全体のキャパシティに余裕がある」のに「一部のパーティションに書き込みが集中」している点で、原因はパーティションキーの設計にある。計測日をパーティションキーにすると、その日のすべての書き込みが同じキーに集まる。値の種類が多く、アクセスが均等に散らばる属性（ここではセンサー ID）をパーティションキーにすれば、書き込みが分散し、主なアクセスパターンのクエリにも合う。","point":"ホットパーティションの根本対策は、値の種類が多くアクセスが均等な属性をパーティションキーにすること。日付だけのキーは集中しやすい。","diagram":null},{"id":"d3-13","domain":3,"topic":"ElastiCache","type":"single","stem":"ある EC 事業者は、商品情報を Amazon RDS for MySQL に保存し、その前段に Amazon ElastiCache（Redis OSS）を配置しています。現在のキャッシュ戦略は、キャッシュにデータがないときだけデータベースから読み込んでキャッシュに書き込む遅延読み込みで、TTL は 1 時間です。価格を変更しても、最大 1 時間古い価格が表示される問題が起きています。価格の更新は 1 日に数回程度で、読み取りが圧倒的に多いワークロードです。この企業は、価格の更新を直ちにキャッシュに反映し、かつキャッシュミスを増やさないことを求めています。これらの要件を満たすソリューションはどれですか。","choices":["価格をデータベースに書き込む処理を変更し、同じ値をキャッシュにも書き込むようにする。ライトスルーのキャッシュ戦略を追加する。","キャッシュの TTL を 1 時間から 1 分に短縮する。古い価格がキャッシュに残る時間をできるだけ短くして、更新を早く反映する。","ElastiCache クラスターのシャード数を増やす。キャッシュの容量と処理能力を引き上げ、キャッシュのヒット率を高める。","RDS for MySQL のリードレプリカを追加する。キャッシュミスが発生したときの読み込み先をリードレプリカに変更する。"],"answer":[0],"why":["ライトスルーではデータベースの更新と同時にキャッシュも更新するため、キャッシュの値が古くならない。読み取りは引き続きキャッシュから返せるため、キャッシュミスも増えない。更新の頻度が低いため、書き込み時の追加の負荷も小さい。","古い価格が表示される時間は短くなるが、最大 1 分は古いままで「直ちに反映」を満たさない。TTL が短いぶんキャッシュミスが増え、データベースへの読み込みも増える。","容量と処理能力は上がるが、キャッシュの値がデータベースの更新に追従しないという問題は解決しない。","キャッシュミス時の読み込み先が変わるだけで、TTL が切れるまで古い価格がキャッシュに残る問題は変わらない。レプリカの遅延により、さらに古い値を読む可能性もある。"],"explain":"決め手は「更新を直ちにキャッシュに反映」「キャッシュミスを増やさない」「更新は少なく読み取りが多い」である。遅延読み込みはキャッシュミス時にだけデータを読み込むため、TTL が切れるまで古いデータが残る。ライトスルーはデータベースへの書き込みと同時にキャッシュを更新するため、常に最新の値をキャッシュから返せる。実際には、ライトスルーに TTL を組み合わせて、使われないデータがキャッシュに溜まり続けないようにすることが多い。","point":"遅延読み込みは必要なデータだけをキャッシュするが古くなりうる。常に最新にするならライトスルー（書き込み時にキャッシュも更新）。","diagram":null},{"id":"d3-14","domain":3,"topic":"CloudFront","type":"single","stem":"ある旅行予約サイトは、東京リージョンの Application Load Balancer（ALB）と Amazon EC2 インスタンスでサイト全体を配信しています。画像や CSS などの静的コンテンツは Amazon S3 に移行することが決まっています。検索結果などのページは利用者ごとに内容が異なる動的コンテンツです。海外の利用者から、ページの表示が遅いという苦情が増えています。この企業は、運用するリージョンを増やさずに、世界中の利用者に対する静的コンテンツと動的コンテンツの両方の応答を高速化し、オリジンの負荷も軽減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["AWS Global Accelerator のアクセラレーターを作成し、ALB をエンドポイントとして登録する。静的コンテンツも ALB 経由で配信する。","S3 バケットで S3 Transfer Acceleration を有効にする。静的コンテンツはアクセラレーションエンドポイントから、動的コンテンツは ALB から配信する。","Amazon CloudFront ディストリビューションで S3 と ALB をオリジンにする。静的コンテンツはキャッシュし、動的コンテンツはキャッシュせずに ALB に転送する。","別のリージョンにも ALB と EC2 インスタンスを構築する。Amazon Route 53 のレイテンシーベースルーティングで、利用者を最も近いリージョンに振り分ける。"],"answer":[2],"why":["Global Accelerator は AWS のネットワークを使って動的コンテンツの通信も速くできるが、コンテンツをキャッシュしない。静的コンテンツのリクエストもすべてオリジンに届くため、オリジンの負荷は減らない。","Transfer Acceleration は S3 との間の転送をエッジ経由で速くする機能で、コンテンツをキャッシュしない。ALB が返す動的コンテンツも速くならない。","静的コンテンツはエッジロケーションのキャッシュから返されるため速く、オリジンの負荷も減る。動的コンテンツもエッジで TLS を終端し、AWS のネットワークと持続的な接続を使ってオリジンへ転送されるため、インターネットを直接通るより応答が速くなる。","応答は速くなるが、運用するリージョンが増え、データの複製などの運用上のオーバーヘッドも大きくなる。「リージョンを増やさない」という要件に反する。"],"explain":"決め手は「静的・動的の両方を高速化」「オリジンの負荷を軽減」「リージョンを増やさない」である。CloudFront は 1 つのディストリビューションに複数のオリジンを設定でき、パスパターンごとのキャッシュ動作（ビヘイビア）でオリジンとキャッシュの方法を切り替えられる。静的コンテンツはキャッシュしてオリジンへのリクエストを減らし、動的コンテンツはキャッシュを無効にしても、エッジから AWS のネットワークを通る経路で高速化できる。","point":"静的はキャッシュ、動的はキャッシュせずに転送。CloudFront のキャッシュ動作でパスごとにオリジンを分けると、両方を速くできる。","diagram":{"caption":"正解の構成: パスごとに S3 と ALB をオリジンにして配信する","cols":4,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":2}],"nodes":[{"id":"user","label":"海外の利用者","sub":"ブラウザ","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"エッジでキャッシュ","kind":"network","c":1,"r":0},{"id":"s3","label":"S3","sub":"静的コンテンツ","kind":"storage","c":2,"r":0},{"id":"alb","label":"ALB","sub":"動的コンテンツ","kind":"network","c":2,"r":1},{"id":"ec2","label":"EC2","sub":"検索・予約処理","kind":"compute","c":3,"r":1}],"edges":[{"from":"user","to":"cf"},{"from":"cf","to":"s3","label":"キャッシュ"},{"from":"cf","to":"alb","label":"キャッシュなし"},{"from":"alb","to":"ec2"}]}},{"id":"d3-15","domain":3,"topic":"Global Accelerator","type":"single","stem":"あるオンラインゲーム会社は、UDP でリアルタイムに通信する対戦ゲームのサーバーを、東京、北米、欧州の 3 つのリージョンで Network Load Balancer（NLB）の背後に配置しています。この企業は、プレイヤーを最も近い正常なリージョンに接続し、インターネット上の経路によるレイテンシーとジッターのばらつきを減らすことを求めています。また、企業ネットワークのファイアウォールに登録できるように、全リージョン共通の固定 IP アドレスで通信を受け付ける必要があります。リージョンで障害が発生したときは、DNS のキャッシュに左右されずに別のリージョンへ切り替える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon Route 53 でレイテンシーベースルーティングのレコードを作成し、ヘルスチェックを関連付ける。各リージョンの NLB の DNS 名を値として登録する。","AWS Global Accelerator のアクセラレーターを作成する。リージョンごとのエンドポイントグループに、各リージョンの NLB を登録する。","Amazon CloudFront ディストリビューションを作成する。各リージョンの NLB をオリジンとして登録し、オリジングループでフェイルオーバーを構成する。","各リージョンの VPC を AWS Transit Gateway のピアリング接続でつなぐ。東京リージョンの NLB で全プレイヤーの通信を受け付け、各リージョンに転送する。"],"answer":[1],"why":["最寄りのリージョンには振り分けられるが、切り替えはクライアントや DNS リゾルバーのキャッシュに左右される。通信はインターネットを通り、IP アドレスもリージョンごとに異なる。","Global Accelerator は 2 つの固定のエニーキャスト IP アドレスを提供し、プレイヤーの通信を最寄りのエッジロケーションから AWS のネットワーク経由で最も近い正常なエンドポイントに届ける。UDP に対応し、ヘルスチェックによる切り替えも DNS に依存しない。","CloudFront は HTTP・HTTPS のコンテンツ配信のためのサービスであり、UDP によるゲームの通信には使えない。Global Accelerator との取り違えに注意する。","すべての通信が東京に集まるため、北米や欧州のプレイヤーのレイテンシーが大きくなる。東京リージョンの障害時に切り替えることもできない。"],"explain":"決め手は「UDP」「固定 IP アドレス」「AWS のネットワークで経路を安定させる」「DNS に左右されない切り替え」である。Global Accelerator はエニーキャストの静的 IP アドレスで通信を受け、最寄りのエッジロケーションから AWS のグローバルネットワークを通して、ヘルスチェックで正常と判断したエンドポイントへ転送する。TCP と UDP の両方に対応するため、ゲームや VoIP のような HTTP 以外の用途に向く。CloudFront は HTTP のコンテンツ配信とキャッシュに使う。","point":"UDP・固定 IP・DNS に依存しない速い切り替え・複数リージョンへの振り分けは Global Accelerator。HTTP のキャッシュ配信は CloudFront。","diagram":{"caption":"正解の構成: Global Accelerator で最も近い正常なリージョンへ届ける","cols":4,"rows":3,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":1},{"label":"北米のリージョン","kind":"region","c":2,"r":1,"w":2,"h":1},{"label":"欧州のリージョン","kind":"region","c":2,"r":2,"w":2,"h":1}],"nodes":[{"id":"player","label":"プレイヤー","sub":"UDP で接続","kind":"client","c":0,"r":1},{"id":"ga","label":"Accelerator","sub":"エニーキャスト IP","kind":"network","c":1,"r":1},{"id":"nlbjp","label":"NLB","sub":"東京","kind":"network","c":2,"r":0},{"id":"nlbus","label":"NLB","sub":"北米","kind":"network","c":2,"r":1},{"id":"nlbeu","label":"NLB","sub":"欧州","kind":"network","c":2,"r":2},{"id":"srvjp","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":0},{"id":"srvus","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":1},{"id":"srveu","label":"ゲームサーバー","sub":"EC2","kind":"compute","c":3,"r":2}],"edges":[{"from":"player","to":"ga","label":"最寄りのエッジ"},{"from":"ga","to":"nlbjp"},{"from":"ga","to":"nlbus"},{"from":"ga","to":"nlbeu"},{"from":"nlbjp","to":"srvjp"},{"from":"nlbus","to":"srvus"},{"from":"nlbeu","to":"srveu"}]}},{"id":"d3-16","domain":3,"topic":"ハイブリッド接続","type":"single","stem":"ある製造業の企業は、工場で生成される数 TB の設計データを、毎晩 AWS 上の 3 つの VPC にある処理システムに送信しています。現在はインターネット経由の AWS Site-to-Site VPN を使用していますが、時間帯によって転送速度とレイテンシーが大きく変動し、夜間の処理が時間内に終わらないことがあります。この企業は、インターネットの混雑の影響を受けない、一貫したネットワークパフォーマンスと安定した帯域を確保することを求めています。3 つの VPC はすでに AWS Transit Gateway にアタッチされています。これらの要件を満たすソリューションはどれですか。","choices":["AWS Direct Connect の専用接続を開設する。Direct Connect ゲートウェイを作成し、トランジット仮想インターフェイスを使って Transit Gateway に関連付ける。","Site-to-Site VPN 接続を複数追加して Transit Gateway にアタッチする。Transit Gateway で ECMP を有効にし、複数の VPN トンネルの帯域を束ねる。","アクセラレーションを有効にした Site-to-Site VPN 接続を Transit Gateway に作成する。工場から最寄りのエッジロケーションを経由して接続する。","工場に AWS DataSync エージェントをデプロイする。インターネット経由の並列転送で、各 VPC から利用できる Amazon EFS にデータを書き込む。"],"answer":[0],"why":["Direct Connect は AWS との専用の物理接続で、インターネットを経由しないため、一貫したネットワークパフォーマンスが得られる。トランジット仮想インターフェイスと Direct Connect ゲートウェイを使えば、Transit Gateway にアタッチされた複数の VPC にまとめて到達できる。","ECMP で束ねると合計の帯域は増えるが、通信はインターネットを通るため、混雑による速度やレイテンシーの変動は残る。","AWS のネットワークを通る区間が増えるため改善は見込めるが、工場から最寄りのエッジロケーションまではインターネットを通るため、一貫したパフォーマンスにはならない。","転送の効率は上がるが、経路はインターネットのままで混雑の影響を受ける。ネットワークの安定性という根本の問題は解決しない。"],"explain":"決め手は「インターネットの混雑の影響を受けない」「一貫したネットワークパフォーマンス」「安定した帯域」である。インターネットを経由する VPN は、アクセラレーションや ECMP で改善はできても変動をなくせない。Direct Connect の専用接続を使い、Direct Connect ゲートウェイとトランジット仮想インターフェイスで Transit Gateway に関連付けると、既存の複数の VPC に専用線でまとめて到達できる。暗号化が必要な場合は、Direct Connect の上で VPN を張る構成や MACsec も選べる。","point":"インターネットの変動を避けて一貫した性能・帯域が必要なら Direct Connect。複数の VPC へは DX ゲートウェイ＋トランジット VIF で Transit Gateway に接続する。","diagram":{"caption":"正解の構成: Direct Connect から Transit Gateway 経由で複数の VPC へ","cols":5,"rows":3,"groups":[{"label":"工場","kind":"onprem","c":0,"r":1,"w":1,"h":1},{"label":"AWS リージョン","kind":"region","c":3,"r":0,"w":2,"h":3}],"nodes":[{"id":"factory","label":"工場のサーバー","sub":"設計データ","kind":"onprem","c":0,"r":1},{"id":"dx","label":"Direct Connect","sub":"専用接続","kind":"network","c":1,"r":1},{"id":"dxgw","label":"DX ゲートウェイ","sub":"トランジット VIF","kind":"network","c":2,"r":1},{"id":"tgw","label":"Transit Gateway","sub":"VPC を集約","kind":"network","c":3,"r":1},{"id":"vpca","label":"VPC A","sub":"処理システム","kind":"compute","c":4,"r":0},{"id":"vpcb","label":"VPC B","sub":"処理システム","kind":"compute","c":4,"r":1},{"id":"vpcc","label":"VPC C","sub":"処理システム","kind":"compute","c":4,"r":2}],"edges":[{"from":"factory","to":"dx"},{"from":"dx","to":"dxgw"},{"from":"dxgw","to":"tgw"},{"from":"tgw","to":"vpca"},{"from":"tgw","to":"vpcb"},{"from":"tgw","to":"vpcc"}]}},{"id":"d3-17","domain":3,"topic":"Kinesis","type":"single","stem":"あるオンライン広告企業は、Web サイトのクリックストリームを毎秒数十万件のイベントとして収集しています。このデータは、不正クリックの検知、リアルタイムのダッシュボード、Amazon S3 への長期保存の 3 つのアプリケーションが、それぞれ独立して 1 秒未満の遅延で読み取る必要があります。また、アプリケーションに障害が発生したときは、過去 24 時間分のデータを読み直して再処理できる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon SQS の標準キューを作成し、イベントをキューに送信する。3 つのアプリケーションが同じキューをポーリングしてメッセージを受信する。","Amazon Data Firehose のストリームを作成し、イベントをストリームに送信する。3 つのアプリケーションをストリームの配信先として設定する。","Amazon Kinesis Data Streams のデータストリームにイベントを送信する。3 つのアプリケーションを拡張ファンアウトのコンシューマーとして登録する。","Amazon SNS の標準トピックを作成し、イベントを発行する。3 つのアプリケーションのエンドポイントを、それぞれ別のサブスクリプションとして登録する。"],"answer":[2],"why":["SQS のメッセージは 1 つのコンシューマーが処理して削除するもので、3 つのアプリケーションがそれぞれ全件を読むことはできない。削除したメッセージを読み直すこともできない。","Data Firehose は S3 などの配信先にデータをバッファリングして届けるサービスで、1 つのストリームの配信先は 1 つである。過去のデータを読み直す仕組みもない。","Kinesis Data Streams はデータを保持期間（既定で 24 時間）のあいだ保存し、複数のコンシューマーがそれぞれ独立して読み取れる。拡張ファンアウトを使うと、コンシューマーごとに専用のスループットで低レイテンシーにデータを受け取れる。","SNS は複数のサブスクライバーにプッシュで配信できるが、標準トピックはメッセージを保持しないため、障害時に過去 24 時間分を読み直すことができない。"],"explain":"決め手は「3 つのアプリケーションがそれぞれ独立して読み取る」「1 秒未満の遅延」「過去 24 時間分を読み直す」である。Kinesis Data Streams はシャードにデータを保持し、各コンシューマーが自分の読み取り位置から読めるため、再処理もできる。拡張ファンアウトではコンシューマーごとにシャードあたりの専用スループットが割り当てられ、データがプッシュされるため、コンシューマーを増やしても互いに影響しにくい。","point":"複数のアプリが同じストリームを独立・低遅延で読み、再処理もしたいなら Kinesis Data Streams（拡張ファンアウト）。","diagram":{"caption":"正解の構成: Kinesis Data Streams を 3 つのコンシューマーが独立して読む","cols":4,"rows":3,"groups":[],"nodes":[{"id":"web","label":"Web サイト","sub":"クリックストリーム","kind":"client","c":0,"r":1},{"id":"kds","label":"Data Streams","sub":"保持期間 24 時間","kind":"analytics","c":1,"r":1},{"id":"fraud","label":"Lambda","sub":"不正クリック検知","kind":"serverless","c":2,"r":0},{"id":"dash","label":"Managed Flink","sub":"ダッシュボード集計","kind":"analytics","c":2,"r":1},{"id":"arch","label":"Lambda","sub":"保存用の処理","kind":"serverless","c":2,"r":2},{"id":"s3","label":"S3","sub":"長期保存","kind":"storage","c":3,"r":2}],"edges":[{"from":"web","to":"kds"},{"from":"kds","to":"fraud","label":"専用で受信"},{"from":"kds","to":"dash","label":"専用で受信"},{"from":"kds","to":"arch","label":"専用で受信"},{"from":"arch","to":"s3"}]}},{"id":"d3-18","domain":3,"topic":"分析","type":"single","stem":"ある小売企業は、全店舗の POS データを日次の CSV ファイルとして Amazon S3 に蓄積しており、データ量は数年分で数十 TB になっています。分析担当者は Amazon Athena でこのデータを分析していますが、ほとんどのクエリは特定の期間を対象に、数十ある列のうち数列（店舗 ID、商品 ID、売上金額など）だけを集計します。クエリの実行に時間がかかり、スキャンされるデータ量も多くなっています。この企業は、クエリのパフォーマンスを向上させ、スキャンされるデータ量を削減することを求めています。これらの要件を満たすソリューションはどれですか。","choices":["Athena のクエリ結果の再利用を有効にする。以前に実行したクエリと同じクエリについては、保存された結果を返すように設定する。","AWS Glue の ETL ジョブでデータを Apache Parquet 形式に変換する。日付でパーティション分割して S3 に保存する。","CSV ファイルを gzip 形式で圧縮して S3 に保存し直す。Athena のテーブル定義は変更せずに、S3 から読み込むデータ量を減らす。","CSV ファイルを店舗ごとの小さなファイルに分割して S3 に保存し直す。Athena がより多くのファイルを並列に読み込めるようにする。"],"answer":[1],"why":["クエリ結果の再利用は、同じクエリを再実行するときに前の結果を返す機能で、条件の異なる新しいクエリのパフォーマンスやスキャン量は改善しない。","Parquet は列指向の形式で、クエリに必要な列だけを読み込め、圧縮の効率も高い。日付でパーティション分割すると、期間の条件に合わないデータを読み飛ばせるため、スキャン量と実行時間を大きく減らせる。","圧縮で読み込むバイト数は減るが、行指向の CSV のままなので不要な列も読み込み、期間に関係なく全ファイルをスキャンする点は変わらない。","小さなファイルが大量にあると、ファイルを開く処理や一覧の取得が増えてかえって遅くなる。必要な列や期間だけを読む効果もない。"],"explain":"決め手は「特定の期間」「数十列のうち数列だけ」「スキャンされるデータ量を削減」である。Athena はスキャンしたデータ量に応じて課金され、読み込む量が減るほど速くなる。列指向形式（Parquet や ORC）で必要な列だけを読み、パーティション分割で必要な期間だけを読むのが基本の最適化である。変換は Glue の ETL ジョブで行い、AWS Glue Data Catalog のテーブル定義とパーティションも更新する。","point":"Athena の高速化とスキャン量の削減は、列指向形式（Parquet / ORC）＋圧縮＋パーティション分割。小さなファイルの大量化は避ける。","diagram":{"caption":"正解の構成: Glue で Parquet に変換し、日付でパーティション分割する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"raw","label":"S3（CSV）","sub":"日次の POS データ","kind":"storage","c":0,"r":0},{"id":"glue","label":"Glue ETL ジョブ","sub":"Parquet に変換","kind":"analytics","c":1,"r":0},{"id":"pq","label":"S3（Parquet）","sub":"dt=YYYY-MM-DD","kind":"storage","c":2,"r":0},{"id":"athena","label":"Athena","sub":"必要な列・期間だけ","kind":"analytics","c":3,"r":0},{"id":"catalog","label":"Data Catalog","sub":"テーブル定義","kind":"analytics","c":2,"r":1}],"edges":[{"from":"raw","to":"glue"},{"from":"glue","to":"pq","label":"変換して保存"},{"from":"pq","to":"athena","label":"パーティション"},{"from":"glue","to":"catalog","label":"定義を更新","style":"dashed"},{"from":"athena","to":"catalog","label":"メタデータ参照","style":"dashed"}]}},{"id":"d3-19","domain":3,"topic":"ELB","type":"single","stem":"ある企業は、独自の TCP ベースのプロトコルで通信する取引システムを Amazon EC2 インスタンス上で運用しています。取引時間帯の開始直後には接続数が突発的に数百万規模まで増加し、通信のレイテンシーは可能な限り小さくする必要があります。また、取引先は自社のファイアウォールで、この企業のシステムの固定 IP アドレスだけを許可しています。ソリューションアーキテクトは、これらの要件を満たすロードバランサーを設計する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Application Load Balancer を作成し、EC2 インスタンスをターゲットグループに登録する。取引先には ALB の DNS 名を通知し、その名前を許可してもらう。リスナーは HTTPS で作成する。","Gateway Load Balancer を作成し、EC2 インスタンスをターゲットとして登録する。取引先からの通信を GENEVE プロトコルでインスタンスに転送する。","Network Load Balancer を作成し、各 AZ のサブネットに Elastic IP アドレスを割り当てる。TCP リスナーを設定して EC2 インスタンスをターゲットに登録する。","Classic Load Balancer を作成し、TCP リスナーを設定する。接続の急増に備えて、AWS サポートにロードバランサーの事前ウォームアップを依頼する。"],"answer":[2],"why":["ALB は HTTP / HTTPS などのレイヤー 7 向けで、独自の TCP プロトコルは扱えない。IP アドレスも固定ではなく、DNS 名に対する許可も取引先のファイアウォールでは実現できない。","Gateway Load Balancer はファイアウォールなどの仮想アプライアンスを透過的に挟むためのもので、一般的なアプリケーションの負荷分散には使わない。固定 IP の要件も満たさない。","NLB はレイヤー 4 で動作し、急激な接続数の増加に対応でき、レイテンシーも小さい。AZ ごとに Elastic IP アドレスを割り当てられるため、取引先に固定 IP を示せる。","Classic Load Balancer は従来世代で、新規の設計には推奨されない。固定 IP を割り当てる機能もなく、事前ウォームアップの依頼で要件を満たす設計にはならない。"],"explain":"「独自の TCP プロトコル」「接続数の突発的な増加」「レイテンシーを最小に」「固定 IP アドレス」がそろったら NLB を選ぶ。ALB は HTTP 系のアプリケーション向けで、パスやヘッダーに基づくルーティングが必要なときに使う。NLB は AZ ごとに静的 IP（Elastic IP）を持てるので、IP アドレスの許可リストが必要な取引先との接続にも向く。","point":"TCP / UDP・超低レイテンシー・固定 IP・急激な増加は NLB。HTTP のパスベースルーティングは ALB、仮想アプライアンスの挿入は GWLB。","diagram":{"caption":"正解の構成: Elastic IP を持つ NLB で TCP 通信を分散する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"partner","label":"取引先","sub":"固定 IP を許可","kind":"client","c":0,"r":0},{"id":"nlb","label":"NLB","sub":"AZ ごとに EIP","kind":"network","c":1,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"取引システム","kind":"compute","c":2,"r":0}],"edges":[{"from":"partner","to":"nlb","label":"TCP"},{"from":"nlb","to":"ec2","label":"TCP"}]}},{"id":"d3-20","domain":3,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、アップロードされた画像をリサイズする AWS Lambda 関数を運用しています。関数のメモリ設定は 128 MB で、CloudWatch Logs を見ると実際のメモリ使用量は 100 MB 程度ですが、1 回の実行に 8 秒前後かかっており、処理時間の短縮が求められています。実行は常時行われているため、コールドスタートは問題になっていません。ソリューションアーキテクトは、コードを大きく変更せずに処理時間を短縮する必要があります。最も運用上のオーバーヘッドが少ない方法で、この要件を満たすソリューションはどれですか。","choices":["関数のメモリ設定を引き上げる。AWS Lambda Power Tuning などで、処理時間とコストのバランスが良い値を確認する。","関数のエイリアスにプロビジョニングされた同時実行を設定し、実行環境を事前に初期化した状態で待機させる。","関数の設定画面で vCPU 数を直接指定する。画像処理に十分な vCPU 数を設定して、処理を並列化し、処理時間を短縮する。","関数の予約された同時実行数を増やし、他の関数と競合せずに同時に実行できる関数の数の上限を引き上げて、処理を並列にさばく。"],"answer":[0],"why":["Lambda では、メモリ設定に比例して CPU 性能などのリソースが割り当てられる。CPU がボトルネックの処理は、メモリを増やすと処理時間が短縮され、課金される時間が短くなって費用が大きく変わらないこともある。","プロビジョニングされた同時実行はコールドスタートを避けるための機能で、1 回の処理時間そのものは短くならない。今回はコールドスタートが問題ではない。","Lambda の関数設定に vCPU 数を直接指定する項目はない。CPU 性能はメモリ設定を通じて変わる。","予約された同時実行は、同時実行数の確保と上限の設定に使う。1 回の実行にかかる時間は変わらない。"],"explain":"「メモリ使用量は少ないのに処理が遅い」「コードの変更なし」「運用上のオーバーヘッドが少ない」というのがヒント。Lambda は CPU を直接選べず、メモリ設定に応じて CPU が配分されるので、メモリを増やすのが最も簡単な対処になる。最適値は AWS Lambda Power Tuning や AWS Compute Optimizer の推奨で確認できる。","point":"Lambda の CPU はメモリ設定に比例する。処理が遅いが CPU 負荷が高いなら、使用量が少なくてもメモリ設定を増やす。","diagram":null},{"id":"d3-21","domain":3,"topic":"EC2","type":"single","stem":"ある企業は、Amazon EC2 インスタンス上で自己管理の NoSQL データベースを運用しています。このデータベースはランダムな読み書きを毎秒数十万回行い、ストレージにはミリ秒未満のレイテンシーが求められます。現在は汎用の m5 ファミリーのインスタンスと Amazon EBS の SSD ボリュームを使っていますが、ストレージの I/O 性能が不足しています。データは他のノードに複製されており、ノード単体のデータを失っても再構築できます。ソリューションアーキテクトは、ストレージ I/O 性能を最大にする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["コンピューティング最適化の c ファミリーのインスタンスに変更し、vCPU 数を増やす。EBS ボリュームは変更しない。","メモリ最適化の r ファミリーのインスタンスに変更し、データをすべてメモリ上に常駐させる。EBS ボリュームは作成時のバックアップ用にだけ使う。","汎用の m ファミリーのまま、プロビジョニング済み IOPS SSD の io2 ボリュームに変更する。EBS 最適化を有効にする。","ストレージ最適化の i ファミリーのインスタンスに変更し、ローカルの NVMe SSD インスタンスストアにデータを置く。"],"answer":[3],"why":["c ファミリーは CPU 負荷の高い処理に向く。ボトルネックはストレージ I/O で、vCPU を増やしても改善しない。","r ファミリーはメモリを多く使うワークロード向けだが、データが大きくなるとメモリに収まらない。ランダム I/O の性能問題を解決する選択として適切ではない。","io2 は高い IOPS を出せるが、ネットワーク経由の EBS はインスタンスストアよりレイテンシーが大きい。ミリ秒未満の最小レイテンシーと最大の I/O 性能という要件では劣る。","i ファミリーはローカルの NVMe SSD を持ち、ランダム I/O の IOPS とレイテンシーに優れる。データはレプリケーションで保護されているため、インスタンスストアの揮発性も許容できる。"],"explain":"「ランダム I/O が毎秒数十万回」「ミリ秒未満のレイテンシー」「データは他のノードに複製されている」がヒント。ストレージ I/O が最優先なら、ストレージ最適化インスタンス（i ファミリーなど）のインスタンスストアを使う。インスタンスストアは停止や障害でデータが失われるので、複製などで保護できる場合に限って使う。","point":"ストレージ I/O 最優先はストレージ最適化（i / d）のインスタンスストア。揮発性なので複製で保護できるデータに使う。","diagram":null},{"id":"d3-22","domain":3,"topic":"Auto Scaling","type":"multi","stem":"ある企業は、社内向けの Web ポータルを、Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。毎営業日の 9:00 に社員が一斉にアクセスするため、その直後は応答が遅くなります。日中は、会議や社内イベントの影響でアクセス数が予測できない形で変動します。ソリューションアーキテクトは、アクセスの急増時にも日中の変動時にも、応答速度を維持できるようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["平日の 8:45 に最小容量を引き上げ、夜間に元へ戻すスケジュールされたスケーリングアクションを作成する。","CPU 使用率が 90% を超えたときに 1 台だけ追加するシンプルスケーリングポリシーを設定し、クールダウンを 600 秒にする。","Auto Scaling グループの最大容量を現在の 10 倍に引き上げ、ヘルスチェックの猶予期間を長くする。","ターゲットあたりのリクエスト数（ALBRequestCountPerTarget）をメトリクスとするターゲット追跡スケーリングポリシーを作成する。","CloudWatch アラームから Amazon SNS と AWS Lambda を呼び出し、負荷に応じて EC2 インスタンスを直接起動する。"],"answer":[0,3],"why":["時刻が分かっている急増には、スケジュールされたスケーリングで先に容量を確保できる。起動が間に合わずに応答が遅くなるのを防げる。","負荷が上がってから 1 台ずつ追加するため、急増に追いつかない。クールダウンも長く、変動に細かく対応できない。","最大容量を増やしても、スケールアウトを始めるきっかけや速さは変わらない。ヘルスチェックの猶予期間も応答速度とは関係がない。","リクエスト数のメトリクスを目標値に保つように、自動で台数を増減できる。予測できない変動にも、運用の手間なく追随できる。","独自の仕組みを作り込む必要があり、起動したインスタンスを Auto Scaling グループやロードバランサーに登録する処理も自前になる。運用上のオーバーヘッドが大きく、マネージドなポリシーで足りる。"],"explain":"要件は「決まった時刻の急増」と「予測できない変動」の 2 つ。前者には、事前に容量を引き上げるスケジュールされたスケーリング、後者には、メトリクスを目標値に保つターゲット追跡スケーリングを組み合わせる。ターゲット追跡は、ALB 配下ならリクエスト数が、CPU 負荷が中心なら平均 CPU 使用率が使いやすい。","point":"決まった時刻の急増はスケジュールされたスケーリング、予測できない変動はターゲット追跡。両方を併用できる。","diagram":{"caption":"正解の構成: スケジュールとターゲット追跡を併用する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"sched","label":"スケジュール","sub":"8:45 に最小容量UP","kind":"management","c":0,"r":0},{"id":"asg","label":"ASG","sub":"台数を増減","kind":"compute","c":1,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"Web ポータル","kind":"compute","c":2,"r":0},{"id":"tt","label":"ターゲット追跡","sub":"リクエスト数を維持","kind":"management","c":1,"r":1}],"edges":[{"from":"sched","to":"asg"},{"from":"asg","to":"ec2","label":"起動・終了"},{"from":"tt","to":"asg"}]}},{"id":"d3-23","domain":3,"topic":"S3","type":"multi","stem":"ある企業は、同じリージョンにある Amazon EC2 インスタンス群から、Amazon S3 バケットに保存された数 GB の大きなオブジェクトを繰り返し読み込んでいます。現在は 1 つのバケットのプレフィックス 1 つにすべてのオブジェクトを置き、各オブジェクトを 1 本のリクエストで順番に取得しています。読み込み全体に時間がかかっており、同時に大量の GET リクエストを送るとスロットリングも発生します。ソリューションアーキテクトは、読み取りのスループットを向上させる必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["S3 Transfer Acceleration をバケットで有効にし、EC2 インスタンスからは高速化エンドポイントを使って取得する。","Range ヘッダーでオブジェクトを複数のバイト範囲に分け、並列に取得して結合する。","オブジェクトを S3 Standard-IA ストレージクラスに移行して、取得時のスループットを上げる。","EC2 インスタンスのタイプをより大きなものに変更し、1 本のリクエストで順番にオブジェクトを取得する方式は変えない。","オブジェクトを複数のプレフィックスに分散して配置し、各プレフィックスに対するリクエストを並列に処理する。"],"answer":[1,4],"why":["Transfer Acceleration は、遠く離れたクライアントとのデータ転送を高速化する機能。同じリージョン内の EC2 からの読み取りには効果が薄い。","バイト範囲フェッチを使うと、1 つの大きなオブジェクトを並列に取得でき、スループットが上がる。失敗した範囲だけを再取得することもできる。","ストレージクラスの変更で GET のスループットは上がらない。Standard-IA は取得料金も加わり、頻繁に読むデータには向かない。","インスタンスを大きくしても、順番に 1 本ずつ取得する方式のままでは、並列化できずに S3 の性能を使い切れない。","S3 のリクエスト性能はプレフィックスごとに確保される。プレフィックスを分散して並列に読み込めば、全体の読み取りスループットが上がり、スロットリングも避けやすくなる。"],"explain":"「1 つのプレフィックスに集中している」「1 本のリクエストで順番に取得」という 2 つの原因それぞれに対策を打つ。S3 はプレフィックスごとにリクエスト性能が確保されるため、複数プレフィックスへの分散と並列化で全体の性能を伸ばせる。大きなオブジェクトにはバイト範囲フェッチで並列に取得する。","point":"S3 の読み取りを速くするには、プレフィックスを分散して並列化し、大きなオブジェクトはバイト範囲フェッチで並列取得する。","diagram":null},{"id":"d3-24","domain":3,"topic":"CloudFront","type":"single","stem":"ある EC 事業者は、Amazon CloudFront ディストリビューションを使って、Application Load Balancer の背後にある画像変換サービスから商品画像を配信しています。画像の URL には、変換用のパラメーター（width、format）のほか、広告の計測に使う utm_source や、ユーザーごとに変わる session_id などのクエリ文字列が付与されます。キャッシュヒット率が低く、オリジンの負荷が高くなっています。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えてキャッシュヒット率を高める必要があります。これらの要件を満たすソリューションはどれですか。","choices":["ディストリビューションの最大 TTL を 1 年に延長し、エッジロケーションでキャッシュされたオブジェクトが保持される期間を長くする。","キャッシュポリシーで、width と format のクエリ文字列だけをキャッシュキーに含める。utm_source と session_id はキャッシュキーから除外する。","キャッシュポリシーで、すべてのクエリ文字列をキャッシュキーに含める。URL ごとに別々にキャッシュを保持して、確実に正しい画像を配信する。","CloudFront のオリジンシールドを有効にして、エッジロケーションからオリジンへのリクエストの前に、リージョン単位の追加のキャッシュ層を設けて、オリジンへの負荷を減らす。"],"answer":[1],"why":["TTL を延ばしても、キャッシュキーに session_id などが含まれている限り、リクエストごとに別のオブジェクトとして扱われ、ヒットしない。","キャッシュキーを、画像の内容を決める値だけに絞る。計測用やセッション用のパラメーターが違っても同じキャッシュを使えるため、ヒット率が上がる。","すべてのクエリ文字列をキーに含めると、ユーザーごとに値が変わる session_id によって、キャッシュがほとんど再利用されなくなる。","オリジンシールドはオリジンへのリクエスト数を減らせるが、エッジでのキャッシュキーが分かれる問題は解決しない。ヒット率が低い根本原因への対処にならない。"],"explain":"ヒット率が低い原因は、内容に影響しない値までキャッシュキーに含まれていること。CloudFront のキャッシュポリシーでは、キャッシュキーに含めるクエリ文字列・ヘッダー・Cookie を指定できる。必要な値だけを許可リストで指定し、それ以外は除外する。除外した値をオリジンに渡す必要がある場合は、オリジンリクエストポリシーで転送できる。","point":"キャッシュヒット率を上げるには、キャッシュキーを必要最小限にする。除外した値をオリジンに渡すにはオリジンリクエストポリシー。","diagram":{"caption":"正解の構成: キャッシュキーを必要な値だけに絞る","cols":3,"rows":1,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"?width=&utm_source=","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"キーは width, format","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"画像変換サービス","kind":"network","c":2,"r":0}],"edges":[{"from":"user","to":"cf"},{"from":"cf","to":"alb","label":"ミスのみ","style":"dashed"}]}},{"id":"d3-25","domain":3,"topic":"ElastiCache","type":"single","stem":"あるゲーム会社は、数百万人のプレイヤーが参加するオンラインゲームを運用しています。リアルタイムのランキング（リーダーボード）を表示するために、プレイヤーのスコアが更新されるたびに順位を再計算して、上位 100 人を数ミリ秒で返す必要があります。現在は Amazon RDS for MySQL に ORDER BY を使ったクエリを発行していますが、負荷が高く応答が遅くなっています。ソリューションアーキテクトは、これらの要件を最小限の遅延で満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon ElastiCache for Memcached のクラスターを作成し、スコアを文字列として保存する。ランキングはアプリケーションが取得してソートする。","Amazon DynamoDB のテーブルにスコアを保存し、スコアに対するグローバルセカンダリインデックスを作成して、Scan で上位 100 件を取得する。","Amazon ElastiCache（Valkey または Redis OSS）のソート済みセットにスコアを保存する。上位 100 人は順位範囲を指定して取得する。","RDS for MySQL にリードレプリカを追加し、ランキング用のクエリをすべてリードレプリカに向けてインデックスを作成する。"],"answer":[2],"why":["Memcached はキーと値の単純なキャッシュで、ソート済みセットのようなデータ構造を持たない。ソートをアプリケーション側で行うと、遅延と実装の負担が増える。","DynamoDB でスコア順の全体ランキングを Scan で取得すると、読み取りの負荷が大きくなる。ミリ秒単位の順位取得という要件にも合わない。","ソート済みセットは、スコアでの並べ替えを保ったままメンバーを管理できる。更新と順位の取得がメモリ上で高速に行えるため、リーダーボードに向く。","リードレプリカで読み取りは分散できるが、並べ替えのクエリそのものが重い。インメモリのデータストアのような低遅延は期待できない。"],"explain":"「リアルタイムのランキング」「更新のたびに順位を再計算」「数ミリ秒」がヒント。ElastiCache の Valkey / Redis OSS エンジンはソート済みセットをサポートしており、スコアの更新と順位範囲の取得が高速にできるため、リーダーボードの定番になっている。Memcached にはこのデータ構造がない。","point":"リーダーボードは ElastiCache（Valkey / Redis OSS）のソート済みセット。Memcached は単純なキャッシュ向けで対応しない。","diagram":{"caption":"正解の構成: ソート済みセットでリアルタイムにランキングを返す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"player","label":"プレイヤー","sub":"スコア送信・順位表示","kind":"client","c":0,"r":0},{"id":"app","label":"ゲーム API","sub":"ECS / EC2","kind":"compute","c":1,"r":0},{"id":"cache","label":"ElastiCache","sub":"ソート済みセット","kind":"database","c":2,"r":0}],"edges":[{"from":"player","to":"app"},{"from":"app","to":"cache","label":"更新・順位取得","both":true}]}},{"id":"d3-26","domain":3,"topic":"Kinesis","type":"single","stem":"ある企業は、Web サイトのクリックストリームを分析するために、数千台のサーバーから出力されるログを Amazon S3 のデータレイクに集めています。ログは数分以内に S3 に到着し、Amazon Athena で効率よくクエリできるよう Apache Parquet 形式に変換されている必要があります。ソリューションアーキテクトは、独自のコンシューマーアプリケーションの開発や、サーバーの管理を行わずに、これらの要件を満たす必要があります。最も運用上のオーバーヘッドが少ない方法で、これらの要件を満たすソリューションはどれですか。","choices":["Amazon Kinesis Data Streams にログを送信し、EC2 インスタンス上のコンシューマーアプリケーションで Parquet 形式に変換して S3 に書き込む。","Amazon MSK クラスターにログを送信し、EC2 インスタンス上で Kafka Connect を実行して、変換した Parquet 形式のファイルを S3 のバケットに書き込む。","ログを S3 に直接アップロードし、S3 イベント通知を使って AWS Lambda 関数を起動して、オブジェクトを 1 つずつ Parquet 形式に変換して別のバケットに保存する。","Amazon Data Firehose の配信ストリームにログを送信し、S3 を配信先に指定する。レコード形式の変換で Parquet を有効にし、バッファー設定で配信間隔を指定する。"],"answer":[3],"why":["Data Streams 自体は問題ないが、コンシューマーアプリケーションの開発と EC2 の管理が必要になる。運用上のオーバーヘッドが大きい。","MSK のクラスターと Kafka Connect の EC2 を運用する必要があり、サーバー管理を避ける要件に反する。","小さなファイルが大量に作られ、関数の同時実行やエラー処理の管理も必要になる。S3 に到着するまでのバッファリングや集約にも向かない。","Data Firehose はフルマネージドで、S3 などへの配信を行える。レコード形式の変換で Parquet に変換でき、バッファーの間隔やサイズで配信のタイミングも調整できる。"],"explain":"「独自のコンシューマーを開発しない」「サーバーを管理しない」「S3 に Parquet で配信」がそろったら Amazon Data Firehose を選ぶ。Firehose は、ストリーミングデータを S3、Amazon Redshift、Amazon OpenSearch Service などに自動で配信するマネージドサービスで、バッファリングと形式変換にも対応する。複数のコンシューマーが同じデータを読み、再処理する用途ではなく、データを配信する用途で選ぶ。","point":"ストリーミングデータを S3 などへ配信するだけなら Amazon Data Firehose。バッファリング、Parquet 変換、Lambda による変換に対応する。","diagram":{"caption":"正解の構成: Data Firehose で S3 に Parquet 形式で配信する","cols":4,"rows":1,"groups":[],"nodes":[{"id":"srv","label":"Web サーバー","sub":"クリックログ","kind":"compute","c":0,"r":0},{"id":"fh","label":"Data Firehose","sub":"Parquet に変換","kind":"analytics","c":1,"r":0},{"id":"s3","label":"S3 データレイク","sub":"バッファー後に配信","kind":"storage","c":2,"r":0},{"id":"ath","label":"Athena","sub":"SQL で分析","kind":"analytics","c":3,"r":0}],"edges":[{"from":"srv","to":"fh"},{"from":"fh","to":"s3"},{"from":"ath","to":"s3","label":"クエリ"}]}},{"id":"d3-27","domain":3,"topic":"API Gateway","type":"single","stem":"ある企業は、商品カタログを返す REST API を Amazon API Gateway と AWS Lambda、Amazon DynamoDB で構築しています。商品情報の更新は 1 時間に数回程度ですが、同じ商品ページに対する GET リクエストが大量に届いており、Lambda と DynamoDB への負荷が増えています。ソリューションアーキテクトは、アプリケーションコードを変更せずに、応答時間を短縮し、バックエンドへのリクエスト数を減らす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["API Gateway の REST API でステージのキャッシュを有効にし、適切な TTL を設定する。商品 ID を含むパスやパラメーターをキャッシュキーにする。","Lambda 関数のコードを変更し、グローバル変数に商品情報を保持して、同じ実行環境に届いたリクエストには DynamoDB を呼ばず保持した値を返す。","API Gateway の使用量プランでスロットリングの上限を引き下げ、バックエンドに届く 1 秒あたりのリクエスト数を一定の値に制限して、負荷を抑える。","DynamoDB テーブルのプロビジョニングされた読み取りキャパシティを大幅に増やし、Lambda 関数の予約された同時実行数も引き上げる。"],"answer":[0],"why":["ステージのキャッシュは、TTL の間、同じリクエストに API Gateway が直接応答する。Lambda と DynamoDB を呼び出す回数が減り、応答も速くなる。コードの変更は不要。","実行環境ごとにキャッシュが分かれ、コードの変更も必要になる。要件の「コードを変更しない」に反し、キャッシュの一貫性も管理しにくい。","スロットリングを強めても、リクエストが拒否されるだけで応答時間は短縮されない。利用者に 429 エラーが返る。","キャパシティを増やしても負荷に耐えられるだけで、バックエンドへのリクエスト数は減らない。応答時間の短縮にもならず、コストも増える。"],"explain":"「更新は頻繁ではない」「同じリクエストが大量」「コードの変更なし」「バックエンドのリクエスト数を減らす」が決め手。API Gateway（REST API）はステージ単位でキャッシュを有効にでき、TTL の間は同じレスポンスを返せる。キャッシュキーには、パスやクエリ文字列などを指定できる。スロットリングはバックエンドの保護や公平な利用のための機能で、速度の向上には使わない。","point":"同じ GET が多く更新が少ない API は、API Gateway（REST API）のステージキャッシュ。スロットリングは保護用で、高速化には使わない。","diagram":{"caption":"正解の構成: API Gateway のキャッシュで負荷を減らす","cols":4,"rows":1,"groups":[],"nodes":[{"id":"client","label":"クライアント","sub":"GET /products/{id}","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"ステージキャッシュ","kind":"network","c":1,"r":0},{"id":"fn","label":"Lambda","sub":"キャッシュミス時のみ","kind":"serverless","c":2,"r":0},{"id":"ddb","label":"DynamoDB","sub":"商品カタログ","kind":"database","c":3,"r":0}],"edges":[{"from":"client","to":"apigw"},{"from":"apigw","to":"fn","label":"ミスのみ","style":"dashed"},{"from":"fn","to":"ddb"}]}},{"id":"d3-28","domain":3,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、東京リージョンで Amazon RDS for MySQL の DB インスタンスを Multi-AZ 構成で運用しています。ヨーロッパの拠点の社員が、このデータベースに対する参照中心のレポートを実行しており、リージョン間の距離が原因で応答が遅くなっています。書き込みは東京のアプリケーションだけが行います。ソリューションアーキテクトは、書き込みの処理は変更せずに、ヨーロッパからの読み取りのレイテンシーを短縮する必要があります。最も運用上のオーバーヘッドが少ない方法で、これらの要件を満たすソリューションはどれですか。","choices":["東京リージョンの DB インスタンスを、2 つの読み取り可能なスタンバイを持つ Multi-AZ DB クラスターに変更し、ヨーロッパからはリーダーエンドポイントに接続する。","ヨーロッパのリージョンにクロスリージョンリードレプリカを作成し、ヨーロッパの拠点のレポートをリードレプリカのエンドポイントに向ける。","東京リージョンで同じインスタンスクラスのリードレプリカを追加し、ヨーロッパからの接続を Amazon Route 53 のレイテンシールーティングで振り分ける。","ヨーロッパのリージョンに EC2 インスタンスを起動して MySQL を自己管理でインストールし、mysqldump による定期的なバックアップとリストアでデータを同期する。"],"answer":[1],"why":["Multi-AZ DB クラスターのリーダーは東京リージョン内にあり、読み取りの負荷は分散できても、リージョン間の距離によるレイテンシーは変わらない。","ヨーロッパに置いたリードレプリカは、東京のプライマリから非同期でレプリケーションされる。拠点の近くで読み取れるため、レイテンシーが短くなり、書き込みの処理も変更せずに済む。","東京のリードレプリカを増やしても、リージョン間の距離は変わらない。レイテンシールーティングは、東京リージョンのエンドポイントを返すだけになる。","自己管理のデータベースと同期の仕組みの構築が必要になり、運用上のオーバーヘッドが大きい。バックアップの間隔の分だけ、データも古くなる。"],"explain":"「遠隔地からの参照が遅い」「書き込みは東京だけ」がヒント。クロスリージョンリードレプリカを使えば、利用者に近いリージョンに読み取り専用のコピーを持たせられる。レプリケーションは非同期なので、わずかな遅れ（レプリカラグ）は許容する必要がある。Aurora なら、Aurora グローバルデータベースが同じ用途に使える。","point":"遠隔地の読み取りを速くするには、そのリージョンにクロスリージョンリードレプリカ（Aurora ならグローバルデータベース）を置く。","diagram":{"caption":"正解の構成: ヨーロッパのリードレプリカから読み取る","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":1,
