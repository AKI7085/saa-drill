を自動的に検出する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["すべての VPC で VPC フローログを有効にし、ログを Amazon CloudWatch Logs に送信する。ポート 22 への通信を CloudWatch Logs Insights で検索する。","Amazon GuardDuty を有効にし、ポート 22 への総当たり攻撃や不審な API 呼び出しを検出結果として通知させる。","AWS CloudTrail の証跡を作成して管理イベントを S3 バケットに保存し、AuthorizeSecurityGroupIngress などの API 呼び出しの実行者と日時を確認できるようにする。","Amazon Inspector を有効にし、EC2 インスタンスのソフトウェアの脆弱性を継続的にスキャンして、検出結果を AWS Security Hub に集約する。","AWS Config でセキュリティグループの設定の記録を有効にし、マネージドルールの restricted-ssh を追加して、準拠していないセキュリティグループを検出する。"],"answer":[2,4],"why":["フローログは通信の記録で、誰がルールを変更したかや、設定の履歴は分からない。","GuardDuty は脅威を検出するサービスで、セキュリティグループの設定の履歴を保持したり、設定がルールに準拠しているかを評価したりはしない。","CloudTrail は API 呼び出しを、実行した IAM プリンシパル、日時、送信元とともに記録する。証跡で S3 に保存すれば、長期間の調査にも使える。","Inspector はソフトウェアの脆弱性を見つけるサービスで、ルールを変更した人や設定の履歴は分からない。","Config はリソースの設定変更を記録して履歴を保持し、ルールで設定を継続的に評価する。restricted-ssh は、0.0.0.0/0 からの SSH を許可するセキュリティグループを非準拠として検出する。"],"explain":"「誰がいつ変更したか」は AWS CloudTrail、「設定の履歴」と「設定がルールに準拠しているかの評価」は AWS Config、と役割を分けて考える。Config の設定履歴には関連する CloudTrail のイベントも表示されるため、両方を組み合わせると調査がしやすい。非準拠のリソースは、Systems Manager Automation による自動修復につなぐこともできる。","point":"「誰が・いつ・どの API を呼んだか」は CloudTrail、「設定がどう変わったか・ルールに準拠しているか」は Config。","diagram":null},{"id":"d1-25","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、Amazon EC2 インスタンスで実行されるアプリケーションから Amazon S3 バケットのオブジェクトを読み取っています。現在は IAM ユーザーのアクセスキーを発行し、設定ファイルに保存してインスタンスに配置しています。セキュリティチームは、長期の認証情報をインスタンスに保存しないようにし、キーのローテーション作業もなくすことを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["IAM ユーザーのアクセスキーを 90 日ごとに手動でローテーションする。新しいキーは AWS Systems Manager Run Command で全インスタンスの設定ファイルに配布する。","アクセスキーを AWS Secrets Manager に保存し、アプリケーションの起動時に取得させる。シークレットの自動ローテーションを有効にする。","S3 バケットの読み取り権限をもつ IAM ロールを作成し、インスタンスプロファイルを通じて EC2 インスタンスに関連付ける。アプリケーションは AWS SDK の既定の認証情報プロバイダーを使う。","S3 バケットポリシーでプリンシパルに「*」を指定し、aws:SourceIp 条件でインスタンスのパブリック IP アドレスからのアクセスだけを許可する。"],"answer":[2],"why":["長期のアクセスキーをインスタンスに置く構成のままで、配布とローテーションの運用作業も残る。要件の「長期の認証情報を保存しない」を満たさない。","アクセスキーの保管場所が変わるだけで、長期の認証情報を使う点は同じ。取得するための認証情報も別途必要になる。","インスタンスプロファイル経由で、EC2 インスタンスに一時的な認証情報が自動で配布・更新される。コードにも設定ファイルにもキーを持たずに済み、ローテーション作業もない。","認証を IP アドレスだけに頼る構成で、IAM による権限管理にならない。同じ IP アドレスを使う他のリソースからもアクセスできてしまい、IP アドレスが変わるたびにポリシーの更新も必要になる。"],"explain":"「長期の認証情報を置かない」「ローテーション作業をなくす」が決め手。EC2 上のアプリケーションに権限を渡す標準の方法は、IAM ロールをインスタンスプロファイル経由で関連付けることで、一時的な認証情報が自動でローテーションされる。SDK や CLI は認証情報プロバイダーチェーンでインスタンスメタデータから自動的に取得する。","point":"EC2 上のアプリに AWS の権限を渡すなら IAM ロール（インスタンスプロファイル）。アクセスキーをインスタンスに置かない。","diagram":{"caption":"正解の構成: IAM ロールで EC2 に一時的な認証情報を渡す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"ec2","label":"EC2","sub":"アプリケーション","kind":"compute","c":0,"r":0},{"id":"role","label":"IAM ロール","sub":"S3 の読み取り権限","kind":"security","c":1,"r":0},{"id":"s3","label":"S3 バケット","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2","to":"role","label":"一時認証情報"},{"from":"role","to":"s3","label":"GetObject"}]}},{"id":"d1-26","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、プライベートサブネットの Amazon EC2 インスタンスを、管理者が SSH で操作できるようにしています。現在はパブリックサブネットに踏み台サーバーを置き、セキュリティグループでポート 22 を許可しています。セキュリティチームは、インバウンドのポートを一切開けずに接続できるようにし、管理者の操作ログも記録することを求めています。プライベートサブネットにはインターネットへの経路がなく、運用上のオーバーヘッドも最小限にする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["インスタンスに AmazonSSMManagedInstanceCore ポリシーをもつ IAM ロールを関連付ける。Systems Manager 用のインターフェイス型 VPC エンドポイントを作成し、Session Manager で接続する。セッションのログは Amazon S3 または Amazon CloudWatch Logs に出力する。","踏み台サーバーを Auto Scaling グループで冗長化し、Network Load Balancer 経由でポート 22 に接続する。セキュリティグループでは管理者の IP アドレスだけを許可する。","EC2 Instance Connect を使い、インスタンスのセキュリティグループで管理者の IP アドレスからのポート 22 を許可する。接続の履歴は AWS CloudTrail で確認する。","AWS Site-to-Site VPN を作成し、管理者の端末から VPN 経由でインスタンスのプライベート IP アドレスに SSH で接続する。接続のログは VPC フローログで取得する。"],"answer":[0],"why":["Session Manager は SSM エージェントからの送信方向の通信で接続するため、インバウンドのポートは不要。VPC エンドポイントがあればインターネットへの経路も要らず、セッションの内容も S3 や CloudWatch Logs に記録できる。","踏み台サーバーが残り、ポート 22 も開けたままになる。パッチ適用などの運用負荷も増え、要件を満たさない。","この構成ではポート 22 のインバウンドを許可しているため、「ポートを開けない」要件に反する。CloudTrail には接続の記録は残るが、操作内容は記録されない。","VPN の構築と運用が必要でオーバーヘッドが大きく、SSH のためにポート 22 も許可する必要がある。フローログは通信の記録であり、操作内容は記録できない。"],"explain":"「インバウンドのポートを開けない」「操作ログを記録」「インターネットへの経路なし」の 3 つがそろったら Systems Manager Session Manager を選ぶ。インターネットへの経路がないサブネットでは、Systems Manager、ssmmessages、ec2messages 用のインターフェイス型 VPC エンドポイントを作成する。接続は IAM で制御でき、セッションのログは S3 や CloudWatch Logs に保存できる。","point":"踏み台サーバーの代わりは Session Manager。ポート 22 が不要で、操作ログも残る。プライベートサブネットでは VPC エンドポイントを使う。","diagram":{"caption":"正解の構成: Session Manager でインバウンドなしに接続する","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"admin","label":"管理者","sub":"IAM で認証","kind":"client","c":0,"r":0},{"id":"ssm","label":"Session Manager","sub":"操作ログを記録","kind":"management","c":1,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"ssm / ssmmessages","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"SSM エージェント","kind":"compute","c":3,"r":0}],"edges":[{"from":"admin","to":"ssm"},{"from":"ssm","to":"vpce","label":"HTTPS 443"},{"from":"vpce","to":"ec2"}]}},{"id":"d1-27","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、VPC 内に 3 層構成のウェブアプリケーションを構築しています。Application Load Balancer (ALB)、Auto Scaling グループのアプリケーション層の Amazon EC2 インスタンス、データベース層の Amazon RDS で構成されています。アプリケーション層のインスタンスは頻繁に増減し、IP アドレスも変わります。セキュリティチームは、各層が直前の層からの通信だけを受け付けるようにし、インスタンスが増減してもルールの変更が不要であることを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各層のサブネットにネットワーク ACL を設定し、アプリケーション層のインスタンスの IP アドレスを個別に許可するインバウンドルールを追加する。Auto Scaling による増減のたびにルールを更新する。","すべての層に同じセキュリティグループを割り当て、そのセキュリティグループ自身を送信元とするインバウンドルールを追加する。","アプリケーション層とデータベース層のセキュリティグループで、VPC の CIDR ブロック全体からのインバウンドを許可する。ALB だけをパブリックサブネットに配置する。","ALB、アプリケーション層、データベース層に別々のセキュリティグループを作成する。アプリケーション層は ALB のセキュリティグループを、データベース層はアプリケーション層のセキュリティグループを送信元に指定してインバウンドを許可する。"],"answer":[3],"why":["ネットワーク ACL はサブネット単位でステートレスなため、インスタンスの増減に追従できない。IP アドレスの変更のたびにルールの更新が必要で、運用効率が悪い。","同じセキュリティグループの中では層の区別がなくなり、ALB からデータベースへ直接通信できるなど、直前の層だけに限定する要件を満たさない。","VPC 内のどのリソースからでも通信できてしまい、層ごとの制限にならない。","セキュリティグループは別のセキュリティグループを送信元に指定できる。インスタンスが増減しても、同じセキュリティグループが付いていれば自動的に許可されるため、ルールの変更は不要。"],"explain":"「直前の層からの通信だけ」「インスタンスの増減でもルール変更が不要」の決め手は、セキュリティグループの参照（送信元にセキュリティグループを指定）。セキュリティグループはステートフルで許可ルールだけを書く。ネットワーク ACL はサブネット単位のステートレスなフィルターで、特定の IP の拒否など補助的な用途に向く。","point":"層ごとの通信制御は、セキュリティグループを送信元に指定する。IP の拒否が必要なときだけネットワーク ACL を足す。","diagram":{"caption":"正解の構成: セキュリティグループを送信元に指定して層を分離する","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":3,"h":1}],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"SG: alb-sg","kind":"network","c":1,"r":0},{"id":"app","label":"EC2 (ASG)","sub":"SG: 送信元 alb-sg","kind":"compute","c":2,"r":0},{"id":"rds","label":"RDS","sub":"SG: 送信元 app-sg","kind":"database","c":3,"r":0}],"edges":[{"from":"user","to":"alb","label":"HTTPS"},{"from":"alb","to":"app"},{"from":"app","to":"rds"}]}},{"id":"d1-28","domain":1,"topic":"S3","type":"single","stem":"ある企業は、Amazon S3 バケットに保存したレポートファイルを、ログインした利用者だけがダウンロードできるウェブアプリケーションを提供しています。バケットはパブリックアクセスをブロックしています。企業は、バケットポリシーを変更せずに、認証済みの利用者に 15 分間だけダウンロードを許可することを求めています。利用者は AWS アカウントも IAM ユーザーももっていません。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["利用者ごとに IAM ユーザーを作成し、レポートの GetObject だけを許可するポリシーをアタッチする。利用者にアクセスキーを配布する。","アプリケーションが利用者の認証を確認した後、アプリケーションの IAM ロールの認証情報で有効期限を 15 分に設定した署名付き URL を生成して利用者に返す。","バケットのブロックパブリックアクセスを無効にし、バケットポリシーですべてのプリンシパルに GetObject を許可する。オブジェクトのキーは推測されにくいランダムな文字列にする。","ダウンロードのたびに、アプリケーションがオブジェクトを別のパブリックバケットにコピーする。ライフサイクルルールで 1 日後にコピーを削除する。"],"answer":[1],"why":["利用者ごとの IAM ユーザーとアクセスキーの管理が必要で、運用負荷が大きい。有効期限を 15 分に限定することもできない。","署名付き URL は、URL を生成した IAM プリンシパルの権限で、有効期間中だけオブジェクトにアクセスできる。バケットポリシーの変更は不要で、AWS アカウントをもたない利用者にも渡せる。","バケット全体が公開され、パブリックアクセスをブロックする前提に反する。キーを推測しにくくしても、認証された利用者だけに限定したことにならない。","公開バケットが必要になり、コピーの処理と削除の管理も増える。有効期限が 15 分でなく最短 1 日になり、公開状態も避けられない。"],"explain":"「パブリックアクセスはブロックのまま」「一定時間だけ」「AWS アカウントをもたない利用者」の組み合わせは署名付き URL。アプリケーション側で認証した後、SDK で URL を生成して返せばよい。URL の有効期間は生成に使った認証情報の有効期間の範囲に収まる。","point":"非公開の S3 オブジェクトを一時的に渡すなら署名付き URL。有効期間を指定でき、権限は生成した IAM プリンシパルのもの。","diagram":{"caption":"正解の構成: 署名付き URL で非公開オブジェクトを一時的に渡す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"app","label":"アプリケーション","sub":"IAM ロールで署名","kind":"compute","c":0,"r":0},{"id":"user","label":"利用者","sub":"認証済み","kind":"client","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"非公開","kind":"storage","c":2,"r":0}],"edges":[{"from":"app","to":"user","label":"署名付き URL"},{"from":"user","to":"s3","label":"15 分以内"}]}},{"id":"d1-29","domain":1,"topic":"S3","type":"single","stem":"ある企業は、AWS Organizations で 40 の AWS アカウントを管理しています。共有用の Amazon S3 バケットを 1 つ用意し、組織内のすべてのアカウントの IAM プリンシパルに読み取りを許可する必要があります。組織外のアカウントからはアクセスできないようにします。各アカウントの IAM ロールには、必要な ID ベースのポリシーが付与済みです。アカウントは頻繁に追加・削除されます。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["バケットポリシーのプリンシパルに 40 アカウントのルートをすべて列挙する。アカウントを追加・削除するたびにバケットポリシーを更新する。","バケットのアクセスコントロールリスト (ACL) で、各アカウントの正規ユーザー ID に読み取りを許可する。アカウントの追加・削除に合わせて ACL を更新する。","バケットポリシーのプリンシパルに「*」を指定し、aws:PrincipalOrgID 条件キーに組織 ID を指定して、GetObject と ListBucket を許可する。","バケットをパブリックに設定し、aws:SourceIp 条件で各アカウントの NAT ゲートウェイの Elastic IP アドレスを許可する。"],"answer":[2],"why":["動作はするが、アカウントの追加・削除のたびにポリシーの更新が必要で、運用負荷が大きい。ポリシーのサイズ上限にも近づきやすくなる。","ACL は新しい用途では非推奨で、アカウント単位の許可しかできない。アカウントの変更のたびに更新が必要になる。","aws:PrincipalOrgID を使えば、組織に属するアカウントのプリンシパルだけが許可される。アカウントが追加・削除されても、バケットポリシーの変更は不要。","パブリックなバケットは要件に反する。IP アドレスで組織内に限定する方法は、アカウントの変更への追従も難しい。"],"explain":"「組織内のすべてのアカウント」「アカウントが頻繁に増減」は aws:PrincipalOrgID のサイン。アカウントを列挙せず、組織 ID の条件だけでバケットポリシーを書ける。組織に新しく追加されたアカウントには自動で適用され、組織から外れたアカウントは自動で対象外になる。","point":"組織内の全アカウントに S3 を共有するなら、バケットポリシーの aws:PrincipalOrgID 条件。アカウントの列挙は不要。","diagram":null},{"id":"d1-30","domain":1,"topic":"ELB","type":"multi","stem":"ある企業は、Auto Scaling グループの Amazon EC2 インスタンスで実行するウェブアプリケーションを、Application Load Balancer (ALB) の背後で公開しようとしています。要件は次のとおりです。クライアントと ALB の間の通信を HTTPS で暗号化すること。証明書の更新作業を自動化すること。SQL インジェクションなどの一般的なウェブ攻撃を、ALB の位置で遮断すること。運用上のオーバーヘッドを最小限に抑えて、これらの要件を満たす手順の組み合わせはどれですか。","choices":["自己署名証明書を作成して ALB の HTTPS リスナーにインポートする。有効期限が近づいたら手動で新しい証明書に入れ替える。","ALB に HTTPS リスナーを追加し、AWS Certificate Manager (ACM) で発行した公開証明書を関連付ける。","各 EC2 インスタンスにホストベースのファイアウォールソフトウェアをインストールする。ウェブ攻撃のシグネチャは手動で更新する。","ALB のセキュリティグループでポート 443 だけを許可する。SQL インジェクションのパターンを含むリクエストは、セキュリティグループのルールで拒否する。","AWS WAF のウェブ ACL に SQL データベース向けの AWS マネージドルールグループを追加し、ALB に関連付ける。"],"answer":[1,4],"why":["自己署名証明書は更新の自動化ができず、手作業の入れ替えが必要になる。クライアントからも信頼されない。","ACM の公開証明書は ALB に関連付けでき、有効期間内に自動で更新される。HTTPS での暗号化と証明書更新の自動化を満たす。","ALB の位置での遮断にならず、各インスタンスでの導入と更新の作業が必要で、運用負荷が大きい。","セキュリティグループはポートや IP アドレスなどの接続元を制御するもので、リクエストの内容は検査できない。","AWS WAF のマネージドルールグループで、一般的な攻撃を遮断できる。ウェブ ACL は ALB に直接関連付けられ、ルールの保守も AWS 側で行われる。"],"explain":"要件は「HTTPS 化と証明書の自動更新」と「ALB でのウェブ攻撃の遮断」の 2 つ。前者は ACM の証明書を HTTPS リスナーに関連付ける。ACM は自動更新に対応する。後者は AWS WAF のウェブ ACL を ALB に関連付ける。セキュリティグループはリクエストの中身を見られない点に注意する。","point":"ALB の HTTPS は ACM 証明書、ウェブ攻撃対策は AWS WAF の関連付け。セキュリティグループはリクエストの内容を見ない。","diagram":{"caption":"正解の構成: ALB で ACM による HTTPS 終端と WAF を組み合わせる","cols":3,"rows":2,"groups":[],"nodes":[{"id":"client","label":"クライアント","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"HTTPS リスナー","kind":"network","c":1,"r":0},{"id":"ec2","label":"EC2 (ASG)","kind":"compute","c":2,"r":0},{"id":"waf","label":"AWS WAF","sub":"マネージドルール","kind":"security","c":1,"r":1},{"id":"acm","label":"ACM 証明書","sub":"自動更新","kind":"security","c":2,"r":1}],"edges":[{"from":"client","to":"alb","label":"HTTPS"},{"from":"alb","to":"ec2"},{"from":"waf","to":"alb","label":"関連付け","style":"dashed"},{"from":"acm","to":"alb","label":"証明書","style":"dashed"}]}},{"id":"d1-31","domain":1,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、VPC のプライベートサブネットにある Amazon RDS for MySQL データベースに、AWS Lambda 関数からアクセスしています。現在、データベースのパスワードは Lambda 関数の環境変数に平文で設定されています。セキュリティチームは、パスワードをコードや環境変数に含めないようにし、Lambda 関数がインターネットを経由せずにパスワードを取得することを求めています。プライベートサブネットには NAT ゲートウェイがありません。これらの要件を満たすソリューションはどれですか。","choices":["パスワードを AWS Secrets Manager のシークレットに保存する。Lambda 関数を VPC に接続し、実行ロールに secretsmanager:GetSecretValue を許可する。Secrets Manager 用のインターフェイス型 VPC エンドポイントを作成する。","パスワードを暗号化したファイルとして関数のデプロイパッケージに同梱する。関数の起動時に復号する処理をコードに追加する。","パスワードを Amazon S3 バケットのオブジェクトとして保存し、S3 のゲートウェイ型 VPC エンドポイント経由で取得する。バケットはパブリックアクセスをブロックする。","RDS インスタンスをパブリックアクセス可能に変更し、Lambda 関数を VPC の外で実行する。パスワードは Secrets Manager からインターネット経由で取得する。"],"answer":[0],"why":["Secrets Manager でパスワードをコードの外で管理でき、アクセスは実行ロールの IAM 権限で制御できる。VPC 内の Lambda は、インターフェイス型エンドポイント経由でインターネットを使わずに取得できる。","パスワードを変更するたびにデプロイが必要になり、復号用の鍵の管理も増える。コードに含めない要件を満たさず、一元管理もできない。","S3 はシークレットの管理を目的としたサービスではなく、パスワードの更新や取得の監査も別途考える必要がある。運用負荷も増える。","データベースをインターネットに公開することになり、セキュリティ要件に反する。Lambda をインターネット経由で動かす構成は、プライベートに接続する意図とも合わない。"],"explain":"「パスワードをコードや環境変数に含めない」はシークレット管理のサービスを使う合図。VPC に接続した Lambda 関数がインターネットを経由せずに Secrets Manager にアクセスするには、NAT ゲートウェイか Secrets Manager 用のインターフェイス型 VPC エンドポイントが必要で、NAT ゲートウェイがない本問では後者を選ぶ。実行ロールの IAM 権限でアクセスを制御し、関数のセキュリティグループから RDS への通信を許可する。","point":"Lambda から DB 認証情報を安全に使うなら、Secrets Manager ＋実行ロール。VPC 内ならインターフェイス型エンドポイントを使う。","diagram":{"caption":"正解の構成: VPC 内の Lambda が VPCE でシークレットを取得する","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":2}],"nodes":[{"id":"fn","label":"Lambda","sub":"実行ロールで許可","kind":"serverless","c":0,"r":0},{"id":"rds","label":"RDS for MySQL","sub":"SG で Lambda を許可","kind":"database","c":1,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"Secrets Manager","kind":"network","c":0,"r":1},{"id":"sm","label":"Secrets Manager","sub":"DB の認証情報","kind":"security","c":2,"r":1}],"edges":[{"from":"fn","to":"rds","label":"MySQL"},{"from":"fn","to":"vpce"},{"from":"vpce","to":"sm","label":"AWS 内部"}]}},{"id":"d1-32","domain":1,"topic":"EC2","type":"multi","stem":"ある企業は、1 つのリージョンで多数の Amazon EC2 インスタンスを運用しています。セキュリティ監査で、次の 2 点が指摘されました。1 つ目は、インスタンスメタデータサービス (IMDS) に認証なしの単純な HTTP GET リクエストでアクセスでき、アプリケーションに SSRF の脆弱性があると IAM ロールの認証情報が漏えいするおそれがあることです。2 つ目は、新しく作成する Amazon EBS ボリュームの暗号化が開発者の設定に任されており、暗号化されていないボリュームが作成されるおそれがあることです。最小限の運用作業でこれらの指摘に対処するソリューションの組み合わせはどれですか。","choices":["インスタンスのメタデータオプションで HttpTokens を required に設定し、IMDSv2 を必須にする。","インスタンスのセキュリティグループで、IMDS のアドレス 169.254.169.254 へのアウトバウンド通信を拒否する。","対象のリージョンで、Amazon EBS の暗号化をデフォルトで有効にする。","EBS ボリュームを作成するときは暗号化を有効にするよう開発者に周知する。AWS Config で暗号化されていないボリュームを定期的に確認する。","EBS ボリュームの作成を検知する AWS Lambda 関数を作成し、暗号化されていないボリュームのスナップショットを暗号化コピーして元のボリュームを削除する。"],"answer":[0,2],"why":["IMDSv2 はセッショントークンを使う方式で、単純な GET リクエストが通らない。HttpTokens を required にすれば IMDSv1 が使えなくなり、SSRF による認証情報の窃取を防ぎやすくなる。","セキュリティグループはインスタンスと IMDS の間のトラフィック（リンクローカルアドレス）をフィルタリングしないため、この設定は効かない。","リージョン単位でデフォルト暗号化を有効にすると、新しく作成する EBS ボリュームとスナップショットのコピーが自動的に暗号化される。開発者の設定に依存しなくなる。","周知と事後の確認だけで、暗号化されていないボリュームが作成されること自体は防げない。","作成後に事後対応をする構成で、暗号化されていない期間が生じる。Lambda 関数の作成と保守の運用負荷も大きい。"],"explain":"IMDS の問題には IMDSv2 の必須化（HttpTokens=required）、EBS の暗号化の徹底にはリージョンごとのデフォルト暗号化が最小限の作業で済む。どちらも一度の設定で防止的に効く。セキュリティグループは IMDS 宛の通信に影響しない点に注意する。","point":"SSRF 対策は IMDSv2 の必須化、EBS の暗号化の徹底はリージョンのデフォルト暗号化。どちらも設定で防止できる。","diagram":null},{"id":"d1-33","domain":1,"topic":"KMS・暗号化","type":"single","stem":"ある金融サービス企業は、決済データを暗号化する AWS 上のアプリケーションを開発しています。コンプライアンス要件により、暗号鍵は自社専用のシングルテナントのハードウェアセキュリティモジュール (HSM) に保管し、鍵へのアクセスを管理するユーザーを自社だけで管理する必要があります。AWS の従業員が鍵素材にアクセスできないことも求められています。アプリケーションは PKCS#11 インターフェイスで HSM を利用します。これらの要件を満たすソリューションはどれですか。","choices":["AWS KMS で AWS マネージドキーを使用する。アプリケーションから GenerateDataKey API を呼び出してデータキーを取得する。","AWS KMS でカスタマーマネージドキーを作成し、キーポリシーでアプリケーションのロールだけにアクセスを許可する。","AWS Systems Manager Parameter Store の SecureString パラメータにキーを保存する。パラメータは AWS KMS のキーで暗号化する。","AWS CloudHSM クラスターを複数の AZ に作成し、アプリケーションに CloudHSM クライアントと PKCS#11 ライブラリを構成する。HSM のユーザーは自社で管理する。"],"answer":[3],"why":["AWS KMS は AWS が管理するマルチテナントのサービスで、専用の HSM を占有する要件を満たさない。AWS マネージドキーはポリシーの変更もできない。","カスタマーマネージドキーでもキーを保管する HSM はマルチテナントで、専用の HSM を自社だけで管理する要件を満たさない。PKCS#11 での利用もできない。","キーの保管場所が HSM ではなく、PKCS#11 での利用もできない。暗号化に使った KMS のキーの管理も AWS のサービスに依存する。","CloudHSM は専用のシングルテナントの HSM を提供し、HSM のユーザーと鍵は顧客だけが管理する。PKCS#11 に対応し、複数の AZ にクラスターを構成すれば可用性も確保できる。"],"explain":"「シングルテナントの専用 HSM」「鍵の管理は自社だけ」「PKCS#11」は CloudHSM を選ぶ決め手。KMS は管理が簡単で多くの AWS サービスと統合されているが、HSM は AWS が管理するマルチテナントの構成。独自の要件で専用 HSM が必要なときだけ CloudHSM を選ぶ。","point":"専用のシングルテナント HSM と、鍵の管理を顧客だけで行う要件は CloudHSM。それ以外は KMS で十分。","diagram":{"caption":"正解の構成: CloudHSM を複数 AZ に配置し、アプリから PKCS#11 で利用する","cols":3,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":1,"r":1,"w":1,"h":1}],"nodes":[{"id":"app","label":"アプリケーション","sub":"PKCS#11","kind":"compute","c":0,"r":0},{"id":"hsma","label":"CloudHSM","sub":"専用 HSM","kind":"security","c":1,"r":0},{"id":"hsmc","label":"CloudHSM","sub":"専用 HSM","kind":"security","c":1,"r":1}],"edges":[{"from":"app","to":"hsma","label":"暗号化操作"},{"from":"app","to":"hsmc"}]}},{"id":"d1-34","domain":1,"topic":"Cognito","type":"single","stem":"ある企業は、Application Load Balancer (ALB) の背後の Amazon EC2 インスタンスで社内向けウェブアプリケーションを実行しています。現在は、アプリケーションのコード内にログイン画面とパスワードを検証する処理があります。企業は、ユーザー認証の処理をアプリケーションから切り離し、Amazon Cognito ユーザープールのユーザーと、外部の SAML 2.0 ID プロバイダーのユーザーがサインインできるようにすることを求めています。アプリケーションコードの変更を最小限に抑えるソリューションはどれですか。","choices":["Amazon Cognito ID プールを作成し、認証されたユーザーに一時的な AWS 認証情報を発行する。アプリケーションは AWS SDK でその認証情報を使ってリソースへのアクセスを制御する。","ALB のリスナールールに authenticate-cognito アクションを設定し、ユーザープールを関連付ける。ユーザープールに SAML ID プロバイダーを追加する。認証済みのリクエストは、ユーザー情報を含む HTTP ヘッダーとともにターゲットに転送される。","ALB の前に Amazon API Gateway の REST API を配置し、AWS Lambda オーソライザーでトークンを検証する。アプリケーションからログイン画面の処理を削除する。","各 EC2 インスタンスに SAML のサービスプロバイダー用ソフトウェアをインストールし、認証処理をアプリケーションの代わりに実行させる。"],"answer":[1],"why":["ID プールは AWS のリソースにアクセスするための一時的な認証情報を発行するもので、ウェブアプリケーションのサインインを置き換えるものではない。アプリケーションの変更も大きい。","ALB が Cognito ユーザープールと連携してサインインを処理し、認証済みのリクエストだけをターゲットに転送する。SAML ID プロバイダーはユーザープールのフェデレーションで連携できる。アプリケーションはヘッダーを読むだけで済む。","構成が大きく変わり、Lambda オーソライザーの開発と保守も必要になる。ログイン画面を別に用意する必要もあり、変更が最小限にならない。","各インスタンスにソフトウェアの導入と更新が必要で、運用負荷が大きい。Cognito のユーザーを統合する要件も満たさない。"],"explain":"「認証をアプリケーションから切り離す」「Cognito ユーザープールと SAML」「コード変更を最小限に」は、ALB の認証アクション（authenticate-cognito）が決め手。ユーザープールが SAML などの外部 ID プロバイダーとフェデレーションして、ALB がサインインとトークンの検証を行う。ID プールは AWS への一時的な認証情報の発行用で、役割が異なる。","point":"ALB でアプリの認証を代行するなら、リスナーの authenticate-cognito アクション。外部 IdP はユーザープールにフェデレーションする。","diagram":{"caption":"正解の構成: ALB が Cognito ユーザープールで認証してから転送する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"authenticate-cognito","kind":"network","c":1,"r":0},{"id":"app","label":"EC2","sub":"ユーザー情報ヘッダー","kind":"compute","c":2,"r":0},{"id":"pool","label":"ユーザープール","sub":"SAML IdP と連携","kind":"security","c":1,"r":1}],"edges":[{"from":"user","to":"alb","label":"HTTPS"},{"from":"alb","to":"pool","label":"サインイン","both":true},{"from":"alb","to":"app","label":"認証済みのみ"}]}},{"id":"d1-35","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、AWS マネジメントコンソールにサインインする開発者に IAM ユーザーを使用しています。開発者は 200 人で、IAM グループで管理されています。セキュリティチームは、開発者が多要素認証 (MFA) を使ってサインインしていない場合に、自身の MFA デバイスの設定とパスワードの変更を除くすべての AWS 操作を拒否することを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["開発者全員に MFA デバイスの登録を依頼する。未登録のユーザーを AWS CloudTrail のログで毎週確認し、IAM ユーザーを手動で無効化する。","Amazon EventBridge ルールでコンソールのサインインイベントを検出する。MFA を使っていないユーザーのセッションを AWS Lambda 関数で終了させる。","IAM グループに、aws:MultiFactorAuthPresent が false のときは MFA の設定とパスワード変更以外の操作をすべて拒否するポリシーをアタッチする。条件には BoolIfExists を使う。","IAM アカウントのパスワードポリシーで MFA を必須にする。パスワードの有効期限も短く設定する。"],"answer":[2],"why":["事後確認と手作業の対応で、MFA なしの操作を防げない。200 人分の確認作業も継続的に発生する。","事後に検知して対応する仕組みで、サインインから終了までの間は操作できてしまう。関数の開発と保守の負荷もある。","ポリシーの条件キーで、MFA を使っていないセッションの操作を予防的に拒否できる。グループにアタッチするだけで全員に効き、MFA を登録するまで他の操作はできない。","IAM のパスワードポリシーには MFA を必須にする設定がなく、強制できない。"],"explain":"「MFA を使っていないときは拒否」は、aws:MultiFactorAuthPresent 条件キーによる Deny ポリシー。MFA を使っていない場合にはこのキーが存在しないこともあるため、BoolIfExists で条件を書く。MFA の登録や自分のパスワードの変更だけは例外として許可し、利用者が自分で MFA を設定できる状態を残す。","point":"MFA の強制は、aws:MultiFactorAuthPresent による Deny ポリシーを IAM グループにアタッチする。パスワードポリシーでは強制できない。","diagram":null},{"id":"d1-36","domain":1,"topic":"IAM","type":"single","stem":"ある企業の開発チームは、アプリケーション用の IAM ロールに、開発の初期に AdministratorAccess ポリシーを付与しました。アプリケーションは本番稼働に入りましたが、実際に使用している AWS のサービスと API は一部に限られています。AWS CloudTrail の証跡は有効になっています。セキュリティチームは、このロールの権限を実際の利用状況に基づく最小権限に絞り込むことを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["開発者がアプリケーションのソースコードを調べ、呼び出している API をすべて洗い出す。その結果をもとに、IAM ポリシーを手作業で書き直す。","IAM Access Analyzer のポリシー生成機能を使い、CloudTrail のログからロールが実際に使用したアクションに基づくポリシーを生成する。内容を確認し、AdministratorAccess と置き換える。","AdministratorAccess を削除し、AWS マネージドポリシーの PowerUserAccess に置き換える。","ロールの信頼ポリシーを変更し、アプリケーションが動作する EC2 インスタンスだけがロールを引き受けられるようにする。"],"answer":[1],"why":["ソースコードからは動的に呼び出される API を見落としやすく、手作業の負荷も大きい。実際の利用状況に基づく絞り込みにならない。","IAM Access Analyzer は、CloudTrail のアクティビティから、実際に使われたアクションを含むポリシーのドラフトを生成する。内容を確認して置き換えるだけで、最小権限に近づけられる。","PowerUserAccess も広い権限（IAM 以外のほぼすべての操作）を許可するため、最小権限にならない。","信頼ポリシーはロールを誰が引き受けられるかを制御するもので、ロールが実行できる操作の範囲は変わらない。"],"explain":"「実際の利用状況に基づく最小権限」「CloudTrail が有効」から、IAM Access Analyzer のポリシー生成を選ぶ。指定した期間の CloudTrail ログを分析し、使用されたアクションをもとにポリシーを作成する。生成されたポリシーは、サービスやリソースの確認・調整をしてから適用する。","point":"実績に基づく最小権限は、Access Analyzer のポリシー生成（CloudTrail のログから作る）。信頼ポリシーは権限の範囲を変えない。","diagram":null},{"id":"d1-37","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、1 つの AWS アカウントで複数のプロジェクトチームが Amazon EC2 インスタンスを運用しています。各 IAM ロールと各 EC2 インスタンスには、プロジェクト名を値とする Project タグが付けられています。新しいプロジェクトが追加されるたびに IAM ポリシーを書き換える運用が負担になっています。セキュリティチームは、自分のプロジェクトと同じ Project タグを持つインスタンスだけを開始・停止できるようにし、プロジェクトが増えてもポリシーの変更を不要にしたいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["プロジェクトごとに IAM ポリシーを作成し、Resource にそのプロジェクトのインスタンスの ARN を列挙する。新しいインスタンスが作成されるたびに、該当するポリシーを更新する。","プロジェクトごとに IAM ポリシーを作成し、ec2:ResourceTag/Project 条件にプロジェクト名を固定値で記述する。新しいプロジェクトが増えたら、ポリシーを 1 つ追加する。","1 つの IAM ポリシーで、ec2:StartInstances と ec2:StopInstances を許可し、ec2:ResourceTag/Project 条件に aws:PrincipalTag/Project の値を指定する。各ロールには Project タグを付けておく。","プロジェクトごとに別の AWS アカウントを作成し、プロジェクトのインスタンスをそれぞれのアカウントに移す。アカウントは AWS Organizations で一元管理する。"],"answer":[2],"why":["インスタンスの追加のたびにポリシーを更新する必要があり、運用負荷が大きい。ARN の列挙はポリシーのサイズ上限にも近づきやすい。","動作はするが、プロジェクトが増えるたびにポリシーが増える。ポリシーを書き換えない、という要件を満たさない。","プリンシパルのタグとリソースのタグを比較する属性ベースのアクセス制御（ABAC）にすると、ポリシーは 1 つで済む。新しいプロジェクトは、ロールとインスタンスに同じタグを付けるだけで対応できる。","分離はできるが、アカウントの再編とインスタンスの移行が必要になり、目的に対して大がかりすぎる。要件はタグによる制御で満たせる。"],"explain":"「同じタグを持つリソースだけ操作できる」「プロジェクトが増えてもポリシーを変更しない」から、タグを使った属性ベースのアクセス制御（ABAC）を選ぶ。ポリシーの条件に aws:PrincipalTag/Project の変数を使うと、呼び出すロールのタグと対象リソースのタグを比較できる。タグを付ける権限（ec2:CreateTags や iam:TagRole）自体は、別途管理者だけに絞る必要がある。","point":"ABAC は IAM ポリシーの条件で aws:PrincipalTag と ResourceTag を比較する。ポリシーを増やさずにスケールできる。","diagram":{"caption":"正解の構成: ロールとインスタンスのタグが一致したときだけ許可する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"role","label":"IAM ロール","sub":"Project=A","kind":"security","c":0,"r":0},{"id":"policy","label":"IAM ポリシー","sub":"タグが一致なら許可","kind":"security","c":1,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"Project=A","kind":"compute","c":2,"r":0}],"edges":[{"from":"role","to":"policy","label":"評価"},{"from":"policy","to":"ec2","label":"開始・停止"}]}},{"id":"d1-38","domain":1,"topic":"IAM","type":"multi","stem":"ある企業は、AWS Organizations で 120 個の AWS アカウントを管理しており、毎月新しいアカウントが追加されています。共有サービスアカウントの Amazon S3 バケットには、全社で使う設定ファイルを保存しています。組織内のすべてのアカウントのアプリケーションがこのバケットのオブジェクトを読み取れるようにし、組織外のアカウントからのアクセスは許可しないようにする必要があります。アカウントが追加されるたびにバケットのポリシーを更新する作業は避けたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["バケットポリシーの Principal に組織内のすべてのアカウント ID を列挙して s3:GetObject を許可する。アカウントが追加されたら、その ID を追記する。","バケットポリシーで、aws:PrincipalOrgID 条件に組織 ID を指定し、条件に一致するプリンシパルに s3:GetObject を許可する。","AWS Organizations の SCP で、組織内のすべてのアカウントに、このバケットに対する s3:GetObject を許可する。","各アカウントのアプリケーションが使う IAM ロールの IAM ポリシーで、このバケットのオブジェクトに対する s3:GetObject を許可する。","バケットの ACL で、組織内の各アカウントの正規ユーザー ID に READ の権限を付与する。アカウントが追加されたら ACL を更新する。"],"answer":[1,3],"why":["要件のアクセス制御はできるが、アカウントが追加されるたびにバケットポリシーを更新する必要があり、更新の作業を避けたいという要件に合わない。","aws:PrincipalOrgID 条件を使うと、組織に属するアカウントのプリンシパルだけを 1 つのステートメントで許可できる。アカウントが増えてもポリシーを変更する必要がない。","SCP は、アカウントで使える権限の上限を定めるもので、権限そのものは付与しない。バケットへのアクセスは許可されない。","別のアカウントのバケットにアクセスするには、バケットポリシーでの許可に加えて、アクセスする側のプリンシパルの IAM ポリシーでも許可が必要になる。","ACL はアカウント単位で権限を付与する古い仕組みで、新しいバケットでは既定で無効になっている。アカウントの追加ごとに更新も必要になる。"],"explain":"「組織内のすべてのアカウント」「組織外は許可しない」「アカウントの追加ごとに更新しない」から、バケットポリシーの aws:PrincipalOrgID 条件を使う。アカウント間のアクセスでは、リソース側（バケットポリシー）と呼び出す側（IAM ポリシー）の両方で許可が必要になる。SCP は権限を付与しないので、許可の手段にはならない。","point":"組織内のアカウントだけにリソースを共有するなら、リソースベースのポリシーで aws:PrincipalOrgID を条件にする。アカウント間のアクセスは両側の許可が必要。","diagram":{"caption":"正解の構成: 組織 ID を条件にバケットポリシーで許可する","cols":3,"rows":2,"groups":[{"label":"組織（AWS Organizations）","kind":"generic","c":0,"r":0,"w":3,"h":2},{"label":"共有サービスアカウント","kind":"account","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"ra","label":"アプリのロール","sub":"アカウント A","kind":"security","c":0,"r":0},{"id":"rb","label":"アプリのロール","sub":"アカウント B","kind":"security","c":0,"r":1},{"id":"s3","label":"S3 バケット","sub":"組織 ID を条件に許可","kind":"storage","c":2,"r":0}],"edges":[{"from":"ra","to":"s3","label":"GetObject"},{"from":"rb","to":"s3","label":"GetObject"}]}},{"id":"d1-39","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、AWS Organizations で 50 個の AWS アカウントを管理しています。セキュリティチームは、組織の外の AWS アカウントやインターネットに公開されている Amazon S3 バケット、IAM ロール、AWS KMS キーを継続的に検出し、新たに見つかったときに通知を受けたいと考えています。検出のために、各アカウントでエージェントを配置したり、アプリケーションを変更したりしたくありません。最も運用上のオーバーヘッドが少ない方法でこれらの要件を満たすソリューションはどれですか。","choices":["信頼ゾーンを組織とする IAM Access Analyzer のアナライザーを、管理アカウントまたは委任管理者アカウントに作成する。新しい検出結果に一致する Amazon EventBridge ルールから、Amazon SNS トピックに通知する。","各アカウントで AWS Config を有効にし、s3-bucket-public-read-prohibited マネージドルールを組織全体にデプロイする。非準拠になったときに Amazon SNS トピックに通知する。検出結果は、各アカウントの AWS Config コンソールで確認する。","Amazon Macie を組織全体で有効にし、すべての S3 バケットの公開状態を継続的に評価する。ポリシーの検出結果を Amazon EventBridge から Amazon SNS トピックに通知する。","Amazon GuardDuty を組織全体で有効にし、S3 の保護機能を有効にする。外部への公開を示す検出結果を Amazon EventBridge から Amazon SNS トピックに通知する。"],"answer":[0],"why":["Access Analyzer は、リソースベースのポリシーを分析して、信頼ゾーン（ここでは組織）の外からアクセスできるリソースを検出する。S3 バケット、IAM ロール、KMS キーなどに対応し、エージェントは不要である。","このマネージドルールの対象は S3 バケットの公開読み取りだけで、IAM ロールの信頼ポリシーや KMS キーのポリシーは検出できない。","Macie の対象は S3 のデータと、バケットのセキュリティ状態に限られる。IAM ロールや KMS キーへの外部アクセスは検出できない。","GuardDuty は不審な動作や脅威を検出するサービスで、ポリシーの設定を分析して公開リソースを洗い出す用途のものではない。"],"explain":"「S3、IAM ロール、KMS キーなど複数種類のリソース」「組織外への公開」「エージェント不要」から、IAM Access Analyzer の外部アクセスのアナライザーを選ぶ。信頼ゾーンを組織にすると、組織内のアカウント間は検出対象から外れ、組織外へのアクセスだけが検出される。新しい検出結果は EventBridge で受けて SNS に流せる。","point":"外部アクセスの検出は IAM Access Analyzer。信頼ゾーンを組織にすれば、組織外へ共有されたリソースだけが見つかる。","diagram":{"caption":"正解の構成: 組織を信頼ゾーンとするアナライザーで外部共有を検出する","cols":4,"rows":1,"groups":[{"label":"組織","kind":"generic","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"res","label":"組織内リソース","sub":"S3・IAM ロール・KMS","kind":"storage","c":0,"r":0},{"id":"aa","label":"Access Analyzer","sub":"信頼ゾーン: 組織","kind":"security","c":1,"r":0},{"id":"eb","label":"EventBridge","sub":"新しい検出結果","kind":"integration","c":2,"r":0},{"id":"sns","label":"SNS トピック","sub":"セキュリティチームへ","kind":"integration","c":3,"r":0}],"edges":[{"from":"res","to":"aa","label":"分析"},{"from":"aa","to":"eb","label":"検出結果"},{"from":"eb","to":"sns","label":"通知"}]}},{"id":"d1-40","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、オンプレミスのサーバーで動く自社製のバッチアプリケーションから、Amazon S3 バケットにデータをアップロードしています。現在は IAM ユーザーのアクセスキーをサーバーに保存しており、セキュリティ監査で長期的な認証情報の保存を指摘されました。サーバーには、社内の認証局（CA）が発行した X.509 証明書がすでに配布されています。アプリケーションの変更を最小限にして、一時的な認証情報を使うようにする必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Lambda 関数で IAM ユーザーのアクセスキーを 90 日ごとに作り直し、新しいキーを AWS Secrets Manager 経由で各サーバーに配布する。アプリケーションは、起動時にキーを取得するよう変更する。","Amazon Cognito ID プールで認証されていないアクセスを有効にし、S3 への書き込みを許可する IAM ロールを割り当てる。サーバーは ID プールから一時的な認証情報を取得する。","AWS IAM Identity Center にサーバーごとのユーザーを作成し、各サーバーで AWS CLI の SSO ログインを定期的に実行する。取得した認証情報をアプリケーションに渡す。","社内 CA を信頼アンカーとして IAM Roles Anywhere に登録し、S3 への書き込みを許可する IAM ロールとプロファイルを作成する。サーバーでは認証情報ヘルパーを設定し、証明書で一時的な認証情報を取得する。"],"answer":[3],"why":["キーは定期的に変わるが、長期的な認証情報であることに変わりはない。ローテーションの仕組みと配布の運用が増え、アプリケーションの変更も必要になる。","認証されていないアクセスを許可すると、誰でも S3 に書き込める認証情報を取得できてしまう。サーバーを識別する仕組みにもなっていない。","SSO ログインはユーザーが対話的に認証する用途のもので、無人のバッチ処理には向かない。サーバーごとにユーザーを作る運用負荷も大きい。","Roles Anywhere は、X.509 証明書で認証した AWS 外のワークロードに、IAM ロールの一時的な認証情報を渡す。配布済みの証明書を使えるため、長期的な認証情報は不要になり、変更は認証情報の取得部分だけで済む。"],"explain":"「オンプレミス」「社内 CA の証明書が配布済み」「長期的な認証情報をやめる」から、IAM Roles Anywhere を選ぶ。信頼アンカーに CA を登録し、ロールの信頼ポリシーで rolesanywhere.amazonaws.com を許可する。サーバーでは認証情報ヘルパーが証明書で署名し、一時的な認証情報を取得する。AWS SDK からは、プロセス認証情報として使える。","point":"AWS 外のサーバーが証明書で IAM ロールの一時的な認証情報を得るなら IAM Roles Anywhere（信頼アンカー＋プロファイル）。","diagram":{"caption":"正解の構成: 証明書で署名して IAM ロールの一時認証情報を得る","cols":4,"rows":1,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":1,"h":1}],"nodes":[{"id":"server","label":"バッチサーバー","sub":"社内 CA の証明書","kind":"onprem","c":0,"r":0},{"id":"ra","label":"Roles Anywhere","sub":"信頼アンカーを登録","kind":"security","c":1,"r":0},{"id":"role","label":"IAM ロール","sub":"一時的な認証情報","kind":"security","c":2,"r":0},{"id":"s3","label":"S3 バケット","sub":"データの保存先","kind":"storage","c":3,"r":0}],"edges":[{"from":"server","to":"ra","label":"証明書で署名"},{"from":"ra","to":"role","label":"ロールの引受"},{"from":"role","to":"s3","label":"アップロード"}]}},{"id":"d1-41","domain":1,"topic":"IAM","type":"single","stem":"ある SaaS 事業者は、顧客の AWS アカウントの使用状況を分析するサービスを提供しており、顧客のアカウントに作成された IAM ロールを引き受けて、読み取り専用の情報を取得します。顧客は数百社に増えています。事業者は、ある顧客が他の顧客のロール ARN を推測して登録しても、他の顧客のアカウントにはアクセスできないようにしたいと考えています。顧客に長期的な認証情報を発行させることはできません。これらの要件を満たすソリューションはどれですか。","choices":["顧客ごとに IAM ユーザーを作成してもらい、読み取り専用のポリシーを付与する。アクセスキーを事業者の AWS Secrets Manager に顧客ごとに保存する。","顧客ごとに一意の外部 ID を事業者が発行する。顧客は、事業者のアカウントを信頼し、sts:ExternalId 条件に外部 ID を指定した信頼ポリシーをロールに設定する。事業者は AssumeRole の呼び出しで外部 ID を指定する。","顧客のロールの信頼ポリシーで、事業者のアカウントのルートをプリンシパルに指定する。事業者側の IAM ポリシーで、顧客ごとのロール ARN だけに sts:AssumeRole を許可する。外部 ID は使わず、顧客がロール ARN を事業者の画面に登録する運用にする。","顧客のロールの信頼ポリシーで、事業者のアカウントを信頼し、事業者のサービスの送信元 IP アドレスを aws:SourceIp 条件で指定する。外部 ID は使わない。"],"answer":[1],"why":["アクセスキーは長期的な認証情報であり、発行できないという条件に反する。顧客ごとのキーの管理とローテーションの負荷も大きい。","外部 ID は事業者が顧客ごとに発行する一意の値で、ロールの引き受け時に必要になる。顧客は他の顧客の外部 ID を知らないため、他の顧客のロールを引き受けさせる攻撃（混乱した代理問題）を防げる。","事業者のアカウントを信頼しているだけでは、顧客が他の顧客のロール ARN を登録した場合に、事業者がそのロールを引き受けてしまう。ロール ARN は秘密情報ではない。","送信元 IP アドレスは全顧客で共通であり、顧客を区別できない。他の顧客のロール ARN を指定された場合も、事業者のサービスからのリクエストとして許可されてしまう。"],"explain":"「第三者の SaaS が顧客のロールを引き受ける」「他の顧客のロール ARN を推測されても防ぎたい」という状況は、混乱した代理問題の典型で、外部 ID（sts:ExternalId）で対処する。外部 ID は顧客ごとに一意で、事業者が発行し、顧客が信頼ポリシーに設定する。事業者は AssumeRole で顧客に対応する外部 ID を渡す。STS で得る認証情報は一時的なので、長期的な認証情報の要件も満たす。","point":"第三者に自アカウントのロールを引き受けさせるときは、信頼ポリシーに sts:ExternalId 条件を付ける。混乱した代理問題の対策になる。","diagram":{"caption":"正解の構成: 顧客ごとの外部 ID を付けて AssumeRole する","cols":4,"rows":1,"groups":[{"label":"事業者アカウント","kind":"account","c":0,"r":0,"w":1,"h":1},{"label":"顧客アカウント","kind":"account","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"saas","label":"SaaS アプリ","sub":"外部 ID を指定","kind":"compute","c":0,"r":0},{"id":"sts","label":"AWS STS","sub":"外部 ID を検証","kind":"security","c":1,"r":0},{"id":"role","label":"IAM ロール","sub":"ExternalId 条件","kind":"security","c":2,"r":0},{"id":"res","label":"顧客のリソース","sub":"読み取り専用","kind":"management","c":3,"r":0}],"edges":[{"from":"saas","to":"sts","label":"AssumeRole"},{"from":"sts","to":"role","label":"一時認証情報"},{"from":"role","to":"res","label":"読み取り"}]}},{"id":"d1-42","domain":1,"topic":"Organizations","type":"single","stem":"ある企業は、AWS Organizations で 30 個のメンバーアカウントを管理しています。セキュリティポリシーの改定により、メンバーアカウントのルートユーザーを日常の操作に使うことが禁止されました。メンバーアカウントの管理者が IAM ポリシーを変更しても、この制限を解除できないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["組織のルートまたは対象の OU に、aws:PrincipalArn 条件がルートユーザーに一致する場合にすべてのアクションを拒否する SCP をアタッチする。","各メンバーアカウントのルートユーザーに、すべてのアクションを拒否する IAM ポリシーをアタッチする。ポリシーの変更は、管理者にも許可しない。","各メンバーアカウントのルートユーザーのアクセスキーを削除し、ハードウェア MFA デバイスを設定する。MFA デバイスは、セキュリティチームが保管する。","管理アカウントで、ルートユーザーのアクションを拒否するアクセス許可の境界を作成し、各メンバーアカウントのルートユーザーに設定する。"],"answer":[0],"why":["SCP は、メンバーアカウントのルートユーザーを含むすべてのプリンシパルに適用される。メンバーアカウント側の管理者は SCP を変更できないため、制限を解除できない。","ルートユーザーには IAM ポリシーをアタッチできない。ルートユーザーのアクセスは、IAM ポリシーでは制限できない。","認証を強化できても、ルートユーザーの利用そのものを禁止することにはならない。MFA の保管者がサインインすれば、通常どおり操作できてしまう。","アクセス許可の境界は、IAM ユーザーと IAM ロールにだけ設定できる。ルートユーザーには設定できず、効果もない。"],"explain":"「ルートユーザーの操作を禁止」「メンバーアカウントの管理者が解除できない」から、SCP を使う。IAM ポリシーやアクセス許可の境界はルートユーザーには使えないが、SCP はメンバーアカウントのルートユーザーにも効く。なお、SCP は管理アカウントのユーザー・ロールには適用されない点に注意する。","point":"メンバーアカウントのルートユーザーを制限できるのは SCP だけ。IAM ポリシーや境界は効かず、管理アカウントにも SCP は効かない。","diagram":null},{"id":"d1-43","domain":1,"topic":"Organizations","type":"single","stem":"ある企業は、AWS Organizations で 80 個のアカウントを管理しており、すべてのアカウントで Amazon GuardDuty を有効にしたいと考えています。セキュリティチームは、専用のセキュリティアカウントで検出結果を一元的に確認します。今後作成するアカウントでも、自動的に GuardDuty が有効になる必要があります。セキュリティチームは、管理アカウントにはサインインしない運用にします。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各メンバーアカウントで GuardDuty を有効にし、セキュリティアカウントからのメンバー招待を承諾する。新しいアカウントが作成されるたびに、同じ手順を繰り返す。","管理アカウントで GuardDuty を有効にして、管理アカウントを GuardDuty の管理者として使う。検出結果を確認するセキュリティチームに、管理アカウントへのアクセスを許可する。","管理アカウントで、セキュリティアカウントを GuardDuty の委任管理者に指定する。セキュリティアカウントで、組織の既存アカウントと新規アカウントで GuardDuty を自動的に有効にする設定を行う。","AWS CloudFormation StackSets で、GuardDuty の検出器を作成するテンプレートを組織のすべてのアカウントにデプロイする。検出結果は、各アカウントのコンソールで確認する。新しいアカウントが作成されたときは、スタックセットを追加で展開する。"],"answer":[2],"why":["動作はするが、アカウントごとの有効化と招待の承諾が必要で、新規アカウントのたびに手作業が発生する。運用上のオーバーヘッドが大きい。","セキュリティチームが管理アカウントにアクセスする運用になり、管理アカウントにはサインインしないという前提に反する。管理アカウントのアクセスは最小限にするのが望ましい。","委任管理者を指定すると、セキュリティアカウントから組織全体の GuardDuty を管理できる。新規アカウントも自動で有効にでき、管理アカウントを日常的に使わずに済む。","検出器は作成できるが、検出結果が各アカウントに分散し、一元的な確認ができない。管理者とメンバーの関係も設定できない。"],"explain":"「Organizations 全体で有効化」「セキュリティ専用アカウントで一元管理」「管理アカウントは使わない」「新規アカウントも自動」から、委任管理者を使う。GuardDuty のほか、Security Hub や Amazon Inspector など多くのセキュリティサービスが、委任管理者を指定して組織全体を管理できる。","point":"セキュリティサービスの組織管理は、委任管理者に専用アカウントを指定し、自動有効化を設定する。管理アカウントは使わない。","diagram":{"caption":"正解の構成: 委任管理者のセキュリティアカウントで全アカウントを管理する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"mgmt","label":"管理アカウント","sub":"委任管理者を指定","kind":"management","c":0,"r":0},{"id":"sec","label":"セキュリティ用","sub":"GuardDuty 管理者","kind":"security","c":1,"r":0},{"id":"mem","label":"メンバー","sub":"自動で有効化","kind":"compute","c":2,"r":0}],"edges":[{"from":"mgmt","to":"sec","label":"指定"},{"from":"sec","to":"mem","label":"自動有効化"}]}},{"id":"d1-44","domain":1,"topic":"Organizations","type":"single","stem":"ある企業は、AWS Organizations で 60 個のアカウントを管理しています。コスト配分のために CostCenter タグを使っていますが、アカウントごとに costcenter や CostCentre のように表記が異なり、集計できません。この企業は、組織全体でタグのキーの表記と許可する値を統一し、準拠していないリソースを一覧で確認できるようにしたいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各アカウントに AWS Config の required-tags マネージドルールをデプロイし、CostCenter タグがないリソースを非準拠にする。非準拠のリソースは、アカウントごとに確認する。","組織のルートに、aws:RequestTag/CostCenter 条件が付いていない作成リクエストを拒否する SCP をアタッチする。拒否されたリクエストは、CloudTrail で確認する。","AWS Lambda 関数を定期的に実行し、全アカウントのリソースからタグを取得する。表記が異なるタグを見つけたら、正しい表記のタグに書き換える。","AWS Organizations でタグポリシーを作成し、CostCenter のキーの表記と許可する値を定義して、組織のルートにアタッチする。準拠状況のレポートで、準拠していないリソースを確認する。"],"answer":[3],"why":["ルールはタグの有無や値を検査するが、キーの大文字小文字などの表記ゆれの統一には向かない。アカウントごとにデプロイして確認する運用負荷もある。","SCP は作成リクエストを拒否するだけで、キーの表記を統一したり、既存のリソースの準拠状況を一覧にしたりはできない。タグ付けに対応しないサービスの操作まで拒否するおそれがある。","自作の仕組みは、複数アカウントでの権限設定、対象サービスへの対応、エラー処理などの運用が必要になる。マネージドな機能で解決できる。","タグポリシーは、組織全体でタグのキーの表記と許可する値を標準化できる。準拠状況のレポートで、準拠していないリソースを組織単位で確認できる。"],"explain":"「タグのキーの表記ゆれの統一」「許可する値を定義」「組織全体」「準拠状況の一覧」から、AWS Organizations のタグポリシーを選ぶ。ルートか OU にアタッチして、配下のアカウントに適用する。準拠状況レポートで、非準拠のリソースを確認できる。強制設定を有効にすると、対応するリソースタイプでは非準拠のタグ付けを防げる。","point":"タグの表記・値の標準化はタグポリシー。準拠状況はレポートで確認し、対応するリソースでは強制もできる。","diagram":null},{"id":"d1-45","domain":1,"topic":"Cognito","type":"single","stem":"ある企業は、取引先企業の従業員向けに、Amazon API Gateway と AWS Lambda で構築した発注ポータルを公開します。取引先の従業員は、それぞれ自社の SAML 2.0 に対応した IdP でサインインしており、この企業は取引先の従業員用の ID とパスワードを新たに管理したくありません。API は、サインインした利用者だけが呼び出せるようにする必要があります。運用上のオーバーヘッドを最小限にするソリューションはどれですか。","choices":["Amazon Cognito ユーザープールに取引先の従業員のユーザーを作成し、初期パスワードを取引先に配布する。API Gateway の REST API に Cognito ユーザープールオーソライザーを設定する。","Cognito ユーザープールに、取引先ごとの SAML IdP を追加し、ホストされた UI でフェデレーションサインインを有効にする。API Gateway の REST API に Cognito ユーザープールオーソライザーを設定し、トークンを検証させる。","取引先ごとに IAM の SAML プロバイダーと IAM ロールを作成し、従業員が AWS マネジメントコンソールにサインインしてから API を呼び出すようにする。","Lambda オーソライザーを作成し、取引先の IdP から受け取った SAML アサーションを検証するコードを実装する。API Gateway の REST API にこのオーソライザーを設定する。取引先が増えるたびに、検証の設定とコードを更新する。"],"answer":[1],"why":["ユーザーの作成とパスワードの配布が必要で、取引先の従業員の ID を新たに管理したくないという要件に反する。入退社の反映も手作業になる。","ユーザープールは SAML IdP とのフェデレーションに対応しており、サインイン後に JSON ウェブトークン（JWT）を発行する。API Gateway はマネージドなオーソライザーでトークンを検証できる。","IAM の SAML プロバイダーは AWS アカウントの管理用アクセスのための仕組みで、一般の利用者向けアプリには向かない。従業員にコンソールへのサインインを求めるのも不適切である。","動作はするが、アサーションの検証やセッション管理を自前で実装・保守することになる。マネージドな機能で実現できるため、運用負荷が大きい。"],"explain":"「取引先の SAML IdP でサインイン」「ID を自社で管理しない」「API を認証済みの利用者だけに限定」から、Cognito ユーザープールの SAML フェデレーションと、API Gateway の Cognito ユーザープールオーソライザーを組み合わせる。ユーザープールが IdP の違いを吸収し、アプリや API は常に同じ形式のトークンだけを扱えばよい。","point":"外部 IdP（SAML・OIDC・ソーシャル）でのサインインは Cognito ユーザープールのフェデレーション。API は Cognito オーソライザーで保護する。","diagram":{"caption":"正解の構成: SAML IdP と連携したユーザープールのトークンで保護","cols":4,"rows":2,"groups":[],"nodes":[{"id":"user","label":"取引先の従業員","sub":"ブラウザー","kind":"client","c":0,"r":0},{"id":"pool","label":"ユーザープール","sub":"Cognito","kind":"security","c":1,"r":0},{"id":"idp","label":"取引先の IdP","sub":"SAML 2.0","kind":"client","c":1,"r":1},{"id":"api","label":"API Gateway","sub":"ユーザープール認証","kind":"network","c":2,"r":0},{"id":"fn","label":"Lambda 関数","sub":"発注の処理","kind":"serverless","c":3,"r":0}],"edges":[{"from":"user","to":"pool","label":"サインイン"},{"from":"idp","to":"pool","label":"SAML 認証"},{"from":"pool","to":"api","label":"トークン検証"},{"from":"api","to":"fn"}]}},{"id":"d1-46","domain":1,"topic":"Cognito","type":"single","stem":"ある企業は、社員向けのモバイルアプリで、Amazon Cognito ユーザープールを使ってサインインを提供しています。ユーザープールではセルフサインアップを有効にしていますが、社員だけが登録できるように、メールアドレスのドメインが自社のドメインであるユーザーのみ登録を許可する必要があります。アプリを経由せず、Cognito の API を直接呼び出した場合も、同じ制限が働く必要があります。運用上のオーバーヘッドを最小限にするソリューションはどれですか。","choices":["ユーザー登録後の確認後トリガーに AWS Lambda 関数を設定する。関数でメールアドレスのドメインを調べ、自社のドメインでないユーザーをユーザープールから削除する。","アプリのサインアップ画面で、メールアドレスのドメインを検証するコードを実装する。自社のドメインでない場合は、Cognito の API を呼び出さないようにする。","ユーザー登録前のトリガーに AWS Lambda 関数を設定する。関数でメールアドレスのドメインを調べ、自社のドメインでない場合は例外を返してサインアップを拒否する。","セルフサインアップを無効にする。社員からの依頼を受けて、管理者が AdminCreateUser API で 1 人ずつユーザーを作成し、招待メールを送信する。"],"answer":[2],"why":["確認後トリガーは、ユーザーが作成され確認された後に動く。いったん登録が完了してしまうため、拒否ではなく事後の削除になり、その間は利用できてしまう。","アプリ側の検証は、Cognito の API を直接呼び出せば迂回できる。API を直接呼んでも制限が働くという要件を満たさない。","登録前トリガーは、ユーザーが作成される前に呼び出され、例外を返すとサインアップが拒否される。API を直接呼び出した場合にも働き、コードも少量で済む。","セルフサインアップをやめると、ユーザー作成の依頼を受けて手作業で対応することになる。運用上のオーバーヘッドが大きい。"],"explain":"「サインアップ時にドメインで制限」「API を直接呼んでも制限」「運用負荷を最小」から、ユーザープールの Lambda トリガーのうち、ユーザー登録前（Pre sign-up）を使う。このトリガーで、サインアップを拒否したり、自動確認したりといった制御ができる。確認後トリガーは、登録が完了した後の処理（ウェルカムメールなど）に使う。","point":"サインアップの可否を制御するのは Cognito の登録前（Pre sign-up）Lambda トリガー。アプリ側の検証だけでは迂回される。","diagram":null},{"id":"d1-47","domain":1,"topic":"シークレット管理","type":"single","stem":"ある企業は、Amazon EC2 インスタンスで実行されるアプリケーションの設定値を、環境ごとに約 300 個管理しています。このうち、外部 API のキーなど約 20 個は機密情報で、保存時に暗号化し、アクセスを IAM ポリシーで制御する必要があります。これらの値の自動ローテーションは必要ありません。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Systems Manager Parameter Store の標準パラメータを使う。機密情報は SecureString として AWS KMS のキーで暗号化し、階層パスごとに IAM ポリシーでアクセスを制御する。","すべての設定値を、AWS Secrets Manager のシークレットとして保存する。シークレットごとに IAM ポリシーでアクセスを制御し、アプリケーションが起動時に取得する。機密でない設定値も同じ方法でシークレットとして扱う。","Parameter Store の高度なパラメータを使い、すべての設定値を SecureString として AWS KMS のキーで暗号化する。階層パスごとに IAM ポリシーでアクセスを制御する。","設定値を JSON ファイルにまとめ、AWS KMS のキーで暗号化した状態で Amazon S3 バケットに保存する。インスタンスの起動時にダウンロードして復号する処理を実装する。設定値を更新するたびに、ファイルを作り直してアップロードする。"],"answer":[0],"why":["標準パラメータは追加料金がかからず、SecureString で KMS による暗号化もできる。階層パスと IAM ポリシーでアクセス制御もでき、ローテーションが不要なら十分である。","Secrets Manager はシークレット単位の月額料金がかかる。ローテーションが不要で、大半が機密でない設定値なら、必要以上にコストが高くなる。","高度なパラメータは料金がかかり、標準パラメータの上限を超える場合に使う。今回の用途では、標準パラメータで足りるためコストが無駄になる。","取得・復号・更新の仕組みを自前で実装することになり、運用負荷が大きい。値ごとのアクセス制御もしにくい。"],"explain":"「設定値が多い」「機密情報は一部」「ローテーション不要」「最も費用対効果が高い」から、Parameter Store の標準パラメータを選ぶ。自動ローテーションや、クロスアカウントでの共有、組み込みのレプリケーションが必要なら、Secrets Manager を選ぶ。使い分けは、機能が必要か、コストを抑えたいかで決まる。","point":"ローテーション不要で安く暗号化して持つなら Parameter Store（標準・SecureString）。自動ローテーションが要るなら Secrets Manager。","diagram":null},{"id":"d1-48","domain":1,"topic":"シークレット管理","type":"multi","stem":"ある企業は、アカウント A の AWS Secrets Manager に、外部 API の認証情報をシークレットとして保存しています。アカウント B で実行される AWS Lambda 関数から、このシークレットを参照できるようにする必要があります。シークレットは 1 か所で管理し、シークレットの値のコピーは作成しません。これらの要件を満たす手順の組み合わせはどれですか。","choices":["シークレットを AWS マネージドキーの aws/secretsmanager で暗号化したまま、アカウント B の Lambda 実行ロールに secretsmanager:GetSecretValue を許可する。","シークレットにリソースベースのポリシーをアタッチし、アカウント B の Lambda 実行ロールに secretsmanager:GetSecretValue を許可する。実行ロールの IAM ポリシーでも同じ操作を許可する。","Secrets Manager のレプリケーション機能を使い、アカウント B にシークレットのレプリカを作成する。Lambda 関数はレプリカを参照する。","シークレットをカスタマーマネージドキーで暗号化し、キーポリシーでアカウント B の Lambda 実行ロールに kms:Decrypt を許可する。実行ロールの IAM ポリシーでも許可する。","シークレットの値をアカウント B の Lambda 関数の環境変数に設定する。値が変わったら、環境変数を手動で更新する。"],"answer":[1,3],"why":["AWS マネージドキーのキーポリシーは変更できず、別アカウントには共有できない。このため、別アカウントのロールはシークレットを復号できない。","別アカウントからシークレットを使うには、シークレット側のリソースベースのポリシーと、呼び出す側の IAM ポリシーの両方で許可する必要がある。","レプリケーションは、同じアカウント内の別リージョンにシークレットを複製する機能で、別アカウントへの共有には使えない。コピーを作らないという要件にも反する。","シークレットを別アカウントから使うには、暗号化のキーも共有する必要がある。カスタマーマネージドキーなら、キーポリシーで別アカウントのロールに復号を許可できる。","値のコピーを作ることになり、要件に反する。ローテーションで値が変わるたびに手作業が発生し、環境変数に平文で残る点も問題である。"],"explain":"別アカウントの Secrets Manager のシークレットを使うには、シークレットのリソースベースのポリシーによる許可と、暗号化キーの共有が必要になる。キーは AWS マネージドキーでは共有できないため、カスタマーマネージドキーを使い、キーポリシーで許可する。呼び出す側のロールの IAM ポリシーも忘れずに許可する。","point":"シークレットのクロスアカウント参照は、リソースポリシー＋カスタマーマネージドキーのキーポリシー。aws/secretsmanager は共有できない。","diagram":{"caption":"正解の構成: リソースポリシーとキーポリシーで相手のロールを許可する","cols":2,"rows":2,"groups":[{"label":"アカウント B","kind":"account","c":0,"r":0,"w":1,"h":1},{"label":"アカウント A","kind":"account","c":1,"r":0,"w":1,"h":2}],"nodes":[{"id":"role","label":"Lambda ロール","sub":"GetSecretValue","kind":"serverless","c":0,"r":0},{"id":"secret","label":"シークレット","sub":"リソースポリシー付き","kind":"security","c":1,"r":0},{"id":"kms","label":"KMS キー","sub":"カスタマーマネージド","kind":"security","c":1,"r":1}],"edges":[{"from":"role","to":"secret","label":"取得"},{"from":"role","to":"kms","label":"Decrypt"}]}},{"domain":1,"id":"d1-49","topic":"KMS・暗号化","type":"single","stem":"ある企業は、東京リージョンと大阪リージョンの Amazon S3 バケットに、機密性の高い設計データを保存しています。データはアプリケーションが AWS Encryption SDK でクライアント側暗号化してからアップロードしており、東京のバケットから大阪のバケットへ S3 レプリケーションで複製しています。災害対策の要件として、東京リージョンが利用できない場合でも、大阪リージョンのアプリケーションが、再暗号化することなく複製されたデータを復号できる必要があります。運用上のオーバーヘッドを最小限に抑えてこの要件を満たすソリューションはどれですか。","choices":["東京リージョンで KMS のカスタマーマネージドキーを作成する。大阪のアプリケーションは、東京リージョンの KMS エンドポイントに Decrypt API を呼び出し、データキーを復号する。","大阪リージョンに別のカスタマーマネージドキーを作成する。東京のキーで暗号化されたデータキーを、バッチ処理で大阪のキーに再暗号化し、データのメタデータとともに大阪のバケットに保管する。","東京リージョンで KMS のマルチリージョンキーを作成し、大阪リージョンにレプリカキーを作成する。アプリケーションは各リージョンのキーでデータキーを扱う。","共通の暗号鍵を AWS Secrets Manager のシークレットに保存し、大阪リージョンにもレプリカを作成する。アプリケーションはその鍵を取得して、データを暗号化・復号する。"],"answer":[2],"why":["復号のたびに東京リージョンの KMS に依存するため、東京リージョンが利用できない状況では復号できない。可用性の要件を満たさない。","動作はするが、データキーの再暗号化バッチを作って運用する負荷が大きい。複製の遅延や失敗の管理も必要になる。","マルチリージョンキーは、リージョンをまたいで同じキー ID とキーマテリアルを持つ。東京で暗号化したデータキーを、大阪のレプリカキーでそのまま復号できる。","鍵そのものをアプリケーションが取り扱うことになり、KMS による鍵の保護や使用ログの管理が失われる。鍵管理の運用負荷も増える。"],"explain":"「リージョン障害でも復号できる」「再暗号化しない」「運用負荷を最小に」がそろったら、KMS のマルチリージョンキーを選ぶ。プライマリキーとレプリカキーは同じキー ID とキーマテリアルを共有するため、一方のリージョンで暗号化したデータを、他方のリージョンのキーで復号できる。ただし、キーポリシーやローテーションの設定はレプリカごとに管理する点に注意する。","point":"リージョン間で再暗号化なしに復号したいなら KMS マルチリージョンキー。キー ID（mrk- で始まる）とキーマテリアルが共通になる。","diagram":{"caption":"正解の構成: マルチリージョンキーのレプリカで大阪でも復号する","cols":2,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":1,"h":2},{"label":"大阪リージョン","kind":"region","c":1,"r":0,"w":1,"h":2}],"nodes":[{"id":"kt","label":"プライマリキー","sub":"マルチリージョンキー","kind":"security","c":0,"r":0},{"id":"ko","label":"レプリカキー","sub":"同じキーマテリアル","kind":"security","c":1,"r":0},{"id":"st","label":"S3 (東京)","sub":"暗号文を保存","kind":"storage","c":0,"r":1},{"id":"so","label":"S3 (大阪)","sub":"暗号文の複製","kind":"storage","c":1,"r":1}],"edges":[{"from":"kt","to":"ko","label":"レプリカ作成","style":"dashed"},{"from":"st","to":"so","label":"S3 複製","style":"dashed"},{"from":"so","to":"ko","label":"復号"}]}},{"domain":1,"id":"d1-50","topic":"KMS・暗号化","type":"multi","stem":"ある企業は、アカウント A の Amazon S3 バケットに保存したレポートを、取引先が運用するアカウント B の IAM ロールから読み取れるようにしています。バケットポリシーでは、アカウント B のロールに s3:GetObject がすでに許可されています。しかし、バケットのオブジェクトはカスタマーマネージドキーによる SSE-KMS で暗号化されており、アカウント B のロールが GetObject を呼び出すと AccessDenied のエラーになります。既存のオブジェクトを再暗号化せずに、この問題を解決する手順の組み合わせはどれですか。","choices":["アカウント A の KMS キーのキーポリシーで、アカウント B のロール（またはアカウント B）に kms:Decrypt を許可する。","オブジェクトの暗号化に使われている AWS マネージドキー（aws/s3）のキーポリシーに、アカウント B のロールを追加する。","アカウント B で新しい KMS キーを作成し、アカウント A のバケットのデフォルト暗号化に指定する。","アカウント A の S3 バケットポリシーに、アカウント B のロールが kms:Decrypt を呼び出すことを許可するステートメントを追加する。","アカウント B のロールの IAM ポリシーで、アカウント A のキーの ARN に対する kms:Decrypt を許可する。"],"answer":[0,4],"why":["別のアカウントのプリンシパルに KMS キーを使わせるには、キーを持つアカウント側のキーポリシーでの許可が必要になる。","AWS マネージドキーのキーポリシーは編集できず、別のアカウントとも共有できない。ここで使われているのはカスタマーマネージドキーでもある。","デフォルト暗号化の変更は、新しくアップロードするオブジェクトにしか影響しない。既存のオブジェクトは元のキーで暗号化されたままになる。","バケットポリシーで許可できるのは S3 の操作だけで、KMS キーの使用は許可できない。KMS の権限はキーポリシーと IAM ポリシーで与える。","別のアカウントのキーを使う場合は、キーポリシーでの許可に加えて、呼び出す側のアカウントの IAM ポリシーでも、そのキーに対する操作を許可する必要がある。"],"explain":"S3 の許可（バケットポリシー）は済んでいるので、残るのは KMS 側の許可。別のアカウントのキーを使うには、キーを持つアカウントのキーポリシーと、使う側のアカウントの IAM ポリシーの両方で許可する。AWS マネージドキーは共有できないため、アカウントをまたいで共有したい場合はカスタマーマネージドキーを使う。","point":"クロスアカウントの KMS キー利用は、キーポリシー（キー側）と IAM ポリシー（利用側）の両方が必要。AWS マネージドキーは共有できない。","diagram":{"caption":"正解の構成: キーポリシーと IAM ポリシーの両方で kms:Decrypt を許可","cols":2,"rows":2,"groups":[{"label":"アカウント B","kind":"account","c":0,"r":0,"w":1,"h":2},{"label":"アカウント A","kind":"account","c":1,"r":0,"w":1,"h":2}],"nodes":[{"id":"role","label":"IAM ロール","sub":"IAM ポリシーで許可","kind":"security","c":0,"r":0},{"id":"s3","label":"S3 バケット","sub":"SSE-KMS で暗号化","kind":"storage","c":1,"r":0},{"id":"kms","label":"KMS キー","sub":"キーポリシーで許可","kind":"security","c":1,"r":1}],"edges":[{"from":"role","to":"s3","label":"GetObject"},{"from":"role","to":"kms","label":"Decrypt"},{"from":"s3","to":"kms","label":"データキー","style":"dashed"}]}},{"domain":1,"id":"d1-51","topic":"KMS・暗号化","type":"single","stem":"ある政府関連の機関は、Amazon S3 に保存する調査データについて、セキュリティ基準により「サーバー側で 2 層の暗号化を適用し、暗号化キーの使用状況を監査できる」ことが求められています。暗号化キーは AWS KMS のカスタマーマネージドキーで管理します。この機関は、アプリケーションのコードを変更せず、運用上のオーバーヘッドを最小限にしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["バケットのデフォルト暗号化に、カスタマーマネージドキーを指定した DSSE-KMS（KMS キーによる二層式のサーバー側の暗号化）を設定する。","アプリケーションで AWS Encryption SDK を使ってデータを暗号化してからアップロードし、バケットのデフォルト暗号化に SSE-KMS を設定する。","バケットのデフォルト暗号化に、カスタマーマネージドキーを指定した SSE-KMS を設定し、S3 バケットキーを有効にする。","バケットのデフォルト暗号化に SSE-S3 を設定し、バケットポリシーで SSE-KMS を指定していないアップロードを拒否する。"],"answer":[0],"why":["DSSE-KMS は、KMS のキーで 2 層のサーバー側暗号化を適用する。キーの使用は CloudTrail に記録され、アプリケーションの変更も不要になる。","2 層にはなるが、クライアント側暗号化のためにアプリケーションの改修と鍵の取り扱いが必要になる。要件の「コードを変更しない」を満たさない。","暗号化は 1 層のままで、「2 層の暗号化」の要件を満たさない。S3 バケットキーは KMS へのリクエスト数を減らす機能で、層は増えない。","SSE-S3 は S3 が管理するキーを使い、KMS のカスタマーマネージドキーによる管理や使用状況の監査にならない。暗号化も 1 層で、2 つの設定が矛盾している。"],"explain":"「サーバー側で 2 層」「KMS のキーで管理・監査」「コード変更なし」から DSSE-KMS を選ぶ。DSSE-KMS は、S3 側で暗号化を 2 回重ねて適用する方式で、規制で多層の暗号化を求められる場合に使う。SSE-KMS は 1 層のため、この要件には足りない。","point":"サーバー側で 2 層の暗号化を求められたら DSSE-KMS。SSE-S3・SSE-KMS・SSE-C はいずれも 1 層。","diagram":null},{"domain":1,"id":"d1-52","topic":"KMS・暗号化","type":"single","stem":"ある企業は、サービスの終了に伴い、AWS KMS のカスタマーマネージドキー 1 つを削除しようとしています。このキーで暗号化されたデータが、まだどこかに残っている可能性があります。キーを削除してしまうと暗号化されたデータは二度と復号できなくなるため、セキュリティチームは、誤って削除した場合に取り消せる安全策を求めています。また、削除をスケジュールしたあとにキーを使おうとする動きがあれば、検知できるようにする必要があります。これらの要件を満たす方法はどれですか。","choices":["KMS コンソールでキーを即時に削除する。問題が起きた場合は、同じエイリアスと設定でキーを再作成し、データを復号できるようにする。","キーを無効にしたまま残し、削除はしない。キーの月額料金は、サービスの終了後もコストとして許容し、定期的に状態を確認する。","キーポリシーですべてのプリンシパルに対する kms:* を拒否する。問題が起きた場合は、ルートユーザーでキーポリシーを書き換えて元に戻す。","キーの削除を待機期間 30 日でスケジュールする。CloudTrail のログから使用の試行を検知する CloudWatch アラームを作成し、検知したら削除をキャンセルする。"],"answer":[3],"why":["KMS のキーは、再作成しても元のキーマテリアルは戻らない。同じエイリアスをつけても別のキーであり、データは復号できない。","データは守れるが、キーを削除するという目的を満たせない。不要なキーが管理対象に残り続ける。","運用上のリスクが高く、本来の削除の手順でもない。キーを削除する目的も果たせず、取り消せる安全策としては不十分。","削除保留中のキーは使用できず、待機期間（7〜30 日）のあいだは削除をキャンセルできる。保留中に使用を試みた記録を検知するアラームを設定すれば、必要なデータが残っていたことに気づける。"],"explain":"KMS のキーの削除は、すぐには実行されず、7〜30 日の待機期間を置くしくみになっている。待機中のキーは「削除保留中」の状態で、暗号化・復号には使えないが、キャンセルすれば元に戻せる。この状態でキーを使おうとする動きを CloudTrail と CloudWatch アラームで検知すれば、削除してよいかを実際の利用状況から確認できる。","point":"KMS キーの削除は待機期間（7〜30 日）つき。保留中は使用不可でキャンセル可能。使用の試行を CloudWatch アラームで検知してから確定する。","diagram":null},{"domain":1,"id":"d1-53","topic":"S3","type":"multi","stem":"ある企業は、AWS Organizations で 60 個のアカウントを管理しています。過去に、開発者がバケットポリシーやオブジェクトの ACL を誤って設定し、Amazon S3 のデータが公開された事例がありました。セキュリティチームは、バケットポリシーや ACL の設定にかかわらず、組織内のすべてのアカウントで S3 のデータがパブリックに公開されない状態を保証したいと考えています。さらに、開発者がこの保護を自分で無効にできないようにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["開発者向けの手順書に、バケットの作成時に「ブロックパブリックアクセス」を有効にすることを明記し、全チームに周知する。","すべてのメンバーアカウントで、アカウントレベルの S3 ブロックパブリックアクセスの 4 つの設定をすべて有効にする。","IAM Access Analyzer for S3 を有効にし、パブリックアクセスを許可しているバケットが検出されるたびに、担当者が手動で設定を修正する。","すべてのバケットのオブジェクトの所有者を「バケット所有者の強制」に設定して、ACL を無効にする。","SCP で、s3:PutAccountPublicAccessBlock と s3:PutBucketPublicAccessBlock の実行を、セキュリティ管理者のロール以外に対して拒否する。"],"answer":[1,4],"why":["手順書の周知は統制にならず、設定漏れや誤りを防げない。強制力のある設定が要件になっている。","アカウントレベルの設定は、そのアカウントのすべてのバケットに適用され、バケットポリシーや ACL でパブリックアクセスを許可しても上書きされる。設定漏れのあるバケットも保護できる。","検出するだけの仕組みで、公開を防げない。検出から修正までのあいだ、データは公開されたままになる。","ACL は無効になるが、バケットポリシーによる公開は防げない。要件の「バケットポリシーにかかわらず」を満たさない。","SCP でブロックパブリックアクセスの設定変更 API を拒否すれば、開発者が保護を無効にできなくなる。設定する側と変更を制限する側を分けるのが定石。"],"explain":"S3 ブロックパブリックアクセスを、アカウントレベルですべて有効にすると、バケットポリシーや ACL の設定にかかわらずパブリックアクセスを防げる。ただし、アカウント内の権限があれば無効にできてしまうため、SCP で設定を変更する API を拒否して固定する。検出のみの仕組みや手順書は、防止の要件を満たさない。","point":"公開の防止はアカウントレベルのブロックパブリックアクセス、無効化の防止は SCP。Access Analyzer は検出用。","diagram":null},{"domain":1,"id":"d1-54","topic":"S3","type":"single","stem":"ある企業は、1 つの Amazon S3 バケットにデータレイクを構築しています。分析チーム、機械学習チーム、経理チームがそれぞれ別のプレフィックスのデータを利用します。現在はバケットポリシー 1 つにすべてのチームの許可を書いており、ポリシーが肥大化して変更のたびに影響範囲の確認が必要になっています。この企業は、チームごとにアクセス権限を独立して管理できるようにしたいと考えています。さらに、機械学習チームは特定の VPC 内からだけアクセスできるようにする必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["チームごとにバケットを作成し、S3 レプリケーションでデータを複製する。各バケットのバケットポリシーで、チームごとのアクセスを許可する。","チームごとに S3 アクセスポイントを作成し、プレフィックスごとの権限をポリシーで設定する。機械学習用は VPC を指定し、バケットポリシーで管理を委任する。","チームごとの IAM ユーザーに、プレフィックスを指定したポリシーを付与する。機械学習チームの許可には、aws:SourceIp 条件で VPC の CIDR ブロックを指定する。","チームごとに、必要なオブジェクトの署名付き URL を生成するアプリケーションを開発し、署名付き URL の有効期間は短く設定して配布する。"],"answer":[1],"why":["データの重複保存とレプリケーションのコストが発生し、データの同期遅延も問題になる。権限管理が目的であれば過剰な構成。","アクセスポイントごとに専用のポリシーとネットワークの制限（VPC）を設定でき、バケットポリシーを短く保てる。チーム単位でポリシーを独立して管理できる。","VPC 内のプライベート IP アドレスは aws:SourceIp では評価できないため、VPC の制限にならない。IAM ポリシー側も、チーム数やデータの増加で管理が煩雑になる。","アプリケーションの開発と運用が必要になり、運用負荷が大きい。ネットワークの制限という要件も、署名付き URL だけでは満たせない。"],"explain":"「1 つのバケットを複数チームで共有」「チームごとに独立して権限管理」「特定の VPC からだけ」を満たすのは S3 アクセスポイント。アクセスポイントには専用の名前とポリシーがあり、ネットワークの送信元を VPC に限定できる。バケットポリシーで、同じアカウントのアクセスポイント経由のアクセスにアクセス制御を委任すれば、バケットポリシーを増やさずに済む。","point":"共有バケットのアクセス制御をチーム別に分けるなら S3 アクセスポイント。専用のポリシーと VPC 限定を設定でき、バケットポリシーは委任で短くなる。","diagram":{"caption":"正解の構成: チームごとのアクセスポイントで 1 つのバケットを共有","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":1,"w":2,"h":1}],"nodes":[{"id":"an","label":"分析チーム","sub":"プレフィックス A","kind":"client","c":0,"r":0},{"id":"ml","label":"機械学習チーム","sub":"プレフィックス B","kind":"compute","c":0,"r":1},{"id":"ap1","label":"アクセスポイント","sub":"分析用ポリシー","kind":"network","c":1,"r":0},{"id":"ap2","label":"アクセスポイント","sub":"VPC 限定","kind":"network","c":1,"r":1},{"id":"s3","label":"S3 バケット","sub":"アクセスを委任","kind":"storage","c":2,"r":0}],"edges":[{"from":"an","to":"ap1"},{"from":"ml","to":"ap2"},{"from":"ap1","to":"s3"},{"from":"ap2","to":"s3"}]}},{"domain":1,"id":"d1-55","topic":"S3","type":"single","stem":"ある企業は、取引先のアカウントから提供される売上データを、自社アカウントの Amazon S3 バケットで受け取っています。取引先は、独自のツールで自分のアカウントの認証情報を使い、バケットにファイルをアップロードします。ところが、自社のユーザーがアップロードされたオブジェクトを読み取ろうとすると、バケットの所有者であるにもかかわらずアクセスが拒否されます。取引先のツールは変更できません。セキュリティチームは、今後は取引先がアップロードしたすべてのオブジェクトを自社が所有し、ACL を使わずに権限を管理できるようにしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["バケットの Object Ownership 設定を「バケット所有者の強制」にして ACL を無効にする。バケットポリシーで、取引先のアカウントに s3:PutObject を許可する。","バケットの Object Ownership 設定を「バケット所有者優先」にする。取引先のツールを改修し、アップロード時に bucket-owner-full-control の ACL を指定させる。","バケットポリシーで、自社のユーザーに s3:GetObject を許可し、アクセスを拒否されているオブジェクトにも適用されるようにする。","取引先のアップロードをトリガーに AWS Lambda 関数を起動し、オブジェクトを自社が所有する別のバケットにコピーする。"],"answer":[0],"why":["「バケット所有者の強制」では ACL が無効になり、アップロードされたオブジェクトの所有者が常にバケット所有者になる。取引先側の変更も必要ない。","バケット所有者優先でも、取引先が bucket-owner-full-control の ACL を指定しない限り、所有権は移らない。ツールを変更できない要件に反し、ACL も使い続けることになる。","オブジェクトの所有者は取引先のままのため、バケットポリシーの許可だけではバケット所有者のユーザーに権限を与えられない。","動作はするが、関数の開発と運用が必要で、二重にデータを保存する。設定で解決できる問題を、回避策で対処することになる。"],"explain":"ACL が有効なバケットでは、別のアカウントがアップロードしたオブジェクトの所有者がアップロードしたアカウントになり、バケット所有者でも読み取れない場合がある。Object Ownership を「バケット所有者の強制」にすると ACL が無効になり、すべてのオブジェクトをバケット所有者が所有する。新しいバケットではこれが既定の設定になっている。","point":"別アカウントのアップロードで所有者が食い違う問題は、Object Ownership の「バケット所有者の強制」で解決する。ACL は無効になる。","diagram":null},{"domain":1,"id":"d1-56","topic":"CloudFront","type":"single","stem":"ある動画配信企業は、有料会員だけが視聴できる HLS 形式の動画を、Amazon S3 に保存して Amazon CloudFront で配信しています。1 本の動画は、マニフェストファイルと数百の動画セグメントで構成されており、再生中にプレーヤーが多数のファイルを順次取得します。会員のサインイン後だけ視聴を許可し、有効期限も設ける必要があります。配信用の URL は変更できず、S3 バケットへ直接アクセスされないようにする必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["信頼されたキーグループの署名付き Cookie を有効にし、サインイン後にアプリケーションが Cookie を発行する。S3 へのアクセスは OAC で CloudFront だけに許可する。","信頼されたキーグループを使う署名付き URL を CloudFront で有効にする。マニフェストと数百のセグメントの URL を、ファイルごとに署名して書き換える。","S3 の署名付き URL を、ファイルごとに生成してプレーヤーに渡す。CloudFront ではキャッシュを無効にして、S3 に直接転送する設定にする。","CloudFront の地理的制限で、会員が居住する国からのアクセスだけを許可する。S3 バケットは OAC で保護し、直接のアクセスを防ぐ。"],"answer":[0],"why":["署名付き Cookie は、URL を変えずに複数のファイルへのアクセスを許可できる。サインイン時に Cookie を発行すれば、セグメントごとの署名が不要になり、OAC で S3 への直接アクセスも防げる。","署名付き URL は 1 ファイルごとの署名で、マニフェストや多数のセグメントの URL を書き換える必要がある。URL を変更できない要件にも反する。","S3 の署名付き URL を使うと CloudFront のキャッシュを使えず、配信性能とコストの面で不利になる。URL の変更も必要になる。","地理的制限は国単位の制御で、会員かどうかや有効期限は判定できない。有料会員だけという要件を満たさない。"],"explain":"「複数のファイルを 1 度の認証で」「URL は変更できない」から、署名付き URL ではなく署名付き Cookie を選ぶ。署名付き Cookie は、アプリケーションがサインイン後に発行し、ブラウザーが後続のリクエストに自動で付ける。S3 への直接アクセスは、OAC とバケットポリシーで CloudFront だけに限定する。","point":"1 ファイルずつ・URL を変えてよいなら署名付き URL。複数ファイルをまとめて、URL を変えずに制限するなら署名付き Cookie。","diagram":{"caption":"正解の構成: 署名付き Cookie で CloudFront の配信を制限する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"v","label":"会員の視聴者","sub":"プレーヤー","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"Cookie の署名を検証","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"OAC のみ許可","kind":"storage","c":2,"r":0},{"id":"app","label":"認証アプリ","sub":"サインインを確認","kind":"compute","c":1,"r":1}],"edges":[{"from":"app","to":"v","label":"Cookie を発行","style":"dashed"},{"from":"v","to":"cf","label":"Cookie 付き"},{"from":"cf","to":"s3","label":"OAC"}]}},{"domain":1,"id":"d1-57","topic":"CloudFront","type":"single","stem":"ある EC 事業者は、Amazon CloudFront の背後にある Application Load Balancer と、Amazon EC2 で動くウェブアプリケーション層で、注文フォームを受け付けています。フォームにはクレジットカード番号の入力欄があり、この値は、決済を担当する別のバックエンドサービスだけが平文で扱えるようにする必要があります。ウェブアプリケーション層のログやメモリに、カード番号の平文が残ってはいけません。これらの要件を満たすソリューションはどれですか。","choices":["ビューワープロトコルポリシーを HTTPS のみに設定し、CloudFront からオリジンへの通信も HTTPS にする。ALB で ACM の証明書を使う。","ウェブアプリケーション層でカード番号の入力値を AWS KMS で暗号化し、暗号化した値を決済サービスに渡す。","AWS WAF のウェブ ACL をアタッチし、リクエストボディのカード番号の欄を検査して、ログに出力しないようにマスクする。","CloudFront のフィールドレベル暗号化を設定し、カード番号の欄を RSA の公開鍵で暗号化する。決済サービスだけが対応する秘密鍵を持ち、復号する。"],"answer":[3],"why":["通信経路の暗号化はできるが、ALB で TLS が終端されるため、ウェブアプリケーション層ではカード番号が平文になる。要件を満たさない。","暗号化する時点で、すでにウェブアプリケーション層が平文のカード番号を受け取っている。メモリやログに平文が残るリスクを避けられない。","WAF はリクエストの検査やブロックの機能で、ボディの欄をマスクする機能ではない。ウェブアプリケーション層が平文を受け取る点も変わらない。","フィールドレベル暗号化は、エッジの CloudFront で指定した欄だけを公開鍵で暗号化する。その後ろのウェブアプリケーション層は暗号文を受け渡すだけで、秘密鍵を持つ決済サービスだけが復号できる。"],"explain":"「特定の入力欄だけ」「ウェブアプリケーション層では平文を扱わない」という要件は、CloudFront のフィールドレベル暗号化の典型的な用途。公開鍵と暗号化するフィールドのプロファイルを設定し、キャッシュビヘイビアに関連付けると、エッジで該当の欄が暗号化される。HTTPS は通信路の保護で、アプリケーション層での平文化は防げない。","point":"特定のフォーム欄をエッジで暗号化し、秘密鍵を持つサービスだけが復号するなら CloudFront のフィールドレベル暗号化。","diagram":{"caption":"正解の構成: エッジでカード番号を暗号化し決済サービスだけが復号","cols":5,"rows":1,"groups":[],"nodes":[{"id":"u","label":"購入者","sub":"フォームを送信","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"公開鍵で欄を暗号化","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"暗号文を転送","kind":"network","c":2,"r":0},{"id":"web","label":"ウェブ層","sub":"暗号文のまま中継","kind":"compute","c":3,"r":0},{"id":"pay","label":"決済サービス","sub":"秘密鍵で復号","kind":"security","c":4,"r":0}],"edges":[{"from":"u","to":"cf","label":"HTTPS"},{"from":"cf","to":"alb"},{"from":"alb","to":"web"},{"from":"web","to":"pay","label":"暗号文"}]}},{"domain":1,"id":"d1-58","topic":"VPC エンドポイント","type":"single","stem":"ある企業は、機密性の高いデータを保存した Amazon S3 バケットを、特定の VPC のゲートウェイ型 VPC エンドポイント経由でしかアクセスできないようにしたいと考えています。ほかの VPC やインターネット、AWS マネジメントコンソールからのアクセスは、IAM の権限をもつユーザーであっても拒否する必要があります。この企業は、VPC 側のエンドポイントの設定はすでに完了しています。これらの要件を満たすソリューションはどれですか。","choices":["バケットポリシーで、aws:SourceIp 条件キーに VPC の CIDR ブロックを指定し、その範囲外のアドレスからのアクセスをすべて拒否する。","バケットポリシーで、aws:SourceVpce 条件キーが対象の VPC エンドポイントの ID と一致しないすべてのリクエストを拒否する。","VPC エンドポイントのエンドポイントポリシーで、対象のバケットへのアクセスだけを許可する。バケットポリシーは変更せずそのままにする。","S3 のブロックパブリックアクセスを有効にして、アカウント内のすべてのバケットのパブリックアクセスを禁止する。"],"answer":[1],"why":["ゲートウェイ型エンドポイント経由のリクエストでは、S3 から見える送信元はプライベート IP アドレスのため、aws:SourceIp 条件では評価できない。","バケットポリシーで aws:SourceVpce を条件にした Deny を設定すると、指定のエンドポイント以外から来たリクエストは、IAM の権限があっても拒否される。","エンドポイントポリシーは、そのエンドポイント経由でできる操作を制限するもの。バケットに、ほかの経路から直接アクセスすることは防げない。","ブロックパブリックアクセスは、匿名のアクセスなどのパブリックなアクセスを防ぐ設定で、認証された IAM ユーザーによるアクセスは制限できない。"],"explain":"「エンドポイント経由でしかアクセスさせない」は、バケット側の制御なのでバケットポリシーで実現する。aws:SourceVpce（または aws:SourceVpc）の条件に一致しないリクエストを Deny にすると、コンソールやインターネットからのアクセスも IAM の権限にかかわらず拒否される。エンドポイントポリシーは VPC 側の制限であり、別の制御である。","point":"特定のエンドポイント経由だけに絞るなら、バケットポリシーの aws:SourceVpce による Deny。エンドポイントポリシーとは向きが逆。","diagram":{"caption":"正解の構成: SourceVpce 条件でエンドポイント以外を拒否","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"アプリケーション","kind":"compute","c":0,"r":0},{"id":"vpce","label":"Gateway VPCE","sub":"vpce-xxxx","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"SourceVpce 以外 Deny","kind":"storage","c":2,"r":0},{"id":"out","label":"コンソール等","sub":"インターネット経由","kind":"client","c":2,"r":1}],"edges":[{"from":"ec2","to":"vpce"},{"from":"vpce","to":"s3","label":"許可"},{"from":"out","to":"s3","label":"拒否","style":"dashed"}]}},{"domain":1,"id":"d1-59","topic":"VPC エンドポイント","type":"single","stem":"ある企業は、オンプレミスのデータセンターと AWS の VPC を、AWS Direct Connect のプライベート仮想インターフェイスで接続しています。オンプレミスのバックアップサーバーから Amazon S3 にデータを転送していますが、セキュリティポリシーにより、S3 への通信はインターネットや S3 のパブリック IP アドレスを経由してはならないことになりました。新たにパブリック仮想インターフェイスを作成することも禁止されています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["VPC に S3 用のゲートウェイ型 VPC エンドポイントを作成し、オンプレミスのルーターに、エンドポイントのプレフィックスリスト宛ての経路を追加する。","VPC のパブリックサブネットに NAT ゲートウェイを作成し、オンプレミスのバックアップサーバーのトラフィックを NAT ゲートウェイ経由で S3 に転送する。","VPC に S3 用のインターフェイス型 VPC エンドポイントを作成する。オンプレミスのバックアップサーバーは、エンドポイント固有の DNS 名を指定して S3 にアクセスする。","VPC の EC2 インスタンスにプロキシサーバーを構築し、バックアップサーバーのアクセスを中継して S3 へ送信する。Auto Scaling で台数を調整する。"],"answer":[2],"why":["ゲートウェイ型のエンドポイントは、VPC 内のルートテーブルからしか使えず、Direct Connect や VPN 経由のオンプレミスからのトラフィックは受けられない。","オンプレミスからの通信を NAT ゲートウェイは受けられない。仮に実現しても、S3 のパブリックな経路を通ってしまい、要件に反する。","インターフェイス型エンドポイントは VPC 内のプライベート IP アドレスをもつため、Direct Connect のプライベート仮想インターフェイス経由でオンプレミスから到達できる。マネージドで、サーバーの運用も不要になる。","動作は可能だが、プロキシの構築・パッチ適用・スケーリングの運用負荷が大きい。マネージドなエンドポイントのほうが運用上のオーバーヘッドが小さい。"],"explain":"「オンプレミスから S3 へプライベートに」「パブリック仮想インターフェイスは禁止」から、S3 のインターフェイス型 VPC エンドポイント（AWS PrivateLink）を選ぶ。ゲートウェイ型は VPC 内のルートテーブルの仕組みなので、オンプレミスからは使えない。オンプレミスからは、エンドポイント固有の DNS 名を指定するか、DNS の転送設定で名前解決する。","point":"オンプレミスから S3 へプライベートに接続するなら、インターフェイス型エンドポイント。ゲートウェイ型は VPC 内だけ。","diagram":{"caption":"正解の構成: インターフェイス型エンドポイントを経由して S3 へ","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"op","label":"バックアップ","sub":"オンプレミス","kind":"onprem","c":0,"r":0},{"id":"dx","label":"Direct Connect","sub":"プライベート VIF","kind":"network","c":1,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"プライベート IP","kind":"network","c":2,"r":0},{"id":"s3","label":"S3 バケット","sub":"PrivateLink で接続","kind":"storage","c":3,"r":0}],"edges":[{"from":"op","to":"dx"},{"from":"dx","to":"vpce","label":"プライベート"},{"from":"vpce","to":"s3","label":"AWS 内部"}]}},{"domain":1,"id":"d1-60","topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon EC2 インスタンスで動作するアプリケーションから、Amazon RDS for PostgreSQL の DB インスタンスに接続しています。セキュリティチームは、アプリケーションの設定やパラメータに DB のパスワードを保存すること自体をなくし、アクセス権限を IAM で一元管理したいと考えています。さらに、アプリケーションと DB の間の通信は、必ず暗号化されている必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["IAM データベース認証を有効にし、EC2 のロールに rds-db:connect を許可する。アプリケーションは認証トークンで接続し、rds.force_ssl を 1 に設定する。","DB のパスワードを AWS Secrets Manager に保存し、30 日ごとの自動ローテーションを設定する。アプリケーションは起動時にシークレットを取得して接続する。","DB のパスワードを AWS Systems Manager パラメータストアの SecureString に保存する。EC2 のロールにパラメータの読み取りを許可し、アプリケーションが起動時に取得する。","IAM ユーザーのアクセスキーを EC2 インスタンスに配置し、アプリケーションが IAM ユーザーの認証情報で、直接 DB にサインインするよう設定する。"],"answer":[0],"why":["IAM データベース認証では、パスワードの代わりに有効期間 15 分の認証トークンを使う。接続の許可は IAM ポリシーで管理でき、rds.force_ssl で SSL/TLS による接続を必須にできる。","パスワードの自動ローテーションはできるが、パスワードという認証情報自体は残る。アクセス権限を IAM で一元管理するという要件にも合わない。","パスワードを保存する場所を変えただけで、パスワードの管理は残る。ローテーションも自動では行われない。","RDS は IAM ユーザーのアクセスキーでの直接のサインインに対応していない。長期のアクセスキーを EC2 に置くことも、望ましくない。"],"explain":"「パスワードを保存しない」「IAM で権限を一元管理」が決め手で、IAM データベース認証を使う。EC2 のロールで rds-db:connect を許可し、アプリケーションは AWS SDK などで認証トークンを取得して接続する。トークンの利用には SSL/TLS が必要で、RDS for PostgreSQL ではパラメータグループの rds.force_ssl で暗号化を強制できる。","point":"パスワードレスで IAM 管理なら IAM データベース認証（トークンは 15 分有効）。転送時の暗号化は rds.force_ssl（PostgreSQL）で強制。","diagram":{"caption":"正解の構成: IAM の認証トークンで SSL 接続する","cols":2,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":1,"w":2,"h":1}],"nodes":[{"id":"iam","label":"IAM / RDS","sub":"認証トークンを発行","kind":"security","c":0,"r":0},{"id":"ec2","label":"EC2","sub":"rds-db:connect","kind":"compute","c":0,"r":1},{"id":"rds","label":"RDS PostgreSQL","sub":"force_ssl = 1","kind":"database","c":1,"r":1}],"edges":[{"from":"ec2","to":"iam","label":"トークン取得"},{"from":"ec2","to":"rds","label":"SSL + トークン"}]}},{"id":"d1-61","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、プライベートサブネットで稼働するデータベースサーバーを運用しています。セキュリティ監査で、過去 1 年間にこのサーバーへの接続が拒否された記録を、送信元 IP アドレスとポート番号ごとに調査できることが求められました。調査は不定期に行われ、パケットの内容を確認する必要はありません。ログは長期間保存する必要があるため、保存と分析のコストを抑えたいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["VPC のトラフィックミラーリングを設定し、データベースサーバーのトラフィックを Network Load Balancer の背後の分析用 EC2 インスタンスに送る。インスタンスでパケットをキャプチャして保存する。","AWS CloudTrail の証跡を有効にして Amazon S3 バケットに保存する。ネットワークに関する API 呼び出しの履歴を Amazon Athena で検索し、拒否された接続を特定する。","サブネットに VPC フローログを作成し、すべてのトラフィックを Amazon S3 バケットに発行する。調査時に Amazon Athena でフローログに対して SQL クエリを実行し、拒否された通信を抽出する。","サブネットに VPC フローログを作成し、Amazon CloudWatch Logs に発行する。ロググループの保持期間を無期限に設定し、調査時に CloudWatch Logs Insights でクエリを実行する。"],"answer":[2],"why":["トラフィックミラーリングはパケットの内容まで取得する機能で、今回は不要。分析用インスタンスの運用負荷と、大量のパケットを保存するコストが大きい。","CloudTrail は AWS の API 呼び出しを記録するサービスで、VPC 内の通信の許可・拒否は記録されない。拒否された接続の送信元 IP アドレスやポート番号は調査できない。","フローログは通信ごとの送信元・送信先・ポート・許可または拒否の結果を記録する。S3 は保存料金が安く、Athena はクエリしたデータ量に応じた課金なので、不定期な調査に向く。","調査はできるが、CloudWatch Logs は取り込みと保存の料金が S3 より高く、1 年分を保持し続けるとコストが膨らむ。不定期の調査には割高になる。"],"explain":"「接続が拒否された記録」「送信元 IP とポート」「パケットの内容は不要」「長期保存でコストを抑える」がそろったら、VPC フローログを S3 に発行して Athena で分析する構成を選ぶ。フローログはネットワークインターフェイス単位のメタデータで、パケットの中身は含まない。パケット単位の調査が必要な場合だけトラフィックミラーリングを使う。","point":"通信の許可・拒否の記録は VPC フローログ。長期保存と不定期の分析なら S3 ＋ Athena。パケット内容が必要なときだけトラフィックミラーリング。","diagram":{"caption":"正解の構成: フローログを S3 に発行し Athena で分析する","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"db","label":"DB サーバー","sub":"プライベート","kind":"database","c":0,"r":0},{"id":"fl","label":"VPC フローログ","sub":"フィルター: ALL","kind":"management","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"長期保存","kind":"storage","c":2,"r":0},{"id":"athena","label":"Athena","sub":"SQL で調査","kind":"analytics","c":3,"r":0}],"edges":[{"from":"db","to":"fl","label":"通信の記録"},{"from":"fl","to":"s3","label":"発行"},{"from":"s3","to":"athena","label":"クエリ"}]}},{"id":"d1-62","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、本番環境、開発環境、共有サービス（DNS と監査ツール）をそれぞれ別の VPC で運用し、AWS Transit Gateway で接続しています。セキュリティポリシーにより、本番 VPC と開発 VPC は互いに通信できてはならず、どちらの VPC からも共有サービス VPC には通信できる必要があります。今後、VPC の数は 10 以上に増える見込みで、ネットワークチームは中央で一元的に制御したいと考えています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["Transit Gateway のルートテーブルを 2 つ作成する。本番 VPC と開発 VPC のアタッチメントを一方に関連付けて共有サービス VPC のルートだけを伝播させ、共有サービス VPC のアタッチメントを他方に関連付けて本番と開発のルートを伝播させる。","すべてのアタッチメントを Transit Gateway の既定のルートテーブルに関連付けてルートを伝播させる。本番 VPC と開発 VPC のサブネットのネットワーク ACL で、お互いの CIDR ブロックからの通信を拒否する設定にする。","Transit Gateway をやめて、本番 VPC と共有サービス VPC、開発 VPC と共有サービス VPC の間に VPC ピアリング接続を作成する。本番 VPC と開発 VPC の間にはピアリング接続を作成せず、ルートも追加しない。","Transit Gateway を 2 つ作成し、1 つは本番 VPC と共有サービス VPC を、もう 1 つは開発 VPC と共有サービス VPC を接続する。環境ごとに別の Transit Gateway を管理する。"],"answer":[0],"why":["アタッチメントの関連付けと伝播をルートテーブルごとに分けると、通信できる範囲をルーティングで制御できる。VPC が増えても、新しい VPC を適切なルートテーブルに関連付けるだけで済む。","既定のルートテーブルではすべての VPC 間にルートができてしまい、NACL で個別に拒否することになる。VPC が増えるたびに NACL の更新が必要で、設定漏れも起きやすい。","3 つの VPC なら実現できるが、VPC が増えるとピアリング接続の数が増え、中央での制御も難しい。ピアリングではルートの推移的な接続もできない。","分離はできるが、Transit Gateway を複数管理することになり、料金と運用の負荷が増える。1 つの Transit Gateway のルートテーブルで分離する方が効率的。"],"explain":"「VPC 間の通信を分離」「共有サービスには全環境から到達」「VPC が増える」「一元的に制御」から、Transit Gateway のルートテーブルを使い分ける。アタッチメントをどのルートテーブルに関連付けるか、どのルートテーブルにルートを伝播するかで、通信できる組み合わせを決められる。NACL やセキュリティグループで拒否する方法は動くが、ルーティングで分離する方が管理しやすい。","point":"Transit Gateway は複数のルートテーブルで通信範囲を分離できる。関連付けと伝播の組み合わせで、環境どうしを隔離しつつ共有 VPC だけ共通にする。","diagram":{"caption":"正解の構成: ルートテーブルで本番と開発を分離し共有 VPC に集約する","cols":3,"rows":3,"groups":[],"nodes":[{"id":"prod","label":"本番 VPC","sub":"スポーク用 RT","kind":"compute","c":0,"r":0},{"id":"dev","label":"開発 VPC","sub":"スポーク用 RT","kind":"compute","c":0,"r":2},{"id":"tgw","label":"Transit Gateway","sub":"RT を 2 つに分ける","kind":"network","c":1,"r":1},{"id":"shared","label":"共有サービス VPC","sub":"共有用 RT","kind":"compute","c":2,"r":1}],"edges":[{"from":"prod","to":"tgw","both":true},{"from":"dev","to":"tgw","both":true},{"from":"tgw","to":"shared","both":true}]}},{"id":"d1-63","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、IPv6 を有効にした VPC のプライベートサブネットで、バックエンドの Amazon EC2 インスタンスを運用しています。インスタンスは、OS の更新プログラムを取得するために、IPv6 でインターネット上のリポジトリにアクセスする必要があります。一方で、インターネットからインスタンスへの接続は、VPC のルーティングの段階で開始できないようにする必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["VPC にインターネットゲートウェイをアタッチし、プライベートサブネットのルートテーブルに ::/0 宛てのルートをインターネットゲートウェイ向けに追加する。セキュリティグループでインバウンドのトラフィックをすべて拒否する。","パブリックサブネットに NAT ゲートウェイを作成し、プライベートサブネットのルートテーブルに ::/0 宛てのルートを NAT ゲートウェイ向けに追加する。","パブリックサブネットに IPv6 に対応した NAT インスタンスを起動し、プライベートサブネットのルートテーブルに ::/0 宛てのルートをそのインスタンス向けに追加する。","VPC に Egress-only インターネットゲートウェイを作成し、プライベートサブネットのルートテーブルに ::/0 宛てのルートを Egress-only インターネットゲートウェイ向けに追加する。"],"answer":[3],"why":["インターネットゲートウェイへのルートを持つサブネットは、インターネットから到達できる構成になる。セキュリティグループで防げても、要件の「ルーティングの段階で開始できない」ことは満たさない。","NAT ゲートウェイは IPv4 のアドレス変換用で、IPv6 のインターネット宛て通信をそのまま中継する用途には使えない。この構成では要件を満たせない。","動作させることはできるが、インスタンスのパッチ適用、可用性の確保、帯域の管理などを自分たちで運用する必要があり、運用上のオーバーヘッドが大きい。","Egress-only インターネットゲートウェイは、VPC から外への IPv6 通信だけを許可し、外からの接続開始を受け付けない。マネージドサービスなので運用の手間もかからない。"],"explain":"「IPv6」「プライベートサブネットから外への通信だけ」「ルーティングの段階で外からの接続を防ぐ」「運用負荷を最小に」の組み合わせは、Egress-only インターネットゲートウェイが対応する。IPv4 ならプライベートサブネットから NAT ゲートウェイを使うが、IPv6 には NAT ゲートウェイではなく Egress-only インターネットゲートウェイを使うと覚える。","point":"IPv6 で「外向きだけ」を許可するのは Egress-only インターネットゲートウェイ。IPv4 の外向きだけは NAT ゲートウェイ。","diagram":{"caption":"正解の構成: Egress-only IGW で IPv6 の外向き通信だけを許可する","cols":4,"rows":1,"groups":[{"label":"VPC（IPv6 有効）","kind":"vpc","c":0,"r":0,"w":3,"h":1},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"IPv6 アドレス","kind":"compute","c":0,"r":0},{"id":"rt","label":"ルートテーブル","sub":"::/0 → eigw","kind":"network","c":1,"r":0},{"id":"eigw","label":"Egress-only IGW","sub":"外向きのみ","kind":"network","c":2,"r":0},{"id":"net","label":"インターネット","sub":"更新リポジトリ","kind":"client","c":3,"r":0}],"edges":[{"from":"ec2","to":"rt"},{"from":"rt","to":"eigw"},{"from":"eigw","to":"net","label":"IPv6 送信"}]}},{"id":"d1-64","domain":1,"topic":"WAF・Shield","type":"multi","stem":"ある EC 事業者は、Application Load Balancer（ALB）の背後の Amazon EC2 インスタンスでウェブアプリケーションを公開しています。セキュリティチームは、SQL インジェクションやクロスサイトスクリプティングなどの一般的なウェブ攻撃からアプリケーションを保護することを求めています。また、事業を行っていない特定の国からのアクセスを遮断する必要があります。ルールを自分で一から作成せず、運用上のオーバーヘッドを最小限に抑えたいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["AWS WAF のウェブ ACL を作成して ALB に関連付ける。AWS マネージドルールグループのコアルールセットと SQL データベースのルールグループを追加し、ブロックのアクションで有効にする。","対象国の IP アドレス範囲を調べて、サブネットのネットワーク ACL に拒否のルールとして登録する。IP アドレス範囲が変更されるたびに、ルールを更新する。","AWS Shield Advanced を有効にして ALB を保護対象に登録する。Shield Advanced が検知した攻撃を、アプリケーションに到達する前に自動的にブロックする。","同じウェブ ACL に、対象国を指定した地理的一致のルール文を使うルールを追加し、アクションをブロックに設定する。","Amazon GuardDuty を有効にし、不審なアクセスの検出結果をトリガーに AWS Lambda 関数でセキュリティグループを更新して、対象国からのアクセスを遮断する。"],"answer":[0,3],"why":["AWS マネージドルールグループは、一般的な攻撃のパターンをあらかじめ定義したもので、自分でルールを書かずに済む。ALB に関連付けたウェブ ACL で適用できる。","動作はするが、国ごとの IP アドレス範囲を自分で調べて維持する必要があり、運用負荷が大きい。ネットワーク ACL にはルール数の上限もある。","Shield Advanced は DDoS 攻撃への対策が中心で、SQL インジェクションやクロスサイトスクリプティングの検査はしない。国別のアクセス制御もできない。","地理的一致のルール文は、リクエストの送信元の国でマッチさせる。国ごとの IP アドレス範囲を自分で管理しなくてよく、同じウェブ ACL に追加するだけで済む。","GuardDuty は脅威の検出サービスで、リクエストを検査してブロックするものではない。自作の Lambda 関数による遮断は、後追いの対応になり運用も複雑になる。"],"explain":"要件は「一般的なウェブ攻撃からの保護」と「特定の国の遮断」の 2 つで、どちらも AWS WAF のウェブ ACL で実現できる。前者は AWS マネージドルールグループ、後者は地理的一致のルール文を使う。NACL での IP 拒否は動くが、IP 範囲の管理が運用負荷になる。Shield Advanced や GuardDuty は役割が異なる。","point":"ウェブ攻撃対策は WAF のマネージドルールグループ、国による遮断は地理的一致。DDoS 対策の Shield とは役割が違う。","diagram":{"caption":"正解の構成: ウェブ ACL をALB に関連付けて検査と国別遮断を行う","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"user","label":"利用者","sub":"世界中","kind":"client","c":0,"r":0},{"id":"waf","label":"AWS WAF","sub":"マネージドルール＋国","kind":"security","c":1,"r":0},{"id":"alb","label":"ALB","sub":"ウェブ ACL 関連付け","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"ウェブサーバー","kind":"compute","c":3,"r":0}],"edges":[{"from":"user","to":"waf"},{"from":"waf","to":"alb","label":"許可した通信"},{"from":"alb","to":"ec2"}]}},{"id":"d1-65","domain":1,"topic":"WAF・Shield","type":"single","stem":"ある企業は、本番の Application Load Balancer（ALB）に AWS WAF のウェブ ACL を関連付けて、ウェブアプリケーションを保護しています。セキュリティチームは、新しい AWS マネージドルールグループを追加したいと考えています。ただし、正規の利用者のリクエストを誤ってブロックすることは避けなければなりません。本番のトラフィックでルールの影響を確認し、誤検知するルールだけを調整してから、ブロックを有効にする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["本番と同じ構成の検証環境を別に作成し、攻撃を模したテスト用のリクエストを送ってルールの動作を確認する。問題がなければ、本番のウェブ ACL にルールグループをブロックのアクションで追加する。","ルールグループのルールのアクションを Count に上書きして追加する。WAF のログで一致したリクエストを確認し、誤検知するルールは除外して、確認済みのルールをブロックに切り替える。","ルールグループをブロックのアクションで本番のウェブ ACL に追加する。正規の利用者からの問い合わせでブロックが判明した場合に、AWS WAF のログを調べて該当のルールを除外する運用にする。","ルールグループのルールのアクションを CAPTCHA に上書きして追加する。ルールに一致した利用者に検証を解かせ、誤検知の有無にかかわらず、すべての利用者に対してこの設定を継続して運用する。"],"answer":[1],"why":["テスト用のリクエストでは、本番の利用者が実際に送るリクエストの多様さを再現できない。誤検知を見落とす可能性があり、検証環境の構築と維持にも手間がかかる。","Count は一致をカウントして記録するだけで、リクエストはブロックされない。本番のトラフィックで誤検知を確認し、問題のあるルールだけを除外してからブロックに切り替えられる。","ブロックで追加すると、確認の前に正規の利用者のリクエストが遮断される。問い合わせを受けてから対応するのでは、誤ってブロックしないという要件を満たさない。","CAPTCHA では、正規の利用者にも検証を解かせることになり、利用者の体験を損なう。誤検知の確認が目的なら、リクエストを止めない Count が適している。"],"explain":"「本番のトラフィックで影響を確認」「正規のリクエストをブロックしない」から、ルールを Count モードで導入する。AWS WAF のログとメトリクスで、どのルールがどのリクエストに一致したかを見て、誤検知を除外してからブロックに切り替える。新しいルールを本番に入れるときの定石で、ステージングだけの検証や、ブロックしてから直す進め方は避ける。","point":"WAF のルールを本番に導入するときは、まず Count で一致を確認し、誤検知を除外してからブロックに切り替える。","diagram":null},{"id":"d1-66","domain":1,"topic":"脅威検出・監査","type":"multi","stem":"ある企業は、AWS Organizations で 60 個の AWS アカウントを管理し、複数のリージョンでワークロードを運用しています。セキュリティチームは、専用のセキュリティアカウントで、組織全体のすべてのアカウントとリージョンのセキュリティ検出結果を 1 つのリージョンの画面で確認したいと考えています。脅威の検出は、新しく作成されるアカウントでも自動的に有効になる必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たす手順の組み合わせはどれですか。","choices":["各アカウントで Amazon GuardDuty を有効にし、検出結果をアカウントごとの Amazon S3 バケットにエクスポートする。セキュリティチームがアカウントを切り替えて確認する。","セキュリティアカウントを Amazon GuardDuty の委任管理者に指定し、組織のすべての既存アカウントと新規アカウントで GuardDuty が自動的に有効になるように設定する。","AWS CloudTrail の組織の証跡を作成して管理アカウントの S3 バケットに保存する。Amazon Athena で全アカウントのログを定期的にクエリして、不審な操作を探す。","各アカウントの GuardDuty の検出結果を Amazon EventBridge ルールで取得し、AWS Lambda 関数でセキュリティアカウントの S3 バケットに書き込む。検出結果の一覧は手作業で作成する。","セキュリティアカウントを AWS Security Hub の委任管理者に指定し、組織のアカウントで Security Hub を自動的に有効にする。集約リージョンを指定して、リージョンをまたぐ検出結果の集約を有効にする。"],"answer":[1,4],"why":["アカウントごとに有効化と確認が必要で、アカウントが増えるたびに手作業が発生する。検出結果を 1 か所で確認するという要件も満たさない。","委任管理者を設定すると、セキュリティアカウントから組織全体の GuardDuty を管理でき、新規アカウントの自動有効化も設定できる。メンバーアカウントの検出結果も集約される。","CloudTrail の証跡は操作の記録で、脅威を自動で検出する仕組みではない。クエリを定期的に実行して不審な操作を探す運用は、負荷が大きく検出も遅れる。","自作のパイプラインを運用することになり、運用負荷が大きい。手作業での一覧作成は、継続的な確認にも向かない。","Security Hub は GuardDuty などの検出結果を集約して表示する。委任管理者と自動有効化で組織全体を対象にし、リージョン間の集約を有効にすれば、1 つのリージョンから全リージョンの結果を確認できる。"],"explain":"要件は「脅威の検出が新規アカウントでも自動で有効になる」ことと「全アカウント・全リージョンの検出結果を 1 画面で確認する」ことの 2 つ。前者は GuardDuty の委任管理者と自動有効化、後者は Security Hub の委任管理者とクロスリージョン集約で満たせる。CloudTrail や自作の集約処理は目的が合わない、または運用負荷が大きい。","point":"組織全体の脅威検出は GuardDuty を委任管理者で自動有効化し、検出結果は Security Hub で集約する。リージョンをまたぐ集約も設定できる。","diagram":null},{"id":"d1-67","domain":1,"topic":"脅威検出・監査","type":"single","stem":"ある企業は、Amazon ECR にコンテナイメージを保存し、AWS Lambda 関数をコンテナイメージとパッケージの両方で運用しています。セキュリティ部門は、これらに含まれるソフトウェアの既知の脆弱性（CVE）を継続的に検出することを求めています。イメージや関数を更新していなくても、新しい CVE が公開されたときには自動的に再評価され、検出結果が通知される必要があります。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["ECR の基本スキャンを有効にして、イメージのプッシュ時にスキャンを実行する。Lambda 関数は、更新するたびにセキュリティチームが手動でスキャンする。","Amazon GuardDuty を有効にし、Lambda Protection と Runtime Monitoring を有効にする。検出結果を Amazon EventBridge で通知する。","Amazon Inspector を有効にし、ECR と Lambda のスキャンを有効にする。新しい CVE が公開されると自動で再評価され、検出結果は EventBridge で通知できる。","CI/CD パイプラインにオープンソースの脆弱性スキャナーを組み込み、ビルド時にスキャンする。スキャナーの脆弱性データベースは、開発チームが定期的に更新する。"],"answer":[2],"why":["プッシュ時のスキャンは、そのときの脆弱性情報に基づく 1 回限りの評価になる。新しい CVE が公開されても、自動での再評価は行われない。","GuardDuty は不審な動作や脅威を検出するサービスで、ソフトウェアの既知の脆弱性を検出するものではない。要件の用途に合わない。","Inspector は ECR イメージと Lambda 関数を継続的にスキャンし、新しい CVE が公開されると自動で再評価する。検出結果は EventBridge や Security Hub と連携できる。","ビルド時にしかスキャンされず、デプロイ済みのリソースは更新しない限り再評価されない。スキャナーとデータベースの運用も自分たちで行う必要がある。"],"explain":"「既知の脆弱性（CVE）」「継続的」「新しい CVE の公開で自動再評価」「運用負荷を最小に」の組み合わせは、Amazon Inspector を選ぶ。Inspector は EC2 インスタンス、ECR のコンテナイメージ、Lambda 関数を対象に継続的にスキャンする。GuardDuty は脅威検出、Inspector は脆弱性管理と、役割を区別して覚える。","point":"ソフトウェアの脆弱性（CVE）を継続的に検出するのは Amazon Inspector。不審な動作や脅威の検出は GuardDuty。","diagram":null},{"id":"d1-68","domain":1,"topic":"脅威検出・監査","type":"single","stem":"ある企業は、AWS Organizations で 40 個の AWS アカウントを管理しています。内部統制の要件として、すべてのアカウントとすべてのリージョンで管理イベントを記録し、記録した証跡を各アカウントの管理者が停止・削除・変更できないようにする必要があります。さらに、保存されたログファイルが改ざんされていないことを後から検証できなければなりません。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["管理アカウントで、すべてのリージョンを対象にした組織の証跡を作成し、ログアーカイブ用アカウントの S3 バケットに保存する。ログファイルの整合性検証を有効にする。","各メンバーアカウントで CloudTrail の証跡を作成し、各アカウントの S3 バケットにログを保存する。メンバーアカウントの管理者の IAM ポリシーで、StopLogging を拒否する。","管理アカウントで、現在のリージョンだけを対象にした組織の証跡を作成する。ほかのリージョンは、使用を禁止するポリシーを設定して運用する。","すべてのアカウントで AWS Config を有効にし、構成変更の履歴をアグリゲーターで集約する。構成履歴を、操作の記録の代わりに監査人に提示する。"],"answer":[0],"why":["組織の証跡は、メンバーアカウントから変更や削除ができず、新規アカウントにも自動で適用される。整合性検証を有効にすると、署名付きのダイジェストファイルで改ざんを検知できる。","メンバーアカウントの管理者は、自分の IAM ポリシーを変更して証跡を停止できてしまう。アカウントごとの設定と運用も必要で、運用負荷が大きい。","対象が 1 つのリージョンだけでは、すべてのリージョンで記録するという要件を満たさない。禁止ポリシーによる運用は、記録の代わりにはならない。","AWS Config は、リソースの構成変更の履歴を記録するサービスで、API の呼び出しを記録するものではない。管理イベントの記録の代わりにはならない。"],"explain":"「全アカウント・全リージョン」「メンバーアカウントの管理者が変更できない」「改ざんの検証」がそろったら、管理アカウントで作成する組織の証跡（マルチリージョン）と、ログファイルの整合性検証を選ぶ。保存先は、権限を絞った別のログアーカイブ用アカウントの S3 バケットにする。CloudTrail は誰が何をしたか、Config は構成がどう変わったかを記録するもの。","point":"全アカウントの操作記録は、組織の証跡（マルチリージョン）。メンバーは変更できず、整合性検証で改ざんも検知できる。","diagram":{"caption":"正解の構成: 組織の証跡をログアーカイブの S3 に集約し整合性を検証する","cols":4,"rows":1,"groups":[{"label":"メンバーアカウント","kind":"account","c":0,"r":0,"w":1,"h":1},{"label":"管理アカウント","kind":"account","c":1,"r":0,"w":1,"h":1},{"label":"ログアーカイブ","kind":"account","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"member","label":"全アカウント","sub":"全リージョンの操作","kind":"management","c":0,"r":0},{"id":"trail","label":"組織の証跡","sub":"メンバーは変更不可","kind":"management","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"ログの保存先","kind":"storage","c":2,"r":0},{"id":"digest","label":"整合性検証","sub":"署名付きダイジェスト","kind":"security","c":3,"r":0}],"edges":[{"from":"member","to":"trail","label":"管理イベント"},{"from":"trail","to":"s3","label":"配信"},{"from":"s3","to":"digest","style":"dashed","label":"改ざん検知"}]}},{"id":"d1-69","domain":1,"topic":"脅威検出・監査","type":"single","stem":"ある企業は、複数の開発チームが Amazon S3 バケットを自由に作成する環境を運用しています。先日、あるチームが誤ってバケットをパブリックに読み取り可能な設定にしていたことが判明しました。セキュリティチームは、バケットのパブリックな設定を継続的に評価し、違反を検出したら人手を介さずに自動で是正する仕組みを求めています。カスタムのコードの開発と運用は最小限にしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["Amazon Macie を有効にして、パブリックに公開されたバケットを検出する。検出結果を Amazon SNS トピックで通知し、担当者が手動でバケットの設定を修正する。","AWS CloudTrail の PutBucketAcl と PutBucketPolicy の API 呼び出しを Amazon EventBridge で検知する。AWS Lambda 関数で、バケットのパブリックアクセスをブロックする。","IAM Access Analyzer を有効にして、パブリックアクセスを許可しているバケットを検出する。検出結果を確認し、セキュリティチームが対象バケットの設定を変更する。","AWS Config のマネージドルールで、パブリックな読み取りを禁止するルールを有効にする。ルールの修復アクションに AWS Systems Manager Automation のランブックを指定し、自動修復を有効にする。"],"answer":[3],"why":["Macie は S3 内の機密データの検出が中心で、通知を受けた担当者が手動で修正する運用では、自動で是正するという要件を満たさない。","動作はするが、Lambda 関数を自作して運用する必要がある。ACL とバケットポリシーなどの API の組み合わせを網羅するのも難しく、カスタムのコードを最小限にする要件に反する。","Access Analyzer は外部からアクセスできるリソースを検出するサービスで、検出結果を確認して設定を変更するのは人の作業になる。自動の是正にはならない。","Config のマネージドルールが設定を継続的に評価し、非準拠を検出したときに、Systems Manager Automation のランブックで自動修復できる。カスタムコードも不要。"],"explain":"「継続的に評価」「違反を検出したら自動で是正」「カスタムコードを最小限に」から、AWS Config のマネージドルールと自動修復を選ぶ。修復アクションには、AWS が用意した Systems Manager Automation のランブックを指定できる。検出するだけのサービス（Macie、Access Analyzer）や、自作の Lambda では要件を満たしにくい。","point":"設定の継続的な評価と自動修復は AWS Config のルール＋修復アクション（Systems Manager Automation）。","diagram":null},{"id":"d1-70","domain":1,"topic":"ハイブリッド接続","type":"single","stem":"ある企業は、在宅勤務の従業員約 300 人が、自宅の PC から VPC のプライベートサブネットで動作する社内アプリケーションに安全にアクセスできるようにしたいと考えています。従業員の認証には、AWS Directory Service の AWS Managed Microsoft AD に登録された既存のユーザーを使用します。部署ごとに、アクセスできるサブネットを制限する必要があります。VPN サーバーの運用は避けたいと考えています。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["パブリックサブネットに VPN サーバーのソフトウェアをインストールした EC2 インスタンスを起動する。従業員の認証を AD と連携させ、部署ごとの設定ファイルを作成して従業員に配布する。","AWS Client VPN エンドポイントを作成し、認証に Active Directory を指定する。サブネットを関連付け、認可ルールで AD のグループごとに接続を許可する宛先の CIDR を指定する。","従業員ごとに、自宅のルーターと VPC の間に AWS Site-to-Site VPN 接続を作成する。部署ごとに別の仮想プライベートゲートウェイを使い、部署ごとに接続先の VPC を分けて接続を許可する設定にする。","社内アプリケーションをインターネット向けの Application Load Balancer で公開する。ALB のリスナーで OIDC 認証を設定し、AD と連携した部署ごとにリスナールールを分けて転送先を制限する。"],"answer":[1],"why":["動作させることはできるが、EC2 インスタンスのパッチ適用、可用性、証明書の管理などを自分たちで運用する必要がある。VPN サーバーの運用を避ける要件に反する。","Client VPN はマネージドなリモートアクセス VPN で、Active Directory 認証に対応している。認可ルールで、AD のグループごとにアクセスできる宛先を制限できる。","Site-to-Site VPN は拠点のルーターなどのゲートウェイ機器と VPC を接続するもので、従業員の PC 向けではない。300 人分の接続を作成して管理するのは現実的ではない。","アプリケーションをインターネットに公開することになり、プライベートサブネット内のアプリケーションに VPN で安全にアクセスするという要件に合わない。"],"explain":"「個々の従業員の PC から VPC へ」「AD 認証」「グループごとにアクセス先を制限」「VPN サーバーの運用を避ける」から、AWS Client VPN を選ぶ。認証は Active Directory、相互認証、SAML に対応している。アクセス先の制御は認可ルールで行う。Site-to-Site VPN は拠点とのネットワーク間接続用で、個人のリモートアクセスには使わない。","point":"従業員個人のリモートアクセスは AWS Client VPN。拠点どうしの接続は Site-to-Site VPN。認可ルールでグループごとの宛先を制限できる。","diagram":{"caption":"正解の構成: Client VPN で AD 認証し、認可ルールでアクセス先を絞る","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":2,"h":2}],"nodes":[{"id":"pc","label":"従業員の PC","sub":"自宅","kind":"client","c":0,"r":0},{"id":"vpn","label":"Client VPN","sub":"認可ルールで制限","kind":"network","c":1,"r":0},{"id":"app","label":"社内アプリ","sub":"プライベート","kind":"compute","c":2,"r":0},{"id":"ad","label":"Managed AD","sub":"ユーザーを認証","kind":"security","c":1,"r":1}],"edges":[{"from":"pc","to":"vpn","label":"VPN 接続"},{"from":"vpn","to":"app"},{"from":"vpn","to":"ad","style":"dashed","label":"認証"}]}},{"id":"d1-71","domain":1,"topic":"API Gateway","type":"single","stem":"ある企業は、社内システムの内部向けに、Amazon API Gateway の REST API と AWS Lambda でバックエンド API を構築しています。この API は、特定の VPC 内のアプリケーションからだけ呼び出せるようにする必要があります。API のエンドポイントにはインターネットから到達できてはならず、許可していない VPC からの呼び出しは拒否されなければなりません。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["リージョン API を作成し、API キーを必須に設定する。使用量プランで API キーを発行し、VPC 内のアプリケーションだけにキーを配布して、リクエストに AP
