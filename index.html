/* ---------- 操作 ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const r = route();
  const ps = sessions.practice, es = sessions.exam;
  switch (act) {
    case 'exam-switch':
      switchExam(el.dataset.x);
      break;
    case 'enter-exam':
      entry = false;
      if (el.dataset.x !== X.key) switchExam(el.dataset.x);
      lsSet(LS_EXAM, X.key);
      go('home');
      break;
    case 'open-select':
      if (ev.preventDefault) ev.preventDefault();
      entry = true; ui.confirm = null;
      render(); window.scrollTo(0, 0);
      break;
    case 'quick':
      startPractice(pickPractice({ domains: [1, 2, 3, 4], count: '10', order: 'smart', topic: '' }));
      break;
    case 'start-domain':
      startPractice(pickPractice({ domains: [+el.dataset.d], count: '10', order: 'smart', topic: '' }));
      break;
    case 'start-topic':
      startPractice(pickPractice({ domains: [1, 2, 3, 4], count: 'all', order: 'smart', topic: el.dataset.t }));
      break;
    case 'start-review':
      startReview();
      break;
    case 'pick': {
      if (el.getAttribute('aria-disabled') === 'true') return;
      const s = r === 'exam' ? es : ps;
      if (!s || s.finished) return;
      const id = s.ids[s.i], q = QMAP[id];
      if (r === 'practice' && s.done[id]) return;
      const i = +el.dataset.i;
      let p = (s.picks[id] || []).slice();
      if (q.type === 'single') p = [i];
      else if (p.includes(i)) p = p.filter((x) => x !== i);
      else { p.push(i); if (p.length > q.answer.length) p.shift(); }
      s.picks[id] = p;
      saveSessions();
      render();
      break;
    }
    case 'submit': {
      const id = ps.ids[ps.i], q = QMAP[id];
      const p = ps.picks[id] || [];
      if (p.length !== q.answer.length || ps.done[id]) return;
      ps.done[id] = true;
      record(id, isCorrect(q, p));
      save();
      saveSessions();
      render();
      const fb = document.getElementById('fb');
      if (fb) fb.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
      const nx = document.querySelector('[data-key="next"]');
      if (nx) nx.focus({ preventScroll: true });
      break;
    }
    case 'next':
      if (r === 'exam') { if (es.i < es.ids.length - 1) { es.i++; saveSessions(); render(); window.scrollTo(0, 0); } break; }
      if (ps.i < ps.ids.length - 1) ps.i++; else ps.finished = true;
      saveSessions();
      render();
      window.scrollTo(0, 0);
      break;
    case 'prev':
      if (es && es.i > 0) { es.i--; saveSessions(); render(); window.scrollTo(0, 0); }
      break;
    case 'goto':
      es.i = +el.dataset.n; saveSessions(); render(); window.scrollTo(0, 0);
      break;
    case 'flag': {
      const id = es.ids[es.i];
      if (es.flags[id]) delete es.flags[id]; else es.flags[id] = true;
      saveSessions(); render();
      break;
    }
    case 'quit-ask': ui.confirm = 'quit-practice'; render(); break;
    case 'quit-exam-ask': ui.confirm = 'quit-exam'; render(); break;
    case 'finish-ask': ui.confirm = 'finish'; render(); window.scrollTo(0, 0); break;
    case 'reset-ask': ui.confirm = 'reset'; render(); break;
    case 'confirm-cancel': ui.confirm = null; render(); break;
    case 'quit-confirm':
      ui.confirm = null;
      if (ps) { ps.finished = true; saveSessions(); }
      render(); window.scrollTo(0, 0);
      break;
    case 'quit-exam-confirm':
      ui.confirm = null; sessions.exam = null; saveSessions(); stopTimer(); render(); window.scrollTo(0, 0);
      break;
    case 'finish-confirm':
      finishExam(false);
      break;
    case 'retry-wrong': {
      const wrong = ps.ids.filter((id) => ps.done[id] && !isCorrect(QMAP[id], ps.picks[id]));
      startPractice(shuffle(wrong), 'review');
      break;
    }
    case 'practice-new':
      sessions.practice = null; saveSessions(); render(); window.scrollTo(0, 0);
      break;
    case 'start-exam': {
      const ids = pickExam();
      const s = newSession('exam', ids);
      s.deadline = s.startedAt + EXAM.min * 60 * 1000;
      sessions.exam = s;
      ui.examView = null; ui.detail = null; ui.confirm = null;
      saveSessions();
      go('exam');
      break;
    }
    case 'open-exam':
      ui.examView = el.dataset.id; ui.detail = null;
      if (sessions.exam && sessions.exam.finished && sessions.exam.resultId !== ui.examView) { sessions.exam = null; saveSessions(); }
      go('exam');
      break;
    case 'exam-detail': ui.detail = +el.dataset.n; render(); window.scrollTo(0, 0); break;
    case 'detail-prev': ui.detail--; render(); window.scrollTo(0, 0); break;
    case 'detail-next': ui.detail++; render(); window.scrollTo(0, 0); break;
    case 'detail-close': ui.detail = null; render(); window.scrollTo(0, 0); break;
    case 'exam-close':
      ui.examView = null; ui.detail = null;
      if (sessions.exam && sessions.exam.finished) { sessions.exam = null; saveSessions(); }
      render(); window.scrollTo(0, 0);
      break;
    case 'exam-retry': {
      const rec = progress.exams.find((e) => e.id === (ui.examView || (es && es.resultId)));
      if (!rec) break;
      startPractice(shuffle(rec.items.filter(([id, p]) => QMAP[id] && !isCorrect(QMAP[id], p)).map(([id]) => id)), 'review');
      break;
    }
    case 'reset-confirm':
      progress = { v: 1, stats: {}, exams: [], resetAt: Date.now(), updatedAt: Date.now() };
      sessions = { practice: null, exam: null };
      saveSessions();
      ui.confirm = null; ui.examView = null; ui.detail = null;
      save();
      render();
      break;
  }
});
document.addEventListener('change', (ev) => { if (ev.target.closest('#setup')) readSetup(); });
document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'setup') return;
  ev.preventDefault();
  readSetup();
  startPractice(pickPractice(prefs));
});
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag)) return;
  const r = route();
  const s = r === 'practice' ? sessions.practice : r === 'exam' ? sessions.exam : null;
  if (!s || s.finished || ui.confirm) return;
  if (/^[1-6]$/.test(ev.key)) {
    const btn = document.querySelector(`[data-key="c${+ev.key - 1}"]`);
    if (btn) { ev.preventDefault(); btn.click(); }
  } else if (ev.key === 'Enter' && ((tag !== 'button' && tag !== 'a') || ev.target.classList.contains('choice'))) {
    const btn = document.querySelector('[data-key="submit"]:not([disabled])') || document.querySelector('[data-key="next"]:not([disabled])');
    if (btn) { ev.preventDefault(); btn.click(); }
  }
});
document.addEventListener('pointermove', (ev) => {
  const chart = ev.target.closest && ev.target.closest('[data-chart]');
  for (const t of document.querySelectorAll('[data-chart] .tip')) if (!chart || !chart.contains(t)) t.hidden = true;
  if (!chart) return;
  const tip = chart.querySelector('.tip');
  const g = ev.target.closest('[data-tip]');
  if (!g) { tip.hidden = true; return; }
  const box = chart.getBoundingClientRect();
  const bar = (g.querySelector('.bar') || g).getBoundingClientRect();
  tip.textContent = g.dataset.tip;
  tip.style.left = Math.min(Math.max(bar.left + bar.width / 2 - box.left, 90), box.width - 90) + 'px';
  tip.style.top = Math.max(bar.top - box.top, 40) + 'px';
  tip.hidden = false;
});
window.addEventListener('hashchange', () => { entry = false; ui.confirm = null; render(); window.scrollTo(0, 0); });

renderSwitch();
render();
Sync.set('local');
Sync.init();
})();
</script>

if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
