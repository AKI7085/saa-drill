<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AWS 認定 SAA-C03 対策の演習アプリ。本番形式のオリジナル問題 118 問を、解説・構成図・苦手復習・模擬試験で学習できます。">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAA ドリル">
<style>
:root { color-scheme: dark; background: #050810; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>SAA ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Murecho:wght@700;900&family=Oxanium:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 宇宙船のコックピット計器。暗い宇宙に方眼と星を敷き、主要パネルは四隅のブラケットで囲む。スマホは下部タブ。意図して暗色だけで統一する。 */
:root {
  --bg: #050810;
  --bg-2: #08101E;
  --panel: rgba(11, 20, 37, 0.88);
  --surface: #0B1425;
  --surface-2: #13213A;
  --ink: #DCE7F5;
  --muted: #8B9DB6;
  --line: rgba(110, 200, 255, 0.17);
  --line-strong: rgba(110, 200, 255, 0.36);
  --accent: #3BE7F5;
  --accent-ink: #03161A;
  --accent-soft: rgba(59, 231, 245, 0.11);
  --accent-glow: rgba(59, 231, 245, 0.45);
  --ok: #4CEFA1;
  --ok-soft: rgba(76, 239, 161, 0.11);
  --ng: #FF5E7B;
  --ng-soft: rgba(255, 94, 123, 0.12);
  --flag: #FFB547;
  --flag-soft: rgba(255, 181, 71, 0.13);
  --k-client: #9BA8B8;
  --k-onprem: #C9A27B;
  --k-compute: #FF9A3D;
  --k-container: #F38B33;
  --k-serverless: #FFA94D;
  --k-storage: #6FD35A;
  --k-database: #6FA2FF;
  --k-network: #B98AFF;
  --k-security: #FF6F86;
  --k-integration: #F26FC1;
  --k-analytics: #45D3E6;
  --k-management: #DF74BD;
  --d-bg: #081120;
  --d-edge: #8FB3CC;
  --d-pub: #0E2A1D;
  --d-priv: #0F1C38;
  --d-onprem: #2A2117;
  --font-hud: "Oxanium", "Share Tech Mono", ui-monospace, Consolas, sans-serif;
  --font-display: "Murecho", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --corners:
    linear-gradient(var(--accent), var(--accent)) left top / 16px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) left top / 2px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right top / 16px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right top / 2px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) left bottom / 16px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) left bottom / 2px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right bottom / 16px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right bottom / 2px 16px no-repeat;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1px 1px at 23px 41px, rgba(255, 255, 255, 0.55), transparent 60%) 0 0 / 190px 170px,
    radial-gradient(1px 1px at 120px 90px, rgba(170, 225, 255, 0.45), transparent 60%) 0 0 / 230px 210px,
    radial-gradient(1.5px 1.5px at 70px 150px, rgba(255, 255, 255, 0.35), transparent 60%) 0 0 / 310px 290px,
    radial-gradient(ellipse 90% 55% at 50% -12%, rgba(59, 231, 245, 0.16), transparent 62%),
    radial-gradient(ellipse 70% 45% at 110% 108%, rgba(59, 231, 245, 0.08), transparent 60%),
    linear-gradient(rgba(110, 200, 255, 0.045) 1px, transparent 1px) 0 0 / 34px 34px,
    linear-gradient(90deg, rgba(110, 200, 255, 0.045) 1px, transparent 1px) 0 0 / 34px 34px,
    var(--bg);
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hud-label { display: block; font-family: var(--font-hud); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); line-height: 1.4; }

/* ヘッダーと下部タブ */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(5, 8, 16, 0.94); border-bottom: 1px solid var(--line); }
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent); opacity: 0.55; }
.bar-in {
  max-width: 880px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px 24px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { position: relative; width: 22px; height: 22px; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent-glow), inset 0 0 6px var(--accent-glow); flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--accent); }
.brand-name { font-family: var(--font-hud); font-weight: 700; font-size: 18px; letter-spacing: 0.14em; }
.brand-name i { font-style: normal; color: var(--accent); margin: 0 1px; }
.brand-code { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.tabs { display: flex; gap: 4px; justify-content: center; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 3px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 13.5px; border: 1px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabs a[aria-current="page"] { color: var(--accent); border-color: var(--line-strong); background: var(--accent-soft); text-shadow: 0 0 10px var(--accent-glow); }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-state="cloud"] i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.sync[data-state="syncing"] i, .sync[data-state="saving"] i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.sync[data-state="waiting"] i { background: var(--flag); }
.sync[data-state="error"] i { background: var(--ng); }
@media (max-width: 720px) {
  .bar-in { grid-template-columns: 1fr auto; }
  .brand-code { display: none; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
    background: rgba(5, 8, 16, 0.96); border-top: 1px solid var(--line);
    padding-top: 4px;
    padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabs::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent); opacity: 0.5; }
  .tabs a { flex-direction: column; gap: 2px; padding: 6px 0 4px; font-size: 11px; border: 0; background: none; position: relative; }
  .tabs a[aria-current="page"] { background: none; }
  .tabs a[aria-current="page"]::before { content: ""; position: absolute; top: -5px; left: 30%; right: 30%; height: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .tabs svg { width: 22px; height: 22px; }
}

/* 本文 */
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-block: 24px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 26px;
}
@media (max-width: 720px) { .wrap { padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 22px; } }
.wrap > * { min-width: 0; }
.page-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-hud); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.35; letter-spacing: 0.02em; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.4; letter-spacing: 0.02em; }
h3 { font-size: 14px; font-weight: 700; }
.section h2[data-hud]::before, .page-head h1[data-hud]::before {
  content: attr(data-hud); display: block; margin-bottom: 4px;
  font-family: var(--font-hud); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; color: var(--accent);
}
.lead { color: var(--muted); }
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.small { font-size: 13px; }
.muted { color: var(--muted); }

/* ボタン */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; min-height: 44px; border-radius: 3px;
  border: 1px solid var(--line-strong); background: rgba(11, 20, 37, 0.7); color: var(--ink);
  font-weight: 700; font-size: 14px; letter-spacing: 0.04em; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 18px rgba(59, 231, 245, 0.35); }
.btn.primary:hover { color: var(--accent-ink); box-shadow: 0 0 26px var(--accent-glow); filter: brightness(1.06); }
.btn.danger { background: var(--ng); border-color: var(--ng); color: #1A0509; }
.btn.danger:hover { color: #1A0509; filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; box-shadow: none; filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* パネル共通 */
.card, .rows, .setup, .table-wrap, .exam-bar, .chart, .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.hero, .qcard, .score, .card.emph { background: var(--corners), var(--panel); border: 1px solid var(--line); border-radius: 2px; }

/* ホームのゲージ */
.hero { position: relative; overflow: hidden; padding: 18px 20px 20px; display: grid; gap: 14px; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border: 1px solid currentColor; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.status.go { color: var(--ok); }
.status.near { color: var(--flag); }
.status.low { color: var(--ng); }
.status.scan { color: var(--accent); }
.hero-main { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 22px; align-items: center; }
.gauge { position: relative; width: 176px; height: 176px; }
.gauge svg { position: relative; width: 100%; height: 100%; overflow: visible; }
.g-ticks { fill: none; stroke: rgba(110, 200, 255, 0.35); stroke-width: 3; stroke-dasharray: 1 6.72; }
.g-track { fill: none; stroke: rgba(110, 200, 255, 0.12); stroke-width: 8; }
.g-val { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(59, 231, 245, 0.6)); }
.g-pass { stroke: var(--flag); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(255, 181, 71, 0.7)); }
.g-sweep { position: absolute; inset: 16px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(59, 231, 245, 0.16) 50deg, transparent 52deg); }
.g-read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; }
.g-num { font-family: var(--font-hud); font-size: 44px; font-weight: 700; line-height: 1; color: var(--ink); text-shadow: 0 0 16px var(--accent-glow); font-variant-numeric: tabular-nums; }
.g-num small { font-size: 17px; color: var(--accent); margin-left: 1px; }
.g-cap { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.hero-side { display: grid; gap: 8px; min-width: 0; }
.hero-side h1 { font-size: 25px; }
.readouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 0; }
.readouts div { border-top: 1px solid var(--line-strong); padding-top: 6px; }
.readouts dt { font-size: 11.5px; color: var(--muted); }
.readouts dd { margin: 0; font-family: var(--font-hud); font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.readouts dd small { font-size: 13px; color: var(--muted); font-weight: 500; }
@media (max-width: 520px) {
  .hero { padding: 16px; }
  .hero-main { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 14px; }
  .hero-side { justify-items: center; }
  .hero-side h1 { font-size: 22px; }
  .readouts { width: 100%; text-align: left; }
}

/* ホームのカードと一覧 */
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { padding: 18px; display: grid; gap: 8px; align-content: start; }
.card h2 { font-size: 17px; }
.card p { font-size: 13.5px; color: var(--muted); }
.card .btn { justify-self: start; margin-top: 6px; }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--line-strong); border-radius: 3px; padding: 14px 18px; }
.resume p { font-weight: 700; }
@media (max-width: 720px) { .cards3 { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; }
.kpi .v { font-family: var(--font-hud); font-size: 28px; font-weight: 700; }
.rows .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 200px) auto; gap: 8px 16px; align-items: center; padding: 14px 18px; }
.rows .row + .row { border-top: 1px solid var(--line); }
.row .name { font-weight: 700; }
.row .sub { font-size: 12.5px; color: var(--muted); }
.row .stat { display: grid; gap: 4px; }
.row .stat .t { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.row .stat .t b { color: var(--ink); font-family: var(--font-hud); font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  .rows .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .stat { grid-column: 1 / -1; grid-row: 2; }
}
.meter { position: relative; height: 6px; background: rgba(110, 200, 255, 0.12); border-radius: 2px; }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: linear-gradient(90deg, rgba(59, 231, 245, 0.55), var(--accent)); box-shadow: 0 0 8px rgba(59, 231, 245, 0.5); }
.meter .pass { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--flag); border-radius: 1px; box-shadow: 0 0 6px rgba(255, 181, 71, 0.7); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--font-hud); font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; }
td.n { font-family: var(--font-hud); font-variant-numeric: tabular-nums; text-align: right; }
th.n { text-align: right; }
td .meter { width: 120px; }

/* チップ */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 2px; font-size: 12px; font-weight: 700; background: rgba(110, 200, 255, 0.08); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); border-color: rgba(76, 239, 161, 0.35); color: var(--ok); }
.chip.ng { background: var(--ng-soft); border-color: rgba(255, 94, 123, 0.35); color: var(--ng); }
.chip.flag { background: var(--flag-soft); border-color: rgba(255, 181, 71, 0.35); color: var(--flag); }
.chip svg { width: 14px; height: 14px; }

/* 出題設定 */
.setup { padding: 20px; display: grid; gap: 20px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 700; font-size: 14px; padding: 0; margin-bottom: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 3px; border: 1px solid var(--line-strong); font-size: 13.5px; font-weight: 700; color: var(--muted); background: rgba(5, 8, 16, 0.5); }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 12px rgba(59, 231, 245, 0.2); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
select { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); max-width: 100%; }
.setup-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }

/* 解答画面 */
.run-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.run-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.run-title .kind { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.run-title .pos { font-family: var(--font-hud); font-size: 14px; color: var(--muted); }
.run-title .pos b { color: var(--accent); font-size: 20px; text-shadow: 0 0 10px var(--accent-glow); }
.track { height: 3px; background: rgba(110, 200, 255, 0.12); border-radius: 2px; overflow: hidden; }
.track > span { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.qcard { padding: 22px 22px 20px; display: grid; gap: 18px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qmeta .qid { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.stem { font-size: 15.5px; line-height: 1.9; max-width: 68ch; }
.stem .need { font-weight: 700; color: var(--accent); }
.choices { display: grid; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  width: 100%; text-align: left; padding: 13px 14px; border: 1px solid var(--line); border-radius: 3px;
  background: rgba(5, 10, 20, 0.6); cursor: pointer; line-height: 1.75; font-size: 14.5px;
}
.choice:hover { border-color: var(--line-strong); background: rgba(59, 231, 245, 0.05); }
.choice .letter {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center;
  font-family: var(--font-hud); font-weight: 700; font-size: 13px; color: var(--accent); background: transparent;
}
.choice[role="checkbox"] .letter { border-radius: 3px; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent), 0 0 18px rgba(59, 231, 245, 0.15); }
.choice[aria-checked="true"] .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 10px var(--accent-glow); }
.choice .mark { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; white-space: nowrap; padding-top: 3px; }
.choice .mark svg { width: 16px; height: 16px; }
.choice[aria-disabled="true"] { cursor: default; }
.choice[aria-disabled="true"]:hover { border-color: var(--line); background: rgba(5, 10, 20, 0.6); }
.choice.is-correct, .choice.is-correct:hover { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok), 0 0 16px rgba(76, 239, 161, 0.14); }
.choice.is-correct .mark, .choice.is-correct .letter { color: var(--ok); border-color: var(--ok); }
.choice.is-wrong, .choice.is-wrong:hover { border-color: var(--ng); background: var(--ng-soft); box-shadow: inset 0 0 0 1px var(--ng); }
.choice.is-wrong .mark, .choice.is-wrong .letter { color: var(--ng); border-color: var(--ng); }
.choice.is-correct[aria-checked="true"] .letter { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); box-shadow: 0 0 10px rgba(76, 239, 161, 0.6); }
.choice.is-wrong[aria-checked="true"] .letter { background: var(--ng); border-color: var(--ng); color: #1A0509; box-shadow: none; }
.q-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.q-actions .hint { font-size: 12.5px; color: var(--muted); }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--muted); }
@media (max-width: 520px) {
  .qcard { padding: 18px 14px 16px; }
  .choice { grid-template-columns: 26px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .choice .letter { width: 26px; height: 26px; }
  .choice .mark { grid-column: 2; padding-top: 0; }
  .kbd-hint { display: none; }
}

/* 解説 */
.fb { display: grid; gap: 18px; }
.verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-radius: 3px; font-size: 15px; border: 1px solid currentColor; }
.verdict svg { width: 22px; height: 22px; flex: none; }
.verdict strong { font-family: var(--font-display); font-size: 19px; text-shadow: 0 0 12px currentColor; }
.verdict .hud-label { color: currentColor; opacity: 0.8; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); box-shadow: 0 0 22px rgba(76, 239, 161, 0.12); }
.verdict.ng { background: var(--ng-soft); color: var(--ng); box-shadow: 0 0 22px rgba(255, 94, 123, 0.1); }
.verdict .ans { color: var(--ink); font-size: 14px; margin-left: auto; }
.fb-block { display: grid; gap: 8px; }
.fb-block h3 { color: var(--accent); font-family: var(--font-display); }
.fb-block > p { max-width: 70ch; }
.whys { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.whys li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.whys .wl { width: 26px; height: 26px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-hud); font-weight: 700; font-size: 12.5px; border: 1px solid var(--line-strong); color: var(--muted); }
.whys li.w-ok .wl { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.whys .wtag { font-size: 12px; font-weight: 700; color: var(--muted); }
.whys li.w-ok .wtag { color: var(--ok); }
.whys p { font-size: 14px; max-width: 70ch; }
.point { border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 2px; padding: 14px 16px; display: grid; gap: 6px; }
.point h3 { color: var(--accent); }

/* 構成図 */
.figure { margin: 0; display: grid; gap: 8px; }
.figure figcaption { font-size: 13px; font-weight: 700; color: var(--muted); }
.dg-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--d-bg); padding: 6px; }
.dg { display: block; height: auto; }
.dg text { font-family: var(--font-body); fill: var(--ink); }
.dg .n-box { fill: color-mix(in srgb, var(--k) 12%, var(--d-bg)); stroke: var(--k); stroke-width: 1.5; }
.dg .n-kind { fill: var(--k); }
.dg .n-label { font-size: 12.5px; font-weight: 700; }
.dg .n-label.tight { font-size: 11.5px; }
.dg .n-sub { font-size: 10px; fill: var(--muted); }
.dg .e-line { stroke: var(--d-edge); stroke-width: 1.6; fill: none; }
.dg .e-line.dashed { stroke-dasharray: 5 4; }
.dg .e-head { fill: var(--d-edge); }
.dg .e-label { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--d-bg); stroke-width: 4px; stroke-linejoin: round; }
.dg .g rect { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.dg .g-label { font-size: 10.5px; font-weight: 700; paint-order: stroke; stroke: var(--d-bg); stroke-width: 5px; stroke-linejoin: round; fill: var(--muted); }
.dg .g-region rect { stroke-dasharray: 7 4; }
.dg .g-az rect { stroke: var(--accent); stroke-dasharray: 4 3; }
.dg .g-az .g-label { fill: var(--accent); }
.dg .g-vpc rect { stroke: var(--k-network); stroke-width: 1.5; }
.dg .g-vpc .g-label { fill: var(--k-network); }
.dg .g-subnet-public rect { fill: var(--d-pub); stroke: var(--k-storage); stroke-opacity: 0.5; }
.dg .g-subnet-public .g-label { fill: var(--k-storage); }
.dg .g-subnet-private rect { fill: var(--d-priv); stroke: var(--k-database); stroke-opacity: 0.5; }
.dg .g-subnet-private .g-label { fill: var(--k-database); }
.dg .g-account rect { stroke: var(--ink); stroke-opacity: 0.5; }
.dg .g-onprem rect { fill: var(--d-onprem); stroke: var(--k-onprem); stroke-dasharray: 6 3; }
.dg .g-onprem .g-label { fill: var(--k-onprem); }

/* 模試 */
.exam-bar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 16px; }
.exam-bar .pos { font-family: var(--font-hud); color: var(--muted); }
.exam-bar .pos b { color: var(--accent); font-size: 20px; text-shadow: 0 0 10px var(--accent-glow); }
.exam-bar .grow { flex: 1; }
.exam-bar .hud-label { display: inline; }
.timer { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); letter-spacing: 0.04em; }
.timer.low { color: var(--ng); text-shadow: 0 0 12px rgba(255, 94, 123, 0.6); }
.exam-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.flag-btn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.grid-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.grid-nav button {
  position: relative; height: 38px; border-radius: 2px; border: 1px solid var(--line); background: rgba(5, 10, 20, 0.6);
  font-family: var(--font-hud); font-size: 12.5px; cursor: pointer; color: var(--muted);
}
.grid-nav button.ans { background: rgba(59, 231, 245, 0.14); color: var(--ink); border-color: rgba(59, 231, 245, 0.3); }
.grid-nav button.cur { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(59, 231, 245, 0.35); font-weight: 700; }
.grid-nav button.flg::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); box-shadow: 0 0 6px var(--flag); }
.grid-nav button.r-ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(76, 239, 161, 0.35); }
.grid-nav button.r-ng { background: var(--ng-soft); color: var(--ng); border-color: rgba(255, 94, 123, 0.35); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line-strong); display: inline-block; }
.legend i.ans { background: rgba(59, 231, 245, 0.14); border-color: rgba(59, 231, 245, 0.3); }
.legend i.flg { background: var(--flag); border-color: var(--flag); border-radius: 50%; width: 8px; height: 8px; }
.legend i.r-ok { background: var(--ok-soft); border-color: var(--ok); }
.legend i.r-ng { background: var(--ng-soft); border-color: var(--ng); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.rules li::marker { color: var(--accent); }
.score { display: grid; gap: 12px; padding: 20px; }
.score .big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .pct { font-family: var(--font-hud); font-size: 48px; font-weight: 700; line-height: 1; text-shadow: 0 0 16px var(--accent-glow); font-variant-numeric: tabular-nums; }
.score .pct small { font-size: 20px; color: var(--accent); }
.score .meter { height: 10px; }
.score .scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-family: var(--font-hud); }

/* 確認パネル */
.confirm { border: 1px solid var(--ng); background: var(--ng-soft); border-radius: 3px; padding: 16px 18px; display: grid; gap: 12px; }
.confirm.neutral { border-color: var(--accent); background: var(--accent-soft); }
.confirm p { font-weight: 700; }

/* グラフ */
.chart { position: relative; padding: 14px 14px 8px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font-hud); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .pass { stroke: var(--flag); stroke-opacity: 0.85; stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .pass-label { fill: var(--flag); font-family: var(--font-body); font-weight: 700; }
.chart .bar { fill: var(--accent); filter: drop-shadow(0 0 4px rgba(59, 231, 245, 0.5)); }
.chart .hit { fill: transparent; cursor: default; }
.chart g:hover .bar { filter: drop-shadow(0 0 8px var(--accent)); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 10px; border-radius: 3px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }

.empty { background: rgba(11, 20, 37, 0.5); border: 1px dashed var(--line-strong); border-radius: 3px; padding: 22px; color: var(--muted); display: grid; gap: 10px; justify-items: start; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .choice, .tabs a, .opt span, .grid-nav button { transition: background-color 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s; }
  .g-sweep { animation: sweep 5s linear infinite; }
  .status i, .sync[data-state="syncing"] i, .sync[data-state="saving"] i { animation: blink 1.6s ease-in-out infinite; }
  .timer.low { animation: blink 1s ease-in-out infinite; }
  .g-val { animation: charge 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
}
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: 0.35; } }
@keyframes charge { from { stroke-dasharray: 0 400; } }
</style>

<script>
(function () {
'use strict';

const QUESTIONS = [{"id":"d1-01","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、AWS Organizations で 20 個の AWS アカウントを管理しています。運用チームは、運用アカウントの Amazon EC2 インスタンスで実行される自社製の運用ツールから、各メンバーアカウントの EC2 インスタンスの一覧を取得し、夜間に開発用インスタンスを停止したいと考えています。セキュリティポリシーにより、長期的な認証情報をツールに保存することは禁止されています。また、ツールに許可する操作は、各メンバーアカウントの管理者が自分のアカウント側で管理できる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["各メンバーアカウントに EC2 の操作を許可した IAM ユーザーを作成し、アクセスキーを発行する。アクセスキーは運用アカウントの AWS Secrets Manager に保存し、ツールが実行時に取得する。","運用アカウントで EC2 の参照と停止を許可する SCP を作成し、すべてのメンバーアカウントにアタッチする。ツールのインスタンスプロファイルにも同じ操作を許可するポリシーを付与する。","各メンバーアカウントに EC2 の参照と停止を許可した IAM ロールを作成し、信頼ポリシーでツール用のロールを信頼する。ツールは AWS STS の AssumeRole で一時的な認証情報を取得する。","ツールのインスタンスプロファイルに付与する IAM ポリシーで、各メンバーアカウントの EC2 インスタンスの ARN を Resource に指定して参照と停止を許可する。メンバーアカウント側の設定は変更しない。"],"answer":[2],"why":["IAM ユーザーのアクセスキーは長期的な認証情報であり、保存先が Secrets Manager でも禁止事項に当たる。アカウントごとにキーをローテーションする運用負荷も大きい。","SCP はアクセス許可の上限を定める仕組みで、権限を付与するものではない。SCP を設定しても、別のアカウントのリソースを操作するための許可は得られない。","メンバーアカウント側のロールの信頼ポリシーと権限ポリシーで、誰に何を許可するかを各アカウントの管理者が管理できる。AssumeRole で得る認証情報は一時的なもので、有効期限が切れると使えなくなる。","EC2 にはリソースベースポリシーがないため、自アカウントの IAM ポリシーだけでは別アカウントの EC2 を操作できない。メンバーアカウントの管理者が許可を管理するという要件も満たさない。"],"explain":"「長期的な認証情報を使わない」「相手のアカウントの管理者が許可を管理する」という 2 つの要件から、クロスアカウントの IAM ロールと AWS STS の AssumeRole を選ぶ。アカウントをまたぐアクセスは、呼び出す側の IAM ポリシー（sts:AssumeRole の許可）と、呼び出される側のロールの信頼ポリシーの両方で許可されて初めて成立する。SCP は権限を与えない点もよく問われる。","point":"別アカウントのリソースを一時的な認証情報で操作するなら、クロスアカウントロール＋ sts:AssumeRole。信頼ポリシーは相手側で管理する。","diagram":{"caption":"正解の構成: メンバーアカウントのロールを AssumeRole で引き受ける","cols":4,"rows":1,"groups":[{"label":"運用アカウント","kind":"account","c":0,"r":0,"w":1,"h":1},{"label":"メンバーアカウント","kind":"account","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"tool","label":"運用ツール","sub":"EC2 のツール用ロール","kind":"compute","c":0,"r":0},{"id":"sts","label":"AWS STS","sub":"AssumeRole","kind":"security","c":1,"r":0},{"id":"role","label":"IAM ロール","sub":"信頼ポリシーで許可","kind":"security","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"開発用インスタンス","kind":"compute","c":3,"r":0}],"edges":[{"from":"tool","to":"sts","label":"AssumeRole"},{"from":"sts","to":"role","label":"一時認証情報"},{"from":"role","to":"ec2","label":"参照・停止"}]}},{"id":"d1-02","domain":1,"topic":"IAM","type":"single","stem":"ある企業では、開発チームが AWS Lambda 関数を頻繁に追加しており、関数ごとの実行ロールの作成をセキュリティチームに依頼しているため、リリースが遅れています。セキュリティチームは、開発者が自分で IAM ロールを作成できるようにしたいと考えています。ただし、開発者が作成するロールには、特定の Amazon DynamoDB テーブルと Amazon S3 バケットへのアクセスを超える権限を与えられないようにし、開発者自身が権限を昇格できないようにする必要があります。セキュリティチームが管理する既存のロールには影響を与えてはいけません。これらの要件を満たすソリューションはどれですか。","choices":["許可する最大の権限を定義した管理ポリシーを作成し、アクセス許可の境界として使う。開発者には、この境界の指定を条件として iam:CreateRole などを許可し、境界ポリシー自体の変更は拒否する。","開発者に IAMFullAccess を付与し、作成されたロールを IAM Access Analyzer で毎週確認する。過剰な権限を持つロールが見つかった場合は、セキュリティチームが権限を修正する。","AWS Organizations で、DynamoDB テーブルと S3 バケット以外への操作を拒否する SCP を作成する。この SCP を、開発チームが使用する AWS アカウントにアタッチする。","開発者の IAM グループのポリシーで、ロール名が dev- で始まる場合にだけ iam:CreateRole と iam:AttachRolePolicy を許可する。それ以外の名前のロールは作成できないようにする。"],"answer":[0],"why":["アクセス許可の境界を設定したロールは、アイデンティティベースポリシーと境界の両方で許可された操作しか実行できない。iam:PermissionsBoundary 条件で境界の設定を強制し、境界ポリシーの変更を拒否すれば、権限の昇格も防げる。","作成後に確認する発見的な統制であり、確認までの間は過剰な権限のロールが使えてしまう。IAMFullAccess を持つ開発者は自分の権限も昇格できる。","SCP はアカウント内のすべての IAM ユーザーとロールに効くため、セキュリティチームが管理する既存のロールの権限まで制限してしまう。","ロール名は制限できても、そのロールに AdministratorAccess などの強い権限をアタッチすることは防げない。"],"explain":"「開発者にロールの作成を委任しつつ、作成されるロールの権限に上限を設ける」という要件には、アクセス許可の境界（permissions boundary）を使う。境界は権限を与えるものではなく、実際に使える権限の上限を決めるもので、開発者のポリシーに iam:PermissionsBoundary 条件を付けると、境界を設定しないロールの作成を拒否できる。SCP も上限を決める仕組みだが、アカウント全体に効くため「既存のロールに影響を与えない」を満たさない。","point":"権限の作成を委任しつつ上限を固定するなら、アクセス許可の境界と iam:PermissionsBoundary 条件。SCP はアカウント全体に効く。","diagram":null},{"id":"d1-03","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、AWS Organizations で 15 個の AWS アカウントを運用しています。現在は各アカウントに IAM ユーザーを作成しており、退職者の IAM ユーザーの削除漏れが監査で指摘されました。この企業は、従業員の ID を SAML 2.0 に対応した既存の外部 ID プロバイダー（IdP）で管理しています。従業員が IdP の認証情報で各アカウントにシングルサインオンでき、部署ごとの権限を一元的に管理でき、IdP でユーザーを無効にすると AWS にもアクセスできなくなる仕組みが必要です。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各アカウントの IAM ユーザーに MFA を必須にする。人事システムの退職情報をもとに IAM ユーザーを削除する AWS Lambda 関数を作成し、毎日実行する。","各アカウントで、外部 IdP を IAM の SAML ID プロバイダーとして登録する。部署ごとの IAM ロールを各アカウントに作成し、IdP の属性に応じてロールを割り当てる。","Amazon Cognito ユーザープールを作成し、外部 IdP と SAML で連携する。ユーザープールのグループごとに IAM ロールを割り当て、AWS マネジメントコンソールにサインインさせる。","AWS IAM Identity Center を有効にし、外部 IdP を ID ソースとして SAML と SCIM で接続する。部署ごとの許可セットを作成し、グループとアカウントに割り当てる。"],"answer":[3],"why":["IAM ユーザーを使い続けるため、シングルサインオンにならない。削除の仕組みも自作となり、運用負荷が大きい。","IdP との連携とシングルサインオンは実現できるが、15 個のアカウントそれぞれで ID プロバイダーとロールを作成・維持する必要があり、運用負荷が大きい。","Cognito はアプリケーションの利用者を認証するためのサービスであり、従業員が複数の AWS アカウントのコンソールにアクセスする用途には向かない。","Identity Center は Organizations と統合されており、許可セットを複数のアカウントに一元的に割り当てられる。SCIM でユーザーとグループが自動で同期されるため、IdP で無効にしたユーザーは AWS にもアクセスできなくなる。"],"explain":"「複数アカウントへのシングルサインオン」「権限の一元管理」「既存の外部 IdP」がそろったら IAM Identity Center を選ぶ。許可セットをアカウントに割り当てると、各アカウントに対応する IAM ロールが自動で作成される。アカウントごとの IAM SAML フェデレーションでも同じことはできるが、アカウントの数だけ設定を維持する必要がある。Cognito はアプリケーションのエンドユーザー向けのサービスで、従業員の AWS へのアクセスには使わない。","point":"従業員の複数アカウントへの SSO は IAM Identity Center ＋許可セット。外部 IdP とは SAML で認証し、SCIM でユーザーを同期する。","diagram":{"caption":"正解の構成: IAM Identity Center の許可セットで各アカウントに SSO","cols":4,"rows":2,"groups":[{"label":"AWS Organizations","kind":"generic","c":2,"r":0,"w":2,"h":2},{"label":"開発アカウント","kind":"account","c":3,"r":0,"w":1,"h":1},{"label":"本番アカウント","kind":"account","c":3,"r":1,"w":1,"h":1}],"nodes":[{"id":"user","label":"従業員","kind":"client","c":0,"r":0},{"id":"idp","label":"外部 IdP","sub":"SAML 2.0 / SCIM","kind":"security","c":1,"r":0},{"id":"ic","label":"Identity Center","sub":"部署ごとの許可セット","kind":"security","c":2,"r":0},{"id":"dev","label":"IAM ロール","sub":"許可セットで作成","kind":"security","c":3,"r":0},{"id":"prod","label":"IAM ロール","sub":"許可セットで作成","kind":"security","c":3,"r":1}],"edges":[{"from":"user","to":"idp","label":"サインイン"},{"from":"idp","to":"ic","label":"SAML 認証"},{"from":"ic","to":"dev","label":"割り当て"},{"from":"ic","to":"prod","label":"割り当て"}]}},{"id":"d1-04","domain":1,"topic":"Organizations","type":"single","stem":"ある企業は、AWS Organizations で複数の AWS アカウントを管理しています。データの保管場所に関する規制に対応するため、すべてのメンバーアカウントで、東京リージョンと大阪リージョン以外のリージョンにリソースを作成できないようにする必要があります。また、監査のために、メンバーアカウントのルートユーザーや管理者を含むすべてのユーザーが、AWS CloudTrail の証跡を停止または削除できないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["各メンバーアカウントで、aws:RequestedRegion 条件で 2 つのリージョン以外への操作を拒否し、CloudTrail の証跡の停止と削除も拒否する IAM ポリシーを作成する。すべての IAM ユーザーとロールにアタッチする。","aws:RequestedRegion 条件で 2 つのリージョン以外への操作を拒否し、CloudTrail の証跡の停止と削除も拒否する SCP を作成する。メンバーアカウントを含む OU にアタッチする。","AWS Config ルールで、許可されていないリージョンのリソースと、停止された CloudTrail の証跡を検出する。違反を検出したら Amazon SNS でセキュリティチームに通知する。","各メンバーアカウントのすべての IAM ロールに、2 つのリージョン以外への操作と CloudTrail の証跡の停止を拒否するアクセス許可の境界を設定する。"],"answer":[1],"why":["IAM ポリシーはルートユーザーには適用できない。アカウントの管理者がポリシーをデタッチすれば、制限を外せてしまう。","SCP は、メンバーアカウントのルートユーザーを含むすべての IAM ユーザーとロールについて、使える権限の上限を決める。メンバーアカウント側からは変更できないため、管理者も制限を外せない。","違反を後から検出して通知するだけで、リソースの作成や証跡の停止そのものは防げない。","アクセス許可の境界はルートユーザーには設定できない。管理者が境界を外したり、境界のないロールを作成したりもできる。"],"explain":"「メンバーアカウントのルートユーザーや管理者を含む」「できないようにする（予防）」が決め手で、Organizations の SCP を選ぶ。SCP は管理アカウントには適用されないが、メンバーアカウントではルートユーザーも含めて効く。リージョンを制限する SCP では、IAM や CloudFront などのグローバルサービスを NotAction で除外しておくのが一般的である。Config ルールは発見的な統制で、予防にはならない。","point":"メンバーアカウント全体（ルートユーザーを含む）の操作を予防的に禁止するなら SCP。SCP は管理アカウントには効かない。","diagram":{"caption":"正解の構成: OU にアタッチした SCP でメンバーアカウントの操作を制限","cols":3,"rows":2,"groups":[{"label":"AWS Organizations","kind":"generic","c":0,"r":0,"w":3,"h":2},{"label":"OU（ワークロード）","kind":"generic","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"mgmt","label":"管理アカウント","sub":"SCP を作成","kind":"management","c":0,"r":0},{"id":"scp","label":"SCP","sub":"リージョンと証跡","kind":"security","c":1,"r":0},{"id":"prod","label":"本番アカウント","sub":"ルートユーザーも制限","kind":"management","c":2,"r":0},{"id":"dev","label":"開発アカウント","sub":"ルートユーザーも制限","kind":"management","c":2,"r":1}],"edges":[{"from":"mgmt","to":"scp","label":"作成"},{"from":"scp","to":"prod","label":"OU にアタッチ"},{"from":"scp","to":"dev"}]}},{"id":"d1-05","domain":1,"topic":"Organizations","type":"single","stem":"あるスタートアップ企業は、事業の拡大に伴い、1 つの AWS アカウントから複数アカウントの構成に移行することを計画しています。この企業は、AWS のベストプラクティスに沿ったマルチアカウント環境を短期間で構築したいと考えています。ログを集約するアカウントと監査用のアカウントを用意し、すべてのアカウントに予防的および発見的なガードレールを適用し、新しいアカウントを標準化された設定で払い出せる必要があります。セキュリティ担当者は少人数のため、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["AWS Organizations で OU と SCP を設計する。ログ集約用と監査用のアカウントを手動で作成し、AWS CloudFormation StackSets で CloudTrail と AWS Config の設定を各アカウントに展開する。","各アカウントに AWS Config の適合パックをデプロイし、ベストプラクティスからの逸脱を検出する。新しいアカウントは AWS CLI のスクリプトで作成し、適合パックを追加でデプロイする。","AWS Control Tower でランディングゾーンをセットアップし、ログアーカイブと監査のアカウントを作成する。コントロールを OU に適用し、新しいアカウントは Account Factory で払い出す。","AWS Security Hub を有効にし、AWS 基礎セキュリティのベストプラクティス標準で全アカウントを評価する。検出結果は管理者アカウントに集約し、セキュリティ担当者が対応する。"],"answer":[2],"why":["要件は満たせるが、OU の設計、アカウントの作成、StackSets のテンプレートの管理などをすべて自前で構築・維持する必要があり、運用負荷が大きい。","適合パックは発見的な統制であり、予防的なガードレールにはならない。アカウントの払い出しもスクリプトの自作になる。","Control Tower は、ベストプラクティスに沿ったランディングゾーンを自動で構築し、ログアーカイブと監査のアカウント、予防的・発見的なコントロール、Account Factory によるアカウントの払い出しをまとめて提供する。","Security Hub は検出結果を集約して評価するサービスで、予防的なガードレールやアカウントの払い出しの機能はない。"],"explain":"「ベストプラクティスに沿ったマルチアカウント環境を短期間で」「ガードレール」「アカウントの払い出し」「運用上のオーバーヘッドを最小限に」がそろったら AWS Control Tower を選ぶ。Control Tower は Organizations、IAM Identity Center、CloudTrail、Config などを組み合わせたランディングゾーンを自動で構築する。予防的なコントロールは主に SCP、発見的なコントロールは Config ルールとして実装される。同じことを Organizations と StackSets で自作もできるが、運用負荷が大きい。","point":"マルチアカウント環境を短期間・少人数で整えるなら Control Tower（ランディングゾーン、コントロール、Account Factory）。","diagram":null},{"id":"d1-06","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、独自の UDP プロトコルを使うオンラインゲームのサーバーを、VPC のパブリックサブネットにある Amazon EC2 インスタンスで運用しています。セキュリティチームは、特定の IP アドレス範囲（203.0.113.0/24）から大量の不正なトラフィックが届いていることを確認しました。ソリューションアーキテクトは、このサブネット内のすべてのインスタンスに対して、この IP アドレス範囲からのトラフィックを直ちに遮断する必要があります。ほかのプレイヤーからの通信は引き続き許可する必要があります。ソリューションアーキテクトはどうすべきですか。","choices":["サブネットに関連付けられたネットワーク ACL に、203.0.113.0/24 からのインバウンドトラフィックを拒否するルールを追加する。既存の許可ルールより小さいルール番号を付ける。","インスタンスのセキュリティグループに、203.0.113.0/24 からのインバウンドトラフィックを拒否するルールを追加する。既存の許可ルールより優先度を高く設定する。","AWS WAF で 203.0.113.0/24 を含む IP セットを作成する。この IP セットからのリクエストをブロックするルールを持つウェブ ACL を、各 EC2 インスタンスに関連付ける。","Amazon GuardDuty を有効にし、203.0.113.0/24 を脅威リストに登録する。この範囲からの通信を、GuardDuty に脅威として扱わせる。"],"answer":[0],"why":["ネットワーク ACL には拒否ルールを書くことができ、ルール番号の小さい順に評価される。サブネット単位で効くため、サブネット内のすべてのインスタンスへの通信をまとめて遮断できる。","セキュリティグループには許可ルールしかなく、拒否ルールや優先度は設定できない。","AWS WAF は CloudFront、ALB、API Gateway などに関連付けるサービスで、EC2 インスタンスには直接関連付けられない。HTTP 以外の UDP トラフィックも検査できない。","GuardDuty の脅威リストは検出結果を生成するためのもので、通信を遮断する機能はない。"],"explain":"「特定の IP アドレス範囲を拒否する」「サブネット内のすべてのインスタンス」が決め手で、ネットワーク ACL の拒否ルールを選ぶ。セキュリティグループは許可ルールだけを書くステートフルなファイアウォールで、特定の送信元だけを拒否することはできない。ネットワーク ACL はステートレスで、ルール番号の小さい順に評価され、最初に一致したルールが適用される。UDP のゲームサーバーなので、HTTP を対象とする AWS WAF は候補にならない。","point":"特定の IP を「拒否」するならネットワーク ACL（ルール番号の小さい順に評価）。セキュリティグループは許可ルールだけ。","diagram":{"caption":"正解の構成: ネットワーク ACL の拒否ルールで特定の範囲を遮断","cols":4,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":3,"h":1},{"label":"パブリックサブネット","kind":"subnet-public","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"bad","label":"不正な送信元","sub":"203.0.113.0/24","kind":"client","c":0,"r":0},{"id":"player","label":"プレイヤー","sub":"正規の利用者","kind":"client","c":0,"r":1},{"id":"igw","label":"IGW","sub":"インターネット GW","kind":"network","c":1,"r":0},{"id":"nacl","label":"NACL","sub":"Deny 203.0.113.0/24","kind":"security","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"UDP ゲームサーバー","kind":"compute","c":3,"r":0}],"edges":[{"from":"bad","to":"igw","label":"不正な通信"},{"from":"player","to":"igw","label":"正規の通信"},{"from":"igw","to":"nacl"},{"from":"nacl","to":"ec2","label":"許可された通信"}]}},{"id":"d1-07","domain":1,"topic":"VPC","type":"single","stem":"ある金融サービス企業は、プライベートサブネットの Amazon EC2 インスタンスから NAT ゲートウェイ経由でインターネットにアクセスしています。セキュリティポリシーの改定により、インスタンスからのアウトバウンド通信を、承認済みの一部のドメイン（OS のパッケージリポジトリと取引先の API）だけに制限する必要があります。IP アドレスを直接指定した通信も含め、それ以外の宛先への通信はすべて遮断しなければなりません。この企業は、プロキシサーバーなどのインスタンスを自社で管理することは避けたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["プライベートサブネットのインスタンスのセキュリティグループで、アウトバウンドルールをポート 443 宛ての通信だけを許可するように変更する。それ以外のアウトバウンドルールは削除する。","パブリックサブネットに Squid などのプロキシサーバーを EC2 で構築し、Auto Scaling グループで冗長化する。プロキシに承認済みドメインの許可リストを設定する。","Amazon Route 53 Resolver DNS Firewall のルールグループを作成し、承認済みドメイン以外の名前解決をブロックするルールを設定する。ルールグループを VPC に関連付ける。","AWS Network Firewall をデプロイし、承認済みドメインだけを許可するステートフルルールグループを設定する。アウトバウンド通信がファイアウォールを経由するようにルートを変更する。"],"answer":[3],"why":["セキュリティグループは IP アドレスとポートでしか制御できず、ドメイン名で宛先を絞れない。ポート 443 であれば、どの宛先にも通信できてしまう。","要件は満たせるが、プロキシインスタンスのパッチ適用や可用性の管理を自社で行う必要があり、インスタンスを管理したくないという要件に反する。","DNS の名前解決をブロックするだけなので、IP アドレスを直接指定した通信は遮断できない。","Network Firewall はマネージドサービスで、HTTP の Host ヘッダーや TLS の SNI でドメインを判定できる。許可リストに一致しない通信を破棄するように設定すれば、IP アドレスを直接指定した通信も遮断できる。"],"explain":"「ドメイン名でアウトバウンド通信を制限」「IP アドレスを直接指定した通信も遮断」「インスタンスを管理しない」が決め手で、AWS Network Firewall を選ぶ。DNS Firewall は名前解決だけを制御するため、IP アドレスでの直接の通信は防げない。セキュリティグループとネットワーク ACL はドメイン名を扱えない。プロキシの自前構築は要件を満たすが、運用負荷が大きい。","point":"VPC からの通信をドメイン名で制限し、IP の直接指定も防ぐなら Network Firewall。DNS Firewall は名前解決だけを制御する。","diagram":{"caption":"正解の構成: Network Firewall で宛先ドメインを制限","cols":5,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":4,"h":1},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":1,"h":1},{"label":"パブリックサブネット","kind":"subnet-public","c":1,"r":0,"w":1,"h":1},{"label":"ファイアウォールサブネット","kind":"subnet-public","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"アプリケーション","kind":"compute","c":0,"r":0},{"id":"nat","label":"NAT ゲートウェイ","kind":"network","c":1,"r":0},{"id":"nfw","label":"Network Firewall","sub":"ドメインの許可リスト","kind":"security","c":2,"r":0},{"id":"igw","label":"IGW","sub":"インターネット GW","kind":"network","c":3,"r":0},{"id":"dest","label":"承認済みドメイン","sub":"リポジトリ・API","kind":"client","c":4,"r":0}],"edges":[{"from":"ec2","to":"nat"},{"from":"nat","to":"nfw"},{"from":"nfw","to":"igw"},{"from":"igw","to":"dest","label":"許可のみ"}]}},{"id":"d1-08","domain":1,"topic":"VPC エンドポイント","type":"single","stem":"ある企業は、インターネットへの経路を持たないプライベートサブネットの Amazon EC2 インスタンスで、注文処理アプリケーションを実行しています。新しい機能として、アプリケーションから Amazon SQS キューにメッセージを送信する必要があります。セキュリティポリシーにより、VPC からインターネットへの経路を作成することは禁止されています。アプリケーションは AWS SDK の既定のエンドポイント名で SQS にアクセスする実装になっており、開発チームはコードを変更したくないと考えています。これらの要件を満たすソリューションはどれですか。","choices":["パブリックサブネットに NAT ゲートウェイを作成し、プライベートサブネットのルートテーブルに追加する。インスタンスのセキュリティグループで HTTPS のアウトバウンド通信だけを許可する。","SQS 用のインターフェイス型 VPC エンドポイントをプライベートサブネットに作成し、プライベート DNS を有効にする。エンドポイントのセキュリティグループでインスタンスからの HTTPS を許可する。","SQS 用のインターフェイス型 VPC エンドポイントをプライベートサブネットに作成し、プライベート DNS は無効のままにする。エンドポイントのセキュリティグループでインスタンスからの HTTPS を許可する。","Egress-Only インターネットゲートウェイを作成し、プライベートサブネットのルートテーブルに追加する。インスタンスから開始した送信方向の通信だけが許可されるようにする。"],"answer":[1],"why":["NAT ゲートウェイはインターネットへの経路を作るため、セキュリティポリシーに反する。","プライベート DNS を有効にすると、SQS の既定のエンドポイント名がエンドポイントのプライベート IP アドレスに解決される。コードを変えずに、インターネットを経由しない AWS PrivateLink 経由の通信になる。","プライベート DNS が無効だと、既定のエンドポイント名はパブリック IP アドレスに解決され、インターネットへの経路がないため接続できない。エンドポイント固有の DNS 名を使うようにコードを変更する必要がある。","Egress-Only インターネットゲートウェイは IPv6 用で、インターネットへの経路を作る点でもセキュリティポリシーに反する。"],"explain":"「インターネットへの経路を作れない」「SQS」「コードを変更しない」が決め手である。SQS はゲートウェイ型エンドポイントに対応していないため、インターフェイス型エンドポイント（AWS PrivateLink）を使う。プライベート DNS を有効にすると、VPC 内からはサービスの既定の DNS 名がエンドポイントの ENI に解決されるので、SDK の設定やコードを変える必要がない。","point":"S3・DynamoDB 以外の AWS サービスへのプライベート接続はインターフェイス型エンドポイント。プライベート DNS を有効にすればコードの変更は不要。","diagram":{"caption":"正解の構成: プライベート DNS 有効の SQS 用エンドポイント","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1},{"label":"プライベートサブネット","kind":"subnet-private","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"注文処理アプリ","kind":"compute","c":0,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"Private DNS 有効","kind":"network","c":1,"r":0},{"id":"sqs","label":"SQS キュー","kind":"integration","c":2,"r":0}],"edges":[{"from":"ec2","to":"vpce","label":"HTTPS"},{"from":"vpce","to":"sqs","label":"PrivateLink"}]}},{"id":"d1-09","domain":1,"topic":"VPC エンドポイント","type":"single","stem":"ある SaaS 事業者は、自社の VPC 内で Network Load Balancer（NLB）の背後にある Amazon EC2 インスタンスで API を提供しています。数百社の顧客が、それぞれの AWS アカウントの VPC からこの API にプライベートに接続することを求めています。顧客の VPC の CIDR ブロックの多くは、事業者の VPC と重複しています。事業者は、API 以外の自社リソースを顧客のネットワークに公開したくなく、接続は顧客側からだけ開始できるようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["NLB を使って VPC エンドポイントサービスを作成し、顧客の AWS アカウントを許可するプリンシパルに追加する。顧客は自分の VPC にインターフェイス型 VPC エンドポイントを作成して接続する。","事業者の VPC と各顧客の VPC の間に VPC ピアリング接続を作成する。各 VPC のルートテーブルとセキュリティグループで、API のサブネットへの通信だけを許可する。","AWS Transit Gateway を作成して AWS RAM で顧客と共有し、顧客の VPC をアタッチしてもらう。Transit Gateway のルートテーブルで API のサブネットへの経路だけを伝播する。","NLB をインターネット向けに作り直し、顧客の NAT ゲートウェイの IP アドレスからの通信だけをセキュリティグループで許可する。通信は TLS で暗号化する。"],"answer":[0],"why":["AWS PrivateLink では、顧客の VPC 内のエンドポイントから事業者の NLB へ一方向にだけ接続でき、CIDR ブロックが重複していても問題ない。公開されるのはエンドポイントサービスの背後のサービスだけである。","VPC ピアリングは CIDR ブロックが重複する VPC 間では作成できない。数百の接続とルートの管理も大きな負担になる。","Transit Gateway もルーティングで VPC どうしをつなぐため、CIDR ブロックが重複していると経路を正しく設定できない。ネットワークどうしを接続するので、公開範囲の管理も複雑になる。","通信がインターネットを経由するため、プライベートに接続するという要件を満たさない。"],"explain":"「サービスだけを公開」「CIDR ブロックの重複」「顧客側からだけ接続を開始」がそろったら、AWS PrivateLink（VPC エンドポイントサービス）を選ぶ。サービスの提供側は NLB をエンドポイントサービスとして登録し、利用側は自分の VPC にインターフェイス型エンドポイントを作成する。ネットワークどうしをルーティングでつなぐ VPC ピアリングや Transit Gateway と違い、アドレス空間が重複していても使える。","point":"多数の VPC にサービスだけをプライベートに公開するなら PrivateLink（NLB ＋エンドポイントサービス）。CIDR の重複も問題ない。","diagram":{"caption":"正解の構成: NLB をエンドポイントサービスとして PrivateLink で公開","cols":4,"rows":1,"groups":[{"label":"顧客の VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1},{"label":"SaaS 事業者の VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"app","label":"顧客アプリ","sub":"EC2","kind":"compute","c":0,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"顧客が作成","kind":"network","c":1,"r":0},{"id":"nlb","label":"NLB","sub":"Endpoint Service","kind":"network","c":2,"r":0},{"id":"api","label":"EC2","sub":"API サーバー","kind":"compute","c":3,"r":0}],"edges":[{"from":"app","to":"vpce"},{"from":"vpce","to":"nlb","label":"PrivateLink"},{"from":"nlb","to":"api"}]}},{"id":"d1-10","domain":1,"topic":"WAF・Shield","type":"multi","stem":"ある EC 事業者は、Amazon CloudFront ディストリビューションと Application Load Balancer（ALB）を使ってウェブアプリケーションを公開しています。最近、検索フォームへの SQL インジェクションの試行が増えており、さらに一部の IP アドレスからログインページに短時間で大量のリクエストが送られています。攻撃元の IP アドレスは頻繁に変わります。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えながら、これらの攻撃からアプリケーションを保護する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["CloudFront で AWS Shield Standard が自動的に有効になっていることを確認する。ネットワーク層の攻撃と同様に、アプリケーションへの攻撃も Shield Standard に自動で緩和させる。","AWS WAF のウェブ ACL を作成して CloudFront ディストリビューションに関連付け、AWS マネージドルールの SQL データベースのルールグループを追加する。","ALB のセキュリティグループのインバウンドルールを、CloudFront のオリジン向けマネージドプレフィックスリストからの HTTPS だけに制限する。","攻撃元の IP アドレスを確認するたびに、ALB があるサブネットのネットワーク ACL に、その IP アドレスを拒否するルールを追加する。","ウェブ ACL に、ログインページの URI パスに絞り込んだレートベースのルールを追加し、しきい値を超えた IP アドレスからのリクエストをブロックする。"],"answer":[1,4],"why":["Shield Standard が自動で緩和するのはネットワーク層とトランスポート層の一般的な DDoS 攻撃で、SQL インジェクションやログインページへの大量のリクエストのようなアプリケーション層の攻撃には対応しない。","マネージドルールグループは AWS がルールの更新を管理するため、自分でシグネチャを作らずに SQL インジェクションを検出してブロックできる。","ALB への直接のアクセスを防ぐ対策としては有効だが、CloudFront 経由で届く SQL インジェクションや大量のリクエストは防げない。","攻撃元の IP アドレスが頻繁に変わるため、手作業での追加では追いつかず運用負荷が大きい。CloudFront 経由の通信では、ネットワーク ACL から見える送信元は CloudFront のアドレスになる。","レートベースのルールは、IP アドレスごとのリクエスト数がしきい値を超えると自動でブロックし、下回ると解除する。スコープダウンステートメントでログインページだけを対象にできる。"],"explain":"「SQL インジェクション」「特定の IP からの大量のリクエスト」「IP アドレスが頻繁に変わる」「運用上のオーバーヘッドを最小限に」から、AWS WAF のマネージドルールグループとレートベースのルールを組み合わせる。どちらも自動で判定するので、攻撃元が変わっても手作業は不要である。Shield Standard はレイヤー 3・4 の DDoS 対策で、アプリケーション層の攻撃には WAF が必要になる。","point":"SQL インジェクションは WAF のマネージドルール、特定の IP からの大量のリクエストは WAF のレートベースのルールで防ぐ。","diagram":{"caption":"正解の構成: CloudFront の AWS WAF でマネージドルールとレート制限","cols":4,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"user","label":"利用者","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"ウェブアプリ","kind":"compute","c":3,"r":0},{"id":"waf","label":"AWS WAF","sub":"SQLi・レート制限","kind":"security","c":1,"r":1}],"edges":[{"from":"user","to":"cf","label":"HTTPS"},{"from":"cf","to":"alb"},{"from":"alb","to":"ec2"},{"from":"waf","to":"cf","label":"ウェブ ACL"}]}},{"id":"d1-11","domain":1,"topic":"WAF・Shield","type":"single","stem":"あるオンラインゲーム企業は、Amazon CloudFront、Amazon Route 53、Application Load Balancer（ALB）を使ってゲームのウェブサイトと API を公開しています。過去に大規模な DDoS 攻撃を受けた際は、攻撃中にリソースがスケールアウトしたことで想定外の費用が発生しました。この企業は、今後の大規模な DDoS 攻撃に備えて、攻撃中に AWS の DDoS 対応の専門チームから 24 時間 365 日支援を受けられ、攻撃によって増えた利用料金の補償も受けられる仕組みを求めています。これらの要件を満たすソリューションはどれですか。","choices":["CloudFront と Route 53 で自動的に有効になっている AWS Shield Standard を利用する。攻撃を受けた場合は、AWS サポートにケースを起票して支援を依頼する。","AWS WAF のウェブ ACL を CloudFront と ALB に関連付ける。レートベースのルールと AWS マネージドルールを設定し、攻撃のリクエストをブロックする。","AWS Shield Advanced をサブスクライブし、CloudFront ディストリビューション、Route 53 のホストゾーン、ALB を保護対象のリソースとして登録する。","Amazon CloudWatch のアラームで ALB のリクエスト数を監視し、急増したら運用チームに通知する。Auto Scaling グループの最大キャパシティを小さくして費用の増加を抑える。"],"answer":[2],"why":["Shield Standard は追加料金なしで一般的なネットワーク層・トランスポート層の攻撃を緩和するが、Shield Response Team（SRT）の支援や、DDoS による利用料金の増加の補償は含まれない。","アプリケーション層の攻撃は緩和できるが、専門チームによる 24 時間の支援や利用料金の補償は得られない。","Shield Advanced は、大規模な攻撃に対する高度な検出と緩和に加えて、SRT への 24 時間 365 日のアクセスと、DDoS 攻撃による保護対象リソースの利用料金の増加に対するコスト保護を提供する。","通知はできても、専門チームの支援や料金の補償は得られない。最大キャパシティを下げると、攻撃中に正規の利用者へのサービスを維持できなくなる。"],"explain":"「DDoS 対応の専門チームによる 24 時間 365 日の支援」と「攻撃による利用料金の増加の補償」は、AWS Shield Advanced が提供する機能である。Shield Standard はすべての AWS の利用者に自動で適用されるが、SRT の支援やコスト保護は含まれない。AWS WAF はアプリケーション層の防御に使うもので、Shield Advanced の保護対象では WAF と組み合わせて使うことが多い。","point":"DDoS で「SRT の支援」「コスト保護」が必要なら Shield Advanced。Shield Standard は自動・無料だが基本的な保護だけ。","diagram":null},{"id":"d1-12","domain":1,"topic":"Cognito","type":"single","stem":"ある企業は、利用者が撮影した写真を Amazon S3 に保存するモバイルアプリケーションを開発しています。利用者はメールアドレスとパスワード、または Google アカウントでサインインします。この企業は、アップロードをバックエンドの API で中継せず、アプリケーションから AWS SDK を使って S3 に直接アップロードする設計にしたいと考えています。各利用者はバケット内の自分専用のプレフィックスにだけ書き込めるようにする必要があり、アプリケーションに長期的な AWS 認証情報を埋め込むことは禁止されています。これらの要件を満たすソリューションはどれですか。","choices":["S3 への書き込みだけを許可した IAM ユーザーを作成し、アクセスキーをアプリケーションに組み込む。オブジェクトのキーに利用者 ID を含めるように、アプリケーション側で制御する。","Amazon Cognito ユーザープールでサインインを実装する。サインインで取得した ID トークンを S3 へのリクエストの Authorization ヘッダーに付け、利用者ごとのプレフィックスに直接アップロードする。","Amazon API Gateway と AWS Lambda でアップロード用の API を作成する。Lambda 関数が、サインインした利用者の ID ごとのプレフィックスに写真を書き込む。","Amazon Cognito ユーザープールでサインインを実装し、ID プールでトークンを一時的な AWS 認証情報に交換する。IAM ロールのポリシー変数で、利用者ごとのプレフィックスだけを許可する。"],"answer":[3],"why":["アクセスキーは長期的な認証情報であり、アプリケーションに埋め込むことは禁止されている。アプリケーション側の制御だけでは、他の利用者のプレフィックスへの書き込みも防げない。","S3 は Cognito ユーザープールのトークンを認証情報として受け付けない。S3 へのリクエストには AWS の認証情報による署名が必要である。","プレフィックスの分離は実現できるが、アップロードがバックエンドの API を経由するため、S3 に直接アップロードするという要件を満たさない。","ID プールは、ユーザープールや Google などの ID を、IAM ロールに基づく一時的な認証情報に交換する。${cognito-identity.amazonaws.com:sub} のポリシー変数で、利用者ごとのプレフィックスに権限を絞れる。"],"explain":"「モバイルアプリから AWS のサービスに直接アクセスする」「長期的な認証情報を埋め込まない」が決め手で、Amazon Cognito ID プールで一時的な認証情報を発行する。ユーザープールは認証（サインイン）とトークンの発行を、ID プールは AWS の認証情報の発行を担当する。IAM ポリシーで ${cognito-identity.amazonaws.com:sub} を使うと、利用者ごとに異なるプレフィックスへのアクセスだけを許可できる。","point":"ユーザープールは「サインインとトークン」、ID プールは「AWS の一時的な認証情報」。アプリから直接 AWS を呼ぶなら ID プールを使う。","diagram":{"caption":"正解の構成: ID プールの一時的な認証情報で S3 に直接アップロード","cols":3,"rows":2,"groups":[],"nodes":[{"id":"up","label":"ユーザープール","sub":"サインイン","kind":"security","c":0,"r":0},{"id":"ip","label":"ID プール","sub":"一時的な認証情報","kind":"security","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"利用者ごとの領域","kind":"storage","c":2,"r":0},{"id":"app","label":"モバイルアプリ","kind":"client","c":1,"r":1}],"edges":[{"from":"app","to":"up","label":"① サインイン"},{"from":"app","to":"ip","label":"② 認証情報"},{"from":"app","to":"s3","label":"③ 直接 PUT"}]}},{"id":"d1-13","domain":1,"topic":"脅威検出・監査","type":"multi","stem":"ある企業は、複数の VPC で多数の Amazon EC2 インスタンスを運用しています。同業他社で、侵害されたインスタンスが暗号資産のマイニングに悪用され、既知の悪意のある IP アドレスと通信していた事例があり、セキュリティチームは同様の侵害を早期に把握したいと考えています。この企業は、EC2 インスタンスの不審な通信や侵害の兆候を継続的に検出し、検出から数分以内にセキュリティチームへ自動で通知する仕組みを求めています。セキュリティチームは少人数のため、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Amazon GuardDuty を有効にし、VPC フローログや DNS ログなどをもとに、EC2 インスタンスの不審な通信を継続的に検出させる。","Amazon Inspector を有効にし、EC2 インスタンスのソフトウェアの脆弱性とネットワークの到達可能性を継続的にスキャンさせる。","Amazon Macie を有効にし、アプリケーションが使用する S3 バケットに機密データが含まれていないかを継続的に評価させる。","GuardDuty の検出結果に一致する Amazon EventBridge ルールを作成し、Amazon SNS トピックを経由してセキュリティチームに通知する。","すべての VPC で VPC フローログを有効にして S3 に保存し、Amazon Athena で既知の悪意のある IP アドレスとの通信を毎日検索する。"],"answer":[0,3],"why":["GuardDuty は脅威インテリジェンスと機械学習を使い、悪意のある IP アドレスとの通信や暗号資産のマイニングなどの兆候を検出する。分析に使うフローログを利用者が有効にする必要もない。","Inspector は脆弱性や意図しないネットワークの公開を見つけるサービスで、実際に発生している不審な通信は検出しない。","Macie は S3 の機密データを検出するサービスで、EC2 インスタンスの侵害の兆候は検出しない。","GuardDuty の検出結果は EventBridge にイベントとして送られるため、ルールで SNS に転送すれば数分以内に自動で通知できる。","毎日の検索では、数分以内の通知という要件を満たさない。悪意のある IP アドレスのリストを自分で管理する必要もあり、運用負荷が大きい。"],"explain":"「侵害の兆候を継続的に検出」「数分以内に自動で通知」「運用上のオーバーヘッドを最小限に」から、Amazon GuardDuty と Amazon EventBridge の組み合わせを選ぶ。GuardDuty は VPC フローログ、DNS ログ、CloudTrail のイベントなどを独自に取得して分析するため、ログの収集基盤を用意する必要がない。Inspector（脆弱性）、Macie（S3 の機密データ）、GuardDuty（脅威の検出）の役割の違いは頻出である。","point":"脅威の検出は GuardDuty、脆弱性は Inspector、S3 の機密データは Macie。GuardDuty の検出結果は EventBridge で通知や自動対応につなぐ。","diagram":{"caption":"正解の構成: GuardDuty の検出結果を EventBridge 経由で通知","cols":5,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":1,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"監視対象","kind":"compute","c":0,"r":0},{"id":"gd","label":"GuardDuty","sub":"脅威を検出","kind":"security","c":1,"r":0},{"id":"eb","label":"EventBridge","sub":"検出結果のルール","kind":"integration","c":2,"r":0},{"id":"sns","label":"SNS トピック","kind":"integration","c":3,"r":0},{"id":"team","label":"セキュリティ担当","kind":"client","c":4,"r":0}],"edges":[{"from":"ec2","to":"gd","label":"ログを分析"},{"from":"gd","to":"eb","label":"検出結果"},{"from":"eb","to":"sns"},{"from":"sns","to":"team","label":"通知"}]}},{"id":"d1-14","domain":1,"topic":"脅威検出・監査","type":"single","stem":"ある保険会社は、複数の部署が作成した数百の Amazon S3 バケットに、CSV や JSON 形式のデータを大量に保存しています。監査部門から、氏名、住所、クレジットカード番号などの個人情報がどのバケットに含まれているかを把握し、さらに公開されているバケットや暗号化されていないバケットを継続的に確認するように指摘されました。この会社は、データを解析する仕組みを独自に開発せずに、この調査を継続的に行いたいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon Athena で各バケットのデータに対するテーブルを作成し、個人情報のパターンに一致する正規表現のクエリを定期的に実行する。結果は部署ごとに集計する。","Amazon Macie を有効にし、自動化された機密データ検出を設定する。バケットの公開状態と暗号化の設定は、Macie の S3 バケットのインベントリで確認する。","Amazon GuardDuty の S3 Protection を有効にし、S3 バケットに対する不審なアクセスやデータの取得を継続的に検出する。検出結果は部署ごとに通知する。","Amazon Inspector を有効にし、S3 バケットに保存されたファイルの脆弱性と機密データを継続的にスキャンする。検出結果は部署ごとに通知する。"],"answer":[1],"why":["数百のバケットごとにテーブル定義と正規表現を作成・維持する必要があり、独自の仕組みを開発しないという要件に反する。バケットの公開状態や暗号化の設定も確認できない。","Macie は機械学習とパターンマッチングで S3 の機密データを検出し、自動化された機密データ検出でバケット全体を継続的に評価する。バケットの公開状態や暗号化の設定も一覧で確認できる。","GuardDuty の S3 Protection は不審なアクセスを検出するもので、どのデータに個人情報が含まれるかは判定しない。","Inspector は EC2 インスタンス、コンテナイメージ、Lambda 関数の脆弱性をスキャンするサービスで、S3 の機密データは検出しない。"],"explain":"「S3 のどこに個人情報があるか」「公開・未暗号化のバケットの確認」「独自の仕組みを開発しない」が決め手で、Amazon Macie を選ぶ。Macie は S3 を対象とする機密データの検出サービスで、クレジットカード番号などを検出するマネージドデータ識別子があらかじめ用意されている。検出結果は Amazon EventBridge や AWS Security Hub に送ることもできる。","point":"S3 の個人情報・機密データの検出は Macie。GuardDuty は不審なアクセス、Inspector は脆弱性を見るもので、データの中身は見ない。","diagram":null},{"id":"d1-15","domain":1,"topic":"シークレット管理","type":"single","stem":"ある企業は、Amazon EC2 インスタンスで実行される業務アプリケーションから Amazon RDS for MySQL の DB インスタンスに接続しています。データベースのユーザー名とパスワードはアプリケーションの設定ファイルに平文で書かれており、監査で指摘を受けました。この企業は、認証情報を設定ファイルから取り除き、パスワードを 30 日ごとに自動でローテーションする必要があります。アプリケーションは引き続きユーザー名とパスワードでデータベースに接続します。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Secrets Manager にデータベースの認証情報をシークレットとして保存し、30 日ごとの自動ローテーションを有効にする。アプリケーションは実行時に Secrets Manager からシークレットを取得する。","AWS Systems Manager Parameter Store に認証情報を SecureString として保存する。パスワードを変更してパラメータを更新する Lambda 関数を作成し、Amazon EventBridge で 30 日ごとに実行する。","AWS KMS のキーでパスワードを暗号化し、暗号文を設定ファイルに保存する。アプリケーションの起動時に KMS で復号し、パスワードは 30 日ごとに運用チームが手動で変更する。","起動テンプレートのユーザーデータで認証情報を環境変数に設定する。30 日ごとにパスワードを変更し、新しいバージョンの起動テンプレートでインスタンスを置き換える。"],"answer":[0],"why":["Secrets Manager は RDS 用のローテーションの仕組みを備えており、パスワードの変更とシークレットの更新を自動で行う。アプリケーションは IAM ロールで認可されたうえでシークレットを取得するため、設定ファイルに認証情報を置かずに済む。","要件は満たせるが、ローテーション用の Lambda 関数を自作して維持する必要があり、運用負荷が大きい。Parameter Store には組み込みの自動ローテーションの機能がない。","設定ファイルには暗号文が残り、ローテーションも手作業になるため、自動でローテーションするという要件を満たさない。","ユーザーデータは権限があれば平文で参照でき、ローテーションも手作業になる。インスタンスを置き換える手間も大きい。"],"explain":"「データベースのパスワードの自動ローテーション」と「運用効率」が決め手で、AWS Secrets Manager を選ぶ。Parameter Store の SecureString も暗号化して保存できるが、ローテーションの仕組みは自分で作る必要がある。ローテーションが不要な設定値を費用を抑えて保存するなら Parameter Store、ローテーションが必要な認証情報なら Secrets Manager と覚えるとよい。","point":"DB の認証情報を自動ローテーションするなら Secrets Manager。ローテーションが不要な設定値なら Parameter Store で十分。","diagram":{"caption":"正解の構成: Secrets Manager で認証情報を保存し自動ローテーション","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":1}],"nodes":[{"id":"ec2","label":"EC2","sub":"業務アプリ","kind":"compute","c":0,"r":0},{"id":"rds","label":"RDS for MySQL","kind":"database","c":2,"r":0},{"id":"sm","label":"Secrets Manager","sub":"30 日ごとに自動更新","kind":"security","c":1,"r":1}],"edges":[{"from":"ec2","to":"sm","label":"認証情報を取得"},{"from":"sm","to":"rds","label":"ローテーション"},{"from":"ec2","to":"rds","label":"接続"}]}},{"id":"d1-16","domain":1,"topic":"ハイブリッド接続","type":"single","stem":"ある製造業の会社は、オンプレミスのデータセンターと AWS の VPC を AWS Direct Connect で接続しています。新しいセキュリティ基準により、オンプレミスと VPC の間のすべての通信を、転送中に暗号化することが求められました。通信には、TLS に対応していない古い業務システムのプロトコルも含まれます。この会社は、Direct Connect による安定したネットワーク性能を引き続き利用したいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["Direct Connect 接続を廃止し、インターネット経由の AWS Site-to-Site VPN に切り替える。VPN 接続は 2 本のトンネルで冗長化する。","すべての業務システムの通信が TLS を使うようにアプリケーションを改修し、Direct Connect の既存の接続をそのまま利用する。","Direct Connect 接続の上で AWS Site-to-Site VPN を確立し、オンプレミスと AWS の間のすべての通信を IPsec トンネルで暗号化する。","AWS Client VPN エンドポイントを VPC に作成し、オンプレミスの各サーバーに Client VPN のクライアントソフトウェアを導入して接続する。"],"answer":[2],"why":["暗号化はできるが、通信がインターネット経由になるため、Direct Connect の安定したネットワーク性能を使い続けるという要件を満たさない。","TLS に対応していないプロトコルがあるため、すべての通信を暗号化できない。改修の負担も大きい。","Direct Connect の経路の上で IPsec VPN を使うと、専用線の安定した性能を保ちながら、プロトコルに関係なく IP レベルですべての通信を暗号化できる。","Client VPN は個々の利用者の端末から接続するためのサービスで、データセンターと VPC の間のサイト間接続には向かない。"],"explain":"Direct Connect の通信は、既定では暗号化されない。「すべての通信を暗号化」「TLS に対応していないプロトコルもある」「Direct Connect の性能を使い続ける」から、Direct Connect の上で Site-to-Site VPN を確立する構成を選ぶ。インターネット経由の VPN に切り替えると、暗号化はできても性能が安定しない。なお、対応する専用接続では MACsec によるレイヤー 2 での暗号化という選択肢もある。","point":"Direct Connect は既定では暗号化されない。DX の性能のまま暗号化するなら DX 上で IPsec VPN を張る（対応環境なら MACsec も可）。","diagram":{"caption":"正解の構成: Direct Connect 上の Site-to-Site VPN で通信を暗号化","cols":4,"rows":1,"groups":[{"label":"データセンター","kind":"onprem","c":0,"r":0,"w":1,"h":1},{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"router","label":"社内ルーター","sub":"カスタマー GW","kind":"onprem","c":0,"r":0},{"id":"dx","label":"Direct Connect","sub":"専用線","kind":"network","c":1,"r":0},{"id":"vgw","label":"VGW","sub":"IPsec VPN の終端","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"業務システム","kind":"compute","c":3,"r":0}],"edges":[{"from":"router","to":"dx","label":"IPsec トンネル","both":true},{"from":"dx","to":"vgw","label":"IPsec トンネル","both":true},{"from":"vgw","to":"ec2","both":true}]}},{"id":"d1-17","domain":1,"topic":"KMS・暗号化","type":"single","stem":"ある医療系の企業は、患者の検査結果のファイルを Amazon S3 バケットに保存しています。コンプライアンス要件により、暗号化キーの使用許可を自社で定義して特定の IAM ロールだけがデータを復号できるようにすること、キーが使用されるたびにその記録を AWS CloudTrail に残すこと、キーを定期的に自動でローテーションすることが求められています。この企業は、キーの生成や保管を自社のシステムで行うことは避けたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["バケットのデフォルト暗号化に、Amazon S3 マネージドキーによるサーバー側の暗号化（SSE-S3）を設定する。バケットポリシーで、特定の IAM ロールにだけ s3:GetObject を許可する。","バケットのデフォルト暗号化に、AWS KMS の AWS マネージドキー（aws/s3）による SSE-KMS を設定する。キーポリシーを編集して特定の IAM ロールにだけ復号を許可し、ローテーションは AWS に任せる。","顧客提供キーによるサーバー側の暗号化（SSE-C）を使用する。キーは社内のキー管理システムで生成して保管し、ローテーションのたびにオブジェクトを再暗号化する。","AWS KMS でカスタマーマネージドキーを作成し、自動ローテーションを有効にする。キーポリシーで特定の IAM ロールにだけ復号を許可し、バケットのデフォルト暗号化に SSE-KMS でこのキーを指定する。"],"answer":[3],"why":["SSE-S3 のキーは S3 が管理するため、キーの使用許可を自社で定義することも、キーの使用を CloudTrail で個別に記録することもできない。","AWS マネージドキーのキーポリシーは利用者が編集できないため、復号できるロールをキーの側で制限できない。","キーの生成と保管を自社で行う必要があり、要件に反する。KMS を使わないため、キーの使用が CloudTrail に記録されることもない。","カスタマーマネージドキーは、キーポリシーで使用許可を自社で定義でき、自動ローテーションも有効にできる。KMS の API 呼び出しは CloudTrail に記録される。"],"explain":"「キーの使用許可を自社で定義」が決め手で、キーポリシーを編集できる AWS KMS のカスタマーマネージドキーを選ぶ。AWS マネージドキーも KMS のキーなので使用は CloudTrail に記録されるが、キーポリシーは変更できない。SSE-S3 は手軽だがキーへのアクセスを制御できず、SSE-C はキーを自社で管理する負担が大きい。カスタマーマネージドキーの自動ローテーションは任意で有効にでき、古いキーマテリアルも保持されるため、既存のデータはそのまま復号できる。","point":"キーポリシーを自分で書きたいならカスタマーマネージドキー。AWS マネージドキーはキーポリシーを変更できない。","diagram":null},{"id":"d1-18","domain":1,"topic":"KMS・暗号化","type":"single","stem":"ある企業は、開発アカウントで作成した Amazon EC2 の AMI を、別の AWS アカウントであるテストアカウントと共有し、テストアカウントでインスタンスを起動しようとしています。AMI の EBS スナップショットは、EBS 用の AWS マネージドキー（aws/ebs）で暗号化されています。AMI の共有を設定しましたが、テストアカウントではこの AMI からインスタンスを起動できませんでした。セキュリティ基準により、AMI とスナップショットは常に暗号化しておく必要があります。ソリューションアーキテクトはどうすべきですか。","choices":["開発アカウントで aws/ebs のキーポリシーを編集し、テストアカウントに復号とグラントの作成を許可する。そのうえで、AMI の起動許可にテストアカウントを追加する。","開発アカウントでカスタマーマネージドキーを作成し、このキーで暗号化した AMI のコピーを作成する。キーポリシーでテストアカウントに使用を許可し、コピーを共有する。","AMI をパブリックに設定し、テストアカウントから起動できるようにする。起動後に、テストアカウントでインスタンスのボリュームを暗号化し直す。","暗号化を解除したスナップショットのコピーを作成して AMI を登録し、テストアカウントと共有する。テストアカウントでは、インスタンスの起動時に EBS の暗号化を有効にする。"],"answer":[1],"why":["AWS マネージドキーのキーポリシーは編集できない。AWS マネージドキーで暗号化したスナップショットや AMI は、ほかのアカウントと共有できない。","カスタマーマネージドキーなら、キーポリシーで別のアカウントに使用を許可できる。このキーで暗号化した AMI のコピーを作れば、暗号化を保ったまま共有できる。","暗号化された AMI はパブリックにできない。不特定の相手に公開することになるため、セキュリティの面でも不適切である。","スナップショットのコピーで暗号化を解除することはできず、常に暗号化しておくという基準にも反する。"],"explain":"AWS マネージドキーで暗号化したスナップショットや AMI は、別のアカウントと共有できない。キーポリシーを編集できるカスタマーマネージドキーで暗号化し直し、キーと AMI の両方を相手のアカウントに共有するのが正しい手順である。テストアカウント側でも、IAM ポリシーでそのキーの使用を許可しておく。同じ考え方は、RDS の暗号化されたスナップショットの共有にも当てはまる。","point":"AWS マネージドキーで暗号化したスナップショット・AMI は共有できない。カスタマーマネージドキーで暗号化し直し、キーポリシーで相手に許可する。","diagram":{"caption":"正解の構成: カスタマーマネージドキーで暗号化し直した AMI を共有","cols":3,"rows":2,"groups":[{"label":"開発アカウント","kind":"account","c":0,"r":0,"w":1,"h":2},{"label":"テストアカウント","kind":"account","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"ami","label":"AMI のコピー","sub":"CMK で暗号化","kind":"storage","c":0,"r":0},{"id":"kms","label":"KMS キー","sub":"カスタマーマネージド","kind":"security","c":0,"r":1},{"id":"ec2","label":"EC2","sub":"共有 AMI から起動","kind":"compute","c":2,"r":0}],"edges":[{"from":"ami","to":"ec2","label":"AMI を共有"},{"from":"kms","to":"ec2","label":"使用を許可","style":"dashed"}]}},{"id":"d1-19","domain":1,"topic":"KMS・暗号化","type":"single","stem":"ある企業は、東京リージョンの Application Load Balancer（ALB）をオリジンとする Amazon CloudFront ディストリビューションで、独自ドメイン（www.example.com）のウェブサイトを公開する予定です。セキュリティ要件により、利用者から CloudFront まで、および CloudFront から ALB までの両方の通信を HTTPS で暗号化する必要があります。また、証明書の更新作業を自動化し、サーバーに証明書をインストールする運用をなくしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["東京リージョンの AWS Certificate Manager（ACM）で公開証明書を 1 つ発行し、CloudFront ディストリビューションと ALB の両方に関連付ける。オリジンへの通信は HTTPS のみにする。","ALB には自己署名証明書をインポートし、CloudFront には米国東部（バージニア北部）リージョンの ACM で発行した公開証明書を関連付ける。オリジンへの通信は HTTPS のみにする。","米国東部（バージニア北部）リージョンの ACM で発行した公開証明書を CloudFront に、東京リージョンの ACM で発行した公開証明書を ALB に関連付ける。オリジンへの通信は HTTPS のみにする。","CloudFront の既定の証明書（*.cloudfront.net）を使い、独自ドメインは CNAME で CloudFront のドメイン名に向ける。ALB には東京リージョンの ACM で発行した証明書を関連付ける。"],"answer":[2],"why":["CloudFront に関連付ける ACM の証明書は、米国東部（バージニア北部）リージョンで発行する必要がある。東京リージョンの証明書は CloudFront には使えない。","CloudFront はオリジンの証明書を検証するため、自己署名証明書では HTTPS で接続できない。インポートした証明書は ACM が自動で更新しない点も要件に反する。","ACM の証明書は、CloudFront 用は米国東部（バージニア北部）リージョン、ALB 用は ALB と同じリージョンで発行する。ACM で発行した公開証明書は自動で更新される。","既定の証明書は *.cloudfront.net のドメイン名しか含まないため、www.example.com でアクセスすると証明書のエラーになる。"],"explain":"「CloudFront で独自ドメイン」「HTTPS」「証明書の更新の自動化」から ACM の公開証明書を使う。ACM の証明書はリージョン単位のリソースで、CloudFront で使うものは米国東部（バージニア北部）リージョンで発行する。ALB などのリージョンのサービスでは、そのサービスと同じリージョンの証明書が必要になる。CloudFront からオリジンへの通信を HTTPS にするには、オリジンのプロトコルポリシーを HTTPS のみにし、信頼された認証局の証明書をオリジンに設定する。","point":"CloudFront 用の ACM 証明書は us-east-1 で発行する。ALB 用は ALB と同じリージョン。ACM の公開証明書は自動で更新される。","diagram":{"caption":"正解の構成: CloudFront 用は us-east-1、ALB 用は東京の ACM 証明書","cols":4,"rows":2,"groups":[{"label":"us-east-1","kind":"region","c":1,"r":1,"w":1,"h":1},{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":2,"h":2},{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"user","label":"利用者","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"www.example.com","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","kind":"compute","c":3,"r":0},{"id":"acm1","label":"ACM 証明書","sub":"CloudFront 用","kind":"security","c":1,"r":1},{"id":"acm2","label":"ACM 証明書","sub":"ALB 用","kind":"security","c":2,"r":1}],"edges":[{"from":"user","to":"cf","label":"HTTPS"},{"from":"cf","to":"alb","label":"HTTPS"},{"from":"alb","to":"ec2"},{"from":"acm1","to":"cf","style":"dashed"},{"from":"acm2","to":"alb","style":"dashed"}]}},{"id":"d1-20","domain":1,"topic":"CloudFront","type":"single","stem":"ある企業は、Amazon S3 の静的ウェブサイトホスティングで社外向けのウェブサイトを公開しており、バケットは誰でも読み取れる設定になっています。今後は Amazon CloudFront 経由で配信し、S3 への直接のアクセスはすべて拒否する必要があります。また、アカウント全体で S3 のブロックパブリックアクセスを有効にし、オブジェクトは AWS KMS のカスタマーマネージドキーによる SSE-KMS で暗号化する方針です。これらの要件を満たすソリューションはどれですか。","choices":["S3 の REST API エンドポイントをオリジンにして、オリジンアクセスコントロール（OAC）を設定する。バケットポリシーとキーポリシーで、このディストリビューションからのアクセスだけを許可する。","S3 の REST API エンドポイントをオリジンにして、オリジンアクセスアイデンティティ（OAI）を設定する。バケットポリシーで、OAI からの s3:GetObject だけを許可する。","静的ウェブサイトホスティングのエンドポイントをオリジンのまま使う。CloudFront からカスタムの Referer ヘッダーを送り、このヘッダーがある場合だけ読み取りを許可する。","静的ウェブサイトホスティングのエンドポイントをオリジンのまま使う。バケットポリシーの aws:SourceIp 条件で、CloudFront のエッジロケーションの IP アドレス範囲からの読み取りだけを許可する。"],"answer":[0],"why":["OAC は CloudFront から S3 へのリクエストに署名し、バケットポリシーでは cloudfront.amazonaws.com とディストリビューションの ARN（AWS:SourceArn）を条件に許可できる。SSE-KMS で暗号化したオブジェクトにも対応し、バケットを公開する必要がない。","OAI は従来の方式で、SSE-KMS で暗号化されたオブジェクトには対応していない。新しく設定するなら OAC が推奨されている。","プリンシパルを全員とするバケットポリシーになり、パブリックなポリシーとみなされるため、ブロックパブリックアクセスを有効にすると使えない。ヘッダーの値を知っていれば直接アクセスもできる。","CloudFront の IP アドレス範囲はすべての CloudFront の利用者が共有するため、ほかのディストリビューションを経由したアクセスも許してしまう。範囲の変更に追従する運用も必要になる。"],"explain":"「CloudFront 経由だけに限定」「ブロックパブリックアクセス」「SSE-KMS」がそろったら、REST API エンドポイントをオリジンにした OAC を選ぶ。OAI も CloudFront 経由に限定できるが、SSE-KMS には対応していない。静的ウェブサイトホスティングのエンドポイントは匿名の読み取りが前提で、署名のない匿名のリクエストでは SSE-KMS で暗号化されたオブジェクトも読み取れない。OAC で SSE-KMS のオブジェクトを配信するときは、KMS のキーポリシーでも CloudFront に復号を許可する。","point":"S3 を CloudFront 経由だけに限定するなら OAC（SSE-KMS にも対応）。OAI は従来の方式、ウェブサイトエンドポイントは公開が前提。","diagram":{"caption":"正解の構成: OAC で CloudFront からのアクセスだけを許可","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"利用者","kind":"client","c":0,"r":0},{"id":"cf","label":"CloudFront","sub":"OAC で署名","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"パブリック遮断","kind":"storage","c":2,"r":0},{"id":"kms","label":"KMS キー","sub":"CloudFront に許可","kind":"security","c":2,"r":1},{"id":"direct","label":"直接アクセス","kind":"client","c":0,"r":1}],"edges":[{"from":"user","to":"cf","label":"HTTPS"},{"from":"cf","to":"s3","label":"SigV4 署名"},{"from":"s3","to":"kms","label":"復号","style":"dashed"},{"from":"direct","to":"s3","label":"拒否（403）","style":"dashed"}]}},{"id":"d1-21","domain":1,"topic":"S3","type":"single","stem":"ある証券会社は、取引記録のファイルを Amazon S3 に保存しています。規制により、取引記録は作成から 7 年間、上書きも削除もできない WORM（Write Once Read Many）形式で保持する必要があります。監査人は、AWS アカウントのルートユーザーを含め、どのユーザーも保持期間中にファイルを削除できないことを証明するように求めています。新しく保存されるファイルにも、追加の操作なしで同じ保護を適用する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["S3 オブジェクトロックをガバナンスモードで有効にし、バケットのデフォルトの保持期間を 7 年に設定する。保持設定を変更できる権限は管理者だけに付与する。","バケットのバージョニングを有効にし、バケットポリシーですべてのプリンシパルに s3:DeleteObject と s3:DeleteObjectVersion を拒否する。ポリシーの変更は管理者だけに許可する。","バケットのバージョニングと MFA 削除を有効にし、オブジェクトのバージョンの削除に MFA デバイスによる認証を必須にする。MFA デバイスは管理者が保管する。","S3 オブジェクトロックをコンプライアンスモードで有効にし、バケットのデフォルトの保持期間を 7 年に設定する。新しいオブジェクトのバージョンには保持期間が自動で適用される。"],"answer":[3],"why":["ガバナンスモードでは、s3:BypassGovernanceRetention の権限を持つユーザーが保持設定を解除して削除できるため、誰も削除できないことを証明できない。","管理者やルートユーザーはバケットポリシーを変更して削除できるため、WORM の要件を満たさない。","MFA 削除は、バケット所有者のルートユーザーが MFA デバイスを使えば削除できる。保持期間を強制する仕組みでもない。","コンプライアンスモードでは、保持期間中はルートユーザーを含めて誰もオブジェクトのバージョンを上書き・削除できず、保持期間を短くすることもできない。デフォルトの保持期間を設定すれば、新しいオブジェクトにも自動で適用される。"],"explain":"「WORM」「ルートユーザーを含め誰も削除できない」が決め手で、S3 オブジェクトロックのコンプライアンスモードを選ぶ。ガバナンスモードは特別な権限を持つユーザーが解除できるため、設定のテストや社内ルールの運用に向く。オブジェクトロックはバージョニングを前提とした機能で、有効にするとバージョニングも有効になる。","point":"誰にも削除させない WORM は S3 オブジェクトロックのコンプライアンスモード。ガバナンスモードは権限があれば解除できる。","diagram":null},{"id":"d1-22","domain":1,"topic":"S3","type":"multi","stem":"ある企業は、取引先から受け取る請求データを Amazon S3 バケットに保存しています。取引先は独自のツールでファイルをアップロードしており、そのツールはリクエストで暗号化の方式を指定しません。セキュリティチームは、バケットへのすべてのリクエストを HTTPS に限定して HTTP のリクエストを拒否すること、アップロードされるオブジェクトを自社の AWS KMS カスタマーマネージドキーで暗号化して保存することを求めています。最も運用効率の高い方法でこれらの要件を満たす手順の組み合わせはどれですか。","choices":["バケットとアカウントで S3 のブロックパブリックアクセスを有効にし、匿名のリクエストがすべて拒否されるようにする。","aws:SecureTransport 条件キーが false のリクエストをすべて拒否するステートメントを、バケットポリシーに追加する。","バケットのデフォルト暗号化に、カスタマーマネージドキーを指定した SSE-KMS を設定し、S3 バケットキーを有効にする。","取引先に、顧客提供キーによるサーバー側の暗号化（SSE-C）を使うように依頼し、暗号化キーを取引先と共有する。","S3 イベント通知で AWS Lambda 関数を起動し、アップロードされたオブジェクトをカスタマーマネージドキーで暗号化し直して上書きする。"],"answer":[1,2],"why":["パブリックアクセスを防ぐための設定であり、HTTP のリクエストの拒否や暗号化キーの指定には関係しない。","aws:SecureTransport は HTTPS のリクエストで true になる。false の場合に拒否すれば、HTTP のリクエストをすべて拒否できる。","デフォルト暗号化を設定すると、暗号化の方式を指定しないアップロードにも自動でこのキーが使われる。S3 バケットキーを使うと KMS へのリクエストが減り、費用も抑えられる。","SSE-C ではリクエストのたびにキーを送る必要があり、カスタマーマネージドキーで暗号化するという要件を満たさない。キーの共有と管理の負担も大きい。","結果的に暗号化はできるが、暗号化し直す関数を作って維持する必要があり、運用負荷が大きい。デフォルト暗号化で同じことができる。"],"explain":"転送中の暗号化の強制はバケットポリシーの aws:SecureTransport 条件、保管時の暗号化に使うキーの指定はデフォルト暗号化で行う。現在は新しいオブジェクトが既定で SSE-S3 で暗号化されるが、自社のカスタマーマネージドキーを使うには、デフォルト暗号化で SSE-KMS とキーを指定する。暗号化の方式を指定しないアップロードにはデフォルト暗号化が適用されるため、関数などの仕組みは不要である。","point":"HTTPS の強制はバケットポリシーの aws:SecureTransport、KMS キーでの暗号化はデフォルト暗号化（SSE-KMS）で設定する。","diagram":null},{"id":"d1-23","domain":1,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon RDS for PostgreSQL の DB インスタンスで顧客管理システムを運用しています。この DB インスタンスは、暗号化を有効にせずに作成されていました。セキュリティ監査で、データベースのストレージ、自動バックアップ、スナップショットを AWS KMS のカスタマーマネージドキーで暗号化するように指摘されました。週末のメンテナンス時間帯であれば、アプリケーションを数時間停止できます。ソリューションアーキテクトはどうすべきですか。","choices":["DB インスタンスを変更して暗号化を有効にし、カスタマーマネージドキーを指定する。変更は、次のメンテナンス時間帯に適用されるようにスケジュールする。","DB インスタンスの手動スナップショットを作成し、カスタマーマネージドキーで暗号化してコピーする。このコピーから新しい DB インスタンスを復元し、接続先を切り替える。","カスタマーマネージドキーを指定して、暗号化されたリードレプリカを作成する。レプリケーションが追いついたらリードレプリカを昇格し、アプリケーションの接続先を切り替える。","リージョンで EBS のデフォルト暗号化を有効にし、カスタマーマネージドキーを指定する。メンテナンス時間帯に DB インスタンスを再起動して、ストレージを暗号化する。"],"answer":[1],"why":["RDS の暗号化は DB インスタンスの作成時にしか有効にできず、既存の DB インスタンスを変更して暗号化することはできない。","暗号化されていないスナップショットも、コピーするときに暗号化できる。暗号化されたスナップショットから復元した DB インスタンスは、ストレージ、自動バックアップ、スナップショットがすべて暗号化される。","暗号化されていない DB インスタンスから、暗号化されたリードレプリカを作成することはできない。","EBS のデフォルト暗号化は EC2 で作成する EBS ボリュームの設定で、RDS の DB インスタンスのストレージには適用されない。"],"explain":"暗号化されていない既存の RDS を暗号化するには、スナップショットを作成し、暗号化してコピーし、そこから復元するのが基本の手順である。RDS は作成後に暗号化を有効にできず、暗号化されていない DB インスタンスから暗号化されたリードレプリカも作れない。新しい DB インスタンスはエンドポイントが変わるため、アプリケーションの接続先を切り替える必要がある。なお、現在は RDS のブルー/グリーンデプロイで、暗号化されたグリーン環境を作って切り替える方法も用意されている。","point":"既存の暗号化されていない RDS は、スナップショットを暗号化コピーして復元する。変更による暗号化や暗号化リードレプリカの作成はできない。","diagram":{"caption":"正解の構成: スナップショットを暗号化コピーして新しい DB に復元","cols":4,"rows":2,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":4,"h":2}],"nodes":[{"id":"rds1","label":"既存の RDS","sub":"暗号化なし","kind":"database","c":0,"r":0},{"id":"snap","label":"スナップショット","sub":"暗号化なし","kind":"storage","c":1,"r":0},{"id":"snap2","label":"暗号化コピー","sub":"CMK で暗号化","kind":"storage","c":2,"r":0},{"id":"rds2","label":"新しい RDS","sub":"暗号化済み","kind":"database","c":3,"r":0},{"id":"kms","label":"KMS キー","sub":"カスタマーマネージド","kind":"security","c":2,"r":1}],"edges":[{"from":"rds1","to":"snap","label":"手動で取得"},{"from":"snap","to":"snap2","label":"暗号化コピー"},{"from":"snap2","to":"rds2","label":"復元"},{"from":"kms","to":"snap2","style":"dashed"}]}},{"id":"d1-24","domain":1,"topic":"脅威検出・監査","type":"multi","stem":"ある企業で、本番環境のセキュリティグループのルールが変更され、SSH（ポート 22）が意図せずインターネット全体に公開されていたことが判明しました。セキュリティチームは、今後同様の問題が起きた場合に、どの IAM プリンシパルがいつルールを変更したかを特定できるようにしたいと考えています。また、セキュリティグループの設定の履歴を保持し、0.0.0.0/0 からの SSH を許可しているセキュリティグループを自動的に検出する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["すべての VPC で VPC フローログを有効にし、ログを Amazon CloudWatch Logs に送信する。ポート 22 への通信を CloudWatch Logs Insights で検索する。","Amazon GuardDuty を有効にし、ポート 22 への総当たり攻撃や不審な API 呼び出しを検出結果として通知させる。","AWS CloudTrail の証跡を作成して管理イベントを S3 バケットに保存し、AuthorizeSecurityGroupIngress などの API 呼び出しの実行者と日時を確認できるようにする。","Amazon Inspector を有効にし、EC2 インスタンスのソフトウェアの脆弱性を継続的にスキャンして、検出結果を AWS Security Hub に集約する。","AWS Config でセキュリティグループの設定の記録を有効にし、マネージドルールの restricted-ssh を追加して、準拠していないセキュリティグループを検出する。"],"answer":[2,4],"why":["フローログは通信の記録で、誰がルールを変更したかや、設定の履歴は分からない。","GuardDuty は脅威を検出するサービスで、セキュリティグループの設定の履歴を保持したり、設定がルールに準拠しているかを評価したりはしない。","CloudTrail は API 呼び出しを、実行した IAM プリンシパル、日時、送信元とともに記録する。証跡で S3 に保存すれば、長期間の調査にも使える。","Inspector はソフトウェアの脆弱性を見つけるサービスで、ルールを変更した人や設定の履歴は分からない。","Config はリソースの設定変更を記録して履歴を保持し、ルールで設定を継続的に評価する。restricted-ssh は、0.0.0.0/0 からの SSH を許可するセキュリティグループを非準拠として検出する。"],"explain":"「誰がいつ変更したか」は AWS CloudTrail、「設定の履歴」と「設定がルールに準拠しているかの評価」は AWS Config、と役割を分けて考える。Config の設定履歴には関連する CloudTrail のイベントも表示されるため、両方を組み合わせると調査がしやすい。非準拠のリソースは、Systems Manager Automation による自動修復につなぐこともできる。","point":"「誰が・いつ・どの API を呼んだか」は CloudTrail、「設定がどう変わったか・ルールに準拠しているか」は Config。","diagram":null},{"id":"d1-25","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、Amazon EC2 インスタンスで実行されるアプリケーションから Amazon S3 バケットのオブジェクトを読み取っています。現在は IAM ユーザーのアクセスキーを発行し、設定ファイルに保存してインスタンスに配置しています。セキュリティチームは、長期の認証情報をインスタンスに保存しないようにし、キーのローテーション作業もなくすことを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["IAM ユーザーのアクセスキーを 90 日ごとに手動でローテーションする。新しいキーは AWS Systems Manager Run Command で全インスタンスの設定ファイルに配布する。","アクセスキーを AWS Secrets Manager に保存し、アプリケーションの起動時に取得させる。シークレットの自動ローテーションを有効にする。","S3 バケットの読み取り権限をもつ IAM ロールを作成し、インスタンスプロファイルを通じて EC2 インスタンスに関連付ける。アプリケーションは AWS SDK の既定の認証情報プロバイダーを使う。","S3 バケットポリシーでプリンシパルに「*」を指定し、aws:SourceIp 条件でインスタンスのパブリック IP アドレスからのアクセスだけを許可する。"],"answer":[2],"why":["長期のアクセスキーをインスタンスに置く構成のままで、配布とローテーションの運用作業も残る。要件の「長期の認証情報を保存しない」を満たさない。","アクセスキーの保管場所が変わるだけで、長期の認証情報を使う点は同じ。取得するための認証情報も別途必要になる。","インスタンスプロファイル経由で、EC2 インスタンスに一時的な認証情報が自動で配布・更新される。コードにも設定ファイルにもキーを持たずに済み、ローテーション作業もない。","認証を IP アドレスだけに頼る構成で、IAM による権限管理にならない。同じ IP アドレスを使う他のリソースからもアクセスできてしまい、IP アドレスが変わるたびにポリシーの更新も必要になる。"],"explain":"「長期の認証情報を置かない」「ローテーション作業をなくす」が決め手。EC2 上のアプリケーションに権限を渡す標準の方法は、IAM ロールをインスタンスプロファイル経由で関連付けることで、一時的な認証情報が自動でローテーションされる。SDK や CLI は認証情報プロバイダーチェーンでインスタンスメタデータから自動的に取得する。","point":"EC2 上のアプリに AWS の権限を渡すなら IAM ロール（インスタンスプロファイル）。アクセスキーをインスタンスに置かない。","diagram":{"caption":"正解の構成: IAM ロールで EC2 に一時的な認証情報を渡す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"ec2","label":"EC2","sub":"アプリケーション","kind":"compute","c":0,"r":0},{"id":"role","label":"IAM ロール","sub":"S3 の読み取り権限","kind":"security","c":1,"r":0},{"id":"s3","label":"S3 バケット","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2","to":"role","label":"一時認証情報"},{"from":"role","to":"s3","label":"GetObject"}]}},{"id":"d1-26","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、プライベートサブネットの Amazon EC2 インスタンスを、管理者が SSH で操作できるようにしています。現在はパブリックサブネットに踏み台サーバーを置き、セキュリティグループでポート 22 を許可しています。セキュリティチームは、インバウンドのポートを一切開けずに接続できるようにし、管理者の操作ログも記録することを求めています。プライベートサブネットにはインターネットへの経路がなく、運用上のオーバーヘッドも最小限にする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["インスタンスに AmazonSSMManagedInstanceCore ポリシーをもつ IAM ロールを関連付ける。Systems Manager 用のインターフェイス型 VPC エンドポイントを作成し、Session Manager で接続する。セッションのログは Amazon S3 または Amazon CloudWatch Logs に出力する。","踏み台サーバーを Auto Scaling グループで冗長化し、Network Load Balancer 経由でポート 22 に接続する。セキュリティグループでは管理者の IP アドレスだけを許可する。","EC2 Instance Connect を使い、インスタンスのセキュリティグループで管理者の IP アドレスからのポート 22 を許可する。接続の履歴は AWS CloudTrail で確認する。","AWS Site-to-Site VPN を作成し、管理者の端末から VPN 経由でインスタンスのプライベート IP アドレスに SSH で接続する。接続のログは VPC フローログで取得する。"],"answer":[0],"why":["Session Manager は SSM エージェントからの送信方向の通信で接続するため、インバウンドのポートは不要。VPC エンドポイントがあればインターネットへの経路も要らず、セッションの内容も S3 や CloudWatch Logs に記録できる。","踏み台サーバーが残り、ポート 22 も開けたままになる。パッチ適用などの運用負荷も増え、要件を満たさない。","この構成ではポート 22 のインバウンドを許可しているため、「ポートを開けない」要件に反する。CloudTrail には接続の記録は残るが、操作内容は記録されない。","VPN の構築と運用が必要でオーバーヘッドが大きく、
