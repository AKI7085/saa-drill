1 日 5 分しか使わないインスタンスを 24 時間分の契約量で払い続けることになる。実行時間に応じた課金にはならない。","サーバー管理は不要になるが、タスクを常時起動するので、処理していない時間の料金が発生し続ける。","インスタンスを小さくしても常時起動の料金がかかる。また、Auto Scaling は台数を維持する仕組みで、1 日 1 回の定期処理を減らす効果はない。","処理が 15 分以内なので Lambda で実行でき、実行時間分だけの課金になる。EventBridge Scheduler で定期起動でき、サーバーの管理も不要になる。"],"explain":"「1 日 1 回」「5 分で完了」「ほとんど何もしていない」は、常時起動のサーバーが向かない典型。Lambda は最大 15 分まで実行でき、実行した時間にだけ課金される。定期起動は EventBridge Scheduler で行える。処理が 15 分を超える場合や、特殊なランタイムが必要な場合は別の方法を考えるが、この問題では当てはまらない。","point":"低頻度で短時間の定期処理は、常時起動の EC2 ではなく EventBridge Scheduler と Lambda（最大 15 分）に移す。","diagram":{"caption":"正解の構成: EventBridge Scheduler と Lambda で定期処理を実行","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sch","label":"EventBridge","sub":"Scheduler 毎日 2 時","kind":"integration","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"集計処理","kind":"serverless","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"入力・集計結果","kind":"storage","c":2,"r":0}],"edges":[{"from":"sch","to":"fn","label":"起動"},{"from":"fn","to":"s3","both":true}]}},{"id":"d4-22","domain":4,"topic":"S3","type":"single","stem":"ある写真共有サービスは、アップロードされた元画像を Amazon S3 Standard に保存し、表示用のサムネイル画像を別のバケットに保存しています。サムネイルは数 TB あり、元画像からいつでも再生成できます。古いサムネイルは参照される頻度が低いですが、参照されたときはミリ秒単位で取得できる必要があります。サムネイルは長期間保管されます。ソリューションアーキテクトは、保管コストを最小限に抑える必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["サムネイルを S3 One Zone-IA に保存する。元画像は S3 Standard のまま保管し、必要になればサムネイルを再生成できるようにする。","サムネイルを S3 Standard-IA に保存する。複数の AZ に冗長化されるので、サムネイルが失われる可能性を最小限にする。","サムネイルを S3 Glacier Flexible Retrieval に保存する。取り出しが必要なときに復元リクエストを送る。","サムネイルを S3 Standard に保存し、30 日後に S3 Glacier Deep Archive へ移行するライフサイクルルールを設定する。"],"answer":[0],"why":["One Zone-IA は 1 つの AZ にだけ保存する分、Standard-IA よりも安い。再作成できるデータで、低頻度でもミリ秒で取得できるという要件に合う。","ミリ秒で取得でき低頻度向けだが、複数の AZ に保存する分、One Zone-IA より高い。元画像から再生成できるサムネイルには冗長性が過剰になる。","保管料は安いが、取り出しに数分から数時間かかる。ミリ秒で取得するという要件を満たさない。","Deep Archive は取り出しに数時間以上かかるため、参照時にミリ秒で取得する要件を満たさない。"],"explain":"決め手は「元画像から再生成できる」「低頻度」「参照時はミリ秒」「コスト最小」。再作成できるデータは、1 つの AZ にだけ保存する S3 One Zone-IA を選べる。Glacier Flexible Retrieval や Deep Archive は取り出しに時間がかかり、要件を満たさない。再作成できないデータには One Zone-IA を使わないこと（AZ の障害で失われる）。","point":"再作成できる低頻度アクセスのデータは S3 One Zone-IA。AZ が失われるとデータも失われるので、元データは別に持つ。","diagram":null},{"id":"d4-23","domain":4,"topic":"ELB","type":"single","stem":"ある企業は、3 つのマイクロサービス（注文、在庫、会員）を、サービスごとに専用の Application Load Balancer を用意して Amazon ECS で運用しています。サービスはそれぞれ api-order.example.com、api-stock.example.com、api-member.example.com の別々のドメイン名で公開されており、ALB の時間料金が増えています。ソリューションアーキテクトは、ドメイン名を変えずにロードバランサーのコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["3 つの ALB を Network Load Balancer 3 台に置き換え、それぞれのドメイン名を TLS リスナーで受け付ける。","3 つの ALB を 1 つに統合する。ホストヘッダーに基づくリスナールールで、ドメイン名ごとのターゲットグループへ転送する。3 つのドメインの証明書をリスナーに追加する。","3 つの ALB は残したまま、前段に Amazon CloudFront ディストリビューションを 1 つ配置する。ドメイン名ごとにオリジンを切り替える。","3 つの ALB を 1 つに統合する。パスベースのルーティングで /order、/stock、/member に転送し、クライアントが新しい URL を使うよう通知する。"],"answer":[1],"why":["NLB に置き換えても台数は同じで、ロードバランサーの数は減らない。ホスト名による振り分けも ALB のような柔軟さがない。","1 つの ALB でホストヘッダーによるルーティングができるので、ドメイン名を変えずに台数を 1 つにまとめられる。複数のドメインの証明書は同じリスナーに追加できる。","ALB は 3 つのまま残り、CloudFront が追加されて構成が複雑になる。ロードバランサーの料金は減らない。","ALB は 1 つにできるが、パスベースにするとドメイン名（URL）を変えることになり、「ドメイン名を変えずに」という要件を満たさない。"],"explain":"「別々のドメイン名」「ドメイン名は変えない」「ALB のコスト削減」から、ホストベースルーティングを使って ALB を統合する。ALB のリスナールールでは、ホストヘッダー、パス、ヘッダーなどの条件でターゲットグループに振り分けられる。複数のドメインを使う場合は、リスナーに複数の証明書を追加できる。ALB はロードバランサーごとの時間料金がかかるので、まとめるほどコストが下がる。","point":"複数の ALB は、ホストベース・パスベースのルールで 1 つに統合できる。ドメイン名を変えたくないならホストベースを選ぶ。","diagram":{"caption":"正解の構成: 1 つの ALB でホスト名ごとにターゲットグループへ転送","cols":3,"rows":3,"groups":[],"nodes":[{"id":"user","label":"クライアント","sub":"3 つのドメイン名","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"ホストヘッダーで分岐","kind":"network","c":1,"r":1},{"id":"ord","label":"注文サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":0},{"id":"stk","label":"在庫サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":1},{"id":"mem","label":"会員サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":2}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"ord"},{"from":"alb","to":"stk"},{"from":"alb","to":"mem"}]}},{"id":"d4-24","domain":4,"topic":"VPC","type":"single","stem":"ある企業は、同じ AWS リージョンで 20 個の VPC を運用しています。各 VPC のプライベートサブネットにあるインスタンスは、OS の更新プログラムを取得するために、VPC ごとに用意した NAT ゲートウェイ経由でインターネットに出ています。NAT ゲートウェイの時間料金が増えており、VPC は今後も増える予定です。ソリューションアーキテクトは、運用上のオーバーヘッドを抑えながら、インターネットへの出口にかかるコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各 VPC の NAT ゲートウェイを残したまま、VPC ピアリングで 20 個の VPC をフルメッシュで接続し、NAT ゲートウェイを共有できるようにする。","出口用の VPC を作成し、NAT ゲートウェイを配置する。AWS Transit Gateway で各 VPC を出口用 VPC に接続し、各 VPC のデフォルトルートを Transit Gateway に向ける。","出口用の VPC を作成し、NAT ゲートウェイを配置する。各 VPC と出口用 VPC を VPC ピアリングで接続し、各 VPC のデフォルトルートをピアリング接続に向ける。","各 VPC の NAT ゲートウェイを削除し、各 VPC に NAT インスタンスとして動作する EC2 インスタンスを配置する。OS の更新は各チームが管理する。"],"answer":[1],"why":["VPC ピアリングは、ピア先の VPC を経由して別のネットワーク（NAT ゲートウェイやインターネット）に出ることができない。NAT ゲートウェイの数も減らない。","Transit Gateway は多数の VPC を中心で接続でき、VPC が増えても接続の管理が簡単。NAT ゲートウェイを出口用 VPC に集約し、各 VPC の NAT ゲートウェイを不要にできる。","VPC ピアリングは推移的なルーティングができず、ピア先 VPC にある NAT ゲートウェイをインターネットへの出口として使えない。この構成は動作しない。","NAT ゲートウェイの時間料金は減るが、NAT インスタンスの OS 管理・パッチ適用・可用性の確保が必要になり、運用上のオーバーヘッドが大きい。"],"explain":"「多数の VPC」「今後も増える」「NAT ゲートウェイを減らしたい」「運用負荷を抑える」から、出口を 1 か所に集約し、Transit Gateway でつなぐ構成を選ぶ。VPC ピアリングは 1 対 1 の接続で、推移的ルーティングができないため、集約した出口を共有する用途には使えない。Transit Gateway にはアタッチメントの時間料金とデータ処理料金がかかるが、VPC 数が多いほど NAT ゲートウェイの削減効果が大きくなる。","point":"多数の VPC の出口を集約するなら、Transit Gateway と出口用 VPC の NAT ゲートウェイ。VPC ピアリングは推移的ルーティング不可。","diagram":{"caption":"正解の構成: Transit Gateway で出口用 VPC の NAT に集約","cols":4,"rows":2,"groups":[{"label":"出口用 VPC","kind":"vpc","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"va","label":"VPC A","sub":"プライベート側 EC2","kind":"compute","c":0,"r":0},{"id":"vb","label":"VPC B","sub":"プライベート側 EC2","kind":"compute","c":0,"r":1},{"id":"tgw","label":"Transit Gateway","sub":"ハブ","kind":"network","c":1,"r":0},{"id":"nat","label":"NAT ゲートウェイ","sub":"出口を集約","kind":"network","c":2,"r":0},{"id":"net","label":"インターネット","sub":"更新プログラム","kind":"client","c":3,"r":0}],"edges":[{"from":"va","to":"tgw"},{"from":"vb","to":"tgw"},{"from":"tgw","to":"nat"},{"from":"nat","to":"net"}]}}];

  '65 問のうち 15 問は採点対象外で、どれかは分からない。1 問あたり 2 分が目安。迷った問題は印を付けて先に進む。',
];
const GEO = { CW: 200, CH: 120, NW: 120, NH: 48, PAD: 14 };
const LETTERS = 'ABCDEF';
const QMAP = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));
const LS = { progress: 'saa-drill/progress/v1', sessions: 'saa-drill/sessions/v1', prefs: 'saa-drill/prefs/v1' };

/* ---------- 小道具 ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const range = (n) => Array.from({ length: n }, (_, i) => i);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (x) => Math.round(x * 100);
const dispWidth = (s) => [...String(s)].reduce((n, ch) => n + (ch.codePointAt(0) < 0x1100 ? 1 : 2), 0);
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
}
function fmtDate(t) {
  const d = new Date(t);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できない環境では何もしない */ } }
const domainOf = (n) => DOMAINS.find((d) => d.n === n);
const ICON = {
  ok: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M5.5 10.4l3 3 6-6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ng: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  dash: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M6 10h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};

/* ---------- 学習記録 ---------- */
const emptyProgress = () => ({ v: 1, stats: {}, exams: [], resetAt: 0, updatedAt: 0 });
function normalize(p) {
  p = p && typeof p === 'object' ? p : {};
  return {
    v: 1,
    stats: p.stats && typeof p.stats === 'object' ? p.stats : {},
    exams: Array.isArray(p.exams) ? p.exams : [],
    resetAt: +p.resetAt || 0,
    updatedAt: +p.updatedAt || 0,
  };
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const resetAt = Math.max(a.resetAt, b.resetAt);
  const stats = {};
  for (const src of [a.stats, b.stats]) {
    for (const [id, s] of Object.entries(src)) {
      if (!s || (s.t || 0) <= resetAt) continue;
      if (!stats[id] || (s.t || 0) > (stats[id].t || 0)) stats[id] = s;
    }
  }
  const ex = new Map();
  for (const e of [...a.exams, ...b.exams]) if (e && e.id && (e.at || 0) > resetAt) ex.set(e.id, e);
  return { v: 1, stats, exams: [...ex.values()].sort((x, y) => x.at - y.at).slice(-30), resetAt, updatedAt: Math.max(a.updatedAt, b.updatedAt) };
}
function hasNewer(local, remote) {
  local = normalize(local); remote = normalize(remote);
  if (local.resetAt > remote.resetAt) return true;
  for (const [id, s] of Object.entries(local.stats)) if (!remote.stats[id] || (s.t || 0) > (remote.stats[id].t || 0)) return true;
  const ids = new Set(remote.exams.map((e) => e.id));
  return local.exams.some((e) => !ids.has(e.id));
}
const differs = (a, b) => hasNewer(a, b) || hasNewer(b, a);
const hasData = (p) => Object.keys(p.stats).length > 0 || p.exams.length > 0 || p.resetAt > 0;

let progress = normalize(lsGet(LS.progress) || emptyProgress());
const saveLocal = () => lsSet(LS.progress, progress);
function save() { progress.updatedAt = Date.now(); saveLocal(); Sync.flush(); }

const st = (id) => progress.stats[id];
const isWeak = (id) => { const s = st(id); return !!s && s.a > s.c && s.s < 2; };
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
const isCorrect = (q, picks) => sameSet(q.answer, picks || []);
function record(id, ok) {
  const s = Object.assign({ a: 0, c: 0, s: 0, l: 0, t: 0 }, progress.stats[id]);
  s.a++;
  if (ok) { s.c++; s.s++; } else { s.s = 0; }
  s.l = ok ? 1 : 0;
  s.t = Date.now();
  progress.stats[id] = s;
}
// 習熟度から見た「解く価値」。未回答 1、苦手・直近で誤答 1.3、1 回正解 0.45、2 回続けて正解は日数とともに少しずつ戻る。
function needOf(id) {
  const s = st(id);
  if (!s) return 1;
  if (isWeak(id) || !s.l) return 1.3;
  if (s.s < 2) return 0.45;
  return Math.min(0.4, 0.1 + ((Date.now() - s.t) / 864e5) * 0.02);
}
const priority = (q) => (domainOf(q.domain).w / 25) * topicWeight(q.topic) * needOf(q.id);
const MIN_FOR_ESTIMATE = 3;
// 配点で重み付けした予想得点率と、分野ごとの伸びしろ（全体の得点率で何ポイント上がり得るか）
function estimate() {
  let wsum = 0, acc = 0, ready = true;
  const per = DOMAINS.map((d) => {
    const s = summarize(QUESTIONS.filter((q) => q.domain === d.n));
    const measured = s.answered >= MIN_FOR_ESTIMATE;
    if (measured) { wsum += d.w; acc += d.w * s.rate; } else ready = false;
    const gain = d.w * (1 - (measured ? s.rate : 0.5));
    return { d, s, measured, gain };
  });
  return { ready, value: ready && wsum ? acc / wsum : null, per };
}
function focusTopics(limit) {
  const topics = [...new Set(QUESTIONS.map((q) => q.topic))].map((t) => {
    const qs = QUESTIONS.filter((q) => q.topic === t);
    const s = summarize(qs);
    const w = qs.reduce((a, q) => a + domainOf(q.domain).w, 0) / qs.length / 25;
    const score = topicWeight(t) * w * (s.answered ? 1 - s.rate + s.weak / qs.length : 0.8);
    return { t, s, score, freq: HIGH_FREQ.has(t) };
  });
  return topics.filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, limit);
}
function summarize(qs) {
  let answered = 0, okLatest = 0, weak = 0;
  for (const q of qs) {
    const s = st(q.id);
    if (!s) continue;
    answered++;
    if (s.l) okLatest++;
    if (isWeak(q.id)) weak++;
  }
  return { total: qs.length, answered, okLatest, weak, rate: answered ? okLatest / answered : null };
}

/* ---------- アカウントへの保存（db） ---------- */
const SYNC_TEXT = {
  local: ['この端末に保存', '学習記録はこの端末のブラウザにだけ保存しています。ほかの端末とは同期しません。'],
  syncing: ['同期中…', 'アカウントの学習記録を読み込んでいます。'],
  saving: ['保存中…', 'アカウントに保存しています。'],
  cloud: ['保存済み', 'アカウントに保存しています。ほかの端末で開いても続きから使えます。'],
  waiting: ['同期待ち', '保存先に接続できていません。この端末には保存しているので、つながりしだい同期します。'],
  error: ['保存エラー', 'アカウントへの保存に失敗しました。この端末には保存しています。'],
};
const Sync = {
  state: 'local', ref: null, writing: false, dirty: false,
  set(state, code) {
    this.state = state;
    const el = document.getElementById('sync');
    if (!el) return;
    const [label, title] = SYNC_TEXT[state] || SYNC_TEXT.local;
    el.dataset.state = state;
    el.title = title + (code ? `（${code}）` : '');
    el.lastElementChild.textContent = label;
  },
  async init() {
    for (let i = 0; i < 5 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise((r) => setTimeout(r, 300));
    if (!window.claude || typeof window.claude.use !== 'function') { this.set('local'); return; }
    this.set('syncing');
    const timer = setTimeout(() => { if (this.state === 'syncing') this.set('waiting'); }, 10000);
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { clearTimeout(timer); this.set('local'); return; }
      this.ref = db.collection('data/users/' + uid).doc('progress');
      const snap = await this.ref.get();
      clearTimeout(timer);
      const remote = snap.exists ? snap.data() : null;
      if (remote) {
        const m = merge(remote, progress);
        const changed = differs(m, progress);
        progress = m;
        saveLocal();
        if (changed) refreshPassive();
      }
      if (remote ? hasNewer(progress, remote) : hasData(progress)) await this.flush();
      else this.set('cloud');
      this.ref.onSnapshot((s) => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        const m = merge(progress, s.data());
        if (differs(m, progress)) { progress = m; saveLocal(); refreshPassive(); }
      }, () => { if (!this.writing) this.set('waiting'); });
    } catch (e) {
      clearTimeout(timer);
      this.set('error', e && e.code);
    }
  },
  async flush() {
    if (!this.ref) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    this.set('saving');
    try {
      do {
        this.dirty = false;
        const body = JSON.parse(JSON.stringify(progress));
        try {
          await this.ref.set(body);
        } catch (e) {
          if (!e || e.code !== 'unavailable') throw e;
          await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
          await this.ref.set(body);
        }
      } while (this.dirty);
      this.set('cloud');
    } catch (e) {
      this.set('error', e && e.code);
    } finally {
      this.writing = false;
    }
  },
};

/* ---------- セッション（解答中の状態。この端末に保持） ---------- */
let sessions = (() => {
  const s = lsGet(LS.sessions) || {};
  const ok = (x) => x && Array.isArray(x.ids) && x.ids.length && x.ids.every((id) => QMAP[id]);
  return { practice: ok(s.practice) ? s.practice : null, exam: ok(s.exam) ? s.exam : null };
})();
const saveSessions = () => lsSet(LS.sessions, sessions);
let prefs = Object.assign({ domains: [1, 2, 3, 4], count: '10', order: 'smart', topic: '' }, lsGet(LS.prefs) || {});
const ui = { confirm: null, detail: null, examView: null };

function newSession(kind, ids) {
  return {
    kind, ids, i: 0, picks: {}, done: {}, flags: {},
    perm: Object.fromEntries(ids.map((id) => [id, shuffle(range(QMAP[id].choices.length))])),
    startedAt: Date.now(), finished: false,
  };
}

/* ---------- 出題の組み立て ---------- */
function practicePool(p) {
  return QUESTIONS.filter((q) => p.domains.includes(q.domain) && (!p.topic || q.topic === p.topic) && (p.order !== 'weak' || isWeak(q.id)));
}
function pickPractice(p) {
  const pool = practicePool(p);
  const n = p.count === 'all' ? pool.length : Math.min(pool.length, +p.count || 10);
  let ordered;
  if (p.order === 'smart') {
    // 合格に効く順: 配点 × 頻出度 × 習熟度。少しだけ揺らして毎回同じ並びにならないようにする。
    ordered = pool.map((q) => [q, priority(q) * (0.85 + Math.random() * 0.3)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
  } else {
    ordered = shuffle(pool);
  }
  return shuffle(ordered.slice(0, n)).map((q) => q.id);
}
// 重み付きの無作為抽出（重いものほど前に来やすい）
const weightedShuffle = (items, w) => items.map((x) => [x, Math.pow(Math.random(), 1 / w(x))]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
function examCounts(total) {
  const raw = DOMAINS.map((d) => ({ n: d.n, x: (total * d.w) / 100 }));
  const out = Object.fromEntries(raw.map((r) => [r.n, Math.floor(r.x)]));
  let left = total - Object.values(out).reduce((a, b) => a + b, 0);
  for (const r of raw.slice().sort((a, b) => (b.x % 1) - (a.x % 1))) { if (left <= 0) break; out[r.n]++; left--; }
  return out;
}
function pickExam() {
  const total = Math.min(EXAM.n, QUESTIONS.length);
  const want = examCounts(total);
  const chosen = [];
  const spare = [];
  for (const d of DOMAINS) {
    const pool = weightedShuffle(QUESTIONS.filter((q) => q.domain === d.n), (q) => topicWeight(q.topic));
    chosen.push(...pool.slice(0, want[d.n]));
    spare.push(...pool.slice(want[d.n]));
  }
  if (chosen.length < total) chosen.push(...shuffle(spare).slice(0, total - chosen.length));
  return shuffle(chosen).map((q) => q.id);
}

/* ---------- 構成図 ---------- */
let dgSeq = 0;
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes)) return '';
  const { CW, CH, NW, NH, PAD } = GEO;
  const W = d.cols * CW + PAD * 2, H = d.rows * CH + PAD * 2;
  const mid = 'ah' + (++dgSeq);
  const groups = Array.isArray(d.groups) ? d.groups : [];
  const inside = (a, b) => a.c <= b.c && a.r <= b.r && a.c + a.w >= b.c + b.w && a.r + a.h >= b.r + b.h;
  let gs = '';
  groups.forEach((g, i) => {
    let depth = 0;
    for (let j = 0; j < i; j++) if (inside(groups[j], g)) depth++;
    const inset = 4 + depth * 12;
    const x = PAD + g.c * CW + inset, y = PAD + g.r * CH + inset, w = g.w * CW - inset * 2, h = g.h * CH - inset * 2;
    gs += `<g class="g g-${esc(g.kind)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="g-label" x="${x + 10}" y="${y}" dominant-baseline="central">${esc(g.label)}</text></g>`;
  });
  const C = (n) => ({ x: PAD + n.c * CW + CW / 2, y: PAD + n.r * CH + CH / 2 });
  const byId = Object.fromEntries(d.nodes.map((n) => [n.id, n]));
  let es = '', ls = '';
  for (const e of d.edges || []) {
    const A = byId[e.from], B = byId[e.to];
    if (!A || !B) continue;
    const a = C(A), b = C(B), dx = b.x - a.x, dy = b.y - a.y;
    const hw = NW / 2 + 4, hh = NH / 2 + 4;
    const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    const x1 = a.x + dx * t, y1 = a.y + dy * t, x2 = b.x - dx * t, y2 = b.y - dy * t;
    es += `<line class="e-line${e.style === 'dashed' ? ' dashed' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" marker-end="url(#${mid})"${e.both ? ` marker-start="url(#${mid})"` : ''}/>`;
    if (e.label) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      if (Math.abs(dy) < 1) ls += `<text class="e-label" x="${mx}" y="${my - 8}" text-anchor="middle">${esc(e.label)}</text>`;
      else if (Math.abs(dx) < 1) ls += `<text class="e-label" x="${mx + 7}" y="${my}" dominant-baseline="central">${esc(e.label)}</text>`;
      else ls += `<text class="e-label" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central">${esc(e.label)}</text>`;
    }
  }
  let ns = '';
  for (const n of d.nodes) {
    const c = C(n);
    const tight = dispWidth(n.label) > 14 ? ' tight' : '';
    ns += `<g style="--k:var(--k-${esc(n.kind)})"><rect class="n-box" x="${c.x - NW / 2}" y="${c.y - NH / 2}" width="${NW}" height="${NH}" rx="7"/><rect class="n-kind" x="${c.x - NW / 2 + 8}" y="${c.y - NH / 2 - 2.5}" width="18" height="5" rx="2.5"/>`;
    if (n.sub) ns += `<text class="n-label${tight}" x="${c.x}" y="${c.y - 7}" text-anchor="middle" dominant-baseline="central">${esc(n.label)}</text><text class="n-sub" x="${c.x}" y="${c.y + 11}" text-anchor="middle" dominant-baseline="central">${esc(n.sub)}</text>`;
    else ns += `<text class="n-label${tight}" x="${c.x}" y="${c.y}" text-anchor="middle" dominant-baseline="central">${esc(n.label)}</text>`;
    ns += '</g>';
  }
  const svg = `<svg class="dg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:${Math.round(W * 0.72)}px" role="img" aria-label="${esc(d.caption)}">
<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="e-head" d="M0,0L10,5L0,10z"/></marker></defs>
${gs}${es}${ns}${ls}</svg>`;
  return `<figure class="figure"><figcaption>${esc(d.caption)}</figcaption><div class="dg-wrap">${svg}</div></figure>`;
}

/* ---------- 問題カードと解説 ---------- */
function qcard(q, perm, picks, mode) {
  const multi = q.type === 'multi';
  const need = q.answer.length;
  const dom = domainOf(q.domain);
  const choices = perm.map((orig, k) => {
    const sel = picks.includes(orig);
    const corr = q.answer.includes(orig);
    let cls = 'choice', mark = '';
    if (mode === 'reveal') {
      if (corr) { cls += ' is-correct'; mark = ICON.ok + (sel ? 'あなたの回答' : '正解'); }
      else if (sel) { cls += ' is-wrong'; mark = ICON.ng + 'あなたの回答'; }
    }
    return `<button type="button" class="${cls}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel}" data-act="pick" data-i="${orig}" data-key="c${k}"${mode === 'reveal' ? ' aria-disabled="true"' : ''}><span class="letter">${LETTERS[k]}</span><span class="ctext">${esc(q.choices[orig])}</span><span class="mark">${mark}</span></button>`;
  }).join('');
  return `<article class="qcard">
  <div class="qmeta"><span class="chip">第 ${q.domain} 分野 ${esc(dom ? dom.short : '')}</span><span class="chip">${esc(q.topic)}</span>${multi ? `<span class="chip">${need} つ選択</span>` : ''}<span class="qid">${esc(q.id)}</span></div>
  <p class="stem">${esc(q.stem)}${multi ? `<span class="need">（${need} つ選択してください。）</span>` : ''}</p>
  <div class="choices" role="${multi ? 'group' : 'radiogroup'}" aria-label="選択肢">${choices}</div>
</article>`;
}
function feedback(q, perm, picks) {
  const ok = isCorrect(q, picks);
  const answered = picks.length > 0;
  const corr = perm.map((o, k) => (q.answer.includes(o) ? LETTERS[k] : null)).filter(Boolean).join('・');
  const whys = perm.map((o, k) => {
    const c = q.answer.includes(o);
    return `<li class="${c ? 'w-ok' : 'w-ng'}"><span class="wl">${LETTERS[k]}</span><div><span class="wtag">${c ? '正しい' : '誤り'}${picks.includes(o) ? ' · あなたの回答' : ''}</span><p>${esc(q.why[o])}</p></div></li>`;
  }).join('');
  const verdict = !answered
    ? `<div class="verdict ng">${ICON.dash}<strong>未回答</strong><span class="ans">正解は ${corr}</span></div>`
    : `<div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? ICON.ok : ICON.ng}<strong>${ok ? '正解' : '不正解'}</strong><span class="hud-label">${ok ? 'HIT' : 'MISS'}</span><span class="ans">正解は ${corr}</span></div>`;
  return `<section class="fb" id="fb" aria-live="polite">
  ${verdict}
  <div class="fb-block"><h3>解説</h3><p>${esc(q.explain)}</p></div>
  ${renderDiagram(q.diagram)}
  <div class="fb-block"><h3>選択肢ごとの理由</h3><ul class="whys">${whys}</ul></div>
  <div class="point"><h3>覚えるポイント</h3><p>${esc(q.point)}</p></div>
</section>`;
}
const confirmBox = (msg, yesAct, yesLabel, noAct, noLabel, tone) => `<div class="confirm${tone === 'neutral' ? ' neutral' : ''}" role="alertdialog" aria-label="${esc(msg)}"><p>${esc(msg)}</p><div class="btn-row"><button type="button" class="btn ${tone === 'neutral' ? 'primary' : 'danger'}" data-act="${yesAct}" data-key="confirm-yes">${yesLabel}</button><button type="button" class="btn" data-act="${noAct}">${noLabel}</button></div></div>`;
const meter = (v, passLine) => `<div class="meter" role="img" aria-label="${v == null ? '記録なし' : pct(v) + '%'}">${v == null ? '' : `<span style="width:${Math.max(0, Math.min(100, v * 100))}%"></span>`}${passLine ? `<i class="pass" style="left:calc(${EXAM.pass}% - 1px)"></i>` : ''}</div>`;

/* ---------- ホーム ---------- */
// 予想得点率のゲージ。分野ごとの回答が足りないうちは回答率を表示する。
function heroPanel(all, est, weakN) {
  const ready = est.value != null;
  const v = ready ? est.value : all.total ? all.answered / all.total : 0;
  const p = pct(v);
  const R = 52, C = 2 * Math.PI * R;
  const a = ((EXAM.pass / 100) * 360 - 90) * (Math.PI / 180);

function examStats(rec) {

    if (!q) continue;
    by[q.domain].n++;
    if (isCorrect(q, p)) by[q.domain].c++;
  }
  return by;
}

    if (!q) return '';
    const res = !p.length ? '' : isCorrect(q, p) ? 'r-ok' : 'r-ng';
    return `<button type="button" class="${res}" data-act="exam-detail" data-n="${k}" aria-label="問題 ${k + 1}（${!p.length ? '未回答' : isCorrect(q, p) ? '正解' : '不正解'}）">${k + 1}</button>`;
  }).join('');
  const unanswered = rec.items.filter(([, p]) => !p.length).length;
  return `
  <div class="page-head"><p class="eyebrow">模擬試験の結果 · ${fmtDate(rec.at)}</p><h1>${rec.n} 問中 ${rec.c} 問正解</h1></div>
  <section class="score">
    <div class="big"><span class="pct">${pct(r)}<small>%</small></span><span class="chip ${pass ? 'ok' : 'ng'}">${pass ? ICON.ok + `合格の目安 ${EXAM.pass}% 以上` : ICON.ng + `合格の目安 ${EXAM.pass}% 未満`}</span></div>
    ${meter(r, true)}
    <div class="scale"><span>0%</span><span>目安 ${EXAM.pass}%</span><span>100%</span></div>
    <p class="small muted">所要時間 ${fmtDur(rec.sec)} / ${EXAM.min}:00${rec.auto ? '（時間切れで自動採点）' : ''}${unanswered ? ` · 未回答 ${unanswered} 問` : ''}</p>
  </section>
  <section class="section"><h2 data-hud="SECTORS">分野別</h2><div class="rows">${doms}</div></section>
  <section class="section"><div class="section-head"><h2 data-hud="RESULT MAP">問題ごとの結果</h2><div class="legend"><span><i class="r-ok"></i>正解</span><span><i class="r-ng"></i>不正解</span><span><i></i>未回答</span></div></div><p class="small muted">番号を押すと解説を開きます。</p><div class="grid-nav">${grid}</div></section>
  <div class="btn-row">${rec.items.some(([id, p]) => QMAP[id] && !isCorrect(QMAP[id], p)) ? '<button type="button" class="btn primary" data-act="exam-retry">間違えた問題を演習する</button>' : ''}<button type="button" class="btn" data-act="exam-close">模試のトップへ</button></div>`;
}
function viewExamDetail(rec) {
  const k = ui.detail;
  const [id, p] = rec.items[k];
  const q = QMAP[id];
  const perm = (sessions.exam && sessions.exam.resultId === rec.id && sessions.exam.perm[id]) || range(q.choices.length);
  return `
  <div class="run-head"><div class="run-title"><span class="kind">模試の解説</span><span class="pos">問題 <b>${k + 1}</b> / ${rec.items.length}</span></div><button type="button" class="btn ghost sm" data-act="detail-close">結果に戻る</button></div>
  ${qcard(q, perm, p, 'reveal')}
  ${feedback(q, perm, p)}
  <div class="exam-nav"><button type="button" class="btn" data-act="detail-prev"${k === 0 ? ' disabled' : ''}>前の問題</button><button type="button" class="btn ghost" data-act="detail-close">結果に戻る</button><button type="button" class="btn primary" data-act="detail-next"${k === rec.items.length - 1 ? ' disabled' : ''}>次の問題</button></div>`;
}
function finishExam(auto) {
  const s = sessions.exam;
  if (!s || s.finished) return;
  const items = s.ids.map((id) => [id, s.picks[id] || []]);
  let c = 0;
  for (const [id, p] of items) {
    const q = QMAP[id];
    const ok = p.length > 0 && isCorrect(q, p);
    if (ok) c++;
    if (p.length) record(id, ok);
  }
  const rec = {
    id: 'e' + s.startedAt.toString(36), at: Date.now(), n: items.length, c,
    sec: Math.min(Math.round((Date.now() - s.startedAt) / 1000), EXAM.min * 60), auto: !!auto, items,
  };
  progress.exams = progress.exams.filter((e) => e.id !== rec.id).concat(rec).slice(-30);
  save();
  s.finished = true;
  s.resultId = rec.id;
  saveSessions();
  ui.confirm = null; ui.detail = null; ui.examView = rec.id;
  stopTimer();
  if (route() === 'exam') { render(); window.scrollTo(0, 0); } else refreshPassive();
}
let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function ensureTimer() {
  const s = sessions.exam;
  if (s && !s.finished) { if (!timerId) timerId = setInterval(tick, 1000); tick(); }
  else stopTimer();
}
function tick() {
  const s = sessions.exam;
  if (!s || s.finished) { stopTimer(); return; }
  const left = s.deadline - Date.now();
  if (left <= 0) { finishExam(true); return; }
  const el = document.getElementById('timer');
  if (el) { el.textContent = fmtDur(left / 1000); el.classList.toggle('low', left < 10 * 60 * 1000); }
}

/* ---------- 成績 ---------- */
function viewStats() {
  const doms = DOMAINS.map((d) => {
    const s = summarize(QUESTIONS.filter((q) => q.domain === d.n));
    return `<tr><td>第 ${d.n} 分野 ${esc(d.short)}</td><td class="n">${d.w}%</td><td class="n">${s.answered} / ${s.total}</td><td class="n">${s.rate == null ? '—' : pct(s.rate) + '%'}</td><td>${meter(s.rate, true)}</td><td class="n">${s.weak}</td></tr>`;
  }).join('');
  const topics = [...new Set(QUESTIONS.map((q) => q.topic))].map((t) => ({ t, ...summarize(QUESTIONS.filter((q) => q.topic === t)) }));
  topics.sort((a, b) => (a.rate == null) - (b.rate == null) || (a.rate ?? 0) - (b.rate ?? 0) || b.weak - a.weak || a.t.localeCompare(b.t, 'ja'));
  const trows = topics.map((x) => `<tr><td>${esc(x.t)}${HIGH_FREQ.has(x.t) ? ' <span class="chip">頻出</span>' : ''}</td><td class="n">${x.answered} / ${x.total}</td><td class="n">${x.rate == null ? '—' : pct(x.rate) + '%'}</td><td>${meter(x.rate, true)}</td><td class="n">${x.weak}</td><td><button type="button" class="btn sm" data-act="start-topic" data-t="${esc(x.t)}">解く</button></td></tr>`).join('');
  const exams = progress.exams.slice().reverse();
  const confirm = ui.confirm === 'reset' ? confirmBox('すべての学習記録と模擬試験の結果を削除しますか。元に戻せません。', 'reset-confirm', '削除する', 'confirm-cancel', 'キャンセル') : '';
  return `
  <div class="page-head"><h1 data-hud="ANALYTICS">成績</h1><p class="lead">正答率は、各問題の最新の回答で計算しています。縦線は合格の目安 ${EXAM.pass}% です。</p></div>
  <section class="section"><h2 data-hud="SECTORS">分野別</h2><div class="table-wrap"><table><thead><tr><th>分野</th><th class="n">出題比率</th><th class="n">回答済み</th><th class="n">正答率</th><th></th><th class="n">苦手</th></tr></thead><tbody>${doms}</tbody></table></div></section>
  <section class="section"><div class="section-head"><h2 data-hud="TOPICS">トピック別</h2><span class="small muted">正答率の低い順</span></div><div class="table-wrap"><table><thead><tr><th>トピック</th><th class="n">回答済み</th><th class="n">正答率</th><th></th><th class="n">苦手</th><th></th></tr></thead><tbody>${trows}</tbody></table></div></section>
  ${strategyCard()}
  <section class="section"><h2 data-hud="SIMULATION LOG">模擬試験の記録</h2>${exams.length ? historyChart(progress.exams) + `<div class="rows">${exams.map(examRow).join('')}</div>` : '<div class="empty"><p>まだ記録はありません。模擬試験を受けると、ここに得点の推移が出ます。</p><a class="btn sm" href="#exam">模試へ</a></div>'}</section>
  <section class="section"><h2 data-hud="SYSTEM">記録の管理</h2><p class="small muted">${SYNC_TEXT[Sync.state] ? esc(SYNC_TEXT[Sync.state][1]) : ''}</p>${confirm}<div><button type="button" class="btn sm" data-act="reset-ask"${hasData(progress) && (Object.keys(progress.stats).length || progress.exams.length) ? '' : ' disabled'}>学習記録をリセット</button></div></section>
  ${footer()}`;
}
function historyChart(exams) {
  const W = 640, H = 210, m = { l: 40, r: 14, t: 14, b: 28 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const n = exams.length, slot = pw / n, bw = Math.min(28, slot * 0.6);
  const y = (v) => m.t + ph * (1 - v / 100);
  let s = '';
  for (const v of [0, 25, 50, 75, 100]) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v)}" text-anchor="end" dominant-baseline="central">${v}%</text>`;
  exams.forEach((e, i) => {
    const v = e.n ? (e.c / e.n) * 100 : 0;
    const x = m.l + slot * i + (slot - bw) / 2, top = y(v), base = y(0), h = base - top, r = Math.min(4, h / 2, bw / 2);
    const d = h > 0 ? `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z` : '';
    const tip = `${fmtDate(e.at)} · ${Math.round(v)}%（${e.c}/${e.n}）`;
    s += `<g data-tip="${esc(tip)}"><rect class="hit" x="${m.l + slot * i}" y="${m.t}" width="${slot}" height="${ph}"/>${d ? `<path class="bar" d="${d}"/>` : ''}</g>`;
    if (n <= 12 || i % Math.ceil(n / 12) === 0 || i === n - 1) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
  });
  s += `<line class="pass" x1="${m.l}" x2="${W - m.r}" y1="${y(EXAM.pass)}" y2="${y(EXAM.pass)}"/><text class="pass-label" x="${W - m.r}" y="${y(EXAM.pass) - 7}" text-anchor="end">合格の目安 ${EXAM.pass}%</text>`;
  return `<div class="chart" data-chart><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="模擬試験の正答率の推移（${n} 回）">${s}</svg><div class="tip" hidden></div></div>`;
}

/* ---------- 画面の切り替え ---------- */
const VIEWS = { home: viewHome, practice: viewPractice, exam: viewExam, stats: viewStats };
function route() { const h = (location.hash || '').slice(1); return VIEWS[h] ? h : 'home'; }
function render() {
  const r = route();
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  document.getElementById('view').innerHTML = VIEWS[r]();
  for (const a of document.querySelectorAll('.tabs a')) {
    if (a.dataset.tab === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  if (active) { const el = document.querySelector(`[data-key="${active}"]`); if (el) el.focus({ preventScroll: true }); }
  ensureTimer();
}
function refreshPassive() {
  const r = route();
  const busy = (r === 'practice' && sessions.practice && !sessions.practice.finished) || (r === 'exam' && sessions.exam && !sessions.exam.finished);
  if (!busy) render();
}
function go(r) {
  ui.confirm = null;
  if (route() === r) render(); else location.hash = '#' + r;
  window.scrollTo(0, 0);
}
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function startPractice(ids, kind) {
  if (!ids.length) return;
  sessions.practice = newSession(kind || 'practice', ids);
  saveSessions();
  go('practice');
}
function startReview() {
  const weak = shuffle(QUESTIONS.filter((q) => isWeak(q.id))).slice(0, 20).map((q) => q.id);
  startPractice(weak, 'review');
}

/* ---------- 操作 ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const r = route();
  const ps = sessions.practice, es = sessions.exam;
  switch (act) {
    case 'quick':
      startPractice(pickPractice({ domains: [1, 2, 3, 4], count: '10', order: 'smart', topic: '' }));
      break;
    case 'start-domain':
      startPractice(pickPractice({ domains: [+el.dataset.d], count: '10', order: 'smart', topic: '' }));
      break;
    case 'start-topic':
      startPractice(pickPractice({ domains: [1, 2, 3, 4], count: 'all', order: 'smart', topic: el.dataset.t }));
      break;
    case 'start-review':
      startReview();
      break;
    case 'pick': {
      if (el.getAttribute('aria-disabled') === 'true') return;
      const s = r === 'exam' ? es : ps;
      if (!s || s.finished) return;
      const id = s.ids[s.i], q = QMAP[id];
      if (r === 'practice' && s.done[id]) return;
      const i = +el.dataset.i;
      let p = (s.picks[id] || []).slice();
      if (q.type === 'single') p = [i];
      else if (p.includes(i)) p = p.filter((x) => x !== i);
      else { p.push(i); if (p.length > q.answer.length) p.shift(); }
      s.picks[id] = p;
      saveSessions();
      render();
      break;
    }
    case 'submit': {
      const id = ps.ids[ps.i], q = QMAP[id];
      const p = ps.picks[id] || [];
      if (p.length !== q.answer.length || ps.done[id]) return;
      ps.done[id] = true;
      record(id, isCorrect(q, p));
      save();
      saveSessions();
      render();
      const fb = document.getElementById('fb');
      if (fb) fb.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
      const nx = document.querySelector('[data-key="next"]');
      if (nx) nx.focus({ preventScroll: true });
      break;
    }
    case 'next':
      if (r === 'exam') { if (es.i < es.ids.length - 1) { es.i++; saveSessions(); render(); window.scrollTo(0, 0); } break; }
      if (ps.i < ps.ids.length - 1) ps.i++; else ps.finished = true;
      saveSessions();
      render();
      window.scrollTo(0, 0);
      break;
    case 'prev':
      if (es && es.i > 0) { es.i--; saveSessions(); render(); window.scrollTo(0, 0); }
      break;
    case 'goto':
      es.i = +el.dataset.n; saveSessions(); render(); window.scrollTo(0, 0);
      break;
    case 'flag': {
      const id = es.ids[es.i];
      if (es.flags[id]) delete es.flags[id]; else es.flags[id] = true;
      saveSessions(); render();
      break;
    }
    case 'quit-ask': ui.confirm = 'quit-practice'; render(); break;
    case 'quit-exam-ask': ui.confirm = 'quit-exam'; render(); break;
    case 'finish-ask': ui.confirm = 'finish'; render(); window.scrollTo(0, 0); break;
    case 'reset-ask': ui.confirm = 'reset'; render(); break;
    case 'confirm-cancel': ui.confirm = null; render(); break;
    case 'quit-confirm':
      ui.confirm = null;
      if (ps) { ps.finished = true; saveSessions(); }
      render(); window.scrollTo(0, 0);
      break;
    case 'quit-exam-confirm':
      ui.confirm = null; sessions.exam = null; saveSessions(); stopTimer(); render(); window.scrollTo(0, 0);
      break;
    case 'finish-confirm':
      finishExam(false);
      break;
    case 'retry-wrong': {
      const wrong = ps.ids.filter((id) => ps.done[id] && !isCorrect(QMAP[id], ps.picks[id]));
      startPractice(shuffle(wrong), 'review');
      break;
    }
    case 'practice-new':
      sessions.practice = null; saveSessions(); render(); window.scrollTo(0, 0);
      break;
    case 'start-exam': {
      const ids = pickExam();
      const s = newSession('exam', ids);
      s.deadline = s.startedAt + EXAM.min * 60 * 1000;
      sessions.exam = s;
      ui.examView = null; ui.detail = null; ui.confirm = null;
      saveSessions();
      go('exam');
      break;
    }
    case 'open-exam':
      ui.examView = el.dataset.id; ui.detail = null;
      if (sessions.exam && sessions.exam.finished && sessions.exam.resultId !== ui.examView) { sessions.exam = null; saveSessions(); }
      go('exam');
      break;
    case 'exam-detail': ui.detail = +el.dataset.n; render(); window.scrollTo(0, 0); break;
    case 'detail-prev': ui.detail--; render(); window.scrollTo(0, 0); break;
    case 'detail-next': ui.detail++; render(); window.scrollTo(0, 0); break;
    case 'detail-close': ui.detail = null; render(); window.scrollTo(0, 0); break;
    case 'exam-close':
      ui.examView = null; ui.detail = null;
      if (sessions.exam && sessions.exam.finished) { sessions.exam = null; saveSessions(); }
      render(); window.scrollTo(0, 0);
      break;
    case 'exam-retry': {
      const rec = progress.exams.find((e) => e.id === (ui.examView || (es && es.resultId)));
      if (!rec) break;
      startPractice(shuffle(rec.items.filter(([id, p]) => QMAP[id] && !isCorrect(QMAP[id], p)).map(([id]) => id)), 'review');
      break;
    }
    case 'reset-confirm':
      progress = { v: 1, stats: {}, exams: [], resetAt: Date.now(), updatedAt: Date.now() };
      sessions = { practice: null, exam: null };
      saveSessions();
      ui.confirm = null; ui.examView = null; ui.detail = null;
      save();
      render();
      break;
  }
});
document.addEventListener('change', (ev) => { if (ev.target.closest('#setup')) readSetup(); });
document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'setup') return;
  ev.preventDefault();
  readSetup();
  startPractice(pickPractice(prefs));
});
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag)) return;
  const r = route();
  const s = r === 'practice' ? sessions.practice : r === 'exam' ? sessions.exam : null;
  if (!s || s.finished || ui.confirm) return;
  if (/^[1-6]$/.test(ev.key)) {
    const btn = document.querySelector(`[data-key="c${+ev.key - 1}"]`);
    if (btn) { ev.preventDefault(); btn.click(); }
  } else if (ev.key === 'Enter' && ((tag !== 'button' && tag !== 'a') || ev.target.classList.contains('choice'))) {
    const btn = document.querySelector('[data-key="submit"]:not([disabled])') || document.querySelector('[data-key="next"]:not([disabled])');
    if (btn) { ev.preventDefault(); btn.click(); }
  }
});
document.addEventListener('pointermove', (ev) => {
  const chart = ev.target.closest && ev.target.closest('[data-chart]');
  for (const t of document.querySelectorAll('[data-chart] .tip')) if (!chart || !chart.contains(t)) t.hidden = true;
  if (!chart) return;
  const tip = chart.querySelector('.tip');
  const g = ev.target.closest('[data-tip]');
  if (!g) { tip.hidden = true; return; }
  const box = chart.getBoundingClientRect();
  const bar = (g.querySelector('.bar') || g).getBoundingClientRect();
  tip.textContent = g.dataset.tip;
  tip.style.left = Math.min(Math.max(bar.left + bar.width / 2 - box.left, 90), box.width - 90) + 'px';
  tip.style.top = Math.max(bar.top - box.top, 40) + 'px';
  tip.hidden = false;
});
window.addEventListener('hashchange', () => { ui.confirm = null; render(); window.scrollTo(0, 0); });

render();
Sync.set('local');
Sync.init();
})();
</script>
<script>
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
