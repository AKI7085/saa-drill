超過分をスポットインスタンスにする。複数のインスタンスタイプを指定する。","最大台数の 20 台分の EC2 Reserved Instances を 3 年契約で購入する。Auto Scaling グループは台数を固定して運用する。","Auto Scaling グループをオンデマンドインスタンスだけで構成する。ターゲット追跡スケーリングポリシーを設定し、負荷に応じて台数を調整する。"],"answer":[1],"why":["スポットだけで構成すると、スポット容量が不足したときや一斉に中断されたときに、最低限必要な台数を維持できずサービスが止まるおそれがある。単一のインスタンスタイプでは容量を確保しにくい。","平常時の台数をオンデマンド（Savings Plans などの割引を適用可能）で確保して可用性を守り、変動分を割引率の高いスポットにできる。複数のインスタンスタイプを指定すると、スポット容量を確保しやすくなる。","繁忙期にしか使わない台数まで長期契約すると、平常時に使わない分の料金も払い続けることになる。需要の変動に合わせてコストを下げられない。","可用性は保てるが、変動分にも割引のないオンデマンド料金がかかる。中断に耐えられる要件があるのに、その割引を活用できていない。"],"explain":"「平常時 4 台・繁忙期 20 台」「一部の終了は許容」「サービス停止は不可」「コスト最小」がそろったら、ベースライン分は安定した購入オプション、変動分はスポットという組み合わせを考える。Auto Scaling グループの混合インスタンスポリシーなら、オンデマンドの基準容量とスポットの割合を 1 つのグループで指定できる。スポットは複数のインスタンスタイプ・AZ に分散すると中断されにくくなる。","point":"混合インスタンスポリシーで、ベースラインはオンデマンド（Savings Plans）、変動分はスポットにする。スポットは複数のインスタンスタイプに分散する。","diagram":{"caption":"正解の構成: 基準容量はオンデマンド、超過分はスポットの混合 ASG","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"Web アクセス","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"負荷分散","kind":"network","c":1,"r":0},{"id":"od","label":"オンデマンド","sub":"基準容量 4 台","kind":"compute","c":2,"r":0},{"id":"spot","label":"スポット","sub":"超過分・複数タイプ","kind":"compute","c":2,"r":1}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"od"},{"from":"alb","to":"spot"}]}},{"id":"d4-18","domain":4,"topic":"購入オプション","type":"multi","stem":"ある企業は、Amazon SQS キューに登録された画像変換ジョブを、Amazon EC2 インスタンス上のワーカーで処理しています。ジョブは互いに独立しており、1 件あたり数分で完了します。同じジョブを再実行しても結果は変わりません。処理の完了期限には余裕があります。現在はオンデマンドインスタンスを使っており、ソリューションアーキテクトは、コストを大幅に削減することを求められています。最も費用対効果の高い方法でこれらの要件を満たす手順の組み合わせはどれですか。","choices":["ワーカーを Auto Scaling グループのスポットインスタンスで実行する。複数のインスタンスタイプと複数の AZ を指定し、スポット容量を確保しやすくする。","ワーカーを単一のインスタンスタイプ・単一の AZ のスポットインスタンスで実行する。容量が確保できなかった場合に備えて、台数を多めに設定する。","ワーカーをオンデマンドインスタンスのまま実行し、1 年契約の Compute Savings Plans を購入する。キューが空の時間帯も同じ契約量で利用する。","ワーカーでスポットインスタンスの中断通知を検知したら、新しいジョブの取得を止める。未完了のジョブは SQS の可視性タイムアウト後に別のワーカーが処理できるようにする。","ワーカーを Dedicated Hosts で実行し、他のお客様のワークロードによる中断が起きないようにする。"],"answer":[0,3],"why":["スポットは、複数のインスタンスタイプと AZ から確保できるようにすると、容量不足や中断の影響を受けにくくなる。中断に強いバッチ処理に向いている。","単一のタイプ・AZ に絞ると、そのスポットプールの容量不足や中断の影響を直接受ける。台数を増やしても確保できる保証にはならない。","割引は受けられるが、キューが空の時間帯や処理が少ない時間帯には使わない契約量が無駄になりやすい。中断に強い処理ならスポットの方が割引率は高い。","スポットインスタンスは終了の 2 分前に中断通知が出る。ジョブが SQS に残っていれば別のワーカーが再処理できるため、冪等なジョブなら中断の影響を吸収できる。","Dedicated Hosts は物理サーバーを専有する購入形態で、ライセンス要件などに使う。中断の回避が目的ではなく、費用も大きい。"],"explain":"「ジョブが独立・冪等」「数分で完了」「期限に余裕」「コスト大幅削減」は、スポットインスタンスを選ぶ条件そのもの。スポットは容量が必要になった AWS に回収されることがあるので、複数のインスタンスタイプ・AZ に分散して確保しやすくすることと、中断されても作業を失わない設計（キューに戻す、チェックポイントを残す）の 2 点を組み合わせる。","point":"中断に強いバッチは、スポットを複数タイプ・複数 AZ で使い、中断通知（2 分前）を受けて作業をキューに戻せるようにする。","diagram":null},{"id":"d4-19","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、開発チームが利用する検証用の Amazon EC2 インスタンスを 30 台、24 時間 365 日起動したままにしています。チームの作業時間は平日の 9 時から 19 時までで、夜間と週末にこれらのインスタンスが使われることはありません。インスタンスにはタグでチーム名が付けられています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えながら、コンピューティングコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["すべてのインスタンスをスポットインスタンスに置き換え、永続リクエストを設定する。中断されたインスタンスは自動的に再開されるようにする。","すべてのインスタンスについて、3 年契約・全前払いの EC2 Reserved Instances を購入する。常時起動のまま運用する。","Instance Scheduler on AWS をデプロイし、対象のインスタンスにスケジュールタグを付ける。平日の 9 時前に開始し、19 時以降と週末は停止する。","毎晩、管理者がインスタンスを終了する。翌朝、AMI から新しいインスタンスを手動で起動し、開発環境を再構築する。"],"answer":[2],"why":["スポットは割引になるが、使わない夜間や週末も起動し続けるため、使っていない時間の料金を減らせない。開発中に中断されると作業にも影響する。","長期契約で時間単価は下がるが、夜間と週末も含めて常に料金が発生する。使わない時間の料金そのものをなくすことはできない。","タグで対象を指定し、スケジュールに従って開始・停止を自動化できる。停止中はインスタンスのコンピューティング料金がかからず、運用の手間も小さい。","夜間の料金はなくなるが、毎日の手作業と環境の再構築が必要になり、運用上のオーバーヘッドが大きい。作業中のデータも失いやすい。"],"explain":"「使う時間帯が決まっている」「運用負荷を最小に」「コスト削減」がそろったら、使わない時間にインスタンスを止める。停止中のインスタンスは EC2 のコンピューティング料金がかからない（EBS ボリュームの料金は続く）。タグとスケジュールで開始・停止を自動化できる Instance Scheduler on AWS が適している。購入オプションは稼働時間が長いほど効果が大きいので、そもそも止められる環境では先に停止を考える。","point":"使う時間が決まっている開発・検証環境は、使わない時間に停止する。停止中は EC2 の料金がかからない（EBS は課金が続く）。","diagram":{"caption":"正解の構成: タグとスケジュールで EC2 を自動的に開始・停止","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sched","label":"スケジュール","sub":"平日 9 時〜19 時","kind":"integration","c":0,"r":0},{"id":"fn","label":"Instance Sched.","sub":"Lambda で実行","kind":"serverless","c":1,"r":0},{"id":"ec2","label":"開発用 EC2","sub":"タグで対象を指定","kind":"compute","c":2,"r":0}],"edges":[{"from":"sched","to":"fn"},{"from":"fn","to":"ec2","label":"開始・停止"}]}},{"id":"d4-20","domain":4,"topic":"Auto Scaling","type":"single","stem":"ある企業は、社内業務システムを Application Load Balancer の背後にある Amazon EC2 Auto Scaling グループで運用しています。利用者は平日の 8 時から 20 時に集中し、その間の負荷はほぼ一定です。夜間と週末はほとんどアクセスがありません。このパターンは毎週ほとんど変わりません。現在は、日中のピークに合わせた台数に固定しており、夜間も同じ台数が稼働しています。ソリューションアーキテクトは、可用性を維持しながらコンピューティングコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの最小・最大・希望容量を、日中のピークに合わせた台数に固定したまま、より大きなインスタンスタイプに変更する。","スケジュールされたスケーリングを設定する。夜間と週末は最小容量を下げ、平日の始業前に最小容量を戻す。","ピーク時の台数分について、3 年契約・全前払いの EC2 Reserved Instances を購入する。夜間も同じ契約量を使い続ける。","CloudWatch のアラームを設定し、アラームの通知を受けた管理者が、手作業で Auto Scaling グループの台数を変更する。"],"answer":[1],"why":["インスタンスを大きくしても台数は固定のままで、夜間の余剰は減らない。むしろ 1 台あたりの料金が上がる。","利用パターンが予測できるので、時刻に合わせて最小容量を変えられる。夜間・週末の台数を減らし、始業前に戻しておけば、朝の立ち上がりにも間に合う。","ピーク台数分を長期契約すると、夜間や週末に使わない分の費用も払い続ける。台数を減らして使用量を下げる方がコストを抑えられる。","台数の調整は可能だが、アラームのたびに手作業が必要で運用上のオーバーヘッドが大きい。通知の見落としで可用性やコストに影響する。"],"explain":"「平日の日中に集中」「その間の負荷はほぼ一定」「夜間・週末はほとんど無負荷」「パターンは毎週同じ」から、固定台数をやめて時刻に合わせて台数を変える。増減の時間帯が予測できるので、スケジュールされたスケーリングで夜間・週末は最小容量を下げ、始業前に戻すのが最も簡単で確実。日中に予測できない増減もある場合は、ターゲット追跡スケーリングを組み合わせる。","point":"予測できる増減はスケジュールされたスケーリング、予測できない増減はターゲット追跡スケーリングで対応する。","diagram":null},{"id":"d4-21","domain":4,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、1 日に 1 回、深夜 2 時に実行される売上集計処理を、常時起動している Amazon EC2 インスタンス上の cron で動かしています。処理は Amazon S3 のファイルを読み込んで集計結果を S3 に書き出すもので、毎回約 5 分で完了します。残りの時間、インスタンスはほとんど何もしていません。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えながら、コストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["EC2 インスタンスを Compute Savings Plans の対象にする。1 年契約で購入し、既存の cron による実行を継続する。","処理をコンテナ化し、Amazon ECS の Fargate で常時 1 タスクを起動するサービスとして実行する。タスク内の cron で毎日実行する。","EC2 インスタンスをより小さなタイプに変更し、Auto Scaling グループの最小・最大・希望容量を 1 に設定する。","処理を AWS Lambda 関数に移行する。Amazon EventBridge Scheduler で毎日 2 時に関数を呼び出し、S3 へのアクセス権限は Lambda の実行ロールで付与する。"],"answer":[3],"why":["割引は受けられるが、1 日 5 分しか使わないインスタンスを 24 時間分の契約量で払い続けることになる。実行時間に応じた課金にはならない。","サーバー管理は不要になるが、タスクを常時起動するので、処理していない時間の料金が発生し続ける。","インスタンスを小さくしても常時起動の料金がかかる。また、Auto Scaling は台数を維持する仕組みで、1 日 1 回の定期処理を減らす効果はない。","処理が 15 分以内なので Lambda で実行でき、実行時間分だけの課金になる。EventBridge Scheduler で定期起動でき、サーバーの管理も不要になる。"],"explain":"「1 日 1 回」「5 分で完了」「ほとんど何もしていない」は、常時起動のサーバーが向かない典型。Lambda は最大 15 分まで実行でき、実行した時間にだけ課金される。定期起動は EventBridge Scheduler で行える。処理が 15 分を超える場合や、特殊なランタイムが必要な場合は別の方法を考えるが、この問題では当てはまらない。","point":"低頻度で短時間の定期処理は、常時起動の EC2 ではなく EventBridge Scheduler と Lambda（最大 15 分）に移す。","diagram":{"caption":"正解の構成: EventBridge Scheduler と Lambda で定期処理を実行","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sch","label":"EventBridge","sub":"Scheduler 毎日 2 時","kind":"integration","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"集計処理","kind":"serverless","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"入力・集計結果","kind":"storage","c":2,"r":0}],"edges":[{"from":"sch","to":"fn","label":"起動"},{"from":"fn","to":"s3","both":true}]}},{"id":"d4-22","domain":4,"topic":"S3","type":"single","stem":"ある写真共有サービスは、アップロードされた元画像を Amazon S3 Standard に保存し、表示用のサムネイル画像を別のバケットに保存しています。サムネイルは数 TB あり、元画像からいつでも再生成できます。古いサムネイルは参照される頻度が低いですが、参照されたときはミリ秒単位で取得できる必要があります。サムネイルは長期間保管されます。ソリューションアーキテクトは、保管コストを最小限に抑える必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["サムネイルを S3 One Zone-IA に保存する。元画像は S3 Standard のまま保管し、必要になればサムネイルを再生成できるようにする。","サムネイルを S3 Standard-IA に保存する。複数の AZ に冗長化されるので、サムネイルが失われる可能性を最小限にする。","サムネイルを S3 Glacier Flexible Retrieval に保存する。取り出しが必要なときに復元リクエストを送る。","サムネイルを S3 Standard に保存し、30 日後に S3 Glacier Deep Archive へ移行するライフサイクルルールを設定する。"],"answer":[0],"why":["One Zone-IA は 1 つの AZ にだけ保存する分、Standard-IA よりも安い。再作成できるデータで、低頻度でもミリ秒で取得できるという要件に合う。","ミリ秒で取得でき低頻度向けだが、複数の AZ に保存する分、One Zone-IA より高い。元画像から再生成できるサムネイルには冗長性が過剰になる。","保管料は安いが、取り出しに数分から数時間かかる。ミリ秒で取得するという要件を満たさない。","Deep Archive は取り出しに数時間以上かかるため、参照時にミリ秒で取得する要件を満たさない。"],"explain":"決め手は「元画像から再生成できる」「低頻度」「参照時はミリ秒」「コスト最小」。再作成できるデータは、1 つの AZ にだけ保存する S3 One Zone-IA を選べる。Glacier Flexible Retrieval や Deep Archive は取り出しに時間がかかり、要件を満たさない。再作成できないデータには One Zone-IA を使わないこと（AZ の障害で失われる）。","point":"再作成できる低頻度アクセスのデータは S3 One Zone-IA。AZ が失われるとデータも失われるので、元データは別に持つ。","diagram":null},{"id":"d4-23","domain":4,"topic":"ELB","type":"single","stem":"ある企業は、3 つのマイクロサービス（注文、在庫、会員）を、サービスごとに専用の Application Load Balancer を用意して Amazon ECS で運用しています。サービスはそれぞれ api-order.example.com、api-stock.example.com、api-member.example.com の別々のドメイン名で公開されており、ALB の時間料金が増えています。ソリューションアーキテクトは、ドメイン名を変えずにロードバランサーのコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["3 つの ALB を Network Load Balancer 3 台に置き換え、それぞれのドメイン名を TLS リスナーで受け付ける。","3 つの ALB を 1 つに統合する。ホストヘッダーに基づくリスナールールで、ドメイン名ごとのターゲットグループへ転送する。3 つのドメインの証明書をリスナーに追加する。","3 つの ALB は残したまま、前段に Amazon CloudFront ディストリビューションを 1 つ配置する。ドメイン名ごとにオリジンを切り替える。","3 つの ALB を 1 つに統合する。パスベースのルーティングで /order、/stock、/member に転送し、クライアントが新しい URL を使うよう通知する。"],"answer":[1],"why":["NLB に置き換えても台数は同じで、ロードバランサーの数は減らない。ホスト名による振り分けも ALB のような柔軟さがない。","1 つの ALB でホストヘッダーによるルーティングができるので、ドメイン名を変えずに台数を 1 つにまとめられる。複数のドメインの証明書は同じリスナーに追加できる。","ALB は 3 つのまま残り、CloudFront が追加されて構成が複雑になる。ロードバランサーの料金は減らない。","ALB は 1 つにできるが、パスベースにするとドメイン名（URL）を変えることになり、「ドメイン名を変えずに」という要件を満たさない。"],"explain":"「別々のドメイン名」「ドメイン名は変えない」「ALB のコスト削減」から、ホストベースルーティングを使って ALB を統合する。ALB のリスナールールでは、ホストヘッダー、パス、ヘッダーなどの条件でターゲットグループに振り分けられる。複数のドメインを使う場合は、リスナーに複数の証明書を追加できる。ALB はロードバランサーごとの時間料金がかかるので、まとめるほどコストが下がる。","point":"複数の ALB は、ホストベース・パスベースのルールで 1 つに統合できる。ドメイン名を変えたくないならホストベースを選ぶ。","diagram":{"caption":"正解の構成: 1 つの ALB でホスト名ごとにターゲットグループへ転送","cols":3,"rows":3,"groups":[],"nodes":[{"id":"user","label":"クライアント","sub":"3 つのドメイン名","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"ホストヘッダーで分岐","kind":"network","c":1,"r":1},{"id":"ord","label":"注文サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":0},{"id":"stk","label":"在庫サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":1},{"id":"mem","label":"会員サービス","sub":"ターゲットグループ","kind":"container","c":2,"r":2}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"ord"},{"from":"alb","to":"stk"},{"from":"alb","to":"mem"}]}},{"id":"d4-24","domain":4,"topic":"VPC","type":"single","stem":"ある企業は、同じ AWS リージョンで 20 個の VPC を運用しています。各 VPC のプライベートサブネットにあるインスタンスは、OS の更新プログラムを取得するために、VPC ごとに用意した NAT ゲートウェイ経由でインターネットに出ています。NAT ゲートウェイの時間料金が増えており、VPC は今後も増える予定です。ソリューションアーキテクトは、運用上のオーバーヘッドを抑えながら、インターネットへの出口にかかるコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各 VPC の NAT ゲートウェイを残したまま、VPC ピアリングで 20 個の VPC をフルメッシュで接続し、NAT ゲートウェイを共有できるようにする。","出口用の VPC を作成し、NAT ゲートウェイを配置する。AWS Transit Gateway で各 VPC を出口用 VPC に接続し、各 VPC のデフォルトルートを Transit Gateway に向ける。","出口用の VPC を作成し、NAT ゲートウェイを配置する。各 VPC と出口用 VPC を VPC ピアリングで接続し、各 VPC のデフォルトルートをピアリング接続に向ける。","各 VPC の NAT ゲートウェイを削除し、各 VPC に NAT インスタンスとして動作する EC2 インスタンスを配置する。OS の更新は各チームが管理する。"],"answer":[1],"why":["VPC ピアリングは、ピア先の VPC を経由して別のネットワーク（NAT ゲートウェイやインターネット）に出ることができない。NAT ゲートウェイの数も減らない。","Transit Gateway は多数の VPC を中心で接続でき、VPC が増えても接続の管理が簡単。NAT ゲートウェイを出口用 VPC に集約し、各 VPC の NAT ゲートウェイを不要にできる。","VPC ピアリングは推移的なルーティングができず、ピア先 VPC にある NAT ゲートウェイをインターネットへの出口として使えない。この構成は動作しない。","NAT ゲートウェイの時間料金は減るが、NAT インスタンスの OS 管理・パッチ適用・可用性の確保が必要になり、運用上のオーバーヘッドが大きい。"],"explain":"「多数の VPC」「今後も増える」「NAT ゲートウェイを減らしたい」「運用負荷を抑える」から、出口を 1 か所に集約し、Transit Gateway でつなぐ構成を選ぶ。VPC ピアリングは 1 対 1 の接続で、推移的ルーティングができないため、集約した出口を共有する用途には使えない。Transit Gateway にはアタッチメントの時間料金とデータ処理料金がかかるが、VPC 数が多いほど NAT ゲートウェイの削減効果が大きくなる。","point":"多数の VPC の出口を集約するなら、Transit Gateway と出口用 VPC の NAT ゲートウェイ。VPC ピアリングは推移的ルーティング不可。","diagram":{"caption":"正解の構成: Transit Gateway で出口用 VPC の NAT に集約","cols":4,"rows":2,"groups":[{"label":"出口用 VPC","kind":"vpc","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"va","label":"VPC A","sub":"プライベート側 EC2","kind":"compute","c":0,"r":0},{"id":"vb","label":"VPC B","sub":"プライベート側 EC2","kind":"compute","c":0,"r":1},{"id":"tgw","label":"Transit Gateway","sub":"ハブ","kind":"network","c":1,"r":0},{"id":"nat","label":"NAT ゲートウェイ","sub":"出口を集約","kind":"network","c":2,"r":0},{"id":"net","label":"インターネット","sub":"更新プログラム","kind":"client","c":3,"r":0}],"edges":[{"from":"va","to":"tgw"},{"from":"vb","to":"tgw"},{"from":"tgw","to":"nat"},{"from":"nat","to":"net"}]}},{"id":"d4-25","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、東京リージョンで、汎用の m6i ファミリーの Amazon EC2 インスタンス 40 台を使って基幹システムを 24 時間 365 日運用しています。今後 3 年間は、同じリージョンで同じインスタンスファミリーを使い続けることが決まっています。AWS Fargate や AWS Lambda を使う予定はありません。この企業は、3 年間の利用をコミットし、運用上のオーバーヘッドを増やさずに割引率を最大にしたいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["3 年間の Compute Savings Plans を購入し、1 時間あたりの利用額をコミットする。インスタンスファミリーやリージョンが変わっても割引が適用される。","東京リージョンの m6i ファミリーを対象に、3 年間の EC2 Instance Savings Plans を購入して、1 時間あたりの利用額をコミットする。","1 年間の Compute Savings Plans を購入し、更新のたびに最新の使用量に合わせて購入し直す。","オンデマンドキャパシティ予約を 40 台分作成し、必要な台数を継続して確保する。料金はオンデマンド料金のままとする。"],"answer":[1],"why":["要件は満たせるが、Compute Savings Plans は柔軟性が高い分、EC2 Instance Savings Plans より割引率が低い。ファミリーとリージョンが固定なら、その柔軟性は不要である。","リージョンとインスタンスファミリーを固定する代わりに、Savings Plans の中で割引率が最も高い。同じファミリー内ならサイズや OS が変わっても適用され、購入後の管理も不要である。","契約期間が短いと割引率が下がる。3 年間使うことが分かっているなら、3 年のコミットの方が有利である。更新の手間も増える。","キャパシティ予約は容量を確保する仕組みで、料金の割引はない。割引率を最大にしたいという要件を満たさない。"],"explain":"決め手は「3 年間リージョンもファミリーも変わらない」「Fargate・Lambda は使わない」「割引率を最大に」である。Savings Plans は、柔軟性が高いほど割引率が下がる。柔軟性を使わないなら、割引率が最も高い EC2 Instance Savings Plans を選ぶ。Compute Savings Plans はリージョンやファミリーの変更、Fargate・Lambda にも適用されるが、その分だけ割引率は低い。","point":"ファミリーとリージョンが固定なら EC2 Instance Savings Plans が最も割引率が高い。変更や Fargate・Lambda の利用があるなら Compute Savings Plans。","diagram":null},{"id":"d4-26","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業は、複数のリージョンで Amazon EC2 の x86 インスタンスを運用しています。今後 1 年の間に、一部のワークロードを AWS Fargate と AWS Lambda に移行し、残りの EC2 インスタンスも Graviton ベースのインスタンスファミリーに切り替える計画です。移行後も、全体のコンピューティングの使用量は 1 年間を通じて一定の水準を下回らないと見込まれています。この企業は、移行の進み具合にかかわらず、その一定の水準までの使用量に割引が適用されるようにしたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["現在の x86 インスタンスファミリーを対象に、EC2 Instance Savings Plans を 1 年間購入する。インスタンスファミリーが変わったら、Savings Plans を新しいファミリーに付け替える。","現在の x86 インスタンスに対して、1 年間のスタンダードリザーブドインスタンスを購入する。移行後は、使わなくなった分をリザーブドインスタンスマーケットプレイスで売却する。","1 年間の Compute Savings Plans を購入する。移行後も下回らない水準を見積もり、その水準に合わせて 1 時間あたりの利用額をコミットする。","コンバーティブルリザーブドインスタンスを購入し、移行のたびにファミリーを交換する。Fargate と Lambda の使用量にも自動的に適用される。"],"answer":[2],"why":["EC2 Instance Savings Plans は、購入時に指定したリージョンとインスタンスファミリーにひも付く。別のファミリーへの付け替えはできず、Fargate や Lambda にも適用されない。","スタンダードリザーブドインスタンスは、リージョンやファミリーの変更に追随できず、売却の手間もかかる。Fargate や Lambda の使用量には適用されない。","Compute Savings Plans は、リージョン、インスタンスファミリー、OS を問わず EC2 に適用され、Fargate と Lambda の使用量にも適用される。移行の進み具合に左右されず、コミットした水準までが割引になる。","コンバーティブルリザーブドインスタンスは EC2 のみが対象で、Fargate と Lambda の使用量には適用されない。交換の作業も毎回必要になる。"],"explain":"決め手は「Fargate・Lambda への移行」「Graviton への切り替え」「複数リージョン」である。これらすべてにまたがって割引が適用されるのは Compute Savings Plans だけである。コミット額は、移行後も確実に使う水準に合わせると、使い残しを避けられる。リザーブドインスタンスと EC2 Instance Savings Plans は EC2 だけが対象で、ファミリーやリージョンの縛りもある。","point":"EC2 以外（Fargate・Lambda）にも適用したい、またはファミリー・リージョンを変えるなら Compute Savings Plans。","diagram":null},{"id":"d4-27","domain":4,"topic":"購入オプション","type":"single","stem":"ある企業の基幹システムは、東京リージョンの特定のアベイラビリティーゾーン（AZ）で、c6i.4xlarge インスタンスを常時 20 台稼働させています。障害時の切り替えやピーク時に、同じ AZ で追加の 10 台が必ず起動できる必要があります。ただし、数か月後にインスタンスタイプを変更する可能性があるため、容量の確保はいつでも解除できなければなりません。この企業は、確保した容量と常時稼働している分の両方に割引を適用したいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["対象の AZ にオンデマンドキャパシティ予約を 30 台分作成する。Compute Savings Plans を購入し、予約した容量を使うインスタンスにも割引を適用する。","対象の AZ を指定した 3 年間のゾーンスタンダードリザーブドインスタンスを 30 台分、全額前払いで購入し、容量の確保と割引の両方を 1 つの契約で受ける。","Compute Savings Plans だけを購入する。追加の 10 台は、必要になったときにオンデマンドインスタンスとして起動する。","対象の AZ にオンデマンドキャパシティ予約を 30 台分作成する。割引の契約は購入せず、予約の終了日を設定しない。"],"answer":[0],"why":["キャパシティ予約は期間の縛りなくいつでも作成・解除でき、AZ 内の容量を確保できる。Savings Plans の割引は予約した容量を使うインスタンスにも適用されるため、確保分と稼働分の両方が割引になる。","ゾーンリザーブドインスタンスは容量も確保できるが、1 年または 3 年の契約で、途中で解除できない。インスタンスタイプの変更にも追随しにくい。","Savings Plans は割引だけの仕組みで、容量は確保されない。追加の 10 台は、AZ の容量不足で起動できないおそれがある。","容量は確保できるが、割引が一切ない。確保した容量と常時稼働分に割引を適用したいという要件を満たさない。"],"explain":"決め手は「同じ AZ で必ず起動できる」「いつでも解除できる」「容量と稼働分の両方に割引」である。容量の確保は、解除できるオンデマンドキャパシティ予約が担当し、割引は Savings Plans が担当する。この組み合わせでは、予約した容量を使うインスタンスにも Savings Plans の割引が適用される。ゾーンリザーブドインスタンスは割引と容量確保を兼ねるが、契約期間の縛りがあり、いつでも解除できる要件に合わない。","point":"容量の確保はキャパシティ予約、割引は Savings Plans と役割を分ける。キャパシティ予約は期間の縛りなく解除でき、Savings Plans の割引が適用される。","diagram":{"caption":"正解の構成: キャパシティ予約で確保し、Savings Plans で割引する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sp","label":"Savings Plans","sub":"使用料に割引","kind":"management","c":0,"r":0},{"id":"ec2","label":"EC2 インスタンス","sub":"予約枠で起動","kind":"compute","c":1,"r":0},{"id":"cr","label":"キャパシティ予約","sub":"AZ・タイプ指定","kind":"management","c":2,"r":0}],"edges":[{"from":"sp","to":"ec2","label":"割引を適用"},{"from":"ec2","to":"cr","label":"予約枠を使用"}]}},{"id":"d4-28","domain":4,"topic":"購入オプション","type":"single","stem":"ある研究機関は、数日かかるシミュレーションを 1 台の Amazon EC2 インスタンスで実行しています。シミュレーションは 10 分ごとにチェックポイントを Amazon EBS のデータボリュームに書き込み、停止後にインスタンスを再起動すると続きから再開できます。完了期限には余裕があり、実行が一時的に止まっても問題ありません。この研究機関は、実行コストを最小限に抑えたいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["1 年間のスタンダードリザーブドインスタンスを購入し、オンデマンドインスタンスとして実行する。チェックポイントは EBS ボリュームに書き込み、停止と再起動で再開できるようにする。","スポットインスタンスをワンタイムリクエストで起動し、中断時の動作を終了にする。チェックポイントはインスタンスストアに書き込む。","Compute Savings Plans を購入し、オンデマンドインスタンスとして実行する。チェックポイントは EBS ボリュームに書き込む。","スポットインスタンスを永続リクエストで起動し、中断時の動作を停止にする。チェックポイントは EBS ボリュームに書き込み、容量が戻ったら再開する。"],"answer":[3],"why":["数日で終わる単発の処理に 1 年間の契約を結ぶのは無駄が大きい。スポットより料金も高く、中断に耐えられるという条件を活かせていない。","ワンタイムリクエストで中断時に終了すると、インスタンスは再起動されない。インスタンスストアのデータも失われるため、チェックポイントから再開できない。","コミットが必要で、単発の処理には向かない。料金もスポットインスタンスより高く、最もコストを抑えるという要件を満たさない。","スポットインスタンスはオンデマンドより大幅に安い。永続リクエストで中断時に停止にすれば、EBS ボリュームが残り、容量が戻ったときに同じインスタンスが再開される。停止中はインスタンスの料金がかからない。"],"explain":"決め手は「中断されても問題ない」「チェックポイントから再開できる」「コストを最小に」である。最も安いスポットインスタンスを選ぶ。1 台のインスタンスの状態を保ちたいので、永続リクエストと中断時の動作の停止を組み合わせる。EBS ボリュームのデータは残り、スポット容量が戻ると自動的に再開される。インスタンスストアはインスタンスの停止・終了で消えるため、チェックポイントの保存先にはできない。","point":"中断に耐える処理はスポット。同じインスタンスで再開したいなら、永続リクエストと中断時の停止を使い、データは EBS に置く。","diagram":null},{"id":"d4-29","domain":4,"topic":"コスト管理","type":"single","stem":"ある企業は、AWS Organizations で、開発者向けのサンドボックスアカウントを多数運用しています。以前、開発者が大きなインスタンスを起動したまま放置し、月額の予算を大きく超える請求が発生しました。財務チームは、アカウントごとの月額予算の 100% に実際のコストが達したら、そのアカウントで新しいリソースを作成できないようにすることを求めています。この制限は人手を介さず自動で行う必要があり、運用上のオーバーヘッドを最小限に抑えなければなりません。これらの要件を満たすソリューションはどれですか。","choices":["アカウントごとに AWS Budgets の予算を作成し、100% で Amazon SNS により運用チームに通知する。運用チームが手動でインスタンスを停止し、IAM の権限を外す。","Amazon EventBridge のルールで 1 時間ごとに AWS Lambda 関数を実行する。関数が Cost Explorer の API で当月のコストを取得し、予算を超えていれば SCP を更新するようにする。","アカウントごとに AWS Budgets の予算を作成する。100% のしきい値で、新しいリソースの作成を拒否する SCP をそのアカウントに自動で適用する予算アクションを設定する。","各アカウントで Amazon CloudWatch の請求アラームを作成し、しきい値を超えたら SNS トピックに通知する。通知を受けた管理者が、そのアカウントの IAM ロールを削除する。"],"answer":[2],"why":["通知だけで、制限は人手に頼っている。対応が遅れる間にもコストが増え続け、自動で行うという要件を満たさない。","実現はできるが、関数の開発・保守が必要で、運用上のオーバーヘッドが大きい。コストデータの反映にも遅れがあり、AWS Budgets にある機能の自作になる。","AWS Budgets のアクションは、しきい値に達したときに SCP や IAM ポリシーの適用などを自動で実行できる。コードを書かずに、予算超過時の制限を自動化できる。","請求アラームは通知しかできず、IAM ロールの削除は人手になる。アカウントごとの設定も必要で、運用上のオーバーヘッドが大きい。"],"explain":"決め手は「予算の 100% に達したら自動で制限」「人手を介さない」「運用上のオーバーヘッド最小」である。AWS Budgets の予算アクションは、しきい値を超えたときに、IAM ポリシーや SCP の適用、EC2 や RDS インスタンスの停止を自動で実行できる。この問題では、新規作成を拒否する SCP を対象のアカウントに適用する。アクションの実行には、Budgets が引き受ける IAM ロールが必要になる。","point":"予算超過時の自動対応は AWS Budgets のアクション（IAM ポリシー・SCP の適用、EC2・RDS の停止）。通知だけなら SNS やメール。","diagram":{"caption":"正解の構成: 予算超過で SCP を自動適用してリソース作成を止める","cols":4,"rows":1,"groups":[{"label":"AWS Organizations","kind":"account","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"bud","label":"AWS Budgets","sub":"月額予算 100%","kind":"management","c":0,"r":0},{"id":"act","label":"予算アクション","sub":"自動で実行","kind":"management","c":1,"r":0},{"id":"scp","label":"SCP","sub":"作成を拒否","kind":"security","c":2,"r":0},{"id":"acc","label":"サンドボックス","sub":"開発者アカウント","kind":"compute","c":3,"r":0}],"edges":[{"from":"bud","to":"act","label":"しきい値超過"},{"from":"act","to":"scp","label":"適用"},{"from":"scp","to":"acc","label":"制限"}]}},{"id":"d4-30","domain":4,"topic":"コスト管理","type":"single","stem":"ある企業は、AWS Organizations で管理する複数のアカウントで、多数の AWS サービスを使っています。先月、ある開発チームの設定ミスで特定のサービスの利用料金が急増しましたが、月末の請求書で初めて気づきました。この企業は、通常のコストの傾向から外れた急な増加を、サービスやアカウントごとに固定のしきい値を決めることなく検知し、原因の候補とともに担当者に通知することを求めています。運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["AWS Cost Anomaly Detection で AWS のサービス別のモニターを作成する。アラートのサブスクリプションで、通知先の Amazon SNS トピックと、通知する影響額のしきい値を設定する。","サービスごとに AWS Budgets のコスト予算を作成する。前月の実績に合わせた金額を設定し、実際のコストが 80% に達したら通知する。","AWS コストと使用状況レポートを Amazon S3 に出力する。毎日、Amazon Athena で前日比を計算する AWS Lambda 関数を実行し、増加率が大きい場合に Amazon SNS で通知する。","各アカウントで Amazon CloudWatch の請求アラームを作成する。EstimatedCharges メトリクスがあらかじめ決めた金額を超えたら通知する。"],"answer":[0],"why":["Cost Anomaly Detection は、機械学習で通常の支出パターンを学習し、外れた増加を検知する。固定のしきい値は不要で、根本原因の候補も通知に含まれる。設定もコンソールだけで完結する。","予算は固定の金額を基準にするため、サービスごとの通常額の把握と設定が必要になる。金額の更新も続き、通常の傾向からの外れを検知するものではない。","実現はできるが、クエリ、関数、しきい値の設計と保守が必要で、運用上のオーバーヘッドが大きい。原因の候補を示す機能も自作になる。","請求アラームは固定の金額を超えたときにしか通知できず、通常の傾向からの外れは検知できない。原因の候補も示されない。"],"explain":"決め手は「固定のしきい値を決めない」「通常の傾向から外れた増加」「原因の候補」「運用上のオーバーヘッド最小」である。これらすべてを満たすのは、機械学習で異常を検知する AWS Cost Anomaly Detection である。モニターの種類（サービス別、アカウント別、コスト配分タグ、Cost Categories）を選び、アラートの通知先と影響額のしきい値を設定するだけでよい。","point":"固定のしきい値なしで、コストの急増を検知して原因の候補も知りたいなら Cost Anomaly Detection。決まった金額の超過は Budgets。","diagram":{"caption":"正解の構成: Cost Anomaly Detection が異常を検知して通知する","cols":4,"rows":1,"groups":[],"nodes":[{"id":"bill","label":"利用料金データ","sub":"全アカウント","kind":"management","c":0,"r":0},{"id":"cad","label":"異常検出モニター","sub":"機械学習で検出","kind":"analytics","c":1,"r":0},{"id":"sns","label":"SNS トピック","sub":"アラートを配信","kind":"integration","c":2,"r":0},{"id":"team","label":"担当者","sub":"原因の候補を確認","kind":"client","c":3,"r":0}],"edges":[{"from":"bill","to":"cad","label":"コスト傾向"},{"from":"cad","to":"sns","label":"異常を通知"},{"from":"sns","to":"team"}]}},{"id":"d4-31","domain":4,"topic":"コスト管理","type":"multi","stem":"ある企業は、Amazon EC2、AWS Fargate、AWS Lambda の使用量が月ごとに変動しており、これまですべてオンデマンド料金で利用してきました。財務チームは Savings Plans の購入を検討しています。コミット額を過大にして使われない契約を作ることは避けたいと考えています。また、購入後も、コミットが十分に使われているかを継続的に把握し、使用率が下がったら通知を受けたいと考えています。運用上のオーバーヘッドは最小限に抑える必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["AWS Cost Explorer の Savings Plans の推奨を開く。タイプ、期間、支払いオプション、分析期間を指定し、実際の使用量から算出された 1 時間あたりのコミット額を確認して購入する。","過去 12 か月で最大だった 1 時間あたりの使用額を、そのままコミット額にして Compute Savings Plans を購入する。","AWS Compute Optimizer の推奨を確認し、そこに表示されるインスタンスのサイズ変更の推奨から、Savings Plans のコミット額を決める。","AWS Budgets で Savings Plans の使用率の予算を作成する。使用率が設定したしきい値を下回ったら通知する。","使われないコミットが生じたら、Savings Plans をキャンセルして、未使用分の返金を受ける。"],"answer":[0,3],"why":["Cost Explorer は、過去の使用量をもとに、選んだタイプ・期間・支払いオプションに対する 1 時間あたりのコミット額と見込みの節約額を推奨する。実績に基づくため、過大なコミットを避けやすい。","最大の使用額をコミットすると、ほとんどの時間でコミットが使われず、無駄な支払いが発生する。コミットは、常に使う下限の水準に合わせる。","Compute Optimizer は、サイズ変更の推奨など、リソースの適正化を提案するサービスで、Savings Plans のコミット額は推奨しない。コミット額の推奨は Cost Explorer が行う。","AWS Budgets には Savings Plans の使用率とカバレッジの予算タイプがあり、しきい値を下回ったときに通知できる。購入後のコミットの使われ方を継続的に把握できる。","購入した Savings Plans はキャンセルできない。返金も受けられないため、購入前にコミット額を慎重に決める必要がある。"],"explain":"購入前は、Cost Explorer の Savings Plans の推奨で実績に基づいたコミット額を確認する。購入後は、AWS Budgets の Savings Plans の使用率の予算で、コミットが使われているかを監視して通知を受ける。Savings Plans は購入するとキャンセルできないため、最大使用量に合わせるような過大な購入は避ける。Compute Optimizer はリソースのサイズ変更の推奨が役割で、Savings Plans のコミット額は出さない。","point":"Savings Plans の購入前は Cost Explorer の推奨、購入後は Budgets の使用率・カバレッジの予算で監視する。購入後のキャンセルはできない。","diagram":null},{"id":"d4-32","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、Application Load Balancer の背後にある Auto Scaling グループの m5.xlarge インスタンスで、Java で実装した Web アプリケーションを実行しています。アプリケーションは Linux 上の JVM で動作し、x86 専用のネイティブライブラリには依存していません。この企業は、アプリケーションのコードの変更を最小限に抑えながら、価格性能比を向上させて EC2 のコストを削減したいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["同じ x86 のインスタンスファミリーのまま、より大きなインスタンスサイズに変更する。Auto Scaling グループの台数を減らして、インスタンスあたりの処理量を増やし、全体の台数を抑える。","起動テンプレートのインスタンスタイプを、Graviton ベースのインスタンス（m7g など）に変更する。AMI は、現在の x86 用のものをそのまま使う。","バースト可能な T ファミリーのインスタンスに変更し、unlimited モードを有効にする。ピーク時の CPU クレジットの不足を防ぐ。","arm64 用の AMI を使う起動テンプレートで、Graviton ベースのインスタンス（m7g など）を指定する。ステージング環境で検証してから、グループを入れ替える。"],"answer":[3],"why":["インスタンスあたりの料金が上がるだけで、価格性能比は変わらない。台数を減らしても、負荷が一定ならコストの削減幅は小さく、1 台の障害の影響も大きくなる。","Graviton は arm64 のため、x86 用の AMI からは起動できない。アーキテクチャの違う AMI とインスタンスタイプの組み合わせはエラーになる。","T ファミリーは、使用率が低い間のコストを抑えるものである。常時負荷のある Web アプリケーションで unlimited モードを使うと、追加料金が発生して割高になるおそれがある。","Graviton ベースのインスタンスは、同等の x86 インスタンスより価格性能比が高い。JVM のアプリケーションはコードの変更なしに動くことが多く、arm64 用の AMI と検証を用意すれば移行できる。"],"explain":"決め手は「価格性能比の向上」「コードの変更を最小限」「Java（JVM）でネイティブライブラリなし」である。Graviton ベースのインスタンスは、同等の x86 インスタンスと比べて価格性能比が高い。移行では、arm64 用の AMI（と arm64 用の JDK）を使う起動テンプレートを用意し、事前に検証する。x86 用の AMI は Graviton で起動できないため、AMI とインスタンスタイプのアーキテクチャをそろえる必要がある。","point":"JVM やインタープリター言語は Graviton に移行しやすい。AMI は arm64 用に差し替える。x86 用の AMI は Graviton で起動できない。","diagram":null},{"id":"d4-33","domain":4,"topic":"EC2","type":"single","stem":"ある企業は、t3.large の Amazon EC2 インスタンス 12 台で、ファイル変換サービスを運用しています。インスタンスは unlimited モードで、日中は Amazon CloudWatch の CPUUtilization がほぼ常に 60% 前後です。請求書には、CPU クレジットの追加料金が毎月発生しています。アプリケーションは x86 向けのビルドしかなく、性能が安定して出ることも求められています。この企業は、性能を維持したまま、EC2 のコストを下げたいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["T3 インスタンスの unlimited モードを standard モードに変更して、追加料金が発生しないようにする。","vCPU 数とメモリが同等の、固定性能の汎用インスタンス（M ファミリー）に切り替える。","同じ T3 ファミリーで、より大きなサイズ（t3.2xlarge など）に変更し、台数を減らす。","T3 インスタンスのまま、CPU クレジットの追加料金に備えて Compute Savings Plans を購入する。"],"answer":[1],"why":["standard モードでは、クレジットが尽きると CPU がベースラインの水準に制限される。60% の負荷が続くと性能が大きく落ち、性能を維持するという要件を満たさない。","常時 60% の負荷は、T ファミリーのベースラインを超える。固定性能のインスタンスなら、クレジットの追加料金がなく、性能も安定する。使用率が常に高いワークロードに向いている。","T3 は大きなサイズでもベースラインが 40% 程度で、60% が続くとやはり追加料金が発生する。サイズを上げても根本的な解決にならない。","Savings Plans はインスタンスの時間料金に適用される割引で、unlimited モードの CPU クレジットの追加料金には適用されない。追加料金は減らない。"],"explain":"決め手は「CPU 使用率が常時 60% 前後」「CPU クレジットの追加料金」「性能が安定」である。バースト可能なインスタンスは、使用率が低い時間が長いワークロード向けで、ベースラインを超える負荷が続くと割高になる。そのようなワークロードは、固定性能のインスタンスに切り替える方が安くなり、性能も安定する。x86 向けのビルドしかないため、Graviton は選べない。","point":"CPU 使用率が常にベースライン以上なら、T ファミリーの unlimited モードは割高になる。固定性能のインスタンスへ切り替える。","diagram":null},{"id":"d4-34","domain":4,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、Python で実装した AWS Lambda 関数を、API のバックエンドとして毎月数億回呼び出しています。関数は純粋な Python のコードと、arm64 用のビルドが提供されているライブラリだけを使っています。関数のメモリ設定は、すでに適切にチューニングされています。この企業は、コードの大幅な変更なしに、関数の実行コストをさらに下げたいと考えています。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["関数のアーキテクチャを arm64 に変更し、arm64 用の依存ライブラリをパッケージして再デプロイする。エイリアスの重み付けで段階的に切り替える。","関数にプロビジョニングされた同時実行を設定して、実行環境の初期化にかかる時間を課金対象から外す。あわせてタイムアウトも短く設定して、実行コストを下げる。","関数のメモリ設定を最小の 128 MB まで下げて、実行時間が延びても合計の料金が下がるようにし、関数の実行コストを抑える。","関数に予約された同時実行を設定して、予約した分の呼び出しに割引が適用されるようにし、関数の実行コストを抑える。"],"answer":[0],"why":["arm64（Graviton2）で実行する Lambda 関数は、x86_64 より実行時間あたりの料金が安く、性能も同等以上になることが多い。純粋な Python のコードなら変更はほとんど不要で、エイリアスで段階的に切り替えられる。","プロビジョニングされた同時実行は、コールドスタートを避けるための機能で、待機中の料金も別にかかる。通常は実行コストを下げる手段ではない。","メモリを下げると CPU の割り当ても減り、実行時間が延びる。チューニング済みの値から下げると、合計の料金がかえって上がる場合がある。","予約された同時実行は、関数が使える同時実行数を確保・制限する設定で、料金の割引はない。コストを下げる効果はない。"],"explain":"決め手は「コードの大幅な変更なし」「純粋な Python と arm64 対応のライブラリ」「実行コストをさらに下げる」である。Lambda の arm64 アーキテクチャは、x86_64 より料金が安く、価格性能比が高い。依存ライブラリが arm64 に対応していれば、アーキテクチャの設定を変更して再デプロイするだけで移行できる。エイリアスの重み付けを使うと、一部のトラフィックから段階的に切り替えられる。","point":"Lambda のコスト削減の定番は、メモリの最適化と arm64（Graviton2）への変更。依存ライブラリが arm64 に対応しているかを確認する。","diagram":null},{"id":"d4-35","domain":4,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、社内向けの API を Amazon API Gateway と AWS Lambda で提供しています。コールドスタートによる応答の遅延を避けるため、関数のエイリアスにプロビジョニングされた同時実行を 100 設定し、24 時間 365 日維持しています。API が使われるのは平日の 8 時から 20 時だけで、夜間と週末はリクエストがありません。始業直後にも、コールドスタートによる遅延は発生させたくありません。この企業は、コストを削減したいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["プロビジョニングされた同時実行を削除し、代わりに予約された同時実行を 100 に設定する。","Amazon EventBridge のルールで 1 分ごとに関数を呼び出して、実行環境を温めた状態に保つ。プロビジョニングされた同時実行は削除して、コストを下げる。","Application Auto Scaling のスケジュールされたアクションで、平日の始業前にプロビジョニングされた同時実行を 100 に上げ、終業後に 0 に下げる。","プロビジョニングされた同時実行の値を、現在の 100 から 20 に恒常的に引き下げる。"],"answer":[2],"why":["予約された同時実行は、同時実行数の確保と上限を設定するもので、実行環境は事前に用意されない。コールドスタートは避けられない。","実行環境を温め続ける簡易的な方法だが、同時に必要な数の環境を維持できず、始業直後の急な増加ではコールドスタートが発生する。呼び出しの設計と保守も増える。","プロビジョニングされた同時実行の値は、Application Auto Scaling のスケジュールされたアクションで時間帯ごとに変更できる。営業時間だけ維持して夜間と週末を 0 にすれば、始業直後の遅延を避けつつ、使わない時間の料金をなくせる。","常時の料金は下がるが、ピーク時に必要な 100 に足りなくなる。始業直後のコールドスタートを避けるという要件を満たさない。"],"explain":"決め手は「利用時間が平日 8〜20 時に限られる」「始業直後もコールドスタートを避ける」「コスト削減」「運用効率」である。プロビジョニングされた同時実行は、設定した分だけ常時料金がかかるため、使わない時間帯は 0 にしたい。Application Auto Scaling のスケジュールされたアクションを使うと、時刻に合わせて値を変更でき、コードの追加も不要である。","point":"プロビジョニングされた同時実行は待機中も課金される。利用時間が決まっているなら、Application Auto Scaling のスケジュールで増減させる。","diagram":{"caption":"正解の構成: スケジュールでプロビジョニングされた同時実行を増減する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"api","label":"API Gateway","sub":"社内 API","kind":"network","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"エイリアス・PC 100","kind":"serverless","c":1,"r":0},{"id":"aas","label":"Auto Scaling","sub":"平日朝 100、夜 0","kind":"management","c":1,"r":1}],"edges":[{"from":"api","to":"fn","label":"リクエスト"},{"from":"aas","to":"fn","label":"容量を変更"}]}},{"id":"d4-36","domain":4,"topic":"Auto Scaling","type":"single","stem":"ある企業は、ステートレスな Web ワーカーを、Auto Scaling グループのスポットインスタンスで実行しています。現在は 3 種類のインスタンスタイプを固定で指定していますが、特定の AZ でスポット容量が不足し、スケールアウトの失敗や中断が起きています。ワーカーは x86_64 で動作し、4 vCPU 以上、メモリ 16 GiB 以上であればインスタンスファミリーを問いません。この企業は、インスタンスタイプの一覧を手動で更新することなく、新しい世代のインスタンスも自動的に候補に含め、中断を減らしながらコストを抑えたいと考えています。これらの要件を満たすソリューションはどれですか。","choices":["インスタンスタイプの一覧に、さらに 3 種類を手動で追加する。スポットの割り当て戦略を lowest-price に設定し、AZ ごとの最安のプールを使う。","Auto Scaling グループをオンデマンドインスタンスだけに変更し、Compute Savings Plans を購入して割引を受け、容量不足の影響をなくす。","起動テンプレートでインスタンスタイプを 1 種類だけ指定し、グループが使うサブネットを 3 つの AZ に増やして、容量不足を避ける。","混合インスタンスポリシーで、属性ベースのインスタンスタイプ選択に vCPU、メモリ、x86_64 を指定する。割り当て戦略は price-capacity-optimized にする。"],"answer":[3],"why":["タイプを手動で増やす手間が続き、新しい世代も自動では含まれない。lowest-price は最も安いプールを優先するため、容量が少ないプールが選ばれて中断が増えやすい。","スポットインスタンスを使わなくなり、割引率が下がる。ステートレスで中断に耐えられるワーカーに対して、コストの削減幅が小さい。","候補のプールが 1 種類の 3 AZ に限られるため、スポット容量の不足に対する効果が小さい。複数のタイプに分散する方が、容量を確保しやすい。","属性ベースの選択は、要件に合うインスタンスタイプを自動で候補にし、新しい世代も含める。price-capacity-optimized は、容量が豊富で価格が低いプールを選び、中断を減らしながらコストを抑える。"],"explain":"決め手は「手動で一覧を更新しない」「新しい世代も自動的に候補に」「中断を減らしコストも抑える」である。Auto Scaling グループの混合インスタンスポリシーでは、属性ベースのインスタンスタイプ選択を使うと、vCPU やメモリなどの要件に合うタイプが自動で候補になる。スポットの割り当て戦略は、容量と価格のバランスをとる price-capacity-optimized が推奨される。多くのタイプと AZ に分散するほど、スポット容量を確保しやすい。","point":"スポットは多くのタイプと AZ に分散する。タイプを手動で管理したくないなら属性ベースの選択と price-capacity-optimized。","diagram":{"caption":"正解の構成: 属性ベースの選択でスポットのタイプと AZ を分散する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"abis","label":"属性ベース選択","sub":"4 vCPU・16 GiB 以上","kind":"management","c":0,"r":0},{"id":"asg","label":"Auto Scaling","sub":"混合インスタンス","kind":"compute","c":1,"r":0},{"id":"pool","label":"スポットプール","sub":"複数タイプ・複数 AZ","kind":"compute","c":2,"r":0}],"edges":[{"from":"abis","to":"asg","label":"要件を指定"},{"from":"asg","to":"pool","label":"最適なプール"}]}},{"id":"d4-37","domain":4,"topic":"コンテナ","type":"multi","stem":"ある企業は、Amazon ECS on AWS Fargate で、Linux のコンテナで動く API サービスを数十個、24 時間 365 日運用しています。使用量はほぼ一定で、API は中断を許容できません。アプリケーションは Go で実装されており、コンテナイメージは現在 x86_64 向けにのみビルドされています。この企業は、サービスの可用性を維持し、運用上のオーバーヘッドを増やさずに、Fargate のコストを削減したいと考えています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["すべてのサービスのタスクを Fargate Spot で実行し、中断されたタスクは ECS サービスのスケジューラで再起動する。","コンテナイメージを複数アーキテクチャ（arm64 を含む）でビルドする。タスク定義の CPU アーキテクチャを ARM64 に変更し、Graviton ベースの Fargate で実行する。","EC2 Instance Savings Plans を購入し、Fargate タスクの 1 時間あたりの使用量をコミットする。","起動タイプを EC2 に変更し、オンデマンドの EC2 インスタンスにタスクを配置する。クラスターの容量は手動で管理する。","Compute Savings Plans を購入し、Fargate の継続的な使用量の下限の水準をコミットする。"],"answer":[1,4],"why":["Fargate Spot は、2 分前の通知で中断されることがある。中断を許容できない API サービスの可用性を損なうおそれがある。","Fargate は ARM64（Graviton）のタスクを実行でき、同じ vCPU とメモリの x86_64 より料金が低い。Go は arm64 向けにビルドしやすく、変更はビルドとタスク定義の設定に限られる。","EC2 Instance Savings Plans は EC2 インスタンスにのみ適用され、Fargate の使用量には適用されない。","EC2 のクラスター容量を管理する運用が必要になり、運用上のオーバーヘッドが増える。タスクの配置効率が悪いと、かえってコストが上がる場合もある。","Compute Savings Plans は Fargate の使用量にも適用される。使用量がほぼ一定なので、下限の水準をコミットすれば、アプリケーションの変更なしにオンデマンド料金より安くできる。"],"explain":"決め手は「使用量はほぼ一定」「中断を許容できない」「運用上のオーバーヘッドを増やさない」である。ほぼ一定の使用量には Compute Savings Plans（Fargate に適用可能）でコミットし、タスクを ARM64 に変えて単価も下げる。この 2 つは併用でき、どちらも運用の負荷を増やさない。Fargate Spot は中断を許容できるタスク向けで、EC2 Instance Savings Plans は Fargate に適用されない。","point":"Fargate のコスト削減は、継続使用分に Compute Savings Plans、単価は ARM64（Graviton）、中断に耐えるタスクは Fargate Spot。","diagram":null},{"id":"d4-38","domain":4,"topic":"S3","type":"multi","stem":"ある企業は、バージョニングを有効にした Amazon S3 バケットに、顧客が送信する大容量の動画ファイル（1 ファイルあたり数 GB）を保存しています。アップロードにはマルチパートアップロードを使用していますが、ネットワークの切断などで中断されたアップロードが多く、アップロード済みのパートが残ったままになっています。また、顧客がファイルを頻繁に上書きするため、過去のバージョンが蓄積しています。過去のバージョンは、上書きから 14 日を過ぎると参照されません。最新バージョンは残す必要があります。運用上のオーバーヘッドを最小限に抑えながらストレージコストを削減するソリューションの組み合わせはどれですか。","choices":["ライフサイクルルールに、開始から 7 日を過ぎても完了していないマルチパートアップロードを中止する設定を追加する。","ライフサイクルルールで、現行バージョンを作成から 14 日後に S3 Glacier Deep Archive へ移行する。","バケットのバージョニングを一時停止する。すでに蓄積した過去のバージョンはそのまま保持する。","ライフサイクルルールに、非現行バージョンになってから 14 日を過ぎたオブジェクトを完全に削除する設定を追加する。","S3 インベントリを毎週出力し、AWS Lambda 関数で未完了のアップロードを検出してパートを削除する。"],"answer":[0,3],"why":["未完了のマルチパートアップロードのパートは、アップロードを完了または中止するまでストレージ料金がかかり続ける。ライフサイクルルールで一定期間後に自動で中止できる。","最新バージョンは残す必要があるが、これは現行バージョンを移行する設定であり、蓄積した過去のバージョンは減らない。アーカイブ後は取り出しの手間も増える。","バージョニングを一時停止しても、すでにある過去のバージョンは削除されず、料金も減らない。これから作成する過去のバージョンを減らすだけの対策になる。","非現行バージョンの有効期限を設定すれば、14 日を過ぎた過去のバージョンが自動で削除される。最新バージョンには影響しない。","動作はするが、検出と削除の処理を自分で作って運用する必要がある。ライフサイクルルールで同じことが設定だけでできる。"],"explain":"ストレージコストの原因は、残ったままのパートと、蓄積した過去のバージョンの 2 つである。どちらもライフサイクルルールの設定だけで自動的に整理でき、コードの作成や運用は不要になる。「最新バージョンは残す」「過去のバージョンは 14 日で不要」という条件から、対象を非現行バージョンに限定する。","point":"未完了のマルチパートアップロードの中止と、非現行バージョンの失効は、どちらもライフサイクルルールで自動化できる。","diagram":null},{"id":"d4-39","domain":4,"topic":"S3","type":"single","stem":"あるデータ提供企業は、数十 TB のデータセットを Amazon S3 バケットに保存し、契約した多数の外部の研究機関に提供しています。研究機関は、自社の AWS アカウントの Amazon EC2 インスタンスから、別のリージョンも含めてデータをダウンロードします。現在は、ダウンロードに伴うデータ転送料金とリクエスト料金をすべてデータ提供企業が負担しており、利用の増加とともに費用が増えています。データ提供企業は、ストレージの料金は自社で負担したまま、データ転送とリクエストの料金をデータを取得する側に負担させたいと考えています。匿名でのアクセスは許可しません。運用上のオーバーヘッドを最小限に抑えてこれらの要件を満たすソリューションはどれですか。","choices":["バケットを配信元にした Amazon CloudFront ディストリビューションを作成し、URL を研究機関に配布する。配信にかかった料金を、毎月の請求書で研究機関に請求する。","研究機関ごとに S3 バケットを作成し、データを複製する。バケットを研究機関のアカウントに移し、研究機関が所有者として管理する。","バケットでリクエスタ支払いを有効にする。バケットポリシーで研究機関のアカウントに読み取りを許可し、研究機関に、リクエスタ支払いのヘッダーを付けた認証済みのリクエストを送らせる。","バケットで S3 Transfer Acceleration を有効にし、研究機関にアクセラレートエンドポイントを使わせる。転送の高速化により、転送料金の総額を下げる。"],"answer":[2],"why":["配信料金を請求書で精算する運用は手作業になり、費用の負担者もデータ提供企業のままである。仕組みとして料金を相手に付け替えることにはならない。","複製するデータが研究機関の数だけ増え、データ提供企業のストレージ料金も増える。データの更新を反映する運用も大きな負荷になる。","リクエスタ支払いを有効にすると、データ転送とリクエストの料金をリクエストした側のアカウントに課金できる。ストレージ料金はバケット所有者の負担のままで、匿名のアクセスは使えなくなる。","Transfer Acceleration は転送を高速にする機能で、追加の料金も発生する。料金を取得する側に付け替える機能ではない。"],"explain":"決め手は、「データ転送とリクエストの料金を取得する側が負担する」「ストレージ料金は提供側」「匿名アクセスは許可しない」である。これはリクエスタ支払いの仕様そのものである。リクエスタ支払いのバケットでは、リクエストは認証されている必要があり、リクエスタは料金を負担することを示すヘッダーをリクエストに付ける。","point":"取得側にデータ転送・リクエストの料金を負担させるなら S3 のリクエスタ支払い。認証済みのリクエストだけが対象になる。","diagram":{"caption":"正解の構成: リクエスタ支払いで取得側にダウンロード料金を課金する","cols":2,"rows":2,"groups":[],"nodes":[{"id":"ec2","label":"研究機関の EC2","sub":"認証済みリクエスト","kind":"compute","c":0,"r":0},{"id":"s3","label":"S3 バケット","sub":"リクエスタ支払い","kind":"storage","c":1,"r":0},{"id":"bill","label":"研究機関の請求","sub":"転送とリクエスト","kind":"management","c":0,"r":1}],"edges":[{"from":"ec2","to":"s3","label":"認証付き GET"},{"from":"ec2","to":"bill","label":"料金を課金","style":"dashed"}]}},{"id":"d4-40","domain":4,"topic":"S3","type":"single","stem":"ある企業は、AWS Organizations で管理する 60 個の AWS アカウントで、合計数千個の Amazon S3 バケットを使用しています。S3 の費用が増え続けているため、経営層はコスト削減の施策を求めています。しかし、どのアカウントのどのバケットに費用が集中しているのか、ライフサイクルルールのないバケットや、未完了のマルチパートアップロード・非現行バージョンが多いバケットはどれかを把握できていません。バケットごとのスクリプトを作らずに、組織全体のこれらの状況を最も運用効率よく可視化するソリューションはどれですか。","choices":["S3 Storage Lens で、組織全体を対象とするダッシュボードを作成する。コスト最適化のメトリクスとレコメンデーションをアカウント・バケット単位で確認する。","各アカウントで S3 インベントリを有効にして、レポートを 1 つのバケットに集約する。Amazon Athena でクエリを実行して、未完了のアップロードや非現行バージョンを集計する。","AWS Cost Explorer で S3 の使用タイプ別の費用を確認する。費用の大きいアカウントの管理者に、バケットの設定の見直しを依頼する。","各アカウントで S3 ストレージクラス分析を有効にして、バケットごとにアクセスパターンの分析結果を確認する。結果に応じてライフサイクルルールを設定する。"],"answer":[0],"why":["Storage Lens は、組織内のアカウントとバケットを横断して、使用量とアクティビティのメトリクスを 1 つのダッシュボードで可視化できる。未完了のマルチパートアップロードや非現行バージョンのバイト数なども確認でき、スクリプトは不要になる。","同じ情報は集められるが、インベントリの設定、集約、Athena のクエリの作成と運用が必要になる。可視化を最も運用効率よく行う方法ではない。","Cost Explorer ではアカウントや使用タイプ単位の費用は分かるが、バケットごとのライフサイクルルールの有無や、未完了のアップロードの量までは分からない。","ストレージクラス分析は、1 つのバケットやプレフィックスのアクセスパターンを分析する機能で、組織全体の概況の把握には向かない。未完了のアップロードも分からない。"],"explain":"「組織全体」「アカウント・バケット単位」「スクリプトなし」「未完了のマルチパートアップロードや非現行バージョンを把握」がそろったら、S3 Storage Lens を選ぶ。組織全体のダッシュボードは、組織で信頼されたアクセスを有効にして作成する。可視化したあとの削減は、ライフサイクルルールで行う。","point":"S3 の使用状況を組織全体で可視化し、無駄を見つけるなら S3 Storage Lens。ストレージクラス分析は 1 バケットのアクセス分析用。","diagram":null},{"id":"d4-41","domain":4,"topic":"データ転送料金","type":"single","stem":"ある企業は、夜間に実行する大規模なデータ処理バッチを、3 つの AZ に分散した Amazon EC2 インスタンス 60 台で実行しています。ワーカー間では処理の途中結果を頻繁に交換しており、AZ 間のデータ転送料金が EC2 の費用に迫る額になっています。バッチは再実行できるため、処理中に AZ の障害で停止しても、やり直せば業務上問題ありません。処理時間を変えずに、データ転送のコストを最小限に抑える必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["ワーカーを Network Load Balancer の背後に配置する。クロスゾーン負荷分散を有効にして、ワーカー間の通信が特定の AZ に偏らないようにする。","ワーカー間の通信を、インターフェイス型 VPC エンドポイントを使った AWS PrivateLink 経由に変更し、通信を AWS のネットワーク内に閉じる。","ワーカーのインスタンスタイプを、ネットワーク帯域幅がより大きいものに変更する。AZ 間の通信を高速にして、処理にかかる時間を短縮する。","Auto Scaling グループを、1 つの AZ のサブネットだけでインスタンスを起動するように構成する。すべてのワーカーを同じ AZ に配置する。"],"answer":[3],"why":["クロスゾーン負荷分散は、AZ をまたいで通信を分散する設定であり、AZ 間の通信がかえって増える。転送料金の削減にはならない。","インターフェイス型エンドポイントでも、AZ をまたぐ通信にはデータ転送料金がかかる。さらに、エンドポイントの料金も追加される。","帯域幅が大きくなっても、AZ 間のデータ転送料金は転送量に応じてかかり続ける。コストは削減できない。","同じ AZ 内のプライベート IP アドレス間の通信には、データ転送料金がかからない。バッチは再実行できるので、単一 AZ にしても可用性の要件に反しない。"],"explain":"AZ 間の通信は、同じリージョン内でも双方向にデータ転送料金がかかる。一方、同じ AZ 内でプライベート IP アドレスを使う通信は無料である。「再実行できる」「障害で停止しても問題ない」という条件があるので、可用性より費用を優先して単一 AZ に寄せられる。可用性が必要なワークロードでは、この選択はできない。","point":"同じ AZ 内のプライベート IP 通信は無料、AZ 間は課金される。再実行できるバッチなら単一 AZ に寄せて転送料金を減らす。","diagram":{"caption":"正解の構成: ワーカーを同じ AZ に集めて AZ 間転送をなくす","cols":3,"rows":1,"groups":[{"label":"AZ-a","kind":"az","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"asg","label":"Auto Scaling","sub":"単一 AZ のサブネット","kind":"compute","c":0,"r":0},{"id":"w1","label":"ワーカー A","sub":"EC2","kind":"compute","c":1,"r":0},{"id":"w2","label":"ワーカー B","sub":"EC2","kind":"compute","c":2,"r":0}],"edges":[{"from":"asg","to":"w1","label":"起動"},{"from":"w1","to":"w2","label":"AZ 内は無料","both":true}]}},{"id":"d4-42","domain":4,"topic":"データ転送料金","type":"single","stem":"ある企業は、東京リージョンの Amazon S3 バケットに、毎日数百 GB のログと計測データを蓄積しています。大阪リージョンの Amazon EC2 インスタンス群が、同じデータを 1 日に何度も繰り返し読み込んで分析しており、リージョン間のデータ転送料金が大きな割合を占めています。分析ジョブは引き続き大阪リージョンで実行する必要があります。アプリケーションの変更は、読み込み先のバケット名を変えるだけにとどめたいと考えています。最も費用対効果の高い方法でコストを削減するソリューションはどれですか。","choices":["大阪リージョンの EC2 インスタンスが、東京のバケットに S3 Transfer Acceleration のエンドポイントでアクセスするようにして、転送を最適化する。","大阪リージョンに S3 バケットを作成し、東京のバケットからのレプリケーションを設定する。分析ジョブの読み込み先を大阪のバケットに変更する。","東京のバケットを配信元にした Amazon CloudFront ディストリビューションを作成し、大阪のインスタンスは CloudFront 経由でデータを読み込む。","東京と大阪の VPC を VPC ピアリングで接続し、S3 へのアクセスがピアリング接続を経由するようにルートテーブルを変更する。"],"answer":[1],"why":["Transfer Acceleration は、遠いクライアントからのアップロードやダウンロードを高速にする機能で、リージョン間の転送料金を減らすものではない。追加の料金もかかる。","新しいデータを 1 回だけ大阪にレプリケートすれば、繰り返しの読み込みは同じリージョン内で完結し、リージョン間の転送料金は最初の 1 回分で済む。変更も読み込み先のバケット名だけになる。","CloudFront はキャッシュされなかったデータの取得や、大容量データの分析用途には向かない。ログや計測データのように追記され続けるデータでは、効果が限られる。","S3 へのアクセスは VPC ピアリングの経路を通らない。ルートテーブルを変更しても、S3 へのアクセス経路は変わらず、転送料金も減らない。"],"explain":"「同じデータを繰り返し読み込む」「リージョン間の転送料金が大きい」という条件から、データを使う側のリージョンに置き換える。レプリケーションなら、新しいオブジェクトをリージョン間で転送するのは 1 回だけになり、読み込みはすべて大阪のバケットから行える。読み込み回数が多いほど、削減効果が大きくなる。","point":"同じデータを別リージョンから繰り返し読むなら、使う側のリージョンにレプリケートして、リージョン間の転送を 1 回に減らす。","diagram":{"caption":"正解の構成: 大阪にレプリケートして読み込みを同一リージョンで完結する","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":0,"r":0,"w":1,"h":1},{"label":"大阪リージョン","kind":"region","c":1,"r":0,"w":2,"h":1}],"nodes":[{"id":"s3t","label":"S3 (東京)","sub":"ログと計測データ","kind":"storage","c":0,"r":0},{"id":"s3o","label":"S3 (大阪)","sub":"レプリカ","kind":"storage","c":1,"r":0},{"id":"ec2","label":"分析用 EC2","sub":"1 日に何度も読込","kind":"compute","c":2,"r":0}],"edges":[{"from":"s3t","to":"s3o","label":"複製","style":"dashed"},{"from":"ec2","to":"s3o","label":"同一リージョン"}]}},{"id":"d4-43","domain":4,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、開発チーム向けに Amazon RDS for PostgreSQL の DB インスタンス 12 台を、24 時間 365 日稼働させています。開発チームが利用するのは平日の 9 時から 19 時だけで、夜間と週末はアクセスがありません。DB のデータは、翌営業日にそのまま使える必要があります。開発用なので Multi-AZ 配置にはしていません。運用上のオーバーヘッドを最小限に抑えながらコストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EventBridge Scheduler で、汎用ターゲットとして RDS の StopDBInstance を平日の 19 時に、StartDBInstance を平日の 8 時 30 分に実行するスケジュールを作成する。","毎晩 DB インスタンスのスナップショットを取得して DB インスタンスを削除する。翌朝、AWS Lambda 関数でスナップショットから DB インスタンスを復元する。","DB インスタンスのリザーブドインスタンスを購入する。使用していない時間帯の料金を含めて、割引料金で支払う。","夜間と週末は DB インスタンスクラスを最小のものに変更し、平日の朝に元のインスタンスクラスへ戻すスケジュールを作成する。"],"answer":[0],"why":["停止している間は DB インスタンスの時間料金がかからない。データとエンドポイントは維持されるため、翌営業日にそのまま使える。スケジュールは設定だけで作れ、コードは不要である。","データは保持できるが、削除と復元のたびにエンドポイントなどの設定が変わる可能性がある。復元の時間もかかり、仕組みの作成と運用も必要になる。","リザーブドインスタンスは、使用していない時間帯も含めて割引料金が発生する。稼働時間を減らす施策ではなく、停止による削減ほど安くならない。","インスタンスクラスの変更ごとに停止を伴い、夜間も最小クラスの時間料金が発生し続ける。停止するより削減効果が小さい。"],"explain":"夜間と週末に使わない開発用の DB は、停止して時間料金を止めるのが最も安い。EventBridge Scheduler の汎用ターゲットなら、RDS の停止・開始の API を設定だけで呼び出せる。RDS の DB インスタンスは最長 7 日間停止でき、それを超えると自動的に起動するので、週末をまたぐ停止なら問題ない。停止中もストレージの料金はかかる。","point":"使わない時間帯の開発用 DB は停止して時間料金を止める。EventBridge Scheduler で停止・開始を自動化する。停止は最長 7 日間。","diagram":{"caption":"正解の構成: スケジュールで RDS を停止・開始する","cols":3,"rows":1,"groups":[],"nodes":[{"id":"sch","label":"EventBridge","sub":"Scheduler","kind":"integration","c":0,"r":0},{"id":"rds","label":"開発用 RDS","sub":"夜間と週末は停止","kind":"database","c":1,"r":0},{"id":"dev","label":"開発チーム","sub":"平日 9〜19 時","kind":"client","c":2,"r":0}],"edges":[{"from":"sch","to":"rds","label":"停止・開始"},{"from":"dev","to":"rds","label":"接続"}]}},{"id":"d4-44","domain":4,"topic":"RDS・Aurora","type":"single","stem":"あるソーシャルゲーム企業は、Amazon Aurora MySQL 互換のプロビジョニングされた DB クラスター（標準のストレージ構成）で、ゲームのバックエンドを運用しています。負荷は 1 日を通して高く、読み取りと書き込みの I/O が非常に多いため、請求では I/O リクエストの料金が Aurora の費用全体の大きな割合を占めています。DB インスタンスのクラスは負荷に見合っており、性能と可用性の要件は今のままで問題ありません。アプリケーションの変更は避けながら、コストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["DB インスタンスを Aurora Serverless v2 に変更し、Aurora 容量ユニット（ACU）が負荷に応じて自動で増減するようにする。","Aurora レプリカを追加して、読み取りクエリを分散する。ライターインスタンスの I/O を減らして、I/O リクエストの料金を抑える。","データを Amazon EC2 上の自己管理の MySQL に移行する。Provisioned IOPS（io2）の Amazon EBS ボリュームを使用して I/O の料金をなくす。","DB クラスターのストレージ構成を Aurora I/O-Optimized に変更する。I/O リクエストの従量料金がなくなり、インスタンスとストレージの料金で利用できる。"],"answer":[3],"why":["Serverless v2 は容量を自動で調整する仕組みで、負荷が常に高いワークロードでは削減効果が小さい。I/O リクエストの料金も標準構成のままかかる。","レプリカを追加しても、クラスター全体の I/O の量は減らず、レプリカ分のインスタンス料金も増える。I/O の料金の割合は変わらない。","I/O の料金はなくなるが、移行の作業と、データベースの運用・管理の負担が大きく増える。アプリケーションの変更を避ける要件にも反する。","I/O-Optimized は I/O リクエストの料金がかからない構成で、I/O が多く、その料金が費用全体の大きな割合を占めるワークロードのコスト削減に向く。DB クラスターの設定変更だけで済み、アプリケーションの変更は要らない。"],"explain":"「I/O の料金が費用の大きな割合」「負荷は常に高い」「アプリケーションの変更なし」が決め手になる。Aurora の標準構成は I/O ごとに課金される一方、I/O-Optimized はインスタンスとストレージの単価が高い代わりに I/O の課金がない。I/O が少ないワークロードでは標準の方が安いので、請求の内訳で I/O の割合を見て選ぶ。","point":"I/O 料金の割合が高い Aurora は I/O-Optimized、I/O が少ないなら標準構成。変動する負荷なら Serverless v2。","diagram":null},{"id":"d4-45","domain":4,"topic":"DynamoDB","type":"single","stem":"ある企業は、IoT 機器の過去の計測履歴を Amazon DynamoDB のテーブルに保存しています。テーブルのサイズは数十 TB に達しており、請求ではストレージの料金がテーブルの費用の大半を占めています。履歴はまれにしか読み取られず、読み取りと書き込みのスループットは低く安定しています。履歴は削除できず、読み取るときには他のテーブルと同じミリ秒単位の応答が必要です。アプリケーションのコードを変更せずに、コストを削減する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["DynamoDB Accelerator（DAX）のクラスターを作成し、アプリケーションの接続先を DAX のエンドポイントに変更する。","テーブルクラスを DynamoDB Standard-IA に変更する。","テーブルで Time to Live（TTL）を有効にし、一定期間を過ぎた項目が自動的に削除されるようにする。","テーブルのデータを Amazon S3 にエクスポートして DynamoDB の項目を削除する。必要なときに Amazon Athena でクエリを実行する。"],"answer":[1],"why":["DAX は読み取りを高速化するキャッシュで、クラスターの費用が追加される。ストレージの料金は減らず、接続先の変更も必要になる。","Standard-IA は、ストレージの料金を抑えた、アクセス頻度の低いデータ向けのテーブルクラスである。読み取りのレイテンシーは変わらず、コードの変更も不要で、ストレージ料金が費用の大半を占めるテーブルに向く。","TTL は期限を過ぎた項目を削除する機能である。履歴は削除できないという要件に反する。","ミリ秒単位の応答という要件を満たせず、Athena への読み取りの変更でコードの修正も必要になる。"],"explain":"「ストレージ料金が大半」「アクセスはまれ」「ミリ秒の応答」「コード変更なし」から、テーブルクラスの Standard-IA を選ぶ。Standard-IA はストレージ料金が安い代わりに、読み取りと書き込みの料金は標準より高くなる。そのため、スループットが低く、ストレージ料金が費用の大半を占めるテーブルに合う。テーブルクラスは、データの移行なしに変更できる。","point":"ストレージ料金が支配的でアクセスの少ない DynamoDB テーブルは Standard-IA テーブルクラス。変更はコード不要。","diagram":null},{"id":"d4-46","domain":4,"topic":"EBS","type":"multi","stem":"ある企業は、数百台の Amazon EC2 インスタンスの Amazon EBS ボリュームについて、毎日のスナップショットを自作のスクリプトで作成しています。古いスナップショットを削除する仕組みがなく、スナップショットの数と保管料金が増え続けています。社内規程では、直近 30 日分のスナップショットは復元に備えて必要ですが、30 日を過ぎたものは削除してよいとされています。ただし、四半期末に作成したスナップショットだけは、監査のために 3 年間保持する必要があります。四半期末のスナップショットは、監査のときにしか使われず、復元に 1 日程度かかっても構いません。運用上のオーバーヘッドを最小限に抑えながらコストを削減する手順の組み合わせはどれですか。","choices":["すべてのスナップショットを毎月 Amazon S3 バケットにコピーして S3 Glacier Deep Archive に保存し、EBS のスナップショットを削除する。","Amazon Data Lifecycle Manager のポリシーで、日次スナップショットの作成と、30 日を過ぎたスナップショットの削除を自動化する。ポリシーの対象は日次用のタグを付けたものだけにする。","すべてのスナップショットを毎日別のリージョンにコピーして、コピー先でも 30 日間保持する。","すべての EBS ボリュームのタイプをコールド HDD（sc1）に変更して、スナップショットの料金を下げる。","四半期末のスナップショットは、日次用とは別のタグを付けてポリシーの対象から外し、EBS スナップショットのアーカイブ階層に移行して 3 年間保持する。"],"answer":[1,4],"why":["EBS のスナップショットは、S3 バケットのオブジェクトとして直接コピーしたり、Glacier のストレージクラスに保存したりすることはできない。実現できたとしても、運用が複雑になる。","Data Lifecycle Manager は、スナップショットの作成と削除を自動化できる。スクリプトと削除の仕組みが不要になり、保持期間を過ぎたスナップショットが自動で整理される。","コピーを増やすため、保管料金とデータ転送料金がむしろ増える。古いスナップショットの削除の問題も解決しない。","ボリュームのタイプは、スナップショットの保管料金に影響しない。コールド HDD はルートボリュームに使えず、性能も大きく変わる。","アーカイブ階層は、まれにしか使わず、取り出しに時間がかかってもよいスナップショットを、標準階層より安く長期保管できる。四半期末のスナップショットの要件に合う。"],"explain":"要件は 2 つに分かれる。日次スナップショットの作成と、30 日を過ぎたものの削除は、Data Lifecycle Manager で自動化する。3 年間保持し、復元に 1 日程度かかってもよい四半期末のスナップショットは、アーカイブ階層に移して保管料金を下げる。両者を別のタグで分けて、保持が必要なスナップショットが削除されないようにする。","point":"スナップショットの作成と削除の自動化は Data Lifecycle Manager。長期保管でまれにしか使わないものはアーカイブ階層。","diagram":null},{"id":"d4-47","domain":4,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、Amazon EFS のファイルシステムに設計データを保存しており、AWS Backup で毎日バックアップを取得しています。バックアップはすべてウォームストレージに保存され、保持期間を 7 年にしているため、バックアップの保管料金が増え続けています。規制により 7 年間の保持は必要ですが、作成から 35 日を過ぎたバックアップは監査のときにしか復元されず、復元に数時間かかっても構いません。バックアップの取得の運用は変えずに、コストを削減する必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["EFS のライフサイクル管理を設定し、30 日間アクセスのないファイルを EFS Infrequent Access に移行する。バックアップの保持期間は変更しない。","AWS Backup のコピージョブで、バックアップを別のリージョンのバックアップボールトにコピーする。コピーが完了したら、元のバックアップを削除する。","バックアッププランのライフサイクルで、作成から 35 日後にバックアップをコールドストレージへ移行し、7 年後に削除する。","EFS のレプリケーションを有効にして別のリージョンにレプリカを作成する。AWS Backup でのバックアップの取得を停止する。"],"answer":[2],"why":["ファイルシステム内のデータの保管料金は下がるが、すでに取得したバックアップの保管料金は下がらない。バックアップの費用の問題を解決しない。","リージョンをまたぐコピーは、ストレージ料金とデータ転送料金がかかる。保管のコストを下げる手段ではない。","AWS Backup は、EFS のバックアップをコールドストレージに移行できる。保管料金が安く、復元に時間がかかるため、35 日以降は監査のときだけ復元するという要件に合う。プランの設定だけで済み、取得の運用は変わらない。","レプリカの保管料金に加えてレプリケーションの転送料金もかかる。バックアップの取得をやめると、7 年間の保持という規制の要件も満たせなくなる。"],"explain":"「35 日以降は監査のときだけ」「復元に数時間かかってよい」という条件から、コールドストレージに移す。AWS Backup のライフサイクルを設定すれば、取得の運用を変えずに、指定した日数の経過後に自動で移行でき、保持期間後の削除もできる。コールドストレージには、移行後の最低保存期間があるため、保持が長い 7 年のバックアップに向いている。","point":"長期保管のバックアップは、AWS Backup のライフサイクルでコールドストレージに移行して保管料金を下げる。EFS や DynamoDB などが対象。","diagram":{"caption":"正解の構成: AWS Backup のライフサイクルでコールドストレージへ移行する","cols":4,"rows":1,"groups":[],"nodes":[{"id":"efs","label":"Amazon EFS","sub":"設計データ","kind":"storage","c":0,"r":0},{"id":"bk","label":"AWS Backup","sub":"日次プラン","kind":"management","c":1,"r":0},{"id":"warm","label":"ウォーム","sub":"作成から 35 日間","kind":"storage","c":2,"r":0},{"id":"cold","label":"コールド","sub":"35 日後〜7 年","kind":"storage","c":3,"r":0}],"edges":[{"from":"efs","to":"bk","label":"毎日取得"},{"from":"bk","to":"warm","label":"保存"},{"from":"warm","to":"cold","label":"35 日後に移行"}]}}],"clf":[{"id":"clf-d1-01","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある新規事業チームは、売れ行きが読めない新サービスを始めるにあたり、サーバーを事前に購入せず、使った分だけ支払う形で始めたいと考えています。この考え方に当たるクラウドの利点はどれですか。","choices":["固定費を変動費に変えられる","規模の経済により単価が下がる","数分でグローバルに展開できる","データセンターの運用が不要になる"],"answer":[0],"why":["サーバー購入の初期投資を、使った分だけ支払う従量課金に置き換えられる。","多数のお客様の利用を集約して AWS が単価を下げる仕組み。お客様の支払い方法の話ではない。","複数のリージョンへ短時間で展開できるという利点。支払い方法とは別の話。","ラックや電源の管理をお客様が行わずに済むという利点。支払い方法とは別の話。"],"explain":"「事前に購入せず、使った分だけ支払う」は、設備投資という固定費を従量課金の変動費に置き換えるという利点を指す。単価が下がる話（規模の経済）や展開の速さとは区別する。","point":"固定費を変動費に変える = 先行投資なしで、使った分だけ支払う。","diagram":null},{"id":"clf-d1-02","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、AWS の利用量が全体として増えるにつれて、同じサービスの単価が段階的に引き下げられていることに気付きました。この単価が下がる理由として最も適切なものはどれですか。","choices":["お客様が利用するリージョンの数を年々増やしているため。","AWS が利用を集約し、規模の経済を得ているため。","お客様が自社のデータセンター設備を増設しているため。","お客様が将来の利用量を予測して長期契約しているため。"],"answer":[1],"why":["リージョンを増やしても単価は下がらない。むしろ利用量が増えて費用は増える。","多数のお客様の利用を集約することで大量調達や運用効率化が進み、そのメリットが料金に還元される。","自社設備の増設はオンプレミスの話で、AWS の単価とは関係がない。","予測に基づく契約は購入オプションの話で、単価低下の理由ではない。"],"explain":"多数のお客様の利用が集約されることで、AWS は大規模な調達と運用の効率化を実現し、その結果を料金の引き下げとして還元できる。これが「規模の経済によるメリット」。","point":"規模の経済 = 多数のお客様の利用を集約でき、AWS が単価を下げられる。","diagram":null},{"id":"clf-d1-03","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある小売企業では、年末商戦の 2 週間だけアクセスが通常の 10 倍になり、それ以外の期間は大きく減ります。ピークに合わせて機器を購入する必要がなくなる、クラウドの利点はどれですか。","choices":["データセンターの運用が不要になる","数分でグローバルに展開できる","キャパシティの推測が不要になる","規模の経済により単価が下がる"],"answer":[2],"why":["設備の管理が不要になるという利点。需要の増減に合わせて容量を変える話ではない。","世界各地へ短時間で展開できるという利点。需要の山谷への対応とは別の話。","必要な量をその都度増減できるため、ピークを予測して設備を買う必要がない。","AWS 側の調達規模による単価低下。お客様の需要変動への対応とは別の話。"],"explain":"需要の山谷が大きい場合、オンプレミスではピークに合わせて購入するため普段は遊休リソースが生じ、少なく見積もれば機会を失う。クラウドでは必要なときに必要な量だけ使えるため、容量の予測が不要になる。","point":"需要の予測が難しい、季節で変動する = キャパシティの推測が不要。","diagram":null},{"id":"clf-d1-04","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある開発チームは、新機能の検証のために、本番と同等の環境を数分で作り、検証が終わったらすぐに削除したいと考えています。この要件に最も関係するクラウドの利点はどれですか。","choices":["固定費を変動費に変えられる","データセンターの運用が不要になる","規模の経済により単価が下がる","速度と俊敏性の向上"],"answer":[3],"why":["支払い方法の利点。環境を素早く用意できることとは別の話。","設備管理から解放される利点。環境を素早く作ることが主題ではない。","AWS 側の調達規模による単価低下。環境の用意の速さとは関係がない。","リソースを数分で用意でき、試行錯誤のコストと時間を大幅に減らせる。"],"explain":"オンプレミスでは機器の調達や設置に数週間かかることがあるが、クラウドでは数分でリソースを用意できる。素早く試して、不要になればすぐ片付けられることが「速度と俊敏性」の核心。","point":"環境を数分で用意し、試して、すぐ片付ける = 速度と俊敏性。","diagram":null},{"id":"clf-d1-05","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、サーバーラックの設置、電源・空調の保守、機器の入れ替え作業にかかる負担をなくし、アプリケーションの開発に人員を集中させたいと考えています。当てはまるクラウドの利点はどれですか。","choices":["キャパシティの推測が不要になる","固定費を変動費に変えられる","データセンターの運用が不要になる","数分でグローバルに展開できる"],"answer":[2],"why":["需要に合わせて容量を調整できるという利点。設備管理の負担とは別の話。","支払い方法の利点。ラックや電源の管理とは別の話。","物理設備の管理は AWS が担うため、お客様は自社のアプリケーションに集中できる。","世界各地への展開の速さに関する利点。設備管理の負担とは別の話。"],"explain":"ラック、電源、空調、機器の保守といった差別化につながらない作業は AWS が担う。お客様はその分の人員と時間を、顧客に価値を届けるアプリケーションの開発に回せる。","point":"物理設備の管理が不要 = 差別化にならない作業から解放される。","diagram":null},{"id":"clf-d1-06","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、アジアで始めたサービスを欧州の利用者にも低い遅延で提供するため、わずか数日のうちに欧州で環境を立ち上げたいと考えています。当てはまるクラウドの利点はどれですか。","choices":["数分でグローバルに展開できる","速度と俊敏性の向上","キャパシティの推測が不要になる","規模の経済により単価が下がる"],"answer":[0],"why":["現地のデータセンターを用意せず、世界中のリージョンに短時間で環境を立ち上げられる。","開発環境などを素早く用意できるという利点。世界各地の利用者への近さが主題ではない。","需要に合わせて容量を増減する話。新しい地域への展開とは別の話。","AWS 側の調達規模による単価低下。展開地域の広さとは関係がない。"],"explain":"新しい国や地域に自社でデータセンターを構えるには、時間もコストもかかる。AWS のグローバルインフラストラクチャを使えば、数クリックで複数のリージョンに展開し、利用者に近い場所でサービスを提供できる。","point":"新しい地域へすぐ展開・利用者の近くで提供 = 数分でグローバル展開。","diagram":null},{"id":"clf-d1-07","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、システムに障害が起きても利用者への影響を小さくしたいと考えています。クラウドの高可用性について正しい説明はどれですか。","choices":["需要に応じてリソースを自動で増減する。","使った分だけを支払う料金体系である。","大量のデータを別の保存場所へ転送する。","障害が起きても停止時間を最小限に抑える。"],"answer":[3],"why":["これは弾力性の説明。可用性とは、停止時間をどれだけ短くできるかを指す。","これは従量課金の説明。可用性とは関係がない。","データ転送の機能の話で、高可用性の定義ではない。","複数の AZ に分散するなどして、障害時も停止時間を短くする。"],"explain":"高可用性は、システムがどれだけ長く利用可能であるかを表す。複数の AZ に分散して配置するなど、障害の影響を最小限にとどめて停止時間を短くする。需要に応じた増減は弾力性、という別の概念である。","point":"高可用性 = 停止時間を最小限に。需要に応じた増減は弾力性。","diagram":null},{"id":"clf-d1-08","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業のアプリケーションは、日中は多くのアクセスを受けますが、夜間はほとんど使われません。負荷に合わせて自動でリソースを増減し、夜間のコストも抑えたいと考えています。これに当たる性質はどれですか。","choices":["高可用性","弾力性","耐障害性","グローバルリーチ"],"answer":[1],"why":["障害時の停止時間を最小限にする性質。負荷に応じた増減の話ではない。","負荷に応じてリソースを自動的に増減でき、不要になったリソースは減らせる。","コンポーネントが故障しても動作を継続する性質。負荷への追従の話ではない。","世界中の利用者にサービスを提供できる性質。負荷への追従の話ではない。"],"explain":"弾力性は、需要の増減に合わせてリソースを自動的に拡大・縮小できる性質で、縮小することで夜間などの無駄な費用も減らせる。「自動」「増減」「必要な分だけ」が決め手。","point":"弾力性 = 負荷に合わせて自動で増やし、減らせる。","diagram":null},{"id":"clf-d1-09","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、利用者数の増加に合わせて、リソースを追加してシステムの処理能力を高められる性質を重視しています。この性質を表す用語はどれですか。","choices":["高可用性","スケーラビリティ","耐障害性","俊敏性"],"answer":[1],"why":["停止時間を最小限にする性質。処理能力を伸ばす話ではない。","負荷の増加に対して、リソースを追加するなどして処理能力を伸ばせる性質。","一部が故障しても動き続ける性質。処理能力を伸ばす話ではない。","変更や実験を素早く行える性質。処理能力の拡張が主題ではない。"],"explain":"スケーラビリティは、負荷の増大に対応して処理能力を拡大できること。弾力性は、需要に応じて自動で拡大・縮小まで行える点が加わった性質で、増減のどちらにも柔軟に対応する点で見分ける。","point":"スケーラビリティ = 増加に対応して伸ばせる。弾力性は縮小まで含む。","diagram":null},{"id":"clf-d1-10","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、システムの一部のコンポーネントが故障しても、利用者への影響を出さずにサービスを継続できる設計を目指しています。これに最も近い性質はどれですか。","choices":["スケーラビリティ","弾力性","俊敏性","耐障害性"],"answer":[3],"why":["負荷の増加に処理能力を合わせる性質。故障への対処ではない。","需要の増減に合わせてリソースを調整する性質。故障への対処ではない。","変更や実験を素早く行える性質。故障への対処ではない。","一部が故障しても、冗長な構成によって動作を継続できる性質。"],"explain":"耐障害性は、コンポーネントに障害が発生してもシステム全体が動き続けられること。冗長な構成にして単一障害点をなくすことで実現する。需要の増減に対応する弾力性・スケーラビリティとは目的が違う。","point":"耐障害性 = 故障しても止まらず動き続ける。冗長化がカギ。","diagram":null},{"id":"clf-d1-11","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、新しいアイデアを低いコストで素早く試し、うまくいかなければすぐにやめられる文化を作りたいと考えています。クラウドのどの性質がこの方針を支えますか。","choices":["俊敏性","耐障害性","高可用性","スケーラビリティ"],"answer":[0],"why":["実験のコストと時間が小さく、失敗しても損失が少ないため、素早く試せる。","故障しても動き続ける性質。実験のしやすさとは別の話。","停止時間を短くする性質。実験のしやすさとは別の話。","負荷に合わせて能力を伸ばす性質。実験のしやすさとは別の話。"],"explain":"俊敏性は、アイデアを素早く試し、失敗してもコストが小さいことで、イノベーションの速度を高める性質。ハードウェアの調達を待たずにリソースを用意できる点が根拠になる。","point":"素早く試して、失敗しても低コスト = 俊敏性。","diagram":null},{"id":"clf-d1-12","domain":1,"topic":"クラウドの利点","type":"single","stem":"ある企業は、世界各地の利用者に低いレイテンシーでコンテンツを届けたいと考えています。クラウドのどの考え方が、この目的に最も合いますか。","choices":["すべてのシステムを 1 つのリージョンだけに集約する。","自社のデータセンターを利用者のいる各国に新設する。","利用者に近いリージョンやエッジロケーションを使う。","リソースを購入して常に最大容量を確保しておく。"],"answer":[2],"why":["遠い地域の利用者のレイテンシーが大きくなり、目的に合わない。","時間もコストもかかり、クラウドの利点を活かしていない。","グローバルインフラストラクチャを使い、利用者に近い場所からサービスを提供する。","遅延の改善ではなく、容量の話。しかも固定費が増える。"],"explain":"AWS は世界中にリージョンとエッジロケーションを展開しており、利用者に近い場所でサービスを提供することでレイテンシーを下げられる。これが「グローバルリーチ」というクラウドの強み。","point":"グローバルリーチ = 利用者に近い場所で提供してレイテンシーを下げる。","diagram":null},{"id":"clf-d1-13","domain":1,"topic":"クラウドの利点","type":"multi","stem":"ある企業は、AWS への移行を検討するにあたり、クラウドの利点を整理しています。クラウドの 6 つの利点として正しいものはどれですか。","choices":["ハードウェアの保守を自社で強化できる","固定費を変動費に変えられる","需要を事前に正確に予測できるようになる","数分でグローバルに展開できる","必ず初期費用が高くなる"],"answer":[1,3],"why":["保守は AWS が担う。むしろ自社の保守作業をなくせるのが利点。","設備投資という固定費を、使った分だけの従量課金に置き換えられる。","予測が不要になるのが利点。予測の精度を上げる話ではない。","世界各地のリージョンへ短時間で環境を立ち上げられる。","初期費用を抑えられるのが利点。説明が逆である。"],"explain":"クラウドの 6 つの利点は、固定費を変動費に変える、規模の経済、キャパシティの推測が不要、速度と俊敏性、データセンターの運用が不要、数分でグローバルに展開、の 6 つ。「数分で」「使った分だけ」が決め手の言葉になる。","point":"6 つ: 変動費化・規模の経済・推測不要・俊敏性・運用不要・グローバル展開。","diagram":null},{"id":"clf-d1-14","domain":1,"topic":"クラウドの利点","type":"multi","stem":"クラウドの弾力性によって得られる効果として正しいものはどれですか。","choices":["需要が増えたときに、リソースを自動で追加できる。","データセンターの物理セキュリティを担える。","需要が減ったときに、リソースを自動で減らせる。","すべてのリージョンで同じ料金になる。","障害時でも停止時間が必ずゼロになる。"],"answer":[0,2],"why":["負荷の増加を検知して自動で増やし、処理能力を確保できる。","物理セキュリティは AWS の責任。弾力性とは関係がない。","縮小も含めて自動で調整でき、遊休リソースへの支払いを減らせる。","料金はリージョンで異なる。弾力性とは関係がない。","停止時間を短くするのは高可用性・耐障害性の目的。弾力性の効果ではない。"],"explain":"弾力性は、需要の増減に合わせてリソースを自動で拡大・縮小できる性質。増やすだけでなく減らすことで、必要な分だけ支払うことができる。可用性や耐障害性とは、目的が異なる。","point":"弾力性 = 負荷に合わせた自動の増減。増やすだけでなく減らす点も含む。","diagram":null},{"id":"clf-d1-15","domain":1,"topic":"クラウドの利点","type":"multi","stem":"ある企業は、オンプレミスのデータセンターから AWS に移行します。「データセンターの運用が不要になる」という利点により、お客様が行わなくてよくなる作業はどれですか。","choices":["EC2 インスタンスのゲスト OS のパッチ適用","サーバーラックの設置と配線","IAM ポリシーの設計と管理","保存するデータの分類と暗号化の判断","電源設備や空調設備の保守"],"answer":[1,4],"why":["ゲスト OS はお客様の責任範囲で、移行後も行う必要がある。","物理設備の設置は AWS のデータセンターで AWS が行う。","アクセス権限の管理はお客様の責任で、移行後も行う必要がある。","データの保護はお客様の責任で、移行後も行う必要がある。","電源・冷却といった施設の保守は AWS が担う。"],"explain":"運用が不要になるのは、ラック、電源、空調、物理的な入退室管理といった物理設備の部分。OS のパッチ適用、アクセス管理、データの保護など、クラウド「における」セキュリティや運用はお客様の責任として残る。","point":"不要になるのは物理設備の運用。OS 以上の管理はお客様に残る。","diagram":null},{"id":"clf-d1-16","domain":1,"topic":"クラウドの利点","type":"multi","stem":"クラウドで「キャパシティの推測が不要になる」ことにより、避けられる問題はどれですか。","choices":["需要を多く見積もりすぎて、使われない設備に費用を払い続ける問題","AWS のサービスの料金が値上がりする問題","利用者のネットワーク回線が遅くなる問題","需要を少なく見積もりすぎて、急な増加に対応できない問題","物理的なデータセンターの災害リスクの問題"],"answer":[0,3],"why":["過剰に購入した設備が遊休となり、固定費が無駄になる問題を避けられる。","料金の改定は容量の推測とは関係がない。","利用者側の回線は、容量の推測とは関係がない。","不足した容量のために利用者を逃す問題を避けられる。","災害対策は可用性の観点で、容量の推測とは別の話。"],"explain":"オンプレミスでは、多めに買えば遊休の無駄が出て、少なめに買えば処理できず機会を失う。クラウドでは必要な量を必要なときに増減できるので、いずれの問題も避けやすい。","point":"推測が不要 = 買いすぎの無駄も、足りない機会損失も避けられる。","diagram":null},{"id":"clf-d1-17","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業の財務部門は、オンプレミスでサーバーを購入する費用を設備投資（CapEx）に、AWS の利用料を運用費（OpEx）に区分しています。AWS に移行すると、費用の性質はどう変わりますか。","choices":["初期の設備投資が大きく増え、運用費はなくなる。","設備投資も運用費も、すべて毎月の固定額になる。","費用はすべて前払いの一括払いになる。","初期の設備投資が減り、毎月の運用費が中心になる。"],"answer":[3],"why":["説明が逆。AWS では設備を購入せず、利用料を運用費として支払う。","利用料は使った分で変わる変動費の性格が強い。","従量課金が基本で、まとめて前払いするものではない。","サーバー購入のまとまった支出が、使った分の従量課金へと置き換わる。"],"explain":"設備投資（CapEx）は、サーバーなどの資産を購入するまとまった支出。運用費（OpEx）は、サービスの利用に応じて継続的に支払う費用。クラウドではこの CapEx が OpEx に置き換わる。","point":"CapEx（購入）から OpEx（利用に応じた支払い）へ。","diagram":null},{"id":"clf-d1-18","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、AWS へ移行すると、これまで必要だった設備投資（CapEx）が不要になると説明を受けました。AWS への移行で不要になる設備投資はどれですか。","choices":["Amazon EC2 の月額の利用料金","Amazon S3 に保存するデータ量に応じた料金","物理サーバーとネットワーク機器の購入費用","AWS のサポートプランの月額料金"],"answer":[2],"why":["使った分を支払う運用費に当たる。設備投資ではない。","保存量に応じて支払う運用費に当たる。設備投資ではない。","物理機器を購入するまとまった支出で、AWS では購入せずに済む。","継続して支払う運用費に当たる。設備投資ではない。"],"explain":"設備投資とは、サーバーやネットワーク機器など資産の購入に充てるまとまった支出。クラウドでは機器を購入しないので、この種の支出が不要になり、代わりに利用料が運用費となる。","point":"機器の購入 = 設備投資。クラウドの利用料は運用費。","diagram":null},{"id":"clf-d1-19","domain":1,"topic":"クラウドの経済性","type":"single","stem":"オンプレミスの総所有コスト（TCO）を算出するとき、サーバー本体の購入費用に加えて含めるべきものはどれですか。","choices":["AWS への移行後に計画している将来のサービス追加費用","データセンターの電力、冷却、設置場所、運用担当者の人件費","AWS の利用方法を学ぶための研修や学習用の費用","マネージドサービスを利用する際に発生する手数料"],"answer":[1],"why":["移行後の話で、現在のオンプレミスの TCO には含まれない。","設備を動かし続けるための間接的なコストで、TCO に含める必要がある。","移行後に発生する費用で、オンプレミスの TCO には含まれない。","AWS 側の費用で、オンプレミスの TCO には含まれない。"],"explain":"TCO は、購入費だけでなく、電力・冷却・設置場所・保守・人件費などの間接コストを含めた総コスト。これを含めずに比較すると、オンプレミスのコストを実際より低く見積もってしまう。","point":"TCO にはハードウェア費に加え、電力・冷却・場所・人件費も含める。","diagram":null},{"id":"clf-d1-20","domain":1,"topic":"クラウドの経済性","type":"single","stem":"財務担当者が、オンプレミスと AWS のコストを公平に比較したいと考えています。正しい進め方はどれですか。","choices":["購入費に運用費も加えた、期間全体の総コストで比べる。","サーバーの購入費用だけを取り出して比べる。","AWS の最初の 1 か月分の請求額だけを取り出して比べる。","オンプレミスの月額の電気代だけを取り出して比べる。"],"answer":[0],"why":["購入費だけでなく間接コストも含めた TCO で比べると、実態に近い比較になる。","電力や人件費などの間接コストが抜け落ち、オンプレミスのコストを低く見積もってしまう。","短期間の比較では、オンプレミスの長期的な費用と比べられない。","電気代は一部の項目にすぎず、総コストの比較にならない。"],"explain":"コスト比較では、ハードウェアの購入費だけでなく、電力、冷却、設置場所、保守、人件費を含めた TCO で評価する。購入費だけの比較は、オンプレミスのコストを過小評価しやすい。","point":"コスト比較は購入費だけでなく、間接コストを含めた TCO で行う。","diagram":null},{"id":"clf-d1-21","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、すでに永続ライセンスを保有している商用データベースソフトウェアを、そのまま Amazon EC2 上で使いたいと考えています。この考え方を表す用語はどれですか。","choices":["ライセンス込みのインスタンスを利用する方式","オープンソースへの全面的な移行","BYOL（ライセンス持ち込み）","従量課金のライセンスを毎月契約し直す方式"],"answer":[2],"why":["ライセンス費用が利用料に含まれる方式。既存ライセンスを持ち込む方式ではない。","ライセンスを持ち込む話ではなく、製品自体を変える話。","既存のライセンスを持ち込んで AWS 上で利用する方式。","保有している永続ライセンスを活用する話ではない。"],"explain":"BYOL（Bring Your Own License）は、すでに保有しているライセンスを AWS 上で使う方式で、ライセンスの追加購入を避けられる場合がある。ライセンス込みは、利用料にライセンス費用が含まれる方式。","point":"BYOL = 保有ライセンスを持ち込む。追加の購入を避けられることがある。","diagram":null},{"id":"clf-d1-22","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、短期間のプロジェクトのために、商用ソフトウェアのライセンスを新たに購入することなく、使った時間に応じてライセンス料を支払いたいと考えています。最も適した方式はどれですか。","choices":["BYOL で新しい永続ライセンスを購入して持ち込む","ライセンス込みのインスタンスを利用する","オンプレミスの既存サーバーでライセンスを使い続ける","ライセンスなしでソフトウェアを利用する"],"answer":[1],"why":["新規にライセンスを購入すると、まとまった費用が先に必要になる。","ライセンス費用が利用料に含まれており、使った分だけ支払う。","設備もライセンスも自社で抱えることになる。","ライセンス条件に反するため、選択肢にならない。"],"explain":"ライセンス込みの方式は、ライセンス費用が利用料に含まれるため、初期の購入が不要で、短期間の利用や利用量が読みにくい場合に向く。保有ライセンスがあり長く使うなら BYOL が合う場合がある。","point":"短期・購入したくない = ライセンス込み。保有ライセンスの活用 = BYOL。","diagram":null},{"id":"clf-d1-23","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、本番用の Amazon EC2 インスタンスの CPU 使用率が、常に 10% 前後にとどまっていることに気付きました。コストを減らすために行う作業として最も適切なものはどれですか。","choices":["より大きなインスタンスタイプへ変更して余裕を持たせる。","リージョンを追加して、負荷を複数に分散する。","インスタンスの台数を増やして使用率を下げる。","ライトサイジングで小さいタイプへ変更する。"],"answer":[3],"why":["大きくすると費用が増え、余剰がさらに大きくなる。","使用率が低い状況で拡大しても、費用が増えるだけ。","台数を増やすと費用が増える。余剰が拡大する。","実際の使用量に合わせてサイズを見直し、無駄な費用を減らす。"],"explain":"ライトサイジングは、ワークロードの実際の使用量に合わせて、リソースのサイズやタイプを適切に調整すること。使用率が低いのに大きなリソースを使い続けると、無駄な費用が発生する。","point":"ライトサイジング = 実際の使用量に合わせてサイズを見直す。","diagram":null},{"id":"clf-d1-24","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、AWS のコストを継続的に見直す取り組みとしてライトサイジングを始めます。ライトサイジングの目的として最も適切なものはどれですか。","choices":["性能を保ちつつ、使われていない分への支払いを減らす。","常に最大サイズのリソースを確保して、性能を最大限に高める。","すべてのワークロードのリソースを同じサイズに統一する。","利用を止めて、費用をゼロにする。"],"answer":[0],"why":["性能要件を満たしながら、過剰なリソースを減らして無駄な費用を抑える。","常に最大サイズにすると、余剰が増えて費用が増える。","ワークロードごとの使用量に合わせることが目的で、統一ではない。","目的は必要な性能を維持しながらの適正化。利用を止めることではない。"],"explain":"ライトサイジングは、性能と費用のバランスを取る考え方で、使用量に対してリソースが大きすぎる場合に小さくする。逆に足りない場合には大きくすることも含まれる。","point":"性能を保ちつつ、リソースの過不足を整えて費用を最適化する。","diagram":null},{"id":"clf-d1-25","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、データベースのパッチ適用やバックアップの作業に多くの運用担当者の時間を割いています。これらの作業を AWS に任せて運用コストを減らす選択肢はどれですか。","choices":["EC2 に自己管理のデータベースを構築する","Amazon RDS を利用する","オンプレミスのサーバーを増設する","データベースの運用担当者を増員する"],"answer":[1],"why":["パッチ適用やバックアップをお客様が行うことになり、運用負担は減らない。","パッチ適用やバックアップをマネージドサービスとして自動化でき、運用の負担が減る。","ハードウェアの保守も含め、運用負担がさらに増える。","人件費が増えるだけで、運用の自動化にならない。"],"explain":"マネージドサービスは、パッチ適用、バックアップ、ハードウェアの保守などの運用作業を AWS が担う。お客様は運用の手間を減らし、アプリケーションなど価値の高い作業に時間を使える。","point":"マネージドサービス = 運用作業を AWS に任せ、運用コストを減らす。","diagram":null},{"id":"clf-d1-26","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、環境の構築を手作業で行っており、作業に時間がかかるうえ、設定ミスも頻発しています。運用コストを減らす方法として最も適切なものはどれですか。","choices":["手順書の枚数を増やして、作業を詳しく記録する。","構築を担当する人員を増員して、作業を分担する。","構築の頻度を減らして、できるだけ変更を避ける。","コードで環境を定義し、構築を自動化する。"],"answer":[3],"why":["手作業のまま変わらず、時間とミスを減らす効果は限定的。","人件費が増えるだけで、ミスや時間の根本的な解決にならない。","変更を避けると、俊敏性が下がり、ビジネスの要求に応えにくくなる。","作業が自動化され、時間が短縮されるうえ、設定ミスも減る。"],"explain":"環境の構築や変更をコードで定義して自動化することで、人手による作業時間と設定ミスを減らし、運用コストを下げられる。クラウドでは API で操作できるため、自動化がしやすい。","point":"自動化は、作業時間とミスを減らして運用コストを下げる。","diagram":null},{"id":"clf-d1-27","domain":1,"topic":"クラウドの経済性","type":"single","stem":"ある企業は、オンプレミスでピーク時に合わせて購入したサーバーが、普段は大半が遊休になっていることに悩んでいます。クラウドで、この過剰なプロビジョニングによる無駄を減らす方法はどれですか。","choices":["ピークに合わせた容量を常時確保しておく。","利用しないリソースも、念のため起動したままにしておく。","必要な分だけ使い、不要なリソースは停止・削除する。","すべてのリソースを最大サイズで起動しておく。"],"answer":[2],"why":["オンプレミスと同じ過剰な確保で、無駄は減らない。","使われないリソースにも支払いが発生し、無駄が減らない。","使った分だけ支払う従量課金により、遊休のリソースに支払う無駄をなくせる。","最大サイズで起動すると、費用が増えて余剰が拡大する。"],"explain":"過剰なプロビジョニングとは、実際の需要より多いリソースを確保して遊休にしてしまうこと。クラウドでは必要な量を必要な間だけ使い、使わないものは停止・削除できるため、遊休への支払いを減らせる。","point":"過剰なプロビジョニングは、必要な分だけ使う従量課金で解消できる。","diagram":null},{"id":"clf-d1-28","domain":1,"topic":"クラウドの経済性","type":"single","stem":"運用費（OpEx）モデルに関する説明として正しいものはどれですか。","choices":["サービスの利用に応じて、継続的に費用を支払う。","機器を購入するときに、まとまった費用を先に支払う。","費用は一度支払えば、その後は発生しない。","費用は利用量とは無関係で、毎月同額である。"],"answer":[0],"why":["使った分に応じて継続的に支払うモデルで、クラウドの従量課金が当てはまる。","これは設備投資（CapEx）の説明。","運用費は継続的に発生する。一度きりではない。","クラウドの運用費は利用量に応じて変わるのが基本。"],"explain":"運用費（OpEx）は、サービスの利用など継続的な事業活動にかかる費用。クラウドの従量課金は OpEx にあたり、利用量に応じて変動する。購入のまとまった支出は CapEx。","point":"OpEx = 利用に応じた継続的な支出。CapEx = 購入のまとまった支出。","diagram":null},{"id":"clf-d1-29","domain":1,"topic":"クラウドの経済性","type":"multi","stem":"ある企業は、Amazon RDS などのマネージドサービスへ移行して、運用コストの削減を図っています。マネージドサービスの利用で、お客様が行う必要がなくなる作業はどれですか。","choices":["データベースエンジンのパッチ適用","アプリケーションに必要なデータの設計","基盤となるハードウェアの保守","データベースへのアクセス権限の設計","クエリの性能チューニング"],"answer":[0,2],"why":["エンジンのパッチ適用は AWS が担い、お客様の運用負担が減る。","スキーマやデータの設計はお客様の作業で、AWS は代行しない。","ハードウェアや OS の保守は AWS が担う。","アクセス権限の管理はお客様の責任。","アプリケーションの利用に合わせた調整はお客様の作業。"],"explain":"マネージドサービスでは、ハードウェアの保守や OS・エンジンのパッチ適用などの運用作業を AWS が担う。一方で、データの設計、アクセス権限、クエリの調整などはお客様の責任として残る。","point":"マネージドサービスで減るのは基盤の運用。データやアクセス管理は残る。","diagram":null},{"id":"clf-d1-30","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、インフラの構築手順をすべてコードとして管理し、運用手順もスクリプトで実行することで、人為的なミスを減らしたいと考えています。この取り組みは、AWS Well-Architected フレームワークのどの柱の設計原則に当たりますか。","choices":["セキュリティ","運用上の優秀性","パフォーマンス効率","コスト最適化"],"answer":[1],"why":["アクセス制御やデータ保護を扱う柱。手順のコード化そのものが目的ではない。","運用をコードとして実行し、手順を自動化して人為的なミスを減らすのが、この柱の代表的な設計原則。","要件に合うリソースの選択と見直しを扱う柱。手順のコード化が主題ではない。","不要な支出を避けることを扱う柱。手順のコード化が主題ではない。"],"explain":"「運用をコードとして実行する」は運用上の優秀性の設計原則。インフラも運用手順もコードにすることで、再現性が高まり、人為的なミスが減る。","point":"運用をコードとして実行する = 運用上の優秀性。","diagram":null},{"id":"clf-d1-31","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、ネットワークの境界だけでなく、サブネット、インスタンス、アプリケーション、データの各層で保護を適用し、すべての操作の履歴を記録する方針を定めました。この考え方は、どの柱の設計原則に当たりますか。","choices":["信頼性","運用上の優秀性","持続可能性","セキュリティ"],"answer":[3],"why":["障害からの復旧やスケールを扱う柱。層ごとの保護や操作履歴の記録が主題ではない。","変更や手順の自動化を扱う柱。層ごとの保護が主題ではない。","リソースの使用率や環境への影響を扱う柱。保護の層とは別の話。","すべてのレイヤーでセキュリティを適用し、トレーサビリティを確保するのは、この柱の設計原則。"],"explain":"多層防御（すべてのレイヤーでセキュリティを適用）と、操作の追跡可能性の確保は、セキュリティの柱の設計原則。境界の防御だけに頼らない。","point":"すべてのレイヤーで保護 + 追跡可能性 = セキュリティの柱。","diagram":null},{"id":"clf-d1-32","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、ワークロードの障害を検知すると、自動的に正常なリソースへ切り替えて復旧する仕組みを整えています。この取り組みが当てはまる柱はどれですか。","choices":["信頼性","パフォーマンス効率","運用上の優秀性","コスト最適化"],"answer":[0],"why":["障害から自動的に復旧する設計は、この柱の代表的な設計原則。","需要に合わせて効率よくリソースを使う柱。障害からの復旧が主題ではない。","運用手順の改善や自動化を扱う柱。障害からの自動復旧は、より直接的に別の柱に当たる。","支出の最適化を扱う柱。復旧の仕組みとは別の話。"],"explain":"障害を検知して自動で復旧する、ワークロードが期待どおりに機能し続けるための設計は信頼性の柱。運用の自動化と混同しやすいが、目的は「障害に耐えて動き続けること」にある。","point":"障害から自動的に復旧する = 信頼性の柱。","diagram":null},{"id":"clf-d1-33","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、ワークロードの特性に合わせてインスタンスタイプやマネージドサービスを選び、新しい構成を繰り返し試して見直しています。この取り組みは、どの柱に当たりますか。","choices":["コスト最適化","信頼性","パフォーマンス効率","持続可能性"],"answer":[2],"why":["支出を抑える柱。構成の選択と見直しでも関係するが、この問いの主題ではない。","障害への耐性を扱う柱。性能に合わせた構成の選択とは別の話。","要件に合う構成を選び、実験を重ねて見直すのは、この柱の設計原則。","環境への影響を減らす柱。構成の性能面の見直しとは別の話。"],"explain":"ワークロードに合ったリソースの種類やサイズを選び、実験を繰り返して見直すのはパフォーマンス効率の柱。高度な技術をマネージドサービスとして使うことも含まれる。","point":"リソースの選定・実験・見直し = パフォーマンス効率の柱。","diagram":null},{"id":"clf-d1-34","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、開発環境を夜間と休日に停止し、使った分だけ支払う消費モデルを取り入れて、不要な支出を減らしています。この取り組みが当てはまる柱はどれですか。","choices":["持続可能性","コスト最適化","運用上の優秀性","パフォーマンス効率"],"answer":[1],"why":["環境への影響を減らす柱。ここでの目的は支出の削減である。","消費モデルを導入し、不要な支出を避けるのは、この柱の設計原則。","運用の自動化や改善を扱う柱。支出の削減が主題ではない。","性能に合わせた構成を扱う柱。支出の削減が主題ではない。"],"explain":"使った分だけ支払う消費モデルの導入や、使っていないリソースの停止は、コスト最適化の柱の設計原則。決め手は「不要な支出を減らす」こと。","point":"消費モデルの導入・不要な支出の削減 = コスト最適化の柱。","diagram":null},{"id":"clf-d1-35","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、クラウドワークロードが環境に与える影響を減らすため、リソースの使用率を高め、効率のよいハードウェアやマネージドサービスを選ぶ方針です。この取り組みが当てはまる柱はどれですか。","choices":["信頼性","運用上の優秀性","セキュリティ","持続可能性"],"answer":[3],"why":["障害への耐性を扱う柱。環境への影響とは別の話。","運用手順の改善を扱う柱。環境への影響とは別の話。","アクセス制御やデータ保護を扱う柱。環境への影響とは別の話。","使用率の最大化や、効率のよいリソースの選択で環境への影響を減らすのは、この柱の目的。"],"explain":"「環境への影響を減らす」「使用率を最大化する」は持続可能性の柱。6 つ目の柱として追加されたので、取り違えないよう押さえておく。","point":"環境への影響の低減・使用率の最大化 = 持続可能性の柱。","diagram":null},{"id":"clf-d1-36","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、自社のワークロードを AWS のベストプラクティスに照らして評価し、改善点と推奨事項を確認したいと考えています。この目的で使用できる AWS のツールはどれですか。","choices":["AWS Well-Architected Tool","AWS Trusted Advisor","AWS Config","Amazon Inspector"],"answer":[0],"why":["質問に回答する形でワークロードを 6 つの柱に照らして評価し、改善の推奨事項を確認できる。","アカウントの状態を見て、コスト・セキュリティなどの推奨事項を示す。設計の質問に答えて評価するツールではない。","リソースの構成変更を記録し、ルールへの準拠を評価する。設計の評価ツールではない。","EC2 などの脆弱性を自動でスキャンする。設計全体の評価ではない。"],"explain":"AWS Well-Architected Tool は、ワークロードに関する質問に答えることで、6 つの柱に基づくレビューと改善計画を作成できるサービス。Trusted Advisor はアカウントの現状に基づくチェックを行う点で異なる。","point":"ワークロードを 6 つの柱でレビュー = AWS Well-Architected Tool。","diagram":null},{"id":"clf-d1-37","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、注文を受け付けるフロントエンドと注文を処理するバックエンドの間にキューを置き、一方で障害が起きても他方に影響が及ばない構成にしました。この設計の考え方はどれですか。","choices":["密結合","垂直スケーリング","疎結合","モノリシック化"],"answer":[2],"why":["コンポーネントが互いに直接依存する形。一方の障害が他方に波及しやすく、逆の考え方。","1 台のリソースのサイズを大きくする方法。コンポーネント間の依存を減らす話ではない。","コンポーネント間の依存を減らし、一方の障害や変更が他方へ波及しにくくする設計の考え方。","機能を 1 つにまとめる設計。コンポーネントを分ける考え方とは反対。"],"explain":"キューなどを間に置いてコンポーネント同士の依存を減らす設計は疎結合。単一障害点をなくし、個別にスケールや変更ができる点が利点。","point":"疎結合 = 間にキューなどを置き、障害や変更の波及を防ぐ。","diagram":null},{"id":"clf-d1-38","domain":1,"topic":"設計原則","type":"single","stem":"AWS Well-Architected フレームワークの運用上の優秀性の柱の設計原則に沿った取り組みはどれですか。","choices":["小さな変更を頻繁に出し、問題があれば戻せるようにする。","年に 1 回、大規模な変更をまとめて本番環境へリリースする。","障害の原因を振り返らず、同じ手順で復旧作業を繰り返す。","運用手順は担当者の経験に任せ、文書やコードにしない。"],"answer":[0],"why":["小さく頻繁で元に戻せる変更は、運用上の優秀性の設計原則。影響範囲を小さくでき、問題にも素早く対応できる。","大規模な変更は影響が大きく、元に戻すのも難しい。この柱の考え方とは反対。","障害から学び、運用を改善し続けるのがこの柱の考え方。反対の行動。","手順をコード化・文書化して再現性を高めるのがこの柱の考え方。反対の行動。"],"explain":"運用上の優秀性では、運用をコードで実行する、小さく頻繁で元に戻せる変更を行う、運用手順を頻繁に改善する、障害から学ぶ、といった設計原則を挙げている。","point":"小さく頻繁で元に戻せる変更 = 運用上の優秀性。","diagram":null},{"id":"clf-d1-39","domain":1,"topic":"設計原則","type":"single","stem":"信頼性を高めるために、ワークロードの設計で推奨されるスケーリングの考え方はどれですか。","choices":["インスタンスを常に最大サイズにして、垂直方向に拡張する。","ピーク時の需要を推測して、必要な容量を先に確保する。","小さなリソースを複数使い、水平方向に拡張して分散する。","1 台の高性能なリソースに処理を集約して管理する。"],"answer":[2],"why":["サイズを大きくする垂直方向の拡張は、上限があり、単一障害点も残る。","需要を推測して容量を確保する方法は、不足や無駄を招く。推測をやめるのが設計原則。","複数の小さなリソースに分散すれば、1 つが故障しても影響が小さい。需要に応じて増減もできる。","1 台に集約すると単一障害点になり、信頼性が下がる。"],"explain":"信頼性の柱では、水平方向にスケールして単一障害点の影響を減らすこと、キャパシティの推測をやめて需要に応じて増減することを推奨する。","point":"水平方向にスケール + 推測をやめる = 信頼性を高める設計。","diagram":null},{"id":"clf-d1-40","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、世界各地のユーザーに低レイテンシーでサービスを提供するため、複数のリージョンへ数分で環境を展開できる設計にしました。この取り組みは、どの柱の設計原則に当たりますか。","choices":["信頼性","パフォーマンス効率","コスト最適化","セキュリティ"],"answer":[1],"why":["障害への耐性を扱う柱。ここでの目的は、ユーザーのレイテンシーを下げること。","数分でグローバルに展開し、ユーザーに近い場所からサービスを提供するのは、この柱の設計原則。","支出の最適化を扱う柱。レイテンシーの改善が主題ではない。","アクセス制御やデータ保護を扱う柱。展開の速さやレイテンシーとは別の話。"],"explain":"「数分でグローバルに展開する」は、パフォーマンス効率の柱の設計原則の 1 つ。ユーザーに近いリージョンへ展開するとレイテンシーが下がる。","point":"数分でグローバルに展開 = パフォーマンス効率の設計原則。","diagram":null},{"id":"clf-d1-41","domain":1,"topic":"設計原則","type":"single","stem":"ある企業は、機密データを扱う作業で、担当者が直接データに触れないよう、処理を自動化されたツールで行う方針を採りました。この取り組みが当てはまる柱はどれですか。","choices":["運用上の優秀性","パフォーマンス効率","信頼性","セキュリティ"],"answer":[3],"why":["運用の自動化は関連するが、目的が「データを人から遠ざけること」であるため、別の柱に当たる。","性能に合わせた構成を扱う柱。データへの直接アクセスとは別の話。","障害への耐性を扱う柱。データへの直接アクセスとは別の話。","人をデータから遠ざけ、直接アクセスや手動処理を減らすのは、この柱の設計原則。"],"explain":"「人をデータから遠ざける」は、セキュリティの柱の設計原則。自動化という手段は運用の柱にも出てくるが、目的が機密データの保護にあるのでセキュリティに当たる。","point":"人をデータから遠ざける = セキュリティの柱。","diagram":null},{"id":"clf-d1-42","domain":1,"topic":"設計原則","type":"multi","stem":"AWS Well-Architected フレームワークの信頼性の柱の設計原則に当たるものはどれですか。","choices":["ピーク時の需要を推測して、容量を事前に確保する。","復旧手順をテストして、障害時の動作を事前に確認する。","すべての変更を手動で、本番環境へ直接適用する。","障害を検知して、自動的に復旧する仕組みを整える。","単一のインスタンスにすべての処理を集約する。"],"answer":[1,3],"why":["キャパシティの推測をやめるのが信頼性の設計原則。推測して確保する方法は不足や無駄を招く。","復旧手順を実際にテストして有効性を確かめるのは、信頼性の設計原則。","手動の直接適用はミスの原因になる。自動化された変更管理が望ましい。","障害から自動的に復旧する設計は、信頼性の設計原則。","単一障害点が生じ、信頼性が下がる。"],"explain":"信頼性の柱では、障害から自動的に復旧する、復旧手順をテストする、水平方向にスケールする、キャパシティの推測をやめる、変更を自動化で管理する、といった原則を挙げている。","point":"自動復旧・復旧手順のテスト・水平スケール = 信頼性の設計原則。","diagram":null},{"id":"clf-d1-43","domain":1,"topic":"設計原則","type":"multi","stem":"AWS Well-Architected フレームワークの 6 つの柱に含まれるものはどれですか。","choices":["持続可能性","拡張性","移植性","開発生産性","信頼性"],"answer":[0,4],"why":["6 つ目の柱として追加された。環境への影響を減らす観点。","柱には含まれない。スケールに関する設計は、信頼性やパフォーマンス効率の中で扱われる。","柱には含まれない。","柱には含まれない。","障害から復旧し、期待どおり機能し続ける観点。6 つの柱の 1 つ。"],"explain":"6 つの柱は、運用上の優秀性、セキュリティ、信頼性、パフォーマンス効率、コスト最適化、持続可能性。","point":"6 つ: 運用上の優秀性・セキュリティ・信頼性・パフォーマンス効率・コスト最適化・持続可能性。","diagram":null},{"id":"clf-d1-44","domain":1,"topic":"移行","type":"single","stem":"ある企業は、クラウド導入を計画するにあたり、AWS クラウド導入フレームワーク（AWS CAF）の利用を検討しています。AWS CAF を使用するメリットとして正しいものはどれですか。","choices":["ビジネスリスクを減らし、導入を計画的に進められる。","ワークロードを自動的に AWS へ移行するツールとして動作する。","AWS のすべてのサービスの料金を固定にできる。","オンプレミス環境の運用を AWS が肩代わりしてくれる。"],"answer":[0],"why":["6 つの観点から取り組むべき事項を整理し、リスクを減らしながら導入を計画できる。","CAF は移行を実行するツールではなく、導入計画のための指針。移行の実行には Application Migration Service などを使う。","CAF は料金を固定するものではない。","CAF は運用を肩代わりする仕組みではない。"],"explain":"AWS CAF は、クラウド導入に必要な能力を 6 つの観点で整理し、ビジネスリスクの低減、導入の加速、成果の向上に役立てるための指針。ツールではなく、考え方と手順の枠組み。","point":"AWS CAF = クラウド導入の計画の指針。ビジネスリスクの低減に役立つ。","diagram":null},{"id":"clf-d1-45","domain":1,"topic":"移行","type":"single","stem":"ある企業は、クラウド導入に向けて組織のスキル不足を把握し、トレーニングや組織変更の管理を進めたいと考えています。この内容を扱う AWS CAF の観点はどれですか。","choices":["ガバナンス","プラットフォーム","人材","運用"],"answer":[2],"why":["リスクや財務の管理、ポートフォリオの管理を扱う観点。スキルの習得とは別の話。","クラウド環境の設計と実装、ワークロードの移行を扱う観点。","組織のスキルの把握、トレーニング、組織変更の管理を扱う観点。","導入後のワークロードの運用を扱う観点。人材育成が主題ではない。"],"explain":"人材の観点は、クラウド導入に向けた組織の準備を扱い、スキルの把握、育成、組織文化や変更の管理が中心になる。","point":"人材の観点 = スキル・トレーニング・組織の変更管理。","diagram":null},{"id":"clf-d1-46","domain":1,"topic":"移行","type":"single","stem":"ある企業は、クラウド導入に伴うリスクを管理し、IT 投資や IT ポートフォリオを組織全体で管理する体制を整えたいと考えています。この内容を扱う AWS CAF の観点はどれですか。","choices":["人材","ガバナンス","運用","プラットフォーム"],"answer":[1],"why":["スキルの育成や組織変更の管理を扱う観点。","クラウドへの投資とリスクを管理し、ポートフォリオを組織の目標に合わせて管理するための観点。","ワークロードの稼働後の運用を扱う観点。","クラウド環境の設計と実装を扱う観点。"],"explain":"ガバナンスの観点は、クラウド投資の財務管理、リスク管理、ポートフォリオ管理など、組織の目標に沿ってクラウドを管理するための能力を扱う。","point":"ガバナンスの観点 = 投資・リスク・ポートフォリオの管理。","diagram":null},{"id":"clf-d1-47","domain":1,"topic":"移行","type":"single","stem":"ある企業は、クラウド環境を設計して構築し、ワークロードを移行するための技術的な能力を整理したいと考えています。この内容を扱う AWS CAF の観点はどれですか。","choices":["ビジネス","人材","ガバナンス","プラットフォーム"],"answer":[3],"why":["クラウド投資を事業の成果に結び付けることを扱う観点。","スキルの育成や組織変更の管理を扱う観点。","リスクや財務、ポートフォリオの管理を扱う観点。","クラウド環境の設計・実装やワークロードの移行など、技術的な能力を扱う観点。"],"explain":"プラットフォームの観点は、クラウド環境の設計・実装と、ワークロードの移行・モダナイズに必要な技術的な能力を扱う。","point":"プラットフォームの観点 = クラウド環境の設計・構築・移行。","diagram":null},{"id":"clf-d1-48","domain":1,"topic":"移行","type":"multi","stem":"AWS クラウド導入フレームワーク（AWS CAF）の 6 つの観点に含まれるものはどれですか。","choices":["ビジネス","開発","調達","運用","営業"],"answer":[0,3],"why":["クラウド投資を事業の成果に結び付けるための観点。6 つの観点の 1 つ。","観点には含まれない。","観点には含まれない。","ワークロードの運用を健全に保つための観点。6 つの観点の 1 つ。","観点には含まれない。"],"explain":"6 つの観点は、ビジネス、人材、ガバナンス、プラットフォーム、セキュリティ、運用。","point":"6 観点: ビジネス・人材・ガバナンス・プラットフォーム・セキュリティ・運用。","diagram":null},{"id":"clf-d1-49","domain":1,"topic":"移行","type":"single","stem":"ある企業は、期限が迫っているため、オンプレミスのサーバー上のアプリケーションを、変更を加えずにそのまま Amazon EC2 へ移行したいと考えています。この移行戦略はどれですか。","choices":["リホスト","リファクタリング","再購入","廃止"],"answer":[0],"why":["アプリケーションを変更せずに、そのままクラウドへ移す戦略。「リフトアンドシフト」とも呼ばれる。","アーキテクチャを大きく作り直す戦略。時間がかかるため、変更を加えない移行には当たらない。","別の製品（SaaS など）に置き換える戦略。","不要なアプリケーションを停止する戦略。移行は行わない。"],"explain":"決め手は「変更を加えずそのまま」。最短で移行でき、移行後に最適化を進められる。","point":"リホスト = 変更せずそのまま移す（リフトアンドシフト）。","diagram":null},{"id":"clf-d1-50","domain":1,"topic":"移行","type":"single","stem":"ある企業は、自社運用の MySQL データベースを Amazon RDS に移行して、アプリケーションの中核部分は変えずに、運用の負担を減らしたいと考えています。この移行戦略はどれですか。","choices":["リホスト","再購入","リプラットフォーム","保持"],"answer":[2],"why":["変更を加えずにそのまま移す戦略。マネージドサービスへの切り替えは含まない。","別の製品に置き換える戦略。","アプリケーションの中核は変えずに、一部をマネージドサービスなどに置き換えて利点を得る戦略。","移行せず、現在の環境に残す戦略。"],"explain":"リプラットフォームは、アーキテクチャの中核を変えずに、データベースを RDS に置き換えるなど、クラウドの利点を一部取り入れる。「リフト、調整、シフト」とも呼ばれる。","point":"リプラットフォーム = 中核は変えず、一部をマネージドサービスへ。","diagram":null},{"id":"clf-d1-51","domain":1,"topic":"移行","type":"single","stem":"ある企業は、モノリシックなアプリケーションを、AWS Lambda などを使ったサーバーレスのアーキテクチャに作り直し、スケーラビリティを高めたいと考えています。この移行戦略はどれですか。","choices":["リプラットフォーム","リファクタリング","リホスト","再購入"],"answer":[1],"why":["中核は変えずに一部を置き換える戦略。作り直しは含まない。","クラウドネイティブなアーキテクチャに作り直し、拡張性などの利点を最大限に得る戦略。","変更せずそのまま移す戦略。","別の製品に置き換える戦略。"],"explain":"リファクタリング（リアーキテクト）は、アプリケーションをクラウド向けに再設計する。費用と時間は大きいが、拡張性や俊敏性の利点が大きい。","point":"リファクタリング = クラウドネイティブに再設計する。","diagram":null},{"id":"clf-d1-52","domain":1,"topic":"移行","type":"single","stem":"ある企業は、自社で運用している顧客管理システムを、SaaS 製品の利用に切り替えることにしました。この移行戦略はどれですか。","choices":["リホスト","リファクタリング","保持","再購入"],"answer":[3],"why":["変更せずそのまま移す戦略。","アプリケーションを再設計する戦略。","移行せず現在の環境に残す戦略。","別の製品（SaaS など）に切り替える戦略。「ドロップアンドショップ」とも呼ばれる。"],"explain":"自社運用のアプリケーションを別の製品や SaaS に置き換えるのが再購入。ライセンスやデータ移行の検討が必要になる。","point":"再購入 = SaaS などの別製品へ置き換える。","diagram":null},{"id":"clf-d1-53","domain":1,"topic":"移行","type":"multi","stem":"今回の移行ではアプリケーションをクラウドへ移さない選択に当たる戦略はどれですか。","choices":["リホスト","保持","廃止","リファクタリング","再購入"],"answer":[1,2],"why":["クラウドへそのまま移す戦略。","移行せず、現在の環境に残す戦略。","使われていないアプリケーションを停止する戦略。移行の対象から外れる。","クラウドへ移して再設計する戦略。","別の製品へ置き換える戦略。"],"explain":"移行しない選択は、現在の環境に残す「保持」と、不要なものを停止する「廃止」。廃止は、運用コストの削減にもつながる。","point":"移行しない = 保持（残す）と廃止（停止する）。","diagram":null},{"id":"clf-d1-54","domain":1,"topic":"移行","type":"single","stem":"ある企業は、データの機密性・完全性・可用性を守るため、ID 管理、脅威の検出、インシデント対応の体制を整えたいと考えています。この内容を扱う AWS CAF の観点はどれですか。","choices":["セキュリティ","プラットフォーム","ガバナンス","人材"],"answer":[0],"why":["データやワークロードを守る能力（ID 管理、脅威検出、インシデント対応など）を扱う観点。","クラウド環境の設計・実装やワークロードの移行を扱う観点。","リスクや財務の管理を扱う観点。","スキルの育成や組織変更を扱う観点。"],"explain":"セキュリティの観点は、クラウド上のデータとワークロードを守るために必要な能力（ID とアクセス管理、検出、対応など）を扱う。","point":"セキュリティの観点 = ID 管理・脅威検出・インシデント対応。","diagram":null},{"id":"clf-d1-55","domain":1,"topic":"移行","type":"single","stem":"ある企業は、オンプレミスのサーバーをそのまま Amazon EC2 へリホストするため、サーバーを継続的にレプリケートし、切り替え（カットオーバー）の時間を短くしたいと考えています。この目的に使用できるサービスはどれですか。","choices":["AWS DataSync","AWS Database Migration Service","AWS Application Migration Service","AWS Storage Gateway"],"answer":[2],"why":["ファイルデータの転送を自動化するサービス。サーバー全体のリホストには使わない。","データベースを移行するサービス。サーバー全体の移行には使わない。","ソースサーバーを継続的にレプリケートし、EC2 へリホストするためのサービス。","オンプレミスからクラウドのストレージへ接続するサービス。サーバーの移行には使わない。"],"explain":"AWS Application Migration Service（MGN）は、物理・仮想サーバーを変更を加えずに EC2 へリホストするためのサービス。移行元のサーバーを継続的にレプリケートし、切り替え時間を短くできる。","point":"サーバーをそのまま EC2 へ = AWS Application Migration Service。","diagram":null},{"id":"clf-d1-56","domain":1,"topic":"移行","type":"multi","stem":"ある企業は、オンプレミスの Oracle Database を、Amazon Aurora PostgreSQL 互換エディションへ移行します。異なるデータベースエンジン間の移行に使用できるサービスまたは機能はどれですか。","choices":["AWS DataSync","AWS Application Migration Service","AWS DMS Schema Conversion","AWS Storage Gateway","AWS Database Migration Service"],"answer":[2,4],"why":["ファイルデータの転送を自動化するサービス。データベースの移行には使わない。","サーバーを EC2 へリホストするサービス。データベースエンジンの変換には使わない。","移行元のスキーマやコードを移行先のエンジンの形式へ変換する機能。異種のエンジン間の移行で使う。","オンプレミスからクラウドのストレージへ接続するサービス。データベースの移行には使わない。","データを移行元から移行先へ移すサービス。移行中も移行元を稼働させたまま使える。"],"explain":"異種のデータベース間の移行では、スキーマの変換（AWS DMS Schema Conversion）とデータの移行（AWS DMS）を組み合わせる。同じエンジン間の移行ならスキーマの変換は不要な場合が多い。","point":"異種 DB の移行 = DMS Schema Conversion（変換）+ DMS（データ移行）。","diagram":null},{"id":"clf-d1-57","domain":1,"topic":"移行","type":"single","stem":"ある企業は、オンプレミスの NFS ファイルサーバーにある大量のファイルを、ネットワーク経由で Amazon S3 へ、スケジュールを設定して自動で転送したいと考えています。この目的に使用できるサービスはどれですか。","choices":["AWS Storage Gateway","AWS DataSync","AWS Application Migration Service","AWS Database Migration Service"],"answer":[1],"why":["オンプレミスのアプリケーションからクラウドのストレージを使えるようにする。転送のスケジュール実行に特化したサービスではない。","オンプレミスのストレージと AWS のストレージ間で、データ転送を自動化し、スケジュールも設定できる。","サーバーをレプリケートして EC2 へ移行するサービス。ファイルの転送には使わない。","データベースを移行するサービス。ファイルの転送には使わない。"],"explain":"AWS DataSync は、オンプレミスと AWS のストレージ間のデータ移動を自動化し、スケジュール実行や整合性の検証ができる。Storage Gateway は、オンプレミスからクラウドのストレージを継続して使うための接続に使う。","point":"ファイルデータの一括・定期転送 = AWS DataSync。","diagram":null},{"id":"clf-d2-01","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、Amazon EC2 上でウェブアプリケーションを公開しています。AWS 責任共有モデルにおいて、お客様の責任はどれですか。","choices":["EC2 を実行する物理サーバーを交換して保守する。","ハイパーバイザーの脆弱性を見つけて修正する。","セキュリティグループで許可するポートを決める。","データセンターの空調設備と電源を保守する。"],"answer":[2],"why":["物理サーバーの保守・交換はハードウェアを管理する AWS の責任。","ハイパーバイザーを含む仮想化レイヤーは AWS が管理する。お客様は操作できない。","セキュリティグループはインスタンスへの通信を制御するお客様側の設定で、どのポートを開けるかはお客様が決める。","空調や電源などデータセンターの環境管理は AWS の責任。"],"explain":"EC2 のようなインフラストラクチャサービスでは、ゲスト OS から上のほか、セキュリティグループなどのネットワーク設定もお客様が担う。ハードウェア、ハイパーバイザー、データセンター施設は AWS が管理する。","point":"セキュリティグループの設定はお客様の責任。ハードウェア・仮想化・施設は AWS の責任。","diagram":null},{"id":"clf-d2-02","domain":2,"topic":"責任共有モデル","type":"single","stem":"ある企業は、EC2 上で自己管理していたデータベースを Amazon RDS に移行しました。移行後に AWS が担うようになる作
