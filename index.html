SSH のためにポート 22 も許可する必要がある。フローログは通信の記録であり、操作内容は記録できない。"],"explain":"「インバウンドのポートを開けない」「操作ログを記録」「インターネットへの経路なし」の 3 つがそろったら Systems Manager Session Manager を選ぶ。インターネットへの経路がないサブネットでは、Systems Manager、ssmmessages、ec2messages 用のインターフェイス型 VPC エンドポイントを作成する。接続は IAM で制御でき、セッションのログは S3 や CloudWatch Logs に保存できる。","point":"踏み台サーバーの代わりは Session Manager。ポート 22 が不要で、操作ログも残る。プライベートサブネットでは VPC エンドポイントを使う。","diagram":{"caption":"正解の構成: Session Manager でインバウンドなしに接続する","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"admin","label":"管理者","sub":"IAM で認証","kind":"client","c":0,"r":0},{"id":"ssm","label":"Session Manager","sub":"操作ログを記録","kind":"management","c":1,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"ssm / ssmmessages","kind":"network","c":2,"r":0},{"id":"ec2","label":"EC2","sub":"SSM エージェント","kind":"compute","c":3,"r":0}],"edges":[{"from":"admin","to":"ssm"},{"from":"ssm","to":"vpce","label":"HTTPS 443"},{"from":"vpce","to":"ec2"}]}},{"id":"d1-27","domain":1,"topic":"VPC","type":"single","stem":"ある企業は、VPC 内に 3 層構成のウェブアプリケーションを構築しています。Application Load Balancer (ALB)、Auto Scaling グループのアプリケーション層の Amazon EC2 インスタンス、データベース層の Amazon RDS で構成されています。アプリケーション層のインスタンスは頻繁に増減し、IP アドレスも変わります。セキュリティチームは、各層が直前の層からの通信だけを受け付けるようにし、インスタンスが増減してもルールの変更が不要であることを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各層のサブネットにネットワーク ACL を設定し、アプリケーション層のインスタンスの IP アドレスを個別に許可するインバウンドルールを追加する。Auto Scaling による増減のたびにルールを更新する。","すべての層に同じセキュリティグループを割り当て、そのセキュリティグループ自身を送信元とするインバウンドルールを追加する。","アプリケーション層とデータベース層のセキュリティグループで、VPC の CIDR ブロック全体からのインバウンドを許可する。ALB だけをパブリックサブネットに配置する。","ALB、アプリケーション層、データベース層に別々のセキュリティグループを作成する。アプリケーション層は ALB のセキュリティグループを、データベース層はアプリケーション層のセキュリティグループを送信元に指定してインバウンドを許可する。"],"answer":[3],"why":["ネットワーク ACL はサブネット単位でステートレスなため、インスタンスの増減に追従できない。IP アドレスの変更のたびにルールの更新が必要で、運用効率が悪い。","同じセキュリティグループの中では層の区別がなくなり、ALB からデータベースへ直接通信できるなど、直前の層だけに限定する要件を満たさない。","VPC 内のどのリソースからでも通信できてしまい、層ごとの制限にならない。","セキュリティグループは別のセキュリティグループを送信元に指定できる。インスタンスが増減しても、同じセキュリティグループが付いていれば自動的に許可されるため、ルールの変更は不要。"],"explain":"「直前の層からの通信だけ」「インスタンスの増減でもルール変更が不要」の決め手は、セキュリティグループの参照（送信元にセキュリティグループを指定）。セキュリティグループはステートフルで許可ルールだけを書く。ネットワーク ACL はサブネット単位のステートレスなフィルターで、特定の IP の拒否など補助的な用途に向く。","point":"層ごとの通信制御は、セキュリティグループを送信元に指定する。IP の拒否が必要なときだけネットワーク ACL を足す。","diagram":{"caption":"正解の構成: セキュリティグループを送信元に指定して層を分離する","cols":4,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":3,"h":1}],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"SG: alb-sg","kind":"network","c":1,"r":0},{"id":"app","label":"EC2 (ASG)","sub":"SG: 送信元 alb-sg","kind":"compute","c":2,"r":0},{"id":"rds","label":"RDS","sub":"SG: 送信元 app-sg","kind":"database","c":3,"r":0}],"edges":[{"from":"user","to":"alb","label":"HTTPS"},{"from":"alb","to":"app"},{"from":"app","to":"rds"}]}},{"id":"d1-28","domain":1,"topic":"S3","type":"single","stem":"ある企業は、Amazon S3 バケットに保存したレポートファイルを、ログインした利用者だけがダウンロードできるウェブアプリケーションを提供しています。バケットはパブリックアクセスをブロックしています。企業は、バケットポリシーを変更せずに、認証済みの利用者に 15 分間だけダウンロードを許可することを求めています。利用者は AWS アカウントも IAM ユーザーももっていません。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["利用者ごとに IAM ユーザーを作成し、レポートの GetObject だけを許可するポリシーをアタッチする。利用者にアクセスキーを配布する。","アプリケーションが利用者の認証を確認した後、アプリケーションの IAM ロールの認証情報で有効期限を 15 分に設定した署名付き URL を生成して利用者に返す。","バケットのブロックパブリックアクセスを無効にし、バケットポリシーですべてのプリンシパルに GetObject を許可する。オブジェクトのキーは推測されにくいランダムな文字列にする。","ダウンロードのたびに、アプリケーションがオブジェクトを別のパブリックバケットにコピーする。ライフサイクルルールで 1 日後にコピーを削除する。"],"answer":[1],"why":["利用者ごとの IAM ユーザーとアクセスキーの管理が必要で、運用負荷が大きい。有効期限を 15 分に限定することもできない。","署名付き URL は、URL を生成した IAM プリンシパルの権限で、有効期間中だけオブジェクトにアクセスできる。バケットポリシーの変更は不要で、AWS アカウントをもたない利用者にも渡せる。","バケット全体が公開され、パブリックアクセスをブロックする前提に反する。キーを推測しにくくしても、認証された利用者だけに限定したことにならない。","公開バケットが必要になり、コピーの処理と削除の管理も増える。有効期限が 15 分でなく最短 1 日になり、公開状態も避けられない。"],"explain":"「パブリックアクセスはブロックのまま」「一定時間だけ」「AWS アカウントをもたない利用者」の組み合わせは署名付き URL。アプリケーション側で認証した後、SDK で URL を生成して返せばよい。URL の有効期間は生成に使った認証情報の有効期間の範囲に収まる。","point":"非公開の S3 オブジェクトを一時的に渡すなら署名付き URL。有効期間を指定でき、権限は生成した IAM プリンシパルのもの。","diagram":{"caption":"正解の構成: 署名付き URL で非公開オブジェクトを一時的に渡す","cols":3,"rows":1,"groups":[],"nodes":[{"id":"app","label":"アプリケーション","sub":"IAM ロールで署名","kind":"compute","c":0,"r":0},{"id":"user","label":"利用者","sub":"認証済み","kind":"client","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"非公開","kind":"storage","c":2,"r":0}],"edges":[{"from":"app","to":"user","label":"署名付き URL"},{"from":"user","to":"s3","label":"15 分以内"}]}},{"id":"d1-29","domain":1,"topic":"S3","type":"single","stem":"ある企業は、AWS Organizations で 40 の AWS アカウントを管理しています。共有用の Amazon S3 バケットを 1 つ用意し、組織内のすべてのアカウントの IAM プリンシパルに読み取りを許可する必要があります。組織外のアカウントからはアクセスできないようにします。各アカウントの IAM ロールには、必要な ID ベースのポリシーが付与済みです。アカウントは頻繁に追加・削除されます。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["バケットポリシーのプリンシパルに 40 アカウントのルートをすべて列挙する。アカウントを追加・削除するたびにバケットポリシーを更新する。","バケットのアクセスコントロールリスト (ACL) で、各アカウントの正規ユーザー ID に読み取りを許可する。アカウントの追加・削除に合わせて ACL を更新する。","バケットポリシーのプリンシパルに「*」を指定し、aws:PrincipalOrgID 条件キーに組織 ID を指定して、GetObject と ListBucket を許可する。","バケットをパブリックに設定し、aws:SourceIp 条件で各アカウントの NAT ゲートウェイの Elastic IP アドレスを許可する。"],"answer":[2],"why":["動作はするが、アカウントの追加・削除のたびにポリシーの更新が必要で、運用負荷が大きい。ポリシーのサイズ上限にも近づきやすくなる。","ACL は新しい用途では非推奨で、アカウント単位の許可しかできない。アカウントの変更のたびに更新が必要になる。","aws:PrincipalOrgID を使えば、組織に属するアカウントのプリンシパルだけが許可される。アカウントが追加・削除されても、バケットポリシーの変更は不要。","パブリックなバケットは要件に反する。IP アドレスで組織内に限定する方法は、アカウントの変更への追従も難しい。"],"explain":"「組織内のすべてのアカウント」「アカウントが頻繁に増減」は aws:PrincipalOrgID のサイン。アカウントを列挙せず、組織 ID の条件だけでバケットポリシーを書ける。組織に新しく追加されたアカウントには自動で適用され、組織から外れたアカウントは自動で対象外になる。","point":"組織内の全アカウントに S3 を共有するなら、バケットポリシーの aws:PrincipalOrgID 条件。アカウントの列挙は不要。","diagram":null},{"id":"d1-30","domain":1,"topic":"ELB","type":"multi","stem":"ある企業は、Auto Scaling グループの Amazon EC2 インスタンスで実行するウェブアプリケーションを、Application Load Balancer (ALB) の背後で公開しようとしています。要件は次のとおりです。クライアントと ALB の間の通信を HTTPS で暗号化すること。証明書の更新作業を自動化すること。SQL インジェクションなどの一般的なウェブ攻撃を、ALB の位置で遮断すること。運用上のオーバーヘッドを最小限に抑えて、これらの要件を満たす手順の組み合わせはどれですか。","choices":["自己署名証明書を作成して ALB の HTTPS リスナーにインポートする。有効期限が近づいたら手動で新しい証明書に入れ替える。","ALB に HTTPS リスナーを追加し、AWS Certificate Manager (ACM) で発行した公開証明書を関連付ける。","各 EC2 インスタンスにホストベースのファイアウォールソフトウェアをインストールする。ウェブ攻撃のシグネチャは手動で更新する。","ALB のセキュリティグループでポート 443 だけを許可する。SQL インジェクションのパターンを含むリクエストは、セキュリティグループのルールで拒否する。","AWS WAF のウェブ ACL に SQL データベース向けの AWS マネージドルールグループを追加し、ALB に関連付ける。"],"answer":[1,4],"why":["自己署名証明書は更新の自動化ができず、手作業の入れ替えが必要になる。クライアントからも信頼されない。","ACM の公開証明書は ALB に関連付けでき、有効期間内に自動で更新される。HTTPS での暗号化と証明書更新の自動化を満たす。","ALB の位置での遮断にならず、各インスタンスでの導入と更新の作業が必要で、運用負荷が大きい。","セキュリティグループはポートや IP アドレスなどの接続元を制御するもので、リクエストの内容は検査できない。","AWS WAF のマネージドルールグループで、一般的な攻撃を遮断できる。ウェブ ACL は ALB に直接関連付けられ、ルールの保守も AWS 側で行われる。"],"explain":"要件は「HTTPS 化と証明書の自動更新」と「ALB でのウェブ攻撃の遮断」の 2 つ。前者は ACM の証明書を HTTPS リスナーに関連付ける。ACM は自動更新に対応する。後者は AWS WAF のウェブ ACL を ALB に関連付ける。セキュリティグループはリクエストの中身を見られない点に注意する。","point":"ALB の HTTPS は ACM 証明書、ウェブ攻撃対策は AWS WAF の関連付け。セキュリティグループはリクエストの内容を見ない。","diagram":{"caption":"正解の構成: ALB で ACM による HTTPS 終端と WAF を組み合わせる","cols":3,"rows":2,"groups":[],"nodes":[{"id":"client","label":"クライアント","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"HTTPS リスナー","kind":"network","c":1,"r":0},{"id":"ec2","label":"EC2 (ASG)","kind":"compute","c":2,"r":0},{"id":"waf","label":"AWS WAF","sub":"マネージドルール","kind":"security","c":1,"r":1},{"id":"acm","label":"ACM 証明書","sub":"自動更新","kind":"security","c":2,"r":1}],"edges":[{"from":"client","to":"alb","label":"HTTPS"},{"from":"alb","to":"ec2"},{"from":"waf","to":"alb","label":"関連付け","style":"dashed"},{"from":"acm","to":"alb","label":"証明書","style":"dashed"}]}},{"id":"d1-31","domain":1,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、VPC のプライベートサブネットにある Amazon RDS for MySQL データベースに、AWS Lambda 関数からアクセスしています。現在、データベースのパスワードは Lambda 関数の環境変数に平文で設定されています。セキュリティチームは、パスワードをコードや環境変数に含めないようにし、Lambda 関数がインターネットを経由せずにパスワードを取得することを求めています。プライベートサブネットには NAT ゲートウェイがありません。これらの要件を満たすソリューションはどれですか。","choices":["パスワードを AWS Secrets Manager のシークレットに保存する。Lambda 関数を VPC に接続し、実行ロールに secretsmanager:GetSecretValue を許可する。Secrets Manager 用のインターフェイス型 VPC エンドポイントを作成する。","パスワードを暗号化したファイルとして関数のデプロイパッケージに同梱する。関数の起動時に復号する処理をコードに追加する。","パスワードを Amazon S3 バケットのオブジェクトとして保存し、S3 のゲートウェイ型 VPC エンドポイント経由で取得する。バケットはパブリックアクセスをブロックする。","RDS インスタンスをパブリックアクセス可能に変更し、Lambda 関数を VPC の外で実行する。パスワードは Secrets Manager からインターネット経由で取得する。"],"answer":[0],"why":["Secrets Manager でパスワードをコードの外で管理でき、アクセスは実行ロールの IAM 権限で制御できる。VPC 内の Lambda は、インターフェイス型エンドポイント経由でインターネットを使わずに取得できる。","パスワードを変更するたびにデプロイが必要になり、復号用の鍵の管理も増える。コードに含めない要件を満たさず、一元管理もできない。","S3 はシークレットの管理を目的としたサービスではなく、パスワードの更新や取得の監査も別途考える必要がある。運用負荷も増える。","データベースをインターネットに公開することになり、セキュリティ要件に反する。Lambda をインターネット経由で動かす構成は、プライベートに接続する意図とも合わない。"],"explain":"「パスワードをコードや環境変数に含めない」はシークレット管理のサービスを使う合図。VPC に接続した Lambda 関数がインターネットを経由せずに Secrets Manager にアクセスするには、NAT ゲートウェイか Secrets Manager 用のインターフェイス型 VPC エンドポイントが必要で、NAT ゲートウェイがない本問では後者を選ぶ。実行ロールの IAM 権限でアクセスを制御し、関数のセキュリティグループから RDS への通信を許可する。","point":"Lambda から DB 認証情報を安全に使うなら、Secrets Manager ＋実行ロール。VPC 内ならインターフェイス型エンドポイントを使う。","diagram":{"caption":"正解の構成: VPC 内の Lambda が VPCE でシークレットを取得する","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":2}],"nodes":[{"id":"fn","label":"Lambda","sub":"実行ロールで許可","kind":"serverless","c":0,"r":0},{"id":"rds","label":"RDS for MySQL","sub":"SG で Lambda を許可","kind":"database","c":1,"r":0},{"id":"vpce","label":"Interface VPCE","sub":"Secrets Manager","kind":"network","c":0,"r":1},{"id":"sm","label":"Secrets Manager","sub":"DB の認証情報","kind":"security","c":2,"r":1}],"edges":[{"from":"fn","to":"rds","label":"MySQL"},{"from":"fn","to":"vpce"},{"from":"vpce","to":"sm","label":"AWS 内部"}]}},{"id":"d1-32","domain":1,"topic":"EC2","type":"multi","stem":"ある企業は、1 つのリージョンで多数の Amazon EC2 インスタンスを運用しています。セキュリティ監査で、次の 2 点が指摘されました。1 つ目は、インスタンスメタデータサービス (IMDS) に認証なしの単純な HTTP GET リクエストでアクセスでき、アプリケーションに SSRF の脆弱性があると IAM ロールの認証情報が漏えいするおそれがあることです。2 つ目は、新しく作成する Amazon EBS ボリュームの暗号化が開発者の設定に任されており、暗号化されていないボリュームが作成されるおそれがあることです。最小限の運用作業でこれらの指摘に対処するソリューションの組み合わせはどれですか。","choices":["インスタンスのメタデータオプションで HttpTokens を required に設定し、IMDSv2 を必須にする。","インスタンスのセキュリティグループで、IMDS のアドレス 169.254.169.254 へのアウトバウンド通信を拒否する。","対象のリージョンで、Amazon EBS の暗号化をデフォルトで有効にする。","EBS ボリュームを作成するときは暗号化を有効にするよう開発者に周知する。AWS Config で暗号化されていないボリュームを定期的に確認する。","EBS ボリュームの作成を検知する AWS Lambda 関数を作成し、暗号化されていないボリュームのスナップショットを暗号化コピーして元のボリュームを削除する。"],"answer":[0,2],"why":["IMDSv2 はセッショントークンを使う方式で、単純な GET リクエストが通らない。HttpTokens を required にすれば IMDSv1 が使えなくなり、SSRF による認証情報の窃取を防ぎやすくなる。","セキュリティグループはインスタンスと IMDS の間のトラフィック（リンクローカルアドレス）をフィルタリングしないため、この設定は効かない。","リージョン単位でデフォルト暗号化を有効にすると、新しく作成する EBS ボリュームとスナップショットのコピーが自動的に暗号化される。開発者の設定に依存しなくなる。","周知と事後の確認だけで、暗号化されていないボリュームが作成されること自体は防げない。","作成後に事後対応をする構成で、暗号化されていない期間が生じる。Lambda 関数の作成と保守の運用負荷も大きい。"],"explain":"IMDS の問題には IMDSv2 の必須化（HttpTokens=required）、EBS の暗号化の徹底にはリージョンごとのデフォルト暗号化が最小限の作業で済む。どちらも一度の設定で防止的に効く。セキュリティグループは IMDS 宛の通信に影響しない点に注意する。","point":"SSRF 対策は IMDSv2 の必須化、EBS の暗号化の徹底はリージョンのデフォルト暗号化。どちらも設定で防止できる。","diagram":null},{"id":"d1-33","domain":1,"topic":"KMS・暗号化","type":"single","stem":"ある金融サービス企業は、決済データを暗号化する AWS 上のアプリケーションを開発しています。コンプライアンス要件により、暗号鍵は自社専用のシングルテナントのハードウェアセキュリティモジュール (HSM) に保管し、鍵へのアクセスを管理するユーザーを自社だけで管理する必要があります。AWS の従業員が鍵素材にアクセスできないことも求められています。アプリケーションは PKCS#11 インターフェイスで HSM を利用します。これらの要件を満たすソリューションはどれですか。","choices":["AWS KMS で AWS マネージドキーを使用する。アプリケーションから GenerateDataKey API を呼び出してデータキーを取得する。","AWS KMS でカスタマーマネージドキーを作成し、キーポリシーでアプリケーションのロールだけにアクセスを許可する。","AWS Systems Manager Parameter Store の SecureString パラメータにキーを保存する。パラメータは AWS KMS のキーで暗号化する。","AWS CloudHSM クラスターを複数の AZ に作成し、アプリケーションに CloudHSM クライアントと PKCS#11 ライブラリを構成する。HSM のユーザーは自社で管理する。"],"answer":[3],"why":["AWS KMS は AWS が管理するマルチテナントのサービスで、専用の HSM を占有する要件を満たさない。AWS マネージドキーはポリシーの変更もできない。","カスタマーマネージドキーでもキーを保管する HSM はマルチテナントで、専用の HSM を自社だけで管理する要件を満たさない。PKCS#11 での利用もできない。","キーの保管場所が HSM ではなく、PKCS#11 での利用もできない。暗号化に使った KMS のキーの管理も AWS のサービスに依存する。","CloudHSM は専用のシングルテナントの HSM を提供し、HSM のユーザーと鍵は顧客だけが管理する。PKCS#11 に対応し、複数の AZ にクラスターを構成すれば可用性も確保できる。"],"explain":"「シングルテナントの専用 HSM」「鍵の管理は自社だけ」「PKCS#11」は CloudHSM を選ぶ決め手。KMS は管理が簡単で多くの AWS サービスと統合されているが、HSM は AWS が管理するマルチテナントの構成。独自の要件で専用 HSM が必要なときだけ CloudHSM を選ぶ。","point":"専用のシングルテナント HSM と、鍵の管理を顧客だけで行う要件は CloudHSM。それ以外は KMS で十分。","diagram":{"caption":"正解の構成: CloudHSM を複数 AZ に配置し、アプリから PKCS#11 で利用する","cols":3,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":1,"r":0,"w":1,"h":1},{"label":"AZ-c","kind":"az","c":1,"r":1,"w":1,"h":1}],"nodes":[{"id":"app","label":"アプリケーション","sub":"PKCS#11","kind":"compute","c":0,"r":0},{"id":"hsma","label":"CloudHSM","sub":"専用 HSM","kind":"security","c":1,"r":0},{"id":"hsmc","label":"CloudHSM","sub":"専用 HSM","kind":"security","c":1,"r":1}],"edges":[{"from":"app","to":"hsma","label":"暗号化操作"},{"from":"app","to":"hsmc"}]}},{"id":"d1-34","domain":1,"topic":"Cognito","type":"single","stem":"ある企業は、Application Load Balancer (ALB) の背後の Amazon EC2 インスタンスで社内向けウェブアプリケーションを実行しています。現在は、アプリケーションのコード内にログイン画面とパスワードを検証する処理があります。企業は、ユーザー認証の処理をアプリケーションから切り離し、Amazon Cognito ユーザープールのユーザーと、外部の SAML 2.0 ID プロバイダーのユーザーがサインインできるようにすることを求めています。アプリケーションコードの変更を最小限に抑えるソリューションはどれですか。","choices":["Amazon Cognito ID プールを作成し、認証されたユーザーに一時的な AWS 認証情報を発行する。アプリケーションは AWS SDK でその認証情報を使ってリソースへのアクセスを制御する。","ALB のリスナールールに authenticate-cognito アクションを設定し、ユーザープールを関連付ける。ユーザープールに SAML ID プロバイダーを追加する。認証済みのリクエストは、ユーザー情報を含む HTTP ヘッダーとともにターゲットに転送される。","ALB の前に Amazon API Gateway の REST API を配置し、AWS Lambda オーソライザーでトークンを検証する。アプリケーションからログイン画面の処理を削除する。","各 EC2 インスタンスに SAML のサービスプロバイダー用ソフトウェアをインストールし、認証処理をアプリケーションの代わりに実行させる。"],"answer":[1],"why":["ID プールは AWS のリソースにアクセスするための一時的な認証情報を発行するもので、ウェブアプリケーションのサインインを置き換えるものではない。アプリケーションの変更も大きい。","ALB が Cognito ユーザープールと連携してサインインを処理し、認証済みのリクエストだけをターゲットに転送する。SAML ID プロバイダーはユーザープールのフェデレーションで連携できる。アプリケーションはヘッダーを読むだけで済む。","構成が大きく変わり、Lambda オーソライザーの開発と保守も必要になる。ログイン画面を別に用意する必要もあり、変更が最小限にならない。","各インスタンスにソフトウェアの導入と更新が必要で、運用負荷が大きい。Cognito のユーザーを統合する要件も満たさない。"],"explain":"「認証をアプリケーションから切り離す」「Cognito ユーザープールと SAML」「コード変更を最小限に」は、ALB の認証アクション（authenticate-cognito）が決め手。ユーザープールが SAML などの外部 ID プロバイダーとフェデレーションして、ALB がサインインとトークンの検証を行う。ID プールは AWS への一時的な認証情報の発行用で、役割が異なる。","point":"ALB でアプリの認証を代行するなら、リスナーの authenticate-cognito アクション。外部 IdP はユーザープールにフェデレーションする。","diagram":{"caption":"正解の構成: ALB が Cognito ユーザープールで認証してから転送する","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"alb","label":"ALB","sub":"authenticate-cognito","kind":"network","c":1,"r":0},{"id":"app","label":"EC2","sub":"ユーザー情報ヘッダー","kind":"compute","c":2,"r":0},{"id":"pool","label":"ユーザープール","sub":"SAML IdP と連携","kind":"security","c":1,"r":1}],"edges":[{"from":"user","to":"alb","label":"HTTPS"},{"from":"alb","to":"pool","label":"サインイン","both":true},{"from":"alb","to":"app","label":"認証済みのみ"}]}},{"id":"d1-35","domain":1,"topic":"IAM","type":"single","stem":"ある企業は、AWS マネジメントコンソールにサインインする開発者に IAM ユーザーを使用しています。開発者は 200 人で、IAM グループで管理されています。セキュリティチームは、開発者が多要素認証 (MFA) を使ってサインインしていない場合に、自身の MFA デバイスの設定とパスワードの変更を除くすべての AWS 操作を拒否することを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["開発者全員に MFA デバイスの登録を依頼する。未登録のユーザーを AWS CloudTrail のログで毎週確認し、IAM ユーザーを手動で無効化する。","Amazon EventBridge ルールでコンソールのサインインイベントを検出する。MFA を使っていないユーザーのセッションを AWS Lambda 関数で終了させる。","IAM グループに、aws:MultiFactorAuthPresent が false のときは MFA の設定とパスワード変更以外の操作をすべて拒否するポリシーをアタッチする。条件には BoolIfExists を使う。","IAM アカウントのパスワードポリシーで MFA を必須にする。パスワードの有効期限も短く設定する。"],"answer":[2],"why":["事後確認と手作業の対応で、MFA なしの操作を防げない。200 人分の確認作業も継続的に発生する。","事後に検知して対応する仕組みで、サインインから終了までの間は操作できてしまう。関数の開発と保守の負荷もある。","ポリシーの条件キーで、MFA を使っていないセッションの操作を予防的に拒否できる。グループにアタッチするだけで全員に効き、MFA を登録するまで他の操作はできない。","IAM のパスワードポリシーには MFA を必須にする設定がなく、強制できない。"],"explain":"「MFA を使っていないときは拒否」は、aws:MultiFactorAuthPresent 条件キーによる Deny ポリシー。MFA を使っていない場合にはこのキーが存在しないこともあるため、BoolIfExists で条件を書く。MFA の登録や自分のパスワードの変更だけは例外として許可し、利用者が自分で MFA を設定できる状態を残す。","point":"MFA の強制は、aws:MultiFactorAuthPresent による Deny ポリシーを IAM グループにアタッチする。パスワードポリシーでは強制できない。","diagram":null},{"id":"d1-36","domain":1,"topic":"IAM","type":"single","stem":"ある企業の開発チームは、アプリケーション用の IAM ロールに、開発の初期に AdministratorAccess ポリシーを付与しました。アプリケーションは本番稼働に入りましたが、実際に使用している AWS のサービスと API は一部に限られています。AWS CloudTrail の証跡は有効になっています。セキュリティチームは、このロールの権限を実際の利用状況に基づく最小権限に絞り込むことを求めています。運用上のオーバーヘッドが最小限になるソリューションはどれですか。","choices":["開発者がアプリケーションのソースコードを調べ、呼び出している API をすべて洗い出す。その結果をもとに、IAM ポリシーを手作業で書き直す。","IAM Access Analyzer のポリシー生成機能を使い、CloudTrail のログからロールが実際に使用したアクションに基づくポリシーを生成する。内容を確認し、AdministratorAccess と置き換える。","AdministratorAccess を削除し、AWS マネージドポリシーの PowerUserAccess に置き換える。","ロールの信頼ポリシーを変更し、アプリケーションが動作する EC2 インスタンスだけがロールを引き受けられるようにする。"],"answer":[1],"why":["ソースコードからは動的に呼び出される API を見落としやすく、手作業の負荷も大きい。実際の利用状況に基づく絞り込みにならない。","IAM Access Analyzer は、CloudTrail のアクティビティから、実際に使われたアクションを含むポリシーのドラフトを生成する。内容を確認して置き換えるだけで、最小権限に近づけられる。","PowerUserAccess も広い権限（IAM 以外のほぼすべての操作）を許可するため、最小権限にならない。","信頼ポリシーはロールを誰が引き受けられるかを制御するもので、ロールが実行できる操作の範囲は変わらない。"],"explain":"「実際の利用状況に基づく最小権限」「CloudTrail が有効」から、IAM Access Analyzer のポリシー生成を選ぶ。指定した期間の CloudTrail ログを分析し、使用されたアクションをもとにポリシーを作成する。生成されたポリシーは、サービスやリソースの確認・調整をしてから適用する。","point":"実績に基づく最小権限は、Access Analyzer のポリシー生成（CloudTrail のログから作る）。信頼ポリシーは権限の範囲を変えない。","diagram":null},{"id":"d2-01","domain":2,"topic":"SQS・SNS","type":"multi","stem":"ある動画共有サービスは、アップロードされた動画のサムネイルを生成するために、Amazon SQS 標準キューと、Auto Scaling グループ内の Amazon EC2 インスタンスで実行されるワーカーを使用しています。1 件の処理には最大 4 分かかりますが、キューの可視性タイムアウトは既定値の 30 秒のままです。最近、同じ動画のサムネイルが複数のワーカーで重複して生成されています。また、破損した動画のメッセージが処理に失敗し続けてキューに残り、ワーカーの処理能力を浪費しています。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて両方の問題を解決する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["キューを FIFO キューとして作り直し、送信時のコンテンツベースの重複排除を有効にする。","キューの可視性タイムアウトを、1 件あたりの最大処理時間を上回る値に変更する。","キューのメッセージ受信待機時間を最大の 20 秒に設定し、ロングポーリングを有効にする。","デッドレターキューを作成し、リドライブポリシーで maxReceiveCount を 3 に設定する。","キューの配信遅延を 4 分に設定し、メッセージが受信可能になるまでの時間を延ばす。"],"answer":[1,3],"why":["FIFO キューの重複排除は、5 分間の重複排除間隔の中で同じメッセージが重複して送信されるのを防ぐ機能である。処理中に可視性タイムアウトが切れて再び受信される問題は解決せず、キューの作り直しやメッセージグループ ID の指定などアプリケーションの変更も必要になる。","受信されたメッセージは、可視性タイムアウトの間だけ他のワーカーから見えなくなる。処理時間より短いと処理の途中で別のワーカーが同じメッセージを受信してしまうため、最大処理時間より長くする。","ロングポーリングは空の応答を減らして無駄な API 呼び出しを抑える設定である。処理中のメッセージが再び見えるようになる問題や、失敗し続けるメッセージの問題は解決しない。","受信回数が maxReceiveCount を超えたメッセージはデッドレターキューに移されるため、処理できないメッセージがキューに残り続けることを防げる。移したメッセージは後から原因を調べられる。","配信遅延は、送信されたメッセージが最初に受信可能になるまでの時間を遅らせる設定である。受信後の処理中に再び見えるようになるまでの時間（可視性タイムアウト）は変わらない。"],"explain":"重複して処理される原因は、処理時間（最大 4 分）より可視性タイムアウト（30 秒）が短く、処理中のメッセージが再び見えるようになっていることにある。可視性タイムアウトを処理時間より長くすれば、処理中の再受信を防げる。失敗し続けるメッセージには、デッドレターキュー（DLQ）と maxReceiveCount を設定して一定回数で隔離する。どちらもキューの設定変更だけで済む。なお標準キューは「少なくとも 1 回」の配信のため、まれな重複に備えて処理を冪等にしておくとよい。","point":"可視性タイムアウトは処理時間より長くする。失敗し続けるメッセージは DLQ と maxReceiveCount で隔離する。","diagram":{"caption":"正解の構成: 可視性タイムアウトを延ばし、DLQ で失敗メッセージを隔離する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"up","label":"アップロード処理","sub":"メッセージ送信","kind":"compute","c":0,"r":0},{"id":"sqs","label":"SQS 標準キュー","sub":"可視性 5 分","kind":"integration","c":1,"r":0},{"id":"worker","label":"EC2 ワーカー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"s3","label":"Amazon S3","sub":"サムネイル保存","kind":"storage","c":3,"r":0},{"id":"dlq","label":"DLQ","sub":"maxReceiveCount=3","kind":"integration","c":1,"r":1}],"edges":[{"from":"up","to":"sqs"},{"from":"sqs","to":"worker","label":"受信・処理"},{"from":"worker","to":"s3"},{"from":"sqs","to":"dlq","label":"失敗の繰り返し","style":"dashed"}]}},{"id":"d2-02","domain":2,"topic":"SQS・SNS","type":"single","stem":"ある EC 事業者の受注システムは、注文が確定するたびに、在庫管理、配送手配、売上分析の 3 つのシステムの API を順番に呼び出して通知しています。いずれかのシステムが停止していると、注文の確定処理まで失敗します。この企業は、各システムが一時的に停止していても通知を失わず、復旧後に処理できるようにすることを求めています。また、配送手配システムには国内向けの注文だけを届け、今後通知先のシステムが増えても受注システムを変更せずに済むようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon SQS 標準キューを 1 つ作成し、受注システムからメッセージを送信する。3 つのシステムが同じキューをポーリングし、配送手配システムは国外向けの注文を読み飛ばす。","Amazon SNS トピックを作成し、3 つのシステムの HTTPS エンドポイントをサブスクライブする。配送手配システムのサブスクリプションにフィルターポリシーを設定する。","Amazon SNS トピックを作成し、システムごとの Amazon SQS キューをサブスクライブする。配送手配システム用のサブスクリプションにフィルターポリシーを設定する。","システムごとに Amazon SQS キューを作成し、受注システムから各キューにメッセージを送信する。国内向けの注文だけを配送手配システムのキューに送るよう受注システムで振り分ける。"],"answer":[2],"why":["1 つのキューのメッセージは、受信して削除したコンシューマーだけが処理する。3 つのシステムがそれぞれ全件を受け取ることはできない。","HTTPS エンドポイントへの配信は配信ポリシーの範囲でしか再試行されず、停止が長引くと通知が失われる。各システムが復旧後に自分のペースで取り出せるバッファがない。","SNS のファンアウトで各キューに同じ通知が届き、システムの停止中もキューがメッセージを保持する。フィルターポリシーで配送手配には国内向けだけを届けられ、通知先の追加はサブスクリプションを足すだけで済む。","停止中の通知はキューに残るが、宛先の振り分けを受注システムが持つため、通知先が増えるたびに受注システムの変更が必要になる。"],"explain":"「1 つのイベントを複数のシステムに届ける」「停止中も失わない」「送信側を変えずに通知先を増やす」がそろったら、SNS トピックから SQS キューへのファンアウトを選ぶ。SQS キューがシステムごとのバッファになり、各システムは復旧後にメッセージを取り出せる。宛先ごとの絞り込みは、サブスクリプションのフィルターポリシー（メッセージ属性またはメッセージ本文が対象）で行える。","point":"1 対多の通知は SNS → SQS のファンアウト。宛先ごとの絞り込みはサブスクリプションのフィルターポリシーで行う。","diagram":{"caption":"正解の構成: SNS から各システムの SQS キューへファンアウトする","cols":4,"rows":3,"groups":[],"nodes":[{"id":"order","label":"受注システム","sub":"通知を 1 回発行","kind":"compute","c":0,"r":1},{"id":"sns","label":"SNS トピック","sub":"ファンアウト","kind":"integration","c":1,"r":1},{"id":"q1","label":"在庫用キュー","sub":"Amazon SQS","kind":"integration","c":2,"r":0},{"id":"q2","label":"配送用キュー","sub":"フィルターで国内のみ","kind":"integration","c":2,"r":1},{"id":"q3","label":"分析用キュー","sub":"Amazon SQS","kind":"integration","c":2,"r":2},{"id":"s1","label":"在庫管理","kind":"compute","c":3,"r":0},{"id":"s2","label":"配送手配","kind":"compute","c":3,"r":1},{"id":"s3","label":"売上分析","kind":"compute","c":3,"r":2}],"edges":[{"from":"order","to":"sns"},{"from":"sns","to":"q1"},{"from":"sns","to":"q2"},{"from":"sns","to":"q3"},{"from":"q1","to":"s1"},{"from":"q2","to":"s2"},{"from":"q3","to":"s3"}]}},{"id":"d2-03","domain":2,"topic":"SQS・SNS","type":"single","stem":"あるポイントサービスの事業者は、会員ごとのポイント加算と減算のイベントを、Amazon SQS を経由して処理システムに渡しています。同じ会員のイベントは発生した順に処理しないと、残高の計算が誤ります。送信側のアプリケーションはネットワークエラーが発生すると同じイベントを再送することがあり、重複したイベントを処理してはなりません。会員数が多いため、異なる会員のイベントは並行して処理し、スループットを確保する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["SQS FIFO キューを作成する。メッセージグループ ID に会員 ID を、メッセージ重複排除 ID にイベント ID を設定してメッセージを送信する。","SQS FIFO キューを作成する。すべてのメッセージに同じメッセージグループ ID を設定し、キュー全体で送信された順序を保証する。","SQS 標準キューを作成する。メッセージ属性にイベントの発生時刻を設定し、受信側でメッセージを時刻順に並べ替えてから処理する。","SQS の代わりに Amazon Kinesis Data Streams を使用する。パーティションキーに会員 ID を設定し、シャード内の順序でイベントを処理する。"],"answer":[0],"why":["FIFO キューは同じメッセージグループ ID の中で順序を保ち、異なるグループは並行して処理できる。重複排除 ID が同じメッセージは重複排除間隔（5 分間）の中で 1 回しか受け付けられないため、再送による重複も防げる。","順序は保てるが、キュー全体が 1 つのグループになり、前のメッセージの処理が終わるまで次のメッセージを受信できない。異なる会員のイベントを並行して処理できず、スループットの要件を満たさない。","標準キューの順序はベストエフォートで、「少なくとも 1 回」の配信のため重複も起こりうる。どこまで待てば並べ替えられるかが決まらず、重複の検出も受信側で作り込む必要がある。","パーティションキーで会員ごとの順序は保てるが、送信側の再送で同じレコードが重複して書き込まれることがあり、それを排除する仕組みがない。重複したイベントを処理しない要件を満たさない。"],"explain":"「同じ会員の中では順序どおり」「異なる会員は並行」「重複を処理しない」がそろったら、FIFO キューのメッセージグループ ID と重複排除 ID を使う。順序を保つ単位（ここでは会員）をメッセージグループ ID にすると、グループ内の順序とグループ間の並列性を両立できる。重複排除 ID を送信側で固定の値（イベント ID）にしておけば、再送されたメッセージは重複排除間隔の中で破棄される。Kinesis Data Streams も順序は保てるが、重複の排除は受信側の仕事になる。","point":"FIFO キューはメッセージグループ ID が順序を保つ単位。グループを細かく分けるほど並列に処理でき、重複は重複排除 ID で防ぐ。","diagram":null},{"id":"d2-04","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、取引先から届く請求データを Amazon SQS キューに格納し、Auto Scaling グループ内の Amazon EC2 インスタンスで実行されるワーカーが 1 件ずつ処理しています。処理時間の大半は外部の与信 API の応答待ちで、CPU 使用率は負荷にかかわらず 20% 前後です。データの量は日によって大きく変動し、決まった周期はありません。ワーカー 1 台は 1 件を約 6 秒で処理でき、キューに入ったデータは 10 分以内に処理を完了する必要があります。ソリューションアーキテクトは、処理量に合わせてインスタンス数を自動的に調整する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループの平均 CPU 使用率を指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 60% に設定する。","Auto Scaling グループに予測スケーリングポリシーを作成し、過去の負荷の傾向から予測した需要に合わせて事前にインスタンスを起動する。","キューの ApproximateNumberOfMessagesVisible メトリクスをそのまま指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 100 に設定する。","キューのメッセージ数をインスタンス数で割ったインスタンスあたりのバックログを指標とするターゲット追跡スケーリングポリシーを作成し、目標値を 100 に設定する。"],"answer":[3],"why":["ワーカーは応答待ちが中心で CPU 使用率が負荷を反映しないため、キューにデータが溜まってもスケールアウトしない。","予測スケーリングは、日次や週次のように繰り返す負荷のパターンがある場合に向く。決まった周期がない負荷では予測が当たらない。","キューのメッセージ数はインスタンス数に比例して変化する指標ではないため、ターゲット追跡にそのまま使うと台数を適切に調整できない。AWS のドキュメントでも、台数で割ったバックログを使う方法が案内されている。","許容できるバックログ（10 分 ÷ 6 秒 = 1 台あたり 100 件）を目標値にすると、キューの溜まり具合に比例してインスタンス数が調整される。台数で割ることで、台数が増えたあとの過剰なスケールアウトも防げる。"],"explain":"SQS のワーカーを増減させる指標は、CPU ではなくキューの溜まり具合である。AWS が推奨するのは、キューのメッセージ数（ApproximateNumberOfMessagesVisible）を実行中のインスタンス数で割った「インスタンスあたりのバックログ」を指標にし、許容レイテンシー ÷ 1 件の処理時間で求めた値を目標にターゲット追跡する方法である。この指標はカスタムメトリクスとして発行するか、ターゲット追跡ポリシーのメトリクス計算で求める。メッセージ数をそのまま使う方法はひっかけになりやすいので注意する。","point":"SQS ワーカーのスケーリングは「メッセージ数 ÷ インスタンス数」でターゲット追跡する。目標値は許容レイテンシー ÷ 処理時間。","diagram":{"caption":"正解の構成: インスタンスあたりのバックログでワーカーを増減する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"partner","label":"取引先","sub":"請求データ","kind":"client","c":0,"r":0},{"id":"sqs","label":"SQS キュー","sub":"量は日ごとに変動","kind":"integration","c":1,"r":0},{"id":"worker","label":"EC2 ワーカー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"api","label":"与信 API","sub":"外部サービス","kind":"client","c":3,"r":0},{"id":"cw","label":"CloudWatch","sub":"バックログ/台","kind":"management","c":1,"r":1}],"edges":[{"from":"partner","to":"sqs"},{"from":"sqs","to":"worker","label":"受信"},{"from":"worker","to":"api","label":"応答待ち"},{"from":"sqs","to":"cw","label":"メッセージ数","style":"dashed"},{"from":"cw","to":"worker","label":"目標値 100"}]}},{"id":"d2-05","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある旅行予約サービスでは、1 件の予約ごとに「航空券の確保」「ホテルの確保」「決済」の 3 つの処理を順に実行します。各処理は AWS Lambda 関数として実装済みです。途中の処理が失敗した場合は、それまでに確保した航空券やホテルを取り消す必要があります。また、決済では外部の決済代行会社から確認の通知が届くまで、最大 24 時間待機することがあります。運用担当者は、各予約の処理状況を確認できる必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Step Functions の Express ワークフローを作成し、各関数を順に呼び出す。決済の確認はタスクトークンを使って待機し、失敗時は Catch で取り消し処理に進める。","AWS Step Functions の Standard ワークフローを作成し、各関数を順に呼び出す。決済の確認はタスクトークンを使って待機し、失敗時は Catch で取り消し処理に進める。","各 Lambda 関数の最後で次の関数を同期的に呼び出す。決済の確認は関数内でポーリングして待機し、失敗時は呼び出し元に例外を返して取り消し処理を実行する。","処理ごとに Amazon SQS キューを作成して Lambda 関数をつなぐ。予約ごとの状態を Amazon DynamoDB テーブルに記録し、失敗時は別の関数がテーブルを参照して取り消す。"],"answer":[1],"why":["Express ワークフローは 1 回の実行が最大 5 分までで、24 時間の待機はできない。タスクトークンによるコールバック（.waitForTaskToken）にも対応していない。","Standard ワークフローは最大 1 年まで実行でき、タスクトークンで外部からの通知を待てる。Catch で失敗時の取り消し処理に分岐でき、各実行の状態と履歴をコンソールで確認できる。","Lambda 関数の実行時間は最大 15 分のため、24 時間の待機はできない。失敗時の取り消しや処理状況の把握も独自に作り込む必要がある。","要件は満たせるが、予約ごとの状態管理、取り消しの制御、処理状況の確認の仕組みをすべて独自に作って運用することになり、運用効率が低い。"],"explain":"複数のステップの順序制御、失敗時の取り消し（補償処理）、外部からの通知待ち、実行状況の可視化をまとめて任せるなら AWS Step Functions を使う。「最大 24 時間待機」が決め手で、実行時間が最大 5 分の Express ワークフローではなく、最大 1 年まで実行できる Standard ワークフローを選ぶ。外部の処理の完了を待つにはタスクトークンを使うコールバックパターンを使い、通知を受けた側が SendTaskSuccess を呼んでワークフローを再開させる。","point":"長時間の実行や通知待ちは Standard、短時間で大量のイベント処理は Express。失敗時の取り消しは Catch で補償処理へ進める。","diagram":null},{"id":"d2-06","domain":2,"topic":"EventBridge・Step Functions","type":"single","stem":"ある小売企業の受注サービスは、「注文作成」「注文キャンセル」などのイベントを発行しています。この企業は、イベントの内容に応じて複数の宛先に振り分けることを計画しています。一定額以上の注文は AWS Step Functions の審査ワークフローを開始し、キャンセルは AWS Lambda 関数で在庫を戻し、すべての注文イベントを物流会社の外部 HTTPS API にも送信します。物流会社の API には 1 秒あたりの呼び出し回数に上限があります。今後も宛先の追加が見込まれます。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EventBridge のカスタムイベントバスと、イベントパターンで振り分けるルールを作成する。ターゲットに Step Functions、Lambda 関数、呼び出しレートを設定した API 送信先を指定する。","Amazon SNS トピックと、メッセージ本文にフィルターポリシーを設定したサブスクリプションを作成する。サブスクライバーとして Step Functions、Lambda 関数、外部の HTTPS エンドポイントを指定する。","Amazon SQS キューと、キューをイベントソースとする Lambda 関数を作成する。関数内でイベントの種類と金額を判定し、審査のワークフロー、在庫の関数、外部の API をそれぞれ呼び出す。","Amazon Kinesis Data Streams のストリームと、宛先ごとのコンシューマーアプリケーションを作成する。各コンシューマーが必要なイベントだけを選び、それぞれの宛先に渡す。"],"answer":[0],"why":["イベントパターンで内容（イベントの種類や金額）に応じて振り分けられ、Step Functions と Lambda は直接ターゲットにできる。外部の HTTPS API は API 送信先として登録でき、1 秒あたりの呼び出しレートの上限も設定できる。","SNS のサブスクリプションのプロトコルに Step Functions は含まれず、ワークフローを開始するには Lambda 関数などの中継処理を独自に作る必要がある。","要件は満たせるが、振り分けのロジック、各宛先の呼び出し、外部 API への呼び出しレートの制御をすべて独自のコードで作って運用することになる。","各コンシューマーでイベントを選別して宛先を呼び出す処理を独自に作る必要があり、宛先が増えるたびにアプリケーションの開発と運用が増える。"],"explain":"「イベントの内容で複数の宛先に振り分ける」「宛先の追加が見込まれる」「運用効率」がそろったら Amazon EventBridge のルールを使う。イベントパターンではイベントの種類や数値の範囲を条件にでき、1 つのルールに複数のターゲットを設定できる。外部の HTTPS API は API 送信先（API destinations）として登録すれば、認証情報の付与や呼び出しレートの制限も EventBridge に任せられる。SNS もフィルターポリシーで振り分けられるが、Step Functions を直接サブスクライブできない点が決め手になる。","point":"イベントを内容で振り分けるなら EventBridge のルール。外部 API への送信は API 送信先を使い、呼び出しレートも制限できる。","diagram":null},{"id":"d2-07","domain":2,"topic":"ELB","type":"single","stem":"ある IoT 機器メーカーは、数十万台の機器から独自プロトコルの UDP パケットでテレメトリを受信するサーバー群を、Amazon EC2 で構築しています。受信サーバーは複数の AZ に分散し、Auto Scaling で台数を自動的に増減させます。顧客の工場のファイアウォールは通信先を IP アドレスで許可する方式のため、機器の接続先の IP アドレスは、サーバーの台数が変わっても変わらないようにする必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Application Load Balancer を作成し、UDP のリスナーを設定する。受信サーバーの Auto Scaling グループをターゲットグループに登録する。","Gateway Load Balancer を作成し、受信サーバーの Auto Scaling グループをターゲットグループに登録する。機器からのパケットを GENEVE で受け渡す。","Network Load Balancer を作成し、AZ ごとに Elastic IP アドレスを割り当てる。UDP のリスナーで受信サーバーのターゲットグループに転送する。","受信サーバーの起動時に Elastic IP アドレスを割り当てる。Amazon Route 53 の複数値回答ルーティングで、正常なサーバーの IP アドレスを返す。"],"answer":[2],"why":["ALB はレイヤー 7 で HTTP・HTTPS を扱うロードバランサーで、UDP のリスナーは作成できない。ALB の IP アドレスも固定されない。","GWLB はファイアウォールなどの仮想アプライアンスにトラフィックを透過的に通すためのもので、クライアントが直接接続するアプリケーションの入口には使わない。","NLB はレイヤー 4 で TCP・UDP を扱い、AZ ごとに Elastic IP アドレスを割り当てられる。背後のサーバーが増減しても、機器から見える IP アドレスは変わらない。","サーバーが増減するたびに返す IP アドレスの組み合わせが変わり、工場のファイアウォールの許可設定を更新し続ける必要がある。"],"explain":"「UDP」「固定の IP アドレス」が決め手で、NLB を選ぶ。NLB はレイヤー 4 のロードバランサーで TCP・UDP・TLS を扱え、各 AZ のサブネットに Elastic IP アドレスを割り当てられる。ALB は HTTP・HTTPS 用で IP アドレスが変わりうるため、IP アドレスで許可させる用途には向かない。GWLB はセキュリティアプライアンスを負荷分散するためのものである。","point":"UDP や固定 IP が要るなら NLB（AZ ごとに EIP）。HTTP の内容で振り分けるなら ALB、アプライアンスの負荷分散は GWLB。","diagram":{"caption":"正解の構成: NLB に AZ ごとの Elastic IP を割り当て、UDP で転送する","cols":3,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":1,"r":0,"w":2,"h":2},{"label":"AZ a","kind":"az","c":1,"r":0,"w":2,"h":1},{"label":"AZ b","kind":"az","c":1,"r":1,"w":2,"h":1}],"nodes":[{"id":"dev","label":"IoT 機器","sub":"固定 IP を許可","kind":"client","c":0,"r":0},{"id":"nlba","label":"NLB","sub":"Elastic IP（AZ a）","kind":"network","c":1,"r":0},{"id":"nlbb","label":"NLB","sub":"Elastic IP（AZ b）","kind":"network","c":1,"r":1},{"id":"srva","label":"受信サーバー","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"srvb","label":"受信サーバー","sub":"Auto Scaling","kind":"compute","c":2,"r":1}],"edges":[{"from":"dev","to":"nlba","label":"UDP"},{"from":"dev","to":"nlbb","label":"UDP"},{"from":"nlba","to":"srva"},{"from":"nlbb","to":"srvb"}]}},{"id":"d2-08","domain":2,"topic":"API Gateway","type":"single","stem":"ある自治体向けのアンケートサービスは、モバイルアプリから送信された回答を Amazon API Gateway と AWS Lambda で受け付け、Amazon RDS for MySQL に書き込んでいます。テレビ番組で紹介された直後など、送信が短時間に集中すると、データベースの接続数が上限に達して書き込みが失敗し、回答が失われています。回答はすぐにデータベースに反映されなくてもかまいませんが、1 件も失ってはなりません。また、アプリには送信直後に受付完了を返す必要があります。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["API Gateway の使用量プランでスロットリングの上限を設定する。上限を超えて拒否された送信は、アプリ側で時間をおいて再送させる。","Lambda 関数のプロビジョニングされた同時実行を増やす。送信が集中しても関数がすぐに起動し、データベースに書き込めるようにする。","RDS の DB インスタンスクラスを大きくし、max_connections の値を引き上げる。送信が集中しても、データベースの接続数が上限に達しないようにする。","API Gateway から Amazon SQS キューにメッセージを送信する統合を設定する。キューを読む Lambda 関数の同時実行数を制限して書き込む。"],"answer":[3],"why":["上限を超えた送信はエラー（429）で拒否され、再送はアプリ任せになる。再送の前にアプリが終了されると回答が失われ、1 件も失わない要件を満たせない。","同時に動く関数が増えるほどデータベースへの接続も増え、接続数が上限に達する問題がかえって悪化する。","接続数の上限は上がるが、集中の規模によっては再び上限に達して回答を失う可能性が残る。ピークに合わせた大きなインスタンスを常に動かすため、コストも高い。","SQS キューが集中した送信を受け止めるバッファになり、API Gateway はキューへの送信が成功した時点で応答を返せる。キューを読む Lambda 関数の同時実行数を絞れば、データベースの接続数を一定以下に保てる。"],"explain":"「書き込みが短時間に集中する」「すぐに反映されなくてよい」「1 件も失わない」がそろったら、間に SQS キューを挟んで負荷を平準化する。API Gateway は AWS のサービス統合で SQS に直接メッセージを送れるため、受付完了をすぐに返せる。後段の Lambda 関数は、SQS のイベントソースマッピングの最大同時実行数（または予約済み同時実行数）で並列度を抑え、データベースが処理できるペースで書き込む。データベースをピークに合わせて大きくする方法は、コストが高いうえに上限の問題も残る。","point":"急増する書き込みは SQS で受け止めて平準化する。後段の並列度を絞れば、DB の接続数を抑えられる。","diagram":{"caption":"正解の構成: SQS で送信の集中を受け止め、一定のペースで書き込む","cols":5,"rows":1,"groups":[],"nodes":[{"id":"app","label":"モバイルアプリ","sub":"回答を送信","kind":"client","c":0,"r":0},{"id":"apigw","label":"API Gateway","sub":"SQS に直接統合","kind":"network","c":1,"r":0},{"id":"sqs","label":"SQS キュー","sub":"バッファ","kind":"integration","c":2,"r":0},{"id":"fn","label":"Lambda","sub":"同時実行数を制限","kind":"serverless","c":3,"r":0},{"id":"rds","label":"RDS for MySQL","sub":"接続数を抑える","kind":"database","c":4,"r":0}],"edges":[{"from":"app","to":"apigw","label":"すぐに受付完了"},{"from":"apigw","to":"sqs"},{"from":"sqs","to":"fn","label":"ポーリング"},{"from":"fn","to":"rds"}]}},{"id":"d2-09","domain":2,"topic":"コンテナ","type":"single","stem":"ある企業は、1 台の大きな Amazon EC2 インスタンスで実行しているモノリシックな Web アプリケーションを、「商品」「カート」「会員」の 3 つのマイクロサービスに分割し、それぞれをコンテナイメージにしました。サービスごとに負荷の高い時間帯が異なるため、独立してスケールさせる必要があります。また、サーバーやクラスターのノードへのパッチ適用などの管理は行いたくありません。クライアントは 1 つのドメイン名でアクセスし、URL のパスで各サービスに振り分けられます。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon EKS クラスターを作成し、セルフマネージド型のノードグループに各サービスをデプロイする。Network Load Balancer で各サービスを公開する。","サービスごとに AWS Fargate で実行する Amazon ECS サービスを作成し、それぞれに Auto Scaling を設定する。Application Load Balancer のパスベースのルーティングで振り分ける。","3 つのコンテナを 1 つの Amazon ECS タスク定義にまとめ、AWS Fargate で実行する。Application Load Balancer のパスベースのルーティングで各コンテナに振り分ける。","EC2 起動タイプの Amazon ECS クラスターを作成し、サービスごとに ECS サービスと Auto Scaling を設定する。Application Load Balancer のパスベースのルーティングで各サービスに振り分ける。"],"answer":[1],"why":["セルフマネージド型のノードは、EC2 インスタンスの OS の更新などを利用者が管理する。NLB はレイヤー 4 のため、URL のパスで振り分けることもできない。","Fargate ならノードの管理が不要で、ECS サービスごとにタスク数を増減できる。ALB のリスナールールで、パスごとに別のターゲットグループ（ECS サービス）へ振り分けられる。","1 つのタスクにまとめると、3 つのコンテナは常に同じ数ずつ起動する。サービスごとに独立してスケールさせる要件を満たせない。","サービスごとのスケーリングとパスでの振り分けはできるが、コンテナインスタンス（EC2）の OS へのパッチ適用などを利用者が管理する必要があり、要件に合わない。"],"explain":"「サービスごとに独立してスケール」「ノードを管理しない」「パスで振り分け」が決め手になる。ECS のサービスをマイクロサービスごとに作れば、それぞれに Application Auto Scaling のポリシーを設定できる。Fargate で実行すれば、サーバーの OS の管理は不要になる。パスでの振り分けはレイヤー 7 の ALB のリスナールールで行い、転送先を各サービスのターゲットグループにする。EC2 起動タイプは機能面の要件は満たすが、ノード管理が残る点で外れる。","point":"サーバー管理なしでコンテナを動かすなら Fargate。独立してスケールさせる単位ごとに ECS サービスを分け、ALB のパスで振り分ける。","diagram":{"caption":"正解の構成: ALB のパスで振り分け、ECS サービスごとにスケールする","cols":3,"rows":3,"groups":[{"label":"ECS クラスター（Fargate）","kind":"generic","c":2,"r":0,"w":1,"h":3}],"nodes":[{"id":"client","label":"クライアント","sub":"1 つのドメイン名","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"パスベースの振り分け","kind":"network","c":1,"r":1},{"id":"svcp","label":"商品サービス","sub":"Auto Scaling","kind":"container","c":2,"r":0},{"id":"svcc","label":"カートサービス","sub":"Auto Scaling","kind":"container","c":2,"r":1},{"id":"svcm","label":"会員サービス","sub":"Auto Scaling","kind":"container","c":2,"r":2}],"edges":[{"from":"client","to":"alb"},{"from":"alb","to":"svcp","label":"/products"},{"from":"alb","to":"svcc","label":"/cart"},{"from":"alb","to":"svcm","label":"/members"}]}},{"id":"d2-10","domain":2,"topic":"ElastiCache","type":"multi","stem":"ある企業の Web アプリケーションは、Application Load Balancer の背後にある Auto Scaling グループの Amazon EC2 インスタンスで実行されています。ログイン中のユーザーのセッション情報は各インスタンスのメモリに保存され、ALB のスティッキーセッションが有効になっています。ユーザーがアップロードした画像は、リクエストを受け付けたインスタンスの EBS ボリュームに保存されています。スケールインや障害でインスタンスが終了するたびに、ユーザーがログアウトされたり、画像が表示されなくなったりします。ソリューションアーキテクトは、アプリケーションをステートレスにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["セッション情報を Amazon ElastiCache に保存するようにアプリケーションを変更し、すべてのインスタンスから参照する。","ALB のスティッキーセッションの Cookie の有効期間を延ばし、同じユーザーを同じインスタンスに送り続けるようにする。","Auto Scaling グループでスケールイン保護を有効にし、セッションを持つインスタンスがスケールインで終了しないようにする。","画像を保存した EBS ボリュームのスナップショットを 1 時間ごとに作成し、新しいインスタンスの起動時に復元する。","アップロードされた画像を Amazon S3 バケットに保存するようにアプリケーションを変更し、S3 から読み出す。"],"answer":[0,4],"why":["セッション情報をインスタンスの外のインメモリのデータストアに置くと、どのインスタンスがリクエストを受けても同じセッションを使える。インスタンスが終了してもセッションは失われない。","接続先が固定されるだけで、セッション情報は引き続きインスタンスのメモリにある。そのインスタンスが終了すればログアウトされる問題は残る。","スケールインで終了しなくなるだけで、障害によるインスタンスの終了は防げない。不要なインスタンスが残り続けてコストも増える。","スナップショットの作成後に保存された画像は失われ、ほかのインスタンスが受け付けた画像は見えないままである。","画像をインスタンスの外の S3 に置けば、どのインスタンスからも同じ画像を読み出せ、インスタンスが終了しても画像は残る。"],"explain":"ステートレスにするとは、インスタンスに状態（セッションやファイル）を持たせず、外部のサービスに置くことである。セッションのように頻繁に読み書きする小さなデータは ElastiCache（または DynamoDB）に、画像のようなファイルは S3 に置く。そうすればスティッキーセッションも不要になり、Auto Scaling が自由にインスタンスを追加・終了できる。スティッキーセッションやスケールイン保護は、状態がインスタンスに残ったままなので根本的な解決にならない。","point":"ステートレス化はセッションを ElastiCache・DynamoDB へ、ファイルを S3・EFS へ外部化する。スティッキーセッションは根本的な解決にならない。","diagram":null},{"id":"d2-11","domain":2,"topic":"RDS・Aurora","type":"multi","stem":"ある企業の業務システムは、シングル AZ の Amazon RDS for PostgreSQL DB インスタンスを使用しています。この企業は 2 つの課題を解決したいと考えています。1 つ目は、AZ の障害時にデータを失わずに自動でフェイルオーバーし、アプリケーションの接続先エンドポイントを変更せずに済むようにすることです。2 つ目は、営業時間中に実行される重い集計クエリがオンライン処理を遅くしているため、集計クエリの負荷をオンライン処理から切り離すことです。集計結果は数秒程度の遅延を許容します。これらの要件を満たす手順の組み合わせはどれですか。","choices":["DB インスタンスを Multi-AZ 配置に変更し、集計クエリの接続先をスタンバイインスタンスに変更する。","別のリージョンにクロスリージョンリードレプリカを作成し、AZ の障害時はレプリカを手動で昇格させる。","DB インスタンスを Multi-AZ 配置に変更し、別の AZ に同期レプリケーションされるスタンバイを作成する。","自動バックアップの保持期間を延ばし、AZ の障害時はポイントインタイムリカバリで別の AZ に復元する。","同じリージョンにリードレプリカを作成し、集計クエリの接続先をリードレプリカのエンドポイントに変更する。"],"answer":[2,4],"why":["Multi-AZ の DB インスタンス配置のスタンバイはフェイルオーバー専用で、読み取りには使えない。集計クエリを接続することはできない。","非同期レプリケーションのため直前のデータを失う可能性があり、昇格も接続先の切り替えも手動になる。","スタンバイに同期でレプリケーションされるためデータを失わず、障害時は自動でフェイルオーバーする。エンドポイントの DNS 名は変わらないため、アプリケーションの接続先を変える必要がない。","復元には時間がかかり、新しい DB インスタンスのエンドポイントに接続先を変える必要がある。最新の復元可能時刻より後のデータも失われる。","リードレプリカは非同期で複製されるが、数秒の遅延を許容できる集計クエリには十分である。読み取りの負荷をプライマリから切り離せる。"],"explain":"高可用性（自動フェイルオーバー・データ損失なし）は Multi-AZ 配置、読み取りの負荷分散はリードレプリカ、と役割を分けて考える。Multi-AZ の DB インスタンス配置ではスタンバイに同期レプリケーションされ、障害時はエンドポイントの DNS が新しいプライマリを指すため、アプリケーションの変更は要らない。ただしスタンバイは読み取りに使えないので、集計クエリの切り離しにはリードレプリカを別に作る。なお、読み取り可能なスタンバイを 2 つ持つ Multi-AZ DB クラスター配置を使う方法もある。","point":"Multi-AZ は可用性のため（DB インスタンス配置のスタンバイは読めない）、リードレプリカは読み取りの分散のため。目的で使い分ける。","diagram":{"caption":"正解の構成: Multi-AZ で自動フェイルオーバー、集計はリードレプリカへ","cols":3,"rows":2,"groups":[{"label":"AZ a","kind":"az","c":1,"r":0,"w":1,"h":2},{"label":"AZ b","kind":"az","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"online","label":"オンライン処理","sub":"接続先は不変","kind":"compute","c":0,"r":0},{"id":"report","label":"集計処理","sub":"数秒の遅延は許容","kind":"compute","c":0,"r":1},{"id":"primary","label":"プライマリ","sub":"RDS PostgreSQL","kind":"database","c":1,"r":0},{"id":"replica","label":"リードレプリカ","sub":"集計専用","kind":"database","c":1,"r":1},{"id":"standby","label":"スタンバイ","sub":"読み取り不可","kind":"database","c":2,"r":0}],"edges":[{"from":"online","to":"primary"},{"from":"report","to":"replica"},{"from":"primary","to":"standby","label":"同期で複製","style":"dashed"},{"from":"primary","to":"replica","label":"非同期で複製","style":"dashed"}]}},{"id":"d2-12","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある企業は、Amazon API Gateway と AWS Lambda で構成した API から、Amazon Aurora MySQL DB クラスターに接続しています。アクセスが急増すると Lambda 関数の同時実行数が増え、データベースへの接続が大量に開かれて、接続数の上限エラーが発生します。また、Aurora のフェイルオーバー時には、DNS レコードの切り替えを待つ間、アプリケーションのエラーが続きます。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて両方の問題を軽減する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Amazon RDS Proxy を作成し、DB クラスターをターゲットとして登録する。Lambda 関数の接続先をプロキシのエンドポイントに変更する。","DB パラメータグループで max_connections の値を引き上げる。あわせて、ライターの DB インスタンスクラスを大きくして接続の増加に備える。","Aurora レプリカを追加する。Lambda 関数の接続先をクラスターのリーダーエンドポイントに変更し、接続を分散させる。","Lambda 関数の予約済み同時実行数を小さく設定する。データベースに同時に接続する関数の数を一定以下に抑える。"],"answer":[0],"why":["RDS Proxy は接続をプールし、多数の関数からの接続を少数のデータベース接続にまとめる。フェイルオーバー時もプロキシが新しいライターへの接続に切り替えるため、DNS の切り替えを待たずに済み、エラーの時間を短くできる。","接続数の上限は上がるが、同時実行数がさらに増えれば同じ問題が起きる。フェイルオーバー時の DNS の切り替え待ちも解決せず、コストも上がる。","リーダーエンドポイントは読み取り専用で、書き込みを含む API の処理には使えない。フェイルオーバー時の問題も解決しない。","同時実行数の上限を超えたリクエストはスロットリングされ、API のエラーが増える。フェイルオーバー時の問題も解決しない。"],"explain":"Lambda のように短時間に大量の接続を開くアプリケーションと RDS・Aurora の組み合わせでは、Amazon RDS Proxy で接続をプールするのが定石である。アプリケーションは接続先をプロキシのエンドポイントに変えるだけでよい。RDS Proxy はデータベースのフェイルオーバーを検知して新しいライターに接続し直すため、クライアントは DNS のキャッシュの更新を待たずに済み、フェイルオーバーの影響時間を短くできる。","point":"Lambda から RDS・Aurora への接続が多すぎるなら RDS Proxy。フェイルオーバーの影響時間の短縮にも効く。","diagram":{"caption":"正解の構成: RDS Proxy で接続をプールし、フェイルオーバーにも追従する","cols":4,"rows":2,"groups":[],"nodes":[{"id":"apigw","label":"API Gateway","kind":"network","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"同時実行が急増","kind":"serverless","c":1,"r":0},{"id":"proxy","label":"RDS Proxy","sub":"接続プール","kind":"database","c":2,"r":0},{"id":"writer","label":"Aurora ライター","sub":"Aurora MySQL","kind":"database","c":3,"r":0},{"id":"replica","label":"Aurora レプリカ","sub":"フェイルオーバー先","kind":"database","c":3,"r":1}],"edges":[{"from":"apigw","to":"fn"},{"from":"fn","to":"proxy","label":"多数の接続"},{"from":"proxy","to":"writer","label":"少数の接続"},{"from":"proxy","to":"replica","label":"障害時に切替","style":"dashed"}]}},{"id":"d2-13","domain":2,"topic":"RDS・Aurora","type":"single","stem":"ある金融サービス企業は、1 つのリージョンで Amazon Aurora PostgreSQL DB クラスターを運用しています。事業継続計画の見直しにより、リージョン全体の障害に備えて、別のリージョンで業務を再開できるようにすることになりました。RPO は数秒、RTO は数分である必要があります。また、平常時は別のリージョンにある拠点から、参照系の処理を低レイテンシーで実行したいと考えています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Backup で DB クラスターのスナップショットを 1 時間ごとに作成し、別のリージョンにコピーする。障害時はコピーしたスナップショットから復元する。","同じリージョン内の別の AZ に Aurora レプリカを追加し、フェイルオーバーの優先順位を最も高く設定する。障害時はレプリカを自動的に昇格させる。","AWS Database Migration Service で、別のリージョンの Aurora DB クラスターへの継続的なレプリケーションを設定する。障害時は接続先を切り替える。","Aurora Global Database を構成し、別のリージョンにセカンダリ DB クラスターを作成する。障害時はセカンダリクラスターをプライマリに昇格させる。"],"answer":[3],"why":["最大で 1 時間分のデータを失い、スナップショットからの復元にも時間がかかる。RPO・RTO の要件を満たさず、平常時に別のリージョンで参照することもできない。","同じリージョンの中での冗長化であり、リージョン全体の障害には備えられない。","レプリケーションインスタンスとタスクを運用し続ける必要があり、Aurora の機能で済む方法に比べて運用効率が低い。","Global Database は Aurora のストレージ層で別のリージョンに複製し、遅延は通常 1 秒未満である。障害時はセカンダリを昇格させて分単位で書き込みを再開でき、平常時はセカンダリを参照系に使える。"],"explain":"「リージョン全体の障害」「RPO 数秒・RTO 数分」「別のリージョンで低レイテンシーの読み取り」がそろったら Aurora Global Database を選ぶ。プライマリのリージョンからセカンダリのリージョンへ、Aurora のストレージ層で非同期に複製するため、データベースの性能への影響が小さく、遅延も通常 1 秒未満である。セカンダリクラスターは平常時は読み取り専用で、そのリージョンの参照系の処理に使える。同じリージョン内の Aurora レプリカは AZ 障害への備えであり、リージョン障害には対応できない。","point":"Aurora のリージョン間 DR は Global Database（複製の遅延は通常 1 秒未満、RTO は分単位）。セカンダリは平常時に読み取りにも使える。","diagram":{"caption":"正解の構成: Aurora Global Database で別のリージョンへ複製する","cols":4,"rows":1,"groups":[{"label":"プライマリリージョン","kind":"region","c":0,"r":0,"w":2,"h":1},{"label":"セカンダリリージョン","kind":"region","c":2,"r":0,"w":2,"h":1}],"nodes":[{"id":"app1","label":"業務アプリ","sub":"読み書き","kind":"compute","c":0,"r":0},{"id":"pri","label":"プライマリ","sub":"Aurora DB クラスター","kind":"database","c":1,"r":0},{"id":"sec","label":"セカンダリ","sub":"読み取り専用","kind":"database","c":2,"r":0},{"id":"app2","label":"参照系の処理","sub":"拠点から利用","kind":"compute","c":3,"r":0}],"edges":[{"from":"app1","to":"pri"},{"from":"pri","to":"sec","label":"非同期で複製","style":"dashed"},{"from":"app2","to":"sec","label":"参照"}]}},{"id":"d2-14","domain":2,"topic":"DynamoDB","type":"single","stem":"あるモバイルゲーム企業は、北米と欧州のプレイヤー向けに、それぞれ近いリージョンでバックエンドを運用しています。プレイヤーのプロファイルは Amazon DynamoDB に保存されています。プレイヤーがどちらのリージョンに接続しても、自分のプロファイルを低レイテンシーで読み書きできる必要があります。また、どちらかのリージョンが停止しても、もう一方のリージョンで書き込みを含めて処理を継続する必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["北米のリージョンにテーブルを作成し、ポイントインタイムリカバリを有効にする。欧州のアプリケーションはリージョンをまたいでアクセスし、障害時は別のリージョンに復元する。","DynamoDB グローバルテーブルを作成し、両方のリージョンにレプリカを配置する。各リージョンのアプリケーションは、同じリージョンのレプリカを読み書きする。","各リージョンにテーブルを作成する。DynamoDB Streams をトリガーとする Lambda 関数で、変更をもう一方のリージョンのテーブルに書き込む。","各リージョンにテーブルを作成する。AWS Backup で 1 時間ごとにバックアップをもう一方のリージョンにコピーし、障害時はバックアップから復元する。"],"answer":[1],"why":["欧州のプレイヤーはリージョンをまたぐためレイテンシーが大きい。北米のリージョンが停止すると、復元が終わるまで両方のリージョンで処理が止まる。","グローバルテーブルはどのレプリカにも書き込めるマルチアクティブの構成で、変更は自動で他のリージョンに複製される。一方のリージョンが停止しても、もう一方で読み書きを続けられる。","同じことを自前で実現する構成で、再試行や書き込みの競合の扱いまで作り込んで運用する必要があり、運用効率が低い。","最大 1 時間分のデータを失い、復元にも時間がかかる。平常時に両方のリージョンで同じデータを読み書きすることもできない。"],"explain":"「複数のリージョンで読み書き」「リージョン障害時も書き込みを継続」「運用効率」がそろったら DynamoDB グローバルテーブルを選ぶ。各リージョンのレプリカに書き込んだ変更は、DynamoDB が自動で他のレプリカに複製する。同じ項目への同時の書き込みは、既定では最後に書き込んだものが優先されて解決される。Streams と Lambda で同じことを作る方法は動くが、運用負荷が大きい。","point":"DynamoDB のマルチリージョン・マルチアクティブはグローバルテーブル。各リージョンのレプリカに読み書きでき、複製は自動。","diagram":{"caption":"正解の構成: グローバルテーブルで両リージョンのレプリカを読み書きする","cols":6,"rows":1,"groups":[{"label":"北米のリージョン","kind":"region","c":1,"r":0,"w":2,"h":1},{"label":"欧州のリージョン","kind":"region","c":3,"r":0,"w":2,"h":1}],"nodes":[{"id":"na","label":"北米のプレイヤー","kind":"client","c":0,"r":0},{"id":"appa","label":"バックエンド","sub":"北米","kind":"compute","c":1,"r":0},{"id":"ta","label":"DynamoDB","sub":"レプリカ","kind":"database","c":2,"r":0},{"id":"tb","label":"DynamoDB","sub":"レプリカ","kind":"database","c":3,"r":0},{"id":"appb","label":"バックエンド","sub":"欧州","kind":"compute","c":4,"r":0},{"id":"eu","label":"欧州のプレイヤー","kind":"client","c":5,"r":0}],"edges":[{"from":"na","to":"appa"},{"from":"appa","to":"ta","label":"読み書き"},{"from":"ta","to":"tb","label":"自動で複製","style":"dashed","both":true},{"from":"appb","to":"tb","label":"読み書き"},{"from":"eu","to":"appb"}]}},{"id":"d2-15","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、主系のリージョンで Application Load Balancer と Auto Scaling グループで構成された Web アプリケーションを運用しています。別のリージョンには、同じ構成を最小限の台数で常時稼働させた待機系があります。主系のアプリケーションが応答しなくなったときは、ユーザーからのアクセスを自動的に待機系に切り替える必要があります。平常時は待機系にトラフィックを送りません。ソリューションアーキテクトは Amazon Route 53 をどのように設定すべきですか。","choices":["レイテンシーベースのルーティングで、両方のリージョンの ALB をエイリアスレコードとして登録する。各レコードでターゲットのヘルスを評価する。","フェイルオーバールーティングで、主系の ALB をプライマリ、待機系の ALB をセカンダリとして登録する。セカンダリのレコードにだけヘルスチェックを関連付ける。","フェイルオーバールーティングで、主系の ALB をプライマリ、待機系の ALB をセカンダリとして登録する。プライマリのレコードでターゲットのヘルスを評価する。","加重ルーティングで、両方のリージョンの ALB を 50 対 50 の重みで登録する。それぞれのレコードにヘルスチェックを関連付ける。"],"answer":[2],"why":["ユーザーごとにレイテンシーの小さいリージョンに振り分けるため、平常時も待機系にトラフィックが送られる。","ヘルスチェックのないレコードは常に正常とみなされる。プライマリのヘルスが評価されないため、主系が応答しなくなっても待機系に切り替わらない。","プライマリが異常と判定されたときだけ、セカンダリの待機系が返される。平常時は主系だけにトラフィックが送られる。","平常時から半分のトラフィックが待機系に送られる。待機系は最小限の台数のため、処理しきれないおそれもある。"],"explain":"「平常時は主系だけ」「主系の障害時に待機系へ自動で切り替え」というアクティブ/パッシブの構成には、フェイルオーバールーティングを使う。決め手はプライマリのヘルスを判定することで、ALB へのエイリアスレコードなら「ターゲットのヘルスを評価」を有効にするか、ヘルスチェックを関連付ける。ヘルスチェックのないレコードは常に正常とみなされるため、プライマリを判定しないと切り替わらない。レイテンシーベースや加重のルーティングは、複数のリージョンを同時に使うアクティブ/アクティブ向けである。","point":"アクティブ/パッシブはフェイルオーバールーティング。プライマリのヘルスを評価しないと、障害時に切り替わらない。","diagram":{"caption":"正解の構成: フェイルオーバールーティングで障害時に待機系へ切り替える","cols":4,"rows":2,"groups":[{"label":"主系のリージョン","kind":"region","c":2,"r":0,"w":2,"h":1},{"label":"待機系のリージョン","kind":"region","c":2,"r":1,"w":2,"h":1}],"nodes":[{"id":"user","label":"ユーザー","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"フェイルオーバー","kind":"network","c":1,"r":0},{"id":"alb1","label":"ALB（主系）","sub":"プライマリ","kind":"network","c":2,"r":0},{"id":"ec21","label":"EC2","sub":"Auto Scaling","kind":"compute","c":3,"r":0},{"id":"alb2","label":"ALB（待機系）","sub":"セカンダリ","kind":"network","c":2,"r":1},{"id":"ec22","label":"EC2","sub":"最小限の台数","kind":"compute","c":3,"r":1}],"edges":[{"from":"user","to":"r53","label":"名前解決"},{"from":"r53","to":"alb1","label":"平常時"},{"from":"r53","to":"alb2","label":"障害時のみ","style":"dashed"},{"from":"alb1","to":"ec21"},{"from":"alb2","to":"ec22"}]}},{"id":"d2-16","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は、Amazon EC2 と Amazon RDS for MySQL で構成された受注システムの災害対策を、別のリージョンに構築することを計画しています。経営層は、RPO を数分以内、RTO を 1 時間以内にすることを求めています。コストを抑えるため、平常時は DR 用のリージョンでアプリケーションサーバーを稼働させず、データベースのデータだけを継続的に複製しておく方針です。最も費用対効果の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["AWS Backup で EC2 と RDS のバックアップを 1 日 1 回作成し、DR 用のリージョンにコピーする。障害時は AWS CloudFormation で環境を作成し、バックアップから復元する。","DR 用のリージョンに RDS のクロスリージョンリードレプリカを作成し、AMI と CloudFormation テンプレートを用意する。障害時はレプリカを昇格させ、サーバーを起動する。","DR 用のリージョンに RDS のクロスリージョンリードレプリカを作成し、最小台数のアプリケーションサーバーを常時稼働させる。障害時はレプリカを昇格させ、スケールアウトする。","両方のリージョンでアプリケーションサーバーとデータベースを本番と同じ規模で稼働させる。Amazon Route 53 の加重ルーティングで両方のリージョンにトラフィックを分散する。"],"answer":[1],"why":["バックアップと復元の戦略で最も安いが、1 日 1 回のバックアップでは最大 1 日分のデータを失い、RPO の数分以内を満たさない。環境の作成と復元にも時間がかかる。","パイロットライトの戦略である。データベースだけを常に複製し、アプリケーションサーバーは障害時に起動するため、平常時のコストを抑えながら RPO 数分・RTO 1 時間以内を満たせる。","ウォームスタンバイの戦略である。RPO・RTO は満たせるが、平常時もアプリケーションサーバーを稼働させるため方針に反し、コストも高くなる。","マルチサイト（アクティブ/アクティブ）の戦略である。RTO はほぼゼロにできるが、本番と同じ規模の環境を両方で動かすためコストが最も高い。"],"explain":"DR 戦略はコストの低い順に、バックアップと復元、パイロットライト、ウォームスタンバイ、マルチサイト（アクティブ/アクティブ）となり、この順に RPO・RTO を短くできる。「データは継続的に複製」「アプリケーションサーバーは平常時に動かさない」はパイロットライトの特徴そのもので、RPO は分単位、RTO は数十分程度が目安である。縮小した環境を常時動かすのがウォームスタンバイで、本問の方針に反する。","point":"パイロットライトはデータだけ常時複製してサーバーは止めておく。縮小した環境を常時稼働させるのがウォームスタンバイ。","diagram":null},{"id":"d2-17","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある企業は AWS Organizations で約 30 のアカウントを管理しており、各アカウントで Amazon EC2、Amazon RDS、Amazon EFS、Amazon DynamoDB を使用しています。バックアップの設定はアカウントごとの担当者に任されており、監査で設定漏れが見つかりました。この企業は、全アカウントのバックアップを一元的に管理し、リージョン障害に備えて別のリージョンにもバックアップを保管することを求めています。さらに、ランサムウェア対策として、管理者権限を持つユーザーでも保持期間内のバックアップを削除できないようにする必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["各アカウントで AWS Backup のバックアッププランを作成し、別のリージョンへのコピーを設定する。バックアップボールトのアクセスポリシーで、復旧ポイントの削除を拒否する。","AWS CloudFormation StackSets で、各サービスのネイティブのバックアップ設定と別のリージョンへのコピーを全アカウントに展開する。サービスコントロールポリシー（SCP）で、スナップショットとバックアップの削除を拒否する。","Organizations のバックアップポリシーで、AWS Backup のバックアッププランを全アカウントに適用する。別のリージョンへのコピーを設定し、ボールトに Vault Lock をガバナンスモードで設定する。","Organizations のバックアップポリシーで、AWS Backup のバックアッププランを全アカウントに適用する。別のリージョンへのコピーを設定し、ボールトに Vault Lock をコンプライアンスモードで設定する。"],"answer":[3],"why":["アカウントごとの設定のため一元管理にならず、設定漏れの問題が残る。ボールトのアクセスポリシーは権限を持つ管理者が変更・削除できるため、削除を確実には防げない。","サービスごとに異なるバックアップの仕組みを管理することになり運用負荷が高い。SCP は管理アカウントには適用されず、組織の管理者が変更することもできる。","一元管理と別のリージョンへの保管はできるが、ガバナンスモードのロックは十分な IAM 権限を持つユーザーが解除できるため、管理者でも削除できないという要件を満たさない。","バックアップポリシーで全アカウントのバックアップを一元的に設定でき、コピーのルールで別のリージョンにも保管できる。コンプライアンスモードの Vault Lock は、猶予期間が過ぎるとルートユーザーや AWS でも解除できず、保持期間内の削除を防げる。"],"explain":"複数アカウントのバックアップの一元管理は、AWS Backup と Organizations のバックアップポリシーの組み合わせで行う。バックアッププランのコピーのルールで、別のリージョン（必要なら別のアカウント）のボールトにも保管できる。「管理者権限を持つユーザーでも削除できない」が決め手で、AWS Backup Vault Lock をガバナンスモードではなくコンプライアンスモードで設定する。IAM・SCP・ボールトのアクセスポリシーは権限を持つ管理者が変更できるため、改ざんできない保護にはならない。","point":"複数アカウントのバックアップは AWS Backup ＋ バックアップポリシー。誰にも消せない保護は Vault Lock のコンプライアンスモード。","diagram":null},{"id":"d2-18","domain":2,"topic":"バックアップ・DR","type":"single","stem":"ある製造業の企業は、オンプレミスの VMware 環境で実行されている 20 台の業務サーバー（Windows Server と Linux、データベースサーバーを含む）の災害対策先として、AWS を使用することを計画しています。RPO は秒単位、RTO は数分から数十分である必要があります。平常時の AWS 側のコンピューティングコストは最小限に抑えたいと考えています。また、サーバーやアプリケーションごとに個別の複製の仕組みを作りたくありません。これらの要件を満たすソリューションはどれですか。","choices":["各サーバーに AWS Elastic Disaster Recovery のエージェントをインストールし、ブロックレベルで継続的に複製する。障害時に復旧用の EC2 インスタンスを起動する。","AWS Backup と Backup ゲートウェイを使用して、VMware の仮想マシンを 1 日 1 回バックアップする。障害時はバックアップから仮想マシンを復元する。","AWS Application Migration Service で各サーバーを AWS に継続的に複製し、テストの後にカットオーバーを実行する。移行が完了したらオンプレミスのサーバーを停止する。","各サーバーと同じ構成の EC2 インスタンスを AWS で常時稼働させる。アプリケーションごとにデータを同期するスクリプトを作成し、数分ごとに実行する。"],"answer":[0],"why":["エージェントがブロックレベルで継続的に複製するため RPO は秒単位になり、障害時は複製されたデータから分単位で EC2 インスタンスを起動できる。平常時は低コストのステージング領域だけが動く。","1 日 1 回のバックアップでは最大 1 日分のデータを失い、RPO の要件を満たさない。復元にも時間がかかる。","AWS への移行のためのサービスで、オンプレミスを主系のまま使い続ける災害対策には合わない。","平常時も全台を稼働させるためコンピューティングのコストが高く、アプリケーションごとに複製の仕組みを作ることにもなる。"],"explain":"オンプレミスや他のクラウドのサーバーを、OS やアプリケーションの種類によらず AWS に継続的に複製する DR には、AWS Elastic Disaster Recovery（AWS DRS）を使う。複製されたデータは低コストのステージング領域（小さなレプリケーションサーバーと EBS ボリューム）に保存され、障害時やドリル時にだけ復旧用のインスタンスを起動する。そのため「RPO 秒単位・RTO 分単位」と「平常時のコスト最小」を両立できる。Application Migration Service も同様の複製技術を使うが、目的は移行である。","point":"サーバーを丸ごと AWS に継続複製する DR は Elastic Disaster Recovery。平常時はステージング領域だけで低コスト。","diagram":{"caption":"正解の構成: Elastic Disaster Recovery で継続複製し、障害時に起動する","cols":3,"rows":2,"groups":[{"label":"オンプレミス","kind":"onprem","c":0,"r":0,"w":1,"h":2},{"label":"DR 用のリージョン","kind":"region","c":1,"r":0,"w":2,"h":2},{"label":"ステージング領域","kind":"subnet-private","c":1,"r":0,"w":2,"h":1},{"label":"復旧用サブネット","kind":"subnet-private","c":1,"r":1,"w":2,"h":1}],"nodes":[{"id":"srv","label":"業務サーバー","sub":"エージェント導入","kind":"onprem","c":0,"r":0},{"id":"rep","label":"複製サーバー","sub":"小さな EC2","kind":"compute","c":1,"r":0},{"id":"ebs","label":"EBS","sub":"複製データ","kind":"storage","c":2,"r":0},{"id":"rec","label":"復旧用 EC2","sub":"障害時に起動","kind":"compute","c":2,"r":1}],"edges":[{"from":"srv","to":"rep","label":"継続的に複製"},{"from":"rep","to":"ebs"},{"from":"ebs","to":"rec","label":"障害時のみ","style":"dashed"}]}},{"id":"d2-19","domain":2,"topic":"S3","type":"multi","stem":"ある医療系サービス事業者は、診療画像を Amazon S3 バケットに保存しています。規制に対応するため、別のリージョンにもデータのコピーを保持することになりました。新しくアップロードされたオブジェクトは、15 分以内に別のリージョンに複製されることが SLA で裏付けられている必要があります。また、すでにバケットに保存されている数年分のオブジェクトも、複製先に含める必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["送信元と送信先のバケットでバージョニングを有効にする。S3 Replication Time Control（S3 RTC）を有効にしたクロスリージョンレプリケーションのルールを作成する。","送信元のバケットで S3 Transfer Acceleration を有効にする。アプリケーションを変更し、両方のリージョンのバケットにそれぞれアップロードする。","送信元のバケットで S3 同一リージョンレプリケーションのルールを作成し、既存のオブジェクトも含めて別のバケットに複製する。","S3 バッチレプリケーションのジョブを作成し、レプリケーションのルールを設定する前から存在するオブジェクトを送信先に複製する。","S3 マルチリージョンアクセスポイントを作成し、既存のオブジェクトを含めて各リージョンのバケットの内容を同期させる。"],"answer":[0,3],"why":["クロスリージョンレプリケーションにはバージョニングが必要である。S3 RTC を有効にすると、新しいオブジェクトの 99.99% を 15 分以内に複製することが SLA で裏付けられる。","Transfer Acceleration はクライアントからの転送を速くする機能で、複製の仕組みではない。両方に書き込む処理を自前で作ることになり、SLA の裏付けもない。","同一リージョンレプリケーションは同じリージョン内のバケットに複製する機能で、別のリージョンにコピーを保持する要件を満たさない。ルールを作成しても既存のオブジェクトは対象にならない。","レプリケーションのルールは、設定後に追加されたオブジェクトだけが対象になる。既存のオブジェクトは S3 バッチレプリケーションで複製する。","マルチリージョンアクセスポイントはリクエストを適切なバケットに振り分ける入口で、バケット間の複製はレプリケーションのルールで別に設定する。既存のオブジェクトを同期する機能はない。"],"explain":"要件を 2 つに分けて考える。「新しいオブジェクトを 15 分以内に複製、SLA で裏付け」は、クロスリージョンレプリケーション（CRR）で S3 RTC を有効にすることで満たせる。「既存のオブジェクトも複製」は、レプリケーションのルールが設定後の新しいオブジェクトだけを対象にするため、S3 バッチレプリケーションで別に複製する。CRR の前提として、送信元・送信先の両方でバージョニングを有効にしておく必要がある。","point":"S3 のレプリケーションは設定後の新規オブジェクトだけが対象。既存分はバッチレプリケーション、15 分の SLA は S3 RTC。","diagram":{"caption":"正解の構成: 新規は CRR と S3 RTC、既存分はバッチレプリケーションで複製","cols":3,"rows":2,"groups":[{"label":"送信元のリージョン","kind":"region","c":0,"r":0,"w":1,"h":2},{"label":"送信先のリージョン","kind":"region","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"src","label":"送信元バケット","sub":"バージョニング有効","kind":"storage","c":0,"r":0},{"id":"batch","label":"バッチ複製ジョブ","sub":"既存のオブジェクト","kind":"management","c":0,"r":1},{"id":"dst","label":"送信先バケット","sub":"バージョニング有効","kind":"storage","c":2,"r":0}],"edges":[{"from":"src","to":"dst","label":"RTC: 15 分以内","style":"dashed"},{"from":"src","to":"batch","label":"既存分"},{"from":"batch","to":"dst","label":"一括で複製","style":"dashed"}]}},{"id":"d2-20","domain":2,"topic":"EFS・FSx","type":"single","stem":"ある出版社の Web サイトは、Auto Scaling グループ内の Linux の Amazon EC2 インスタンスで実行されるコンテンツ管理システム（CMS）で運用されています。CMS は記事の画像やテンプレートを、POSIX 準拠の共有ディレクトリ上のファイルとして読み書きします。現在は 1 台の EC2 インスタンスで NFS サーバーを実行して共有しているため、単一障害点になっています。複数の AZ のすべてのインスタンスから同時にマウントでき、1 つの AZ が停止しても読み書きを継続できる必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Multi-Attach を有効にした Amazon EBS io2 ボリュームを作成する。すべての EC2 インスタンスにボリュームをアタッチして共有する。","Amazon EFS の 1 ゾーンファイルシステムを作成する。各 AZ のインスタンスから、同じマウントターゲットを使ってマウントする。","Amazon EFS のリージョンファイルシステムを作成し、各 AZ にマウントターゲットを作成する。インスタンスは同じ AZ のマウントターゲットからマウントする。","Amazon FSx for Windows File Server のマルチ AZ ファイルシステムを作成する。各インスタンスから SMB でファイル共有をマウントする。"],"answer":[2],"why":["EBS の Multi-Attach は同じ AZ のインスタンスに限られ、複数の AZ から共有できない。同時の書き込みにはクラスター対応のファイルシステムも必要になる。","データとマウントターゲットが 1 つの AZ にあるため、その AZ が停止するとファイルシステムを使えなくなる。","データは複数の AZ に冗長化して保存され、各 AZ のマウントターゲットからマウントできる。1 つの AZ が停止しても残りの AZ のインスタンスは読み書きを続けられ、サーバーの管理も不要である。","マルチ AZ で可用性は高いが、SMB のファイル共有で Windows 向けのサービスであり、Linux の CMS が前提とする POSIX 準拠の共有ファイルシステムには合わない。"],"explain":"「Linux」「POSIX 準拠」「複数の AZ から同時にマウント」「AZ の停止に耐える」「運用効率」がそろったら、Amazon EFS のリージョンファイルシステムを選ぶ。各 AZ にマウントターゲットを作り、インスタンスは同じ AZ のマウントターゲットからマウントするのが推奨である。1 ゾーンファイルシステムは低コストだが AZ の障害に耐えない。FSx for Windows File Server は Windows の SMB 共有向けであり、EBS は 1 つの AZ に閉じたブロックストレージである。","point":"複数 AZ の Linux インスタンスでファイルを共有するなら EFS（リージョン）。1 ゾーンは安いが AZ 障害に弱い。","diagram":{"caption":"正解の構成: 各 AZ のマウントターゲットから EFS を共有する","cols":3,"rows":2,"groups":[{"label":"AZ a","kind":"az","c":0,"r":0,"w":1,"h":2},{"label":"AZ b","kind":"az","c":2,"r":0,"w":1,"h":2}],"nodes":[{"id":"ec2a","label":"CMS（EC2）","sub":"Auto Scaling","kind":"compute","c":0,"r":0},{"id":"mta","label":"EFS マウント","sub":"ターゲット（AZ a）","kind":"network","c":0,"r":1},{"id":"efs","label":"Amazon EFS","sub":"複数 AZ に冗長化","kind":"storage","c":1,"r":1},{"id":"ec2b","label":"CMS（EC2）","sub":"Auto Scaling","kind":"compute","c":2,"r":0},{"id":"mtb","label":"EFS マウント","sub":"ターゲット（AZ b）","kind":"network","c":2,"r":1}],"edges":[{"from":"ec2a","to":"mta","label":"NFS"},{"from":"ec2b","to":"mtb","label":"NFS"},{"from":"mta","to":"efs"},{"from":"mtb","to":"efs"}]}},{"id":"d2-21","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、モノリシックな Web アプリケーションを、注文 API、在庫 API、管理画面の 3 つのマイクロサービスに分割しています。各サービスは別々の Auto Scaling グループの Amazon EC2 インスタンスで実行され、独立してスケールさせる必要があります。クライアントは単一のドメイン名 shop.example.com を使用し、サービスはパス（/orders/*、/inventory/*、/admin/*）で区別されます。ソリューションアーキテクトは、ドメイン名を変更せず、運用上のオーバーヘッドを最小限に抑えてリクエストを各サービスに振り分ける必要があります。これらの要件を満たすソリューションはどれですか。","choices":["サービスごとに Network Load Balancer を作成する。Amazon Route 53 のレコードでパスごとに異なる NLB へ振り分ける。","Application Load Balancer を 1 つ作成する。パスパターン条件のリスナールールでサービスごとのターゲットグループに転送し、各 Auto Scaling グループを対応するターゲットグループに関連付ける。","サービスごとに Application Load Balancer を作成する。Amazon CloudFront ディストリビューションに 3 つのオリジンを登録し、パスごとのキャッシュビヘイビアで振り分ける。","Network Load Balancer を 1 つ作成し、サービスごとに異なるリスナーポートを割り当てる。クライアントが接続先のポート番号を指定するようにする。"],"answer":[1],"why":["Route 53 の DNS 応答はドメイン名の解決までで、URL のパスを見て振り分けることはできない。NLB もレイヤー 4 で動作しパスを判別できない。","ALB はレイヤー 7 でパスやホスト名を見て、リスナールールによりターゲットグループを選べる。ターゲットグループを Auto Scaling グループに関連付ければ、サービスごとに独立してスケールできる。","パスで振り分けること自体は可能だが、ALB が 3 つと CloudFront が必要になり、構成も管理対象も増える。1 つの ALB で足りる要件に対して運用負荷が大きい。","NLB はパスを判別できず、ポートでの振り分けではクライアント側の変更が必要になる。パスで区別するという要件も満たさない。"],"explain":"「単一のドメイン名」「パスでサービスを区別」「運用上のオーバーヘッドを最小限」がそろったら、1 つの ALB のパスベースルーティングを選ぶ。ALB はリスナールールにパスパターン、ホストヘッダー、HTTP ヘッダーなどの条件を設定でき、条件ごとに別のターゲットグループへ転送できる。ターゲットグループは Auto Scaling グループと関連付けられるので、サービスごとに独立したスケーリングも実現できる。","point":"HTTP の内容（パス・ホスト名）で振り分けるのは ALB のリスナールール。1 つの ALB で複数のマイクロサービスを受けられる。","diagram":{"caption":"正解の構成: 1 つの ALB がパスでターゲットグループを振り分ける","cols":3,"rows":3,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"shop.example.com","kind":"client","c":0,"r":1},{"id":"alb","label":"ALB","sub":"パスベースルール","kind":"network","c":1,"r":1},{"id":"orders","label":"注文サービス","sub":"/orders/* の ASG","kind":"compute","c":2,"r":0},{"id":"inv","label":"在庫サービス","sub":"/inventory/* の ASG","kind":"compute","c":2,"r":1},{"id":"admin","label":"管理画面","sub":"/admin/* の ASG","kind":"compute","c":2,"r":2}],"edges":[{"from":"user","to":"alb"},{"from":"alb","to":"orders"},{"from":"alb","to":"inv"},{"from":"alb","to":"admin"}]}},{"id":"d2-22","domain":2,"topic":"ELB","type":"single","stem":"ある企業は、独自の TCP プロトコルを使うアプリケーションを、2 つの AZ に配置した Amazon EC2 インスタンスで実行しており、前段に Network Load Balancer（NLB）を使用しています。インスタンスは AZ-a に 2 台、AZ-b に 8 台あります。クライアントからの接続は各 AZ にほぼ均等に届いていますが、AZ-a のインスタンスだけ CPU 使用率が極端に高くなっています。ソリューションアーキテクトは、インスタンスの台数を変更せず、アプリケーションも変更せずに、すべてのインスタンスへ均等に負荷を分散させる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["NLB を Application Load Balancer に置き換える。ALB の既定のクロスゾーン負荷分散を利用する。","NLB の AZ ごとの DNS 名を使い、Route 53 の加重ルーティングで AZ-a に 2、AZ-b に 8 の重みを設定する。クライアントにはその DNS 名で接続させる。","ターゲットグループのスティッキーセッションを無効にし、接続のアイドルタイムアウトを短くする。","NLB でクロスゾーン負荷分散を有効にする。"],"answer":[3],"why":["独自の TCP プロトコルは ALB（HTTP/HTTPS 向け）では扱えない。ALB はクロスゾーンが既定で有効だが、プロトコルの要件を満たさない。","DNS で AZ 間の比率を調整できるが、AZ ごとの DNS 名の管理が必要になり、クライアント側の DNS キャッシュにも影響される。台数が変わるたびに重みの見直しも要り、運用負荷が大きい。","NLB は AZ ごとに受けた接続をその AZ のターゲットに分けるため、接続の持続時間を調整しても AZ 間の偏りは解消しない。","クロスゾーン負荷分散を有効にすると、各 NLB ノードがすべての AZ のターゲットへ均等に分散する。台数の偏りがあっても負荷は均等になる。AZ をまたぐデータ転送料金がかかる点には注意が必要。"],"explain":"NLB は既定でクロスゾーン負荷分散が無効で、各 AZ のノードは自分の AZ のターゲットにだけ転送する。そのため AZ 間でインスタンス数に差があると、台数の少ない AZ に負荷が集中する。TCP のまま「台数もアプリケーションも変えずに」均等化するには、NLB のクロスゾーン負荷分散を有効にする。ALB は既定で有効だが、TCP には使えない。","point":"NLB のクロスゾーン負荷分散は既定で無効（ALB は既定で有効）。有効にすると AZ 間のデータ転送料金がかかる。","diagram":{"caption":"正解の構成: NLB のクロスゾーンで全インスタンスに均等に分散","cols":3,"rows":2,"groups":[{"label":"AZ-a","kind":"az","c":2,"r":0,"w":1,"h":1},{"label":"AZ-b","kind":"az","c":2,"r":1,"w":1,"h":1}],"nodes":[{"id":"client","label":"クライアント","sub":"TCP 接続","kind":"client","c":0,"r":0},{"id":"nlb","label":"NLB","sub":"クロスゾーン有効","kind":"network","c":1,"r":0},{"id":"a","label":"EC2 2 台","sub":"AZ-a のターゲット","kind":"compute","c":2,"r":0},{"id":"b","label":"EC2 8 台","sub":"AZ-b のターゲット","kind":"compute","c":2,"r":1}],"edges":[{"from":"client","to":"nlb"},{"from":"nlb","to":"a","label":"全台に均等"},{"from":"nlb","to":"b","label":"全台に均等"}]}},{"id":"d2-23","domain":2,"topic":"Auto Scaling","type":"multi","stem":"ある企業は、Application Load Balancer の背後にある複数 AZ の Auto Scaling グループで Web アプリケーションを実行しています。先日、アプリケーションのプロセスがハングしましたが、EC2 インスタンス自体は実行中のままでした。ALB のヘルスチェックには失敗してトラフィックは止まったものの、Auto Scaling グループは障害のあるインスタンスを置き換えず、手動での対応が必要になりました。新しいインスタンスはアプリケーションの初期化が完了するまでに約 4 分かかります。ソリューションアーキテクトは、このような障害のインスタンスを自動的に置き換え、起動中のインスタンスが誤って終了されないようにする必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["Auto Scaling グループのヘルスチェックタイプを ELB に変更する。","インスタンスステータスチェックの失敗を検知する Amazon CloudWatch アラームを作成し、失敗したインスタンスを再起動するアクションを設定する。","ALB のターゲットグループのヘルスチェック間隔を最小値に短縮する。","ヘルスチェックの猶予期間を、アプリケーションの初期化時間（約 4 分）より長く設定する。","Auto Scaling グループの最小インスタンス数を現在の 2 倍に引き上げる。"],"answer":[0,3],"why":["Auto Scaling グループは既定では EC2 のステータスチェックだけで判断する。ヘルスチェックタイプを ELB にすると、ロードバランサーが異常と判断したインスタンスも置き換え対象になる。","インスタンスステータスチェックはインスタンスの OS レベルの異常を見るもので、アプリケーションのハングは検知できない場合が多い。再起動で解決する保証もなく、ALB の判断とも連動しない。","ヘルスチェックの検出は早くなるが、Auto Scaling グループが ALB の結果を参照しない限り、インスタンスは置き換えられない。","猶予期間は、起動直後のインスタンスのヘルスチェック結果を無視する時間。初期化時間より長くしないと、ELB ヘルスチェックを有効にしたときに起動中のインスタンスが異常と判定され、置き換えが繰り返される。","台数を増やしても、異常なインスタンスは置き換えられずに残る。コストが増えるだけで、障害の自動復旧にはならない。"],"explain":"「ALB は異常と判断しているのに Auto Scaling が置き換えない」は、グループのヘルスチェックタイプが既定の EC2 のままである典型的な症状。タイプを ELB に変えれば解決するが、このとき初期化に時間がかかるアプリケーションでは猶予期間が短いと起動中に異常判定されて置き換えのループになる。そのため猶予期間を初期化時間より長く設定する。","point":"Auto Scaling のヘルスチェックは既定で EC2 のみ。ALB の判定で置き換えるにはタイプを ELB にし、猶予期間は初期化時間より長くする。","diagram":null},{"id":"d2-24","domain":2,"topic":"Auto Scaling","type":"single","stem":"ある企業は、Auto Scaling グループの Amazon EC2 インスタンスで、キューから取得したジョブを処理するバッチアプリケーションを実行しています。スケールインでインスタンスが終了すると、処理中のジョブが失われ、ローカルディスクのログが Amazon S3 にアップロードされないまま消えてしまいます。ジョブの完了とログのアップロードには最大 10 分かかります。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑え、インスタンスが終了する前にこれらの処理を完了させる必要があります。これらの要件を満たすソリューションはどれですか。","choices":["Auto Scaling グループのスケールイン保護を、すべてのインスタンスに対して常時有効にする。","スケールインのクールダウン期間を 10 分に設定する。","Terminating のライフサイクルフックを追加する。Terminating:Wait の通知を Amazon EventBridge 経由で AWS Lambda に渡し、Lambda がジョブの完了とログのアップロードを実行する。完了後に complete-lifecycle-action API を呼び出す。","各インスタンスの終了保護を有効にし、ジョブが終わったインスタンスから運用担当者が手動で終了保護を解除する。"],"answer":[2],"why":["常時保護するとスケールインが一切行われなくなり、不要なインスタンスが残ってコストが増える。スケーリングの目的を損なう。","クールダウンはスケーリングアクティビティ間の待機時間で、終了対象に選ばれたインスタンスの終了を遅らせる機能ではない。処理中のジョブを守れない。","ライフサイクルフックはインスタンスを Terminating:Wait の状態で止めて、終了前に任意の処理を実行できる。処理が終わったら complete-lifecycle-action で終了を進める。ハートビートタイムアウトを処理時間より長くしておく。","終了保護は API による終了を防ぐ設定で、Auto Scaling のスケールインによる終了は止められない。手動対応にもなり、運用負荷が大きい。"],"explain":"「終了する前に処理を完了させる」は Auto Scaling のライフサイクルフックの典型的な用途。Terminating のフックを設定すると、インスタンスは Terminating:Wait で一時停止し、その間に EventBridge から Lambda や Systems Manager を起動して終了前の処理を実行できる。完了後に complete-lifecycle-action を呼ぶと終了が再開する。起動時の初期設定には Pending のフックを使う。","point":"スケールイン時の終了前処理や、起動時の初期設定はライフサイクルフック（Terminating:Wait / Pending:Wait）で行う。","diagram":{"caption":"正解の構成: Terminating のライフサイクルフックで終了前に処理","cols":3,"rows":2,"groups":[],"nodes":[{"id":"asg","label":"Auto Scaling","sub":"Terminating:Wait","kind":"compute","c":0,"r":0},{"id":"eb","label":"EventBridge","sub":"フックのイベント","kind":"integration","c":1,"r":0},{"id":"fn","label":"Lambda","sub":"ジョブ完了を確認","kind":"serverless","c":1,"r":1},{"id":"s3","label":"S3 バケット","sub":"ログを保存","kind":"storage","c":2,"r":1}],"edges":[{"from":"asg","to":"eb","label":"フック発行"},{"from":"eb","to":"fn"},{"from":"fn","to":"s3","label":"ログ保存"},{"from":"fn","to":"asg","label":"完了を通知","style":"dashed"}]}},{"id":"d2-25","domain":2,"topic":"Lambda・サーバーレス","type":"single","stem":"ある企業は、Amazon S3 バケットへの画像のアップロードをトリガーに AWS Lambda 関数を呼び出し、サムネイルを生成しています。ときどき一時的なエラーで関数が失敗し、Lambda による再試行も失敗すると、そのイベントが失われてしまいます。運用チームは、失敗したイベントを、失敗の原因を示すエラー情報と一緒に保持して、後から調査・再処理できるようにしたいと考えています。ソリューションアーキテクトは、運用上のオーバーヘッドを最小限に抑えてこの要件を満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["関数の非同期呼び出しの設定で、失敗時の送信先として Amazon SQS キューを指定する。","関数に予約済み同時実行数を設定して、スロットリングによる失敗が起きないようにする。","S3 イベント通知の送信先を Amazon SNS トピックに変更し、Lambda 関数をそのサブスクライバーにする。","関数のコードにすべての例外を捕捉する処理を追加し、失敗したイベントを Amazon CloudWatch Logs に出力する。"],"answer":[0],"why":["S3 からの呼び出しは非同期呼び出しで、Lambda が既定で 2 回再試行する。失敗時の送信先（Destinations）を設定すると、再試行後も失敗したイベントがエラー情報とともに SQS に送られる。コードの変更は不要。","予約済み同時実行数はスロットリングの緩和には役立つが、コードのエラーやタイムアウトによる失敗は防げず、失敗したイベントを保持する仕組みにもならない。","SNS を経由しても Lambda の呼び出しは非同期のままで、失敗時の送信先を設定しない限り、再試行後のイベントは失われる。構成が増えるだけである。","タイムアウトやメモリ不足など、関数がコードを実行できずに失敗するケースでは捕捉できない。ログから再処理するための追加の仕組みも必要になり、運用負荷が大きい。"],"explain":"S3、SNS、EventBridge などからの呼び出しは非同期呼び出しで、失敗すると Lambda が自動で再試行し、それでも失敗したイベントは破棄される。「失敗したイベントを保持」「エラー情報も一緒に」の要件には、非同期呼び出しの失敗時の送信先（SQS、SNS、Lambda、EventBridge）を設定する。デッドレターキューでも保持できるが、送信先の方が関数のエラー情報など実行の詳細を含められる。","point":"Lambda の非同期呼び出しの失敗は、送信先（Destinations）か DLQ で保持する。エラー情報も必要なら送信先を選ぶ。","diagram":{"caption":"正解の構成: 非同期呼び出しの失敗時の送信先に SQS を指定","cols":3,"rows":1,"groups":[],"nodes":[{"id":"s3","label":"S3 バケット","sub":"画像アップロード","kind":"storage","c":0,"r":0},{"id":"fn","label":"Lambda","sub":"サムネイル生成","kind":"serverless","c":1,"r":0},{"id":"sqs","label":"SQS キュー","sub":"失敗イベントを保持","kind":"integration","c":2,"r":0}],"edges":[{"from":"s3","to":"fn","label":"非同期呼び出し"},{"from":"fn","to":"sqs","label":"再試行後も失敗","style":"dashed"}]}},{"id":"d2-26","domain":2,"topic":"Lambda・サーバーレス","type":"multi","stem":"ある企業は、Amazon SQS 標準キューをイベントソースとして AWS Lambda 関数でメッセージを処理しています。バッチサイズは 10 に設定されています。バッチ内の 1 つのメッセージの処理に失敗すると関数がエラーを返し、バッチ全体がキューに戻るため、成功済みのメッセージも重複して処理されてしまいます。また、繰り返し失敗するメッセージが、他のメッセージの処理を妨げています。ソリューションアーキテクトは、失敗したメッセージだけを再処理し、繰り返し失敗するメッセージを隔離する必要があります。これらの要件を満たす手順の組み合わせはどれですか。","choices":["関数に予約済み同時実行数を設定し、並列に処理されるバッチの数を減らす。","イベントソースマッピングでバッチアイテムの失敗の報告を有効にする。関数は処理に失敗したメッセージの ID だけを batchItemFailures として返す。","キューの可視性タイムアウトを 0 秒にして、失敗したメッセージがすぐに再取得されるようにする。","標準キューを FIFO キューに置き換え、メッセージグループ ID を 1 つに統一する。","ソースキューにデッドレターキューを設定し、maxReceiveCount を指定して、繰り返し失敗したメッセージをデッドレターキューに移動する。"],"answer":[1,4],"why":["同時実行数を絞っても、バッチ内の 1 件の失敗でバッチ全体が戻る動作は変わらない。重複処理も、失敗メッセージの隔離も解決しない。","部分的なバッチ応答を使うと、Lambda は失敗したメッセージだけをキューに戻し、成功したメッセージは削除する。重複処理を避けられる。","可視性タイムアウトを 0 にすると、処理中のメッセージが別のコンシューマーにすぐ見えてしまい、重複処理が増える。失敗メッセージの隔離にもならない。","FIFO にしてグループ ID を 1 つにすると、1 件の失敗が後続のメッセージをすべて止めてしまう。隔離にならず、並列処理もできなくなる。","受信回数が maxReceiveCount を超えたメッセージを DLQ に移せば、繰り返し失敗するメッセージが他の処理を妨げなくなる。DLQ は後で調査・再処理できる。"],"explain":"SQS をイベントソースにする Lambda は、既定では関数がエラーを返すとバッチ全体を戻す。失敗したメッセージだけを戻すには、イベントソースマッピングの ReportBatchItemFailures を有効にして、失敗したメッセージの ID を返す。それでも失敗し続けるメッセージはソースキュー側の DLQ（redrive policy）に隔離する。DLQ は関数ではなくソースキューに設定する点に注意する。","point":"SQS と Lambda は、ReportBatchItemFailures で失敗分だけ再処理し、ソースキューの DLQ で繰り返し失敗するメッセージを隔離する。","diagram":null},{"id":"d2-27","domain":2,"topic":"VPC","type":"single","stem":"ある企業は、2 つの AZ にまたがる VPC を使用しています。各 AZ のプライベートサブネットにある Amazon EC2 インスタンスは、片方の AZ のパブリックサブネットにある 1 つの NAT ゲートウェイを経由して、インターネット上の外部 API にアクセスしています。先日、その NAT ゲートウェイがある AZ で障害が発生したところ、もう一方の AZ のインスタンスも外部 API にアクセスできなくなりました。ソリューションアーキテクトは、AZ の障害による影響をその AZ 内に閉じ込め、可用性を最大化する必要があります。これらの要件を満たすソリューションはどれですか。","choices":["既存の NAT ゲートウェイに Elastic IP アドレスを追加で関連付け、帯域幅を増やす。","もう一方の AZ のプライベートサブネットのルートテーブルに、インターネットゲートウェイへのデフォルトルートを追加する。","障害時に NAT ゲートウェイの Elastic IP アドレスを、もう一方の AZ に作成した NAT インスタンスへ手動で付け替える手順書を整備する。","各 AZ のパブリックサブネットに NAT ゲートウェイを作成し、各 AZ のプライベートサブネットのルートテーブルを、同じ AZ の NAT ゲートウェイに向ける。"],"answer":[3],"why":["Elastic IP アドレスの追加は、同時接続の上限の緩和などに使うもので、AZ の障害に対しては何も変わらない。NAT ゲートウェイは依然として 1 つの AZ に依存する。","プライベートサブネットのインスタンスにパブリック IP アドレスがなければ、インターネットゲートウェイ経由では通信できない。仮にパブリック IP を付ければ、プライベートサブネットにする意味がなくなる。","手動の切り替えは、障害時の復旧に時間がかかり、手順の誤りも起こりうる。NAT インスタンスの管理と運用も必要になり、可用性を最大化できない。","NAT ゲートウェイは 1 つの AZ 内で冗長化される。AZ ごとに配置し、同じ AZ のルートを向ければ、障害の影響がその AZ に閉じ、AZ をまたぐデータ転送料金もかからない。"],"explain":"NAT ゲートウェイは AZ 単位のリソースで、1 つの AZ に置くとその AZ の障害で全 AZ の外向き通信が止まる。「AZ の障害の影響をその AZ 内に閉じ込める」には、AZ ごとに NAT ゲートウェイを作り、各 AZ のプライベートサブネットのルートテーブルを自分の AZ の NAT ゲートウェイに向ける。これで AZ 間のデータ転送料金も避けられる。","point":"NAT ゲートウェイは AZ ごとに作成し、各 AZ のプライベートサブネットは同じ AZ の NAT ゲートウェイを指す。","diagram":{"caption":"正解の構成: AZ ごとの NAT ゲートウェイで障害を AZ 内に閉じ込める","cols":4,"rows":2,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":3,"h":2},{"label":"AZ-a","kind":"az","c":0,"r":0,"w":2,"h":1},{"label":"AZ-b","kind":"az","c":0,"r":1,"w":2,"h":1}],"nodes":[{"id":"eca","label":"EC2","sub":"プライベート (a)","kind":"compute","c":0,"r":0},{"id":"nata","label":"NAT ゲートウェイ","sub":"AZ-a に配置","kind":"network","c":1,"r":0},{"id":"ecb","label":"EC2","sub":"プライベート (b)","kind":"compute","c":0,"r":1},{"id":"natb","label":"NAT ゲートウェイ","sub":"AZ-b に配置","kind":"network","c":1,"r":1},{"id":"igw","label":"IGW","sub":"インターネット GW","kind":"network","c":2,"r":0},{"id":"api","label":"外部 API","kind":"client","c":3,"r":0}],"edges":[{"from":"eca","to":"nata"},{"from":"ecb","to":"natb"},{"from":"nata","to":"igw"},{"from":"natb","to":"igw"},{"from":"igw","to":"api"}]}},{"id":"d2-28","domain":2,"topic":"EC2","type":"single","stem":"ある企業は、オンプレミスから移行したレガシーアプリケーションを、単一の Amazon EC2 インスタンスで実行しています。このアプリケーションは複数インスタンスでの実行に対応しておらず、ライセンスがインスタンスのプライベート IP アドレスに紐づいています。インスタンスは Amazon EBS ボリュームだけを使用しています。ソリューションアーキテクトは、基盤ハードウェアの障害が発生したときに、インスタンス ID、プライベート IP アドレス、EBS 上のデータを維持したまま、自動的にインスタンスを復旧させる必要があります。運用上のオーバーヘッドは最小限にします。これらの要件を満たすソリューションはどれですか。","choices":["StatusCheckFailed_System メトリクスを監視する Amazon CloudWatch アラームを作成し、EC2 の復旧アクションを設定する。","インスタンスを最小・最大 1 台の Auto Scaling グループに入れ、障害時に新しいインスタンスを起動させる。","AMI を日次で作成する。障害時に Lambda 関数でその AMI から新しいインスタンスを起動する。","インスタンスを 2 台にして、Amazon Route 53 のフェイルオーバールーティングでヘルスチェックに失敗したら待機系に切り替える。"],"answer":[0],"why":["システムステータスチェックの失敗に対して復旧アクションを設定すると、同じインスタンス ID、プライベート IP アドレス、EBS ボリュームを保ったまま、正常なハードウェアへ移して再起動できる。","Auto Scaling グループは障害のあるインスタンスを置き換えるため、新しいインスタンス ID と別のプライベート IP アドレスになる。ライセンスが IP アドレスに紐づく要件を満たさない。","AMI から起動した新しいインスタンスは ID も IP アドレスも変わる。AMI 作成後に更新されたデータも失われる。Lambda の作り込みと保守も必要になる。","アプリケーションは複数インスタンスでの実行に対応しておらず、ライセンスも IP アドレスに紐づいている。待機系の追加はライセンス・データ同期の面でも要件に合わない。"],"explain":"「単一インスタンス」「インスタンス ID・プライベート IP・データを維持」「ハードウェア障害から自動復旧」は、EC2 の自動復旧の典型的な要件。CloudWatch アラームの復旧アクションは、インスタンスを同じ構成で別のハードウェアに移す。置き換えではなく復旧なので、ID や IP アドレスが変わらない。インスタンスストアボリュームだけを使う場合は復旧できない。なお、対応するインスタンスタイプでは簡易自動復旧が既定で有効になっているが、CloudWatch アラームの復旧アクションを設定すると、復旧の条件を明示でき、Amazon SNS での通知も組み合わせられる。","point":"同じインスタンス ID と IP を保って自動復旧するなら、StatusCheckFailed_System のアラーム＋復旧アクション。ASG は置き換えで ID と IP が変わる。","diagram":{"caption":"正解の構成: CloudWatch アラームの復旧アクションでインスタンスを復旧","cols":2,"rows":2,"groups":[],"nodes":[{"id":"ec2","label":"EC2","sub":"単一インスタンス","kind":"compute","c":0,"r":0},{"id":"cw","label":"CW アラーム","sub":"システム障害を検知","kind":"management","c":1,"r":0},{"id":"ebs","label":"EBS ボリューム","sub":"データを維持","kind":"storage","c":0,"r":1}],"edges":[{"from":"ec2","to":"cw","label":"復旧アクション","both":true},{"from":"ec2","to":"ebs"}]}},{"id":"d2-29","domain":2,"topic":"Route 53","type":"single","stem":"ある企業は、オンプレミスのデータセンターで稼働している Web アプリケーションを、AWS の Application Load Balancer の背後にある環境へ移行しています。DNS は Amazon Route 53 のパブリックホストゾーンで管理しており、www.example.com は現在、オンプレミスの IP アドレスを指す A レコードです。この企業は、まず全体の 5% のトラフィックだけを AWS に送り、問題がなければ割合を段階的に増やしたいと考えています。問題が見つかった場合は、すぐにすべてのトラフィックをオンプレミスに戻す必要があります。ソリューションアーキテクトは、アプリケーションの変更を最小限に抑えて、この要件を満たす必要があります。これらの要件を満たすソリューションはどれですか。","choices":["オンプレミスと ALB のレコードにレイテンシーベースルーティングを設定する。AWS 側のレイテンシーが低いクライアントが AWS に流れるようにする。","オンプレミスをプライマリ、ALB をセカンダリとするフェイルオーバールーティングを設定する。AWS に流したい割合に応じてヘルスチェックの結果を調整する。","同じ名前で加重ルーティングのレコードを 2 つ作成する。オンプレミスの重みを 95、ALB へのエイリアスレコードの重みを 5 にし、オンプレミス側の TTL を短くする。割合は段階的に重みを変更する。","オンプレミスと ALB のレコードに位置情報ルーティングを設定する。トラフィックの一部が届く地域を AWS 向けに指定する。"],"answer":[2],"why":["レイテンシーベースは、クライアントに近い（応答が速い）リージョンへ振り分ける方式で、割合を指定できない。オンプレミスはリージョンでもないため、5% という比率の制御ができない。","フェイルオーバーは、プライマリが異常なときだけセカンダリに切り替える方式で、平常時に一部だけを流すことはできない。割合を調整するためにヘルスチェックを意図的に操作するのは不適切。","加重ルーティングは、レコードごとの重みの比率でトラフィックを分けられる。重みを変えるだけで割合を段階的に増やせ、重みを 0 にすれば即座にオンプレミスだけに戻せる。TTL を短くしておくと切り替えが早く反映される。","位置情報ルーティングは、クライアントの場所で振り分ける方式で、割合を指定できない。特定地域のユーザーは全員が AWS に流れ、段階的な移行にならない。"],"explain":"「5% だけ送る」「段階的に増やす」「問題があれば即座に戻す」は、割合で振り分ける加重ルーティングの用途。重みはレコード間の相対比で、重みを 0 にするとそのレコードにはトラフィックが流れない。DNS キャッシュのため切り替えには TTL 分の遅れがあるので、移行前に TTL を短くしておく。フェイルオーバー、レイテンシー、位置情報は割合の制御には使えない。","point":"割合を指定してトラフィックを分けるのは加重ルーティング。段階的な移行やブルー/グリーンの切り替えに使う。重み 0 で即時に切り戻せる。","diagram":{"caption":"正解の構成: 加重ルーティングで 5% だけ AWS に流す","cols":3,"rows":2,"groups":[],"nodes":[{"id":"user","label":"ユーザー","sub":"www.example.com","kind":"client","c":0,"r":0},{"id":"r53","label":"Route 53","sub":"加重ルーティング","kind":"network","c":1,"r":0},{"id":"alb","label":"ALB","sub":"AWS の新環境","kind":"network","c":2,"r":0},{"id":"onprem","label":"オンプレミス","sub":"現行の環境","kind":"onprem","c":2,"r":1}],"edges":[{"from":"user","to":"r53"},{"from":"r53","to":"alb","label":"重み 5"},{"from":"r53","to":"onprem","label":"重み 95"}]}},{"id":"d2-30","domain":2,"topic":"DynamoDB","type":"single","stem":"ある企業は、注文データを Amazon DynamoDB テーブルに保存しています。先日、アプリケーションのバグにより、ある時間帯に多数の項目が誤って上書きおよび削除されました。この企業は、今後同様の問題が発生した場合に、バグが発生する直前の任意の時点の状態までデータを戻せるようにしたいと考えています。テーブルの読み書きのパフォーマンスに影響を与えず、運用上のオーバーヘッドを最小限に抑える必要があります。これらの要件を満たすソリューションはどれですか。","choices":["別のリージョンにレプリカを持つグローバルテーブルを構成する。問題が発生したら、レプリカからデータを戻す。","ポイントインタイムリカバリ（PITR）を有効にする。問題が発生したら、直前の時点を指定して新しいテーブルに復元する。","1 時間ごとに AWS Lambda 関数でテーブルの全項目を Amazon S3 に書き出す。問題が発生したら、直近のファイルからデータを読み込み直す。","DynamoDB Streams を有効にし、変更内容を Amazon S3 に保存する。問題が発生したら、保存した変更を手動でさかのぼって適用する。"],"answer":[1],"why":["グローバルテーブルは、更新も削除もすべてのレプリカに複製される。誤った上書きや削除も他のリージョンに伝わり、データを戻す手段にならない。","PITR を有効にすると、過去 35 日以内の任意の時点（秒単位）に復元できる。バックアップはテーブルのパフォーマンスに影響せず、復元は新しいテーブルに対して行われる。","1 時間ごとの書き出しでは、復元できるのは書き出した時点だけで、任意の時点には戻せない。全項目のスキャンは読み取り容量を消費し、Lambda の作り込みと保守も必要になる。","変更履歴を保存しても、特定の時点の状態に戻すには、変更を順に適用し直す独自の仕組みが必要になる。運用負荷が大きく、確実性も低い。"],"explain":"「バグ発生直前の任意の時点に戻す」「パフォーマンスに影響なし」「運用上のオーバーヘッド最小」には、DynamoDB のポイントインタイムリカバリを選ぶ。有効にすると継続的にバックアップされ、過去 35 日以内の任意の時点を指定して新しいテーブルに復元できる。復元後は、アプリケーションの向き先を切り替えるか、必要な項目だけを元のテーブルに戻す。PITR はテーブルごとに明示的な有効化が必要。","point":"DynamoDB の誤操作への備えは PITR（35 日・秒単位）。複製（グローバルテーブル）は誤った更新や削除もコピーするため、バックアップの代わりにならない。","diagram":null},{"id":"d3-01","domain":3,"topic":"S3","type":"multi","stem":"ある映像制作会社は、世界各地の撮影拠点から、1 ファイルあたり数 GB〜数十 GB の動画素材を東京リージョンの Amazon S3 バケットにアップロードしています。東京から遠い拠点ではアップロードに長い時間がかかり、途中で通信が切断されると最初から送り直しになるため、編集作業が遅れています。この企業は、アップロード先のバケットを変更せずに、遠隔拠点からのアップロード時間を短縮し、通信が切断されたときの再送量を減らすことを求めています。これらの要件を満たす手順の組み合わせはどれですか。","choices":["東京リージョンのバケットから、各拠点に近いリージョンのバケットへの S3 クロスリージョンレプリケーションを設定する。","バケットで S3 Transfer Acceleration を有効にする。各拠点のアップロード先をバケットのアクセラレーションエンドポイントに変更する。","バケットをオリジンとする Amazon CloudFront ディストリビューションを作成する。キャッシュポリシーで TTL を長く設定する。","マルチパートアップロードを使用し、ファイルを複数のパートに分割して並列にアップロードする。失敗したパートだけを再送する。","アップロード先を S3 Express One Zone のディレクトリバケットに変更する。低レイテンシーのストレージクラスで書き込み時間を短縮する。"],"answer":[1,3],"why":["レプリケーションは、オブジェクトが東京のバケットに書き込まれた後に別のバケットへコピーする仕組みであり、拠点から東京へのアップロード自体は速くならない。","Transfer Acceleration は最寄りのエッジロケーションでデータを受け取り、AWS のバックボーンネットワークを通してバケットまで転送する。遠距離のインターネット区間が短くなるため、アップロードが速くなる。","CloudFront のキャッシュはダウンロードを速くするための仕組みで、アップロードされるデータはキャッシュの対象にならない。TTL を長くしてもアップロード時間は変わらない。","マルチパートアップロードではパートを並列に送れるためスループットが上がる。通信が切断されても失敗したパートだけを再送すればよく、ファイル全体を送り直す必要がない。","S3 Express One Zone は同じ AZ 内のコンピューティングから低レイテンシーでアクセスするためのもので、遠隔地からの転送を速くする仕組みではない。アップロード先のバケットも変わってしまう。"],"explain":"「遠隔拠点からのアップロード時間を短縮」には Transfer Acceleration、「通信が切断されたときの再送量を減らす」にはマルチパートアップロードが対応する。Transfer Acceleration はエッジロケーションから AWS のネットワークを使って転送し、マルチパートアップロードはパートを並列に送って失敗したパートだけを再送できる。2 つは併用でき、大きなファイルを遠距離から送る場合の定番の組み合わせである。CloudFront のキャッシュやレプリケーションは、アップロードの速さには効かない。","point":"遠くから S3 へ速く送るなら Transfer Acceleration。大きなファイルは並列に送れて失敗時は部分だけ再送できるマルチパートアップロード。","diagram":{"caption":"正解の構成: エッジ経由で転送し、パートを並列にアップロードする","cols":3,"rows":1,"groups":[{"label":"東京リージョン","kind":"region","c":2,"r":0,"w":1,"h":1}],"nodes":[{"id":"site","label":"撮影拠点","sub":"数十 GB の動画","kind":"client","c":0,"r":0},{"id":"edge","label":"エッジ","sub":"エッジロケーション","kind":"network","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"パートを結合","kind":"storage","c":2,"r":0}],"edges":[{"from":"site","to":"edge","label":"パートを並列に"},{"from":"edge","to":"s3","label":"AWS 内部を転送"}]}},{"id":"d3-02","domain":3,"topic":"EBS","type":"single","stem":"ある企業は、Amazon EC2 インスタンスでログ集計基盤を運用しており、データ用のストレージを選定しています。データ量は数十 TiB で、処理は大きなブロック単位のシーケンシャルな読み書きがほとんどを占め、ランダムアクセスはほとんどありません。データは毎日読み書きされ、インスタンスを停止して再起動した後も保持される必要があります。このストレージはブートボリュームとしては使用しません。最も費用対効果の高い方法で高いスループットを得られるソリューションはどれですか。","choices":["汎用 SSD（gp3）ボリュームを作成してインスタンスにアタッチする。スループットを必要な値まで追加でプロビジョニングする。","Cold HDD（sc1）ボリュームを作成してインスタンスにアタッチする。大きなブロックサイズでシーケンシャルに読み書きする。","スループット最適化 HDD（st1）ボリュームを作成してインスタンスにアタッチする。大きなブロックサイズでシーケンシャルに読み書きする。","HDD のインスタンスストアを備えたインスタンスタイプに変更する。複数のインスタンスストアボリュームを RAID 0 で束ねて使用する。"],"answer":[2],"why":["gp3 でもスループットを追加でプロビジョニングできるが、SSD のため容量あたりの料金が HDD より高い。数十 TiB をシーケンシャルに処理する用途では st1 の方が費用対効果が高い。","sc1 は容量あたりの料金が最も安いが、アクセス頻度の低いデータ向けで、容量あたりのスループットも st1 より低い。毎日大量に読み書きする処理には向かない。","st1 は大きなシーケンシャル I/O で高いスループットを出すよう設計された低コストの HDD ボリュームで、ログ処理やビッグデータ、データウェアハウスに向く。ブートボリュームに使えない点も要件と矛盾しない。","インスタンスストアはインスタンスを停止・終了するとデータが消える一時ストレージであり、停止後もデータを保持するという要件を満たさない。"],"explain":"決め手は「大きなブロックのシーケンシャルな読み書き」「数十 TiB」「毎日読み書き」「最も費用対効果の高い」である。スループット重視で容量の大きいワークロードには HDD 系のボリュームが安く、そのうち頻繁にアクセスするものは st1、アクセス頻度の低いものは sc1 を選ぶ。SSD 系の gp3 や io2 は、小さなランダム I/O や低レイテンシーが必要な場合に向く。データを保持する必要があるため、インスタンスストアは候補から外れる。","point":"シーケンシャル・大容量・頻繁なアクセスは st1、めったに読まないなら sc1。ランダム I/O やブートボリュームは SSD（gp3 / io2）。","diagram":null},{"id":"d3-03","domain":3,"topic":"EFS・FSx","type":"single","stem":"ある研究機関は、数百 TB のゲノム解析用データセットを Amazon S3 に保存しています。解析は Linux の Amazon EC2 インスタンス数百台で並列に実行され、各インスタンスは同じデータセットを POSIX 互換のファイルシステムとして、サブミリ秒のレイテンシーと高いスループットで読み込む必要があります。解析結果は最終的に S3 に保存する必要があります。ソリューションアーキテクトは、S3 との間でデータをコピーしたり書き戻したりする仕組みを独自に構築せずに、これらの要件を満たす必要があります。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["Amazon FSx for Lustre ファイルシステムを作成し、S3 バケットとのデータリポジトリの関連付けを設定する。各インスタンスからファイルシステムをマウントする。","Amazon EFS ファイルシステムを作成し、AWS DataSync で S3 からデータをコピーする。解析結果は別の DataSync タスクで S3 に転送する。","Amazon FSx for Windows File Server ファイルシステムを作成し、S3 のデータをコピーする。各インスタンスから SMB でファイル共有に接続する。","各インスタンスに io2 Block Express ボリュームをアタッチする。起動時に S3 からデータをコピーし、解析結果は終了前に S3 にアップロードする。"],"answer":[0],"why":["FSx for Lustre は HPC や機械学習向けの並列ファイルシステムで、サブミリ秒のレイテンシーと高いスループットを出せる。データリポジトリの関連付けにより、S3 のオブジェクトをファイルとして読み込み、変更を S3 に書き戻せる。","EFS でも複数のインスタンスからファイルを共有できるが、S3 からのコピーと結果の書き戻しを DataSync のタスクで別に構築・運用する必要があり、運用効率で劣る。","FSx for Windows File Server は SMB で Windows のワークロードに共有ストレージを提供するもので、Linux の HPC クラスター向けではない。S3 とのコピーも別に作り込む必要がある。","EBS ボリュームはインスタンスごとにアタッチするため、同じデータセットを数百台で共有できない。台数分のコピーと書き戻しの仕組みが必要になり、起動にも時間がかかる。"],"explain":"決め手は「数百台で並列」「サブミリ秒・高スループット」「S3 のデータセット」「コピーや書き戻しの仕組みを独自に構築しない」である。FSx for Lustre は HPC 向けの並列ファイルシステムで、S3 バケットとのデータリポジトリの関連付けを設定すると、S3 のオブジェクトを初回アクセス時に読み込み、ファイルの変更を S3 にエクスポートできる。EFS は汎用の共有ファイルシステム、FSx for Windows File Server は Windows 向け（SMB）であり、HPC の性能と S3 との連携を少ない運用で両立できるのは FSx for Lustre である。","point":"HPC・機械学習で S3 のデータを高速なファイルシステムとして使うなら FSx for Lustre（S3 とデータリポジトリの関連付け）。","diagram":{"caption":"正解の構成: FSx for Lustre を S3 と関連付けて並列に読み込む","cols":3,"rows":1,"groups":[{"label":"VPC","kind":"vpc","c":0,"r":0,"w":2,"h":1}],"nodes":[{"id":"ec2","label":"EC2 × 数百台","sub":"並列で解析","kind":"compute","c":0,"r":0},{"id":"fsx","label":"FSx for Lustre","sub":"並列ファイルシステム","kind":"storage","c":1,"r":0},{"id":"s3","label":"S3 バケット","sub":"データセット・結果","kind":"storage","c":2,"r":0}],"edges":[{"from":"ec2","to":"fsx","label":"マウント"},{"from":"fsx","to":"s3","label":"読み込み・出力","both":true}]}},{"id":"d3-04","domain":3,"topic":"ストレージ移行","type":"single","stem":"ある設計事務所は、オンプレミスの NAS（NFS）に保存している約 50 TB の CAD ファイルを Amazon EFS に移行する計画を立てています。移行期間中もオンプレミスでファイルの更新が続くため、初回の全量転送の後は、毎晩変更分だけを EFS に同期する必要があります。オンプレミスと AWS の間には AWS Direct Connect 接続がすでにあります。この企業は、転送をできるだけ高速にし、データの整合性検証やスケジュール実行の仕組みを独自に構築しないことを求めています。最も運用効率の高い方法でこれらの要件を満たすソリューションはどれですか。","choices":["EFS をマウントした Amazon EC2 インスタンスを起動する。オンプレミスのサーバーから EC2 インスタンスに対して rsync を毎晩 cron で実行する。","オンプレミスに AWS Storage Gateway の S3 ファイルゲートウェイをデプロイする。NAS のファイルを毎晩ゲートウェイのファイル共有にコピーする。","AWS Transfer Family で EFS をストレージとする SFTP サーバーを作成する。変更されたファイルをスクリプトで検出し、毎晩 SFTP でアップロードする。","オンプレミスに AWS DataSync エージェントをデプロイする。NFS から EFS へ転送するタスクを作成し、毎晩実行するようにスケジュールを設定する。"],"answer":[3],"why":["rsync でも差分転送はできるが、並列化、整合性検証、失敗時の再実行、監視を独自に作り込む必要がある。単一のプロセスでは回線の帯域も使い切りにくい。","S3 ファイルゲートウェイはファイルを S3 のオブジェクトとして保存するもので、移行先の EFS にはデータが入らない。","Transfer Family は EFS をストレージにできるが、SFTP でファイルを受け渡す仕組みであり、差分の検出や整合性検証、スケジュール実行はスクリプト側で作り込む必要がある。","DataSync はエージェントがオンプレミスの NFS を読み取り、並列化した転送で EFS へ書き込む。変更分だけの転送、転送後の整合性検証、スケジュール実行が組み込まれており、Direct Connect 経由でも使える。"],"explain":"決め手は「NFS から EFS へ」「毎晩変更分だけ同期」「転送を高速に」「整合性検証やスケジュールを独自に構築しない」である。DataSync はオンプレミスのファイルストレージと AWS のストレージサービス（S3・EFS・FSx）の間でデータを転送するマネージドサービスで、オンプレミス側にはエージェントを置く。転送の並列化、差分転送、整合性検証、スケジュール実行を備えるため、初回の移行と移行期間中の同期の両方に向く。","point":"オンプレミスのファイルを S3・EFS・FSx へ速く移す
